<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="../icons/icon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#6A2C91">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宏观背诵 · 记忆卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f7f0;
            color: #1e3a2a;
            padding: 20px;
        }
        .app-header {
            max-width: 1200px; margin: 0 auto 20px auto;
            background: #d9edd9; padding: 18px 28px; border-radius: 18px;
            box-shadow: 0 4px 12px rgba(60, 110, 60, 0.12);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px;
        }
        .app-header h1 { font-size: 24px; font-weight: 600; color: #1e4a2a; letter-spacing: 0.5px; }
        .app-header .stats {
            display: flex; gap: 20px; font-size: 14px;
            background: #c4e0c4; padding: 6px 18px; border-radius: 40px;
        }
        .app-header .stats span { font-weight: 500; }
        .app-header .stats .num { color: #1f6b3a; font-weight: 700; }
        .filter-bar {
            max-width: 1200px; margin: 0 auto 20px auto;
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            background: #e6f3e6; padding: 12px 20px; border-radius: 14px;
            transition: opacity 0.3s;
        }
        .filter-bar.disabled { opacity: 0.5; pointer-events: none; }
        .filter-bar label { font-size: 14px; font-weight: 500; color: #1f4a2a; }
        .filter-bar select, .filter-bar input {
            padding: 6px 14px; border-radius: 30px; border: 1px solid #b3d9b3;
            background: #fafffa; font-size: 14px; color: #1e3a2a; outline: none;
        }
        .filter-bar input:focus {
            border-color: #6a9e6a; box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.2);
        }
        /* 26/09/18：筛选下拉框点击时显示光圈，选中某一项后由脚本自动收起；搜索框光圈保留 */
        .filter-bar select:focus {
            border-color: #6a9e6a; box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.2);
        }
        .filter-bar select optgroup { font-style: normal; font-weight: 600; }
        .filter-bar .btn-clear-filter {
            background: #cfe2cf; border: none; padding: 6px 18px; border-radius: 30px;
            font-size: 13px; cursor: pointer; color: #1e4a2a; font-weight: 500;
            transition: background 0.2s;
        }
        @media (hover: hover) and (pointer: fine) {
            .filter-bar .btn-clear-filter:hover { background: #b8d4b8; }
        }
        .filter-bar .btn-random {
            background: #d4c49a; border: none; padding: 6px 22px; border-radius: 30px;
            font-size: 14px; cursor: pointer; color: #3f3a1a; font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        @media (hover: hover) and (pointer: fine) {
            .filter-bar .btn-random:hover { background: #c9b888; transform: scale(1.02); }
        }
        .filter-bar .btn-random:active { transform: scale(0.96); }
        .single-mode-bar {
            max-width: 1200px; margin: 0 auto 16px auto;
            background: #f5efe0; border: 2px solid #d4a24e; border-radius: 14px;
            padding: 8px 20px; display: none; align-items: center;
            justify-content: space-between; flex-wrap: wrap; gap: 10px;
            animation: fadeSlide 0.3s ease;
        }
        .single-mode-bar.show { display: flex; }
        .single-mode-bar .mode-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .single-mode-bar .mode-left .btn-nav {
            background: transparent; border: none; font-size: 22px; cursor: pointer;
            padding: 2px 10px; border-radius: 8px; color: #7a5a2a;
            transition: background 0.15s, transform 0.1s; line-height: 1;
        }
        @media (hover: hover) and (pointer: fine) {
            .single-mode-bar .mode-left .btn-nav:hover { background: #e8ddd0; transform: scale(1.05); }
        }
        .single-mode-bar .mode-left .btn-nav:active { transform: scale(0.92); }
        .single-mode-bar .mode-left .btn-nav.disabled { opacity: 0.35; pointer-events: none; }
        .single-mode-bar .card-id-badge {
            font-size: 15px; font-weight: 600; color: #5a4a2a;
            background: #e8ddd0; padding: 4px 18px; border-radius: 30px; white-space: nowrap;
        }
        .single-mode-bar .mode-hint { font-size: 13px; color: #8a7a5a; margin-left: 4px; }
        .single-mode-bar .btn-exit-single {
            background: transparent; border: none; font-size: 20px; cursor: pointer;
            padding: 2px 10px; border-radius: 8px; color: #8a5a4a;
            transition: background 0.15s, transform 0.1s; line-height: 1;
        }
        @media (hover: hover) and (pointer: fine) {
            .single-mode-bar .btn-exit-single:hover { background: #e8d5d0; transform: scale(1.05); }
        }
        .single-mode-bar .btn-exit-single:active { transform: scale(0.92); }
        .card-grid {
            max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr; gap: 18px;
        }
        .card-grid.single-mode { max-width: 820px; }
        .card-grid.single-mode .card-item {
            box-shadow: 0 8px 32px rgba(60, 100, 60, 0.18);
            border-left-width: 8px;
        }
        .card-item {
            background: #ffffff; border-radius: 18px;
            box-shadow: 0 4px 14px rgba(60, 100, 60, 0.08);
            border-left: 6px solid #8fbe8f;
            transition: box-shadow 0.25s, transform 0.15s, border-color 0.3s;
            overflow: hidden; position: relative;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-item:hover { box-shadow: 0 8px 24px rgba(50, 100, 50, 0.13); }
        }
        .card-item.favorited { border-left-color: #d4a24e; background: #fdfbf6; }
        .card-item.favorited .toggle-hint { color: #bd9333; opacity: 0.9; }
        .card-item.favorited .card-header .label .qid { color: #8a6a1a; }
        .card-item.favorited .card-question { color: #2b2b2b; }
        .card-item.favorited .card-answer .answer-inner strong { color: #1a1a1a; }
        .card-item.favorited .card-answer .answer-inner p.formula { color: #2b2b2b; background: #f6eddd; }
        .card-item.favorited .card-answer .answer-inner .img-placeholder { background: #efe4c8; color: #5a4a1a; }
        .card-item.favorited .card-header .label .tag { background: #f2e8ce; color: #5a4a1a; }
        .card-item.favorited .card-answer .answer-inner { background: #faf6ea; color: #2b2b2b; }
        .card-item.favorited .card-question.editable { background: #fdfaf1; border-color: #e8d9b0; }
        .card-item.favorited .card-answer.editable { background: #fdfaf1; border-color: #e8d9b0; }
        .card-item.favorited .card-note-area .note-editor { background: #fdfaf1; border-color: #e8d9b0; }
        .card-item.favorited .card-note-area .note-editor:focus { border-color: #d4a24e; box-shadow: 0 0 0 3px rgba(212, 162, 78, 0.16); }
        .card-item.favorited .card-note-area .note-editor img.selected { border-color: #d4a24e; box-shadow: 0 0 0 3px rgba(212, 162, 78, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12); }
        .card-item.favorited .card-note-area .note-editor .note-placeholder { color: #b8a478; }
        .card-item.favorited .card-note-area .img-resize-control { background: #f8f1de; border-color: #e8d9b0; color: #6a5620; }
        .card-item.favorited .card-note-area .img-resize-control input[type="range"] { accent-color: #d4a24e; }
        .card-item.favorited .card-note-area .img-resize-control .btn-reset-size { background: #f0e6cc; color: #5a4a1a; }
        .card-item.favorited .card-note-area .note-actions button { background: #f1e7cd; color: #5a4a1a; }
        .card-item.favorited .card-note-area .note-actions .btn-insert-img { background: #ece1c4; color: #5a4a1a; }
        .card-item.favorited .card-note-area .note-actions .note-save { background: #e6d5a2; color: #4a3a0a; }
        .card-item.favorited .card-note-area .note-actions .note-clear { background: #ecded6; color: #6a4a3a; }
        .card-item.favorited .card-note-area .note-actions .note-size-hint { color: #a8926a; }
        @media (hover: hover) and (pointer: fine) {
            .card-item.favorited .card-actions button:hover { background: #f5ecd8; }
            .card-item.favorited .card-note-area .note-actions button:hover { background: #e8dbb8; }
            .card-item.favorited .card-note-area .note-actions .btn-insert-img:hover { background: #e2d5b0; }
            .card-item.favorited .card-note-area .note-actions .note-save:hover { background: #dcc78e; }
            .card-item.favorited .card-note-area .note-actions .note-clear:hover { background: #e2d0c6; }
            .card-item.favorited .card-note-area .img-resize-control .btn-reset-size:hover { background: #e8dbb8; }
        }
        .card-item.highlight {
            border-left-color: #e67e22;
            box-shadow: 0 0 0 3px #e67e22, 0 8px 28px rgba(230, 126, 34, 0.25);
            transform: scale(1.005);
        }
        .card-header {
            padding: 16px 22px 8px 22px;
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 12px; flex-wrap: wrap;
        }
        .card-header .label { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .card-header .label .tag {
            background: #dcebd9; padding: 2px 14px; border-radius: 40px;
            font-size: 12px; font-weight: 600; color: #1a4a2a; white-space: nowrap;
        }
        .card-header .label .qid { font-weight: 600; font-size: 15px; color: #1f5a2f; }
        .card-header .label .has-img {
            background: #d9c8b0; color: #5a3f1a; padding: 0 12px; border-radius: 40px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
        }
        .card-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .card-actions button {
            background: transparent; border: none; font-size: 20px; cursor: pointer;
            padding: 4px 6px; border-radius: 10px;
            transition: background 0.15s, transform 0.1s; line-height: 1; color: #3f6a3f;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-actions button:hover { background: #e6f0e6; transform: scale(1.05); }
        }
        .card-actions .btn-fav { color: #b8a06a; }
        .card-actions .btn-fav.active { color: #d4a24e; }
        .card-actions .btn-note { color: #4f7a4f; }
        .card-actions .btn-note.active { color: #2b6b2b; }
        .card-actions .btn-edit { color: #4f6a8f; }
        .card-actions .btn-edit.is-editing { color: #2b6b2b; }
        .card-actions .btn-save-edit { color: #2b7a2b; font-weight: 700; }
        .card-actions .btn-cancel-edit { color: #8a4a4a; }
        .card-actions .btn-edit-group { display: flex; gap: 4px; align-items: center; }
        .card-actions .btn-edit-group .btn-edit { font-size: 18px; }
        .card-actions .btn-edit-group .btn-save-edit,
        .card-actions .btn-edit-group .btn-cancel-edit { font-size: 18px; }
        .card-question {
            padding: 6px 22px 12px 22px; font-size: 15.5px; line-height: 1.7;
            color: #1c3322; cursor: pointer; user-select: none; position: relative;
        }
        .card-question .q-text { display: inline; white-space: pre-wrap; }
        .card-question .q-text .math { font-family: 'Times New Roman', serif; font-style: italic; }
        .card-question .toggle-hint {
            font-size: 13px; color: #5f8a5f; margin-left: 10px; font-weight: 400;
            opacity: 0.7; white-space: nowrap;
        }
        .card-question.editable {
            cursor: text; user-select: text; border: 2px dashed #6a9e9e;
            border-radius: 10px; padding: 10px 18px; background: #fafffe;
        }
        .card-question.editable:focus {
            border-color: #2b6b6b; outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-answer {
            padding: 0 22px 6px 22px; display: none; animation: fadeSlide 0.3s ease;
        }
        .card-answer.open { display: block; }
        .card-answer .answer-inner {
            background: #f3faf3; padding: 18px 22px; border-radius: 14px;
            font-size: 14.8px; line-height: 1.75; color: #1a3322; word-break: break-word;
        }
        .card-answer .answer-inner p {
            text-indent: 2em; margin: 0 0 0.2em 0; padding: 0;
            line-height: 1.75; white-space: pre-wrap; word-break: break-word;
        }
        .card-answer .answer-inner p:last-child { margin-bottom: 0; }
        .card-answer .answer-inner .math { font-family: 'Times New Roman', serif; font-style: italic; }
        .card-answer .answer-inner .img-placeholder {
            display: inline-block; background: #dce8dc; padding: 4px 16px;
            border-radius: 40px; font-size: 13px; color: #2a5a2a; margin: 6px 0; font-weight: 500;
        }
        .card-answer.editable {
            cursor: text; user-select: text; border: 2px dashed #6a9e9e;
            border-radius: 10px; padding: 8px 16px; background: #fafffe;
        }
        .card-answer.editable .answer-inner { background: transparent; padding: 4px 6px; }
        .card-answer.editable .answer-inner p {
            text-indent: 2em; margin: 0 0 0.2em 0; padding: 0;
            white-space: pre-wrap; word-break: break-word;
        }
        .card-answer.editable .answer-inner p:last-child { margin-bottom: 0; }
        .card-answer.editable:focus {
            border-color: #2b6b6b; outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-note-area { padding: 0 22px 18px 22px; display: none; animation: fadeSlide 0.3s ease; }
        .card-note-area.open { display: block; }
        .card-note-area .note-editor {
            background: #f8fcf8; border: 1px solid #c2ddc2; border-radius: 14px;
            padding: 12px 16px; min-height: 80px; max-height: 360px; overflow-y: auto;
            font-size: 14px; line-height: 1.7; color: #1c3322; outline: none;
            transition: border 0.2s, box-shadow 0.2s; word-break: break-word; position: relative;
        }
        .card-note-area .note-editor:focus {
            border-color: #6a9e6a; box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.15);
        }
        .card-note-area .note-editor img {
            max-width: 100%; max-height: 300px; border-radius: 10px; margin: 6px 0;
            display: block; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background: #f0f5f0; border: 2px solid transparent;
            transition: border 0.2s, box-shadow 0.2s; cursor: pointer;
        }
        .card-note-area .note-editor img.selected {
            border-color: #4f8a4f;
            box-shadow: 0 0 0 3px rgba(79, 138, 79, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        .card-note-area .note-editor .note-placeholder { color: #8aaa8a; font-style: italic; }
        .card-note-area .img-resize-control {
            display: none; align-items: center; gap: 12px; margin-top: 8px;
            padding: 6px 14px; background: #edf5ed; border-radius: 30px;
            border: 1px solid #c2ddc2; font-size: 13px; color: #2a5a2a; flex-wrap: wrap;
        }
        .card-note-area .img-resize-control.show { display: flex; }
        .card-note-area .img-resize-control input[type="range"] {
            flex: 1; min-width: 80px; accent-color: #4f8a4f; height: 4px; cursor: pointer;
        }
        .card-note-area .img-resize-control .size-val {
            font-weight: 600; min-width: 44px; text-align: center;
        }
        .card-note-area .img-resize-control .btn-reset-size {
            background: #dcebd9; border: none; padding: 2px 14px; border-radius: 30px;
            font-size: 12px; cursor: pointer; color: #1e4a2a; transition: background 0.2s;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .img-resize-control .btn-reset-size:hover { background: #c2ddc2; }
        }
        .card-note-area .note-actions {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center;
        }
        .card-note-area .note-actions button {
            background: #dcebd9; border: none; padding: 4px 18px; border-radius: 30px;
            font-size: 13px; cursor: pointer; color: #1e4a2a; font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions button:hover { background: #c2ddc2; }
        }
        .card-note-area .note-actions button:active { transform: scale(0.96); }
        .card-note-area .note-actions .btn-insert-img { background: #d4d9c4; color: #2f4a2f; }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions .btn-insert-img:hover { background: #c4cdb0; }
        }
        .card-note-area .note-actions .note-save { background: #a8c8a8; color: #1a3a1a; }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions .note-save:hover { background: #94b894; }
        }
        .card-note-area .note-actions .note-clear { background: #e6d6d6; color: #6a3a3a; }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions .note-clear:hover { background: #dcc4c4; }
        }
        .card-note-area .note-actions .note-size-hint {
            font-size: 12px; color: #6f8f6f; margin-left: auto; opacity: 0.7;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(-6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .no-result {
            text-align: center; padding: 50px 20px; color: #4f7a4f;
            font-size: 17px; background: #e6f3e6; border-radius: 24px;
        }
        .footer-note {
            max-width: 1200px; margin: 30px auto 10px auto; text-align: center;
            font-size: 13px; color: #5f7f5f; border-top: 1px solid #cce0cc; padding-top: 18px;
        }
        .footer-note kbd {
            background: #dce8dc; padding: 0 8px; border-radius: 4px; font-size: 12px;
        }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #2a4a2a; color: #f0faf0; padding: 10px 28px; border-radius: 40px;
            font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            z-index: 999; opacity: 0; transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        @media (max-width: 640px) {
            .app-header { flex-direction: column; align-items: stretch; padding: 14px 18px; }
            .app-header h1 { font-size: 20px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .single-mode-bar { flex-direction: column; align-items: stretch; text-align: center; padding: 10px 14px; }
            .single-mode-bar .mode-left { justify-content: center; }
            .card-header { padding: 14px 16px 4px 16px; }
            .card-question { padding: 4px 16px 10px 16px; font-size: 14.5px; }
            .card-answer { padding: 0 16px 6px 16px; }
            .card-answer .answer-inner { padding: 14px 16px; font-size: 14px; }
            .card-note-area { padding: 0 16px 14px 16px; }
            .card-note-area .note-editor { min-height: 60px; max-height: 260px; }
            .card-grid.single-mode { max-width: 100%; }
            .card-note-area .img-resize-control { flex-wrap: wrap; gap: 6px; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #dce8dc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #8fbe8f; border-radius: 10px; }
        @media (hover: hover) and (pointer: fine) {
            ::-webkit-scrollbar-thumb:hover { background: #6f9e6f; }
        }
/* ================= 返回主页按钮 ================= */
.app-header .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.back-home {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 15px 7px 11px;
    border-radius: 30px;
    background: #c4e0c4;
    color: #1e4a2a;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(60, 110, 60, 0.10);
    transition: background .2s, transform .2s, box-shadow .2s;
}
@media (hover: hover) and (pointer: fine) {
    .back-home:hover {
        background: #a8d0a8;
        transform: translateX(-2px);
        box-shadow: 0 4px 12px rgba(60, 110, 60, 0.20);
    }
}
.back-home .arrow {
    font-size: 15px;
    line-height: 1;
    transition: transform .2s;
}
@media (hover: hover) and (pointer: fine) {
    .back-home:hover .arrow {
        transform: translateX(-3px);
    }
}

/* 移动端微调 */
@media (max-width: 640px) {
    .app-header .header-left { gap: 10px; }
    .back-home { padding: 6px 13px 6px 10px; font-size: 12.5px; }
}
    
/* 触摸设备：按下反馈（悬停效果已在支持鼠标的设备上保留） */
.card-actions button:active { background: #d8ead8; transform: scale(0.94); }
.filter-bar .btn-clear-filter:active { background: #b8d4b8; transform: scale(0.96); }
.back-home:active { background: #a8d0a8; transform: translateX(-1px); }
.card-note-area .img-resize-control .btn-reset-size:active { background: #b2d2b2; transform: scale(0.96); }
</style>
</head>

    <div class="app-header">
        <div class="header-left">
    <a href="../index.html" class="back-home" title="返回主页">

                question: 'GDP与GNP',
                answer: `（1）国内生产总值（GDP）是指经济社会（即一国或一地区）在一定时期内运用生产要素所生产的全部最终产品（物品和劳务）的市场价值。
国民生产总值（GNP）是指一国或一地区在国民所拥有的全部生产要素在一定时期内所生产的全部最终产品（物品和劳务）的市场价值。
（2）二者的区别：GDP与GNP这两个统计指标在统计思想上反映了是按国土原则还是国民原则进行统计的区分。GDP按国土原则进行统计，凡是在本国领土上创造的收入，不管是否由本国国民所创造，都被计入国内生产总值。GNP按国民原则进行统计，凡是本国国民收入，不管生产要素是否在国内，都被计入国民生产总值。
（3）GDP指标的优点
① GDP指标对于国家本身经济活动的年度比较是有用的。
② GDP指标也有助于国家之间的横向比较，对于世界经济成长引擎地区的界定及资本的流动方向提供了较为科学的指导。
③ GDP指标为制定国家（或地区）经济发展战略、分析经济运行状况以及政府调控和管理经济提供了重要依据和参考。
④ 对于像中国这样的发展中国家而言，尽管应该重视GDP指标的不足，但是目前的主要问题是发展问题，即提高GDP，只有具备了足够规模的GDP，才有足够的社会财富来进一步考虑社会福利问题。
（4）GDP指标的局限性：
① 由于GDP是用市场价格来评价物品和劳务，所以它几乎未包括所有在市场外进行的活动的价值。
② 未包括环境质量。它不能反映经济增长的方式和为此付出的代价（如雾霾）。
③ 它不能反映社会成本，例如GDP水平很高的地方如果赌博和黄色交易盛行，社会成本较高，但国民收入核算体系并不能反映出来。
④ 它不能反映经济增长的效率、效益和质量。例如高能耗、低效率、粗放式增长方式就反映不出来。
⑤ 它不能反映人们的生活质量，比如不能反映人们在精神上的满足程度；不能反映闲暇给人们带来的享受等。
⑥ 不能衡量社会财富分配情况和社会公正程度。
⑦ GDP的统计有一定的误差。
（5）改善GDP指标的建议
① 提出衡量国家财富新标准。世界银行专家于1995年公布了衡量一个国家或地区财富的新标准。新标准将一个国家的经济产出减去机器折旧和生产过程的自然资源消耗，计算出一个国家的财产净值。新标准把经济增长、社会发展和环境保护融为一体，是一个综合性、能比较全面地衡量一个国家财富状况的总量指标。
② 构建福利型GDP。一些经济学家先后提出了"经济福利尺度"和"纯经济福利"等新概念或指标。"经济福利尺度"和"纯经济福利"内容是GDP统计还应加上闲暇和地下经济，或劳务类别和内容。
③ 建立绿色GDP的考核指标。以GDP作为核算国民经济活动的核心指标具有一定的局限性，如它不能反映经济增长方式付出的代价等。正因为GDP指标有这些局限性，在关于GDP的争论中，引入绿色GDP的新概念。世界银行1997年开始利用绿色GDP国民经济核算体系来衡量一国（地区）的真实财富。`,
                hasImage: false },

                answer: `（1）拉氏指数是用一篮子固定产品计算的物价指数，加权数固定，不能反映相对价格变动而导致的购买数量的变动，因此倾向于高估生活成本的增加，如CPI。

GDP平减指数 = 名义GDP / 实际GDP
（2）消费价格指数（CPI）又称生活费用价格指数，指通过计算城市居民日常消费的生活用品和劳务的价格水平变动而得到的指数。其计算公式为：一组固定商品按当期价格计算的价值 ÷ 一组固定商品按基期价格计算的价值 × 100%。
（3）PCE平减指数等于名义消费者支出与实际消费者支出的比值。

① GDP折算指数衡量所生产的所有物品与劳务的价格，而CPI只衡量消费者购买的物品与劳务的价格。

② 和GDP平减指数一样：PCE平减指数允许产品篮子随着消费者支出构成变动而变动。
因此PCE平减指数所具有的属性是CPI和GDP平减指数的混合。

① 替代倾向：由于CPI衡量固定的一篮子产品的价格，所以，它没有反映出消费者用相对价格下降的产品进行替代的能力，相对价格变动时，其真实生活费用的上升可能比CPI慢；

③ 无法衡量质量变动：当企业改变他所出售的产品的质量时，并非产品价格的所有变化都是对生活成本变化的反映。
（8）GDP平减指数倾向于低估通胀，原因：
GDP平减指数用一篮子可变产品来计算物价水平的变动，尽管这个指数考虑到了不同的替代，但它没有考虑由于替代可能引起的消费者福利的减少，因此GDP平减指数会倾向于低估生活成本。`,

（3）生产法：生产法是从生产的角度核算GDP，即GDP等于一个国家在一定时期内所新生产的最终产品和服务的市场价值总和。
从理论上讲，按支出法、收入法与生产法计算的GDP在量上是相等的，但实际核算中常有误差，因而要加上一个统计误差项来进行调整，使其达到一致。

                answer: `（1）流动性偏好又称灵活偏好，是指由于货币具有使用上的灵活性，人们宁肯以牺牲利息收入而储存不生息的货币来保持财富的心理倾向。
（2）凯恩斯认为，流动偏好根源于以下三种货币需求动机：
① 交易动机是指个人和企业为了进行正常的交易活动而持有货币的动机。出于交易动机的货币需求量主要决定于收入，收入越高，交易数量越大，从而为应付日常开支所需的货币量就越大。
② 谨慎动机是指为预防意外支出而持有一部分货币的动机，如个人或企业为应付事故、失业、疾病等意外事件而需要事先持有一定数量货币。从全社会来看，这一货币需求量大体上也和收入成正比，是收入的函数。
③ 投机动机是指人们为了抓住有利的购买有价证券的机会而持有一部分货币的动机。投机动机所产生的货币需求量与利率成反比。

                question: '债务-通货紧缩理论',
                answer: `（1）债务-通货紧缩理论是用于解释未预期到的物价下降对收入的抑制作用的理论。该理论指出未预期到的物价下降在债务人与债权人之间再分配财富，使债权人变得更加富有而使债务人变得更加贫穷。
（2）影响：如果债务人和债权人有相同的支出倾向，则未预期到的物价下降不会对国民收入产生影响。但实际上债务人和债权人的支出倾向是不同的，该理论假设债务人的支出倾向高于债权人，那么债务人减少的支出比债权人增加的支出多。因此，未预期到的物价下降的净效应是支出的减少，IS曲线的紧缩性移动以及国民收入的减少。
【提示】债务-通货紧缩理论属于通货紧缩对经济影响的不稳定效应中的未预期到的通货紧缩的影响。通货紧缩对经济的影响：
（1）稳定效应：① P↓ ⇒ M/P↑ ⇒ LM右移 ⇒ Y↑；② 庇古效应：P↓ ⇒ 实际财富↑ ⇒ C↑ ⇒ IS右移 ⇒ Y↑。
（2）不稳定效应：① 未预期到的通货紧缩：债务-通货紧缩理论；② 预期到的通货紧缩：区分实际与名义利率 i = r + Eπ，对IS-LM基本模型进行改写。`,
                hasImage: true },

            { id: 'm2c6', special: '二、IS-LM模型', type: '重要概念', qid: '概念6',
                question: '货币乘数',
                answer: `（1）货币乘数指中央银行创造一单位的基础货币所能增加的货币供应量。
（2）货币乘数的推导：
货币供给 M = C + D，其中C表示通货，D表示活期存款。基础货币 B = C + R，其中R表示准备金。
根据定义，货币乘数为：
m = M/B = (C + D)/(C + R) = (C/D + 1)/(C/D + R/D) = (cr + 1)/(cr + rr)
其中，cr为通货存款比，rr为存款准备金率，m为货币乘数。`,
                hasImage: false },

            { id: 'm2c7', special: '二、IS-LM模型', type: '重要概念', qid: '概念7',
                question: '货币政策工具',
                answer: `（1）货币政策工具是中央银行为达到货币政策目标而采取的手段。这些工具可以被分成两大类：一类影响基础货币，包括公开市场操作和贴现率；另一类影响货币乘数，包括法定准备金率和准备金利率。
（2）改变基础货币
① 公开市场业务是指中央银行在金融市场上公开买卖政府债券以控制货币供给和利率的政策行为。当中央银行从公众手中购买债券时，基础货币增加，从而增加了货币供给。当中央银行向公众出售债券时，基础货币减少，从而减少了货币供给。
② 贴现率是中央银行对商业银行及其他金融机构的贷款或者说放款利率。当中央银行提高贴现率时，银行就会减少向中央银行借款，从而减少投放到市场的基础货币。
（3）改变准备金率
③ 法定存款准备金率是指中央银行要求银行持有的最低准备金率，当准备金率提高时，银行保留的资金增加，可用于发放贷款的资金减少，同时使货币乘数减小，进而降低货币供给量。
④ 准备金利率是中央银行向商业银行缴存的准备金（法定存款准备金和超额存款准备金）所支付的利率。准备金利率越高，商业银行将选择持有的准备金越多。因此，准备金利率的上升会带来准备金率的上升，降低货币乘数和货币供给。
（4）其他工具
① 第一，道义劝告。道义劝告是指中央银行运用自己在金融体系中的特殊地位和威望，通过对银行及其他金融机构的劝告，影响其贷款和投资方向，以达到控制信用的目的。
② 第二，窗口指导。窗口指导指中央银行根据物价变动趋势和金融市场状况，规定商业银行每季度贷款的增减额度，并要求执行。窗口指导虽没有法律约束力，但影响力往往比较大。
③ 第三，信用控制。信用控制主要有消费信用控制、直接信用控制等。
a 消费信用控制是指中央银行对不动产以外的耐用消费品的销售融资进行控制，主要是控制分期付款与抵押贷款的条件。
b 直接信用控制是指中央银行以行政命令或其他方式，直接对金融机构尤其是商业银行的信用活动进行控制。
【提示1】利用货币供给的公式可以知道，经济中货币供给数量是由中央银行、商业银行和公众共同决定，其中中央银行可以直接决定基础货币数量和法定准备金率，商业银行决定超额准备金率，公众决定自己持有通货的数量，也即通货-存款比。
【提示2】公开市场操作是中央银行最经常使用的政策工具，原因：运用这种政策手段有着比用其他手段更多的灵活性。例如在公开市场业务中，中央银行可及时地按照一定的目标来买卖政府债券，从而易于准确地控制基础货币。
【提示3】从理论上说，变动法定准备率是中央银行调整货币供给最简单的办法。然而，中央银行一般不愿轻易使用这一手段。原因：
第一，商业银行向中央银行报告它们的准备金和存款状况时有一个时滞，因此今天变动的法定准备率一般要过一段时间才起作用。
第二，变动法定准备率的作用十分猛烈，一旦法定准备率变动，所有银行的信用就都必须扩张或收缩。如果法定准备率变动频繁，那么会使商业银行和所有金融机构因正常信贷业务受到干扰而感到无所适从。`,
                hasImage: false },

            /* --- 简答/论述题 --- */
            { id: 'm2s1', special: '二、IS-LM模型', type: '简答/论述题', qid: '简答1',
                question: '乘数在经济中发挥作用的前提条件。',
                answer: `（1）乘数效应指经济活动中某一变量的增减所引起的经济总量变化的连锁反应程度。
乘数是指收入的变化与带来这种变化的支出的初始变化之间的比率。例如，政府购买乘数指收入变动（用ΔY表示）对引起这种变动的政府购买支出变动（用ΔG表示）的比率，即 k_G = ΔY/ΔG。
（2）在现实生活中，乘数效应作用的大小要受到一系列条件的限制：
① 社会中过剩生产能力的大小。如果没有过剩生产能力，没有闲置资源，则投资增加及由此造成的消费支出增加，并不会引起生产增加，只会刺激物价水平上升。
② 投资和储蓄决定的相互独立性。要假定它们相互独立，否则，乘数作用要小得多，因为增加投资所引起的对货币资金需求的增加会使利率上升，而利率上升会鼓励储蓄，削弱消费，从而会部分地抵消由于投资增加引起收入增加进而使消费增加的趋势。
③ 货币供给量增加能否适应支出增加的需要。假设货币供给受到限制，则投资和消费支出增加时，货币需求的增加就得不到货币供给相应增加的支持，利率会上升，不但会抑制消费，还会抑制投资，使总需求降低。
④ 增加的收入不能用于购买进口货物，否则GDP的增加会受到限制。
⑤ 政府不能在乘数发挥作用期间同时向社会征税或借款，否则会对经济产生挤出效应。`,
                hasImage: false },

            { id: 'm2s2', special: '二、IS-LM模型', type: '简答/论述题', qid: '简答2',
                question: '【论述语料】简述我国消费不足、投资过剩的原因。',
                answer: `（1）消费不足的原因：
① 城乡居民相对收入增长缓慢。这些年来我国国民收入分配中，国家、企业占比不断上升，而劳动者报酬占比不断下降，使居民购买力增长的收入增幅明显低于GDP增幅。
② 房价、房租等费用大幅上涨，严重挤压了居民消费支出。
③ 限制甚至禁止粮食出口政策，导致我国粮价远远低于国际市场价格，牺牲了农民利益，限制了农民收入的提高，使农村消费能力长期不足。
④ 城乡二元分割体制，拖累了城市化进程，使农村人口被甩在消费市场之外。我国广大农民收入增长缓慢，农村消费市场难以提振。
⑤ 根据生命周期理论，人们会在更长的时间范围内计划他们的生活消费开支，以达到他们在整个生命周期内消费的最佳配置，由于我国社保体制尚不健全，因此居民储蓄意识较强，当前消费水平较低，以保证老年时期也有一定的消费能力。
⑥ 传统观念较强，我国居民普遍储蓄意识较高，造成消费不足，储蓄率高导致投资水平较高。
（2）投资过多的原因：
① 我国过去一直处于贸易顺差状态，获得了大量外汇占款和外汇储备，央行为避免形成严重通货膨胀，将其中的绝大部分用于基建投资和房地产行业，导致我国过去的产能过剩。
② 生产要素价格（土地、劳动力、环境、资本）的长期低估。环境污染价格低估，已经把环境承载力逼到了极其脆弱的地步；劳动力价格低估，导致收入分配失衡扩大；资本价格低估，则意味着居民（储蓄者）向企业（借款人）进行补贴。
③ 在我国的投资过程中有一些非市场的因素在发挥作用，阻碍了市场机制优胜劣汰功能的发挥，包括扭曲要素价格。比如在招商引资过程中，一些地方政府为了拉投资、拉项目，给予一些低价，甚至在劳动力的方面都是给予很多优惠政策。对市场竞争机制的作用产生了一定的影响，导致了投资过多的局面。
④ 企业公平竞争的市场环境建设滞后。由于对以技术、标准、规范等促进产业自主发展的措施研究不够，规范市场公平竞争的规则、环境、秩序建立滞后，对已有的措施监督执行也不到位，导致一些达不到环保，能耗，安全等标准的企业以不公平的方式进行市场竞争，加剧了投资过多的问题。
⑤ 中国过去投资主要是政府主导模式。政府不仅通过税收、土地出让金等获得巨额收入，而且拥有大量具有特殊资源优势的国有企业。近年来形成的地方融资平台债务问题，也是政府不断扩大对经济领域的介入的例证。其结果是，GDP主义日益膨胀，甚至出现"地方政府公司化"的乱象。
【提示】本题答案可以作为论述题语料进行积累。`,
                hasImage: false },

            { id: 'm2s3', special: '二、IS-LM模型', type: '简答/论述题', qid: '简答3',
                question: '简述常规和非常规货币政策的概念，为什么2008年金融危机后各国央行会选择实施非常规货币政策？',
                answer: `（1）常规货币政策是指中央银行通过调节利率来传递其政策立场，调节市场流动性，从而影响宏观经济的货币政策，主要政策工具就是所说的"三大法宝"，即法定准备金率、再贴现率和公开市场业务。
非常规货币政策则是指在没有降息空间或利率的市场传递机制严重受阻的情况下，中央银行通过调整资产负债表的结构或扩张资产负债表规模直接向市场注入流动性的行为，以保证在利率极低的情况下维持市场的流动性。
（2）2008年金融危机后常规的货币政策失效，常规货币政策失效的原因包括：
① 利率刚性问题。传统的货币政策认为利率具有弹性，但实际操作中利率可能缺乏弹性甚至具有刚性。危机后西方发达国家普遍采用低利率政策刺激经济复苏，导致了名义利率无法下降的情况，利率面临刚性约束。
② 面临零利率下限约束。危机的发生使人们意识到零利率下限问题比预期的更加严重。当面临零利率下限问题时，中央银行通过降低利率刺激经济的手段受到制约，如果此时经济面临下行的风险，可能导致实际利率提升进而使经济恶化。此外，若零利率下限与流动性陷阱相互叠加，会加剧经济恶化。
③ 通货紧缩因素。危机后世界主要经济体经济增长凸显疲态，各国经济下行并面临通货紧缩的风险。由于产出缺口为负，物价水平下降速度甚至超过利率的下降速度，使得实际利率难以降低。
正是由于以上原因，在金融危机爆发后，传统货币政策已不足以达到刺激经济复苏的目的，因此，为了使经济平稳有序发展，各国央行纷纷开始采用非常规货币政策，它可以弥补常规货币政策的不足，在利率极低或利率机制受阻的情况下发挥作用。`,
                hasImage: false },

            { id: 'm2s4', special: '二、IS-LM模型', type: '简答/论述题', qid: '简答4',
                question: '简述非常规货币政策的种类及其发生作用的机制，以及存在的问题。非常规货币政策是否意味着流动性陷阱理论是错误的。',
                answer: `（1）非常规货币政策的种类及其作用机制：
① 量化宽松政策指中央银行在隔夜拆借利率为零时，通过购买大规模的金融资产来改变央行资产负债表的结构和规模，以此降低长期利率的一种政策。量化宽松主要包括流动性宽松和信贷宽松。此时中央银行不但购买国债，同时也购买政府机构的其他债券和大量私人抵押贷款支持证券。
货币量化宽松的目的在于直接影响银行、企业和家庭外部融资的成本和可得性。在零利率下限处其作用机制如下：
第一，中央银行大量购买资产，有利于稳定投资市场的预期。由于在利率水平很低情况下，资产价格处在较高的水平之上，大量购买资产能减少投资者抛售债券的情况，从而使得社会的投资水平不至于出现较大的减少，减轻因为萧条对经济而带来的冲击。
第二，通过大量购买资产，有利于刺激国内总需求，其作用机制类似于扩张性的财政政策，政府的扩张性政策稳定经济。
② 前瞻性指引是中央银行通过公开市场操作或其他方式向公众传达对未来利率政策的意图，以这种方式来影响市场预期。在短期利率接近零下限时，央行针对未来货币政策走势与公众沟通，向市场传递央行对宏观经济状况的看法及政策应对机制，影响公众的利率预期，从而影响长期利率，利率承诺就是一种前瞻性指引政策工具。
③ 负利率政策是将存款利率设定在零以下，目的是激励银行贷款和消费者支出，而不是将资金存放在银行中。
④ 信贷政策是政府直接干预信贷市场，提供担保或补贴等类型的贷款，来促进特定行业或领域的投资。
（2）非常规货币政策存在的问题：
① 量化宽松存在的问题：第一，传统的公开市场操作主要是改变短期利率，而量化宽松政策是通过购买金融资产来降低长期利率，而一般长期金融资产供给非常庞大，中央银行增加的需求对均衡利率难以产生较大效果。第二，要推动长期利率变化需要非常大的货币干预，这会导致基础货币和货币供给的大幅增加，为通货膨胀埋下隐患。
② 前瞻性指引存在的问题：前瞻性指引的有效性依赖于市场参与者对中央银行承诺的信任度，如果市场对其承诺持怀疑态度，那么这种政策的效果会大打折扣。
③ 负利率政策存在的问题：负利率政策可能导致银行的盈利能力下降，并可能引发金融市场的扭曲，增加金融市场的波动性。
④ 信贷政策存在的问题：信贷政策可能会导致资源配置不当，因为政府的决策可能不符合市场机制下的最佳决策。
（3）非常规的货币政策取得了较好的效果并非意味着流动性陷阱理论是错误的。因为非常规性货币政策本身与货币政策的作用机制不一样。
流动性陷阱是在常规货币政策下作用的，其本质是人们的预期在起作用。在利率水平很低的情况下，债券价格水平很高，人们预期债券价格下降，因此将政府发行的货币全部持有手中，扩张性货币政策无法导致利率进一步下降。而非常规的货币政策正是通过影响人们对债券市场的预期。因此二者作用的条件不一样，不能就此否认流动性陷阱理论是错误的。
【提示】量化宽松与公开市场操作的区别：
第一，量化宽松主要是购买中长期债券，以此来降低中长期利率；公开市场操作主要购买短期债券，目的是降低短期利率。
第二，量化宽松不仅购买政府债券，还购买企业发行的债券；公开市场操作主要是购买政府发行的债券。`,
                hasImage: false },

            { id: 'm2s5', special: '二、IS-LM模型', type: '简答/论述题', qid: '简答5',
                question: '【偏理解分析】请解释金融危机导致产品和服务总需求减少的原因，并说明政策制定者应对金融危机的措施。',
                answer: `（1）金融危机导致产品和服务总需求减少的原因：
当金融危机发生时，通常伴随资产价格的下降（常常发生在投机性泡沫之后），从而银行拥有的借款人抵押资产的价格下降，导致一些高度杠杆化的金融机构破产。接着，这些金融机构的破产导致对整个金融系统的信心下降，后者又导致储户提现。此时金融机构不得不减少放贷和变卖部分资产来增加现金储备以应对储户提现。此时，当人们无法获得消费信贷和企业无法获得新投资项目所需的融资时，产品和服务的需求出现下降。产品和服务需求的下降使得IS曲线左移，经济的产出减少。总需求减少并导致了衰退，衰退又恶化了破产增加和信心下降的问题，由此形成了一个恶性循环。
（2）应对金融危机的措施
① 由于金融危机导致了产品和服务总需求的收缩，所以，它提高了失业和降低了收入。政策制定者可以通过使用货币政策和财政政策工具扩大总需求，从而减轻这些影响。中央银行可以增加货币供给和降低利率，政府可以增加政府支出和减税。
但是，传统的货币政策和财政政策作用是有限的。中央银行面临零利率约束，即经济可能陷入流动性陷阱。财政政策也是有限的，由于经济衰退自动增加了失业保障津贴的支出和减少了税收收入，如果进一步实施扩张性财政政策，可能给政府债务增加负担和导致市场对政府的债务偿付能力失去信心。
② 中央银行可以作为最后贷款者为处于流动性危机的商业银行提供贷款，并接受该银行的缺乏流动性的资产作为担保物，其目的是遏制商业银行破产问题，恢复公众对银行系统的信心。
③ 政府使用公共资金支持金融系统，包括对直接给予金融机构现金、发放风险贷款或对金融机构进行注资（获得金融机构的部分所有权）。`,
                hasImage: true },

            /* ===================== 三、AD-AS模型 ===================== */
            /* --- 重要概念 --- */
            { id: 'm3c1', special: '三、AD-AS模型', type: '重要概念', qid: '概念1',
                question: '古典总供给曲线与凯恩斯总供给曲线',
                answer: `（1）古典总供给曲线又称为长期总供给曲线。古典总供给理论认为，价格和货币工资具有充分弹性，即二者可以迅速或立即进行调整。在不同的价格水平下，当劳动市场存在超额劳动需求或超额劳动供给时，货币工资就会进行调整，进而实际工资发生调整，实际工资调整到使劳动市场达到均衡的水平。从而，经济的就业水平或产量不随价格水平的变动而变动，而始终处在充分就业状态。
（2）凯恩斯总供给曲线是水平的，因为短期价格和货币工资是刚性的。凯恩斯总供给曲线的基础思想是，作为工资和价格刚性的结果，劳动力市场不能总维持在充分就业状态。由于存在失业，厂商可以在现行工资下获得所需劳动，因而它们的平均生产成本被认为是不随产出水平变化而变化的。所以在现有价格水平上，经济中的厂商愿意供给所需的任何数量的商品。
（3）二者的不同
① 基本假设不同。古典总供给理论认为价格和货币工资具有充分弹性，凯恩斯总供给理论认为价格和工资是刚性的。
② 形状不同。由于工资和价格可以灵活变动，劳动市场总是处于出清状态，因此古典总供给曲线是一条位于充分就业产量水平的垂直线。由于短期工资和价格具有刚性，厂商在现有价格水平，愿意供给所需的任何数量的商品，因此凯恩斯总供给曲线是一条水平线。
③ 政策含义与政策主张不同。
古典理论认为，由于总供给曲线是垂直的，工资和价格可以灵活调整，因此政府的需求管理政策只会导致物价水平的变动，而不影响经济的实际产出，即古典二分法成立，因此政府不应对经济实施干预。当政府实施扩张性的财政或货币政策时，AD曲线右移，其结果是物价水平上升，实际产出不变，始终位于自然产出水平。
凯恩斯认为短期总供给曲线为水平线，政府的干预政策完全有效，政府应该逆经济风向行事，即在经济衰退时，实施扩张性财政和货币政策，在经济过度繁荣时，实施紧缩性财政和货币政策。由于价格刚性，政府的需求管理政策能够有效影响产出，而不影响价格水平。当政府实施扩张性的财政或货币政策时，AD曲线右移，其结果是产出增加，物价水平不变。`,
                hasImage: true },

            /* --- 简答/论述题 --- */
            { id: 'm3s1', special: '三、AD-AS模型', type: '简答/论述题', qid: '简答1',
                question: '【偏理解分析】请分别利用IS-LM模型和M-F模型推导总需求曲线。',
                answer: `（1）总需求曲线表示在满足产品市场的均衡条件和满足货币市场的均衡条件时，价格和国民收入之间的关系。
（2）IS-LM模型推导总需求曲线：当价格由P₁降至P₂时，较低的价格水平增加了实际货币余额，LM曲线右移，导致利率下降和均衡收入水平提高。随着P的变化，LM曲线和IS曲线可以有许多交点，每一个交点都标志着一组特定的Y和r，于是就有许多对P和Y的组合，从而构成一系列点。把这些点连在一起，便得到总需求曲线。
（3）可以根据M-F模型推导总需求曲线。初始状态下，LM*(P₁)与IS*曲线的交点所表示的实际汇率和收入分别为ε₁和Y₁，对应于AD线上的点(P₁,Y₁)。当物价水平由P₁降至P₂时，由于较低的物价水平增加了实际货币余额，LM*曲线向右移动，导致汇率下降和均衡收入水平提高，相应的可推导得出向右下方倾斜的小型开放经济的总需求曲线。
【提示】利用M-F模型推导AD曲线时，M-F模型的纵轴为实际汇率。`,
                hasImage: true },

            { id: 'm3s2', special: '三、AD-AS模型', type: '简答/论述题', qid: '简答2',
                question: '为什么总需求曲线向右下方倾斜？',
                answer: `（1）凯恩斯的利率效应：在名义货币量M保持不变的情况下，价格水平变动会影响实际货币供给M/P。当价格水平下降时，实际货币供给量会增加，如果实际货币需求保持不变，实际货币需求就会小于货币供给，利率水平将会下降。利率的下降会增加投资，从而使均衡收入水平增加。
（2）庇古的财富效应：价格水平的下降，使人们所持有的货币及其他以货币衡量的具有固定价值的资产的实际价值增加，人们会感到更加富裕，从而鼓励他们更多地消费，消费支出的增加意味着产品和服务需求量的增加。
（3）蒙代尔-弗莱明的汇率效应：对于开放经济，一国的价格水平的下降，其利率就会下降。本国利率下降时，国内一些投资者会到国外投资以寻求更高收益，这种资本流出增加了外汇市场的本国货币供给，使本国货币实际汇率下降，本国商品相对于外国商品变得更便宜，这种相对价格的变化增加了外国居民对本国产品的需求，减少了本国居民对外国产品的需求，出口的增加和进口的减少，使净出口的增加，从而使总需求增加。`,
                hasImage: false },

            { id: 'm3s3', special: '三、AD-AS模型', type: '简答/论述题', qid: '简答3',
                question: '【偏理解分析】简述总供给曲线向右上方倾斜的原因。',
                answer: `（1）黏性价格模型：阐述黏性价格对总供给影响的模型。
① 模型假设
a. 第一，市场中一些企业的价格有弹性，另一些企业的价格是黏性的，它们根据预期的经济状况事先确定自己的价格。价格黏性的原因：企业与顾客之间的长期合约；在没有正式协议时，企业也可能保持价格的稳定，以避免频繁的价格变动给自己的长期客户造成困扰；一旦企业印制和分发了它的产品目录或价格单，改变起来会成本高昂。
b. 第二，考虑到需要考察企业如何决定价格，因此还需要企业对它们收取的价格有某种垄断控制。
② 利用黏性价格模型推导右上方倾斜的总供给曲线：
黏性价格模型假设所有企业都有一个取决于整体价格水平P以及总需求水平(Y−Ȳ)的合意价格p，将之写为 p = P + a(Y − Ȳ)。
价格弹性企业（所占企业百分比为1−s）的定价公式：p = P + a(Y − Ȳ)
价格黏性企业（所占企业百分比为s）的定价公式：p = EP + a(EY − EȲ)，式中，E代表一个变量的预期值。假设企业预期产出处于自然率水平，从而(EY − EȲ) = 0。那么，该类企业的定价公式为：p = EP。
加权决定两种企业并存时的价格水平：P = s·EP + (1−s)[P + a(Y − Ȳ)]
经代数整理得总供给曲线的方程式：Y = Ȳ + α(P − EP)，式中 α = s/[a(1−s)]。
③ 黏性价格模型的结论：
第一，当产出大于潜在产出时，价格水平高于预期价格水平，即 P > EP。
第二，预期价格水平上升使总供给曲线向左移动；预期价格水平下降使总供给曲线向右移动。
④ 黏性价格模型和与凯恩斯和古典总供给曲线的关系：
第一，凯恩斯总供给曲线认为价格具有刚性，即黏性价格企业的比例为s = 1，此时总供给曲线的方程为 P = EP，为水平线。
第二，古典总供给曲线认为价格具有充分弹性，即黏性价格企业的比例为s = 0，此时总供给曲线的方程为 Y = Ȳ，为一条位于充分就业产出水平的垂线。
（2）黏性工资模型
① 模型假设：
第一，名义工资W具有黏性，不能随劳动力的供求状况立即调整。
第二，短期内假设劳动力市场失灵，即存在失业，此时就业取决于市场实际工资条件下的劳动需求。
基于以上价格可知，物价水平上涨不会立即影响名义工资，此时实际工资W/P下降，更低的实际工资使企业雇佣更多的劳动力，导致产出增加，从而短期总供给曲线向上倾斜。
② 利用黏性工资模型推导右上方倾斜的总供给曲线：
劳动需求曲线：由于名义工资存在黏性，当价格水平从P₁上升到P₂时，实际工资从W/P₁下降到W/P₂，较低的实际工资使劳动需求量从L₁上升L₂。生产函数：当劳动量从L₁上升到L₂时，产出从Y₁增加到Y₂。总供给曲线概括了价格水平与产出之间的这种关系，价格水平从P₁上升到P₂，产出从Y₁增加到Y₂。
（3）不完全信息模型：阐述经济主体在做出经济决策时，并不能掌握所有相关信息从而影响总供给的模型。
模型假设：① 市场出清，即所有工资和价格具有完全弹性，可以自由调整使供求平衡。② 经济中的每个供给者生产一种产品但消费许多产品。③ 信息不完全，厂商有时无法分辨物价总水平的变动与产品相对价格的变动。
原理：由于在价格上存在不完全信息，因此厂商混淆了价格水平的变动和相对价格的变动，存在价格错觉。如果生产者观察到自己生产的产品的名义价格上升了，即使这纯粹是总体物价水平的上涨，他们也会认为他们的产品对其他产品的相对价格提高了，结果是厂商会增加产量。如果经济社会中所有厂商都有这种错觉，那么价格上升时，经济社会总产出增加。
不完全信息模型中，当实际价格水平超出预期价格水平时，供给者增加其产出，即总供给曲线：Y = Ȳ + α(P − EP)。
【提示】考试时如果简答题同时问到多个模型，回答时答出各个模型的核心观点即可；如果问到其中一个模型则需对模型进行详细叙述。`,
                hasImage: true },

            { id: 'm3s4', special: '三、AD-AS模型', type: '简答/论述题', qid: '简答4',
                question: '【偏理解分析】结合IS-LM模型和AD-AS模型回答货币中性（货币政策的长短期效果）。',
                answer: `（1）货币中性是指货币对实际经济变量不产生影响。古典经济学把变量分为实际变量和名义变量，认为货币只会对名义变量产生影响，而不会对实际变量产生影响。实际上，在长期，货币中性是成立的；但在短期，货币非中性，即货币对实际经济变量会产生影响。
（2）利用IS-LM模型：假设经济最初位于自然产出水平。
① 在短期，价格水平不变，货币供给增加使LM曲线向下移动，均衡点由A点移动到B点，产出从Y₁上升为Y₂，产出超过了自然水平Y*，经济出现繁荣。
② 在长期，由于短期的均衡产出水平超过了长期均衡的产出水平，最终产品和劳务的高需求推动物价水平上涨，从而导致实际货币余额减少，LM曲线左移。价格水平上涨直至经济恢复到初始的位置A点，产出从Y₂减少到Y*。经济又回归到自然率产出水平，但价格水平却提高了。
（3）利用AD-AS模型：假设经济最初位于自然产出水平。
① 在短期，人们无法调整预期，因此短期内总供给曲线不发生移动。此时经济沿着短期总供给曲线从A变动到B，实际价格水平P₂高于预期价格水平EP₂，产出暂时增加到高于自然率水平。因此，短期内货币变动对实际经济变量（如实际产出）产生影响，短期货币是非中性的。
② 在长期，由于B点处实际价格水平P₂高于预期价格水平EP₂，因此，人们预期的价格水平会上升，短期总供给曲线左移。并且，长期内，人们预期的价格水平最终将等于实际的价格水平，因此长期内经济回到新的长期均衡点C，此时P₃ = EP₃，产出回到其自然率水平，即长期货币不对实际经济变量产生影响。长期货币是中性的。
（4）因此，货币供给增加在短期内影响产出，表现为货币非中性，而长期中，货币供给增加不影响产出，只会导致价格上升，货币呈中性。
【提示】短期向长期过渡的传导机制，除公众调整预期以外，也可以从劳动力市场进行分析：
（1）如果短期均衡产出大于长期自然产出意味着经济出现繁荣，劳动力市场紧张，工人要求更高的工资水平，企业生产成本增加，短期总供给曲线左移，直到经济恢复到自然产出水平。
（2）如果短期均衡产出小于长期自然产出，意味着经济出现衰退，失业增加，此时工人愿意接受更低的工资水平，企业生产成本下降，短期总供给曲线右移，直到经济恢复到自然产出水平。`,
                hasImage: true },

            { id: 'm3s5', special: '三、AD-AS模型', type: '简答/论述题', qid: '简答5',
                question: '【偏理解分析】什么是供给冲击？结合AD-AS模型分析说明不利的供给冲击下总需求管理政策和自动调整机制的效果。',
                answer: `（1）供给冲击是使总供给曲线移动的冲击，例如拉动成本与价格上升的不利的冲击会使短期总供给曲线向上移动。
（2）如原材料价格上升等不利供给冲击发生，引起AS曲线由AS₁向上移动到AS₂，经济均衡点从E点移动到E′点，价格水平上升，产出水平下降，此时出现"滞胀"现象，即经济停滞（产出下降）和通货膨胀（物价上升）并存。
（3）总需求管理政策的效果
存在不利的供给冲击时，如果政府充分增加总需求，采取使AD曲线由AD₁移动到AD₂的扩张性货币政策或财政政策，经济就会移动到E*点而不是E′点，价格的上升幅度将和总供给曲线上移的幅度完全一样，经济会继续处在充分就业状态，但此时总需求管理政策会带来价格水平的永久性上升。
（4）自动调整机制的效果
如果保持总需求不变，从长期来看，由于产出和就业低于自然率，所以工人工资下降，短期总供给曲线逐渐右移，最终价格下降到原来的水平时恢复到充分就业的E点。但这个过程的代价是痛苦的衰退。
【提示1】本题等价问法：
（1）为什么发生不利的供给冲击时总需求管理政策无效/陷入两难境地？
（2）为什么中央银行应对需求冲击比应对供给冲击容易？
【提示2】为有效应对不利的总供给冲击，政府应该实施供给管理政策，如实行工资-物价的硬性管制，或以税收作为惩罚或者奖励的手段来限制工资增长，这样能够防止价格和名义工资上涨过快，降低企业生产成本，从而使短期总供给曲线右移。
【提示3】通过以上两道分析题掌握需求冲击（财政或货币政策变动，及其他影响AD曲线的冲击）和供给冲击对经济的长短期影响，经济是如何由短期向长期过渡的，以及对应的传导机制。`,
