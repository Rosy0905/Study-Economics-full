                            const parts = specialVal.split('|');
                            const chap = parts[0];
                            const typ = parts[1];
                            if (d.special !== chap) return false;
                            if (typ === '概念' && d.type !== '重要概念') return false;
                            if (typ === '简答' && d.type !== '简答/论述题') return false;
                        }
                        if (favVal === 'fav' && !favorites.includes(d.id)) return false;
                        if (searchVal) {
                            const q = d.question.toLowerCase();
                            const a = d.answer.toLowerCase();
                            if (!q.includes(searchVal) && !a.includes(searchVal)) return false;
                        }
                        return true;
                    });
            }

            totalSpan.textContent = currentData.length;
            favSpan.textContent = favorites.length;

            grid.classList.toggle('single-mode', isSingleMode);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-result">🌿 没有找到匹配的卡片，试试调整筛选条件吧</div>`;
                return;
            }

            let html = '';
            filtered.forEach(d => {
                const isFav = favorites.includes(d.id);
                const note = notes[d.id] || '';
                const noteHtml = note || '';
                const qText = d.question;
                const aHtml = renderAnswerParagraphs(d.answer);

                html += `
                    <div class="card-item ${isFav ? 'favorited' : ''}" data-id="${d.id}">
                        <div class="card-header">
                            <div class="label">
                                <span class="tag">${safeText(d.special)}</span>
                                <span class="qid">${safeText(d.qid)}</span>
                                ${d.hasImage ? '<span class="has-img">📐 有图示</span>' : ''}
                            </div>
                            <div class="card-actions" data-id="${d.id}">
                                <button class="btn-fav ${isFav ? 'active' : ''}" data-id="${d.id}" title="收藏">${isFav ? '⭐' : '☆'}</button>
                                <button class="btn-note ${note ? 'active' : ''}" data-id="${d.id}" title="笔记">📝</button>
                                <button class="btn-edit" data-id="${d.id}" title="编辑题目和答案">✏️</button>
                            </div>
                        </div>
                        <div class="card-question" data-id="${d.id}">
                            <span class="q-text">${safeText(qText)}</span>
                            <span class="toggle-hint">(点击展开答案)</span>
                        </div>
                        <div class="card-answer" data-id="${d.id}">
                            <div class="answer-inner">${aHtml}</div>
                        </div>
                        <div class="card-note-area" data-id="${d.id}">
                            <div class="note-editor" contenteditable="false" data-id="${d.id}">${noteHtml}</div>
                            <div class="img-resize-control" data-id="${d.id}">
                                <span>📐 大小</span>
                                <input type="range" min="10" max="200" value="100" step="2" />
                                <span class="size-val">100%</span>
                                <button class="btn-reset-size" data-id="${d.id}">重置</button>
                            </div>
                            <div class="note-actions">
                                <button class="btn-insert-img" data-id="${d.id}">🖼️ 插入图片</button>
                                <button class="note-save" data-id="${d.id}">💾 保存笔记</button>
                                <button class="note-clear" data-id="${d.id}">🗑️ 清空</button>
                                <span class="note-size-hint">支持粘贴图片 · 点击图片调大小</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;

            // 事件绑定
                        delegateOnce('.card-question', 'click', function (e) {
                    if (this.classList.contains('editable')) return;
                    const id = this.dataset.id;
                    const answerDiv = document.querySelector(`.card-answer[data-id="${id}"]`);
                    const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
                    const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);

                    if (!answerDiv) return;

                    const isOpen = answerDiv.classList.contains('open');
                    if (isOpen) {
                        answerDiv.classList.remove('open');
                        if (noteArea) {
                            noteArea.classList.remove('open');
                            if (noteBtn) noteBtn.classList.remove('active');
                        }
                    } else {
                        answerDiv.classList.add('open');
                        if (noteArea) {
                            const hasContent = notes[id] && notes[id].trim().length > 0;
                            if (hasContent) {
                                noteArea.classList.add('open');
                                if (noteBtn) noteBtn.classList.add('active');
                            }
                        }
                    }
                });

                                                delegateOnce('.btn-fav', 'click', function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const idx = favorites.indexOf(id);
                    if(idx > -1){favorites.splice(idx,1);this.classList.remove('active');this.textContent = '☆';}
                    else{favorites.push(id);this.classList.add('active');this.textContent = '⭐';}
                    saveFavs();
                    const card = this.closest('.card-item');
                    if(card) card.classList.toggle('favorited', favorites.includes(id));
                    favSpan.textContent = favorites.length;
                });

                        delegateOnce('.btn-note', 'click', function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
                    if(!noteArea) return;
                    if(noteArea.classList.contains('open')){
                        noteArea.classList.remove('open');
                        this.classList.remove('active');
                    } else {
                        noteArea.classList.add('open');
                        this.classList.add('active');
                        /* 26/09/17 修复：点📝仅打开查看，不再自动聚焦编辑器，
                           避免「编辑过笔记的卡片再点📝时自动跳进编辑态」（重点看文本框才编辑） */
                        const editor = noteArea.querySelector('.note-editor');
                        if(editor){
                            editor.setAttribute('contenteditable', 'false');
                            editor.blur();
                        }
                    }
                });

                        delegateOnce('.btn-insert-img', 'click', function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
                    if(!editor) return;
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = 'image/*';
                    fileInput.style.display = 'none';
                    document.body.appendChild(fileInput);
                    fileInput.onchange = function(){
                        const file = this.files[0];
                        if(!file){document.body.removeChild(fileInput);return;}
                        const reader = new FileReader();
                        reader.onload = function(ev){
                            const img = document.createElement('img');
                            img.src = ev.target.result;
                            try { __shrinkNoteImg(img, ev.target.result); } catch (e) {}
                            img.alt = '笔记图片';
                            img.style.maxWidth = '100%';
                            img.style.maxHeight = '300px';
                            img.style.borderRadius = '10px';
                            img.style.margin = '6px 0';
                            img.style.display = 'block';
                            img.dataset.noteImg = 'true';
                            const sel = window.getSelection();
                            if(sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)){
                                const range = sel.getRangeAt(0);
                                range.insertNode(img);
                                range.setStartAfter(img);
                                range.collapse(true);
                                sel.removeAllRanges();
                                sel.addRange(range);
                            } else editor.appendChild(img);
                            showToast('🖼️ 图片已插入，点击图片可调大小');
                            document.body.removeChild(fileInput);
                            bindImgClick(editor);
                        };
                        reader.readAsDataURL(file);
                    };
                    fileInput.click();
                });

                        delegateOnce('.note-save', 'click', function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
                    if(!editor) return;
                    let content = editor.innerHTML.trim();
                    /* 26/09/17 修复：空笔记点保存时 blur 可能注入占位提示，先剔除占位再判空 */
                    if(content.indexOf('note-placeholder') > -1){
                        const tmpDiv = document.createElement('div');
                        tmpDiv.innerHTML = content;
                        tmpDiv.querySelectorAll('.note-placeholder').forEach(n => n.remove());
                        content = tmpDiv.innerHTML.trim();
                    }
                    if(content === '<br>' || content === '') content = '';
                    if(content) notes[id] = content;
                    else delete notes[id];
                    saveNotes();
                    /* 26/09/17 修复：保存后回到查看态，避免可编辑状态残留导致下次点📝自动进入编辑 */
                    editor.setAttribute('contenteditable', 'false');
                    editor.blur();
                    const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
                    if(noteBtn) noteBtn.classList.toggle('active', !!content);
                    if(content){
                        const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
                        if(noteArea) noteArea.classList.add('open');
                    }
                    const orig = this.textContent;
                    this.textContent = '✅ 已保存';
                    setTimeout(()=>{this.textContent = orig;},1200);
                });

                        delegateOnce('.note-clear', 'click', async function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if(!(await window.showConfirm({ title: '清空笔记', message: '确定要清空这条笔记吗？', okText: '清空', danger: true }))) return;
                    const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
                    if(editor){
                        editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
                        editor.setAttribute('contenteditable', 'false');
                        delete notes[id];
                        saveNotes();
                        const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
                        if(noteBtn) noteBtn.classList.remove('active');
                        const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
                        if(noteArea) noteArea.classList.remove('open');
                        const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
                        if(rc) rc.classList.remove('show');
                        showToast('🗑️ 笔记已清空');
                    }
                });

                        delegateOnce('.note-editor', 'paste', function (e) {
                var editor = this;
                    const items = e.clipboardData && e.clipboardData.items;
                    if (!items) return;
                    for (let item of items) {
                        if (item.type && item.type.startsWith('image/')) {
                            e.preventDefault();
                            const file = item.getAsFile();
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                const img = document.createElement('img');
                                img.src = ev.target.result;
                                try { __shrinkNoteImg(img, ev.target.result); } catch (e) {}
                                img.alt = '粘贴图片';
                                img.style.maxWidth = '100%';
                                img.style.maxHeight = '300px';
                                img.style.borderRadius = '10px';
                                img.style.margin = '6px 0';
                                img.style.display = 'block';
                                img.style.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';
                                img.dataset.noteImg = 'true';
                                const sel = window.getSelection();
                                if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                                    const range = sel.getRangeAt(0);
                                    range.insertNode(img);
                                    range.setStartAfter(img);
                                    range.collapse(true);
                                    sel.removeAllRanges();
                                    sel.addRange(range);
                                } else {
                                    editor.appendChild(img);
                                }
                                showToast('🖼️ 图片已粘贴，点击可调整大小');
                                bindImgClick(editor);
                            };
                            reader.readAsDataURL(file);
                            break;
                        }
                    }
                });

                        grid.querySelectorAll('.note-editor').forEach(editor => {

                const id = editor.dataset.id;
                const content = notes[id] || '';
                if (!content || content.trim() === '') {
                    editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
                }
                bindImgClick(editor);
            });
            delegateOnce('.note-editor', 'focusin', function () {
                    const placeholder = this.querySelector('.note-placeholder');
                    if (placeholder) {
                        this.innerHTML = '';
                    }
                            });
            delegateOnce('.note-editor', 'focusout', function () {
                    if (this.innerHTML.trim() === '' || this.innerHTML === '<br>') {
                        this.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
                    }
                    /* 26/09/17：移出编辑框即回到查看态（保持「点开只看、点文本框才编辑」） */
                    this.setAttribute('contenteditable', 'false');
                            });
            delegateOnce('.note-editor', 'click', function () {
                    if (this.getAttribute('contenteditable') === 'false') {
                        this.setAttribute('contenteditable', 'true');
                        this.focus();
                    }
                            });

            

                        delegateOnce('.btn-reset-size', 'click', function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
                    if (!editor) return;
                    const imgs = editor.querySelectorAll('img');
                    imgs.forEach(img => {
                        img.style.width = '';
                        img.style.maxWidth = '100%';
                        img.dataset.origWidth = '100';
                    });
                    const slider = document.querySelector(
                        `.img-resize-control[data-id="${id}"] input[type="range"]`);
                    if (slider) {
                        slider.value = 100;
                        const valSpan = slider.closest('.img-resize-control').querySelector('.size-val');
                        if (valSpan) valSpan.textContent = '100%';
                    }
                    showToast('📐 图片大小已重置');
                });

                        delegateOnce('.img-resize-control input[type="range"]', 'input', function (e) {
                    const id = this.closest('.img-resize-control').dataset.id;
                    const val = parseInt(this.value);
                    const valSpan = this.closest('.img-resize-control').querySelector('.size-val');
                    if (valSpan) valSpan.textContent = val + '%';
                    const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
                    if (!editor) return;
                    const imgs = editor.querySelectorAll('img');
                    imgs.forEach(img => {
                        if (img.classList.contains('selected')) {
                            img.style.width = val + '%';
                            img.style.maxWidth = val + '%';
                        }
                    });
                });

                        delegateOnce('.btn-edit', 'click', function (e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (this.classList.contains('is-editing')) return;
                    enterEditMode(id);
                });


            if (isSingleMode) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function bindImgClick(editor) {
            const imgs = editor.querySelectorAll('img');
            imgs.forEach(img => {
                img.removeEventListener('click', imgClickHandler);
                img.addEventListener('click', imgClickHandler);
            });
        }

        function imgClickHandler(e) {
            e.stopPropagation();
            const img = this;
            const editor = img.closest('.note-editor');
            if (!editor) return;
            const id = editor.dataset.id;

            const allImgs = editor.querySelectorAll('img');
            allImgs.forEach(i => i.classList.remove('selected'));
            img.classList.add('selected');

            const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
            if (!rc) return;
            rc.classList.add('show');

            const slider = rc.querySelector('input[type="range"]');
            const valSpan = rc.querySelector('.size-val');
            if (!slider) return;

            let currentPct = 100;
            if (img.style.width) {
                const w = parseInt(img.style.width);
                if (w > 0 && w <= 200) currentPct = w;
            }
            slider.value = currentPct;
            if (valSpan) valSpan.textContent = currentPct + '%';

            slider.oninput = function() {
                const val = parseInt(slider.value);
                if (valSpan) valSpan.textContent = val + '%';
                img.style.width = val + '%';
                img.style.maxWidth = val + '%';
                img.dataset.origWidth = val;
            };

            const resetBtn = rc.querySelector('.btn-reset-size');
            if (resetBtn) {
                resetBtn.onclick = function(e2) {
                    e2.stopPropagation();
                    img.style.width = '';
                    img.style.maxWidth = '100%';
                    img.dataset.origWidth = '100';
                    slider.value = 100;
                    if (valSpan) valSpan.textContent = '100%';
                    showToast('📐 已重置');
                };
            }
        }

        function onFilterChange() {
            if (singleModeId !== null) {
                exitSingleMode();
            } else {
                render();
            }
        }

        filterSpecial.addEventListener('change', onFilterChange);
        filterFav.addEventListener('change', onFilterChange);
        /* 26/09/18：筛选下拉框点击时显示光圈（CSS :focus），选中某一项后自动收起光圈 */
        document.querySelectorAll('.filter-bar select').forEach(function (sel) {
            sel.addEventListener('change', function () { this.blur(); });
        });
                /* 搜索防抖：避免每敲一个字就全量重绘所有卡片 */
        var __searchTimer = null;
        filterSearch.addEventListener('input', function () {
            clearTimeout(__searchTimer);
            __searchTimer = setTimeout(onFilterChange, 220);
        });

        clearBtn.addEventListener('click', function() {
            filterSpecial.value = 'all';
            filterFav.value = 'all';
            filterSearch.value = '';
            if (singleModeId !== null) {
                exitSingleMode();
            } else {
                render();
            }
        });

        exitSingleBtn.addEventListener('click', exitSingleMode);
        prevCardBtn.addEventListener('click', goPrevCard);
        nextCardBtn.addEventListener('click', goNextCard);
        randomBtn.addEventListener('click', doRandom);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'r' || e.key === 'R') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    const target = e.target;
                    if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA' && target.contentEditable !== 'true') {
                        e.preventDefault();
                        doRandom();
                    }
                }
            }
            if (e.key === 'Escape') {
                if (singleModeId !== null) {
                    e.preventDefault();
                    exitSingleMode();
                }
            }
            if (singleModeId !== null) {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goPrevCard();
                }
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goNextCard();
                }
            }
        });

buildSpecialOptions();

                render();

        setTimeout(() => {
            document.querySelectorAll('.note-editor').forEach(editor => {
                const id = editor.dataset.id;
                const content = notes[id] || '';
                if (!content || content.trim() === '') {
                    editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
                }
                bindImgClick(editor);
            });
        }, 100);
    </script>
<script src="../shared/confirm.js"></script>
<script src="../self-test.js"></script>
<script src="../ai-assistant.js"></script>
