<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="../icons/icon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#6A2C91">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宏观简答 · 记忆卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f7f0;
            color: #1e3a2a;
            padding: 20px;
        }
        .app-header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: #d9edd9;
            padding: 18px 28px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(60, 110, 60, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e4a2a;
            letter-spacing: 0.5px;
        }
        .app-header .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            background: #c4e0c4;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .app-header .stats span {
            font-weight: 500;
        }
        .app-header .stats .num {
            color: #1f6b3a;
            font-weight: 700;
        }
        .filter-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #e6f3e6;
            padding: 12px 20px;
            border-radius: 14px;
            transition: opacity 0.3s;
        }
        .filter-bar.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .filter-bar label {
            font-size: 14px;
            font-weight: 500;
            color: #1f4a2a;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #b3d9b3;
            background: #fafffa;
            font-size: 14px;
            color: #1e3a2a;
            outline: none;
        }
        .filter-bar input:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.2);
        }
        /* 26/09/18：筛选下拉框点击时显示光圈，选中某一项后由脚本自动收起；搜索框光圈保留 */
        .filter-bar select:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.2);
        }
        .filter-bar .btn-clear-filter {
            background: #cfe2cf;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #1e4a2a;
            font-weight: 500;
            transition: background 0.2s;
        }
        @media (hover: hover) and (pointer: fine) {
            .filter-bar .btn-clear-filter:hover {
                background: #b8d4b8;
            }
        }
        .filter-bar .btn-random {
            background: #d4c49a;
            border: none;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #3f3a1a;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        @media (hover: hover) and (pointer: fine) {
            .filter-bar .btn-random:hover {
                background: #c9b888;
                transform: scale(1.02);
            }
        }
        .filter-bar .btn-random:active {
            transform: scale(0.96);
        }

        /* ---- 抽查模式提示条 ---- */
        .single-mode-bar {
            max-width: 1200px;
            margin: 0 auto 16px auto;
            background: #f5efe0;
            border: 2px solid #d4a24e;
            border-radius: 14px;
            padding: 8px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            animation: fadeSlide 0.3s ease;
        }
        .single-mode-bar.show {
            display: flex;
        }
        .single-mode-bar .mode-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .single-mode-bar .mode-left .btn-nav {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 8px;
            color: #7a5a2a;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        @media (hover: hover) and (pointer: fine) {
            .single-mode-bar .mode-left .btn-nav:hover {
                background: #e8ddd0;
                transform: scale(1.05);
            }
        }
        .single-mode-bar .mode-left .btn-nav:active {
            transform: scale(0.92);
        }
        .single-mode-bar .mode-left .btn-nav.disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .single-mode-bar .card-id-badge {
            font-size: 15px;
            font-weight: 600;
            color: #5a4a2a;
            background: #e8ddd0;
            padding: 4px 18px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .single-mode-bar .mode-hint {
            font-size: 13px;
            color: #8a7a5a;
            margin-left: 4px;
        }
        .single-mode-bar .btn-exit-single {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 8px;
            color: #8a5a4a;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        @media (hover: hover) and (pointer: fine) {
            .single-mode-bar .btn-exit-single:hover {
                background: #e8d5d0;
                transform: scale(1.05);
            }
        }
        .single-mode-bar .btn-exit-single:active {
            transform: scale(0.92);
        }

        .card-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }
        .card-grid.single-mode {
            max-width: 820px;
        }
        .card-grid.single-mode .card-item {
            box-shadow: 0 8px 32px rgba(60, 100, 60, 0.18);
            border-left-width: 8px;
        }

        .card-item {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(60, 100, 60, 0.08);
            border-left: 6px solid #8fbe8f;
            transition: box-shadow 0.25s, transform 0.15s, border-color 0.3s;
            overflow: hidden;
            position: relative;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-item:hover {
                box-shadow: 0 8px 24px rgba(50, 100, 50, 0.13);
            }
        }
        .card-item.favorited {
            border-left-color: #d4a24e;
            background: #fdfbf6;
        }
        .card-item.favorited .toggle-hint { color: #bd9333; opacity: 0.9; }
        .card-item.favorited .card-header .label .qid { color: #8a6a1a; }
        .card-item.favorited .card-question { color: #2b2b2b; }
        .card-item.favorited .card-answer .answer-inner strong { color: #1a1a1a; }
        .card-item.favorited .card-answer .answer-inner p.formula { color: #2b2b2b; background: #f6eddd; }
        .card-item.favorited .card-answer .answer-inner .img-placeholder { background: #efe4c8; color: #5a4a1a; }
        .card-item.favorited .card-header .label .tag { background: #f2e8ce; color: #5a4a1a; }
        .card-item.favorited .card-answer .answer-inner { background: #faf6ea; color: #2b2b2b; }
        .card-item.favorited .card-question.editable { background: #fdfaf1; border-color: #e8d9b0; }
        .card-item.favorited .card-answer.editable { background: #fdfaf1; border-color: #e8d9b0; }
        .card-item.favorited .card-note-area .note-editor { background: #fdfaf1; border-color: #e8d9b0; }
        .card-item.favorited .card-note-area .note-editor:focus { border-color: #d4a24e; box-shadow: 0 0 0 3px rgba(212, 162, 78, 0.16); }
        .card-item.favorited .card-note-area .note-editor img.selected { border-color: #d4a24e; box-shadow: 0 0 0 3px rgba(212, 162, 78, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12); }
        .card-item.favorited .card-note-area .note-editor .note-placeholder { color: #b8a478; }
        .card-item.favorited .card-note-area .img-resize-control { background: #f8f1de; border-color: #e8d9b0; color: #6a5620; }
        .card-item.favorited .card-note-area .img-resize-control input[type="range"] { accent-color: #d4a24e; }
        .card-item.favorited .card-note-area .img-resize-control .btn-reset-size { background: #f0e6cc; color: #5a4a1a; }
        .card-item.favorited .card-note-area .note-actions button { background: #f1e7cd; color: #5a4a1a; }
        .card-item.favorited .card-note-area .note-actions .btn-insert-img { background: #ece1c4; color: #5a4a1a; }
        .card-item.favorited .card-note-area .note-actions .note-save { background: #e6d5a2; color: #4a3a0a; }
        .card-item.favorited .card-note-area .note-actions .note-clear { background: #ecded6; color: #6a4a3a; }
        .card-item.favorited .card-note-area .note-actions .note-size-hint { color: #a8926a; }
        @media (hover: hover) and (pointer: fine) {
            .card-item.favorited .card-actions button:hover { background: #f5ecd8; }
            .card-item.favorited .card-note-area .note-actions button:hover { background: #e8dbb8; }
            .card-item.favorited .card-note-area .note-actions .btn-insert-img:hover { background: #e2d5b0; }
            .card-item.favorited .card-note-area .note-actions .note-save:hover { background: #dcc78e; }
            .card-item.favorited .card-note-area .note-actions .note-clear:hover { background: #e2d0c6; }
            .card-item.favorited .card-note-area .img-resize-control .btn-reset-size:hover { background: #e8dbb8; }
        }
        .card-item.highlight {
            border-left-color: #e67e22;
            box-shadow: 0 0 0 3px #e67e22, 0 8px 28px rgba(230, 126, 34, 0.25);
            transform: scale(1.005);
        }
        .card-header {
            padding: 16px 22px 8px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-header .label {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-header .label .tag {
            background: #dcebd9;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #1a4a2a;
            white-space: nowrap;
        }
        .card-header .label .qid {
            font-weight: 600;
            font-size: 15px;
            color: #1f5a2f;
        }
        .card-header .label .has-img {
            background: #d9c8b0;
            color: #5a3f1a;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .card-actions button {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 10px;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
            color: #3f6a3f;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-actions button:hover {
                background: #e6f0e6;
                transform: scale(1.05);
            }
        }
        .card-actions .btn-fav {
            color: #b8a06a;
        }
        .card-actions .btn-fav.active {
            color: #d4a24e;
        }
        .card-actions .btn-note {
            color: #4f7a4f;
        }
        .card-actions .btn-note.active {
            color: #2b6b2b;
        }
        .card-actions .btn-edit {
            color: #4f6a8f;
        }
        .card-actions .btn-edit.is-editing {
            color: #2b6b2b;
        }
        .card-actions .btn-save-edit {
            color: #2b7a2b;
            font-weight: 700;
        }
        .card-actions .btn-cancel-edit {
            color: #8a4a4a;
        }
        .card-actions .btn-edit-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .card-actions .btn-edit-group .btn-edit {
            font-size: 18px;
        }
        .card-actions .btn-edit-group .btn-save-edit,
        .card-actions .btn-edit-group .btn-cancel-edit {
            font-size: 18px;
        }

        .card-question {
            padding: 6px 22px 12px 22px;
            font-size: 15.5px;
            line-height: 1.7;
            color: #1c3322;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        .card-question .q-text {
            display: inline;
        }
        .card-question .q-text .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .card-question .toggle-hint {
            font-size: 13px;
            color: #5f8a5f;
            margin-left: 10px;
            font-weight: 400;
            opacity: 0.7;
        }
        .card-question.editable {
            cursor: text;
            user-select: text;
            border: 2px dashed #6a9e9e;
            border-radius: 10px;
            padding: 10px 18px;
            background: #fafffe;
        }
        .card-question.editable:focus {
            border-color: #2b6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-answer {
            padding: 0 22px 6px 22px;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .card-answer.open {
            display: block;
        }
        .card-answer .answer-inner {
            background: #f3faf3;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 14.8px;
            line-height: 1.75;
            color: #1a3322;
            word-break: break-word;
        }
        /* ---- 答案段落缩进核心样式 ---- */
        .card-answer .answer-inner p {
            text-indent: 2em;
            margin: 0 0 0.2em 0;
            padding: 0;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-answer .answer-inner p:last-child {
            margin-bottom: 0;
        }
        .card-answer .answer-inner .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .card-answer .answer-inner .img-placeholder {
            display: inline-block;
            background: #dce8dc;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #2a5a2a;
            margin: 6px 0;
            font-weight: 500;
        }
        .card-answer.editable {
            cursor: text;
            user-select: text;
            border: 2px dashed #6a9e9e;
            border-radius: 10px;
            padding: 8px 16px;
            background: #fafffe;
        }
        .card-answer.editable .answer-inner {
            background: transparent;
            padding: 4px 6px;
        }
        .card-answer.editable .answer-inner p {
            text-indent: 2em;
            margin: 0 0 0.2em 0;
            padding: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-answer.editable .answer-inner p:last-child {
            margin-bottom: 0;
        }
        .card-answer.editable:focus {
            border-color: #2b6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-note-area {
            padding: 0 22px 18px 22px;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .card-note-area.open {
            display: block;
        }
        .card-note-area .note-editor {
            background: #f8fcf8;
            border: 1px solid #c2ddc2;
            border-radius: 14px;
            padding: 12px 16px;
            min-height: 80px;
            max-height: 360px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            color: #1c3322;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            word-break: break-word;
            position: relative;
        }
        .card-note-area .note-editor:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.15);
        }
        .card-note-area .note-editor img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin: 6px 0;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background: #f0f5f0;
            border: 2px solid transparent;
            transition: border 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card-note-area .note-editor img.selected {
            border-color: #4f8a4f;
            box-shadow: 0 0 0 3px rgba(79, 138, 79, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        .card-note-area .note-editor .note-placeholder {
            color: #8aaa8a;
            font-style: italic;
        }

        /* ---- 图片滑块控制 ---- */
        .card-note-area .img-resize-control {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding: 6px 14px;
            background: #edf5ed;
            border-radius: 30px;
            border: 1px solid #c2ddc2;
            font-size: 13px;
            color: #2a5a2a;
            flex-wrap: wrap;
        }
        .card-note-area .img-resize-control.show {
            display: flex;
        }
        .card-note-area .img-resize-control input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: #4f8a4f;
            height: 4px;
            cursor: pointer;
        }
        .card-note-area .img-resize-control .size-val {
            font-weight: 600;
            min-width: 44px;
            text-align: center;
        }
        .card-note-area .img-resize-control .btn-reset-size {
            background: #dcebd9;
            border: none;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            color: #1e4a2a;
            transition: background 0.2s;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .img-resize-control .btn-reset-size:hover {
                background: #c2ddc2;
            }
        }

        .card-note-area .note-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }
        .card-note-area .note-actions button {
            background: #dcebd9;
            border: none;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #1e4a2a;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions button:hover {
                background: #c2ddc2;
            }
        }
        .card-note-area .note-actions button:active {
            transform: scale(0.96);
        }
        .card-note-area .note-actions .btn-insert-img {
            background: #d4d9c4;
            color: #2f4a2f;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions .btn-insert-img:hover {
                background: #c4cdb0;
            }
        }
        .card-note-area .note-actions .note-save {
            background: #a8c8a8;
            color: #1a3a1a;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions .note-save:hover {
                background: #94b894;
            }
        }
        .card-note-area .note-actions .note-clear {
            background: #e6d6d6;
            color: #6a3a3a;
        }
        @media (hover: hover) and (pointer: fine) {
            .card-note-area .note-actions .note-clear:hover {
                background: #dcc4c4;
            }
        }
        .card-note-area .note-actions .note-size-hint {
            font-size: 12px;
            color: #6f8f6f;
            margin-left: auto;
            opacity: 0.7;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .no-result {
            text-align: center;
            padding: 50px 20px;
            color: #4f7a4f;
            font-size: 17px;
            background: #e6f3e6;
            border-radius: 24px;
        }
        .footer-note {
            max-width: 1200px;
            margin: 30px auto 10px auto;
            text-align: center;
            font-size: 13px;
            color: #5f7f5f;
            border-top: 1px solid #cce0cc;
            padding-top: 18px;
        }
        .footer-note kbd {
            background: #dce8dc;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a4a2a;
            color: #f0faf0;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 640px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                padding: 14px 18px;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .single-mode-bar {
                flex-direction: column;

<script>

        const cardData = [
            // ================= 专项一：宏观经济学数据 =================
            { id: 'm1q1', special: '宏观经济学数据', qid: '1',
                question: '请指出以下各项交易是否计入GDP，并简要说明理由：\n（1）经纪人为一座旧房买卖收取的一笔佣金；\n（2）自己使用的房屋的估计租金；\n（3）政府给贫困家庭发放的一笔救济金；\n（4）汽车制造厂买进10吨钢板；\n（5）政府支付给公务员的工资。',
                answer: '（1）应该计入。经纪人为一座旧房买卖收取的一笔佣金，属于经纪人提供服务所获得的报酬，故包含于GDP的计算中。\n（2）应该计入。房子在GDP中比较特殊，它分为两部分：对于新建的住房是以投资的形式计入GDP，而在以后的年份中房子作为投资品会不断地提供住房服务，此时服务的价值就是对应的租金，如果是自己使用房子则按照估算的租金计入GDP中。\n（3）不应该计入。政府给贫困家庭发放的一笔救济金属于转移支付，而转移支付只是简单地把收入从一些人或一些组织转移到另一些人或另一些组织，只是简单的财富转移，在这一过程中没有新产品或劳务的产生，因此不计入GDP中。\n（4）不应该计入。国内生产总值是指一个经济社会在某一给定时期内运用生产要素所生产的全部最终产品和劳务的市场价值，汽车制造厂买进的10吨钢板属于中间产品，不计入GDP。\n（5）应该计入。公务员提供了为社会工作的服务，政府支付给他们的工资相当于购买这些服务，工资是公务员提供劳务的报酬，因此这些工资支出作为政府购买被计入GDP。',
                hasImage: false },
            { id: 'm1q2', special: '宏观经济学数据', qid: '2',
                question: '各国通用的国民收入核算存在着哪些问题？为什么在有这么多问题的情况下，我们还在使用它，甚至没有解决这些问题？你怎么看待这些问题。',
                answer: '（1）GDP指标的缺陷：\n① 由于GDP是用市场价格来评价物品和劳务，所以它几乎未包括所有在市场外进行的活动的价值。\n② 未包括环境质量。它不能反映经济增长的方式和为此付出的代价（如雾霾）。\n③ 它不能反映社会成本。例如GDP水平很高的地方如果赌博和黄色交易盛行，社会成本较高，但国民收入核算体系并不能反映出来。\n④ 它不能反映经济增长的效率、效益和质量。例如高能耗、低效率、粗放式增长方式就反映不出来。\n⑤ 它不能反映人们的生活质量，比如不能反映人们在精神上的满足程度，不能反映闲暇给人们带来的享受等。\n⑥ 不能衡量社会财富分配情况和社会公正程度。\n⑦ GDP的统计有一定的误差。GDP许多数据是根据抽样调查得出来的，其中包含一定的误差。由于种种原因，人们往往并不反映真实情况，因而统计出来的数字存在一定程度的虚假成分。\n（2）尽管GDP指标存在一些缺陷，但它仍不失为一种经济福利的良好衡量指标，因为大多人对高收入的偏好大于低收入。另外，GDP高实际上有助于人们生活水平的提高，GDP高的国家能够提供更好的医疗、更好的教育体系以及更好的基础设施，它间接地衡量了人们提高生活水平的能力。最后，基于经济福利的多维性考量，要寻找一种替代的指标并不容易。',
                hasImage: false },
            { id: 'm1q3', special: '宏观经济学数据', qid: '3',
                question: '名义GDP和实际GDP哪一个能更好地描述经济活动的变化和经济福利状况？',
                answer: '（1）名义GDP是指用生产物品和劳务的当年价格计算的全部最终产品的市场价值。\n实际GDP是指用从前某一年作为基期的价格计算出来的全部最终产品的市场价值。\n（2）名义GDP的变动可以有两种原因：一是实际产量的变动，二是价格的变动。也就是说，名义GDP的变动既反映了实际产量变动的情况，又反映了价格变动的情况。\n实际GDP的变动仅仅是由于实际产量的变动所引起的。也就是说，实际GDP的变动仅仅反映了实际产量变动的情况。因此，相对于名义GDP，实际GDP能更好地描述经济活动的变化和经济福利状况。',
                hasImage: false },
            { id: 'm1q4', special: '宏观经济学数据', qid: '4',
                question: '支出法GDP由哪些部分构成？什么是最终消费率？中国最终消费率为什么偏低？',
                answer: '（1）用支出法核算GDP，就是核算经济社会（指一个国家或一个地区）在一定时期内消费、投资、政府购买以及净出口这几方面支出的总和。用支出法计算GDP的公式可写成：Y = C + I + G + NX。\n（2）最终消费率是指一个国家或地区在一定时期内（通常为一年）的最终消费（用于居民个人消费和社会消费的总额）占当年GDP的比率。它反映了一个国家生产的产品用于最终消费的比重，是衡量国民经济中消费比重的重要指标。\n（3）中国最终消费率偏低的原因在于以下几个方面：\n① 居民收入增长速度低于经济增长速度，直接影响消费总额。\n② 收入分配格局不合理也是制约消费的重要因素。初次分配中劳动者报酬偏低且持续下降，高收入群体和中低收入群体的收入差距逐年增加，影响经济发展的同时也抑制了消费增长。\n③ 物价上涨降低了实际消费水平，房价高企更是拉低了其他消费项目的支出。近年来，消费价格指数居高不下，居民实际购买能力下降，房价畸高捆绑整个国民经济，扭曲资金配置，削弱了居民的消费能力。\n④ 政府公共服务不足，影响居民消费预期以及跨期消费选择。教育支出大，医疗支出多，养老金制度也不健全，居民的预防性储蓄增加，挤占了正常消费支出。\n⑤ 城镇化进程较快，但质量偏低，许多城镇人口都只是统计意义上的城镇人口，其权益未得到切实保护，享受不到基本生活保障和医疗等公共服务，消费水平也远低于一般市民。',
                hasImage: false },
            { id: 'm1q5', special: '宏观经济学数据', qid: '5',
                question: '如果政府雇佣失业工人，他们曾经领取TR美元的失业救济金，现在他们作为政府雇员支取TR美元，不做任何工作，GDP会发生什么情况？',
                answer: '国内生产总值指一个国家（地区）领土范围内，本国（地区）居民和外国居民在一定时期内所生产和提供的最终使用的产品和劳务的价值。\nGDP一般通过支出法和收入法两种方法进行核算。用支出法计算的国内生产总值等于消费、投资、政府支出和净出口之和；用收入法计算的国内生产总值等于工资、利息、租金、利润、间接税和企业转移支付和折旧之和。\n本题可以从两个角度分析：\n（1）从支出法核算角度看：C、I、NX保持不变，由于转移支付TR美元变成了政府对劳务的购买即政府支出增加，使得G增加TR美元，GDP会由于G的增加而增加。\n（2）从收入法核算的角度看：以前是转移支付TR美元，现在政府改变政策，不进行转移支付，而是失业者作为政府雇员领取工资TR，所以GDP增加了。',
                hasImage: false },
            { id: 'm1q6', special: '宏观经济学数据', qid: '6',
                question: '请分析GNP与GDP的不同。（南开2005年考题）',
                answer: 'GNP（国民生产总值）是指某国国民所拥有的全部生产要素所生产的最终产品和劳务的市场价值。GDP（国内生产总值）是一国范围内生产的最终产品和劳务的市场价值。两者的不同主要有以下几点：\n（1）范围不同\nGNP是本国国民生产的最终产品和劳务市场价值的总和，是一个国民概念，即无论劳动力和其他生产要素处于国内还是国外，只要是本国国民生产的产品和劳务的价值都记入国民生产总值。GDP是指一国或地区一定时期（通常为一年）所有常住单位运用生产要素所生产的全部最终产品的市场价值。它是一国范围内生产的最终产品，是一个地域概念。也就是说，在一国领土范围内，其居民无论国籍如何，只要符合本国常住居民定义，在一定时期内所生产的最终产品和提供的劳务价值都可算作本国的国内生产总值。\n（2）衡量方法不同\nGNP是按国民原则核算的，只要是本国（或地区）居民，无论是否在本国境内（或地区内）居住，其生产和经营活动新创造的增加值都应该计算在内。GDP是按国土原则核算的生产经营的最终成果。比方说，外资企业在中国境内创造的增加值就应该计算在GDP中，而不计入GNP中。\n（3）内容不同\n国内生产总值是“生产”概念，而国民生产总值是“收入”概念。\n（4）两者的数值不一定相等\n在经济封闭的国家或地区，国民生产总值等于国内生产总值；在经济开放的国家或地区，国民生产总值等于国内生产总值加上国外净要素收入。国外净要素收入是指从国外得到的生产要素收入减去支付给国外的要素收入。可见，国民生产总值与国内生产总值之间的区别就在于国外净要素收入。生产要素的提供者不一定都是本国居民，有时也有外国居民，本国居民也有向外国的经济活动提供要素的。国内经济活动所创造的收入，作为要素收入，既分配给本国居民，也分配给外国居民；相反，国外的经济活动所创造的收入也分配给本国居民，这两项的差额就是国外净要素收入。',
                hasImage: false },
            { id: 'm1q7', special: '宏观经济学数据', qid: '7',
                question: '“国民生产总值等于国内生产总值加上净出口。”这一说法对吗？',
                answer: '错误。\n（1）国民生产总值（GNP）是指一国或地区的国民所拥有的全部生产要素在一定时期内所生产的全部最终产品（物品和劳务）的市场价值。GDP即国内生产总值，指经济社会（即一国或一地区）在一定时期内运用生产要素所生产的全部最终产品（物品和劳务）的市场价值。\n（2）二者的关系：GNP = GDP + 来自国外的要素报酬 - 支付给国外的要素报酬 = GDP + 国外净要素收入，即国民生产总值等于国内生产总值加上国外净要素收入。',
