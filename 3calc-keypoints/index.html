<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>南开经济学 · 计算要点记忆卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f7f0;
            color: #1e3a2a;
            padding: 20px;
        }
        .app-header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: #d9edd9;
            padding: 18px 28px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(60, 110, 60, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e4a2a;
            letter-spacing: 0.5px;
        }
        .app-header .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            background: #c4e0c4;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .app-header .stats span {
            font-weight: 500;
        }
        .app-header .stats .num {
            color: #1f6b3a;
            font-weight: 700;
        }
        .filter-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #e6f3e6;
            padding: 12px 20px;
            border-radius: 14px;
            transition: opacity 0.3s;
        }
        .filter-bar.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .filter-bar label {
            font-size: 14px;
            font-weight: 500;
            color: #1f4a2a;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #b3d9b3;
            background: #fafffa;
            font-size: 14px;
            color: #1e3a2a;
            outline: none;
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.2);
        }

/* 新增：去掉 optgroup（微观部分 / 宏观部分）的斜体 */
.filter-bar select optgroup {
    font-style: normal;
    font-weight: 600;
}
        .filter-bar .btn-clear-filter {
            background: #cfe2cf;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #1e4a2a;
            font-weight: 500;
            transition: background 0.2s;
        }
        .filter-bar .btn-clear-filter:hover {
            background: #b8d4b8;
        }
        .filter-bar .btn-random {
            background: #d4c49a;
            border: none;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #3f3a1a;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        .filter-bar .btn-random:hover {
            background: #c9b888;
            transform: scale(1.02);
        }
        .filter-bar .btn-random:active {
            transform: scale(0.96);
        }

        /* ---- 抽查模式提示条 ---- */
        .single-mode-bar {
            max-width: 1200px;
            margin: 0 auto 16px auto;
            background: #f5efe0;
            border: 2px solid #d4a24e;
            border-radius: 14px;
            padding: 8px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            animation: fadeSlide 0.3s ease;
        }
        .single-mode-bar.show {
            display: flex;
        }
        .single-mode-bar .mode-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .single-mode-bar .mode-left .btn-nav {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 8px;
            color: #7a5a2a;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        .single-mode-bar .mode-left .btn-nav:hover {
            background: #e8ddd0;
            transform: scale(1.05);
        }
        .single-mode-bar .mode-left .btn-nav:active {
            transform: scale(0.92);
        }
        .single-mode-bar .mode-left .btn-nav.disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .single-mode-bar .card-id-badge {
            font-size: 15px;
            font-weight: 600;
            color: #5a4a2a;
            background: #e8ddd0;
            padding: 4px 18px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .single-mode-bar .mode-hint {
            font-size: 13px;
            color: #8a7a5a;
            margin-left: 4px;
        }
        .single-mode-bar .btn-exit-single {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 8px;
            color: #8a5a4a;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        .single-mode-bar .btn-exit-single:hover {
            background: #e8d5d0;
            transform: scale(1.05);
        }
        .single-mode-bar .btn-exit-single:active {
            transform: scale(0.92);
        }

        .card-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }
        .card-grid.single-mode {
            max-width: 820px;
        }
        .card-grid.single-mode .card-item {
            box-shadow: 0 8px 32px rgba(60, 100, 60, 0.18);
            border-left-width: 8px;
        }

        .card-item {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(60, 100, 60, 0.08);
            border-left: 6px solid #8fbe8f;
            transition: box-shadow 0.25s, transform 0.15s, border-color 0.3s;
            overflow: hidden;
            position: relative;
        }
        .card-item:hover {
            box-shadow: 0 8px 24px rgba(50, 100, 50, 0.13);
        }
        .card-item.favorited {
            border-left-color: #d4a24e;
            background: #fcf9f0;
        }
        .card-item.highlight {
            border-left-color: #e67e22;
            box-shadow: 0 0 0 3px #e67e22, 0 8px 28px rgba(230, 126, 34, 0.25);
            transform: scale(1.005);
        }
        /* 知识要点卡片特殊配色 */
        .card-item.knowledge {
            border-left-color: #4f8a9e;
            background: #f7fbfd;
        }
        .card-item.knowledge .card-header .label .tag {
            background: #d6e8f0;
            color: #14405a;
        }
        .card-item.knowledge .card-question {
            color: #14384a;
        }
        .card-item.knowledge.favorited {
            background: #fdf9ee;
        }
        .card-header {
            padding: 16px 22px 8px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-header .label {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-header .label .tag {
            background: #dcebd9;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #1a4a2a;
            white-space: nowrap;
        }
        .card-header .label .qid {
            font-weight: 600;
            font-size: 15px;
            color: #1f5a2f;
        }
        .card-header .label .has-img {
            background: #d9c8b0;
            color: #5a3f1a;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .card-actions button {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 10px;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
            color: #3f6a3f;
        }
        .card-actions button:hover {
            background: #e6f0e6;
            transform: scale(1.05);
        }
        .card-actions .btn-fav {
            color: #b8a06a;
        }
        .card-actions .btn-fav.active {
            color: #d4a24e;
        }
        .card-actions .btn-note {
            color: #4f7a4f;
        }
        .card-actions .btn-note.active {
            color: #2b6b2b;
        }
        .card-actions .btn-edit {
            color: #4f6a8f;
        }
        .card-actions .btn-edit.is-editing {
            color: #2b6b2b;
        }
        .card-actions .btn-save-edit {
            color: #2b7a2b;
            font-weight: 700;
        }
        .card-actions .btn-cancel-edit {
            color: #8a4a4a;
        }
        .card-actions .btn-edit-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .card-actions .btn-edit-group .btn-edit {
            font-size: 18px;
        }
        .card-actions .btn-edit-group .btn-save-edit,
        .card-actions .btn-edit-group .btn-cancel-edit {
            font-size: 18px;
        }

        .card-question {
            padding: 6px 22px 12px 22px;
            font-size: 15.5px;
            line-height: 1.7;
            color: #1c3322;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        .card-question .q-text {
            display: inline;
            white-space: pre-wrap;
        }
        .card-question .q-text .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .card-question .toggle-hint {
            font-size: 13px;
            color: #5f8a5f;
            margin-left: 10px;
            font-weight: 400;
            opacity: 0.7;
            white-space: nowrap;
        }
        .card-question.editable {
            cursor: text;
            user-select: text;
            border: 2px dashed #6a9e9e;
            border-radius: 10px;
            padding: 10px 18px;
            background: #fafffe;
        }
        .card-question.editable:focus {
            border-color: #2b6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-answer {
            padding: 0 22px 6px 22px;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .card-answer.open {
            display: block;
        }
        .card-answer .answer-inner {
            background: #f3faf3;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 14.8px;
            line-height: 1.75;
            color: #1a3322;
            word-break: break-word;
        }
        /* ---- 答案段落缩进核心样式 ---- */
        .card-answer .answer-inner p {
            text-indent: 2em;
            margin: 0 0 0.2em 0;
            padding: 0;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-answer .answer-inner p:last-child {
            margin-bottom: 0;
        }
        /* ---- 公式行：不缩进、居中偏左 ---- */
        .card-answer .answer-inner p.formula {
            text-indent: 0;
            margin-left: 2em;
            font-family: 'Times New Roman', 'Cambria Math', serif;
            color: #1c4a3a;
            background: #eaf5ea;
            border-radius: 6px;
            padding: 2px 10px;
            display: block;
            width: fit-content;
            max-width: 100%;
        }
        .card-answer .answer-inner strong {
            color: #0f3d1f;
            font-weight: 700;
        }
        .card-answer .answer-inner .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .card-answer .answer-inner .img-placeholder {
            display: inline-block;
            background: #dce8dc;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #2a5a2a;
            margin: 6px 0;
            font-weight: 500;
        }
        .card-answer.editable {
            cursor: text;
            user-select: text;
            border: 2px dashed #6a9e9e;
            border-radius: 10px;
            padding: 8px 16px;
            background: #fafffe;
        }
        .card-answer.editable .answer-inner {
            background: transparent;
            padding: 4px 6px;
        }
        .card-answer.editable .answer-inner p {
            text-indent: 2em;
            margin: 0 0 0.2em 0;
            padding: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-answer.editable .answer-inner p:last-child {
            margin-bottom: 0;
        }
        .card-answer.editable:focus {
            border-color: #2b6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-note-area {
            padding: 0 22px 18px 22px;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .card-note-area.open {
            display: block;
        }
        .card-note-area .note-editor {
            background: #f8fcf8;
            border: 1px solid #c2ddc2;
            border-radius: 14px;
            padding: 12px 16px;
            min-height: 80px;
            max-height: 360px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            color: #1c3322;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            word-break: break-word;
            position: relative;
        }
        .card-note-area .note-editor:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.15);
        }
        .card-note-area .note-editor img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin: 6px 0;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background: #f0f5f0;
            border: 2px solid transparent;
            transition: border 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card-note-area .note-editor img.selected {
            border-color: #4f8a4f;
            box-shadow: 0 0 0 3px rgba(79, 138, 79, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        .card-note-area .note-editor .note-placeholder {
            color: #8aaa8a;
            font-style: italic;
        }

        /* ---- 图片滑块控制 ---- */
        .card-note-area .img-resize-control {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding: 6px 14px;
            background: #edf5ed;
            border-radius: 30px;
            border: 1px solid #c2ddc2;
            font-size: 13px;
            color: #2a5a2a;
            flex-wrap: wrap;
        }
        .card-note-area .img-resize-control.show {
            display: flex;
        }
        .card-note-area .img-resize-control input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: #4f8a4f;
            height: 4px;
            cursor: pointer;
        }
        .card-note-area .img-resize-control .size-val {
            font-weight: 600;
            min-width: 44px;
            text-align: center;
        }
        .card-note-area .img-resize-control .btn-reset-size {
            background: #dcebd9;
            border: none;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            color: #1e4a2a;
            transition: background 0.2s;
        }
        .card-note-area .img-resize-control .btn-reset-size:hover {
            background: #c2ddc2;
        }

        .card-note-area .note-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }
        .card-note-area .note-actions button {
            background: #dcebd9;
            border: none;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #1e4a2a;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        .card-note-area .note-actions button:hover {
            background: #c2ddc2;
        }
        .card-note-area .note-actions button:active {
            transform: scale(0.96);
        }
        .card-note-area .note-actions .btn-insert-img {
            background: #d4d9c4;
            color: #2f4a2f;
        }
        .card-note-area .note-actions .btn-insert-img:hover {
            background: #c4cdb0;
        }
        .card-note-area .note-actions .note-save {
            background: #a8c8a8;
            color: #1a3a1a;
        }
        .card-note-area .note-actions .note-save:hover {
            background: #94b894;
        }
        .card-note-area .note-actions .note-clear {
            background: #e6d6d6;
            color: #6a3a3a;
        }
        .card-note-area .note-actions .note-clear:hover {
            background: #dcc4c4;
        }
        .card-note-area .note-actions .note-size-hint {
            font-size: 12px;
            color: #6f8f6f;
            margin-left: auto;
            opacity: 0.7;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .no-result {
            text-align: center;
            padding: 50px 20px;
            color: #4f7a4f;
            font-size: 17px;
            background: #e6f3e6;
            border-radius: 24px;
        }
        .footer-note {
            max-width: 1200px;
            margin: 30px auto 10px auto;
            text-align: center;
            font-size: 13px;
            color: #5f7f5f;
            border-top: 1px solid #cce0cc;
            padding-top: 18px;
        }
        .footer-note kbd {
            background: #dce8dc;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a4a2a;
            color: #f0faf0;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 640px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                padding: 14px 18px;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .single-mode-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 10px 14px;
            }
            .single-mode-bar .mode-left {
                justify-content: center;
            }
            .card-header {
                padding: 14px 16px 4px 16px;
            }
            .card-question {
                padding: 4px 16px 10px 16px;
                font-size: 14.5px;
            }
            .card-answer {
                padding: 0 16px 6px 16px;
            }
            .card-answer .answer-inner {
                padding: 14px 16px;
                font-size: 14px;
            }
            .card-answer .answer-inner p.formula {
                margin-left: 0.8em;
                font-size: 13.5px;
            }
            .card-note-area {
                padding: 0 16px 14px 16px;
            }
            .card-note-area .note-editor {
                min-height: 60px;
                max-height: 260px;
            }
            .card-grid.single-mode {
                max-width: 100%;
            }
            .card-note-area .img-resize-control {
                flex-wrap: wrap;
                gap: 6px;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #dce8dc;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #8fbe8f;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6f9e6f;
        }
/* ================= 返回主页按钮 ================= */
.app-header .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.back-home {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 15px 7px 11px;
    border-radius: 30px;
    background: #c4e0c4;
    color: #1e4a2a;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(60, 110, 60, 0.10);
    transition: background .2s, transform .2s, box-shadow .2s;
}
.back-home:hover {
    background: #a8d0a8;
    transform: translateX(-2px);
    box-shadow: 0 4px 12px rgba(60, 110, 60, 0.20);
}
.back-home .arrow {
    font-size: 15px;
    line-height: 1;
    transition: transform .2s;
}
.back-home:hover .arrow {
    transform: translateX(-3px);
}

/* 移动端微调 */
@media (max-width: 640px) {
    .app-header .header-left { gap: 10px; }
    .back-home { padding: 6px 13px 6px 10px; font-size: 12.5px; }
}
    </style>
</head>
<body>

    <div class="app-header">
        <div class="header-left">
    <a href="../index.html" class="back-home" title="返回主页">
        <span class="arrow">⬅</span><span>主页</span>
    </a>
    <h1>🧮 南开经济学 · 计算要点记忆卡</h1>
</div>
        <div class="stats">
            <span>📚 总卡 <span class="num" id="totalCards">0</span></span>

          answer: `柯布-道格拉斯函数不但多年常考，且是经济学中一个非常典型和有用处的函数形式，也是一重要的分析运用工具（常常作为效用函数、生产函数、经济增长函数等的代表形式出现和考查）。

**一、柯布-道格拉斯效用函数求最优化问题及其基本结论**

柯布-道格拉斯效用函数：u(x₁,x₂) = x₁^c · x₂^d。
由于任何效用函数的单调变换都保持原来的偏好关系，因此出于计算方便的考虑，可将上式取对数变成对数形式：
$$ln u(x₁,x₂) = c·ln x₁ + d·ln x₂

下面求解该效用函数中商品1和商品2的需求函数。最大化问题是：
$$max c·ln x₁ + d·ln x₂   s.t.  p₁x₁ + p₂x₂ = m

【法一】分别写出 MRS 条件和预算约束条件，消费者效用最大化的均衡条件是边际效用之比等于价格比：
$$MRS₁₂ = MU₁/MU₂ = (c·x₂)/(d·x₁) = p₁/p₂
$$p₁x₁ + p₂x₂ = m
联立解得：
$$x₁ = [c/(c+d)]·(m/p₁)，  x₂ = [d/(c+d)]·(m/p₂)

【法二】一开始就将预算约束代入目标函数（化为一元函数求极值问题）：
$$max c·ln x₁ + d·ln[(m − p₁x₁)/p₂]
一阶条件为：
$$c/x₁ − d·[p₂/(m − p₁x₁)]·(p₁/p₂) = 0
解出 x₁ = [c/(c+d)]·(m/p₁)，x₂ = [d/(c+d)]·(m/p₂)。

【法三】使用拉格朗日方法（建议平时做题时也使用此方法）：
$$L = c·ln x₁ + d·ln x₂ − λ(p₁x₁ + p₂x₂ − m)
$$∂L/∂x₁ = c/x₁ − λp₁ = 0
$$∂L/∂x₂ = d/x₂ − λp₂ = 0
$$∂L/∂λ = m − p₁x₁ − p₂x₂ = 0
重新整理前两式可得 x₂ = (p₁/p₂)(d/c)x₁，将其代入第三式解得 x₁、x₂。

于是得到关于柯布-道格拉斯效用函数的两个结论：
**结论1**：消费者花费在每种商品上的支出占收入的比例是固定的，两种商品支出占收入的比例分别为 p₁x₁/m = c/(c+d)、p₂x₂/m = d/(c+d)，这一比例的大小取决于柯布-道格拉斯函数中变量的指数。
**结论2**：消费者对每种商品的需求仅与自身收入和自身商品的价格有关，而与其他商品价格无关，因此每种商品需求的交叉价格弹性为零。

**二、柯布-道格拉斯效用函数关于弹性的三个结论**

如果 u(x,y) = x^a · y^(1−a)，商品 x、y 的价格分别为 p_x、p_y，消费者收入为 m，则如下三个弹性结论成立：
$$e(x, p_x) = −1   （需求价格弹性）
$$e(x, p_y) = 0    （交叉价格弹性）
$$e(x, m) = 1      （收入弹性）

证明：从效用函数中得到的需求函数为 x = a·m/p_x，y = (1−a)·m/p_y，代入弹性定义即可验证。
（1）x 的需求弹性 e(x,p_x) = (∂x/∂p_x)·(p_x/x) = (−am/p_x²)·(p_x/(am/p_x)) = −1；
（2）x 的替代弹性 e(x,p_y) = (∂x/∂p_y)·(p_y/x) = 0；
（3）x 的收入弹性 e(x,m) = (∂x/∂m)·(m/x) = (a/p_x)·(m/(am/p_x)) = 1。

**三、常用结论速记**

若 u(x,y) = x^c·y^d，均衡时：
$$x = [c/(c+d)]·(m/p_x)，  y = [d/(c+d)]·(m/p_y)
如果使用变量的指数之和为1的柯布-道格拉斯函数是非常方便的。例如 u(x,y) = x^a·y^(1−a)，则我们立即可将 a 解释为花费在商品 x 上的收入比例。`,

        { id: 't2q1', special: '专题二', qid: '练习1',
          question: `1、假设某消费者的效用函数是 U = x³y，他会把收入的多少用于商品 y 上？（贸大2012年考题）`,
          answer: `解：假设商品价格为 p_x、p_y，消费者收入为 m。

此时消费者效用最大化问题为：
$$max x³y   s.t.  p_x·x + p_y·y = m

构造拉格朗日函数：L = x³y − λ(p_x·x + p_y·y − m)，由一阶条件可得：
$$∂L/∂x = 3x²y − λp_x = 0
$$∂L/∂y = x³ − λp_y = 0
$$∂L/∂λ = m − p_x·x − p_y·y = 0

解得需求函数为：
$$x = 3m/(4p_x)，  y = m/(4p_y)

所以消费者在商品 y 上的支出占收入的比例为：

        { id: 't2q2', special: '专题二', qid: '练习2',
          question: `2、假设某消费者消费 X 和 Y 两种商品，两者的价格分别为 P_X 和 P_Y，消费者收入为 M，消费者的效用函数为柯布-道格拉斯形式，即 U = XY，这意味着消费者消费 X 的边际效用为 Y，即 MU_X = Y，而消费 Y 的边际效用为 X，即 MU_Y = X。请回答如下问题：
（1）该消费者对 X 的需求取决于哪些因素？推算出需求函数来。
（2）从数学公式中看，消费者偏好是通过什么途径影响需求的？
（3）X 和 Y 是互补商品还是替代商品？为什么？
（4）X 与 Y 是正常商品还是低劣商品？为什么？
（5）效用函数 U = XY 是否可以说明序数效用论？为什么？
（6）商品的边际替代率是什么？
（7）在这个问题里体现了微观经济学最基本的出发点（基本假设），它们是什么？（武汉大学考题）`,
          answer: `解：（1）该消费者效用最大化问题为：
$$max XY   s.t.  P_X·X + P_Y·Y = M

构造拉格朗日函数：L = XY − λ(P_X·X + P_Y·Y − M)
最优选择必定满足以下三个条件：
$$∂L/∂X = Y − λP_X = 0
$$∂L/∂Y = X − λP_Y = 0
$$∂L/∂λ = M − P_X·X − P_Y·Y = 0

解得：
$$X = M/(2P_X)，  Y = M/(2P_Y)
其中 X = M/(2P_X) 是消费者对 X 的需求函数，Y = M/(2P_Y) 是消费者对 Y 的需求函数。故可知消费者对 X 的需求取决于收入和 X 的价格；消费者对 Y 的需求取决于收入和 Y 的价格。【柯布-道格拉斯函数的结论】

（2）根据消费者对 X 的需求函数可以看出，消费者的偏好（效用 U）并不进入消费者的需求函数，所以消费者的偏好通过影响消费者的效用函数来影响消费者的需求函数。

（3）X 与 Y 既不是替代品，也不是互补品。因为商品 X 的需求量与商品 Y 的价格不相关，即 X 的需求量不会对商品 Y 的价格的变动做出反应，相应的需求的交叉价格弹性为零。【柯布-道格拉斯函数的结论】

（4）由于 dX/dM = 1/(2P_X) > 0，dY/dM = 1/(2P_Y) > 0，所以当收入增加时，对商品 X 和 Y 的需求都会增加，所以二者都是正常商品。

（5）效用函数 U = XY 可以说明序数效用论。序数效用论认为，商品给消费者带来的效用大小应用顺序或等级来表示。由于消费者偏好于更高无差异曲线上的各点，所以，更高无差异曲线上物品的组合提供了更高的效用。可以对 U = XY 中的 U 赋予不同的值，来表示一个选择的顺序，形成一组无差异曲线，使赋值较高的无差异曲线表示较为偏好的顺序，即可说明序数效用论。

（6）在维持效用水平不变的前提下，消费者增加一单位某种商品的消费数量时所需要的放弃的另一种商品的消费数量，被称为商品的边际替代率，即：
$$MRS = −∂Y/∂X = MU_X/MU_Y = Y/X

（7）在这个问题里体现了微观经济学最基本的出发点（基本假设），即：
① 理性人假设。假设每一个从事经济活动的人所采取的经济行为都是力图以自己的最小经济代价去获得自己的最大经济利益，即消费者追求效用最大化。
② 资源稀缺性假设。在充满稀缺性的世界里，用稀缺资源生产或消费某种物品都是有代价的，每个经济主体都要面临权衡取舍。`,

        /* ==================== 专题三 · 替代效应与收入效应 ==================== */
        { id: 't3k', special: '专题三', qid: '知识要点',
          question: '专题三 · 替代效应和收入效应计算题｜全部知识点总结',
          answer: `【提示】这一部分的斯勒茨基分解法属于中级教材知识点，大家可以等看范里安教材时再看斯勒茨基分解法，或者先单独去看一下范里安第9版91–95页对应部分的讲解。

**一、希克斯分解法（高鸿业教材）**

假设商品 x 和商品 y 的初始价格分别为 p_x 和 p_y，现在商品 x 价格变为 p_x'，消费者收入为 m，效用函数为 U(x,y)。

（1）由效用最大化解出消费者初始的最优消费组合：
$$max U = U(x,y)   s.t.  p_x·x + p_y·y = m
可解得：x₁，y₁，U₁

（2）由效用最大化解出价格变动后的最优消费组合：
$$max U = U(x,y)   s.t.  p_x'·x + p_y·y = m
可解得：x₂，y₂

（3）根据希克斯分解法的定义，由支出最小化解出使得原效用保持不变的最优消费组合：
$$min p_x'·x + p_y·y   s.t.  U(x,y) = U₁
可解得：x₃，y₃

最终可得出商品 x 的：
$$替代效应 = x₃ − x₁，  收入效应 = x₂ − x₃，  总效应 = x₂ − x₁

**二、斯勒茨基分解法（范里安教材）**

假设商品 x 和商品 y 的初始价格分别为 p_x 和 p_y，现在商品 x 价格变为 p_x'，消费者收入为 m，效用函数为 U(x,y)。

（1）由效用最大化解出消费者初始的最优消费组合：
$$max U = U(x,y)   s.t.  p_x·x + p_y·y = m
可解得：x₁，y₁

（2）由效用最大化解出价格变动后的最优消费组合：
$$max U = U(x,y)   s.t.  p_x'·x + p_y·y = m
可解得：x₂，y₂

（3）根据斯勒茨基分解法的定义，保持原有购买力（能买得起原消费束）：
$$max U(x,y)   s.t.  p_x'·x + p_y·y = p_x'·x₁ + p_y·y₁
可解得：x₃，y₃

最终可得出商品 x 的：
$$替代效应 = x₃ − x₁，  收入效应 = x₂ − x₃，  总效应 = x₂ − x₁

**三、两种分解法的关键区别**

希克斯分解法：保持原效用水平不变（补偿预算线与原无差异曲线相切）；
斯勒茨基分解法：保持原购买力不变（补偿预算线通过原消费束）。
斯勒茨基替代效应的绝对值一般小于希克斯替代效应的绝对值。`,
          hasImage: false },

        { id: 't3q1', special: '专题三', qid: '练习1',
          question: `1、小明的效用函数为 U(P,B) = P^(1/3)·B^(2/3)，P 和 B 分别表示土豆和牛肉的数量。一直以来，土豆和牛肉的价格分别为2和4，小明每天的收入为12。但是某天突然爆发了疯牛病，导致牛肉的价格跌到3。请问：
（1）在疯牛病爆发之前，小明每天消费的土豆和牛肉分别是多少？
（2）在疯牛病爆发之后，小明每天消费的土豆和牛肉分别是多少？
（3）请画图说明小明消费牛肉的数量变化情况，并将其分解为替代效应和收入效应。（贺大2021年考题）
【对外经贸的参考书是平狄克，平狄克教材上用的是希克斯分解法，所以这里答案给出的是希克斯分解法，斯勒茨基分解法的求解留作大家自行练习】`,
          answer: `解：（1）假设土豆和牛肉的价格分别为 p_P、p_B，小明的收入为 m。
则小明效用最大化问题为：
$$max P^(1/3)·B^(2/3)   s.t.  p_P·P + p_B·B = m
构造拉格朗日函数并由一阶条件解得需求函数：
$$P = m/(3p_P)，  B = 2m/(3p_B)
疯牛病爆发之前，p_P = 2，p_B = 4，m = 12，所以此时消费量：
$$P = 2，  B = 2

（2）疯牛病爆发之后，p_P = 2，p_B' = 3，m = 12。
代入（1）中需求函数，求得此时的消费量：
$$P' = 2，  B' = 8/3

（3）初始效用水平为 U = P^(1/3)·B^(2/3) = 2。
在新的价格水平下实现初始的效用水平，小明的支出最小化问题为 P^(1/3)·B^(2/3) = 2，构造拉格朗日函数并由一阶条件解得：
$$P'' = ∛36 / 2，  B'' = 2∛36 / 3
所以：
$$替代效应 = B'' − B = 2∛36/3 − 2
$$收入效应 = B' − B'' = (8 − 2∛36)/3

作图如下（横轴为牛肉数量 B，纵轴为土豆数量 P，画出原预算线、新预算线、补偿预算线及三个均衡点）。
【本题有图示】`,

        { id: 't3q2', special: '专题三', qid: '练习2',
          question: `2、消费者的效用函数为 U(x,y) = √(xy)，收入 m = 120，商品价格分别为 p_x = 10，p_y = 8。请计算：
（1）消费者均衡是多少；
（2）当商品 x 价格下降为 p_x' = 6，价格变化的斯勒茨基替代效应和收入效应分别是多少；
（3）当商品 x 价格下降为 p_x' = 6，价格变化的希克斯替代效应和收入效应分别是多少。`,
          answer: `解：（1）【法一】消费者效用最大化问题为：
$$max √(xy)   s.t.  10x + 8y = 120
构造拉格朗日函数并由一阶条件可以解得：x₁ = 6，y₁ = 7.5

【法二】由柯布-道格拉斯效用函数的基本性质可知：
$$x = [a/(a+β)]·(m/p_x)，  y = [β/(a+β)]·(m/p_y)
代入 a = 1/2，β = 1/2，p_x = 10，p_y = 8，m = 120 可得：x₁ = 6，y₁ = 7.5

（2）价格变化后消费者效用最大化问题为：
$$max √(xy)   s.t.  6x + 8y = 120
构造拉格朗日函数并由一阶条件可以解得：x₂ = 10，y₂ = 7.5

在新的价格水平下，消费者能消费得起初始消费束所需要的收入：
$$m' = p_x'·x₁ + p_y·y₁ = 6×6 + 8×7.5 = 96
此时消费者面临的问题为：
$$max √(xy)   s.t.  6x + 8y = 96
构造拉格朗日函数并由一阶条件可以解得：x₃ = 8，y₃ = 6

因此：
$$斯勒茨基替代效应 = x₃ − x₁ = 8 − 6 = 2
$$收入效应 = x₂ − x₃ = 10 − 8 = 2
$$总效应 = x₂ − x₁ = 10 − 6 = 4

（3）由（1）（2）可知：
价格变化前消费者对两种商品的消费量为 x₁ = 6，y₁ = 7.5，初始效用水平 U₁ = √(6 × 7.5) = 3√5。
价格变化后消费者对两种商品的消费量为 x₂ = 10，y₂ = 7.5。

为求希克斯替代效应，此时消费者面临的问题为：
$$min 6x + 8y   s.t.  √(xy) = 3√5
构造拉格朗日函数并由一阶条件可以解得：
$$x₃' = 2√15，  y₃' = (3/2)√15
因此：
$$希克斯替代效应 = x₃' − x₁ = 2√15 − 6 = 2(√15 − 3)
$$收入效应 = x₂ − x₃' = 10 − 2√15 = 2(5 − √15)
$$总效应 = x₂ − x₁ = 10 − 6 = 4

【提示】本题是一道非常常规的题，通过本题大家需要回顾和进一步熟练前面给大家总结的斯勒茨基分解法下以及希克斯分解法下替代效应和收入效应的解题思路。`,

        { id: 't3q3', special: '专题三', qid: '练习3',
          question: `3、假设小明喜欢吃羊肉串（x）和啤酒（y），两者的价格分别为 p_x、p_y，收入为 I，其效用函数为 u(x,y) = min(x, y/2)。
（1）如果羊肉串和啤酒的相对价格发生变动，是否会改变小明对这两种物品的消费比例？
（2）计算小明对羊肉串和啤酒这两种物品的需求函数。
（3）当价格体系由 (p_x, p_y) = (2, 2) 变为 (p_x', p_y) = (1, 2)，求商品 x 的斯勒茨基替代效应和收入效应。`,
          answer: `解：（1）即使羊肉串和啤酒的相对价格发生变动，也不会改变小明对这两种物品的消费比例，因为小明的效用函数为 u(x,y) = min(x, y/2)，这表明对于小明，羊肉串和啤酒是两种完全互补的商品，使得小明效用最大化的消费比例满足 x = y/2。

（2）将 x = y/2 代入预算约束线 p_x·x + p_y·y = I，可得小明对羊肉串的需求函数为：
$$x = I/(p_x + 2p_y)
对啤酒的需求函数为：
$$y = 2I/(p_x + 2p_y)

（3）由（2）可知需求函数 x = I/(p_x + 2p_y)，y = 2I/(p_x + 2p_y)。
代入 p_x = 2，p_y = 2 可得初始消费量：
$$x = I/6，  y = I/3
代入 p_x' = 1，p_y = 2 可得新的消费量：
$$x' = I/5，  y' = 2I/5

在新的价格水平下，能够买得起初始消费束所需要的收入水平为：
$$I' = 1×(I/6) + 2×(I/3) = 5I/6
此时消费者效用最大化问题为：
$$max min(x, y/2)   s.t.  x + 2y = 5I/6
解得：
$$x'' = I/6，  y'' = I/3
所以：
$$替代效应 = x'' − x = I/6 − I/6 = 0
$$收入效应 = x' − x'' = I/5 − I/6 = I/30
$$总效应 = I/30`,

        /* ==================== 专题四 · 补偿变化与等价变化 ==================== */
        { id: 't4k', special: '专题四', qid: '知识要点',
          question: '专题四 · 补偿变化和等价变化计算题｜全部知识点总结',
          answer: `【提示】这一部分属于中级教材知识点，大家可以等看范里安教材时再做这一部分思路总结和题目。

**一、补偿变化（CV）一般解题步骤**

价格变化之后使消费者回复到初始无差异曲线上（初始效用上）所必须的收入变化称之为收入的补偿变化，这种收入变化刚好补偿了价格变化给消费者带来的影响。这种补偿变化测度的是如果想要准确地补偿受价格变动影响的消费者，就必须给予消费者多少额外货币。

假设商品 x 和商品 y 的初始价格分别为 p_x 和 p_y，消费者收入为 m，现在商品 x 价格变为 p_x'，效用函数为 U(x,y)，求补偿变化。

（1）由效用最大化求出价格变动前的最优消费组合及其对应的效用水平：
$$max U = U(x,y)   s.t.  p_x·x + p_y·y = m
可解得：x₁，y₁，U₁

（2）求出价格变化后为使得消费者效用维持在 U₁ 所需要的最小支出：
$$min p_x'·x + p_y·y   s.t.  U(x,y) = U₁
可解得：x₂，y₂，m' = p_x'·x₂ + p_y·y₂

则补偿变化：
$$CV = m' − m

【提示】补偿变化一句话总结就是：**新价格原效用**。

**二、等价变化（EV）一般解题步骤**

价格变化以前必须从消费者那里取走多少货币，才能使他的境况同他在价格变化以后的境况（变化后的效用）一样好。等价变化测度的是消费者为了避免价格变动而愿意付出的最大收入量。

（1）由效用最大化求出价格变动后的消费者最优选择及对应的效用水平：
$$max U(x,y)   s.t.  p_x'·x + p_y·y = m
可解得：x₁，y₁，U₁

（2）求出消费者为维持价格变动后的效用水平所愿意付出的最小支出量：
$$min p_x·x + p_y·y   s.t.  U(x,y) = U₁
可解得：x₂，y₂，m' = p_x·x₂ + p_y·y₂

则等价变化：
$$EV = m − m'

【提示】等价变化一句话总结就是：**原价格新效用**。

**三、利用支出函数求补偿变化和等价变化**

前面总结的解题思路是一般思路，下面我们借助支出函数来求补偿变化和等价变化。
由既定预算约束下效用最大化可以求得马歇尔需求函数，将马歇尔需求函数代入效用函数，可得间接效用函数 V = V(p_x, p_y, m)；由间接效用函数和支出函数的对偶性可得支出函数 E = E(p_x, p_y, U)。

$$补偿变化：CV = E(p_x', p_y, U₀) − E(p_x, p_y, U₀)
$$等价变化：EV = E(p_x, p_y, U₀) − E(p_x, p_y, U₁)

【提示】这一方法可以等学习完拔高阶段以后再进行了解，掌握这里的方法在计算补偿变化和等价变化时可以节省很多时间。

**四、CV 与 EV 的符号与经济含义**

补偿变化和等价变化是具有经济学含义的，二者并不总是为正：
（1）当价格上升时，补偿变化与等价变化均为正值，表明此时需要补偿消费者一部分收入使其在新价格下回到初始价格水平，也表明此时需要拿走消费者一部分收入使其在原价格水平下实现新的效用水平；
（2）当价格下降时，补偿变化与等价变化均为负值，此时表明需要拿走消费者一部分收入使其在新价格下回到初始价格水平，也表明此时需要补偿消费者一部分收入使其在原价格水平下实现新的效用水平。`,
          hasImage: false },

        { id: 't4q1', special: '专题四', qid: '练习1',
          question: `1、消费者的效用函数为 U(x₁,x₂) = √(x₁x₂)，商品 x₁ 和 x₂ 的价格为 p₁ 和 p₂，收入为 y。
（1）假设商品 x₁ 和 x₂ 的价格为 p₁ = 1 和 p₂ = 2，该消费者收入为 y = 100，求该消费者对两种商品的需求量。
（2）若商品 x₁ 价格升至2，即此时 p₁' = p₂ = 2，该消费者收入不变。求此价格变化对商品 x₁ 产生的替代效应和收入效应。
（3）求此时的补偿变化（CV）和等价变化（EV）。`,
          answer: `解：（1）消费者效用最大化问题为：
$$max √(x₁x₂)   s.t.  x₁ + 2x₂ = 100

此时消费者的效用为：
$$u = √(x₁x₂) = 25√2

（2）① 希克斯分解法
若商品 x₁ 价格升至2，此时消费者效用最大化问题为：
$$max √(x₁x₂)   s.t.  2x₁ + 2x₂ = 100
由 C-D 效用函数基本结论可知：
$$x₁' = y/(2p₁') = 25，  x₂' = y/(2p₂) = 25
此时消费者的效用为 u' = √(x₁'x₂') = 25。
若想维持初始的效用水平 u = 25√2，此时消费者支出最小化问题为：
$$min 2x₁ + 2x₂   s.t.  √(x₁x₂) = 25√2
构造拉格朗日并由一阶条件可得：
$$x₁'' = 25√2，  x₂'' = 25√2
因此商品 x₁ 价格上升的：
$$替代效应 = x₁'' − x₁ = 25(√2 − 2)
$$收入效应 = x₁' − x₁'' = 25(1 − √2)
$$总效应 = x₁' − x₁ = −25

② 斯勒茨基分解法
要使得原始购买力保持不变，则收入水平应调整为：
$$y' = p₁'·x₁ + p₂·x₂ = 2×50 + 2×25 = 150
此时消费者效用最大化问题为：
$$max √(x₁x₂)   s.t.  2x₁ + 2x₂ = 150
由 C-D 效用函数基本结论可知：x₁'' = 37.5，x₂'' = 37.5
因此商品 x₁ 价格上升的：
$$替代效应 = x₁'' − x₁ = −12.5
$$收入效应 = x₁' − x₁'' = −12.5
$$总效应 = x₁' − x₁ = −25

（3）① 补偿变化
若想维持初始的效用水平 u = 25√2，此时消费者支出最小化问题为：
$$min 2x₁ + 2x₂   s.t.  √(x₁x₂) = 25√2
构造拉格朗日并由一阶条件可得：x₁'' = 25√2，x₂'' = 25√2。
此时的最小支出为：
$$y'' = 25√2 × 2 + 25√2 × 2 = 100√2
因此补偿变化为：
$$CV = y'' − y = 100(√2 − 1)

② 等价变化
若想维持新的效用水平 u' = 25，此时消费者支出最小化问题为：
$$min x₁ + 2x₂   s.t.  √(x₁x₂) = 25
构造拉格朗日并由一阶条件可得：
$$x₁'' = 25√2，  x₂'' = 12.5√2
此时的最小支出为：
$$y''' = 25√2 × 1 + 12.5√2 × 2 = 50√2
因此等价变化为：
$$EV = y − y''' = 50(2 − √2)

【提示1】利用支出函数求补偿变化和等价变化的解法：
商品 x₁ 和 x₂ 的马歇尔需求函数：x₁ = y/(2p₁)，x₂ = y/(2p₂)。
将马歇尔需求函数代入效用函数 U = √(x₁x₂) 得间接效用函数：
$$v = √(x₁x₂) = y/(2√(p₁p₂))
由间接效用函数得出支出函数：
$$e = 2u√(p₁p₂)
$$补偿变化：CV = 2×25√2×√(2×2) − 2×25√2×√(1×2) = 100(√2 − 1)
$$等价变化：EV = 2×25√2×√(1×2) − 2×25×√(1×2) = 50(2 − √2)

【提示2】补偿变化和等价变化是具有经济学含义的，二者并不总是为正，详见知识要点卡片。`,

        { id: 't4q2', special: '专题四', qid: '练习2',

构造拉格朗日函数并由一阶条件可以解得：

（2）① 斯勒茨基分解法
当 X 的价格上涨到2时，小明的效用最大化问题为：
$$max 2xy + 1   s.t.  2x + y = 20
可以解得：x' = 5，y' = 10，所以总效应：x' − x = −5。
令 m' 指价格变化之后为保持原来消费束的新收入水平，所以：

此时的问题为：

可以解得：x'' = 7.5
所以替代效应为：

收入效应为：

        { id: 't4q3', special: '专题四', qid: '练习3',
          question: `3、已知消费者只消费两种商品，效用函数是 u = √(xy)，x 价格为10元，y 价格是5元，财富为500元。请回答下列问题。
（1）计算边际替代率，判断该消费者是否具有凸偏好？
（2）求解消费者最优需求。
（3）政府对每单位商品 x 征收5元的消费税，那么为了使得消费者福利水平不变，政府应给予消费者多少补贴？`,
          answer: `解：（1）该消费者的边际替代率为：
$$MRSxy = −dy/dx = MUx/MUy = [(1/2)x^(−1/2)y^(1/2)] / [(1/2)x^(1/2)y^(−1/2)] = y/x

所以该消费者的边际替代率递减，具有凸偏好。

（2）此时消费者效用最大化问题为：
$$max √(xy)   s.t.  p_x·x + p_y·y = m
构造拉格朗日函数并由一阶条件解得需求函数为：
$$x = m/(2p_x)，  y = m/(2p_y)

$$x = 25，  y = 50

$$min 15x + 5y   s.t.  √(xy) = 25√2

$$x' = (25/3)√6，  y' = 25√6
此时需要的收入：
$$m' = 15x' + 5y' = 15 × (25/3)√6 + 5 × 25√6 = 250√6
因此，政府应给予消费者 250√6 − 500 的补贴。

【法二】由（2）可得，需求函数为 x = m/(2p_x)，y = m/(2p_y)。

由间接效用函数和支出函数的关系可得支出函数为：

【提示1】边际效用之比等于价格之比（拉格朗日法）只适用于边际替代率递减的效用函数。对于课本上没有的（除柯布-道格拉斯、完全替代、完全互补、拟线性偏好、凹偏好以外）效用函数，在求最优选择前大家最好验证一下其边际替代率是否是递减的。

        /* ==================== 专题五 · 跨期消费问题 ==================== */
        { id: 't5k', special: '专题五', qid: '知识要点',
          question: '专题五 · 跨期问题常见计算题类型总结｜全部知识点总结',
          answer: `主要的类型有两类假设前提：

**1、不存在借贷约束，且两期都有收入**

（1）消费者的跨期预算约束：
现值表达式：
$$C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)
终值表达式：
$$(1+r)C₁ + C₂ = (1+r)Y₁ + Y₂

当 C₁ = 0 时，即两期的收入全部用于 C₂，C₂ = (1+r)Y₁ + Y₂；
当 C₂ = 0 时，即两期的收入全部用于 C₁，C₁ = Y₁ + Y₂/(1+r)。

【提示】跨期消费预算约束的构造思路：
第一步，先根据题意写出第二期的消费量 C₂，如 C₂ = Y₂ + (1+r)(Y₁ − C₁)；
第二步，分别将两期消费和两期收入移动到同一侧，整理后即可得到预算约束。

（2）两种方法求解消费者的最优选择：
【法一】拉格朗日乘数法。
【法二】根据均衡时边际效用之比等于预算线的斜率的绝对值：
$$MU₁/MU₂ = 1 + r
【注】两种方法本质上都是一样的，法二更简便，建议首选法二以节省时间。

**2、不存在借贷约束，且只有第一期有收入**

第一期收入为 w，消费为 C₁，储蓄为 s，第二期无收入，消费为 C₂，利率为 r。
此时的约束条件为：
$$C₁ + s = w，  C₂ = (1+r)s
整理可以得到：
$$C₁ + C₂/(1+r) = w
【提示】其实本类型和一般化的预算约束是一样的，这时的预算约束仍然符合两期都有收入的预算约束 C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)，只是此时的 Y₁ = w，Y₂ = 0。此时求最优选择的思路同上。

**3、存在借贷约束，两期都有收入**

此时的预算约束为：
$$C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)，  C₁ ≤ Y₁
解题思路：
第一步，先按照无借贷约束求出消费者的最优选择，即根据最大化问题：

求出最优选择分别为 C₁*、C₂*。
第二步，比较 C₁* 与 Y₁ 的关系：
若 C₁* ≤ Y₁，则最优选择即为 C₁*、C₂*；

【提示】跨期消费问题的思路很简单，但是此类题目的难点主要有两处，大家在平时练习的时候需要注意：

        { id: 't5q1', special: '专题五', qid: '练习1',
          question: `1、费雪两期消费模型，C₁、C₂ 为两期消费；Y₁、Y₂ 为两期收入；r 为实际利率，p 为时间贴现因子，p 越大就越偏好第1期消费，消费者效用为 U = ln C₁ + ln C₂/(1+p)。
（1）推导预算约束式；
（2）找出最优效用条件；
（3）当 r = p 时，求两期消费（设 W = Y₁ + Y₂/(1+r)）；
（4）当 r > p 时，求两期消费，说明此时更偏好第1期还是第2期消费（设 W = Y₁ + Y₂/(1+r)）。（中财803经济学综合2023年考题）`,
          answer: `解：（1）消费者第二期的消费为：

$$MU₁/MU₂ = 1 + r

（4）将 (1+p)C₂/C₁ = 1 + r 代入预算约束 C₁ + C₂/(1+r) = W，解得两期的消费：

由于 r > p，所以 C₁ < C₂，此时消费者会更偏好第二期消费。`,
          hasImage: false },

        { id: 't5q2', special: '专题五', qid: '练习2',
          question: `2、假设消费者只进行两期消费选择，消费者两期收入分别为 Y₁、Y₂，两期消费分别为 C₁、C₂，利率为 r，消费者效用函数为 U = aC₁C₂ + β，两期结束后，消费者的收入和消费均为0，证明：
（1）1期消费与2期收入同方向变化，与利率反方向变化；
（2）1期储蓄与2期收入反方向变化；
（3）2期消费与1期收入和2期收入及利率均同方向变化。`,
          answer: `解：【法一】拉格朗日法
消费者效用最大化问题为：
$$max aC₁C₂ + β   s.t.  C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)
构建拉格朗日函数：
$$L = aC₁C₂ + β − λ[C₁ + C₂/(1+r) − Y₁ − Y₂/(1+r)]
由一阶条件可得：
$$∂L/∂C₁ = aC₂ − λ = 0
$$∂L/∂C₂ = aC₁ − λ/(1+r) = 0
$$∂L/∂λ = Y₁ + Y₂/(1+r) − C₁ − C₂/(1+r) = 0

【法二】均衡条件法
消费者的均衡条件为 MU₁/MU₂ = 1 + r。由于 U = aC₁C₂ + β，所以 MU₁ = aC₂，MU₂ = aC₁，代入 MU₁/MU₂ = 1 + r 可得：
$$C₂ = (1+r)C₁
代入消费者的预算约束 C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r) 可以解得需求函数为：
$$C₁ = (1/2)·[Y₁ + Y₂/(1+r)]
$$C₂ = (1/2)·[Y₁(1+r) + Y₂]

（1）可见 C₁ 与 Y₂ 同方向变化，与 r 反方向变化。
（2）S₁ = Y₁ − C₁ = Y₁ − (1/2)[Y₁ + Y₂/(1+r)] = (1/2)[Y₁ − Y₂/(1+r)]，可见 S₁ 与 Y₂ 反方向变化。
（3）可见 C₂ 与 Y₁、Y₂、r 均同方向变化。`,
          hasImage: false },

        { id: 't5q3', special: '专题五', qid: '练习3',
          question: `3、一个消费者生存两期，t = 1, 2。在 t = 1 时，他持有初始财富为 A，期间收入 Y₁；在 t = 2 时，收入为 Y₂。消费者的财富和收入可以用来消费（以 C 代表）或储蓄，储蓄利率为 r。假定消费者的效用函数是自然对数形式：U(C_t) = ln C_t。消费者的目标是最大化两期消费的加权效用（0 < ρ < 1）：
U(C₁) + U(C₂)/(1+ρ)
（1）如果消费者可以以 r 的利率自由借入或借出资金，写出消费者的预算约束；求出消费者的最优消费计划。
（2）如果消费者不能借入或借出资金，消费者的最优消费计划是什么？`,
          answer: `解：（1）如果消费者可以以 r 的利率自由借入或借出资金，则消费者的预算约束为：
$$C₁ + C₂/(1+r) = A + Y₁ + Y₂/(1+r)
该消费者的效用最大化问题为：
$$max ln C₁ + [1/(1+ρ)]·ln C₂
$$s.t.  C₁ + C₂/(1+r) = A + Y₁ + Y₂/(1+r)

构造拉格朗日辅助函数：
$$L = ln C₁ + [1/(1+ρ)]·ln C₂ − λ[C₁ + C₂/(1+r) − A − Y₁ − Y₂/(1+r)]
一阶条件为：
$$∂L/∂C₁ = 1/C₁ − λ = 0
$$∂L/∂C₂ = 1/[(1+ρ)C₂] − λ/(1+r) = 0
$$∂L/∂λ = A + Y₁ + Y₂/(1+r) − C₁ − C₂/(1+r) = 0
解得：
$$C₁ = [(1+ρ)/(2+ρ)]·(A + Y₁ + Y₂/(1+r))
$$C₂ = [1/(2+ρ)]·[(1+r)(A + Y₁) + Y₂]

【提示】本题的效用函数实际上还是由 U = C₁^(1+ρ)·C₂ 或 U = C₁·C₂^(1+ρ) 正单调变换所得，大家在做题时应该要及时反应过来。在利用拉格朗日法求出需求函数以后可以利用柯布-道格拉斯效用函数的结论 C₁ = [a/(a+β)]·(m/p₁)，C₂ = [β/(a+β)]·(m/p₂) 来对结果进行验证。本题的 a = 1+ρ，β = 1，p₁ = 1，p₂ = 1/(1+r)，m = A + Y₁ + Y₂/(1+r)。
考场上为了节省时间，大家在写出拉格朗日函数的一阶条件以后可以直接利用结论写出需求函数。

（2）如果消费者不能借入或借出资金，意味着 r = 0，消费者只能通过不生利息的储蓄来进行跨期消费。他在时期1最多只能花费 A + Y₁。
此时的预算约束变为：
$$C₁ + C₂ = A + Y₁ + Y₂   （C₁ ≤ A + Y₁）
重新计算消费者的最优消费计划为：
$$C₁ = [(1+ρ)/(2+ρ)]·(A + Y₁ + Y₂)
$$C₂ = [1/(2+ρ)]·(A + Y₁ + Y₂)
但要求 C₁ = [(1+ρ)/(2+ρ)]·(A + Y₁ + Y₂) ≤ A + Y₁，即 Y₂(1+ρ) ≤ A + Y₁。
如果 Y₂(1+ρ) > A + Y₁，则最优消费计划只能为：
$$C₁ = A + Y₁，  C₂ = Y₂

【提示】注意这里和前面提到的借贷约束的区别，这里是既不可以借入资金也不可以贷出资金，前面说的借贷约束是不可以借入资金，但可以进行储蓄（贷出资金）。`,
          hasImage: false },

        { id: 't5q4', special: '专题五', qid: '练习4',
          question: `4、假设一个消费者有一个两期的效用函数 u(x₁,x₂) = a·ln x₁ + (1−a)·ln x₂，其中 x₁ 是第一期的消费数量。该消费者拥有的资源禀赋是 A，包括两部分，第一期拿出其中的一部分消费，其余部分做投资留在第二期消费，投资的收益率是 r，第二期末所有资源全部消费掉。
（1）计算最优的消费配置 (x₁, x₂)；
（2）指出参数 a 的含义；
（3）解释随着 A、r 和 a 的变化，最优消费配置将发生什么样的变化。`,
          answer: `解：（1）两期选择的最优条件为：
$$MU₁/MU₂ = 1 + r
由于效用函数为 u(x₁,x₂) = a·ln x₁ + (1−a)·ln x₂，所以 MU₁ = a/x₁，MU₂ = (1−a)/x₂。
代入最优条件可得：
$$(a/x₁)·[x₂/(1−a)] = 1 + r
整理可得 x₂ = [(1−a)/a]·(1+r)·x₁，代入预算约束 x₁ + x₂/(1+r) = A，解得需求函数为：
$$x₁ = a·A，  x₂ = (1−a)(1+r)A

【提示】也可以用拉格朗日法，这里不再赘述。

（2）由（1）可知，最优消费量 x₁ = a·A，所以 x₁/A = a，因而 a 的经济含义是该消费者用于第一期消费的资源占总资源禀赋的比例。

（3）由（1）可知最优消费量 x₁ = a·A，x₂ = (1−a)(1+r)A。

因为 ∂x₁/∂A = a > 0，∂x₂/∂A = (1−a)(1+r) > 0，所以 A 的提高将导致第一期和第二期最优消费的提高。
因为 ∂x₁/∂r = 0，∂x₂/∂r = (1−a)A > 0，所以 r 的提高对第一期的最优消费没有影响，但会导致第二期最优消费的提高。`,
          hasImage: false },

        { id: 't5q5', special: '专题五', qid: '练习5',
          question: `5、假设经济中个人的生命分为两期——工作期和退休期。当个人工作时，可以获得劳动收入 Y₁；当个人退休时，没有劳动收入，必须依靠工作期储蓄的本金和所获得的利息生活。假设经济中的实际利率为 r，并假设个人在工作期的消费是退休期的消费的两倍。
（1）假设此人在工作期所得劳动收入为100万元，且储蓄的实际利率为50%。个人的储蓄为多少？在工作期和退休期的消费分别为多少？
（2）假如一个社会保障系统可以在个人退休时支付给个人相当于25%的工作期劳动收入的转移支付，其他条件不变。此时，个人的储蓄为多少？在工作期和退休期的消费分别为多少？

          answer: `解：（1）设此人工作期消费为 C₁，退休期消费为 C₂，工作期收入为 Y₁，退休期收入为 Y₂，利率为 r。

（2）此时有 C₁ = 2C₂，Y₁ = 100，Y₂ = 25，r = 0.5。

        /* ==================== 专题六 · 要素需求与产品供给函数 ==================== */
        { id: 't6k', special: '专题六', qid: '知识要点',
          question: '专题六 · 由生产函数求要素需求函数和产品供给函数｜全部知识点总结',
          answer: `【提示】这一部分属于中级教材知识点，大家可以等看范里安教材时再看这一部分思路总结和题目。（本专题微观和宏观的计算题都可能涉及到；本专题和下一专题讨论的都是完全竞争厂商长期生产的问题）

**一、一般框架**

假设企业的生产函数为 f(x₁,x₂)，两种要素 x₁、x₂ 的价格分别为 w₁、w₂，产品价格为 p。企业的利润最大化问题为：
$$max p·f(x₁,x₂) − w₁x₁ − w₂x₂
它的一阶条件为：
$$p·∂f(x₁*,x₂*)/∂x₁ − w₁ = 0
$$p·∂f(x₁*,x₂*)/∂x₂ − w₂ = 0

**二、柯布-道格拉斯生产函数的完整求解**

假设柯布-道格拉斯生产函数为 f(x₁,x₂) = x₁^a·x₂^b（a+b<1），则上述一阶条件变为：
$$p·a·x₁^(a−1)·x₂^b − w₁ = 0
$$p·b·x₁^a·x₂^(b−1) − w₂ = 0
可以解得要素需求函数为：
$$x₁(w₁,w₂,p) = [(1/p)·(w₁/a)^(1−b)·(w₂/b)^b]^[1/(a+b−1)]
$$x₂(w₁,w₂,p) = [(1/p)·(w₁/a)^a·(w₂/b)^(1−a)]^[1/(a+b−1)]

由此，我们得到了要素1和2的需求函数，要素需求函数是要素价格 (w₁,w₂) 与产品价格 p 的函数。

但是，我们还必须解出最优的产量。此时将最优要素需求量代入到柯布-道格拉斯生产函数可得：
$$y = [(1/p)^(a+b)·(w₁/a)^a·(w₂/b)^b]^[1/(a+b−1)]
这样我们就得到了柯布-道格拉斯企业的供给函数。它和上面已经推导出来的要素需求函数一起，构成了利润最大化问题的完整解。

**三、重要前提条件**

一般而言，从利润最大化模型求解要素需求函数是有前提条件的，即生产函数呈规模报酬递减。

解释：首先需要明确的是这里不管是成本最小化问题还是利润最大化问题，研究的都是长期问题。再回顾课本上学过的规模报酬与最大经济利润的关系——“如果厂商在长期的最大利润水平大于零，那么厂商的生产技术一定是规模报酬递减的”。

验证：大家可以利用柯布-道格拉斯生产函数来验证以上结论。`,
          hasImage: false },

        { id: 't6q1', special: '专题六', qid: '练习1',
          question: `1、假定某厂商的产量水平 y 由柯布-道格拉斯生产函数 y = x₁^α·x₂^β 给出，其中 0 < α + β < 1，产出的价格为 p，要素 x₁ 价格为 w₁，要素 x₂ 价格为 w₂，求出该厂商的供给函数。（提示：先求出要素的需求函数）`,
          answer: `解：厂商利润最大化问题为：
$$max π = p·x₁^α·x₂^β − w₁x₁ − w₂x₂
利润最大化的一阶条件为：
$$∂π/∂x₁ = p·α·x₁^(α−1)·x₂^β − w₁ = 0
$$∂π/∂x₂ = p·β·x₁^α·x₂^(β−1) − w₂ = 0
由以上两式可得：
$$α·x₂/(β·x₁) = w₁/w₂
代入一阶条件求得要素需求函数为：
$$x₁ = [(1/p)·(w₁/α)^(1−β)·(w₂/β)^β]^[1/(α+β−1)]
$$x₂ = [(1/p)·(w₁/α)^α·(w₂/β)^(1−α)]^[1/(α+β−1)]
代入生产函数求得供给函数为：
$$y = p^[(α+β)/(α+β−1)]·(α/w₁)^[α/(α+β−1)]·(β/w₂)^[β/(α+β−1)]`,
          hasImage: false },

        { id: 't6q2', special: '专题六', qid: '练习2',
          question: `2、已知某宏观经济中的总量生产函数 Y = K^α·L^β，α + β = 1，K 和 L 分别为两个生产要素，它们相应的价格分别为 C 和 W。假设 K 固定不变，产出 Y 的价格为 P。求出劳动需求函数。`,
          answer: `解：厂商利润最大化问题为：
$$max π = P·K^α·L^β − W·L − C·K
要求利润最大化的劳动投入，须使 dπ/dL = 0，即：
$$dπ/dL = P·β·K^α·L^(β−1) − W = 0
解得劳动需求函数为：
$$L = K·β^(1/α)·(W/P)^(−1/α)
若 K、α、β 给定，劳动需求函数可以简写为：

        /* ==================== 专题七 · 条件要素需求与成本函数 ==================== */
        { id: 't7k', special: '专题七', qid: '知识要点',
          question: '专题七 · 由生产函数求条件要素需求函数和成本函数｜全部知识点总结',
          answer: `【提示】这一部分属于中级教材知识点，大家可以等看范里安教材时再看这一部分思路总结和题目（特别是柯布-道格拉斯函数情形下的）。

**一、由既定产量下成本最小化 ⟹ 条件要素需求函数 ⟹ 成本函数**

**（1）完全互补**
假设生产技术中要素是完全互补的，考虑最简单的完全互补生产函数 f(x₁,x₂) = min{x₁,x₂}。如果我们想生产 y 单位产品，显然需要 y 单位的 x₁ 和 y 单位的 x₂。因此，最小的生产成本为：
$$c(w₁,w₂,y) = w₁y + w₂y = (w₁ + w₂)y

【提示】若生产函数的形式为 f(x₁,x₂) = min{ax₁, bx₂}，此时生产者面临的问题为：
$$min w₁x₁ + w₂x₂   s.t.  min{ax₁, bx₂} = y
解得：x₁ = y/a，x₂ = y/b。
因此厂商的成本函数为：
$$C = w₁x₁ + w₂x₂ = (w₁/a + w₂/b)y

**（2）完全替代**
如果生产技术是完全替代类型的，考虑最简单的完全替代生产函数 f(x₁,x₂) = x₁ + x₂。
既然要素1和2在生产过程中是完全替代的，显然哪种要素价格低，企业就会使用哪种要素。因此，生产 y 单位产品的最小成本是 w₁y 和 w₂y 中小的那个：
$$c(w₁,w₂,y) = min{w₁, w₂}·y

【提示】若生产函数的形式为 f(x₁,x₂) = ax₁ + bx₂，此时生产者面临的问题为：
$$min w₁x₁ + w₂x₂   s.t.  ax₁ + bx₂ = y
解得：
① 当 a/b < w₁/w₂ 时，x₁ = 0，x₂ = y/b，成本函数 C = (w₂/b)y；
② 当 a/b > w₁/w₂ 时，x₁ = y/a，x₂ = 0，成本函数 C = (w₁/a)y；
③ 当 a/b = w₁/w₂ 时，最优点为等产量线 ax₁ + bx₂ = y 上任意一点，此时成本函数 C = (w₂/b)y 或 C = (w₁/a)y。

**（3）柯布-道格拉斯生产函数**
假设柯布-道格拉斯生产函数为 f(x₁,x₂) = x₁^a·x₂^b，要素 x₁、x₂ 的价格分别为 w₁、w₂，求成本函数 c(w₁,w₂,y)。
成本函数可以进一步写成 c(w₁,w₂,y) = w₁·x₁(w₁,w₂,y) + w₂·x₂(w₁,w₂,y)，因此我们首先要求条件要素需求函数 x₁(w₁,w₂,y) 和 x₂(w₁,w₂,y)。

厂商成本最小化问题为：
$$min w₁x₁ + w₂x₂   s.t.  x₁^a·x₂^b = y

【法一】构建拉格朗日辅助函数：
$$L = w₁x₁ + w₂x₂ − λ(x₁^a·x₂^b − y)
由一阶条件可得：
$$∂L/∂x₁ = w₁ − λ·a·x₁^(a−1)·x₂^b = 0
$$∂L/∂x₂ = w₂ − λ·b·x₁^a·x₂^(b−1) = 0
$$∂L/∂λ = y − x₁^a·x₂^b = 0
解得两要素的条件要素需求函数分别为：
$$x₁ = (a/b)^[b/(a+b)]·w₁^[−b/(a+b)]·w₂^[b/(a+b)]·y^[1/(a+b)]
$$x₂ = (a/b)^[−a/(a+b)]·w₁^[a/(a+b)]·w₂^[−a/(a+b)]·y^[1/(a+b)]
代入 c(w₁,w₂,y) = w₁·x₁ + w₂·x₂，经过复杂演算我们得到成本函数。

【法二】厂商投入要素最优组合条件为 MP₁/MP₂ = w₁/w₂，得：
$$(a·x₁^(a−1)·x₂^b)/(b·x₁^a·x₂^(b−1)) = w₁/w₂
即 x₂ = (b·w₁)/(a·w₂)·x₁，代入生产函数后同上。

**二、由成本函数 ⟹ 供给函数**

完全竞争市场条件下，厂商利润最大化的原则为 p = MC，由此在前面求得的成本函数的基础上进一步可以得到厂商的供给函数。

【提示1】一般而言，从利润最大化模型求解要素需求函数是有前提条件的，即生产函数呈规模报酬递减。而从成本最小化出发求条件要素需求函数时对生产函数没有要求，规模报酬递减、不变和递增都适用。
【提示2】至此，专题六和专题七分别给大家提供了两种求厂商长期供给函数的思路，这里再给大家捋一遍思路：
（1）厂商利润最大化 ⟹ 要素需求函数 x₁(w₁,w₂,p)、x₂(w₁,w₂,p) ⟹ 代入生产函数得到供给函数 Q = Q(w₁,w₂,p)；
（2）既定产量下成本最小化 ⟹ 条件要素需求函数 x₁(w₁,w₂,y)、x₂(w₁,w₂,y) ⟹ 代入 C = w₁x₁ + w₂x₂ 得到成本函数 C(w₁,w₂,y) ⟹ 完全竞争市场 p = MC 得到厂商的供给函数。`,
          hasImage: false },

        { id: 't7q1', special: '专题七', qid: '练习1',
          question: `1、假设生产函数为 q = A·L^α·K^β，其中 0 < α, β < 1，同时假设劳动和资本的价格 w₁、w₂ 都保持不变。

          answer: `解：（1）短期内资本的投入量保持不变，设 K = K̄，那么 q = A·L^α·K̄^β，则 L = (q/(A·K̄^β))^(1/α)。

$$∂f/∂L = w₁ − λ·α·A·L^(α−1)·K^β = 0

将 K = (β·w₁)/(α·w₂)·L 代入约束条件解得：

因此，长期成本函数为：

（3）长期平均成本函数为：

（4）厂商利润最大化问题为：

由利润最大化的一阶条件可得：

整理得 K = (w₁/w₂)·(β/α)·L，将其代入一阶条件可解得要素需求函数：
$$L = [(1/(P·A))·(w₁/α)^(1−β)·(w₂/β)^β]^[1/(α+β−1)]
$$K = [(1/(P·A))·(w₁/α)^α·(w₂/β)^(1−α)]^[1/(α+β−1)]

（5）由（4）可得厂商要素需求函数，将其代入生产函数可得厂商供给函数为：
$$Q = [(1/(P^(α+β)·A))·(w₁/α)^α·(w₂/β)^β]^[1/(α+β−1)]`,

        /* ==================== 专题八 · 一厂商多工厂 ==================== */
        { id: 't8k', special: '专题八', qid: '知识要点',
          question: '专题八 · 一厂商多工厂问题与等边际法则｜全部知识点总结',
          answer: `【提示】这一部分属于中级教材知识点，大家可以等看范里安教材时再看这一部分思路总结和题目。经济学院2008年、2012年真题和金融学院2024年真题都考过一厂商多工厂分配产量的问题。

**1、问题概述**

假设一个厂商有两个工厂，它们的成本函数不同，工厂1和2的成本函数分别为 c₁(y₁) 和 c₂(y₂)。此时厂商想以最小的成本生产 y 单位产品。一般来说，厂商会使用两个工厂各生产一些产量。问题是，两个工厂各应该生产多少？
建立最小化问题：
$$min c₁(y₁) + c₂(y₂)   s.t.  y₁ + y₂ = y

**2、最优解的文字解释及图形说明**

可以证明，在最优产量分配处，工厂1的边际成本必定等于工厂2的边际成本。
为了证明这一点，假设边际成本不相等，那么厂商肯定会将一些产量从边际成本较高的工厂（假设是工厂1）转移到边际成本较低的工厂2，从而降低总成本。在产量转移的过程中，工厂1由于生产的产量减少，其生产最后一单位产量的边际成本是下降的，工厂2生产最后一单位产量的边际成本上升，最终两个工厂的边际成本相等。如果产量分配已达到最优，那么将产量从一家工厂移动到另一家就不可能降低成本。

【提示】注意这里的分析隐含了“边际成本曲线递增”的假设。

我们在图中，画出了上述两个工厂的边际成本曲线 MC₁(y₁) 和 MC₂(y₂)。两家工厂合在一起的边际成本曲线，就是这两个工厂各自边际成本曲线在水平方向上的加总。
对于任何既定水平的边际成本，比如 c，两个工厂将分别生产 y₁* 和 y₂* 单位，使得 MC₁(y₁*) = MC₂(y₂*)，这样我们就生产出了 y₁* + y₂* 单位产品。因此，在任一边际成本水平 c 上的产量就是当两工厂各自边际成本均等于 c 时的产量之和。
【本题有图示】

**3、最优解的数理推导**

此时厂商的成本最小化问题为：
$$min c₁(y₁) + c₂(y₂)   s.t.  y₁ + y₂ = y
构造拉格朗日函数：
$$L = c₁(y₁) + c₂(y₂) − λ(y₁ + y₂ − y)
由一阶条件可得最优解满足条件：
$$MC₁(y₁) = MC₂(y₂)

**4、特殊情况**

（1）在一定产量范围内，一个工厂边际成本的最大值还是小于另一个工厂边际成本的最小值（此时应全部由低成本工厂生产）；

        { id: 't9k', special: '专题九', qid: '知识要点',

          answer: `税收的分摊和供求双方的弹性有关系，缺乏弹性的一方承担更多的税负。常考计算题，可参见范里安第16章。

**1、前提假设**

第一，市场完全竞争，市场需求函数为 D = D(p_d)，市场供给函数为 S = S(p_s)；
第二，政府征收从量税，即政府对每单位商品征收 t 的税收。

**2、均衡结果求解**

**（1）征税前的均衡**
此时 p_d = p_s = p，直接令供求相等 D(p) = S(p) 即可求得均衡价格 p*。

**（2）对消费者征税**
此时 p_d ≠ p_s，而是满足 p_d = p_s + t，该式子的含义是消费者支付的价格 p_d 等于厂商获得的支付 p_s 加上政府税收 t，即消费者支付的价格一部分给厂商一部分给政府。
联立方程：
$$p_d = p_s + t
$$D(p_d) = S(p_s)
即可解得市场均衡价格 p' = p_d。

**（3）对生产者征税**
此时 p_d ≠ p_s，而是满足 p_s = p_d − t，该式子的含义是厂商获得的支付 p_s 等于消费者支付的价格 p_d 减去税收 t，即消费者支付的价格中政府要拿走 t，剩余部分才是厂商获得的支付。
联立方程：
$$p_s = p_d − t
$$D(p_d) = S(p_s)
即可解得市场均衡价格 p' = p_d。

**（4）结论**
无论是对消费者还是对厂商征收从量税，最终均衡结果都是相同的。

**3、税收的无谓损失**

征收从量税无谓损失通用的式子：
$$无谓损失 = (1/2) × t × (Q − Q')
其中 Q、Q' 分别为征税前后的均衡产量。它等于征税引起的社会总剩余的减少（即消费者剩余的变化、生产者剩余的变化和政府税收三者之和）。

        /* ==================== 专题十 · 三级价格歧视 ==================== */
        { id: 't10k', special: '专题十', qid: '知识要点',
          question: '专题十 · 三级价格歧视的详细探讨｜全部知识点总结',
          answer: `价格歧视作为垄断板块的一项内容，是常考的，简答题和计算题都有可能涉及，其中最常考的是一级和三级价格歧视。
往年真题考察情况：2013年简答题4和计算题2，2015年计算题1，2017年832计算题2，2021年经院880（微宏观）简答题3，2021年金院878（微宏计）简答题3，2023年经院880（微宏观）简答题3和计算题2，2024年经院877（微宏观）计算题2。
三类价格歧视的详细讲解可以见范里安第25章垄断行为，本专题主要讨论三级价格歧视相关计算题的一般性解题思路。

**1、三级价格歧视**

指垄断者对同一商品在不同的市场上收取不同的价格，或者对不同的人收取不同的价格，但使得每一市场上出售产品的边际收益相等。
实行三级价格歧视需要具备两个重要的条件：
第一个条件是存在着可以分隔的市场。若市场不可分隔，市场上的套利行为将使得价格歧视消失。
第二个条件是被分隔的各个市场上需求价格弹性不同。如果被分隔的各个市场需求价格弹性相同，则最佳策略是对同一产品收取相同的价格。

**2、在实行三级价格歧视时，总产量、细分市场产量和价格的确定**

完全垄断厂商按照 MR₁ = MR₂ = MC 的原则确定产量和价格。

**原因分析：**
【法一】经济学含义分析：这是因为，第一，就不同的市场而言，厂商应该使各个市场的边际收益相等。只要各市场之间的边际收益不相等，厂商就可以通过不同市场之间的销售量的调整，来获得更大的利益。第二，厂商应该使生产的边际成本 MC 等于各市场相等的边际收益，只要两者不等，厂商就可以通过增加或减少产量来获得更大的利益，直至实现 MR₁ = MR₂ = MC 的条件。
【法二】图形分析法：总产量 Q_T = Q₁ + Q₂ 由边际收益曲线 MR₁ 和 MR₂ 水平相加所生成的虚线联合边际收益曲线 MR_T 与边际成本曲线 MC 的交点得到。因为 MC 必须等于 MR₁ 和 MR₂，由此得到两个市场的产量分别为 Q₁ 和 Q₂。这里具有需求曲线 D₁ 的第一组的价格是 P₁，而具有更高弹性的需求曲线 D₂ 的第二组的价格是较低的 P₂。
【本题有图示】
【法三】数学推导法：令 p₁(y₁) 和 p₂(y₂) 分别表示消费者群体1和2的反需求曲线，令 c(y₁ + y₂) 表示垄断者的成本函数。则垄断者的利润最大化问题为：
$$max p₁(y₁)·y₁ + p₂(y₂)·y₂ − c(y₁ + y₂)
最优解必然满足：
$$MR₁(y₁) = MC(y₁ + y₂)
$$MR₂(y₂) = MC(y₁ + y₂)
也即是说，额外多生产一单位产品的边际成本必须等于每个市场的边际收益。由于每个市场的边际成本是相等的，这当然表示每个市场的边际收益也必须相等。
我们可以使用边际收益和需求价格弹性之间的关系，以及边际收益等于边际成本的关系，将利润最大化的一阶条件写为：
$$p₁(y₁)[1 − 1/|ε₁(y₁)|] = MC(y₁ + y₂)
$$p₂(y₂)[1 − 1/|ε₂(y₂)|] = MC(y₁ + y₂)
当 |ε₂(y₂)| > |ε₁(y₁)| 时，p₁ > p₂，即价格较高的那个市场的需求价格弹性必然较小。因此，实行价格歧视的企业，对价格敏感的消费者群体制定的价格较低，而对价格相对不敏感的群体制定相对较高的价格。这样，企业就实现了总利润的最大化。

**3、在不同细分市场实行差别定价的合理性**

通过在不同细分市场实行差别定价，对价格变化反应不灵敏的消费者制定较高的价格，而对价格变化反应灵敏的消费者制定较低的价格，这有利于垄断厂商获得更大的利润。

**4、三级价格歧视下社会福利的讨论（范里安教材334页）**

假设一家厂商面对两个具有线性需求曲线的市场，第一个市场的需求曲线 D₁ 为 x₁ = a − b·p₁，第2个市场的需求曲线 D₂ 为 x₂ = c − d·p₂，厂商的边际成本为0。

（1）厂商实行三级价格歧视时：由三级价格歧视下厂商利润最大化的条件 MR₁ = MR₂ = MC 可知：
$$(a − 2x₁)/b = (c − 2x₂)/d = 0
解得：
$$x₁* = a/2，  x₂* = c/2，  p₁* = a/(2b)，  p₂* = c/(2d)，  x* = (a + c)/2
厂商所选择的价格-产量组合位于每一条需求曲线的中点。

（2）厂商实行统一定价时：
① 如果厂商按照利润最大化原则所确定的价格在两个市场都有销量，此时厂商面临的需求曲线是 x = (a + c) − (b + d)p，由利润最大化的条件可解得：
$$x* = (a + c)/2，  p* = (a + c)/[2(b + d)]
② 如果厂商按照利润最大化原则所确定的价格只在市场1有销量，此时厂商实现最大利润时的产量为 x* = a/2。

（3）通过上面的分析可以得出这样的结论：
如果厂商一开始同时在两个市场上以相同的价格销售商品，此时厂商实行三级价格歧视，厂商所生产的总产量不变；
如果厂商一开始只在一个市场上销售商品，此时厂商实行三级价格歧视，厂商所生产的总产量增加，社会总福利增加。

$$p₁[1 − 1/|e_d1|] = p₂[1 − 1/|e_d2|] = MC
$$p₁/p₂ = [1 − 1/|e_d2|] / [1 − 1/|e_d1|]`,

        /* ==================== 专题十一 · 寡头模型均衡 ==================== */
        { id: 't11k', special: '专题十一', qid: '知识要点',
          question: '专题十一 · 寡头模型均衡问题｜全部知识点总结',
          answer: `**寡头模型分类**

非合作模型（同时定产：古诺模型；产量领导：斯塔克尔伯格模型；同时定价：伯特兰模型；价格领导：价格领导模型）；合作模型（卡特尔模型）。

**1、古诺模型（产量竞争）**

第一步，构造各寡头厂商关于自身产量的利润函数；
第二步，由利润最大化一阶条件求得每个厂商的反应函数；
第三步，联立每个厂商的反应函数求得每个厂商的产量，进而得到市场价格和每个厂商的利润。

**2、斯塔克尔伯格模型（产量领导模型）**

第一步，构造追随厂商的利润函数，并由利润最大化的一阶条件得到追随者的反应函数；
第二步，构造领导厂商的利润函数，并将追随者厂商的反应函数代入其中消掉利润函数中追随者的产量；
第三步，由利润最大化一阶条件得到领导者的产量，并将其代入追随者的反应函数得到追随者的产量，进而得到市场价格和厂商利润。

**3、伯特兰模型（价格竞争）**

当厂商的边际成本为常数时：
（1）厂商边际成本 MC₁ = MC₂ = c，市场均衡价格 p = c；
（2）厂商的边际成本分别是 MC₁ = c₁，MC₂ = c₂，且 c₁ < c₂，此时可以知道最终一定是厂商1独占市场，此时需要考虑如果厂商1按照垄断情况 MR₁ = c₁ 进行定价，垄断价格 p 是否小于 c₂，需要大家进行验算，利用厂商1利润最大化的一阶条件 MR₁ = c₁ 求得均衡的垄断价格 p：
$$若 p < c₂，此时市场均衡价格为 p
$$若 p ≥ c₂，此时市场均衡价格为 c₂ − ξ，ξ → 0

**4、价格领导模型**

第一步，追随厂商为价格接受者，由利润最大化一阶条件 P = MC 得到追随者的供给函数；
第二步，市场需求函数减去追随者供给函数得到市场剩余需求函数（如果是有多个追随者，则需要所有追随者供给函数水平加总得到追随者总的供给函数）；
第三步，根据市场剩余需求函数构造领导厂商的利润函数，利用利润最大化一阶条件得到领导者的产量，将领导者的产量代入市场剩余需求函数得到市场价格；
第四步，由市场价格得到市场总的需求量，市场总的需求量减去领导者产量即为追随者产量。

【提示】价格领导模型的解题思路直接看可能比较抽象，大家可以结合图形进行理解。
【本题有图示】

**5、卡特尔模型**

（1）一般情况：构造整个卡特尔组织的利润函数，并由一阶条件得到每个卡特尔成员的产量。最终得到卡特尔均衡条件：
$$MC₁(q₁) = MC₂(q₂) = MR(q₁ + q₂)
（2）特殊情况：每个卡特尔成员厂商的边际成本均为常数，并且某个成员的边际成本总是小于其他厂商，此时应该由边际成本最小的厂商生产所有产量，卡特尔问题转变为垄断厂商利润最大化问题。
（3）证明卡特尔成员的违约动机：假设其他成员的产量保持在卡特尔均衡的产量不变，只有一个厂商改变其产量，并构造该厂商的利润函数，利用利润最大化的一阶条件求得此时厂商的产量，并对比此时厂商的利润和违约前的利润。`,
          hasImage: true },

（2）若两个企业同时选择自己的产量进行博弈，求解均衡时两个企业分别的产量、均衡价格以及每个企业的利润；
（3）若企业1是产量领导者，企业2是追随者，即企业1先选择自己的产量，企业2根据企业1的产量选择自己的产量，求解均衡时两个企业分别的产量、均衡价格以及每个企业的利润。（中财801经济学2019年考题）`,
          answer: `解：（1）若市场中只有企业1，此时企业1利润最大化问题为：
$$max (10 − q₁)q₁ − 2q₁
由利润最大化的一阶条件：10 − 2q₁ − 2 = 0，解得此时均衡的产量 q₁ = 4，市场价格 P = 6，企业1的利润 π₁ = 16。

（2）若两个企业同时选择自己的产量进行博弈，此时为古诺竞争。
企业1利润最大化问题为：
$$max π₁ = [10 − (q₁ + q₂)]q₁ − 2q₁
由利润最大化的一阶条件：10 − 2q₁ − q₂ − 2 = 0，解得此时企业1的反应函数为：
$$q₁ = (8 − q₂)/2
企业2利润最大化问题为：
$$max π₂ = [10 − (q₁ + q₂)]q₂ − 3q₂
由利润最大化的一阶条件：10 − q₁ − 2q₂ − 3 = 0，解得此时企业2的反应函数为：
$$q₂ = (7 − q₁)/2
联立企业1和企业2的反应函数可以解得其古诺均衡时的产量分别为：
$$q₁ = 3，  q₂ = 2
$$市场均衡产量 Q = 5，  市场均衡价格 P = 5
$$企业1和企业2的利润分别为：π₁ = 9，  π₂ = 4

（3）企业2作为追随者，其利润最大化问题为：
$$max π₂ = [10 − (q₁ + q₂)]q₂ − 3q₂
由利润最大化的一阶条件：10 − q₁ − 2q₂ − 3 = 0，解得此时企业2的反应函数为：
$$q₂ = (7 − q₁)/2
企业1作为领导者知道企业2的反应函数，故其利润最大化问题为：
$$max π₁ = [10 − (q₁ + (7 − q₁)/2)]q₁ − 2q₁
由利润最大化的一阶条件可得：
$$∂π₁/∂q₁ = [10 − (q₁ + (7 − q₁)/2)] − (1/2)q₁ − 2 = 0
解得：
$$q₁ = 9/2，  故企业2的产量 q₂ = 5/4
$$市场均衡产量 Q = 23/4，  市场均衡价格 P = 17/4
$$企业1和企业2的利润分别为：π₁ = 81/8，  π₂ = 25/16`,
          hasImage: false },

        { id: 't11q2', special: '专题十一', qid: '练习2',
          question: `2、两个企业生产同质产品。市场需求函数为 p(Y) = 50 − Y，其中 Y = y₁ + y₂。两个企业的边际成本都为零。
（1）计算古诺（Cournot）均衡中的价格和每个企业的产量。
（2）计算这个行业的卡特尔（Cartel）产量。（中山大学考题）`,
          answer: `解：（1）由于固定成本不影响厂商决策，所以这里假设两个厂商的固定成本都为0。
对于厂商1而言，其利润函数为：
$$π₁ = (50 − y₁ − y₂)y₁
利润最大化的一阶条件为：
$$∂π₁/∂y₁ = 50 − 2y₁ − y₂ = 0
解得厂商1的反应函数为：
$$y₁ = 25 − y₂/2
同样的方法可得出厂商2的反应函数为：
$$y₂ = 25 − y₁/2
联立两厂商的反应函数可得：
$$y₁ = y₂ = 50/3，  市场价格 p = 50 − y₁ − y₂ = 50/3

（2）两个厂商共谋组成卡特尔，他们会谋求利润总和的最大，而不是每家厂商只求自身利润的最大。于是，利润最大化问题就变成为：
$$max π = (50 − y₁ − y₂)(y₁ + y₂) = (50 − y)y
利润最大化的一阶条件为：
$$dπ/dy = 50 − 2y = 0
求得均衡的总产量为 y = 25。`,
          hasImage: false },

        { id: 't11q3', special: '专题十一', qid: '练习3',
          question: `3、假设某商品的需求函数为 Q = 100 − P，只有两家厂商能生产这种商品。每家厂商的成本函数为 C_i = 50 + Q_i²，i = 1, 2。市场总产出是这两家厂商产出之和。
（1）若两厂商行为遵循古诺模型，则求出每家厂商的产量、价格及其总利润。
（2）若两企业组成卡特尔，则每家厂商的产量、价格及其总利润是多少？这种卡特尔稳定吗？一家厂商若首先违约，则其产量及利润为多少？
（3）若厂商1是价格领导者，厂商2是追随者，则求出每家厂商的产量及价格。`,
          answer: `解：（1）对于厂商1，其利润为：
$$π₁ = P·Q₁ − C₁ = (100 − Q₁ − Q₂)Q₁ − (50 + Q₁²)
利润最大化的一阶条件为：
$$∂π₁/∂Q₁ = 100 − 2Q₁ − Q₂ − 2Q₁ = 0
因此，厂商1的反应函数为：
$$Q₁ = (100 − Q₂)/4
同理可得厂商2的反应函数为：
$$Q₂ = (100 − Q₁)/4
联立两个厂商的反应函数，可得：
$$Q₁ = Q₂ = 20，  市场价格 P = 60
厂商的利润：π₁ = π₂ = 750，因此市场总利润 π = 1500。

（2）【法一】数学思想法
如果两个企业组成卡特尔，则两者将追求总体利润最大化。总利润为：
$$π = (100 − Q₁ − Q₂)(Q₁ + Q₂) − (50 + Q₁²) − (50 + Q₂²)
利润最大化的一阶条件为：
$$∂π/∂Q₁ = 100 − 2(Q₁ + Q₂) − 2Q₁ = 0
$$∂π/∂Q₂ = 100 − 2(Q₁ + Q₂) − 2Q₂ = 0
解得：
$$Q₁ = Q₂ = 50/3，  市场价格 P = 200/3
总利润 π = 4700/3，各厂商利润为 π₁ = π₂ = 2350/3。

一家厂商若首先违约，不妨设厂商1违约，他将假定厂商2的产量为 Q₂ = 50/3，则厂商1的利润为：
$$π₁ = (100 − Q₁ − 50/3)Q₁ − (50 + Q₁²)
利润最大化的一阶条件为：
$$∂π₁/∂Q₁ = 100 − 50/3 − 2Q₁ − 2Q₁ = 0
解得：
$$Q₁ = 125/6，  市场价格为 P = 375/6
厂商1的利润为 π₁ = 14725/18 > 2350/3。

对比结果可知，相对于两企业组成卡特尔时，一旦厂商1首先违约，厂商1获取的利润更大。出于自身利益的考虑，各厂商可能会暗中采取行动，从而获取更大的利润。由于卡特尔成员往往不多，一旦有某个成员违反协议，其行动很容易被其他厂商察觉，从而引起“连锁反应”，最终导致卡特尔崩溃。这说明卡特尔是很不稳定的。

【法二】先利用等边际法则求出厂商关于总产量的成本函数，然后利用利润最大化的条件
此时卡特尔组织成本最小化问题为：
$$min 50 + Q₁² + 50 + Q₂²   s.t.  Q₁ + Q₂ = Q
构造拉格朗日函数并由一阶条件可得 Q₁ = Q₂ = Q/2。
则卡特尔组织的成本函数为：
$$C = 50 + (Q/2)² + 50 + (Q/2)² = 100 + Q²/2
由利润最大化条件 MR = MC 可得：100 − 2Q = Q，解得总产量 Q = 100/3，每个厂商的产量 Q₁ = Q₂ = 50/3。剩下的步骤同【法一】。

（3）此时厂商2为价格的接受者，其利润最大化的条件为 P = MC₂，即 P = 2Q₂。
解得厂商2的供给函数为 Q₂ = P/2。
所以厂商1面临的剩余需求函数：
$$Q₁ = Q − Q₂ = 100 − P − P/2
即 P = 200/3 − (2/3)Q₁
厂商1的利润最大化问题为：
$$π₁ = (200/3 − (2/3)Q₁)Q₁ − 50 − Q₁²
一阶条件为：
$$dπ₁/dQ₁ = 200/3 − (4/3)Q₁ − 2Q₁ = 0
解得：
$$Q₁ = 20，  市场价格 P = 160/3，  厂商2的产量 Q₂ = 80/3`,
          hasImage: false },

        { id: 't11q4', special: '专题十一', qid: '练习4',
          question: `4、假设网球鞋市场有一家主导厂商和五家边缘厂商。市场需求为 Q = 400 − 2P。主导厂商有20的不变边际成本。每个边缘厂商有 MC = 20 + 5q 的边际成本。
（1）求解价格领导模型均衡的结果。
（2）如果有10家边缘厂商，价格领导模型均衡的结果有什么变化？`,
          answer: `解：（1）五家边缘厂商的总供给曲线是通过水平加总五家厂商的供给曲线所得到的。
由于每家追随厂商都是价格的接受者，因此每家厂商利润最大化时满足 p = MC 的条件，由此可得：
$$MC = 20 + 5q = p
整理得单个厂商的供给曲线：
$$q = P/5 − 4
因为每家企业都是相同的，所以5家厂商的总供给曲线为：
$$Q_f = 5(P/5 − 4) = P − 20
主导厂商的需求曲线是市场需求与边缘厂商总供给之间的差，即：
$$Q_L = 400 − 2P − Q_f = 420 − 3P
即 P = 140 − Q_L/3
此时主导厂商的利润最大化问题为：
$$max π = (140 − Q_L/3)Q_L − 20Q_L
由利润最大化的一阶条件可得：
$$dπ/dQ = 140 − (2/3)Q_L − 20 = 0
解得主导厂商的产量 Q_L = 180，市场价格 P = 80。
每个边缘厂商将与主导厂商索要相同的价格，5家边缘厂商的总产量为：
$$Q_f = P − 20 = 60
每家边缘厂商将生产12单位的产量。

（2）如果有10家边缘厂商，则边缘厂商的总供给曲线为：
$$Q_f = 2P − 40
从而主导厂商的总需求曲线为 Q_L = 440 − 4P，即 P = 110 − Q_L/4。
由 MR = MC = 20 可得：
$$110 − Q_L/2 = 20，  主导厂商的产量为 Q_L = 180，市场价格为 P = 65
从而每个边缘厂商的价格也将为65，10家边缘厂商的总供给为：
$$Q_f = 2×65 − 40 = 90，  每家边缘厂商的供给为9`,
          hasImage: false },

        { id: 't11q5', special: '专题十一', qid: '练习5',
          question: `5、某同质产品的市场，反需求函数为 P = 5 − Q，其中 P 为价格，Q 为需求量。供给方面有两个厂商，每个厂商除了不变的边际成本 MC_i（i = 1,2）之外，无其它成本。两个厂商同时选择价格，进行伯特兰竞争。如果某个厂商的定价严格低于另一个厂商的，则价格较低的厂商得到其定价之下的全部市场需求；如果两个厂商定价相同，则每个厂商获得该价格之下市场需求的一半。设 MC₁ = 1、MC₂ = 4。试求伯特兰均衡价格 P*。（中财803经济学综合2018年考题）`,
          answer: `解：伯特兰竞争会导致厂商竞相削价来赢得更多的市场，因此厂商1若与厂商2进行价格竞争，由于 MC₂ = 4 > MC₁ = 1，所以只要厂商1制定价格 P₁ = 4 − ε，ε 为任意小的正数，则厂商1将占据整个市场，厂商2会退出市场（P₁ < MC₂）。

当厂商1获得全部市场需求时，该产品市场为完全垄断市场，厂商1作为垄断厂商进行垄断定价。
由题意可知，厂商1的边际收益为 MR₁ = 5 − 2Q，厂商1根据 MR₁ = MC₁ 进行垄断定价，有：
$$5 − 2Q = 1，  解得 Q* = 2
代入反需求函数可得：
$$P* = 3
由于 P* = 3 < MC₂ = 4，因此厂商2仍然不会进入市场，厂商1可以维持其垄断地位并获得最大垄断利润，因此伯特兰均衡价格 P* = 3。`,
          hasImage: false },

        { id: 't11q6', special: '专题十一', qid: '练习6',
          question: `6、考虑一个由两家企业组成的寡头垄断行业，市场的需求由 p = 10 − Q 给出。这两家企业的成本函数分别为 C₁ = 4 + 2Q₁，C₂ = 3 + 3Q₂。
（1）若两家厂商串谋追求共同的利润最大化，总的产量水平是多少？市场价格是多少？各自生产多少？各自的利润多大？
（2）若两家企业追求各自的利润最大化，利用古诺模型，各自生产多少？各自利润多大？市场价格多大？并给出各自的反应函数。
（3）若串通是非法的，但收购不违法。企业1会出多少钱收购企业2？`,
          answer: `解：（1）若两家企业串谋时，它们的目标是追求总利润的最大化。
由于厂商2的边际成本为3大于厂商1的边际成本2，不能安排厂商2产量，即 Q₂ = 0。
利润最大化时要求厂商1的边际成本等于边际收益，即：
$$2 = 10 − 2Q₁，  解得 Q₁ = 4，Q₂ = 0
于是市场价格为 p = 10 − Q₁ − Q₂ = 6，厂商1的利润为12，厂商2的亏损为固定成本3。

（2）企业1的利润最大化问题为：
$$max [10 − (Q₁ + Q₂)]Q₁ − (4 + 2Q₁)
根据利润最大化的一阶条件就可以得到企业1的反应函数为：
$$Q₁ = 4 − 0.5Q₂
类似的方法可以得到企业2的反应函数为：
$$Q₂ = 3.5 − 0.5Q₁
联立厂商1和厂商2的反应函数可得古诺均衡时每家企业的产量为：
$$Q₁ = 3，  Q₂ = 2
市场价格 p = 5，厂商1和厂商2的利润分别为：
$$π₁ = 5，  π₂ = 1

（3）企业1收购了企业2后，利润为（1）中企业1的利润加企业2利润，即 12 − 3 = 9。对企业2的收购出的钱不会高于（1）（2）两种情况下的利润差，即：
$$9 − 5 = 4`,
          hasImage: false },

        { id: 't11q7', special: '专题十一', qid: '练习7',
          question: `7、假定在一个寡头市场上有两个生产同种产品的厂商，分别记为厂商1和厂商2。市场需求函数为 P = 100 − Q，其中 Q = Q₁ + Q₂，两个厂商的成本函数分别为 TC₁ = 20Q₁，TC₂ = 0.5Q₂²。
（1）假定两个厂商按古诺模型行动，求解两个厂商各自的产量和利润水平，以及行业的总利润水平。
（2）假定厂商1先决定产量，求解两个厂商各自的产量。
（3）假定厂商1先决定价格，求解两个厂商各自的产量。
（4）假定两个厂商联合行动组成卡特尔，追求共同利润最大化，求解两个厂商各自的产量和利润水平，以及行业的总利润水平。
（5）验证卡特尔成员的违约动机。`,
          answer: `解：（1）对于厂商1，其利润最大化问题为：
$$max π₁ = [100 − (Q₁ + Q₂)]Q₁ − 20Q₁
由利润最大化的一阶条件得：
$$∂π₁/∂Q₁ = 100 − (Q₁ + Q₂) − Q₁ − 20 = 0
解得厂商1的反应函数为：
$$Q₁ = 40 − Q₂/2
对于厂商2，其利润最大化问题为：
$$max π₂ = [100 − (Q₁ + Q₂)]Q₂ − 0.5Q₂²
由利润最大化的一阶条件得：
$$∂π₂/∂Q₂ = 100 − (Q₁ + Q₂) − Q₂ − Q₂ = 0
解得厂商2的反应函数为：
$$Q₂ = (100 − Q₁)/3
联立两厂商的反应函数解得：
$$Q₁ = 28，  Q₂ = 24，  P = 48
故：
$$π₁ = 784，  π₂ = 864，  π = π₁ + π₂ = 1648

（2）由（1）可知，厂商2的反应函数为 Q₂ = (100 − Q₁)/3。
所以产量领导者厂商1的利润最大化问题为：
$$max π₁ = [100 − (Q₁ + (100 − Q₁)/3)]Q₁ − 20Q₁
利润最大化的一阶条件为：
$$dπ₁/dQ₁ = 100 − (4/3)Q₁ − 100/3 − 20 = 0
解得：
$$Q₁ = 35，  所以 Q₂ = 65/3

（3）此时厂商2是价格的接受者，其利润最大化的条件为 P = MC₂，即 P = Q₂，所以厂商2的供给函数为 Q₂ = P，从而厂商1面临的剩余需求函数：
$$Q₁ = Q − Q₂ = 100 − 2P，  即 P = 50 − Q₁/2
厂商1利润最大化问题为：
$$max π₁ = (50 − Q₁/2)Q₁ − 20Q₁
利润最大化的一阶条件为：
$$dπ₁/dQ₁ = 50 − Q₁ − 20 = 0
解得 Q₁ = 30。
将其代入厂商1面临的剩余需求函数，得到市场价格 P = 35，所以市场总产量 Q = 65，厂商2的产量为 Q₂ = 35。

（4）【法一】构造卡特尔组织关于各个厂商产量的函数
整个卡特尔组织利润最大化问题为：
$$max π = [100 − (Q₁ + Q₂)](Q₁ + Q₂) − 20Q₁ − 0.5Q₂²
由利润最大化的一阶条件可得：
$$∂π/∂Q₁ = 100 − 2(Q₁ + Q₂) − 20 = 0
$$∂π/∂Q₂ = 100 − 2(Q₁ + Q₂) − Q₂ = 0
解得：
$$Q₁ = Q₂ = 20，  P = 60，  π₁ = 800，  π₂ = 1000，  π = 1800

【法二】构造卡特尔组织关于总产量的利润函数
对于整个卡特尔组织，要想实现既定产量下成本最小化需要满足：
$$min 20Q₁ + 0.5Q₂²   s.t.  Q₁ + Q₂ = Q
构造拉格朗日函数并由一阶条件可以证明此时满足条件 MC₁ = MC₂【等边际法则】。
解得 Q₁ = Q − 20，Q₂ = 20，故整个卡特尔组织的成本函数为 TC(Q) = 20Q − 200。
此时卡特尔组织利润最大化问题为：
$$max π = (100 − Q)Q − (20Q − 200)
由一阶条件可以解得 Q = 40，故 Q₁ = Q₂ = 20，所以 π₁ = 800，π₂ = 1000，π = 1800。

（5）【法一】利用利润最大化问题
不妨假设厂商2不改变产量，则厂商1此时利润最大化问题为：
$$max π₁ = [100 − (Q₁ + 20)]Q₁ − 20Q₁
利润最大化的一阶条件为：
$$dπ₁/dQ₁ = 80 − 2Q₁ − 20 = 0
解得 Q₁ = 30，市场价格 P = 50，此时厂商1的利润 π₁ = 900 > 800，所以厂商1有违约动机。

【法二】利用反应函数
由（1）可知，厂商1的反应函数为 Q₁ = 40 − Q₂/2，所以当厂商2不违约依然生产 Q₂ = 20 时，厂商1的产量为 Q₁ = 30，对应市场价格 P = 50，此时厂商1的利润 π₁ = 900 > 800，所以厂商1有违约动机。`,
          hasImage: false },

        /* ==================== 专题十二 · 契约曲线与瓦尔拉斯均衡 ==================== */
        { id: 't12k', special: '专题十二', qid: '知识要点',
          question: '专题十二 · 求解契约曲线和瓦尔拉斯均衡｜全部知识点总结',
          answer: `**题设条件：**
消费者1的初始禀赋为 (x₁⁰, y₁⁰)，效用函数为 U(x₁, y₁)；消费者2的初始禀赋为 (x₂⁰, y₂⁰)，效用函数为 U(x₂, y₂)。

**1、交换契约曲线的求解**

第一步：利用交换的一般均衡的条件：
$$MRS¹xy = MRS²xy
解得 (x₁, y₁, x₂, y₂) 之间的关系。
第二步：利用 x₁ + x₂ = x₁⁰ + x₂⁰ 和 y₁ + y₂ = y₁⁰ + y₂⁰ 消去两个变量，得到 x₁ = f(y₁) 或 x₂ = g(y₂)。
第三步：x₁ = f(y₁) 或 x₂ = g(y₂) 即为交换的契约曲线。

【提示】利用边际替代率相等的条件求交换契约曲线需要满足的前提是：两个消费者的边际替代率都是递减的。

**2、最终交换结果的求解**

【法一】
第一步：假设商品 x 的价格为1，商品 y 的价格为 p。
第二步：根据效用最大化问题求得每个消费者对于每种商品的需求。消费者1的效用最大化问题可表述为：
$$max U₁(x₁, y₁)   s.t.  x₁ + p·y₁ = x₁⁰ + p·y₁⁰
构造拉格朗日函数并由一阶条件可解得 x₁ = x₁(p)，y₁ = y₁(p)。
同理可解得消费者2的消费束 x₂ = x₂(p)，y₂ = y₂(p)。
第三步：由市场出清条件求得均衡的价格体系和消费者消费束：
$$x₁ + x₂ = x₁⁰ + x₂⁰
$$y₁ + y₂ = y₁⁰ + y₂⁰
利用上面任意一个方程即可解得相对价格体系，即 p_x/p_x = p。
将价格 p 代入消费者的需求函数即可解得消费者1和消费者2的消费束 (x₁, y₁) 和 (x₂, y₂)。

【法二】
第一步、第二步同【法一】。
第三步：将消费者1的需求函数代入之前求得的交换的契约曲线 x₁ = f(y₁) 求得价格 p。
将 x₁ = x₁(p)，y₁ = y₁(p) 代入契约曲线 x₁ = f(y₁) 得到 x₁(p) = f[y₁(p)]，一个方程，一个未知数，即可解得相对价格体系 p。

【提示】本方法适用范围：前几问已经求得契约曲线再使用此方法会比较简单。若题目没让求契约曲线，相较于【法一】，用此方法求一般均衡解会更加复杂。

**3、瓦尔拉斯均衡求解通法（务必熟练掌握）**

先求出市场中各个主体的需求函数 ⟹ 市场出清的条件求出未知量。`,

        { id: 't12q1', special: '专题十二', qid: '练习1',
          question: `1、市场上只有 A 和 B 两个消费者，A 消费者对商品 X 和商品 Y 的效用函数为 U_A = X_A²·Y_A，其初始拥有的 X 和 Y 商品禀赋为 (9, 0)；B 消费者对商品 X 和商品 Y 的效用函数为 U_B = X_B·Y_B²，其初始拥有的 X 和 Y 商品禀赋为 (0, 9)。

          answer: `解：（1）消费者A的边际替代率为：

        /* ==================== 专题十三 · 经济波动理论计算 ==================== */
        { id: 't13k', special: '专题十三', qid: '知识要点',
          question: '专题十三 · 经济波动理论具体函数计算题｜全部知识点总结',
          answer: `宏观经济学中经济波动理论主要研究的是短期经济，涉及到的模型主要包括：凯恩斯交叉模型、IS-LM模型和蒙代尔-弗莱明模型，以上模型之间的关系如下：

凯恩斯交叉模型：产品市场均衡 ⟹ IS曲线
流动性偏好理论：货币市场均衡 ⟹ LM曲线
IS-LM模型 ⟹ AD曲线
劳动力市场均衡 ⟹ AS曲线

**模型一览表**
$$凯恩斯交叉：短期封闭经济，研究产品市场均衡
$$IS-LM模型：短期封闭经济，IS为产品市场均衡，LM为货币市场均衡
$$AD-AS模型：短期封闭经济，AD为产品与货币市场同时均衡，AS为劳动力市场均衡
$$蒙代尔-弗莱明模型：短期开放经济，IS*为产品市场均衡，LM*为货币市场均衡

本专题主要讨论以上模型具体函数计算题，至于更高难度的抽象函数计算题留作大家拔高阶段掌握。

相关题目的核心思路：利用市场均衡条件，其中：
产品市场均衡条件：实际支出 Y = 计划支出 PE，其中 PE = C + I + G（封闭经济）；
货币市场均衡条件：实际货币余额供给 M/P = 实际货币余额需求 L(r, Y)。

**1、凯恩斯交叉模型具体函数计算题**

题目一般给出：消费函数 C = C(Y − T)，投资 I = Ī，政府购买 G = Ḡ。

（1）求均衡产出，以及政策变动对均衡产出的影响：直接利用产品市场均衡条件 Y = C + I + G 即可求得均衡产出 Y*。

（2）求非均衡点处的非意愿存货积累：直接利用非意愿存货积累的定义，非意愿存货积累 = Y − PE，其中 Y 题目会给出，PE 可以由给出的 Y 求得。

（3）求乘数：直接套公式即可。凯恩斯交叉图中不同乘数的总结如下，注意以下是没有挤出效应的乘数（即不涉及货币市场）：

$$投资乘数：总量税 1/(1−β)；比例税 1/[1−β(1−t)]
$$转移支付乘数：总量税 β/(1−β)；比例税 β/[1−β(1−t)]
$$政府购买乘数：总量税 1/(1−β)；比例税 1/[1−β(1−t)]
$$税收乘数：总量税 −β/(1−β)；比例税 −β(1−t)/[1−β(1−t)]
$$平衡预算乘数：总量税 1；比例税 1

注：β 为边际消费倾向，t 为比例税税率。

**2、IS-LM模型具体函数计算题**

题目一般给出：消费函数 C = C(Y − T)，投资 I = I(r)，政府购买 G = Ḡ，名义货币供给 M = M̄，价格水平 P = P̄，实际货币余额需求函数 L = L(r, Y)。

（1）求均衡产出：由产品市场均衡条件 Y = PE，PE = C(Y − T) + I(r) + Ḡ 可得 IS 曲线；由货币市场均衡条件 M̄/P̄ = L(r, Y) 可得 LM 曲线；联立即可解得初始均衡利率和产量 r₁、Y₁。

（2）求均衡的变动（以政府购买变动 ΔG 为例）：将新的政府购买量代入产品市场条件解得新的 IS 曲线（IS₂），联立新的 IS 和原 LM 曲线方程即可求得 r₂、Y₂。

（3）求挤出效应、挤出的投资量或消费量：
【法一】挤出效应 = Y₃ − Y₂ = (Y₃ − Y₁) − (Y₂ − Y₁) = [1/(1−β)]·ΔG − (Y₂ − Y₁)
【法二】挤出效应 = Y₃ − Y₂，其中把 r₁ 代入政府购买变动以后新的 IS₂ 表达式求得 Y₃；挤出的投资量 = I(r₁) − I(r₂)；挤出的消费量 = [C(Y₃) − C(Y₁)] − [C(Y₂) − C(Y₁)] = C(Y₃) − C(Y₂)。

（4）求乘数：直接用乘数定义公式求，比如政府购买乘数 k_g = ΔY/ΔG = (Y₂ − Y₁)/ΔG。

（5）为实现一定目标需要变动的政策量：设政府变动的变量值，如 ΔT 或 ΔG，求出新的 IS' 曲线，联立 IS' 和 LM 曲线，此时是两个方程三个未知数（新均衡条件下的 Y、r 和政策变动量 ΔT），代入政府的政策目标（如目标的 Y）后就是两个方程两个未知数，即可解出 ΔT 或 ΔG。货币政策或货币财政政策结合都是以上思路。

**3、AD-AS模型具体函数计算题**

注意，如果涉及 AD 和 AS 曲线，那么此时价格是可变的，不再像 IS-LM 模型中价格水平固定。
此类题目一般都会给出总供给曲线 AS 的表达式，并且一般的设问方式和 IS-LM 模型具体函数形式一样，即求均衡、均衡的变动、为实现一定的目标需要变动的政策量等，每类问题的思路和之前一样，关键还是求出不同情形下的 AD 曲线。

下面主要总结 AD 曲线的求解方式：
由产品市场均衡条件 Y = PE，PE = C(Y − T) + I(r) + Ḡ 可得 IS 曲线；
由货币市场均衡条件 M̄/P = L(r, Y) 可得 LM 曲线；
联立 IS、LM 曲线：
$$Y = C(Y − T) + I(r) + G
$$M̄/P = L(r, Y)
消去 r 即可得到产出 Y 和价格 P 的关系，此即为总需求曲线。

**4、蒙代尔-弗莱明模型具体函数计算题**

此类题目给的题设条件、题目设问方式以及对应的解题思路与 IS-LM 模型具体函数计算题基本一样，这里不再赘述。只是开放经济下会有净出口 NX，同时还可能涉及不同的汇率制度，这一点大家在做题时要留意。`,

        /* ==================== 专题十四 · 经济增长（一） ==================== */
        { id: 't14k', special: '专题十四', qid: '知识要点',
          question: '专题十四 · 经济增长计算题常见的类型（一）｜全部知识点总结',
          answer: `2012、2013、2014、2016、2017、2018、2019、2020、2021、2022、2023、2024和2025年南开真题中均考查了经济增长的计算题。经济增长这块2015年是放在了论述题里面考的，所以计算题中未涉及。

经济增长问题的计算分析题主要涉及到两大类型或这两大类结合起来命题：
第一类：稳态条件的推导、稳态变量的求解、黄金律条件的推导、黄金律变量的求解；
第二类：稳态时各变量的增长率。

本专题讲解第一类经济增长计算题（第二类见下一个专题）。
求解这一大类题的最核心的一步（最关键的一步）是求出人均资本生产函数的式子，即求出 y = f(k) 的具体的式子，剩下的问题在此基础上基本就都不难解决了。

**几种常见的类型：**

**1、不含有技术进步的总产出函数**

函数形式是 Y = K^α·L^(1−α) 或 Y = A·K^α·L^(1−α)（A为常数），假设储蓄率、资本折旧率和人口增长率分别为 s、δ、n，人均资本 k = K/L，人均产出 y = Y/L。

（1）稳态条件的推导：
$$人均产出 y = Y/L = K^α·L^(1−α)/L = (K/L)^α = k^α
$$资本积累 ΔK = sY − δK
由增长率的性质可得：
$$Δk/k = ΔK/K − ΔL/L = (sY − δK)/K − n = s·(Y/K) − (δ + n)
整理可得：
$$Δk = s·(Y/K)·k − (δ + n)k = s·y − (δ + n)k
稳态时满足 Δk = 0，因此稳态条件为：
$$s·y = (δ + n)k

（2）黄金律条件的推导：黄金律稳态水平要求人均消费最大（解题的核心：稳态，人均消费最大）。
人均消费函数为 c = y − s·y，由于稳态时满足条件 s·y = (δ + n)k，所以稳态时人均消费函数可以进一步写成：
$$c = y − (δ + n)k = f(k) − (δ + n)k
由人均消费最大化的一阶条件可得：
$$dc/dk = f'(k) − (δ + n) = 0
解得黄金律稳态的条件是：
$$f'(k) = (δ + n)
由以上条件可以求得黄金律稳态时人均资本水平 k*gold，将其代入稳态条件 s·y = (δ + n)k 即可解得稳态时的储蓄率水平 s*gold。

【提示】黄金律水平的储蓄率一定是等于产出函数中资本的指数幂，即 s*gold = α，大家一定要牢记这个结论，方便大家验算自己得到的结果是否正确。

**2、有技术进步的总产出函数**

常见的函数形式是劳动增加型（哈罗德中性）的，即 Y = K^a·(AL)^(1−a)，假设储蓄率、资本折旧率、人口增长率和技术进步率分别为 s、δ、n、g，有效人均资本 k = K/(AL)，有效人均产出 y = Y/(AL)。

（1）稳态条件的推导：
$$有效人均产出 y = Y/(AL) = K^a·(AL)^(1−a)/(AL) = (K/(AL))^a = k^a
$$资本积累 ΔK = sY − δK
由增长率的性质可得：
$$Δk/k = ΔK/K − ΔA/A − ΔL/L = s·(Y/K) − (δ + g + n)
整理可得：
$$Δk = s·y − (δ + n + g)k
稳态条件 Δk = 0，因此此时：
$$s·y = (δ + g + n)k

（2）黄金律条件的推导：黄金律稳态水平要求有效人均消费最大。
有效人均消费函数为 c = y − s·y，由于稳态时满足 s·y = (δ + g + n)k，所以有效人均消费函数可以进一步写成：
$$c = y − (δ + g + n)k = f(k) − (δ + g + n)k
由有效人均消费最大化的一阶条件可得：
$$dc/dk = f'(k) − (δ + g + n) = 0
解得黄金律稳态的条件是：
$$f'(k) = (δ + g + n)
由以上条件可以求得黄金律稳态时有效人均资本水平 k*gold，将其代入稳态条件 s·y = (δ + g + n)k 即可解得稳态时的储蓄率水平 s*gold。

【提示】黄金律水平的储蓄率一定等于产出函数中资本的指数幂，即 s*gold = a，大家一定要牢记这个结论，方便验算自己得到的结果是否正确。

**3、稳态人均资本与人均产出的常用结果（柯布-道格拉斯情形）**

无技术进步时（y = k^α）：
$$k* = [s/(δ + n)]^[1/(1−α)]
$$y* = [s/(δ + n)]^[α/(1−α)]
$$c* = (1 − s)·[s/(δ + n)]^[α/(1−α)]
$$k*gold = [α/(δ + n)]^[1/(1−α)]，  s*gold = α

有技术进步时（y = k^a）：
$$k* = [s/(δ + n + g)]^[1/(1−a)]
$$y* = [s/(δ + n + g)]^[a/(1−a)]
$$c* = (1 − s)·[s/(δ + n + g)]^[a/(1−a)]
$$k*gold = [a/(δ + n + g)]^[1/(1−a)]，  s*gold = a`,

        { id: 't14q3', special: '专题十四', qid: '练习3',
          question: `3、生产函数为：Y = F(K, L) = K^a·L^(1−a)，储蓄率为 s，资本折旧率为 δ，人口增长率为 n。

          question: `4、某国宏观生产函数为 Y = A·K^0.5·L^0.5，Y、A、K、L 分别代表产出总量、技术水平、资本总量、劳动总量；资本变动遵循 ΔK = I − dK，ΔK、I、d 分别代表资本增加量、投资、折旧率。假设该国的人口均为劳动力且零增长，技术水平、折旧率和储蓄率 (s) 都保持不变。
（1）请写出该国经济实现稳态增长时，人均收入 (y)、人均资本 (k) 和人均消费 (c) 的表达式。
（2）令折旧率为5%，请分别计算储蓄率为10%、技术水平为2，和储蓄率为20%、技术水平为4的两种情况下，经济实现稳态增长时的人均收入和人均消费；并讨论是否达到了最高人均消费水平。`,
          answer: `解：（1）令人均资本 k = K/L，则人均生产函数：
$$y = Y/L = A·K^0.5·L^0.5/L = A·(K/L)^0.5 = A·k^0.5 = f(k)
由题意可知，劳动增长率 ΔL/L = 0。
由于储蓄等于投资，所以资本积累方程 ΔK = I − dK = sY − dK。
由增长率的性质可得：
$$Δk/k = ΔK/K − ΔL/L = (I − dK)/K = s·(Y/K) − d
进一步整理可得：
$$Δk = s·y − d·k = s·A·k^0.5 − d·k = 0
稳态时 Δk = 0，所以稳态条件为 s·A·k^0.5 = d·k。
解得稳态时人均资本：
$$k* = (s·A/d)²
$$人均产出 y* = s·A²/d
$$人均消费 c* = (1 − s)·y* = (1 − s)·(s·A²/d)

（2）① 代入 d = 5%，s = 10%，A = 2，解得稳态人均产出 y* = 8，人均消费 c* = 7.2。
② 代入 d = 5%，s = 20%，A = 4，解得稳态人均产出 y* = 64，人均消费 c* = 51.2。
③ 稳态时人均消费 c = y − s·y = A·k^0.5 − d·k。
人均消费最大化的一阶条件为：
$$dc/dk = 0.5A·k^(−0.5) − d = 0
解得黄金律稳态的人均资本：
$$k_gold* = (0.5A/d)²
将 k_gold* = (0.5A/d)² 代入稳态条件 s·A·k^0.5 = d·k，解得黄金律水平的储蓄率：
$$s_gold* = 50%
因此此时都未达到最高人均消费水平。

【提示】注意这里生产函数中虽然有 A，但技术水平是不变的，即不存在技术进步，此时把 A 当作常数处理，并按照不存在技术进步的思路进行求解即可。在运用本专题总结的解题思路时，一定要根据具体题目给的条件来判断应该用哪种方法。`,
          hasImage: false },

        { id: 't14q5', special: '专题十四', qid: '练习5',
          question: `5、某经济体的生产函数为：F(K, AL) = K^a·(AL)^(1−a)，0 < a < 1。假设该经济体的人口增长率、技术进步率、折旧率和储蓄率分别为 n、g、δ 和 s。
（1）求出有效劳动的平均资本生产函数；求出稳态时有效劳动的资本存量 k*、每单位有效劳动的生产量 y* 和每单位有效劳动的消费 c*；
（2）求出每单位有效劳动资本存量 k 的黄金律值；
（3）求出满足黄金律稳态时资本存量时的储蓄率水平。`,
          answer: `解：（1）柯布-道格拉斯的生产函数形式为 Y = K^a·(AL)^(1−a)，令有效工人的人均资本和产出分别为 k = K/(AL)、y = Y/(AL)。
$$y = Y/(AL) = K^a·(AL)^(1−a)/(AL) = (K/(AL))^a = k^a
由增长率的性质可得：
$$Δk/k = ΔK/K − (ΔA/A + ΔL/L)
由资本积累方程 ΔK = sY − δK 可得：
$$Δk/k = (sY − δK)/K − (ΔA/A + ΔL/L)
整理可得：
$$Δk = s·y − (δ + n + g)k
稳态时有效工人的人均资本变化量为0，即 Δk = 0。
因此稳态条件为 Δk = s·y − (δ + n + g)k = 0，即 s·k^a − (δ + n + g)k = 0。
解得稳态时有效工人的人均资本：
$$k* = [s/(δ + n + g)]^[1/(1−a)]
有效工人的人均产出：
$$y* = [s/(δ + n + g)]^[a/(1−a)]
又因为 c = (1 − s)y，所以：
$$c* = (1 − s)·[s/(δ + n + g)]^[a/(1−a)]

（2）有效人均消费 c = y − s·y，稳态时存在 s·y = (δ + n + g)k。
因此稳态时有效人均消费：
$$c = y − (δ + n + g)k = k^a − (δ + n + g)k
由有效人均消费最大的一阶条件可得：
$$a·k^(a−1) − (δ + n + g) = 0
解得黄金律水平的有效人均资本为：
$$k_gold* = [a/(δ + n + g)]^[1/(1−a)]

（3）由（2）可知黄金律水平的有效人均资本为 k_gold* = [a/(δ + n + g)]^[1/(1−a)]，将其代入稳态条件 s·k^a = (δ + n + g)k 可以解得黄金律水平的储蓄率：
$$s_gold* = a

【提示】本题第（3）问可以当作结论：黄金律稳态时的储蓄率等于资本 K 的指数。该结论不仅适用于曼昆教材中常规的总产出函数形式 Y = F(K, L) 或 Y = F(K, AL)，也适用于变形的总产出函数，如引入失业率、资本利用率和税收的总产出函数。`,

        { id: 't14q6', special: '专题十四', qid: '练习6',
          question: `6、在不包含技术进步索洛模型中，假设生产函数为 F(K, L) = A·K^a·L^(1−a)（其中 A 为大于0的常数，0 < a < 1），人口增长率为 n，储蓄率为 s，资本折旧率为 δ。定义 k = K/L 表示人均资本，y = Y/L 表示人均产出。请回答以下问题：
（1）推导出人均资本积累的动态方程；
（2）计算出黄金律的资本存量 k_gold 以及相应的储蓄率 s_gold；
（3）在上述索洛模型中引入税收政策，假设政府对收入征税，税率为 τ（为简化起见，这里不考虑税收的具体用途），重新计算黄金律的资本存量 k_gold 以及相应的储蓄率 s_gold。（中财801经济学2014年考题）`,
          answer: `解：（1）由生产函数 Y = A·K^a·L^(1−a) 可得人均生产函数为 y = f(k) = A·k^a，其中 k = K/L。
人均资本积累的动态方程推导如下：
$$Δk/k = ΔK/K − ΔL/L = (sY − δK)/K − n = s·(Y/K) − (δ + n)
左右同时乘以 k 可得：
$$Δk = s·y − (δ + n)k = s·A·k^a − (δ + n)k
此即为人均资本积累的动态方程。

（2）人均消费 c = y − s·y，稳态时有 s·y = (δ + n)k。

黄金律的资本存量应满足人均消费水平最大，即：
$$dc/dk = A·a·k^(a−1) − (δ + n) = 0
解得：
$$k_gold* = [A·a/(δ + n)]^[1/(1−a)]

（3）征税后，稳态条件为：
$$s(1 − τ)y = (δ + n)k
所以稳态的人均消费为：
$$c = (1 − τ)y − s(1 − τ)y = (1 − τ)y − (δ + n)k = (1 − τ)A·k^a − (δ + n)k
黄金律的资本存量应满足人均消费水平最大，即：
$$dc/dk = (1 − τ)·A·a·k^(a−1) − (δ + n) = 0
解得：
$$k_gold* = [A·a·(1 − τ)/(δ + n)]^[1/(1−a)]
将其代入稳态条件 s(1 − τ)y = (δ + n)k 可以解得黄金律水平的储蓄率：
$$s_gold* = a`,
          hasImage: false },

        /* ==================== 专题十五 · 经济增长（二） ==================== */
        { id: 't15k', special: '专题十五', qid: '知识要点',
          question: '专题十五 · 经济增长计算题常见的类型（二）｜全部知识点总结',
          answer: `**1、增长率的几个性质**

关于增长率的问题，需要大家记住并学会应用以下增长率的基本性质。以下性质的具体证明在罗默《高级宏观经济学》、高鸿业和曼昆教材都有，只是不同教材中具体字母的表达方式不一样。

**性质1**：两个变量乘积的增长率等于其增长率的和，即，若 Z(t) = X(t)·Y(t)，则：
$$ΔZ(t)/Z(t) = ΔX(t)/X(t) + ΔY(t)/Y(t)
推导：Z(t) = X(t)·Y(t) 左右同时取对数：ln Z(t) = ln X(t) + ln Y(t)，然后左右同时全微分即可。

**性质2**：两个变量比率的增长率等于其增长率的差，即，若 Z(t) = X(t)/Y(t)，则：
$$ΔZ(t)/Z(t) = ΔX(t)/X(t) − ΔY(t)/Y(t)
推导：Z(t) = X(t)/Y(t) 左右同时取对数：ln Z(t) = ln X(t) − ln Y(t)，然后左右同时全微分即可。

**性质3**：如果 Z(t) = X(t)^α，则 Z(t) 的增长率是 X(t) 的增长率的 α 倍，即：
$$ΔZ(t)/Z(t) = α·ΔX(t)/X(t)
推导：Z(t) = X(t)^α 左右同时取对数：ln Z(t) = α·ln X(t)，然后左右同时全微分即可。

比如我们熟知的增长率核算方程：Y = A·K^α·L^(1−α)，则：
$$ΔY/Y = α·ΔK/K + (1 − α)·ΔL/L + ΔA/A

【提示】后续做题大家可能看到的几种等价表达：ΔX(t) = Ẋ(t) = dX(t)/dt，三者是一样的，只是不同教材表示方法不一样。

**2、稳态条件下不同变量增长率的总结**

假设人口增长率为 n，技术进步率为 g。

$$有效人均资本 k̃ = K/(AL)：无技术进步 —，有技术进步 0
$$有效人均产出 ỹ = Y/(AL)：无技术进步 —，有技术进步 0
$$人均资本 k = K/L：无技术进步 0，有技术进步 g
$$人均产出 y = Y/L：无技术进步 0，有技术进步 g
$$总资本 K：无技术进步 n，有技术进步 n + g
$$总产出 Y：无技术进步 n，有技术进步 n + g

以有技术进步的情况为例，稳态时：
$$Δk̃ = s·f(k̃) − (δ + n + g)k̃ = 0
因此稳态时有效人均资本增长率 Δk̃/k̃ = 0。
由于 ỹ = f(k̃)，因此稳态时有效人均产出增长率 Δỹ/ỹ = 0。
人均资本 k = K/L = A·(K/(AL)) = A·k̃，因此人均资本增长率：
$$Δk/k = ΔA/A + Δk̃/k̃ = g
同理人均产出增长率 Δy/y = g。
总资本 K = AL·(K/(AL)) = AL·k̃，因此总资本增长率：
$$ΔK/K = ΔA/A + ΔL/L + Δk̃/k̃ = n + g
同理总产出增长率 ΔY/Y = n + g。

【提示】无技术进步的稳态增长率推导思路和上面一致，建议大家自行推导无技术进步时的情形，强化对上面思路的理解。对于以上推导，大家一定要熟练掌握，只要掌握了推导，关于上面的结论才不会记混。

**3、资本与劳动收入份额的结论**

在有技术进步的柯布-道格拉斯模型 Y = K^α·(LE)^(1−α) 中，稳态时：
$$资本收入份额 = (MP_K·K)/Y = α
$$劳动收入份额 = (MP_L·L)/Y = 1 − α
因此资本总收入与劳动总收入的增长率均等于总产出增长率 n + g。`,
          hasImage: false },

        { id: 't15q1', special: '专题十五', qid: '练习1',
          question: `1、索洛模型中，假设某国的生产函数 Y = 0.6K^0.5·L^0.5，劳动增长率 n = 0.09，储蓄率 s = 0.4，折旧率 δ = 0.11，试求：
（1）长期稳态下的人均资本和人均产出？

          answer: `解：（1）令人均资本 k = K/L，人均产出：

$$s_gold* = 0.5`,
          hasImage: false },

        { id: 't15q2', special: '专题十五', qid: '练习2',
          question: `2、含有人口增长和技术进步的索洛模型为 Y = F(K, LE) = K^α·(LE)^(1−α)，0 < α < 1，人口增长率为 n，技术进步增长率为 g；资本折旧率为 δ。
（1）求解在稳态条件下，有效工人的人均资本和人均产出；
（2）证明在稳态条件下，资本-产出比是固定不变的；
（3）证明资本收入份额是 α，劳动的收入份额是 1 − α；（提示：资本收入份额等于 (MP_K·K)/Y，劳动收入份额等于 (MP_L·L)/Y）
（4）证明在稳态条件下，资本总收入与劳动总收入都会按照人口增长率加技术进步率 (n + g) 的速率增长。（中财801经济学2020年考题）`,
          answer: `解：（1）由题意可知有效人均产出 y = k^α，其中 k = K/(LE)，y = Y/(LE)。
稳态时满足条件 s·y = (δ + n + g)k，即 s·k^α = (δ + n + g)k。
解得稳态时有效人均资本：
$$k* = [s/(δ + n + g)]^[1/(1−α)]

$$K/Y = (k·LE)/(y·LE) = k/y = s/(δ + n + g)
为一固定的常数。

（3）资本收入份额：
$$(MP_K·K)/Y = [α·K^(α−1)·(LE)^(1−α)·K]/[K^α·(LE)^(1−α)] = α
劳动收入份额：
$$(MP_L·L)/Y = [(1 − α)·K^α·(LE)^(−α)·E·L]/[K^α·(LE)^(1−α)] = 1 − α

（4）稳态时 Δk = 0，由于有效人均产出 y = k^α，故稳态时也存在 Δy = 0，因此稳态时：

由（3）可知，资本收入份额 = (MP_K·K)/Y = α，劳动收入份额 = (MP_L·L)/Y = 1 − α。
因此资本总收入 (R = MP_K·K) 增长率：
$$ΔR/R = ΔY/Y = n + g
劳动总收入 (W = MP_L·L) 增长率：
$$ΔW/W = ΔY/Y = n + g`,
          hasImage: false },

        { id: 't15q3', special: '专题十五', qid: '练习3',
          question: `3、假设社会总生产函数为 Y = A·K^α·(LE)^(1−α)，其中 K 表示资本存量，L 表示劳动，E 表示劳动生产率，A 为常数。其中储蓄率、资本折旧率和人口增长率分别为常数 s、δ 和 n，劳动生产效率增长率为 g。
（1）推导出此模型的索洛增长模型的基本方程式。

          answer: `解：（1）设 LE 是有效劳动，则按有效劳动平均的产出 y = Y/(LE)，按有效劳动平均的资本存量 k = K/(LE)，由社会总生产函数得 y = A·k^α。

进一步整理可得：
$$Δk = s·y − (δ + n + g)k

        // ============================================================

        let currentData = [...cardData];
        let favorites = JSON.parse(localStorage.getItem('calc_key_favs') || '[]');
        let notes = JSON.parse(localStorage.getItem('calc_key_notes') || '{}');
        let edits = JSON.parse(localStorage.getItem('calc_key_edits') || '{}');

        let singleModeId = null;
        let history = [];
        let historyIndex = -1;

        const grid = document.getElementById('cardGrid');
        const totalSpan = document.getElementById('totalCards');
        const favSpan = document.getElementById('favCount');
        const filterSpecial = document.getElementById('filterSpecial');
