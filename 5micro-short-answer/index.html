<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微观简答 · 记忆卡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f7f0;
            color: #1e3a2a;
            padding: 20px;
        }
        .app-header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            background: #d9edd9;
            padding: 18px 28px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(60, 110, 60, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e4a2a;
            letter-spacing: 0.5px;
        }
        .app-header .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            background: #c4e0c4;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .app-header .stats span {
            font-weight: 500;
        }
        .app-header .stats .num {
            color: #1f6b3a;
            font-weight: 700;
        }
        .filter-bar {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #e6f3e6;
            padding: 12px 20px;
            border-radius: 14px;
            transition: opacity 0.3s;
        }
        .filter-bar.disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .filter-bar label {
            font-size: 14px;
            font-weight: 500;
            color: #1f4a2a;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid #b3d9b3;
            background: #fafffa;
            font-size: 14px;
            color: #1e3a2a;
            outline: none;
        }
        .filter-bar select:focus,
        .filter-bar input:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.2);
        }
        .filter-bar .btn-clear-filter {
            background: #cfe2cf;
            border: none;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #1e4a2a;
            font-weight: 500;
            transition: background 0.2s;
        }
        .filter-bar .btn-clear-filter:hover {
            background: #b8d4b8;
        }
        .filter-bar .btn-random {
            background: #d4c49a;
            border: none;
            padding: 6px 22px;
            border-radius: 30px;
            font-size: 14px;
            cursor: pointer;
            color: #3f3a1a;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        .filter-bar .btn-random:hover {
            background: #c9b888;
            transform: scale(1.02);
        }
        .filter-bar .btn-random:active {
            transform: scale(0.96);
        }

        /* ---- 抽查模式提示条 ---- */
        .single-mode-bar {
            max-width: 1200px;
            margin: 0 auto 16px auto;
            background: #f5efe0;
            border: 2px solid #d4a24e;
            border-radius: 14px;
            padding: 8px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            animation: fadeSlide 0.3s ease;
        }
        .single-mode-bar.show {
            display: flex;
        }
        .single-mode-bar .mode-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .single-mode-bar .mode-left .btn-nav {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 8px;
            color: #7a5a2a;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        .single-mode-bar .mode-left .btn-nav:hover {
            background: #e8ddd0;
            transform: scale(1.05);
        }
        .single-mode-bar .mode-left .btn-nav:active {
            transform: scale(0.92);
        }
        .single-mode-bar .mode-left .btn-nav.disabled {
            opacity: 0.35;
            pointer-events: none;
        }
        .single-mode-bar .card-id-badge {
            font-size: 15px;
            font-weight: 600;
            color: #5a4a2a;
            background: #e8ddd0;
            padding: 4px 18px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .single-mode-bar .mode-hint {
            font-size: 13px;
            color: #8a7a5a;
            margin-left: 4px;
        }
        .single-mode-bar .btn-exit-single {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 8px;
            color: #8a5a4a;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
        }
        .single-mode-bar .btn-exit-single:hover {
            background: #e8d5d0;
            transform: scale(1.05);
        }
        .single-mode-bar .btn-exit-single:active {
            transform: scale(0.92);
        }

        .card-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }
        .card-grid.single-mode {
            max-width: 820px;
        }
        .card-grid.single-mode .card-item {
            box-shadow: 0 8px 32px rgba(60, 100, 60, 0.18);
            border-left-width: 8px;
        }

        .card-item {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(60, 100, 60, 0.08);
            border-left: 6px solid #8fbe8f;
            transition: box-shadow 0.25s, transform 0.15s, border-color 0.3s;
            overflow: hidden;
            position: relative;
        }
        .card-item:hover {
            box-shadow: 0 8px 24px rgba(50, 100, 50, 0.13);
        }
        .card-item.favorited {
            border-left-color: #d4a24e;
            background: #fcf9f0;
        }
        .card-item.highlight {
            border-left-color: #e67e22;
            box-shadow: 0 0 0 3px #e67e22, 0 8px 28px rgba(230, 126, 34, 0.25);
            transform: scale(1.005);
        }
        .card-header {
            padding: 16px 22px 8px 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-header .label {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-header .label .tag {
            background: #dcebd9;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #1a4a2a;
            white-space: nowrap;
        }
        .card-header .label .qid {
            font-weight: 600;
            font-size: 15px;
            color: #1f5a2f;
        }
        .card-header .label .has-img {
            background: #d9c8b0;
            color: #5a3f1a;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .card-actions button {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 10px;
            transition: background 0.15s, transform 0.1s;
            line-height: 1;
            color: #3f6a3f;
        }
        .card-actions button:hover {
            background: #e6f0e6;
            transform: scale(1.05);
        }
        .card-actions .btn-fav {
            color: #b8a06a;
        }
        .card-actions .btn-fav.active {
            color: #d4a24e;
        }
        .card-actions .btn-note {
            color: #4f7a4f;
        }
        .card-actions .btn-note.active {
            color: #2b6b2b;
        }
        .card-actions .btn-edit {
            color: #4f6a8f;
        }
        .card-actions .btn-edit.is-editing {
            color: #2b6b2b;
        }
        .card-actions .btn-save-edit {
            color: #2b7a2b;
            font-weight: 700;
        }
        .card-actions .btn-cancel-edit {
            color: #8a4a4a;
        }
        .card-actions .btn-edit-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .card-actions .btn-edit-group .btn-edit {
            font-size: 18px;
        }
        .card-actions .btn-edit-group .btn-save-edit,
        .card-actions .btn-edit-group .btn-cancel-edit {
            font-size: 18px;
        }

        .card-question {
            padding: 6px 22px 12px 22px;
            font-size: 15.5px;
            line-height: 1.7;
            color: #1c3322;
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        .card-question .q-text {
            display: inline;
        }
        .card-question .q-text .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .card-question .toggle-hint {
            font-size: 13px;
            color: #5f8a5f;
            margin-left: 10px;
            font-weight: 400;
            opacity: 0.7;
        }
        .card-question.editable {
            cursor: text;
            user-select: text;
            border: 2px dashed #6a9e9e;
            border-radius: 10px;
            padding: 10px 18px;
            background: #fafffe;
        }
        .card-question.editable:focus {
            border-color: #2b6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-answer {
            padding: 0 22px 6px 22px;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .card-answer.open {
            display: block;
        }
        .card-answer .answer-inner {
            background: #f3faf3;
            padding: 18px 22px;
            border-radius: 14px;
            font-size: 14.8px;
            line-height: 1.75;
            color: #1a3322;
            word-break: break-word;
        }
        /* ---- 答案段落缩进核心样式 ---- */
        .card-answer .answer-inner p {
            text-indent: 2em;
            margin: 0 0 0.2em 0;
            padding: 0;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-answer .answer-inner p:last-child {
            margin-bottom: 0;
        }
        .card-answer .answer-inner .math {
            font-family: 'Times New Roman', serif;
            font-style: italic;
        }
        .card-answer .answer-inner .img-placeholder {
            display: inline-block;
            background: #dce8dc;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #2a5a2a;
            margin: 6px 0;
            font-weight: 500;
        }
        .card-answer.editable {
            cursor: text;
            user-select: text;
            border: 2px dashed #6a9e9e;
            border-radius: 10px;
            padding: 8px 16px;
            background: #fafffe;
        }
        .card-answer.editable .answer-inner {
            background: transparent;
            padding: 4px 6px;
        }
        .card-answer.editable .answer-inner p {
            text-indent: 2em;
            margin: 0 0 0.2em 0;
            padding: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .card-answer.editable .answer-inner p:last-child {
            margin-bottom: 0;
        }
        .card-answer.editable:focus {
            border-color: #2b6b6b;
            outline: none;
            box-shadow: 0 0 0 3px rgba(60, 150, 150, 0.15);
        }
        .card-note-area {
            padding: 0 22px 18px 22px;
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .card-note-area.open {
            display: block;
        }
        .card-note-area .note-editor {
            background: #f8fcf8;
            border: 1px solid #c2ddc2;
            border-radius: 14px;
            padding: 12px 16px;
            min-height: 80px;
            max-height: 360px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.7;
            color: #1c3322;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
            word-break: break-word;
            position: relative;
        }
        .card-note-area .note-editor:focus {
            border-color: #6a9e6a;
            box-shadow: 0 0 0 3px rgba(80, 150, 80, 0.15);
        }
        .card-note-area .note-editor img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            margin: 6px 0;
            display: block;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background: #f0f5f0;
            border: 2px solid transparent;
            transition: border 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card-note-area .note-editor img.selected {
            border-color: #4f8a4f;
            box-shadow: 0 0 0 3px rgba(79, 138, 79, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        .card-note-area .note-editor .note-placeholder {
            color: #8aaa8a;
            font-style: italic;
        }

        /* ---- 图片滑块控制 ---- */
        .card-note-area .img-resize-control {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
            padding: 6px 14px;
            background: #edf5ed;
            border-radius: 30px;
            border: 1px solid #c2ddc2;
            font-size: 13px;
            color: #2a5a2a;
            flex-wrap: wrap;
        }
        .card-note-area .img-resize-control.show {
            display: flex;
        }
        .card-note-area .img-resize-control input[type="range"] {
            flex: 1;
            min-width: 80px;
            accent-color: #4f8a4f;
            height: 4px;
            cursor: pointer;
        }
        .card-note-area .img-resize-control .size-val {
            font-weight: 600;
            min-width: 44px;
            text-align: center;
        }
        .card-note-area .img-resize-control .btn-reset-size {
            background: #dcebd9;
            border: none;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            color: #1e4a2a;
            transition: background 0.2s;
        }
        .card-note-area .img-resize-control .btn-reset-size:hover {
            background: #c2ddc2;
        }

        .card-note-area .note-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }
        .card-note-area .note-actions button {
            background: #dcebd9;
            border: none;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            color: #1e4a2a;
            font-weight: 500;
            transition: background 0.2s, transform 0.1s;
        }
        .card-note-area .note-actions button:hover {
            background: #c2ddc2;
        }
        .card-note-area .note-actions button:active {
            transform: scale(0.96);
        }
        .card-note-area .note-actions .btn-insert-img {
            background: #d4d9c4;
            color: #2f4a2f;
        }
        .card-note-area .note-actions .btn-insert-img:hover {
            background: #c4cdb0;
        }
        .card-note-area .note-actions .note-save {
            background: #a8c8a8;
            color: #1a3a1a;
        }
        .card-note-area .note-actions .note-save:hover {
            background: #94b894;
        }
        .card-note-area .note-actions .note-clear {
            background: #e6d6d6;
            color: #6a3a3a;
        }
        .card-note-area .note-actions .note-clear:hover {
            background: #dcc4c4;
        }
        .card-note-area .note-actions .note-size-hint {
            font-size: 12px;
            color: #6f8f6f;
            margin-left: auto;
            opacity: 0.7;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .no-result {
            text-align: center;
            padding: 50px 20px;
            color: #4f7a4f;
            font-size: 17px;
            background: #e6f3e6;
            border-radius: 24px;
        }
        .footer-note {
            max-width: 1200px;
            margin: 30px auto 10px auto;
            text-align: center;
            font-size: 13px;
            color: #5f7f5f;
            border-top: 1px solid #cce0cc;
            padding-top: 18px;
        }
        .footer-note kbd {
            background: #dce8dc;
            padding: 0 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a4a2a;
            color: #f0faf0;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 640px) {
            .app-header {
                flex-direction: column;
                align-items: stretch;
                padding: 14px 18px;
            }
            .app-header h1 {
                font-size: 20px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .single-mode-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 10px 14px;
            }
            .single-mode-bar .mode-left {
                justify-content: center;
            }
            .card-header {
                padding: 14px 16px 4px 16px;
            }
            .card-question {
                padding: 4px 16px 10px 16px;
                font-size: 14.5px;
            }
            .card-answer {
                padding: 0 16px 6px 16px;
            }
            .card-answer .answer-inner {
                padding: 14px 16px;
                font-size: 14px;
            }
            .card-note-area {
                padding: 0 16px 14px 16px;
            }
            .card-note-area .note-editor {
                min-height: 60px;
                max-height: 260px;
            }
            .card-grid.single-mode {
                max-width: 100%;
            }
            .card-note-area .img-resize-control {
                flex-wrap: wrap;
                gap: 6px;
            }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #dce8dc;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #8fbe8f;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6f9e6f;
        }
/* ================= 返回主页按钮 ================= */
.app-header .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.back-home {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 15px 7px 11px;
    border-radius: 30px;
    background: #c4e0c4;
    color: #1e4a2a;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(60, 110, 60, 0.10);
    transition: background .2s, transform .2s, box-shadow .2s;
}
.back-home:hover {
    background: #a8d0a8;
    transform: translateX(-2px);
    box-shadow: 0 4px 12px rgba(60, 110, 60, 0.20);
}
.back-home .arrow {
    font-size: 15px;
    line-height: 1;
    transition: transform .2s;
}
.back-home:hover .arrow {
    transform: translateX(-3px);
}

/* 移动端微调 */
@media (max-width: 640px) {
    .app-header .header-left { gap: 10px; }
    .back-home { padding: 6px 13px 6px 10px; font-size: 12.5px; }
}
    
</style>
</head>
<body>

    <div class="app-header">
        <div class="header-left">
    <a href="../index.html" class="back-home" title="返回主页">
        <span class="arrow">⬅</span><span>主页</span>
    </a>
    <h1>✏️南开经济学 · 微观简答记忆卡</h1>
</div>
        <div class="stats">
            <span>📚 总卡 <span class="num" id="totalCards">0</span></span>
            <span>⭐ 收藏 <span class="num" id="favCount">0</span></span>
        </div>
    </div>

    <div class="filter-bar" id="filterBar">
        <label for="filterSpecial">专项</label>
        <select id="filterSpecial">
            <option value="all">全部</option>
        </select>
        <label for="filterFav">⭐ 收藏</label>
        <select id="filterFav">
            <option value="all">全部</option>
            <option value="fav">仅收藏</option>
        </select>
        <input type="text" id="filterSearch" placeholder="搜索题目关键词…" style="flex:1; min-width:140px;" />
        <button class="btn-clear-filter" id="clearFilterBtn">重置筛选</button>
        <button class="btn-random" id="randomBtn">🎲 随机抽查</button>
    </div>

    <!-- 抽查模式提示条 -->
    <div class="single-mode-bar" id="singleModeBar">
        <div class="mode-left">
            <button class="btn-nav" id="prevCardBtn" title="上一张">◀</button>
            <span class="card-id-badge" id="singleCardBadge">卡片 #1</span>
            <button class="btn-nav" id="nextCardBtn" title="下一张">▶</button>
            <span class="mode-hint">抽查中</span>

    <script>
        // ============================================================
        // 数据
