<script src="answers-data.js"></script>
<script>
(function () {
    'use strict';

    var BOOK = window.ANSWER_BOOK;
    if (!BOOK || !BOOK.papers || !BOOK.papers.length) {
        document.getElementById('content').innerHTML = '<div class="empty">答案数据没加载上</div>';
        return;
    }

    var CN = ['一', '二', '三', '四', '五', '六'];
    /* v31：键名统一到 past_exams_ 前缀——主页「清除数据 · 真题」是按前缀 past_exams_ 清的，
       旧键（past_answers_last / past_ans_*）清不掉会留下"标记清了、状态还在"的怪现象。这里一次性搬迁 */
    (function () {
        var pairs = [['past_answers_last', 'past_exams_last'], ['past_ans_scroll', 'past_exams_scroll'],
                     ['past_ans_kw', 'past_exams_kw'], ['past_ans_flashed', 'past_exams_flashed']];
        pairs.forEach(function (pr) {
            try {
                var v = localStorage.getItem(pr[0]);
                if (v !== null) {
                    if (localStorage.getItem(pr[1]) === null) localStorage.setItem(pr[1], v);
                    localStorage.removeItem(pr[0]);
                }
            } catch (e) {}
            try {
                var s2 = sessionStorage.getItem(pr[0]);
                if (s2 !== null) {
                    if (sessionStorage.getItem(pr[1]) === null) sessionStorage.setItem(pr[1], s2);
                    sessionStorage.removeItem(pr[0]);
                }
            } catch (e) {}
        });
    })();
    var MARKS_KEY = 'past_exams_selftest';
    var MARKS = (function () {
        try { return JSON.parse(localStorage.getItem(MARKS_KEY)) || {}; } catch (e) { return {}; }
    })();
    var FACET_KEY = 'past_exams_facet';   /* 统计条（chips）的选择：和"上次看的卷"一样跨会话记住 */
    var facet = 'all';
    try {
        var facetSaved = localStorage.getItem(FACET_KEY);
        if (facetSaved && /^(all|weak|ok|meh|no|none)$/.test(facetSaved)) facet = facetSaved;
    } catch (e) {}
    var keyword = '';
    var searchView = 'global';   /* 'global' = 全站结果列表；'paper' = 单卷内按词过滤 */
    var currentKey = null;
    var lastSubj = {};   /* 每个学科最后看的卷 */

    /* ---------- 搜索结果列表的位置记忆 ----------
       从结果列表点进某题后，顶部有「← 回到全站搜索结果」。原来一点就 window.scrollTo(0,0)，
       结果列表长的时候直接被甩回顶部，找不到刚才点的是哪一条。
       这里记下「点进去的是哪一条」+「它当时在屏幕上的位置」，返回时把那条滚回原处并闪一下。 */
    var SRPOS_KEY = 'past_exams_srpos';
    var srPos = null;      /* { qid, kw, vtop, y } —— vtop=该条在视口中的位置，y=当时的滚动量 */
    var srPushedQid = null; /* 从结果列表 pushState 进来的那道题：供 popstate 判方向 */
    function saveSrPos(qid) {
        var el = document.querySelector('.sr-item[data-qid="' + qid + '"]');
        if (!el) { srPos = null; return; }
        var r = el.getBoundingClientRect();
        srPos = { qid: qid, kw: keyword.trim(), vtop: Math.round(r.top), y: Math.round(window.scrollY || 0) };
        try { sessionStorage.setItem(SRPOS_KEY, JSON.stringify(srPos)); } catch (e) {}
    }
    function readSrPos() {
        try {
            var raw = sessionStorage.getItem(SRPOS_KEY);
            if (!raw) return null;
            var o = JSON.parse(raw);
            return (o && o.qid) ? o : null;
        } catch (e) { return null; }
    }
    /* 回到结果列表后：把刚点过的那条滚回它原来的位置，并短暂高亮 */
    function restoreSrPos() {
        var p = srPos || readSrPos();
        if (!p) return false;
        /* 关键词换过了：位置对不上，不硬拽 */
        if (p.kw !== keyword.trim()) return false;
        var el = document.querySelector('.sr-item[data-qid="' + p.qid + '"]');
        if (!el) return false;      /* 结果集变了（换档位等）→ 不强行定位，留在顶部 */
        var apply = function () {
            var e2 = document.querySelector('.sr-item[data-qid="' + p.qid + '"]');
            if (!e2) return;
            var doc = e2.getBoundingClientRect().top + (window.scrollY || 0);
            var max = document.documentElement.scrollHeight - window.innerHeight;
            var want = doc - p.vtop;
            window.scrollTo(0, max > 0 ? Math.min(Math.max(0, want), max) : Math.max(0, want));
        };
        apply();
        if (window.requestAnimationFrame) requestAnimationFrame(apply);
        setTimeout(apply, 120);
        /* 刚点过的那条闪一下，省得在一堆结果里找不到 */
        el.classList.remove('sr-hit');
        void el.offsetWidth;
        el.classList.add('sr-hit');
        setTimeout(function () { el.classList.remove('sr-hit'); }, 2400);
        return true;
    }

    var yearbarEl = document.getElementById('yearbar');
    var contentEl = document.getElementById('content');
    var chipsEl = document.getElementById('chips');
    var searchInput = document.getElementById('searchInput');

    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function cleanStem(s) {
        return String(s || '').replace(/\n[ \t]*\n[\s]*/g, '\n');
    }

    /* 是否是一个"纯公式行"：有关键关系符、中文极少、非引导句 */
    function isFormula(t) {
        if (!t || t.length > 110) return false;
        if (/^[A-Za-z][A-Za-z0-9_^']*\s*=\s*\{$/.test(t)) return true;   // v21：分段函数大括号组首行（X={ / Y={），与各段行连成公式块
        if (/[：:]$/.test(t)) return false;
        if (!/[=≈≥≤≠<>]/.test(t) && !/^(max|min|s\.t\.)/i.test(t)) return false;   // max/min/s.t. 开头的大括号组行即使无关系符也算公式
        if (/（[^）]*）[。.]?$/.test(t)) return false;   // 结尾带中文括注的算正文
        if (/[\u4e00-\u9fa5][：:]/.test(t)) return false; // 句中带中文引导句（「可得：」「解得：」）的算正文行
        var cn = (t.match(/[\u4e00-\u9fa5]/g) || []).length;
        if (cn > 0) return false;   // v13：整行无汉字才算纯公式——「当I(t)=…时」「从而…」这类带字的行一律正文
        var rest = t.replace(/[\u4e00-\u9fa5\s，。；：、""''（）()【】,]/g, '');
        return rest.length >= 4 && /[A-Za-z0-9]/.test(rest);
    }

    /* 公式块：中文字符换回正文字体，避免衬线体缺字形；拆行残留的行尾标点直接去掉 */
    function fmHtml(t) {
        t = String(t).replace(/[，。；、]+$/, '');
        return esc(t).replace(/([\u4e00-\u9fa5，。；：、]+)/g, '<span class="fm-cn">$1</span>');
    }

    /* 答案区表格：首行为表头，单元格用半角 | 分隔；单元格内 __x__ 渲染为加粗
       （原书用划线标出的格子以加粗代替），首列自动作为行标题列（26/10/23 小0主人定） */
    function tbHtml(rows) {
        if (!rows || !rows.length) return '';
        var h = '<div class="tb-wrap"><table class="ah-tb">';
        rows.forEach(function (cells, ri) {
            h += '<tr>';
            cells.forEach(function (c, ci) {
                var txt = esc(c).replace(/__([\s\S]+?)__/g, '<b>$1</b>');
                h += (ri === 0)
                    ? '<th>' + txt + '</th>'
                    : '<td' + (ci === 0 ? ' class="rh"' : '') + '>' + txt + '</td>';
            });
            h += '</tr>';
        });
        return h + '</table></div>';
    }

    /* 题干里的手工表格（原书靠空格对齐的收益矩阵 / 汇率表 / 报酬表）
       题干是纯文本、空格对齐，比例字体下必然错位，故识别成真表格（26/10/23 小0主人点名）
       判据收紧到「恰好能认出全库 4 处、零误伤」，回归校验见 _chk_stem_tb.js：
       连续 ≥2 行、每行含连续空白、列数一致（或表头少一列 = 缺左上角格）、
       不含等号 / 句读 / 分值括注、首列不带冒号逗号、至少 2 行含 ≥2 个数字型单元格 */
    var RE_SP = /[\u3000 ]+/;
    var RE_NUMCELL = /^[-−]?\d+(?:[.,\/][-−]?\d+)*$|^\(\s*[-−]?\d+\s*,\s*[-−]?\d+\s*\)$/;
    var RE_PAREN = /[（(][^）)]{0,20}[）)]/g;
    function stemCells(line) {
        var s = line.replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
        return s.split(RE_SP).filter(function (c) { return c; });
    }
    function isStemTable(rows) {
        if (!rows || rows.length < 2) return false;
        var n = rows.map(function (r) { return stemCells(r).length; });
        var same = n.every(function (v) { return v === n[0]; });
        var headShort = n.slice(1).every(function (v) { return v === n[1]; }) && n[0] === n[1] - 1;
        if (!(same || headShort)) return false;
        if (Math.min.apply(null, n) < 2) return false;
        var ok = rows.every(function (r) {
            var cs = stemCells(r);
            if (r.replace(RE_PAREN, '').indexOf('=') > -1) return false;
            if (/[。；？]/.test(r)) return false;
            if (/（\d+分）/.test(r)) return false;
            if (cs.some(function (c) { return c.length > 24; })) return false;
            if (/[：，]/.test(cs[0])) return false;
            return true;
        });
        if (!ok) return false;
        var numRows = rows.filter(function (r) {
            return stemCells(r).filter(function (c) { return RE_NUMCELL.test(c); }).length >= 2;
        }).length;
        return numRows >= 2;
    }
    /* 题干渲染：普通行原样输出（.stem 是 pre-wrap），表格块换成真表格；表头缺左上角格时补空 */
    function stemHtml(s) {
        var lines = cleanStem(String(s || '')).split('\n');
        var out = '', buf = [];
        function flushText() {
            if (buf.length) { out += esc(buf.join('\n')); buf = []; }
        }
        var i = 0;
        while (i < lines.length) {
            if (!lines[i].trim()) { buf.push(lines[i]); i++; continue; }
            var j = i, run = [];
            while (j < lines.length && lines[j].trim() && RE_SP.test(lines[j].replace(/^[\s\u3000]+|[\s\u3000]+$/g, ''))) {
                run.push(lines[j]); j++;
            }
            if (run.length >= 2 && isStemTable(run)) {
                flushText();
                var rows = run.map(stemCells);
                var width = Math.max.apply(null, rows.map(function (r) { return r.length; }));
                rows = rows.map(function (r) {
                    if (r.length === width) return r;
                    var pad = []; for (var k = 0; k < width - r.length; k++) pad.push('');
                    return pad.concat(r);
                });
                out += tbHtml(rows);
                i = j;
            } else {
                buf.push(lines[i]); i++;
            }
        }
        flushText();
        return out;
    }

    /* 答案正文渲染：小标题 / 公式块 / 普通段落 / 表格块
       版式参考《计算要点》《专项训练》：正文首行缩进两字，仅小问标题行加粗，公式淡绿底 */
    var RE_NUM = /^(（[0-9一二三四五六七八九十]{1,3}）|[\u2460-\u2469]|第[一二三四五六七八九十]{1,2}，)/;
    /* 序号不单独加粗——只有小问标题行（p.sub）整体加粗，其余一律正文字重 */
    function withNum(s) {
        return esc(s);
    }
    /* 「第一，」「第二，」是①的分点，缩进一层 */
    var RE_DI = /^第[一二三四五六七八九十]+，/;
    /* 小问标题：只有（N）开头的短行；①②③④、第一第二都是正文，不加粗 */
    var RE_SUB = /^（[0-9一二三四五六七八九十]{1,3}）/;
    function isSubHead(t) {
        if (!RE_SUB.test(t)) return false;
        var body = t.replace(RE_SUB, '');
        if (!body.trim()) return false;
        if (/[。！？；]/.test(body)) return false;      // 带句读的是正文，不是标题
        return body.length <= 30;                        // 太长的当正文
    }
    /* （v12 已废弃自动拆行 splitInline——断行一律由数据源控制） */
    function renderAns(text) {
        var lines = String(text || '（暂无答案）').split('\n');
        var out = '', gap = false;   // gap：上一个空行，用来区分“段”与“行”
        function emit(cls, html, blk) {
            var isFirst = (out === '');   // 首个元素不加 par：段间距只作用于段与段之间，
                                          // 答案区第一个元素贴「参考答案」标签（26/10/22 小0主人定）
            var c = (cls || '') + ((gap || blk) && !isFirst ? ' par' : '');
            out += '<p' + (c.trim() ? ' class="' + c.trim() + '"' : '') + '>' + html + '</p>';
            gap = false;
        }
        var bc = false;   // 已进入【补充题】：其解答行首的「解：」要保留，样式同标签
        var kn = false;   // 已进入【知识梳理】：块内（N）不加粗，无序号短行才是分节标题（26/10/22 小0主人定）
        var tbl = null;   // 正在收集表格行：［表格］…［/表格］
        var fmBlk = null;   // 正在收集多行公式块：［公式］…［/公式］
        lines.forEach(function (raw) {
            var t = raw.replace(/\s+$/, '');
            /* 表格块：［表格］起、［/表格］止，中间每行即一行数据，单元格用半角 | 分隔，
               首行为表头。空行在块内无意义（直接跳过），避免被 gap 逻辑打断（26/10/23 小0主人定） */
            if (tbl) {
                if (/^［\s*\/\s*表格\s*］$/.test(t.trim())) {
                    out += tbHtml(tbl); tbl = null; gap = false; return;
                }
                if (t.trim()) tbl.push(t.split('|').map(function (c) { return c.trim(); }));
                return;
            }
        if (/^［\s*表格\s*］$/.test(t.trim())) { tbl = []; gap = false; return; }
        /* 公式块：［公式］起、［/公式］止，块内所有行合并成一个公式块——多行等式/推导不再被逐行拆碎，
           且块内不经 isFormula 逐行判定，纯希腊符号行也有底色（26/10/23 小0主人定） */
        if (fmBlk) {
            if (/^［\s*\/\s*公式\s*］$/.test(t.trim())) { emit('fm', fmHtml(fmBlk.join('\n')), true); fmBlk = null; return; }
            if (t.trim()) fmBlk.push(t.trim());
            return;
        }
        if (/^［\s*公式\s*］$/.test(t.trim())) { fmBlk = []; gap = false; return; }
        if (!t.trim()) { gap = true; return; }
            /* 转录端（小兮）行首「!」前缀：无样式含义，剥掉后按常规判据渲染
               （26/10/22 小0主人定——2010/2011 新录答案里出现 16 处，如 !（2）完全竞争市场…理由如下：） */
            var mBang = t.match(/^!\s*(.+)$/);
            if (mBang) t = mBang[1];
            /* 数据层单设语法：行首「#」= 强制本行按小问标题渲染（p.sub 加粗）——给个别
               字数超 30 但语义明确是标题的行用（26/10/22 小0主人定，A2015-E2 首用）。
               「#」后有无空白均可；默认不写就不生效，不影响其他卷与自动判据 */
            var mForce = t.match(/^#\s*(.+)$/);
            if (mForce) { emit('sub', withNum(mForce[1].trim()), true); return; }
            /* 反相单设：行首「~」= 强制本行按正文渲染（一律不加粗）——给个别短得会被
               【知识梳理】/【知识总结】区 knhead 等自动判据误当成标题的行用
               （26/10/22 小0主人定，A2014-C4 知识总结区首用：ρ——自然利率、①求动态总供给曲线方程等）。
               与「#」相对，默认不写就不生效，不动全局判据。
               不用「!」——那会跟转录端前缀撞车（见上 mBang） */
            var mPlain = t.match(/^~\s*(.+)$/);
            if (mPlain) {
                var pt = mPlain[1].trim();
                emit(RE_DI.test(pt) ? 'lv3' : '', withNum(pt), RE_NUM.test(pt));
                return;
            }
            var mDa = t.match(/^(答|解|证明|证)[:：]\s*/);
            if (mDa) {
                var kW = mDa[1];
                if (bc && (kW === '证明' || kW === '证')) {
                    // 补充题区内「证明：／证：」→【证】标签，样式与【解】完全相同。
                    // 【证】【解】【答】的【】标签样式只为【补充题】设计——区外一律剥掉前缀按正文渲染
                    // （26/10/23 小0主人定：2009S1 原卷是「答：」、2008S3 原题「证明：」，都不该带标签；
                    //  A2013-S5 提示区内引蒋殿春书的「证明：」同理）
                    emit('', '<span class="ah-tag">【证】</span>' + withNum(t.slice(mDa[0].length)), true);
                    return;
                }
                if (bc && (kW === '解' || kW === '答')) {
                    // 补充题解答开头：原书是「答：」显示【答】、「解：」显示【解】，各按原书体例（26/10/22 小0主人定）
                    emit('', '<span class="ah-tag">【' + kW + '】</span>' + withNum(t.slice(mDa[0].length)), true);
                    return;
                }
                t = t.slice(mDa[0].length);   // 区外「答：」「解：」「证明：」「证：」不进正文，让小问标题顶到位
                if (!t.trim()) { gap = true; return; }
            }
            // 图示占位／表格占位：同款浅底块（26/10/23 小0主人定——表格要跟图示长一样）
            if (/^［\s*此处有(?:图示|表格)/.test(t)) { emit('fig', esc(t), true); return; }
            // 提示/校注：原书提示放末尾；校注是订正说明
            // 多条提示写【提示1】【提示2】，序号紧跟、中间不留空格；数据里手滑写成「提示 1」也归一成「提示1」
            // 说明性栏目（命题背景/命题方式/热点背景/补充）与【提示】同款 ans-tip（26/10/22 小0主人定）；
            // 【补充知识】不在此列——它与【补充题】【知识总结】【知识梳理】同属区块标题，走 ah 加粗（26/10/22 小0主人定）
            var mNote = t.match(/^【((?:[^】]{0,12})?(?:提示|校注|注|命题背景|命题方式|热点背景|补充)\s*\d{0,2})】([\s\S]*)$/);
            if (mNote) { emit('ans-tip', '<b>【' + esc(mNote[1].replace(/\s+/g, '')) + '】</b>' + esc(mNote[2]), true); return; }
            var mAh = t.match(/^\s*【([^【]+?)】\s*$/);
            if (mAh) {
                var hc = mAh[1].replace(/\s+/g, '');
                if (hc === '补充题') { bc = true; kn = false; }
                if (hc === '知识梳理' || hc === '知识总结') { kn = true; bc = false; }   // 原书「知识总结」框功能同知识梳理（26/10/22 小0主人定）
                if (/^(命题背景|命题方式|热点背景|补充[:：]|补充$)/.test(hc)) {
                    // 说明性栏目的整行写法（如 A2021-E2「【补充：除了回答需求政策之外…】」）同【提示】样式，不再走 ah 加粗
                    emit('ans-tip', '<b>【' + esc(mAh[1]) + '】</b>', true); return;
                }
                // 整行【标签】：带回括号输出（26/10/22 修——原先只输出括号内文字，C2 的【知识总结】渲染成裸「知识总结」）
                emit('ah', '【' + esc(mAh[1]) + '】');
                return;
            }
            // 行首【标签】后面还跟着正文
            var mTag = t.match(/^\s*(【[^】]{1,20}】)\s*(\S.*)$/);
            if (mTag) {
                if (/补充题/.test(mTag[1])) { bc = true; kn = false; }
                if (/知识梳理|知识总结/.test(mTag[1])) { kn = true; bc = false; }
                emit('', '<span class="ah-tag">' + esc(mTag[1]) + '</span>' + esc(mTag[2]));
                return;
            }
            /* 版式定稿（v12）：不再自动拆行——一行数据渲染一段，与原书连排一致；
               绿底只给整行纯公式的行，引导句断行由数据源手动控制 */
            if (isFormula(t)) { emit('fm', fmHtml(t)); return; }
            // 单独成行的短标题：正文区按（N）判；【补充题】【知识梳理】块内规则不同
            if (isSubHead(t)) {
                if (!bc && !kn) { emit('sub', withNum(t), true); return; }   // 补充题内不加粗（小0主人定）
            } else if (kn && !/[。！？；：，、]/.test(t) && t.replace(/\s+/g, '').length <= 16) {
                // 【知识梳理】里的无序号短行（如「凯恩斯的消费函数」）才是分节标题，
                // 块内的（1）（2）回归正文——原书就是这样，避免标题层数倒挂；
                // knhead：缩进与正文齐平，不凸出（26/10/22 小0主人定）
                emit('sub knhead', withNum(t), true); return;
            }
            emit(RE_DI.test(t.trim()) ? 'lv3' : '', withNum(t), RE_NUM.test(t.trim()));
        });
        return out;
    }

    /* 出处小字：原样保留，淡绿底注释样式，不加标识、不加粗 */
    function renderSrc(item) {
        if (!item.src || !item.src.length) return '';
        var h = '<div class="src">';
        item.src.forEach(function (r) {
            h += '<div class="src-row">' +
                 '<span class="src-t">' + esc(r.t || '') + '</span></div>';
        });
        return h + '</div>';
    }

    function findPaper(key) {
        for (var i = 0; i < BOOK.papers.length; i++) {
            if (BOOK.papers[i].key === key) return BOOK.papers[i];
        }
        return null;
    }
    function findItem(id) {
        for (var i = 0; i < BOOK.papers.length; i++) {
            var p = BOOK.papers[i];
            for (var j = 0; j < p.parts.length; j++) {
                var it = p.parts[j].items;
                for (var k = 0; k < it.length; k++) {
                    if (it[k].id === id) return { paper: p, item: it[k] };
                }
            }
        }
        return null;
    }
    function allItems(p) {
        var out = [];
        p.parts.forEach(function (part) { out = out.concat(part.items); });
        return out;
    }
    function paperCount(p) { return allItems(p).length; }
    function countFilled(p) {
        return allItems(p).filter(function (it) { return !!it.ans; }).length;
    }

    function tally(p) {
        var t = { all: 0, ok: 0, meh: 0, no: 0, none: 0, weak: 0 };
        allItems(p).forEach(function (it) {
            t.all++;
            var m = MARKS[it.id];
            if (m === 'ok') t.ok++;
            else if (m === 'meh') { t.meh++; t.weak++; }
            else if (m === 'no') { t.no++; t.weak++; }
            else t.none++;
        });
        return t;
    }

    function matchFacet(id) {
        var m = MARKS[id];
        if (facet === 'all') return true;
        if (facet === 'weak') return m === 'meh' || m === 'no';
        if (facet === 'none') return !m;
        return m === facet;
    }

    function facetLabel(f) {
        var map = { all: '全部', weak: '只看不会的', ok: '会了', meh: '模糊', no: '忘了', none: '未测' };
        return map[f] || '';
    }
    function facetCount(p) {
        return allItems(p).filter(function (it) { return matchFacet(it.id); }).length;
    }
    /* 全站口径的档位统计：搜索结果是跨卷的，chips 上的数字得是全站池子，
       否则会出现「只看不会的 0，却搜出 11 条」这种自相矛盾的画面 */
    function tallyAll() {
        var t = { all: 0, ok: 0, meh: 0, no: 0, none: 0, weak: 0 };
        BOOK.papers.forEach(function (p) {
            var x = tally(p);
            for (var k in t) t[k] += x[k];
        });
        return t;
    }
    /* 当前是不是「全站结果列表」这个视图（决定 chips 用全站还是本卷口径、点 chip 是重搜还是回卷） */
    function inSearchList() { return !!keyword.trim() && searchView === 'global'; }

    function renderChips() {
        var paper = findPaper(currentKey);
        if (!paper) return;
        var isGlobal = inSearchList();
        var t = isGlobal ? tallyAll() : tally(paper);
        var defs = [
            ['all', '全部', t.all, ''],
            ['weak', '只看不会的', t.weak, 'c-weak'],
            ['ok', '会了', t.ok, 'c-ok'],
            ['meh', '模糊', t.meh, 'c-meh'],
            ['no', '忘了', t.no, 'c-no'],
            ['none', '未测', t.none, 'c-none']
        ];
        chipsEl.innerHTML = (isGlobal ? '<span class="chips-cap">全站</span>' : '') +
            defs.map(function (d) {
                return '<div class="chip2 ' + d[3] + (facet === d[0] ? ' sel' : '') +
                       '" data-f="' + d[0] + '">' + d[1] + '<b>' + d[2] + '</b></div>';
            }).join('');
    }

    chipsEl.addEventListener('click', function (e) {
        var c = e.target.closest ? e.target.closest('.chip2') : null;
        if (!c) return;
        facet = c.getAttribute('data-f');
        try { localStorage.setItem(FACET_KEY, facet); } catch (err) {}   /* 记住这次选择，刷新不丢 */
        /* 搜索态：就地按新档位重搜，不跳回单卷视图——
           和 1-7 子页一致（那里搜索与自测档位是叠在同一批卡上的，不会互相踢掉） */
        if (inSearchList()) renderSearch(); else renderPaper();
    });

    function renderYearbar() {
        var cur = findPaper(currentKey);
        var sub = cur ? cur.subject : BOOK.papers[0].subject;
        var subjects = [];
        BOOK.papers.forEach(function (p) {
            if (subjects.indexOf(p.subject) === -1) subjects.push(p.subject);
        });
        if (lastSubj[sub] == null) lastSubj[sub] = currentKey;

        var html = '<div class="yb-pick" id="ybPick">' +
            '<button type="button" class="yb-btn" aria-haspopup="true" aria-expanded="false">' +
            esc(sub) +
            '<svg viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '</button><div class="yb-menu">';
        subjects.forEach(function (s) {
            var n = BOOK.papers.filter(function (p) { return p.subject === s; }).length;
            html += '<button type="button" data-subj="' + esc(s) + '"' + (s === sub ? ' class="on"' : '') + '>' +
                    esc(s) + '<span>' + n + ' 套</span></button>';
        });
        html += '</div></div><div class="yb-years">';
        BOOK.papers.filter(function (p) { return p.subject === sub; }).forEach(function (p) {
            var pend = !countFilled(p);
            html += '<a href="#' + esc(p.key) + '" data-key="' + esc(p.key) + '"' +
                    (p.key === currentKey ? ' class="active' + (pend ? ' pend' : '') + '"'
                                          : (pend ? ' class="pend"' : '')) +
                    ' title="' + esc(p.title + ' · ' + (pend ? '答案待录入' : paperCount(p) + ' 题')) + '">' +
                    esc(p.short) + '</a>';
        });
        html += '</div>';
        yearbarEl.innerHTML = html;

        var pick = yearbarEl.querySelector('.yb-pick');
        var btn = pick && pick.querySelector('.yb-btn');
        if (btn) {
            btn.addEventListener('click', function () {
                var open = pick.classList.toggle('open');
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
        }
        Array.prototype.forEach.call(yearbarEl.querySelectorAll('.yb-menu button'), function (m) {
            m.addEventListener('click', function () {
                var s = m.getAttribute('data-subj');
                if (pick) pick.classList.remove('open');
                if (s === sub) return;
                var key = lastSubj[s];
                if (!findPaper(key)) {
                    var first = BOOK.papers.filter(function (p) { return p.subject === s; })[0];
                    key = first ? first.key : null;
                }
                if (key) go(key);
            });
        });
        Array.prototype.forEach.call(yearbarEl.querySelectorAll('.yb-years a'), function (a) {
            a.addEventListener('click', function (e) {
                e.preventDefault();
                go(a.getAttribute('data-key'));
            });
        });
        // 当前卷滚到可见（窄屏会横滑）
        var box = yearbarEl.querySelector('.yb-years');
        var act = box && box.querySelector('a.active');
        if (act && box.scrollWidth > box.clientWidth) {
            var br = box.getBoundingClientRect(), ar = act.getBoundingClientRect();
            box.scrollLeft += (ar.left - br.left) - Math.min(40, (br.width - ar.width) / 2);
        }
    }

    /* ---------- 全站搜索：一次搜遍所有年份的卷 ---------- */
    function searchAll(kw) {
        var low = kw.toLowerCase(), groups = [], total = 0;
        BOOK.papers.forEach(function (p) {
            var hits = [];
            p.parts.forEach(function (part) {
                part.items.forEach(function (it) {
                    if (!matchFacet(it.id)) return;   /* 与统计条叠加：档位不是「全部」就只在档位池里搜（子页口径） */
                    var hay = (it.stem + '\n' + (it.ans || '')).toLowerCase();
                    if (hay.indexOf(low) === -1) return;
                    hits.push({ type: part.type, it: it });
                });
            });
            if (hits.length) { groups.push({ paper: p, hits: hits }); total += hits.length; }
        });
        return { groups: groups, total: total };
    }
    function countKwHits(p, kw) {
        var low = kw.toLowerCase(), n = 0;
        p.parts.forEach(function (part) {
            part.items.forEach(function (it) {
                if (!matchFacet(it.id)) return;       /* 副标题「命中 N 题」要和列表实际显示的题数同口径 */
                if ((it.stem + '\n' + (it.ans || '')).toLowerCase().indexOf(low) > -1) n++;
            });
        });
        return n;
    }
    /* 命中片段：以命中词为中心取「命中句 + 前一句」，保证片段里一定看得到关键词
       （旧版只截题干前 96 字，像搜 AD 这种命中在中后段的，片段里根本找不到 AD） */
    function sentAround(s, i, len) {
        var B = /[。！？；\n]/;
        var curS = 0, k;
        for (k = i - 1; k >= 0; k--) { if (B.test(s.charAt(k))) { curS = k + 1; break; } }
        var curE = s.length;
        for (k = i + len; k < s.length; k++) { if (B.test(s.charAt(k))) { curE = k + 1; break; } }
        var from = curS;
        /* 命中句太短时，前面再带一句（前一句不超过 70 字才带，免得整段搬过来） */
        if (curS > 0 && curS < 46) {
            var prev = 0;
            for (k = curS - 2; k >= 0; k--) { if (B.test(s.charAt(k))) { prev = k + 1; break; } }
            if (curS - prev <= 70) from = prev;
        }
        var to = curE;
        if (to - from > 160) to = Math.min(curE, from + 160);   /* 单句超长时仍要保证命中词在内 */
        return (from > 0 ? '…' : '') + s.slice(from, to) + (to < s.length ? '…' : '');
    }
    function kwSnippet(it, low) {
        var stem = cleanStem(it.stem).replace(/\s+/g, ' ').trim();
        var i = stem.toLowerCase().indexOf(low);
        if (i > -1) return { text: sentAround(stem, i, low.length), where: 'stem' };
        var ans = String(it.ans || '').replace(/\s+/g, ' ').trim();
        var j = ans.toLowerCase().indexOf(low);
        if (j > -1) return { text: sentAround(ans, j, low.length), where: 'ans' };
        return { text: stem.slice(0, 96), where: 'stem' };
    }
    function hlEsc(text, low) {
        var s = esc(text);
        if (!low) return s;
        try {
            var re = new RegExp('(' + low.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
            return s.replace(re, '<em>$1</em>');
        } catch (e) { return s; }
    }

    /* opt.restore=true：从某题「回到全站搜索结果」时用——不甩回顶部，
       而是把刚点过的那条滚回原来的位置（结果集变了才退回顶部） */
    function renderSearch(opt) {
        var kw = keyword.trim();
        var res = searchAll(kw);
        var scope = facet !== 'all';
        var subEl = document.getElementById('tbSub');
        if (subEl) subEl.textContent = '全站搜索 · 命中 ' + res.total + ' 题' +
            (scope ? '（' + facetLabel(facet) + '）' : '');

        var html = '<div class="search-head">关键词 <b>「' + esc(kw) + '」</b>' +
            (res.total
                ? '　全站命中 <b>' + res.total + '</b> 题，分布在 <b>' + res.groups.length + '</b> 套卷'
                : '') +
            /* 档位不是「全部」时把搜索范围亮出来：统计条会持久记忆，
               不写清楚的话很容易以为「怎么才搜到这么点」是搜索坏了 */
            (scope
                ? '<div class="sc-scope"><span>范围：<b>' + esc(facetLabel(facet)) + '</b>（统计条档位，全站 ' +
                  tallyAll()[facet] + ' 题）</span><a href="#" id="scopeAll">不限档位 · 重搜全站</a></div>'
                : '') +
            '</div>';
        if (!res.total) {
            html += '<div class="empty">没搜到「' + esc(kw) + '」' +
                    '<br><span>' + (scope
                        ? '当前只在「' + esc(facetLabel(facet)) + '」范围内搜索，试试上面那个「不限档位 · 重搜全站」'
                        : '换个关键词试试，比如「古诺」「外部性」「索洛」「价格歧视」') + '</span></div>';
        }
        var low = kw.toLowerCase();
        res.groups.forEach(function (g) {
            html += '<section class="sr-group"><div class="sr-paper">' +
                esc(g.paper.title.replace(/\s+/g, ' ')) +
                '<span>' + esc(g.paper.subject) + ' · ' + g.hits.length + ' 题</span></div>';
            g.hits.forEach(function (h) {
                var sn = kwSnippet(h.it, low);
                html += '<a class="sr-item" href="#' + esc(h.it.id) + '" data-key="' + esc(g.paper.key) +
                    '" data-qid="' + esc(h.it.id) + '">' +
                    '<span class="sr-no">' + esc(h.type) + ' ' + esc(h.it.qid) + '</span>' +
                    '<span class="sr-txt">' + hlEsc(sn.text, low) +
                    (sn.where === 'ans' ? '<span class="sr-tip">　· 命中在答案里</span>' : '') +
                    '</span></a>';
            });
            html += '</section>';
        });
        contentEl.innerHTML = html;

        var panel = document.getElementById('navPanel');
        if (panel) panel.hidden = true;      /* 结果是跨卷的，单卷题号面板不适用 */
        /* 面板不在时也要重算正文宽度：刷新后是直接进结果页、没走 renderPaper→buildNavPanel，
           少了这次 layoutNav，正文就退回 CSS 的 1000px，比搜索时宽一截 */
        layoutNav();

        /* 结果页不属于任何一卷：把地址栏的卷/题 hash 去掉，
           否则刷新时会被当成「那一卷的过滤视图」，回不到结果列表 */
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}

        renderYearbar();
        renderChips();       /* 搜索态也渲染，否则刷新后顶栏第二行只剩搜索框、比搜索时窄一截 */
        updateSearchUI();
        if (!(opt && opt.restore && restoreSrPos())) window.scrollTo(0, 0);
    }

    function updateSearchUI() {
        var btn = document.getElementById('searchReset');
        if (btn) btn.classList.toggle('show', !!searchInput.value);
    }
    function saveKw() {
        try {
            if (keyword.trim()) sessionStorage.setItem(KW_KEY, keyword.trim());
            else sessionStorage.removeItem(KW_KEY);
        } catch (e) {}
    }

    function renderPaper() {
        var paper = findPaper(currentKey) || BOOK.papers[0];
        if (!paper) return;
        currentKey = paper.key;

        var kw = keyword.trim().toLowerCase();
        var types = paper.parts.map(function (p) { return p.type; });

        var subEl = document.getElementById('tbSub');
        var kwHits = kw ? countKwHits(paper, kw) : 0;
        /* 「共 N 题」在搜索态用档位池大小：档位不是「全部」时，列表里最多只有那么多题 */
        var pool0 = facet !== 'all' ? facetCount(paper) : paperCount(paper);
        if (subEl) subEl.textContent = paper.title.replace(/\s+/g, ' ') + ' · ' +
            (kw ? ('命中 ' + kwHits + ' 题 / 共 ' + pool0 + ' 题') : (pool0 + ' 题')) +
            (facet !== 'all' ? '（' + facetLabel(facet) + '）' : '') +
            ' · ' + types.join(' / ');

        var total0 = paperCount(paper);
        var filled0 = countFilled(paper);
        var rec = '';
        if (filled0 < total0) {
            rec = '<div class="rec-bar"><b>' + (filled0 ? '本卷答案录入中' : '本卷答案待录入') + '</b>　' +
                  '共 ' + total0 + ' 题，已录入 <span class="rec-num">' + filled0 + '</span> 题' +
                  (filled0 ? '，其余正在整理，先看题干复习。' : '，题干已就绪，答案稍后补上。') + '</div>';
        }

        var html = '';
        if (kw) {
            html += '<div class="search-back">关键词「' + esc(keyword.trim()) + '」' +
                    (facet !== 'all' ? '（' + esc(facetLabel(facet)) + '）' : '') +
                    ' · 本卷命中 <b>' + kwHits + '</b> 题　全站 <b>' + searchAll(kw).total + '</b> 题' +
                    '<a href="#" id="searchBack">← 回到全站搜索结果</a></div>';
        }
        html += rec +
            '<div class="paper-head">' +
            '<div class="crumb">' + esc(paper.meta) + '</div>' +
            '<h2>' + esc(paper.title) + '</h2>' +
            '<div class="meta">共 ' + paperCount(paper) + ' 题 · ' + types.join(' / ') + '</div>' +
            '</div>';

        var shown = 0;
        var navParts = [];

        paper.parts.forEach(function (part, pi) {
            var items = part.items.filter(function (it) {
                if (!matchFacet(it.id)) return false;
                if (kw) {
                    var hay = (it.stem + '\n' + it.ans).toLowerCase();
                    if (hay.indexOf(kw) === -1) return false;
                }
                return true;
            });
            if (!items.length) return;
            navParts.push({ type: part.type, items: items });

            html += '<section class="part"><h3>' + CN[pi] + '、' + esc(part.type) +
                    '<span>' + esc(part.note || '') + '</span></h3>';

            items.forEach(function (it) {
                shown++;
                html += '<article class="item" id="' + esc(it.id) + '">' +
                    '<div class="q-head"><span class="no">' + esc(it.qid) + '</span>' +
                    '<div class="stem">' + stemHtml(it.stem) + '</div></div>' +
                    renderSrc(it) +
                    (it.ans
                        ? '<div class="ans"><span class="ans-label">参考答案</span>' +
                          '<div class="ans-body">' + renderAns(it.ans) + '</div></div>'
                        : '<div class="ans ans-empty"><span class="ans-label">参考答案</span>' +
                          '<div class="ans-wait">这一题的答案还在录入，先把题干过一遍。</div></div>') +
                    '</article>';
            });
            html += '</section>';
        });

        if (!shown) {
            var msg = '没有匹配的内容';
            if (facet === 'weak') msg = '这一卷还没有标记「忘了 / 模糊」的题';
            else if (facet === 'ok') msg = '这一卷还没有标记「会了」的题';
            else if (facet === 'meh') msg = '这一卷还没有标记「模糊」的题';
            else if (facet === 'no') msg = '这一卷还没有标记「忘了」的题';
            else if (facet === 'none') msg = '这一卷的题都标记过了，没有「未测」的';
            else if (kw) msg = '没有匹配「' + keyword.trim() + '」的内容';
            html += '<div class="empty">' + esc(msg) +
                    '<br><span>换个筛选条件，或者清空搜索框试试</span></div>';
        }
        contentEl.innerHTML = html;

        buildNavPanel(paper, navParts);

        renderYearbar();
        renderChips();
        updateUrl();
        updateSearchUI();
    }

    /* ---------- 左侧题号面板：构建 ---------- */
    /* 面板基准：实测「屏幕左缘 → 正文卡片左缘」的距离写入 --npm（不用 100vw，滚动条宽度各浏览器不同）。
       顺带按实测余量切档：≥184px 全宽面板 / 88–183px 紧凑面板（76–168 连续伸缩）/ <88px 左下角小按钮。
       因为判的是实测余量而不是 vw 断点，Firefox 缩放到 120% 时只要还剩位置就保留面板。 */
    function layoutNav() {
        var panel = document.getElementById('navPanel');
        if (!panel) return;
        var cs = getComputedStyle(document.body);
        var padL = parseFloat(cs.paddingLeft) || 0;
        var padR = parseFloat(cs.paddingRight) || 0;
        var cw = document.documentElement.clientWidth;   /* 不含滚动条，跨浏览器口径一致 */
        /* 正文宽度：视口变窄时从 1000 收到 cw−280，留出面板位置。
           目的是让面板左距＝右距＝16px——窄视口下若死守 1000px，余量只剩 100px 左右，
           面板不是贴着正文就是被压成一条。收窄后正文最多只少 180px，行宽仍舒适 */
        var cMax = Math.max(860, Math.min(1000, cw - 280));
        function gapOf(c) { return padL + Math.max(0, (cw - padL - padR - c) / 2); }
        var gap = gapOf(cMax);
        var npw = Math.min(168, gap - 32);
        var mini = npw < 100;
        if (mini) {
            cMax = 1000;                 /* 收成小按钮时正文不必再让位 */
            gap = gapOf(cMax);
            npw = 0;
        }
        var wide = document.querySelectorAll('.content, .topbar, .yearbar, .rec-bar');
        for (var i = 0; i < wide.length; i++) wide[i].style.maxWidth = cMax + 'px';
        panel.style.setProperty('--npm', gap.toFixed(2) + 'px');
        panel.classList.toggle('np-mini', mini);
        panel.classList.toggle('np-tight', !mini && npw < 168);
        if (mini) panel.classList.remove('open');
    }

    function buildNavPanel(paper, navParts) {
        var panel = document.getElementById('navPanel');
        var rows = document.getElementById('npRows');
        navCur = null;
        if (!navParts.length) { panel.hidden = true; return; }
        layoutNav();
        panel.hidden = false;
        /* 标题备长短两版：窄档（96–167px）用短版，避免「2021 年（应经）」在 80px 内宽里断成「（应／经）」 */
        var tShort = paper.title.replace(/（[^）]*）\s*$/, '').trim() || paper.title;
        document.getElementById('npTitle').innerHTML =
            '<b><span class="np-t-long">' + esc(paper.title) + '</span>' +
            '<span class="np-t-short">' + esc(tShort) + '</span></b><br>' + esc(paper.subject);
        var h = '';
        navParts.forEach(function (part) {
            h += '<div class="np-row"><span class="np-type">' + esc(part.type) + '</span>' +
                 '<span class="np-nums">';
            part.items.forEach(function (it) {
                h += '<a href="#' + esc(it.id) + '" data-id="' + esc(it.id) + '">' + esc(it.qid) + '</a>';
            });
            h += '</span></div>';
        });
        rows.innerHTML = h;
        if (pendingNavId && document.getElementById(pendingNavId)) {
            navCur = pendingNavId;
            navPaint(pendingNavId);   /* 首帧即点亮，不等滚动落定（320ms 抑制窗口只管滚动驱动的刷新） */
        } else {
            navSpy();
        }
        pendingNavId = null;   /* 一次性消费：不在本次渲染中兑现就作废，免得残留到下一次重建误点亮 */
    }

    function updateUrl() {
        var cur = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        /* 26/10/23：hash 带 conv=（AI 对话分享链接）时不覆盖。分享链接正常指向
           share.html，但万一被贴到本页，也别把对话参数抹成 #A2026 */
        if (cur.indexOf('conv=') >= 0) return;
        var hit = findItem(cur);
        if (hit && hit.paper.key === currentKey) return;
        if (cur === currentKey) return;
        history.replaceState(null, '', '#' + currentKey);
    }

    function go(key) {
        currentKey = key;
        if (keyword.trim()) searchView = 'paper';   /* 带着关键词切年份：看该卷里命中的题 */
        var gp = findPaper(key);
        if (gp) lastSubj[gp.subject] = key;
        window.scrollTo(0, 0);
        try { sessionStorage.setItem(SCROLL_KEY, '0'); } catch (e) {}
        renderPaper();
        try { localStorage.setItem('past_exams_last', key); } catch (e) {}
    }

    var FLASH_KEY = 'past_exams_flashed';
    var SCROLL_KEY = 'past_exams_scroll';
    var KW_KEY = 'past_exams_kw';          /* 搜索词记忆：刷新还在，只有清空搜索才抹掉 */
    var scrollTimer = null;

    function saveScroll() {
        try { sessionStorage.setItem(SCROLL_KEY, String(Math.round(window.scrollY || 0))); } catch (e) {}
    }
    window.addEventListener('scroll', function () {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(saveScroll, 160);
    }, { passive: true });
    /* 刷新/关闭前同步落盘：160ms 防抖可能漏掉最后一小段滚动，导致刷新后先落到旧位置再跳 */
    window.addEventListener('pagehide', saveScroll);
    window.addEventListener('beforeunload', saveScroll);

    function restoreScroll() {
        var y = 0;
        try { y = parseInt(sessionStorage.getItem(SCROLL_KEY) || '0', 10) || 0; } catch (e) {}
        if (y <= 0) return;
        var apply = function () {
            var max = document.documentElement.scrollHeight - window.innerHeight;
            window.scrollTo(0, max > 0 ? Math.min(y, max) : y);
        };
        apply();
        if (window.requestAnimationFrame) requestAnimationFrame(apply);
        setTimeout(apply, 140);
    }

    function locateFromHash(hashOverride) {
        var raw = (hashOverride != null) ? hashOverride : (location.hash || '');
        var h = decodeURIComponent(raw.replace(/^#/, ''));
        if (!h) return false;
        var hit = findItem(h);
        if (hit) {
            var needRender = (currentKey !== hit.paper.key);
            currentKey = hit.paper.key;
            if (needRender) {
                pendingNavId = h;   /* 面板重建时直接亮目标题，不等 scrollIntoView */
                renderPaper();
            } else {
                navSpy(h);          /* 同卷：面板已在，直接点亮目标题——不重建面板/顶栏，避免高亮与顶栏闪动 */
            }
            var el = document.getElementById(h);
            if (el) {
                /* 搜索态顶部有吸顶的「回全站结果」条，定位时把这段高度让出来，别压住题干第一行 */
                var off = document.querySelector('.search-back') ? 48 : 0;
                el.scrollIntoView({ block: 'start', behavior: 'auto' });
                if (off) window.scrollBy(0, -off);
                // 首次渲染时文档高度可能还没撑开，稍后再校一次
                setTimeout(function () {
                    var e2 = document.getElementById(h);
                    if (e2) {
                        e2.scrollIntoView({ block: 'start', behavior: 'auto' });
                        if (off) window.scrollBy(0, -off);
                    }
                }, 120);
                // 同一题只高亮一次：刷新页面不再闪金框
                var seen = false;
                try { seen = sessionStorage.getItem(FLASH_KEY) === h; } catch (e) {}
                if (!seen) {
                    el.classList.add('flash');
                    setTimeout(function () { el.classList.remove('flash'); }, 2600);
                    try { sessionStorage.setItem(FLASH_KEY, h); } catch (e) {}
                }
            }
            return 'item';
        }
        if (findPaper(h)) {
            /* 已在该卷：不重复 renderPaper——否则顶栏与题号面板被重建，首屏闪一下、刚点亮的高亮被清空 */
            if (currentKey !== h) { currentKey = h; renderPaper(); }
            return 'paper';
        }
        return false;
    }

    var timer = null;
    searchInput.addEventListener('input', function () {
        updateSearchUI();
        clearTimeout(timer);
        timer = setTimeout(function () {
            keyword = searchInput.value;
            searchView = 'global';          /* 改了关键词就回到全站结果列表 */
            saveKw();
            if (keyword.trim()) renderSearch(); else renderPaper();
        }, 220);
    });

    /* 搜索框右侧的重置按钮：清空关键词，回到当前卷完整视图 */
    document.getElementById('searchReset').addEventListener('click', function () {
        clearTimeout(timer);
        searchInput.value = '';
        keyword = '';
        searchView = 'global';
        saveKw();
        updateSearchUI();
        /* 取消搜索＝回到「正常浏览整卷」的状态：把地址栏的题 hash 去掉，
           否则刷新还会被 bring 回跳转的那一道题，而不是记住当前浏览位置 */
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        renderPaper();
        searchInput.focus();
    });

    contentEl.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;

        var back = t.closest('#searchBack');
        if (back) {
            e.preventDefault();
            searchView = 'global';
            srPushedQid = null;   /* 已主动回列表：这条历史不再是「从列表推进来的题」 */
            renderSearch({ restore: true });   /* 回到刚才那条结果的位置，不是回顶部 */
            return;
        }

        /* 「不限档位 · 重搜全站」：把统计条拨回「全部」再重搜（等于临时解除范围限制） */
        var scopeAll = t.closest('#scopeAll');
        if (scopeAll) {
            e.preventDefault();
            facet = 'all';
            try { localStorage.setItem(FACET_KEY, facet); } catch (er) {}
            renderSearch();
            return;
        }

        var it = t.closest('.sr-item');
        if (it) {
            /* 结果页没有单卷 DOM，先渲染该卷的命中视图再定位，否则找不到 .item */
            e.preventDefault();
            var key = it.getAttribute('data-key');
            var id = (it.getAttribute('href') || '').slice(1);
            /* 先记下这一条在结果列表里的位置——「回到全站搜索结果」时靠它弹回原处 */
            saveSrPos(id);
            searchView = 'paper';
            currentKey = key;
            try { localStorage.setItem('past_exams_last', key); } catch (er) {}
            /* 用 pushState 而不是 replaceState：这样浏览器后退键能回到结果列表，
               而不是直接跳出答案册（手机上按返回更常用）。
               必须排在 renderPaper 前面：renderPaper 里的 updateUrl 会 replaceState
               当前条目，排在后面会把结果列表那条历史的 URL 冲掉，后退键就找不到列表了。 */
            try {
                history.pushState({ srFrom: 'list', id: id }, '', '#' + id);
                srPushedQid = id;   /* 记住「当前条目是从列表推进来的这道题」，后退时靠它认出方向 */
            } catch (er) {
                try { history.replaceState(null, '', '#' + id); } catch (er2) { location.hash = id; }
            }
            renderPaper();
            locateFromHash(id);
        }
    });

    window.addEventListener('hashchange', function () { locateFromHash(); });

    /* 浏览器前进/后退键：从某道题退回结果列表时，要像点「回到全站搜索结果」一样弹回原处。
       从结果列表进题时 pushState 记了 {srFrom:'list', id}，据此知道这一条历史是从列表来的。
       方向靠两处信息合判：
         · e.state 是「要去的那个条目」的状态 —— 前进时它是 {srFrom:'list'}（题目条目）；
         · srPushedQid 是「当前这个条目」是从列表 push 进来的题目 —— 后退时靠它认出要回列表。
       注：后退/前进会同时触发 popstate 和 hashchange；列表态 hash 为空时
       locateFromHash 直接返回 false，不会重复渲染——两边不冲突。 */
    window.addEventListener('popstate', function (e) {
        var st = e.state;
        var h = decodeURIComponent((location.hash || '').replace(/^#/, ''));
        if (st && st.srFrom === 'list' && st.id === h) {
            /* 前进回到那道题：重渲染单卷视图并定位 */
            var hit = findItem(h);
            if (hit) {
                searchView = 'paper';
                currentKey = hit.paper.key;
                renderPaper();
                locateFromHash(h);
            }
            /* 仍要记住「当前条目是从列表推进来的这道题」：
               不然再按一次后退就认不出方向，页面会卡在题目视图 */
            srPushedQid = h;
            return;
        }
        if (!srPushedQid) return;   /* 当前条目不是从列表推   的 → 交给浏览器正常处理 */
        srPushedQid = null;
        /* 后退到结果列表：重渲染列表，并把刚点过的那条弹回原位 */
        searchView = 'global';
        renderSearch({ restore: true });
    });

    /* ---------- 左侧题号面板：跳转 / 收展 / 在读高亮 ---------- */
    var navPanelEl = document.getElementById('navPanel');
    var navSpyTimer = null, navCur = null;
    var navHold = true;   /* 初始化阶段抑制高亮：等滚动定位/恢复完再首次绘制，避免先亮第 1 题再跳 */
    var pendingNavId = null;   /* 初始化已知的当前题（题 hash / 上次滚动位置推算）：构建面板时即刻点亮 */

    function navPaint(cur) {
        var box = document.getElementById('npRows');
        var old = box.querySelector('a.on');
        if (old) old.classList.remove('on');
        var nu = box.querySelector('a[data-id="' + cur + '"]');
        if (nu) nu.classList.add('on');
    }
    function navSpy(forceId) {
        if (navPanelEl.hidden) return;
        if (!forceId && navHold) return;   /* 初始化抑制；点题号的强制定位不受限 */
        var cur = forceId;
        if (!cur) {
            /* 视口内可见面积最大的题判为「在读」，不足 1/5 视口高时保持原判 */
            var vh = window.innerHeight || 800;
            var items = contentEl.querySelectorAll('.item');
            var best = null, bestArea = 0;
            for (var i = 0; i < items.length; i++) {
                var r = items[i].getBoundingClientRect();
                var hh = Math.min(r.bottom, vh) - Math.max(r.top, 0);
                if (hh > bestArea) { bestArea = hh; best = items[i]; }
            }
            if (best && bestArea > vh * 0.18) cur = best.id;
        }
        if (!cur) { if (navCur) navPaint(navCur); return; }
        navCur = cur;
        navPaint(cur);
    }
    window.addEventListener('scroll', function () {
        clearTimeout(navSpyTimer);
        navSpyTimer = setTimeout(function () { navSpy(); }, 80);
    }, { passive: true });
    /* 窗口尺寸 / 浏览器缩放变化：重算面板基准（rAF 节流，只改变量不重建 DOM） */
    var navResizeRaf = 0;
    function onNavResize() {
        if (navResizeRaf) return;
        navResizeRaf = requestAnimationFrame(function () { navResizeRaf = 0; layoutNav(); });
    }
    window.addEventListener('resize', onNavResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', onNavResize);

    document.getElementById('npFab').addEventListener('click', function () {
        navPanelEl.classList.toggle('open');
    });
    document.addEventListener('click', function (e) {
        if (!navPanelEl.classList.contains('open')) return;
        if (!navPanelEl.contains(e.target)) navPanelEl.classList.remove('open');
    });
    document.getElementById('npRows').addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a[data-id]') : null;
        if (!a) return;
        e.preventDefault();
        var id = a.getAttribute('data-id');
        var el = document.getElementById(id);
        if (!el) return;
        el.scrollIntoView({ block: 'start', behavior: 'auto' });
        el.classList.remove('flash');
        void el.offsetWidth;                     /* 重新触发金框动画 */
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 2600);
        /* URL 只记卷号不记题号：刷新回到原位而不是强制跳回该题 */
        try { history.replaceState(null, '', '#' + currentKey); } catch (e2) {}
        navPanelEl.classList.remove('open');
        navSpy(id);
    });


    /* 学科下拉：点空白处或按 Esc 收起 */
    function closePick() {
        var p = yearbarEl.querySelector('.yb-pick');
        if (!p) return;
        p.classList.remove('open');
        var b = p.querySelector('.yb-btn');
        if (b) b.setAttribute('aria-expanded', 'false');
    }
    document.addEventListener('click', function (e) {
        var p = yearbarEl.querySelector('.yb-pick');
        if (p && p.classList.contains('open') && !p.contains(e.target)) closePick();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' || e.key === 'Esc') closePick();
    });

    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

    var startKey = null;
    var h0 = (location.hash || '').replace(/^#/, '');
    var h0d = h0;
    try { h0d = decodeURIComponent(h0); } catch (e) {}

    if (h0d.indexOf('s-') === 0) {
        // 学科入口：跳到该学科的第一套卷
        var subjKey = h0d.slice(2);
        for (var si = 0; si < BOOK.papers.length; si++) {
            if (BOOK.papers[si].subject === subjKey) { startKey = BOOK.papers[si].key; break; }
        }
        h0 = '';
    } else if (h0) {
        var hit0 = findItem(h0d);
        if (hit0) startKey = hit0.paper.key;
        else if (findPaper(h0d)) startKey = h0d;
    }
    if (!startKey) {
        try { startKey = localStorage.getItem('past_exams_last'); } catch (e) {}
    }
    if (!findPaper(startKey)) startKey = BOOK.papers[0].key;
    currentKey = startKey;
    /* 恢复上次的搜索：sessionStorage 存，刷新还在、关标签页即清；只有清空搜索才算取消 */
    var kwSaved = '';
    try { kwSaved = sessionStorage.getItem(KW_KEY) || ''; } catch (e) {}
    if (kwSaved) {
        keyword = kwSaved;
        searchInput.value = kwSaved;
        updateSearchUI();
    }
    /* 「已知落点」只认题 hash：只有真正指向某道题的 #A2023-C4 才算用户要求落在这一题。
       卷级 hash（#A2026）是页面自己 updateUrl() 写回地址栏的，刷新时必然跟着回来；
       若把它也算作落点，正在搜索的用户一刷新就会掉进「该卷的命中视图」，看不到结果列表。 */
    var hItem = (h0d && findItem(h0d)) ? h0d : '';
    if (hItem) pendingNavId = hItem;
    var savedY = 0;
    if (!pendingNavId) {
        try { savedY = parseInt(sessionStorage.getItem(SCROLL_KEY) || '0', 10) || 0; } catch (e0) {}
    }
    if (kwSaved && !hItem) {
        /* 有搜索词、地址栏又没有指定落点 → 直接回到全站结果列表 */
        searchView = 'global';
        renderSearch();
        navHold = false;
    } else {
        searchView = kwSaved ? 'paper' : 'global';
        renderPaper();
        if (!pendingNavId && savedY > 0) {
            /* 从保存的滚动位置推算「在读」题——口径与 navSpy 完全一致（可见面积最大），
               否则首帧按「顶部压着的题」点亮、320ms 校准时再改成「面积最大的题」，高亮就会跳一下 */
            var its0 = contentEl.querySelectorAll('.item'), cand = null, bestA0 = 0;
            var vh0 = window.innerHeight || 800, sy0 = window.scrollY || 0;
            for (var iy = 0; iy < its0.length; iy++) {
                var r0 = its0[iy].getBoundingClientRect();
                var top0 = r0.top + sy0;
                var vis0 = Math.min(top0 + r0.height, savedY + vh0) - Math.max(top0, savedY);
                if (vis0 > bestA0) { bestA0 = vis0; cand = its0[iy]; }
            }
            if (cand) { navCur = cand.id; navPaint(cand.id); }
        }
        var landed = h0 ? locateFromHash('#' + h0) : false;
        if (landed !== 'item') restoreScroll();
        /* 兜底：既无题 hash 也无上次滚动位置（首次打开）→ 首帧直接点亮第一题，免得面板空窗到 320ms */
        if (!navCur) {
            var first0 = contentEl.querySelector('.item');
            if (first0) { navCur = first0.id; navPaint(first0.id); }
        }
    }
    /* 滚动定位（locate 120ms 校准 / restore 140ms 兜底）都结束后再按最终布局校正一次 */
    setTimeout(function () { navHold = false; navSpy(); }, 320);

    /* ---------- 给页面上那个 AI 助手看的「当前卡片」 ----------
       答案册的卡片是 .item 结构（不是卡片列表页的 .card-item），
       这里注册适配器告诉它怎么找卡、怎么读卡；「当前卡片」＝左侧题号面板高亮的那一题 */
    function aiLabelOf(el) {
        if (!el || !el.id) return '';
        var hit = findItem(el.id), type = '';
        if (hit) {
            hit.paper.parts.forEach(function (pt) {
                pt.items.forEach(function (it) { if (it.id === el.id) type = pt.type; });
            });
        }
        var noEl = el.querySelector('.q-head .no');
        var no = noEl ? noEl.textContent.replace(/\s+/g, ' ').trim() : '';
        var title = hit ? hit.paper.title.replace(/\s+/g, ' ') : '';
        return (title ? title + ' · ' : '') + (type ? type + ' ' : '') + '第 ' + no + ' 题';
    }
    window.__AI_CARD_ADAPTER__ = {
        all: function () { return contentEl.querySelectorAll('.item'); },
        key: function (el) { return (el && el.id) ? 'id:' + el.id : ''; },
        label: aiLabelOf,
        read: function (el, withAnswer) {
            if (!el || !el.id) return null;
            var stemEl = el.querySelector('.q-head .stem');
            var ansEl = el.querySelector('.ans-body');
            /* 题干表格的单元格在 DOM 里没有分隔符，直接取 textContent 会粘成一串，
               克隆一份给每格补个空格再读（26/10/23 加） */
            var qTxt = '';
            if (stemEl) {
                var c = stemEl.cloneNode(true);
                Array.prototype.forEach.call(c.querySelectorAll('th,td'), function (td) {
                    td.appendChild(document.createTextNode(' '));
                });
                qTxt = c.textContent.replace(/\n{3,}/g, '\n\n').trim();
            }
            return {
                key: 'id:' + el.id,
                label: aiLabelOf(el),
                q: qTxt,
                a: (withAnswer && ansEl) ? ansEl.textContent.replace(/\n{3,}/g, '\n\n').trim() : '',
                n: ''
            };
        },
        focus: function () {
            if (!navCur) return null;                 /* 左侧面板还没点亮时退回「可见面积最大」 */
            var el = document.getElementById(navCur);
            if (!el || el.className.indexOf('item') === -1) return null;
            var r = el.getBoundingClientRect();
            var vh = window.innerHeight || 800;
            if (r.bottom <= 0 || r.top >= vh) return null;   /* 不在视口里就别硬塞给 AI */
            return el;
        }
    };
})();
</script>
<script src="../ai-assistant.js"></script>
<!-- 26/10/23：答案册正文页接入「我的卡片」——与各子页/8past-exams/index.html 同款，
     AI 面板右上角多 🗂 入口、每条 AI 回答右下角多存卡按钮（ai-cards-bridge.js 自包含，
     只等 #aiPanel 出现后安装）。answers.html 在 8past-exams/ 下，相对路径 ../ 到项目根 -->
<script src="../ai-cards-bridge.js"></script>

<!-- 返回顶部：浅绿线条箭头（无圆底无文字）。仅"本段上滑累计满 150px 且持续满 150ms"才出现（约三格滚轮即出）；向下/静止/距顶400内/AI面板展开时隐藏；停止滚动约 1.5s 后隐藏，但鼠标停在箭头上时不隐藏（等她点完）；点击平滑回顶。
     位置由 JS 实测 .ai-fab 动态居中于其正上方，不写死坐标 -->
<button id="toTop" aria-label="返回顶部" title="返回顶部" type="button">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#78d2b4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20 V4 M12 4 L6 11 M12 4 L18 11"/>
    </svg>
</button>
<script>
(function(){
    var btn = document.getElementById('toTop'); if(!btn) return;
    var fab = document.querySelector('.ai-fab');
    var GAP    = 16;    // 箭头底边与 AI 按钮顶边的间距
    var MIN_Y  = 400;   // 距顶部 400 以内不出现（沿用旧阈值）
    var IDLE_MS = 1500; // 停止滚动多久后隐藏（26/10/23 小0主人定 900→1500：出现的秒数久一点点；淡出 .25s 期间仍可点）
    var UP_PX   = 150;  // 本段上滑累计满这么多像素就露出：约三格滚轮即出（26/10/23 小0主人定 250→150，原话"我滚三下鼠标滚轮出来了"）
    var UP_MS   = 150;  // 同时要求持续上滑满这么久：仍挡开瞬时猛甩/惯性尖峰（250→150，快拂三下也认）
    var JITTER  = 2;    // 位移小于此值视为抖动，不判方向
    var lastY = window.scrollY || document.documentElement.scrollTop || 0;
    var idleTimer = null, ticking = false, fabOn = true, upDist = 0, upMs = 0, lastT = -1, hovering = false;

    function show(){ if(fabOn) btn.classList.add('show'); }
    function hide(){ btn.classList.remove('show'); }
    function armIdle(){
        if(idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(function(){
            idleTimer = null;
            if(hovering) return;              // 鼠标停在箭头上：不自动隐藏，等她点（26/10/23 小0主人定）
            upDist = 0; upMs = 0; lastT = -1; hide();
        }, IDLE_MS);
    }

    /* 悬停锁：鼠标进箭头清掉倒计时，离开后若还可见就重新倒计时。
       不然箭头出来 1.5s 后自己淡出，她手挪过去还没点到就没了（26/10/23 小0主人点名） */
    btn.addEventListener('mouseenter', function(){
        hovering = true;
        if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    });
    btn.addEventListener('mouseleave', function(){
        hovering = false;
        if(btn.classList.contains('show')) armIdle();
    });

    /* 动态对准：以 AI 按钮实际包围盒为基准 —— 水平中心对齐、底边留 GAP。
       不靠写死 right/bottom：屏宽、横竖屏、滚动条宽度、按钮自身改尺寸/移位，始终居中于其正上方。
       坐标系坑（26/10/23 晚修）：必须用 documentElement.clientWidth/Height（不含经典滚动条），
       与 getBoundingClientRect 同属布局视口；window.innerWidth/Height 含滚动条宽，
       Edge 的经典滚动条会把箭头往左带约一个滚动条宽（Firefox 滚动条不占布局宽所以看不出） */
    function place(){
        if(!fab) return;
        var r = fab.getBoundingClientRect();
        if(!r.width || !r.height) return;                 // 按钮未渲染则保留上次位置
        var w = btn.offsetWidth || 38, h = btn.offsetHeight || 38;
        var vw = document.documentElement.clientWidth  || window.innerWidth;
        var vh = document.documentElement.clientHeight || window.innerHeight;
        var cx = r.left + r.width / 2;                    // 按钮水平中心
        btn.style.right  = Math.max(0, Math.round(vw - cx - w / 2)) + 'px';
        // 箭头底边落在按钮顶边上方 GAP 处：bottom = 视口高 - (按钮顶 - GAP)
        btn.style.bottom = Math.max(0, Math.round(vh - (r.top - GAP))) + 'px';
    }

    function update(){
        ticking = false;
        var y = window.scrollY || document.documentElement.scrollTop || 0;
        var dy = y - lastY;
        lastY = y;
        var now = performance.now();
        var dt = lastT > 0 ? now - lastT : 0; lastT = now;   // 首帧 dt=0：时长从本段上滑第一帧起算
        if(dy < -JITTER){                 // 上滑中：累计本段位移与持续时长
            upDist += -dy; upMs += dt;
            if(y > MIN_Y){
                if(upDist >= UP_PX && upMs >= UP_MS) show();   // 翻够距离且持续够久才露面
            }else hide();
        }else if(dy > JITTER){            // 向下滚动：打断累计，立即隐藏（悬停时例外：她正指着箭头要它别跑）
            upDist = 0; upMs = 0; lastT = -1;
            if(!hovering) hide();
        }else{                            // 静止帧（微小抖动）：同样打断累计
            upDist = 0; upMs = 0; lastT = -1;
        }
        armIdle();
    }

    window.addEventListener('scroll', function(){
        if(!ticking){ window.requestAnimationFrame(update); ticking = true; }
    }, {passive:true});
    window.addEventListener('resize', place);
    window.addEventListener('orientationchange', function(){ setTimeout(place, 120); });

    /* AI 面板展开时按钮会被加 .hidden 隐身 —— 箭头不单独露脸浮在面板上；面板收起后恢复并对准 */
    if(fab && window.MutationObserver){
        new MutationObserver(function(){
            fabOn = !fab.classList.contains('hidden');
            if(!fabOn){ hide(); return; }
            place();
            /* 26/10/23 实测坑：面板收起时 fab 正从 scale(.5) 过渡回 scale(1)（.2s），
               此刻 getBoundingClientRect 是缩小中间态，r.top 偏下 → 箭头算低约 14px
               （vgap 16→2）。transition 列表里没有 right/bottom，过渡结束即终态，
               所以延时再校准一次；transitionend 可能被中断，不依赖它 */
            setTimeout(place, 260);
        }).observe(fab, {attributes:true, attributeFilter:['class']});
    }

    btn.addEventListener('click', function(){
        if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
        window.scrollTo({ top:0, behavior:'smooth' });   // 回顶动画期间仍在上行，箭头保持可见，到顶即隐
    });

    place();
    window.addEventListener('load', place);
    hide();
})();
</script>
</body>
