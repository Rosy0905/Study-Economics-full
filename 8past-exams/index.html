/* ==================== 应用经济学 ==================== */
{ id:'A0', subject:'应用经济学', paper:'真题说明', type:'说明', qid:'1',
  question:`南开大学应用经济学历年真题说明

（1）南开应用经济学真题代码每年都会变，但考试内容和参考书不变，2025考研最新代码为847经济学，往年还使用过877、880等代码数字。

（2）2024年及之前，经济学院应用经济学、日本研究院、经济与社会发展研究院和国家经济战略研究院的经济学硕均使用847应用经济学这一张卷子；在2025考研，金融学院不再单独命题，也改为和经院应用经济学使用一张卷子，考察847经济学。

（3）应用经济学这套真题的时间跨度是从1995—2025年。更早年份南开的参考书以及题目风格与现在的差别很大，所以本册《真题大全解》完整收录的真题年份为2008—2025年，已足够大家学习使用；2008年以前一些重要的真题是以训练题或例题的形式分布在三大本其他地方。

（4）大家重点关注近十年或近十五年真题即可。早年份的真题可以分题型限时模拟，或当作练习题做即可。但是近五年或近十年的真题，建议大家以套卷的形式进行全真模拟。时间紧张的同学，至少是需要对近三年真题进行全真模拟。

（5）与市面上大多数真题不同，三大本第1册《真题大全解》不只是真题答案和解析。对于真题中难以理解之处或常见题型，学长学姐会进行点睛评注，为大家总结做题思路，帮助考生掌握一类题型的解题方法；重难点题目后附有考点拓展训练，帮助考生巩固拓展、举一反三，加深对考点的理解和掌握。

（6）真题永远是复习备考的最佳指南，一切复习方法的总结和复习计划的制定从根本上说都源自对真题和参考书的研究，并且这些方法和计划的成果最终也交由真题来检验。因此，大家一定要认真做和研究真题。

（7）847已经考过很多年，很多主观题可能考到的知识点真题基本都考过，所以847主观题也是大家背诵的重要语料来源，在做真题时，要对重要的和做错的真题做好标记，可以冲刺阶段进行背诵记忆。报过精品课程的同学以课程附赠的宏微观背诵手册和热点资料为主进行背诵即可，那里已经把要背诵的内容总结好了。` },

{ id:'A2026-S8', subject:'应用经济学', paper:'2026年（应经）', type:'简答', qid:'8',
  question:`请分别基于资产组合理论和鲍莫尔-托宾模型，分析通货膨胀率上升对货币需求的影响及核心机制。（5分）` },
{ id:'A2026-C1', subject:'应用经济学', paper:'2026年（应经）', type:'计算', qid:'1',
  question:`（15分）考虑一个生活在两期（第1期和第2期）的消费者。他的跨期效用函数为：U(c₁,c₂)=lnc₁+0.9lnc₂，其中 c₁ 和 c₂ 分别是两期的消费。他两期的收入禀赋为 y₁=100，y₂=110，市场利率 r=0.1。

（1）写出该消费者的跨期预算约束方程。（5分）
（2）在利率 r=0.1 时，求解他的两期最优消费量 c₁* 和 c₂*。（5分）
（3）判断在（2）的最优选择下，该消费者是一个借款者还是一个贷款者（储蓄者）？（2分）
（4）如果市场利率下降为 r'=0.05，其他条件不变。在新的最优选择下，他更可能成为借款者还是贷款者？请简要说明理由。（3分）` },
{ id:'A2026-C2', subject:'应用经济学', paper:'2026年（应经）', type:'计算', qid:'2',
  question:`（10分）一个垄断厂商面临两个市场：成人市场中有100个成人，每个成人的需求函数为 p=50-2q；儿童市场中有80个儿童，每个儿童的需求函数为 p=30-q。厂商的边际成本 MC=10。

（1）如果厂商只服务成人市场，求其最优的入场费 F 和价格 p。（4分）
（2）如果厂商同时服务成人和儿童市场，且无法进行市场分割，求此时的最优 F 和 p。（4分）
（3）根据（1）（2）中的结果，厂商会选择只服务成人市场放弃儿童市场，还是同时服务成人和儿童市场，并解释原因。（2分）` },
{ id:'A2026-C3', subject:'应用经济学', paper:'2026年（应经）', type:'计算', qid:'3',
  question:`（10分）市场上有两种类型的工人：高技术工人H和低技术工人L。高技术工人的比例为0.4，其边际产品价值为100；低技术工人的比例为0.6，其边际产品价值为60。企业无法直接观测工人的技术水平，只能观察第三方机构给出的评级认证来观测员工技术水平，高技术工人通过评级认证的成本 C_H(e)=e，低技术工人获得评级认证的成本 C_L(e)=2e。

（1）如果企业无法观察到工人的类型，也无法将教育水平作为信号，企业只能根据期望边际产出制定工资，那么企业会支付多少统一的期望工资？（4分）
（2）企业设定一个 e*，当观察到工人的水平高于 e* 时，则视为高技术工人并支付高工资 w_H，否则支付低工资 w_L，求出 e* 满足分离均衡的条件，以及满足分离均衡的最小 e*。（4分）
（3）比较（1）和（2）的福利结果，并说明评级这一信号传递对于社会福利的影响。（2分）` },
{ id:'A2026-C4', subject:'应用经济学', paper:'2026年（应经）', type:'计算', qid:'4',
  question:`（20分）在索洛经济增长模型中，假设经济的生产函数为 Y=A^(1-α)·K^α·L^(1-α)，其中，A 为技术水平，并以外生速率 g 增长；劳动力 L 以外生速率 n 增长。产出中用于投资的比例为储蓄率 s，资本折旧率为 δ。请解答以下问题：

（1）阐述平衡增长路径的含义。（4分）
（2）推导并求解平衡增长路径上单位有效劳动的平均资本 k* 和单位有效劳动的平均产出 ȳ*。（6分）
（3）该经济体按照增长路径是否必然到达黄金律？求解黄金律稳态下所要求的单位有效劳动的资本存量 k_gold 和产出 ȳ_gold。（6分）
（4）如果当前的储蓄率 s<α（其中 α 为资本的产出弹性），政府应如何调整政策才能使经济达到黄金律的资本水平？请说明理由。（4分）` },
{ id:'A2026-C5', subject:'应用经济学', paper:'2026年（应经）', type:'计算', qid:'5',
  question:`（15分）一个行为人身兼消费者和生产者。第一期初始资本禀赋为 k₁，通过生产函数 y₁=f(k₁) 获得产出，行为人可以投资 I 和买卖债券 b（利率为 r）。第二期生产为 y₂=f(k₂)，资本积累方程为 k₂=k₁+I。

行为人效用函数为 U(C₁,C₂)=C₁^(1-θ)/(1-θ)+β·C₂^(1-θ)/(1-θ)，其中 θ>0，β 为效用的贴现因子。

（1）行为人第一期进行一笔投资，调整投资的成本为成本函数 φ(I,k₁)=I·[φ/2·(I/k₁)²]，写出该行为人的跨期预算约束方程。（5分）
（2）求满足最优消费选择的一阶条件。（7分）
（3）说明投资的影响因素，给出经济学解释。（3分）` },
{ id:'A2026-E1', subject:'应用经济学', paper:'2026年（应经）', type:'论述', qid:'1',
  question:`（20分）材料1：随着数字经济的发展，平台型企业在电商等领域迅速崛起。头部企业利用算法、数据和用户路径依赖影响消费者选择，并通过“二选一”、独家签约协议等手段排挤竞争对手，构筑市场壁垒，导致新企业难以进入。同时，材料中还有“网络外部性”、“差别定价”、“新企业进入市场存在壁垒”、“短期消费者享受低价，但长期会威胁隐私泄露”等关键词。

材料2：介绍了针对平台型企业的监管措施，例如促进多平台信息互通、数据共享，以及规范平台与零工经济从业者（如骑手）之间的关系。

（1）结合材料1，分析为何平台型企业容易形成市场垄断？（5分）
（2）材料中提到的“差别定价”（大数据“杀熟”）算法，会对消费者剩余以及短期和长期的社会总福利产生怎样的影响？（5分）
（3）请运用一般均衡理论和瓦尔拉斯法则，解释“骑手多平台接单”和“全平台信息共享”对劳动力市场和产品市场有什么影响？（5分）
（4）请设计一个既能有效预防数字市场垄断，又能激励企业技术创新的政策方案，并阐述其理论依据和原因。（5分）` },
{ id:'A2026-E2', subject:'应用经济学', paper:'2026年（应经）', type:'论述', qid:'2',
  question:`（20分）材料1：阐述了“高质量充分就业”的重要性，指出就业是民生之本，我国当前存在就业结构性矛盾等问题。

材料2：摘录了“十五五”规划中对就业工作的要求，以及国家领导人关于多措并举稳定和扩大就业的指示。

（1）什么是自然失业率？它主要由哪几个部分构成？（4分）
（2）简述效率工资理论，并说明效率工资如何导致工资刚性进而影响失业？请至少运用两个理论模型来解释工资刚性现象。（5分）
（3）宏观经济政策如何影响周期性失业？结合当前中国的失业情况，应如何在传统菲利普斯曲线上进行表示？（7分）
（4）劳动者技能与工作岗位需求不匹配（结构性失业）会如何影响自然失业率？在此情况下，根据工资-通胀传导机制，菲利普斯曲线的形状将发生何种变化？（4分）` },

{ id:'A2025-S1', subject:'应用经济学', paper:'2025年（应经）', type:'简答', qid:'1',
  question:`“如果市场需求曲线向下倾斜，则每个厂商面对的需求曲线也向下倾斜。”这种说法是否正确，为什么。（5分）` },

{ id:'A2025-S3', subject:'应用经济学', paper:'2025年（应经）', type:'简答', qid:'3',
  question:`短期内的香烟需求完全缺乏弹性，假定其长期内的需求具有完全的弹性，如果对香烟征税，在短期和长期内分别对消费者和生产者在市场交易中的情况产生什么影响？（5分）` },
{ id:'A2025-S4', subject:'应用经济学', paper:'2025年（应经）', type:'简答', qid:'4',

  question:`请简要说明政府预算赤字的准确衡量可能面临的问题。（5分）` },
{ id:'A2025-S8', subject:'应用经济学', paper:'2025年（应经）', type:'简答', qid:'8',
  question:`请根据新古典企业固定投资模型，解释为什么企业的固定资产投资是实际利率的减函数。（5分）` },
{ id:'A2025-C1', subject:'应用经济学', paper:'2025年（应经）', type:'计算', qid:'1',
  question:`（12分）小王拥有16万元财产，其中包括一辆价值12万元的汽车。数据显示小王所在地区汽车的平均失窃率为25%，小王对财富 w>0 的效用函数为 U(w)=w^(1/2)。

（1）计算小王对自身财产的期望效用。（3分）
（2）根据小王的效用函数分析小王的风险偏好是风险厌恶、风险中性还是风险爱好？（3分）
（3）如果小王可以为汽车购买保险，一旦汽车被盗，则保险赔付汽车相同的价值，小王愿意接受的这份保险的最高价格 P 是多少万元？（3分）
（4）如果保险公司为小王提供“公平”保险，保险的价格应该是多少钱？与公平保险相比，保险公司最多能从小王这里获得多少利润？（3分）` },
{ id:'A2025-C2', subject:'应用经济学', paper:'2025年（应经）', type:'计算', qid:'2',
  question:`（13分）考虑奶茶和咖啡两种商品的消费市场，小红对奶茶和咖啡消费的效用函数为 U(x_m^H,x_c^H)=x_m^H·x_c^H，小红持有的奶茶和咖啡的禀赋 w^H=(4,6)；小绿对奶茶和咖啡消费的效用函数为 U(x_m^L,x_c^L)=ln x_m^L + ln x_c^L，小绿的禀赋为 w^L=(8,2)。

（1）画出代表奶茶和咖啡消费市场的埃奇沃斯盒状图，标出小红和小绿的初始禀赋配置。（4分）
（2）写出市场的契约曲线的函数，并在埃奇沃斯盒状图中画出。（4分）
（3）假设市场是完全竞争市场，将咖啡的价格设定为1，计算在市场出清时奶茶的价格，及小红和小绿对奶茶和咖啡的需求数量。（5分）` },
{ id:'A2025-C3', subject:'应用经济学', paper:'2025年（应经）', type:'计算', qid:'3',
  question:`（10分）已知某种产品由一家大厂商 i 和一家小厂商 j 提供，对此产品的总需求可表示为 Q=100-P。大厂商的生产成本函数为 C_i(q_i)=q_i，小厂商的生产成本函数为 C_j(q_j)=q_j²/2。假设大厂商可以通过为此产品制定价格而最大化自己的利润，而小厂商只能接受大厂商制定的价格来决定自己的产量。

（1）求出小厂商的产品供给曲线。（2分）
（2）求出大厂商面临的市场剩余需求曲线。（2分）
（3）计算此商品的市场价格，每个厂商的供给数量和总供给数量。（6分）` },
{ id:'A2025-C4', subject:'应用经济学', paper:'2025年（应经）', type:'计算', qid:'4',
  question:`（20分）在离散时间的索洛模型中引入政府支出，加入政府支出后最终产品支出设定如下 Y(t)=C(t)+I(t)+G(t)，其中 G(t) 表示 t 期的政府支出。模型中资本积累方程为 K(t+1)=I(t)+(1-δ)K(t)，其中 δ 为资本折旧率。假设模型中没有技术进步率，人口增长率为零。模型中生产函数 Y(t)=F(K(t),L(t))，符合索洛模型中标准假定。假定政府支出 G(t)=σY(t)。

（1）若设定 C(t)=sY(t)，请问在此模型中该设定是否合理；（6分）
（2）假定政府支出部分来自私人储蓄，C(t)=(s-λσ)Y(t)，λ∈[0,1]。请分析提高政府支出水平（表现为更高的σ），对此索洛模型的人均资本稳态会产生什么样影响？（8分）
（3）假定使用 G(t) 中的 φ 比例投资于资本存货，则 t 期的社会总投资为 I(t)=[1-s-(1-λ)σ+φσ]Y(t)。证明：如果 φ 足够大，人均资本的稳态水平将随政府支出的提高（σ提高）而增加，并分析这个结论是否合理。（6分）` },
{ id:'A2025-C5', subject:'应用经济学', paper:'2025年（应经）', type:'计算', qid:'5',
  question:`（15分）考虑一个由两个消费者组成的经济，其中每个消费者生存两期。消费者1非常没有耐心，对第一期的效用赋予很高的权重，其效用为 U₁(C₁,C₂)=ln(C₁)+0.5ln(C₂)，禀赋为在第一期有2单位消费品，第二期有1单位消费品。消费者2有耐心，第二期的效用权重更大，其效用为 U₂(C₁,C₂)=ln(C₁)+2ln(C₂)，禀赋为在第一期有1单位消费品，第二期有2单位消费品。假定消费品不能被跨期储存，但这两个消费者可以组成一个信贷市场，两个消费者可以互相进行信贷交易。

（1）写出每个消费者的最优化问题以及信贷市场出清条件。（8分）
（2）求均衡利率水平和每个消费者在每一期的消费。（7分）` },
{ id:'A2025-E1', subject:'应用经济学', paper:'2025年（应经）', type:'论述', qid:'1',
  question:`（20分）材料：近年来，眼看拼多多靠低价快速发展，诸多电商平台纷纷加码低价。与京东、淘宝类似，2024年2月，为吸引用户在自家的平台下单，抖音电商也将“价格力”定为2024年优先级最高的任务。然而，绝对低价战略并未推动电商平台业绩飞速攀升。

过去几年，由于追求极致低价，电商平台往往会针对性扶持可海量供应低价商品的白牌商家。然而，出色的实体商品需要兼顾质量、成本和效率，过分追求低价和效率，产生了“劣币驱逐良币”效应，直接导致大部分白牌商品的质量不佳，这也导致电商行业的投诉量飞速飙升。

在此背景下，为了保护消费者的权益，诸多电商平台纷纷上线“仅退款”服务。然而，此服务很大程度上只是亡羊补牢之举，一方面不能彻底扭转价格战引发的电商商品质量不佳的问题，另一方面也诱使部分消费者滥用规则恶意退款“0元购”，进一步恶化了电商环境。

正因为明晰了内卷并非缓解增长压力的良药，2024年618后，电商平台似乎不想继续“内卷”低价，而是希望回归理性发展。当前电商平台纷纷“拆墙”，并上线一系列人性化运营举措，一方面保障高质量品牌商品有一定的生存空间，另一方面致力于为消费者营造全面出色的购物体验，进而释放消费潜力。

（1）运用经济学理论阐释为什么绝对低价战略并没有带来电商平台业绩的提高。（5分）
（2）运用经济学理论分析为什么会出现部分消费者滥用规则恶意退款“0元购”的现象？（5分）
（3）电商平台不再内卷绝对低价，做出了什么样的举措来改善电商生态？根据经济学理论，你认为还有什么好的建议？（10分）` },
{ id:'A2025-E2', subject:'应用经济学', paper:'2025年（应经）', type:'论述', qid:'2',
  question:`（20分）材料：按照9月26日召开的中央政治局会议部署，财政部在加快落实已确定政策的基础上，围绕稳增长、扩内需、化风险，将在近期陆续推出一揽子有针对性增量政策举措。主要包括以下几个方面：一是加力支持地方化解政府债务风险，较大规模增加债务额度，支持地方化解隐性债务，地方可以腾出更多精力和财力空间来促发展、保民生。二是发行特别国债支持国有大型商业银行补充核心一级资本，提升这些银行抵御风险和信贷投放能力，更好地服务实体经济发展。三是叠加运用地方政府专项债券、专项资金税收政策等工具，支持推动房地产市场止跌回稳。四是加大对重点群体的支持保障力度，国庆节前已向困难群众发放一次性生活补助，下一步还将针对学生群体加大奖优助困力度，提升整体消费能力。

（1）简述财政政策的工具有哪些。根据经济学理论阐述政府扩大开支的政策是如何通过政府支出乘数机制拉动经济的。（6分）

{ id:'A2024-C4', subject:'应用经济学', paper:'2024年（应经）', type:'计算', qid:'4',
  question:`（15分）考虑一个资本可以完全流动的大型开放经济模型如下：

其中，Y 为总产出，消费函数 C(Y-T)=1000+0.8(Y-T)，G 和 T 分别为政府支出和税收，且 G=T=200，投资函数 I(r)=100-50r，净出口函数 NX(E)=1500-100E，E 为汇率；M 为货币供应量，M=1000，P=10；货币需求 L(Y,r)=0.2Y-100r，r 为国内利率，资本净流出 CF(r)=1000-100r。

{ id:'A2024-C5', subject:'应用经济学', paper:'2024年（应经）', type:'计算', qid:'5',
  question:`（15分）考虑一个内生增长模型，经济的生产函数为 Y_t=F[K_t,(1-u)E_t·L_t]，生产函数符合规模报酬不变和边际收益递减，u 为研发部门的劳动力比例。Ė(t)=g(u)E(t)，当 0<u<u_max<1 时，g'(u)>0，g''(u)<0；当 0<u_max<u<1 时，g'(u)<0，g''(u)<0。同时，L̇(t)=nL(t)，K̇(t)=sY(t)-δK(t)，其中 Ẋ(t)/X(t)=dlnX(t)/dt。

（1）用有效人均资本 k_t=K_t/(L_t·E_t) 和人均有效产出 y_t=Y_t/(L_t·E_t) 表示生产函数；

{ id:'A2024-E1', subject:'应用经济学', paper:'2024年（应经）', type:'论述', qid:'1',
  question:`（20分）材料：同一平台、同一时段、同款货品，下单价格竟有较大差别，更令人费解的是，多付费者还是平台的熟客。据报道，用户分别使用自己的高级会员和普通会员账号在同一电商平台购买同款商品，结果发现，高级会员账号不仅没享受到优惠，反而需要比普通账号支付更高的价格。近年来，类似大数据“杀熟”现象时有发生，给消费者带来困扰。

大数据“杀熟”更深层次的问题，其实在于平台对用户数据的保护和利用不当。基于便利，用户让渡了自己的部分数据权利。例如，让平台获取自己的消费习惯、消费能力、商品偏好、价格敏感等信息。然而，这并不意味着平台可以随意使用这些用户数据，或者利用信息不对称进行牟利。

为了预防和制止平台经济领域垄断行为，保护市场公平竞争，促进平台经济规范有序创新健康发展，维护消费者利益和社会公共利益，国务院反垄断委员会出台关于平台经济领域的反垄断指南。

（1）“大数据杀熟”行为产生的原因是什么？（5分）
（2）“大数据杀熟”对消费者会产生什么影响？（5分）
（3）如何治理“大数据杀熟”？（10分）` },
{ id:'A2024-E2', subject:'应用经济学', paper:'2024年（应经）', type:'论述', qid:'2',
  question:`（20分）材料：1970年代后期，美国经济陷入严重的滞胀状态，这一阶段美联储货币政策的首要目标为抑制通胀。同时，在1979年进行了一次重大的货币政策改革，主导思想由凯恩斯主义转向以弗里德曼为代表的货币主义，将货币政策的中介目标由联邦基金利率转向货币供应量M1，实行紧缩性货币政策，后来随着货币供应增长率出现大幅波动，美联储放弃设定狭义货币M1目标，转向广义货币M2。

到了80年代末，M2增长与经济活动之间的关系也越来越弱，美联储最终放弃了以M2作为货币政策中介目标，取而代之的是储备金总量指标，即通过控制储备金总量来调节利率水平，通过公开市场操作来达到储备金总量的目标，这一状况一直维持到1994年。

从1994年开始，泰勒规则代替货币主义成为货币政策制定的理论依据，相应地以实际利率为中介目标的“中性”货币政策取代以货币供应量作为中介目标的政策。泰勒规则的政策含义是联邦基金名义利率要顺应通货膨胀率的变化，以保持实际均衡利率的稳定性。

到2000年末，美国经济发展逐渐放缓，为防止经济停滞，美联储在2001年当年连续11次降低联邦基金利率。连续的降息，低成本的融资，一方面刺激了投资、信贷和消费，经济低迷状态有所好转，但另一方面，连续降息导致经济中出现了大量的资产泡沫。从2004年到2005年，美联储又连续10次提高利息，加息不仅直接刺破了美国的房地产泡沫，还最终引发了2007年的次贷危机，并随后演化为全球性金融与经济危机。

自2007年次贷危机爆发后，美联储开始连续降息，在短时间内将联邦基金利率目标由5.25%下调至0—0.25%之间，实际上启动了零利率政策。美联储无法再通过下调名义利率刺激经济，面对经济形势的恶化，美联储选择了量化宽松的非常规手段。

（1）自由主义货币政策渠道与凯恩斯主义货币政策渠道的根本差异是什么？（10分）
（2）美联储的主要货币政策工具除了利率调控，还有哪些？（5分）
（3）请阐述什么是负利率。（5分）` },

{ id:'A2023-C5', subject:'应用经济学', paper:'2023年（应经）', type:'计算', qid:'5',

{ id:'A2022-E1', subject:'应用经济学', paper:'2022年（应经）', type:'论述', qid:'1',
  question:`（20分）碳排放权交易市场建设，是利用市场机制控制和减少温室气体排放的重大举措。碳市场一方面控制排放总量，另一方面通过碳定价促进低碳转型。碳市场的重要性愈加凸显，在未来的碳中和之路上将发挥更大作用。

{ id:'A2020-C5', subject:'应用经济学', paper:'2020年（应经）', type:'计算', qid:'5',
  question:`假定总量生产函数为 Y=2K^(1/2)·L^(1/2)，Y 代表实际GDP，K 代表总的资本存量，L 代表雇佣的所有劳动力，再假定 K=100。

{ id:'A2020-E1', subject:'应用经济学', paper:'2020年（应经）', type:'论述', qid:'1',
  question:`（20分）材料1：人工智能连续第三年出现在政府工作报告中，而且相比2017年、2018年的“加快人工智能等技术研发和转化”“加强新一代人工智能研发应用”，今年政府工作报告中使用的是“深化大数据、人工智能等研发应用”，表述方式从“加快”“加强”到“深化”，证明人工智能将加快发展、成为促进新兴产业加快发展的新动能。

{ id:'A2020-E2', subject:'应用经济学', paper:'2020年（应经）', type:'论述', qid:'2',

{ id:'A2019-C2', subject:'应用经济学', paper:'2019年（应经）', type:'计算', qid:'2',

{ id:'A2019-C3', subject:'应用经济学', paper:'2019年（应经）', type:'计算', qid:'3',
  question:`（15分）假设消费者甲和乙都遵循费雪的跨期消费选择模型，甲和乙具有相同的跨期效用函数 U(C₁,C₂)=lnC₁+αlnC₂，其中 C₁ 为第一期消费，C₂ 为第二期消费，0<α<1。消费者甲在第一期和第二期的收入都是100元。消费者乙在第一期没有收入，而在第二期的收入为205元。他们都可以按利率 r 借款或贷款。初始财富和终止财富均为0。

{ id:'A2019-E1', subject:'应用经济学', paper:'2019年（应经）', type:'论述', qid:'1',
  question:`（20分）阅读下面材料然后回答问题：

材料1：2015年党中央、国务院专门制定了《生态文明体制改革总体方案》，明确了生态文明体制的“四梁八柱”，设计了“八项制度”。目前生态文明制度体系加快形成，自然资源资产产权制度改革积极推进，国土空间开发保护制度日益加强，空间规划体系改革试点全面启动，资源总量管理和全面节约制度不断强化，资源有偿使用和生态补偿制度持续推进，环境治理体系改革力度加大，环境治理和生态保护市场体系加快构建，生态文明绩效评价考核和责任追究制度基本建立。

材料2：人民网2017年报道指出：“在推动环境保护过程中，既要打攻坚战，又要打持久战。一方面，对于一些违法违规、环境污染的企业零容忍，依法依规严肃处理；另一方面也要按照分类指导的原则，一厂一策，具体问题具体分析。坚决反对不分青红皂白、不分好坏的‘一刀切’。即使对违法违规的企业，也是根据情况，能够整改的给予时间进行整改，并非一棍子打死。只有那些确确实实没有生存价值，又严重污染环境，整治又没有任何希望的企业，才最后关停关闭，也正因如此，环境保护与经济增长在过去这段时间相得益彰。”

材料3：美国在大气污染防治过程中，最有特色的是利用市场经济手段控制污染排放，建立了污染权交易体系。美国是一个市场经济高度发达的国家，20世纪70年代以来，环境保护署借鉴了水污染治理的排污许可证制度，对大气污染企业进行管理，因不同所有者之间排污权的交易必须是有偿的，排污权交易市场应运而生，逐步建立起以气泡、补偿、银行、容量结余为核心内容的排污权交易体系。

阅读上述材料，回答下面问题：
（1）为了防止污染引进排污权交易体系，请运用经济学原理分析排污权交易的经济学原理。（10分）
（2）请运用经济学原理分析对污染的控制是否越严越好？请具体阐述。（10分）` },
{ id:'A2019-E2', subject:'应用经济学', paper:'2019年（应经）', type:'论述', qid:'2',
  question:`（20分）背景：（1）美国自从布雷顿森林体系崩溃后，国际贸易余额30多年来一直为负，长期存在双赤字。（2）最近几年来，美国在宏观政策上，一面实行扩张性的财政政策，大规模减税和增加政府购买——进行大规模的军工建设和增加军费开支，另一面则采取谨慎偏紧的货币政策，不断提高贴现率，利率不断上升。同时，在国际贸易政策上则奉行单边保护主义，指责其他国家的贸易政策损害美国利益，是造成美国贸易逆差的祸首，并与中国爆发贸易战。

{ id:'A2018-E1', subject:'应用经济学', paper:'2018年（应经）', type:'论述', qid:'1',
  question:`（20分）材料1：垄断竞争是一种介于完全竞争和完全垄断之间的市场组织形式，在这种市场中，既存在着激烈的竞争，又具有垄断的因素。垄断竞争来源于产品的差别性。具体的差别来源于产品本身物质的或法律上的特点，还来源于进行销售的不同条件。前者包括产品的品质、设计、颜色、式样、包装等特点，还包括专利、商标和商店名称在内；后者包括例如在零售交易中，销售者的地点、工作效率、经营方式、公平交易的信誉、店员对顾客的态度等。

材料2：马歇尔在《经济学原理》一书中提出：“大规模生产的利益在工业上表现得最为清楚……大工厂的利益在于：专门机构的使用与改革、采购与销售、专门技术和经营管理工作的进一步划分。”马歇尔还论述了规模经济形成的两种途径，即依赖于个别企业对资源的充分有效利用、组织和经营效率的提高而形成的“内部规模经济”和依赖于多个企业之间因合理的分工与联合、合理的地区布局等所形成的“外部规模经济”。

材料3：钱德勒在1977年出版了《看得见的手——美国企业的管理革命》。他指出，“当管理上的协调比市场机制的协调能带来更大的生产力，较低的成本和较高的利润时，现代各单位的工商企业就会取代传统的小公司。”

阅读上述三段材料，请回答如下问题：
（1）画图分析垄断竞争行业市场均衡的状态。（10分）
（2）结合微观理论说明规模报酬递增的原因。（5分）
（3）说明市场交易中存在的交易成本与资源有效配置的关系。（5分）` },
{ id:'A2018-E2', subject:'应用经济学', paper:'2018年（应经）', type:'论述', qid:'2',

{ id:'A2017-C3', subject:'应用经济学', paper:'2017年（应经）', type:'计算', qid:'3',

{ id:'A2017-E1', subject:'应用经济学', paper:'2017年（应经）', type:'论述', qid:'1',
  question:`（20分）材料1：美国的反垄断立法始于1890年的《谢尔曼法》，《谢尔曼法》的立法背景是托拉斯的出现。标准石油公司是美国最早的托拉斯之一。1870年，洛克菲勒在俄亥俄州创建标准石油公司，到1879年已控制了全美90%的炼油业，1882年创建了世界第一家托拉斯——标准石油托拉斯，1890年垄断了美国95%的炼油能力、90%的输油能力、25%的原油产量。1890年参议员谢尔曼促成国会通过了旨在反对威胁市场自由竞争的法案，即《谢尔曼法》。1892年标准石油公司被俄亥俄州法院下令解散，洛克菲勒将公司重心转移到新泽西州。1906年，美国联邦政府起诉标准石油公司。1911年，美国最高法院判定标准石油公司存在垄断，最终标准石油公司被下令解散，分解成了30多家分公司。

材料2：2015年中国通信工业协会向国家发展和改革委员会举报高通公司，并罗列高通在中国的“七宗罪”：以整机作为计算许可费的基础、将标准必要专利与非标准必要专利捆绑许可、要求被许可人进行免费反许可、对过期专利继续收费、将专利许可与销售芯片进行捆绑、拒绝对芯片生产企业进行专利许可，以及在专利许可和芯片销售中附加不合理的交易条件等。发改委经调查取证和分析论证，高通公司在CDMA、WCDMA、LTE无线通信标准必要专利许可市场和基带芯片市场具有市场支配地位，实施了滥用市场支配地位的行为，对其罚款60.88亿元。高通公司表示接受，既不申请行政复议，也不提起行政诉讼。

材料3：1998年美国司法部对微软采取反垄断行为是为了创造竞争环境，以增加消费者的选择。这种观点得到不少反垄断问题专家的赞同。美国布鲁金斯学会反垄断问题专家罗伯特·利坦认为，在美国的绝大部分行业中，创新是最重要的推动力，因此，微软一案必须具有开创先例的价值。美国著名经济学家、“新增长理论”的创立者保罗·罗默同样支持对微软采取反垄断行动。

阅读上述三段材料，请回答如下问题：
（1）请指出垄断的定义并分析造成垄断的原因。（10分）
（2）请指出垄断可能带来的问题，并指出解决措施。（5分）
（3）对待微软这样重要的科技公司是否要进行反垄断？请说明原因。（5分）` },
{ id:'A2017-E2', subject:'应用经济学', paper:'2017年（应经）', type:'论述', qid:'2',
  question:`（20分）近期，两位著名经济学家就产业政策问题展开了辩论，引起了学界的广泛关注，问题的核心是在当下经济体制改革中如何处理好政府与市场的关系问题。

  question:`（15分）假设消费者面对如下跨期选择。消费者共生存两期，第一期收入为 Y₁，消费为 C₁，第二期收入为 Y₂，消费为 C₂。消费者初始财富和终止财富均为0，消费者第一期可选择储蓄 S，以用于第二期消费。若 S 为负，则表示第一期借款，第二期还款。储蓄或借款的利息率为 r，在此约束下，消费者欲实现其一生效用最大化。

{ id:'A2016-E1', subject:'应用经济学', paper:'2016年（应经）', type:'论述', qid:'1',
  question:`（20分）阅读下面的材料回答后面的问题：

材料1：据中国新闻网报道：从2004年至2014年，我国的粮食生产实现了“十一连增”，创造了中国乃至世界粮食史上的奇迹。2014年粮食产量达60710万吨，增产0.9%，预计2015年“十二连增”，粮食产量将达到62000万吨，增产1.76%。从绝对数量上来讲我国的粮食实现了大幅度增长。

材料2：美国从1933年开始使用农产品补贴工具，80多年来农业补贴政策不断演化，一方面绕过WTO规则，另一方面平衡国内外几个关系，保证美国农产品在国际贸易中的价格优势最大化。

材料3：在美国农业政策不断演化的同时，在美国国内对农业补贴的反对声音也不断，反对者认为：这种巨额的农业补贴，干扰了正常的贸易秩序。而且补贴只是让部分大农场主收益，个体农民或小农场主并没有得到真正的好处，另外在执行农产品补贴政策过程中也存在不少漏洞，比如目前国际市场的农产品价格已上涨了许多，但政府仍然为种植玉米的农户提供价格补贴；一些农户已经不再务农，但农业补贴照顾不误。

请回答：
（1）在粮食连续增产背后可能出现“谷贱伤农”的现象，请分析“谷贱伤农”背后的经济学原因。（10分）
（2）请根据材料2分析政府在农业领域可以发挥哪些作用？（5分）
（3）请根据材料3运用经济学原理分析什么时候政府应当干预经济，并给出相应对策。（5分）` },
{ id:'A2016-E2', subject:'应用经济学', paper:'2016年（应经）', type:'论述', qid:'2',
  question:`（20分）近年来，我国经济增速放缓，GDP增长率已经从2010年的10.6%降至2014年的7.4%，2015年的年增长率预计跌破7%。

（1）结合凯恩斯理论，从需求角度分析增速放缓的原因；（5分）
（2）结合经济增长理论，从供给角度分析增速放缓的原因；（5分）
（3）综合上述理论，提出相应的政策建议。（10分）` },

{ id:'A2015-C1', subject:'应用经济学', paper:'2015年（应经）', type:'计算', qid:'1',
  question:`（15分）某垄断企业面临政府保护的国内市场以及竞争激烈的国际市场这两个分割的市场。在国内市场，其产品的需求方程为 P_d=120-q_d/10；在国际市场上，其产品的需求方程为 P_e=240-q_e/10。企业的边际成本为 MC=60+Q/10。其中 Q=q_d+q_e。

（1）求出垄断企业的最优产出以及国内国外市场所占的份额。（5分）
（2）比较两个市场的价格与需求价格弹性。（5分）
（3）若两个分割的市场合并为一个市场，这时总产出与价格为多少？（5分）` },
{ id:'A2015-C2', subject:'应用经济学', paper:'2015年（应经）', type:'计算', qid:'2',
  question:`（15分）有一家钢铁厂，生产成本为 c(s,x)=s²(θ-x)²+s²；有一家渔场，生产成本为 c(f,x)=f²x²，其中 s 为钢产量，f 为鱼产量，x 为污染排放量，θ 为参数，求解：

（1）是否可以通过征收税收 t 达到社会最优化？可以的话，t 为多少？若不可以，说明理由。（7分）
（2）如果政府现在规定最大排污量为 K，排污权可以自由买卖，问最大排污量为多少？（8分）` },
{ id:'A2015-C3', subject:'应用经济学', paper:'2015年（应经）', type:'计算', qid:'3',
  question:`（10分）已知某市场上有 N 家成本一样的企业，单个厂商长期成本函数为 LTC=q³-2q²+6q，整个市场的需求曲线为 Q=20-2P。

（1）如果市场为垄断竞争市场，且每家企业需求为整个市场需求的 1/N。请问当 N 等于8时，该市场是否处于长期均衡，为什么？（5分）
（2）如果该市场为长期竞争市场，那么长期均衡时市场上企业数量 N 是多少？（5分）` },
{ id:'A2015-C4', subject:'应用经济学', paper:'2015年（应经）', type:'计算', qid:'4',
  question:`（15分）假设一个宏观经济的总产出函数为：Y=AK^α·L^(1-α)，0<α<1，其中 Y、K、L 和 A 分别为总产出、资本、劳动力和技术。产出 Y 的价格为 P，资本的租金率为 R，劳动力的工资为 W。假设资本供给为 K̄，劳动力供给为 L̄。

（1）当资本等于 K̄，物价为 P̄ 时，求满足劳动力供需均衡的工资水平 W*，并分析影响该均衡工资的因素。（10分）
（2）当资本等于 K̄，物价为 P̄，并且劳动力最低工资为 W_min 时（W_min>W*），求此时的劳动力供需缺口，以及产出总供给。（5分）` },
{ id:'A2015-C5', subject:'应用经济学', paper:'2015年（应经）', type:'计算', qid:'5',
  question:`（15分）假定对真实货币余额的需求取决于利率 i 和可支配收入 Y-T，货币需求为 M/P=L(i,Y-T)，满足性质 ∂L/∂i=θ<0，∂L/∂(Y-T)=τ>0。总支出为 E=C(Y-T)+I(i)+G，满足性质 0<∂C/∂(Y-T)=c<1，∂I/∂i=k<0。

其中 M 为名义货币需求，P 为物价水平，Y 为国民收入，E 为总支出，C 为消费，I 为投资，G 为政府购买，T 为税收，i 为名义利率，θ、τ、c、k 为参数。

（1）θ、τ、c、k 满足什么条件时，增加税收能够增加需求？（10分）
考虑一个资本完全流动的开放经济，E=C(Y-T)+I(i)+G+NX(e)，NX 为净出口，e 为名义汇率，∂NX/∂e=δ<0。
（2）在浮动汇率下，增加税收能否增加总需求？（3分）
（3）在固定汇率下，增加税收能否增加总需求？（2分）` },
{ id:'A2015-E1', subject:'应用经济学', paper:'2015年（应经）', type:'论述', qid:'1',
  question:`（20分）根据下面的材料回答后面的问题：

材料1：帕累托是19世纪初的意大利经济学家，他是福利经济学家的代表人物，以他的名字命名的“帕累托最优”是现代经济学中的一个重要概念，也是经济的一个美好的理想境界。

材料2：米尔顿·弗里德曼曾经说过：“伦纳德·里德《铅笔的故事》一文已经成为一篇经典之作。”大部分人应该都是从未想象过制造一根小小的铅笔竟然需要成千上万的人力，所涉及的行业领域竟如此之多，并且世界上没有一个人能用他的知识完整地描述出铅笔的整个生产过程。伦纳德·里德在其文章《铅笔的故事》中向我们阐述了一个铅笔的制造从原材料的采集到运输，再到生产，整个过程的纷繁复杂，包含了无数人直接参与或间接参与的行业，除了铅笔制造厂的工人外，其他人并不知道他们为制造铅笔出了力，而铅笔制造厂不过是整个生产过程的小部分而已。一根小小的铅笔在生产过程中涉及了庞大的产业链条，所有人进行分工劳作。然而这一庞大的过程中，人们并不因为本人需要铅笔而从事自己的工作，但是大家都被“无形的手”所驱使，使自己的体力和智力有效地自主地结合，从而带来高效、均衡的社会生产。伦纳德·里德试图通过一支铅笔的制造告诉人们人类社会可以在没有政府的干预下自由运转，甚至带来更高效的运转，而“看不见的手”在均衡中起着关键性的作用。

材料3：法国经济学家托马斯·皮凯蒂的新著《21世纪资本论》一经出版便引发东西方各国的热议和争论。作者提出近十余年来，世界的贫富差距正在严重恶化，而且根据预测将会继续恶化下去。当前在美国，前10%的掌握50%的财富，而前1%的人掌握了20%的财富。现有的市场经济制度只会让富人更富，穷人更穷。

阅读上述三段材料，回答下列问题：
（1）请阐述“帕累托改进”和“帕累托最优”的概念。（5分）
（2）请运用所学微观经济学知识分析《铅笔的故事》所蕴含的经济学理论。（10分）
（3）材料3中提出了目前全球收入分配差距正在恶化，经济学理论“帕累托最优”的资源配置状态是否意味着资源配置是平均的？请运用微观理论分析。（5分）` },

{ id:'A2014-C1', subject:'应用经济学', paper:'2014年（应经）', type:'计算', qid:'1',
  question:`（15分）假设企业1和2生产相同的产品且成本函数一样。其边际成本恒定且没有固定成本，即 AC=MC=10。整个市场的需求函数为 Q=200-P。请分别算出古诺模型和斯塔克尔伯格模型下的社会福利，比较哪个更大。` },
{ id:'A2014-C2', subject:'应用经济学', paper:'2014年（应经）', type:'计算', qid:'2',
  question:`（15分）设某消费者的效用函数为柯布-道格拉斯类型的，即 u=x^α·y^β，商品 x 和商品 y 的价格分别为 p_x 和 p_y，消费者的收入为 M，α 和 β 为常数，且 α+β=1。

（1）求解消费者关于商品 x 和商品 y 的消费函数。（5分）
（2）证明当商品 x 和商品 y 的价格以及消费者的收入同时变动一个比例的时候，消费者对两种商品的需求关系维持不变。（5分）
（3）证明消费者的效用函数中的 α 和 β 分别为商品 x 和商品 y 的消费支出占消费者收入的份额。（5分）` },
{ id:'A2014-C3', subject:'应用经济学', paper:'2014年（应经）', type:'计算', qid:'3',
  question:`（15分）设李四仅消费 x 和 y 两种商品，他的效用函数为 U=L^0.57·x^0.06·y^0.09，其中 L 是李四每周的闲暇小时数。假定李四的工资为每小时 w，商品 x 和商品 y 的价格分别为 p_x 和 p_y，每周7天，每天24小时，劳动工资是其收入的全部来源，求当他每周最大化其效用函数时：

（1）李四将选择每周工作多少小时？（2分），并将其收入的多大比例用于购买 x。（3分）
（2）李四消费 x 的需求价格弹性。（5分）
（3）如果李四的收入下降了30%，y 的价格下降了50%，他将过得更好还是更坏？（5分）` },
{ id:'A2014-C4', subject:'应用经济学', paper:'2014年（应经）', type:'计算', qid:'4',
  question:`（15分）考虑一个经济体由下面几个方程式描述：

菲利普斯曲线：π_t=E_{t-1}π_t+(Y_t-100)+ν_t
产品市场：Y_t=100-(r_t-2)+ε_t
央行的货币政策规则：i_t=π_t+2+(2/3)(π_t-2)+(1/3)(Y_t-100)
费雪方程式：r_t=i_t-E_tπ_{t+1}
预期形成机制：E_tπ_{t+1}=π_t+η_t

其中 Y_t 为 t 时期的总产出，π_t 为 t 时期的通货膨胀率，i_t 为 t 时期的名义利率，r_t 为 t 时期的实际利率，ε_t、ν_t、η_t 分别为 t 时期的需求冲击、供给冲击及预期冲击。

（1）请写出动态供给线方程和动态需求线方程，并计算长期均衡时的产出和通货膨胀率。（5分）
（2）假设经济在 t 期以前处于长期均衡点。考虑在 t 期人们对通货膨胀产生恐慌，使得 η_t=1，但这种恐慌只发生在 t 期，t 期后恐慌消失。请计算 t 期的产出、通货膨胀率、名义利率、实际利率。（5分）
（3）请计算出 t+1 期的产出、通货膨胀率、名义利率、实际利率，并解释为什么通货膨胀是预期自我实现的。（5分）` },
{ id:'A2014-C5', subject:'应用经济学', paper:'2014年（应经）', type:'计算', qid:'5',
  question:`（10分）假设一个封闭经济的总量生产函数为 Y=AK^α·(yL)^β。Y、A、K、L 分别表示总产出、技术系数、总资本、总人口，y 表示劳动参与率指标，y>0，我们约定 y=100% 时经济处于充分就业状态。假设该经济的人口增长率为 n，不考虑技术进步和折旧。假设经济的储蓄率 s 为外生常数。各外生参数取值分别为：A=0.2，s=0.5，α=0.5，β=0.5，n=0.01。

假设经过了一段足够长的时间后，在某个时刻 t 经济达到了稳定状态，总资本存量为 K*。我们约定在时刻 t 的总人口 L=1。同时经济在时刻 t 突然受到某种外生冲击，从而处于非充分就业状态，且此时的名义工资 W 保持不变，W=20。假设在时刻 t 经济的 IS 曲线方程为 Y=2-5r，LM 曲线方程为 M/P=0.5Y-5r，M 为货币供给数量，P 为经济的总价格水平，r 为实际利率。

（1）请计算经济在时刻 t 的总资本存量 K* 和充分就业产出 Y*。（5分）
（2）使用 y 作为企业的劳动需求质量衡量指标，计算在时刻 t 经济的劳动需求曲线（即实际工资 w 和 y 的函数关系）和短期总供给（Y 和 P 的关系）。（3分）
（3）计算在时刻 t 使得经济达到充分就业产出的货币供应数量 M*。（2分）` },
{ id:'A2014-E1', subject:'应用经济学', paper:'2014年（应经）', type:'论述', qid:'1',
  question:`（20分）根据下面的材料回答后面的问题：

材料1：近年来，伴随着物价水平接连上涨，各地政府不断推出价格补贴措施，如某市就根据物价上升幅度，调整了低保水平，将城市市区低保标准由920元/月，提高到1160元/月。

材料3：2013年03月29日公告，根据张家港市金港镇人民政府金政发【2013】20号《关于给予张家港化工机械股份有限公司研发补贴资金的通知》，张化机械获得研发补贴1200万元，公司于2013年03月27日收到上述补贴，该部分财政补贴资金将计入公司当期损益。

{ id:'A2014-E2', subject:'应用经济学', paper:'2014年（应经）', type:'论述', qid:'2',
  question:`（20分）据国内媒体报道，在某次高峰论坛上，某经济学家表示，中国经济增长的未来前景还在于投资，靠消费拉动是不现实的，而反周期的政府举措应当是最有效投资。该学者指出，中国经济自2008年开始有20年的高增长期，每年能保持8%左右的增速，但长期经济增长和短期反周期政策的结合还要靠投资拉动。此前发达国家爆发经济危机的多是消费高增长国家，但仅靠消费无异于无水之源，不能持续，因此还要靠有效投资拉动。

{ id:'A2013-C1', subject:'应用经济学', paper:'2013年（应经）', type:'计算', qid:'1',

{ id:'A2013-C2', subject:'应用经济学', paper:'2013年（应经）', type:'计算', qid:'2',
  question:`（15分）考虑一个小产品市场，其中假定男性市场对小产品的总需求为 X_m(P)=a-A_m·P，女性市场对小产品的总需求为 X_w(P)=a-A_w·P，这里假定 A_m<A_w。每件小产品的生产成本为 c。

（1）假定小产品市场是完全竞争的，求市场均衡时的价格和各自市场的需求量。（3分）
（2）设厂商甲是该小产品的垄断生产者，另假定厂商甲被禁止采取“价格歧视”政策（即对男性和女性分别定价），则使利润最大化的价格是多少？（5分）在怎样的条件下，男、女性都有正的需求量？（2分）
（3）仍设厂商甲是该小产品的垄断生产者，若允许厂商甲进行价格歧视，求出其对男性和女性分别的最优定价。（5分）` },
{ id:'A2013-C3', subject:'应用经济学', paper:'2013年（应经）', type:'计算', qid:'3',
  question:`（15分）封闭经济总需求与总供给模型：

消费函数：C=100+0.8Y
投资函数：I=1000-20r
名义货币供给量：M_s=800
实际货币需求量：M_d/P=0.2Y-20r
政府购买支出：G=500
短期总生产函数：Y=20L
劳动供给：L_s=100+2(W/P)
劳动需求：L_d=500-2(W/P)

W 为名义工资率，P 为价格水平，r 为利率。

（1）假设价格和工资充分弹性，请给出总需求函数和总供给函数，均衡产出与均衡价格水平是多少？（10分）
（2）如果政府购买支出 G 增加200，在价格和工资弹性的条件下，均衡的价格水平和产出会如何变动？（5分）` },
{ id:'A2013-C4', subject:'应用经济学', paper:'2013年（应经）', type:'计算', qid:'4',
  question:`（15分）考察索洛模型如下：

总生产函数为：Y_t=K_t^α·(A_t L_t)^(1-α)
资本积累方程：K̇_t=sY_t-σK_t
劳动力增长率：L̇(t)/L(t)=n
技术进步率：Ȧ(t)/A(t)=g

其中 Y_t 为 t 时期的总产出，K_t 为 t 时期的总资本存量，A_t 为 t 时期劳动的效率（代表技术进步），L_t 是 t 时期的总劳动量，s 是储蓄率。

（1）请你给出该增长模型的均衡点（静止点），即均衡时的平均有效资本 k*=K_t/(A_t L_t) 是多少？（3分）并证明它是否稳定？（2分）
（2）假定 α=1/2，σ=10%，n=1%，g=1.5%，s=50%，那么均衡下的平均有效资本 K_t/(A_t L_t) 是多少？（2分）它是否大于黄金律资本存量？（3分）
（3）若储蓄率 s 发生变化（比如下降），对平衡增长路径有什么影响？（5分）` },
{ id:'A2013-C5', subject:'应用经济学', paper:'2013年（应经）', type:'计算', qid:'5',
  question:`（15分）考虑一个单一产品经济，假定张三的寿命分两期：第一期参加工作，收入用于当期的消费和储蓄；第二期张三作为退休的老人，不参加工作，使用第一期的储蓄满足该期的消费。张三在第一期的消费为 c₁，储蓄为 s，劳动收入为 w；第二期的消费为 c₂；利率为 r。

张三的效用函数为：U(c₁,c₂)=(c₁^(1-θ)-1)/(1-θ) + β·(c₂^(1-θ)-1)/(1-θ)，0<β<1，θ>0。

假定 w、r、β、θ 为外生参数（数值已知）。

（1）写出张三的效用最大化问题。（2分）并给出张三在一、二期的消费函数。（5分）
（2）讨论利率 r 升高后，储蓄 S 如何变化？（4分）并给出经济解释。（4分）` },

{ id:'A2012-E2', subject:'应用经济学', paper:'2012年（应经）', type:'论述', qid:'2',

{ id:'A2011-E2', subject:'应用经济学', paper:'2011年（应经）', type:'论述', qid:'2',
  question:`（20分）请阅读以下材料，并回答问题：

——胡锦涛总书记在中央党校省部级主要领导干部“深入贯彻落实科学发展观，加快经济发展方式转变”专题研讨班开班式上的讲话，2010年2月3日

“……我们今天同意达成共识，迎接新的挑战，在危机过后，实现强劲、可持久、平衡的经济增长。我们将加强多边合作以推进外部可持续性，并寻求有益于减少巨大的贸易不平衡和维持经常项目不平衡处于可持续水平的全方位政策。按照各国财长以及央行行长未来达成的‘指引性指令’进行评估，如果一国出现持续性的巨大贸易不平衡，……（将）对该不平衡的性质及阻碍进行调整的原因进行评估，但需要对国家和地区的环境进行考虑。”

利用宏观经济学的原理，结合上述材料阐述分析中国转变经济发展方式与全球经济再平衡之间的关系。` },

{ id:'T0', subject:'理论经济学', paper:'真题说明', type:'说明', qid:'1',
  question:`南开大学经济学院理论经济学历年真题说明

（1）在2022年之前，理论经济学中招生最多的世界经济专业只考宏微观（和应用经济学用一套试卷），而除世界经济以外的其他理论经济学专业每年报名和招生人数都极少，这就使得搜集理论经济学真题的难度很大，导致目前市面上没有2022年以前849（微宏观及政经）的完整真题。得益于我们团队多年来专注于南开辅导，得以保留2015—2022年理论经济学中的政经部分真题（市面上没有任何机构有）。

虽然本真题册中更早年份理论经济学真题存在缺失，但每年80%以上的南开经济学上岸考生用三大本或课程，庞大的学员基数和我们的认真搜集整理，保证了我们的真题已经是市面最为准确、全面和权威的。

（2）以上缺失部分对于复习影响并不大，因为：

第一，849经济学的风格和847（微宏观）极像，近几年849简答题有的是847曾经考过的原题或类似题，计算题题型也都是847往年考过的，所以847真题对大家的参考价值很大，把847真题吃透，甚至经济增长个别高难度的压轴计算题不掌握，在849宏微观部分都不会有问题。

具体使用上，建议大家首先看看849近几年真题，了解一下难度和风格，具体练习的时候，可以先练习847真题，之后再对849真题进行全真模拟，通过全真模拟找到考场上的感觉和适合自己的答题时间分配。

第二，政经这一门课南开历年考的都很直接，不会像宏微观那样很灵活，大家只要做好背诵工作，背熟我们团队出的《政经背诵手册》，同时练好手册中总结的少量计算题，在政经中拿到高分是完全没问题的。

政经部分曾多次更换过参考书或大纲，在2019年之前是给的政经大纲，2020—2025年改为给参考书，其中2020—2021年给的参考书是马工程《政治经济学》、逄锦聚《中国特色社会主义政治经济学概论》和张俊山《政治经济学——当代视角》，2022—2025年删去后两本，只保留马工程《政治经济学》并给出重点章节。所以太早年份的政经真题参考价值不大，重点关注2020—2025年近六年政经真题，把握其难度和风格即可。

（3）与市面上其他真题不同，三大本第1册《真题大全解》不只是真题答案和解析。对于真题中难以理解之处或常见题型，学长学姐会进行点睛评注，为大家总结做题思路，帮助考生掌握一类题型的解题方法；重难点题目后附有考点拓展训练，帮助考生巩固拓展、举一反三，加深对考点的理解和掌握。

（4）真题永远是复习备考的最佳指南，一切复习方法的总结和复习计划的制定从根本上说都源自对真题和参考书的研究，并且这些方法和计划的成果最终也交由真题来检验。因此，大家一定要认真做和研究真题。` },

  question:`（20分）我国作为数据大国，在2020年4月印发了《关于构建更加完善的要素市场化配置体制机制的意见》，提出要加快数据要素市场培育，强化数据治理工作。广东作为数字经济发展的先行省份，于2021年7月在全国率先印发《广东省数据要素市场化配置改革行动方案》，首次提出建立“数据经纪人制度”，旨在鼓励设立社会性数据经纪机构，规范开展数据要素市场流通中介服务。

{ id:'F0', subject:'金融学', paper:'真题说明', type:'说明', qid:'1',
  question:`南开大学金融学院应用经济学历年真题说明

（1）南开大学金融学院是2015年从经济学院独立出去的，在独立的前两年（2015和2016年），金融学院和经济学院应用经济学847（微宏观）共用一套试卷，自2017年开始，金融学院开始独立命题。但是，2025年，为响应教育部专业课统一命题号召，金融学院再一次与经济学院应用经济学847（微宏观）共用一套试卷，但金院复试阶段笔试会考察计量经济学。因此，本部分所包含的2017—2024年真题即为金融学院独立命题阶段的完整真题。

（2）预计未来金融学院再独立命题的可能性很小。所以报考金融学院的同学，初试阶段需要像经济学院应用经济学考生一样按照847经济学进行备考，重点参考的是847往年真题。

（3）但2025考研金院复试已经确定笔试要考察计量，且考试难度和风格预计和往年金院初试真题中的计量有一定相似度（具体情况待复试结束后会有进一步结论），所以金院同学复试阶段学习计量时仍要一定程度参照初试中的计量真题。

（4）对于金融学院2017—2024年微宏观部分的真题，尤其是近几年真题，可以作为所有847考生在学有余力时作为练习题进行训练，因为老师在命题时可能也会参考其他代码的往年真题，并且金融学院的真题中有些题目出的比较新颖，能够很好锻炼大家对知识的理解。因此，金融学院的真题仍然具备一定的参考价值。` },

// ============================================================
// 应用状态
// ============================================================
let currentData = [...cardData];
let favorites = JSON.parse(localStorage.getItem('past_exams_favs') || '[]');
let notes = JSON.parse(localStorage.getItem('past_exams_notes') || '{}');
let edits = JSON.parse(localStorage.getItem('past_exams_edits') || '{}');

let singleModeId = null;
let history = [];
let historyIndex = -1;

const grid = document.getElementById('cardGrid');
const totalSpan = document.getElementById('totalCards');
const favSpan = document.getElementById('favCount');
const filterSubject = document.getElementById('filterSubject');
const filterPaper = document.getElementById('filterPaper');
const filterType = document.getElementById('filterType');
const filterFav = document.getElementById('filterFav');
const filterSearch = document.getElementById('filterSearch');
const clearBtn = document.getElementById('clearFilterBtn');
const randomBtn = document.getElementById('randomBtn');
const toast = document.getElementById('toast');
const singleModeBar = document.getElementById('singleModeBar');
const singleCardBadge = document.getElementById('singleCardBadge');
const exitSingleBtn = document.getElementById('exitSingleBtn');
const prevCardBtn = document.getElementById('prevCardBtn');
const nextCardBtn = document.getElementById('nextCardBtn');
const filterBar = document.getElementById('filterBar');

let toastTimer = null;

function showToast(msg) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2200);
}

function saveFavs() { localStorage.setItem('past_exams_favs', JSON.stringify(favorites)); }
function saveNotes() { localStorage.setItem('past_exams_notes', JSON.stringify(notes)); }
function saveEdits() { localStorage.setItem('past_exams_edits', JSON.stringify(edits)); }

// ---- HTML 转义，防止题目中的 < > 破坏页面 ----
function escapeHtml(text) {
    if (text === null || text === undefined) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// ---- 获取卡片数据（含编辑） ----
function getCardData(id) {
    const original = currentData.find(d => d.id === id);
    if (!original) return null;
    if (edits[id]) {
        return { ...original, question: edits[id].question || original.question };
    }
    return { ...original };
}

// ---- 动态填充专业下拉框 ----
function initSubjectOptions() {
    const subjects = [];
    cardData.forEach(d => { if (!subjects.includes(d.subject)) subjects.push(d.subject); });
    filterSubject.innerHTML = '<option value="all">全部专业</option>' +
        subjects.map(s => `<option value="${s}">${s}</option>`).join('');
}

// ---- 动态填充套卷下拉框 ----
function updatePaperOptions() {
    const subj = filterSubject.value;
    const prevVal = filterPaper.value;
    const papers = [];
    cardData.forEach(d => {
        if ((subj === 'all' || d.subject === subj) && !papers.includes(d.paper)) papers.push(d.paper);
    });
    // 「真题说明」优先排在最前
    papers.sort((a, b) => {
        if (a === '真题说明') return -1;
        if (b === '真题说明') return 1;
        return 0;
    });
    filterPaper.innerHTML = '<option value="all">全部套卷</option>' +
        papers.map(p => `<option value="${p}">${p === '真题说明' ? '📌 真题说明' : p}</option>`).join('');
    // 尽量保留原选择
    if (papers.includes(prevVal)) {
        filterPaper.value = prevVal;
    } else {
        filterPaper.value = 'all';
    }
}

function exitSingleMode() {
    if (singleModeId === null) return;
    singleModeId = null;
    history = [];
    historyIndex = -1;
    singleModeBar.classList.remove('show');
    filterBar.classList.remove('disabled');
    render();
    showToast('📋 已退出抽查模式');
}

function enterSingleMode(id) {
    if (!id) return;
    if (singleModeId !== null) {
        if (singleModeId === id) return;
        exitSingleMode();
        setTimeout(() => { enterSingleMode(id); }, 100);
        return;
    }
    const card = getCardData(id);
    if (!card) { showToast('😅 题目不存在'); return; }
    singleModeId = id;
    const existIdx = history.indexOf(id);
    if (existIdx !== -1) { historyIndex = existIdx; }
    else { history.push(id); historyIndex = history.length - 1; }
    singleModeBar.classList.add('show');
    filterBar.classList.add('disabled');
    updateSingleBadge(id);
    updateNavButtons();
    render(id);
    showToast(`🎯 抽查: ${card.paper} · ${card.type}${card.qid}`);
}

function updateSingleBadge(id) {
    const card = getCardData(id);
    if (card) {
        singleCardBadge.textContent = `${card.paper} · ${card.type}${card.qid}`;
    } else {
        singleCardBadge.textContent = id;
    }
}

function updateNavButtons() {
    prevCardBtn.classList.toggle('disabled', historyIndex <= 0);
    const ids = getFilteredIds();
    nextCardBtn.classList.toggle('disabled', ids.length <= 1);
}

function goPrevCard() {
    if (singleModeId === null) return;
    if (historyIndex <= 0) { showToast('已经是第一张了'); return; }
    historyIndex--;
    const id = history[historyIndex];
    if (id) {
        singleModeId = id;
        updateSingleBadge(id);
        updateNavButtons();
        render(id);
    } else { exitSingleMode(); }
}

function goNextCard() {
    if (singleModeId === null) return;
    const ids = getFilteredIds();
    if (ids.length <= 1) { showToast('😅 没有更多题目可抽查'); return; }
    const available = ids.filter(id => id !== singleModeId);
    if (available.length === 0) { showToast('😅 没有更多题目可抽查'); return; }
    const randomId = available[Math.floor(Math.random() * available.length)];
    history = history.slice(0, historyIndex + 1);
    history.push(randomId);
    historyIndex = history.length - 1;
    singleModeId = randomId;
    updateSingleBadge(randomId);
    updateNavButtons();
    render(randomId);
    const card = getCardData(randomId);
    if (card) showToast(`▶ 下一张: ${card.paper} · ${card.type}${card.qid}`);
}

function doRandom() {
    const ids = getFilteredIds();
    if (ids.length === 0) { showToast('😅 当前没有题目可抽查，请调整筛选条件'); return; }
    if (singleModeId !== null) {
        exitSingleMode();
        setTimeout(() => { doRandom(); }, 150);
        return;
    }
    const randomId = ids[Math.floor(Math.random() * ids.length)];
    enterSingleMode(randomId);
}

// ---- 编辑功能 ----
const editBackups = {};

function enterEditMode(id) {
    const card = getCardData(id);
    if (!card) return;
    const questionEl = document.querySelector(`.card-question[data-id="${id}"] .q-text`);
    const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
    if (!questionEl || !editBtn) return;
    if (editBtn.classList.contains('is-editing')) return;

    const currentQ = questionEl.textContent;
    editBackups[id] = { question: currentQ };

    const editQ = document.createElement('div');
    editQ.contentEditable = true;
    editQ.className = 'q-text editable';
    editQ.textContent = currentQ;
    editQ.style.cssText = 'display:inline-block;min-width:60px;outline:none;border-bottom:2px solid #6a9e9e;padding:2px 4px;white-space:pre-wrap;width:100%;';
    questionEl.replaceWith(editQ);

    editBtn.classList.add('is-editing');
    editBtn.textContent = '💾';
    editBtn.title = '保存修改';

    let cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);
    if (!cancelBtn) {
        cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn-cancel-edit';
        cancelBtn.dataset.id = id;
        cancelBtn.textContent = '❌';
        cancelBtn.title = '取消编辑';
        cancelBtn.style.cssText = 'font-size:18px;padding:4px 6px;background:transparent;border:none;cursor:pointer;border-radius:10px;color:#8a4a4a;transition:background 0.15s,transform 0.1s;';
        editBtn.parentNode.insertBefore(cancelBtn, editBtn.nextSibling);
        cancelBtn.addEventListener('click', function(e) { e.stopPropagation(); cancelEdit(id); });
        cancelBtn.addEventListener('mouseenter', function() { this.style.background = '#f0e0e0'; });
        cancelBtn.addEventListener('mouseleave', function() { this.style.background = 'transparent'; });
    } else { cancelBtn.style.display = 'inline-block'; }

    editBtn.onclick = function(e) { e.stopPropagation(); saveEdit(id); };
    showToast('✏️ 正在编辑，点击 💾 保存 或 ❌ 取消');
}

function saveEdit(id) {
    const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
    if (!editBtn || !editBtn.classList.contains('is-editing')) return;
    const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
    if (!editQ) { showToast('⚠️ 编辑内容不存在'); return; }
    const newQ = editQ.textContent.trim();
    if (!newQ) { showToast('⚠️ 题目不能为空'); return; }
    edits[id] = { question: newQ };
    saveEdits();
    exitEditMode(id, true);
    showToast('✅ 修改已保存');
}

function cancelEdit(id) {
    const backup = editBackups[id];
    if (!backup) { exitEditMode(id, false); return; }
    const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
    if (editQ) {
        const newSpan = document.createElement('span');
        newSpan.className = 'q-text';
        newSpan.textContent = backup.question;
        editQ.replaceWith(newSpan);
    }
    delete editBackups[id];
    exitEditMode(id, false);
    showToast('↩️ 已取消编辑');
}

function exitEditMode(id, saved) {
    const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
    const cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);
    if (editBtn) {
        editBtn.classList.remove('is-editing');
        editBtn.textContent = '✏️';
        editBtn.title = '编辑题目';
        editBtn.onclick = function(e) { e.stopPropagation(); enterEditMode(id); };
    }
    if (cancelBtn) cancelBtn.style.display = 'none';
    if (saved) render(singleModeId || null);
    delete editBackups[id];
}

// ---- 获取筛选后的ID ----
function getFilteredIds() {
    const subjVal = filterSubject.value;
    const paperVal = filterPaper.value;
    const typeVal = filterType.value;
    const favVal = filterFav.value;
    const searchVal = filterSearch.value.trim().toLowerCase();

    return currentData.filter(d => {
        if (subjVal !== 'all' && d.subject !== subjVal) return false;
        if (paperVal !== 'all' && d.paper !== paperVal) return false;
        if (typeVal !== 'all' && d.type !== typeVal) return false;
        if (favVal === 'fav' && !favorites.includes(d.id)) return false;
        if (searchVal) {
            const q = (d.question || '').toLowerCase();
            const p = (d.paper || '').toLowerCase();
            const s = (d.subject || '').toLowerCase();
            if (!q.includes(searchVal) && !p.includes(searchVal) && !s.includes(searchVal)) return false;
        }
        return true;
    }).map(d => d.id);
}

// ---- 渲染 ----
function render(singleId = null) {
    if (singleId !== null && singleModeId === null) {
        const ids = getFilteredIds();
        if (ids.includes(singleId)) {
            singleModeId = singleId;
            if (history.length === 0 || history[history.length - 1] !== singleId) {
                history.push(singleId);
                historyIndex = history.length - 1;
            }
            singleModeBar.classList.add('show');
            filterBar.classList.add('disabled');
            updateSingleBadge(singleId);
            updateNavButtons();
        } else { singleId = null; }
    }
    if (singleId === null && singleModeId !== null) { exitSingleMode(); return; }

    const isSingleMode = singleModeId !== null;
    let filtered;

    if (isSingleMode) {
        const card = getCardData(singleModeId);
        filtered = card ? [card] : [];
        if (filtered.length === 0) { exitSingleMode(); return; }
        updateSingleBadge(singleModeId);
    } else {
        const subjVal = filterSubject.value;
        const paperVal = filterPaper.value;
        const typeVal = filterType.value;
        const favVal = filterFav.value;
        const searchVal = filterSearch.value.trim().toLowerCase();

        filtered = currentData
            .map(d => getCardData(d.id))
            .filter(d => {
                if (!d) return false;
                if (subjVal !== 'all' && d.subject !== subjVal) return false;
                if (paperVal !== 'all' && d.paper !== paperVal) return false;
                if (typeVal !== 'all' && d.type !== typeVal) return false;
                if (favVal === 'fav' && !favorites.includes(d.id)) return false;
                if (searchVal) {
                    const q = (d.question || '').toLowerCase();
                    const p = (d.paper || '').toLowerCase();
                    const s = (d.subject || '').toLowerCase();
                    if (!q.includes(searchVal) && !p.includes(searchVal) && !s.includes(searchVal)) return false;
                }
                return true;
            });
    }

    totalSpan.textContent = currentData.length;
    favSpan.textContent = favorites.length;
    grid.classList.toggle('single-mode', isSingleMode);

    if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-result">🌿 没有找到匹配的题目，试试调整筛选条件吧</div>`;
        return;
    }

    let html = '';
    filtered.forEach(d => {
        const isFav = favorites.includes(d.id);
        const note = notes[d.id] || '';
        const isNote = d.type === '说明';
        const qText = escapeHtml(d.question);

        html += `
            <div class="card-item ${isFav ? 'favorited' : ''} ${isNote ? 'note-type' : ''}" data-id="${d.id}">
                <div class="card-header">
                    <div class="label">
                        <span class="tag">${escapeHtml(d.subject)}</span>
                        <span class="paper-tag">${escapeHtml(d.paper)}</span>
                        ${d.type !== '说明' ? `<span class="type-tag">${escapeHtml(d.type)}</span>` : ''}
                        ${d.type !== '说明' ? `<span class="qid">第${escapeHtml(d.qid)}题</span>` : ''}
                    </div>
                    <div class="card-actions" data-id="${d.id}">
                        <button class="btn-fav ${isFav ? 'active' : ''}" data-id="${d.id}" title="收藏">${isFav ? '⭐' : '☆'}</button>
                        <button class="btn-note ${note ? 'active' : ''}" data-id="${d.id}" title="笔记">📝</button>
                        <button class="btn-edit" data-id="${d.id}" title="编辑题目">✏️</button>
                    </div>
                </div>
                <div class="card-question" data-id="${d.id}">
                    <span class="q-text">${qText}</span>
                    ${d.type !== '说明' ? '<span class="toggle-hint">(点击展开作答区)</span>' : ''}
                </div>
                <div class="card-note-area" data-id="${d.id}">
                    <div class="note-editor" contenteditable="true" data-id="${d.id}">${note}</div>
                    <div class="img-resize-control" data-id="${d.id}">
                        <span>📐 大小</span>
                        <input type="range" min="10" max="200" value="100" step="2" />
                        <span class="size-val">100%</span>
                        <button class="btn-reset-size" data-id="${d.id}">重置</button>
                    </div>
                    <div class="note-actions">
                        <button class="btn-insert-img" data-id="${d.id}">🖼️ 插入图片</button>
                        <button class="note-save" data-id="${d.id}">💾 保存笔记</button>
                        <button class="note-clear" data-id="${d.id}">🗑️ 清空</button>
                        <span class="note-size-hint">支持粘贴图片 · 点击图片调大小</span>
                    </div>
                </div>
            </div>
        `;
    });

    grid.innerHTML = html;

    // ---- 事件绑定 ----

    // 1. 点击题目展开/收起作答区
    document.querySelectorAll('.card-question').forEach(el => {
        el.addEventListener('click', function(e) {
            if (this.classList.contains('editable')) return;
            const id = this.dataset.id;
            const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
            const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
            if (!noteArea) return;
            const isOpen = noteArea.classList.contains('open');
            if (isOpen) {
                noteArea.classList.remove('open');
                if (noteBtn) noteBtn.classList.remove('active');
            } else {
                noteArea.classList.add('open');
                if (noteBtn) noteBtn.classList.add('active');
                const editor = noteArea.querySelector('.note-editor');
                if (editor) setTimeout(() => editor.focus(), 100);
            }
        });
    });

    // 2. 收藏
    document.querySelectorAll('.btn-fav').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            const idx = favorites.indexOf(id);
            if (idx > -1) {
                favorites.splice(idx, 1);
                this.classList.remove('active');
                this.textContent = '☆';
            } else {
                favorites.push(id);
                this.classList.add('active');
                this.textContent = '⭐';
            }
            saveFavs();
            const card = this.closest('.card-item');
            if (card) {
                if (favorites.includes(id)) card.classList.add('favorited');
                else card.classList.remove('favorited');
            }
            favSpan.textContent = favorites.length;
        });
    });

    // 3. 笔记按钮
    document.querySelectorAll('.btn-note').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
            if (!noteArea) return;
            const isOpen = noteArea.classList.contains('open');
            if (isOpen) {
                noteArea.classList.remove('open');
                this.classList.remove('active');
            } else {
                noteArea.classList.add('open');
                this.classList.add('active');
                const editor = noteArea.querySelector('.note-editor');
                if (editor) setTimeout(() => editor.focus(), 100);
            }
        });
    });

    // 4. 插入图片
    document.querySelectorAll('.btn-insert-img').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
            if (!editor) return;
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);
            fileInput.onchange = function() {
                const file = this.files[0];
                if (!file) { document.body.removeChild(fileInput); return; }
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.alt = '笔记图片';
                    img.style.maxWidth = '100%';
                    img.style.maxHeight = '300px';
                    img.style.borderRadius = '10px';
                    img.style.margin = '6px 0';
                    img.style.display = 'block';
                    img.style.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';
                    img.dataset.noteImg = 'true';
                    const sel = window.getSelection();
                    if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                        const range = sel.getRangeAt(0);
                        range.insertNode(img);
                        range.setStartAfter(img);
                        range.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(range);
                    } else { editor.appendChild(img); }
                    showToast('🖼️ 图片已插入，点击图片可调大小');
                    document.body.removeChild(fileInput);
                    bindImgClick(editor);
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        });
    });

    // 5. 保存笔记
    document.querySelectorAll('.note-save').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
            if (!editor) return;
            let content = editor.innerHTML.trim();
            if (content === '<br>' || content === '') content = '';
            if (content) notes[id] = content;
            else delete notes[id];
            saveNotes();
            const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
            if (noteBtn) {
                if (content) noteBtn.classList.add('active');
                else noteBtn.classList.remove('active');
            }
            const orig = btn.textContent;
            btn.textContent = '✅ 已保存';
            setTimeout(() => { btn.textContent = orig; }, 1200);
        });
    });

    // 6. 清空笔记
    document.querySelectorAll('.note-clear').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            if (!confirm('⚠️ 确定要清空这条笔记吗？')) return;
            const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
            if (editor) {
                editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记、作答思路，支持粘贴/插入图片…</span>';
                delete notes[id];
                saveNotes();
                const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
                if (noteBtn) noteBtn.classList.remove('active');
                const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
                if (noteArea) noteArea.classList.remove('open');
                const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
                if (rc) rc.classList.remove('show');
                showToast('🗑️ 笔记已清空');
            }
        });
    });

    // 7. 粘贴图片
    document.querySelectorAll('.note-editor').forEach(editor => {
        editor.addEventListener('paste', function(e) {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            for (let item of items) {
                if (item.type && item.type.startsWith('image/')) {
                    e.preventDefault();
                    const file = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const img = document.createElement('img');
                        img.src = ev.target.result;
                        img.alt = '粘贴图片';
                        img.style.maxWidth = '100%';
                        img.style.maxHeight = '300px';
                        img.style.borderRadius = '10px';
                        img.style.margin = '6px 0';
                        img.style.display = 'block';
                        img.style.boxShadow = '0 2px 8px rgba(0,0,0,0.08)';
                        img.dataset.noteImg = 'true';
                        const sel = window.getSelection();
                        if (sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)) {
                            const range = sel.getRangeAt(0);
                            range.insertNode(img);
                            range.setStartAfter(img);
                            range.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(range);
                        } else { editor.appendChild(img); }
                        showToast('🖼️ 图片已粘贴，点击可调整大小');
                        bindImgClick(editor);
                    };
                    reader.readAsDataURL(file);
                    break;
                }
            }
        });
    });

    // 8. 笔记编辑器占位
    document.querySelectorAll('.note-editor').forEach(editor => {
        const id = editor.dataset.id;
        const content = notes[id] || '';
        if (!content || content.trim() === '') {
            editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记、作答思路，支持粘贴/插入图片…</span>';
        }
        editor.addEventListener('focus', function() {
            const placeholder = this.querySelector('.note-placeholder');
            if (placeholder) this.innerHTML = '';
        });
        editor.addEventListener('blur', function() {
            if (this.innerHTML.trim() === '' || this.innerHTML === '<br>') {
                this.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记、作答思路，支持粘贴/插入图片…</span>';
            }
        });
    });

    // 9. 绑定图片点击
    document.querySelectorAll('.note-editor').forEach(editor => { bindImgClick(editor); });

    // 10. 重置图片大小
    document.querySelectorAll('.btn-reset-size').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
            if (!editor) return;
            const imgs = editor.querySelectorAll('img');
            imgs.forEach(img => {
                img.style.width = '';
                img.style.maxWidth = '100%';
                img.dataset.origWidth = '100';
            });
            const slider = document.querySelector(`.img-resize-control[data-id="${id}"] input[type="range"]`);
            if (slider) {
                slider.value = 100;
                const valSpan = slider.closest('.img-resize-control').querySelector('.size-val');
                if (valSpan) valSpan.textContent = '100%';
            }
            showToast('📐 图片大小已重置');
        });
    });

    // 11. 滑块调整图片大小
    document.querySelectorAll('.img-resize-control input[type="range"]').forEach(slider => {
        slider.addEventListener('input', function() {
            const id = this.closest('.img-resize-control').dataset.id;
            const val = parseInt(this.value);
            const valSpan = this.closest('.img-resize-control').querySelector('.size-val');
            if (valSpan) valSpan.textContent = val + '%';
            const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
            if (!editor) return;
            const imgs = editor.querySelectorAll('img');
            imgs.forEach(img => {
                if (img.classList.contains('selected')) {
                    img.style.width = val + '%';
                    img.style.maxWidth = val + '%';
                }
            });
        });
    });

    // 12. 编辑按钮
    document.querySelectorAll('.btn-edit').forEach(btn => {
        btn.onclick = function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            if (this.classList.contains('is-editing')) return;
            enterEditMode(id);
        };
    });

    if (isSingleMode) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// ---- 图片点击 ----
function bindImgClick(editor) {
    const imgs = editor.querySelectorAll('img');
    imgs.forEach(img => {
        img.removeEventListener('click', imgClickHandler);
        img.addEventListener('click', imgClickHandler);
    });
}

function imgClickHandler(e) {
    e.stopPropagation();
    const img = this;
    const editor = img.closest('.note-editor');
    if (!editor) return;
    const id = editor.dataset.id;

    const allImgs = editor.querySelectorAll('img');
    allImgs.forEach(i => i.classList.remove('selected'));
    img.classList.add('selected');

    const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
    if (!rc) return;
    rc.classList.add('show');

    const slider = rc.querySelector('input[type="range"]');
    const valSpan = rc.querySelector('.size-val');
    if (!slider) return;

    let currentPct = 100;
    if (img.style.width) {
        const w = parseInt(img.style.width);
        if (w > 0 && w <= 200) currentPct = w;
    }
    slider.value = currentPct;
    if (valSpan) valSpan.textContent = currentPct + '%';

    slider.oninput = function() {
        const val = parseInt(slider.value);
        if (valSpan) valSpan.textContent = val + '%';
        img.style.width = val + '%';
        img.style.maxWidth = val + '%';
        img.dataset.origWidth = val;
    };

    const resetBtn = rc.querySelector('.btn-reset-size');
    if (resetBtn) {
        resetBtn.onclick = function(e2) {
            e2.stopPropagation();
            img.style.width = '';
            img.style.maxWidth = '100%';
            img.dataset.origWidth = '100';
            slider.value = 100;
            if (valSpan) valSpan.textContent = '100%';
            showToast('📐 已重置');
        };
    }
}

// ---- 筛选 ----
function onFilterChange() {
    if (singleModeId !== null) exitSingleMode();
    else render();
}

filterSubject.addEventListener('change', function() {
    updatePaperOptions();
    onFilterChange();
});
filterPaper.addEventListener('change', onFilterChange);
filterType.addEventListener('change', onFilterChange);
filterFav.addEventListener('change', onFilterChange);
filterSearch.addEventListener('input', onFilterChange);

clearBtn.addEventListener('click', function() {
    filterSubject.value = 'all';
    updatePaperOptions();
    filterPaper.value = 'all';
    filterType.value = 'all';
    filterFav.value = 'all';
    filterSearch.value = '';
    if (singleModeId !== null) exitSingleMode();
    else render();
});

exitSingleBtn.addEventListener('click', exitSingleMode);
prevCardBtn.addEventListener('click', goPrevCard);
nextCardBtn.addEventListener('click', goNextCard);
randomBtn.addEventListener('click', doRandom);

// ---- 键盘快捷键 ----
document.addEventListener('keydown', function(e) {
    if (e.key === 'r' || e.key === 'R') {
        if (!e.ctrlKey && !e.metaKey && !e.altKey) {
            const target = e.target;
            if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA' && target.contentEditable !== 'true') {
                e.preventDefault();
                doRandom();
            }
        }
    }
    if (e.key === 'Escape') {
        if (singleModeId !== null) { e.preventDefault(); exitSingleMode(); }
    }
    if (singleModeId !== null) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); goPrevCard(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); goNextCard(); }
    }
});

// ---- 初始化 ----
initSubjectOptions();
updatePaperOptions();
render();

setTimeout(() => {
    document.querySelectorAll('.note-editor').forEach(editor => {
        const id = editor.dataset.id;
        const content = notes[id] || '';
        if (!content || content.trim() === '') {
            editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记、作答思路，支持粘贴/插入图片…</span>';
        }
        bindImgClick(editor);
    });
}, 100);

  function buildPageContext() {
    var ctx = '';

    // 收集当前"用户正在看"的卡片（兼容多种页面结构）
    var cards = [];
    var seenQ = {};
    function addCard(item) {
      if (!item || cards.length >= 3) return;
      var qEl = item.querySelector('.q-text');
      var q = (qEl ? qEl.textContent : '').trim();
      if (!q || seenQ[q]) return;
      var aEl = item.querySelector('.card-answer.open .answer-inner');
      var a = aEl ? aEl.textContent.trim() : '';
      seenQ[q] = 1;
      cards.push({ q: q, a: a });
    }
    // 优先级 1：答案展开的卡片（背诵/简答/论述等页面）
    Array.prototype.forEach.call(document.querySelectorAll('.card-answer.open'), function (el) {
      addCard(el.closest('.card-item'));
    });
    // 优先级 2：笔记区展开的卡片（真题页用这个）
    if (cards.length === 0) {
      Array.prototype.forEach.call(document.querySelectorAll('.card-note-area.open'), function (el) {
        addCard(el.closest('.card-item'));
      });
    }
    // 优先级 3：视口内可见的卡片（什么都不点也能识别）
    if (cards.length === 0) {
      var vh = window.innerHeight;
      Array.prototype.forEach.call(document.querySelectorAll('.card-item'), function (item) {
        if (cards.length >= 3) return;
        var r = item.getBoundingClientRect();
        var cy = (r.top + r.bottom) / 2;
        if (cy > 0 && cy < vh) addCard(item);
      });
    }
    if (cards.length) {
      ctx += '\n【用户正在查看的内容】\n';
      cards.forEach(function (c, i) {
        ctx += '\n— 第 ' + (i + 1) + ' 张 —\n题目：' + c.q.slice(0, 400) + '\n';

      });

    if (paper && paper.value !== 'all') ctx += '\n【筛选·套卷】' + paper.textContent;

    return ctx.trim();
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    var open  = displayMode ? '$$' : '$';

    return '<span class="ai-formula-fallback">' + open + escapeHtml(trimmed) + close + '</span>';
  }

  function splitTableRow(line) {
    var s = line.trim();
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
    return s.split('|').map(function (c) { return c.trim(); });
  }

  function renderTable(tableLines) {
    if (tableLines.length < 2) return tableLines.join('\n');
    var headerCells = splitTableRow(tableLines[0]);
    var bodyRows = tableLines.slice(2).map(splitTableRow);
    var html = '<div class="ai-table-wrap"><table class="ai-table"><thead><tr>';
    for (var i = 0; i < headerCells.length; i++) {
      html += '<th>' + inlineMD(headerCells[i]) + '</th>';
    }
    html += '</tr></thead><tbody>';
    for (var r = 0; r < bodyRows.length; r++) {
      html += '<tr>';
      for (var c = 0; c < bodyRows[r].length; c++) {
        html += '<td>' + inlineMD(bodyRows[r][c]) + '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody></table></div>';
    return html;
  }

    /* 1. 提取代码块（原始文本） */
    var codeBlocks = [];
    t = t.replace(/```[^\n]*\n?([\s\S]*?)```/g, function (m, code) {
      var idx = codeBlocks.length;
      codeBlocks.push(code.replace(/\n$/, ''));
      return '\u0000CB' + idx + '\u0000';
    });

    /* 2. 提取公式（原始文本，此时 > < & 都还在） */
    var formulas = [];
    function pushFormula(expr, display) {
      var idx = formulas.length;
      formulas.push({ expr: expr, display: display });
      return '\u0000FM' + idx + '\u0000';
    }

    // 块级公式
    t = t.replace(/\$\$([\s\S]+?)\$\$/g, function (m, expr) { return pushFormula(expr, true); });
    t = t.replace(/\\\[([\s\S]+?)\\\]/g, function (m, expr) { return pushFormula(expr, true); });
    // 行内公式 $...$
    t = t.replace(/\$([^\$\n]+?)\$/g, function (m, expr) {
      var e = expr.trim();
      if (!e) return m;
      if (/^[\d\s,\.]+$/.test(e)) return m;
      if (/^[\u4e00-\u9fa5\u3000-\u303f]+$/.test(e)) return m;
      if (e.length > 150) return m;
      return pushFormula(expr, false);
    });
    // \(...\)
    t = t.replace(/\\\(([\s\S]+?)\\\)/g, function (m, expr) { return pushFormula(expr, false); });

    /* 3. 现在才 escapeHtml */
    t = escapeHtml(t);

    /* 4. 逐行扫描：表格 + 引用块 */
    var lines = t.split('\n');
    var out = [];
    var i = 0;
    var tableRegex = /^\s*\|.*\|\s*$/;
    var sepRegex = /^\s*\|[\s\-:|]+\|\s*$/;
    var quoteRegex = /^\s*&gt;\s?(.*)$/;

    while (i < lines.length) {
      var line = lines[i];

      if (tableRegex.test(line) && i + 1 < lines.length && sepRegex.test(lines[i + 1])) {
        var tableLines = [line, lines[i + 1]];
        i += 2;
        while (i < lines.length && tableRegex.test(lines[i])) {
          tableLines.push(lines[i]);
          i++;
        }
        out.push(renderTable(tableLines));
        continue;
      }

      // 引用块（注意 > 已被 escape 成 &gt;）
      if (quoteRegex.test(line)) {
        var quoteLines = [];
        while (i < lines.length && quoteRegex.test(lines[i])) {
          var m = lines[i].match(quoteRegex);
          quoteLines.push(m[1]);
          i++;
        }
        out.push('<blockquote>' + quoteLines.join('<br>') + '</blockquote>');
        continue;
      }

      out.push(line);
      i++;
    }
    t = out.join('\n');

    /* 5. 标题 */
    t = t.replace(/^#{4,6}\s+(.+)$/gm, '<h5>$1</h5>');
    t = t.replace(/^###\s+(.+)$/gm, '<h4>$1</h4>');
    t = t.replace(/^##\s+(.+)$/gm, '<h3>$1</h3>');
    t = t.replace(/^#\s+(.+)$/gm, '<h3>$1</h3>');

    /* 6. 加粗、斜体 */
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

    /* 7. 列表 */
    t = t.replace(/^[ \t]*[-*+]\s+(.+)$/gm, '<li>$1</li>');
    t = t.replace(/^[ \t]*\d+\.\s+(.+)$/gm, '<li>$1</li>');
    t = t.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g, function (m) { return '<ul>' + m + '</ul>'; });

    /* 8. 段落 */
    t = t.replace(/\n{2,}/g, '</p><p>');
    t = t.replace(/\n/g, '<br>');
    t = '<p>' + t + '</p>';

    /* 9. 恢复公式（用原始表达式） */
    t = t.replace(/\u0000FM(\d+)\u0000/g, function (m, idx) {
      var f = formulas[+idx]; if (!f) return '';
      var rendered = renderFormula(f.expr, f.display);
      return f.display ? '<div class="ai-formula-block">' + rendered + '</div>' : rendered;
    });

    /* 10. 恢复代码块（用原始代码，转义后插入） */
    t = t.replace(/\u0000CB(\d+)\u0000/g, function (m, idx) {
      var code = codeBlocks[+idx] || '';
      return '<pre class="ai-code"><code>' + escapeHtml(code) + '</code></pre>';
    });

    /* 11. 清理块级元素外围的 p 和 br */
    t = t.replace(/<p>\s*(<pre|<ul|<ol|<h[3-6]|<blockquote|<div class="ai-formula-block"|<div class="ai-table-wrap")/g, '$1');
    t = t.replace(/(<\/pre>|<\/ul>|<\/ol>|<\/h[3-6]>|<\/blockquote>|<\/div>)\s*<\/p>/g, '$1');
    t = t.replace(/<p>\s*<\/p>/g, '');
    t = t.replace(/(<(?:pre|ul|ol|h[3-6]|blockquote|div)[^>]*>)<br>/g, '$1');
    t = t.replace(/<br>(<\/(?:pre|ul|ol|h[3-6]|blockquote|div)>)/g, '$1');

    return t;
  }

  window.__AI_RERENDER__ = function () { renderHistory(); };

  /* ===================== 复制功能 ===================== */
  function copyToClipboard(text, onSuccess) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (onSuccess) onSuccess();
      }).catch(function () {
        fallbackCopy(text, onSuccess);
      });
    } else {
      fallbackCopy(text, onSuccess);
    }
  }
  function fallbackCopy(text, onSuccess) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      if (onSuccess) onSuccess();
    } catch (e) {}
    document.body.removeChild(ta);
  }

  var COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function attachCopyBtn(div, rawText) {
    var btn = document.createElement('button');
    btn.className = 'ai-copy-btn';
    btn.title = '复制';
    btn.innerHTML = COPY_ICON;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      copyToClipboard(rawText, function () {
        btn.classList.add('copied');
        btn.innerHTML = CHECK_ICON;
        btn.title = '已复制';
        setTimeout(function () {
          btn.classList.remove('copied');
          btn.innerHTML = COPY_ICON;
          btn.title = '复制';
        }, 1400);
      });
    });
    div.appendChild(btn);
  }

  function addMsg(role, text) {
    var div = document.createElement('div');
    div.className = 'ai-msg ' + role;
    if (role === 'ai') div.innerHTML = renderMD(text);
    else div.textContent = text;
    if (role === 'user' || role === 'ai') attachCopyBtn(div, text);
    msgsEl.appendChild(div); scrollToBottom(); return div;
  }
  function scrollToBottom() {
    requestAnimationFrame(function () { msgsEl.scrollTop = msgsEl.scrollHeight; });
  }
  function renderHistory() {
    msgsEl.innerHTML = '';
    if (!history.length) {
      var tip = document.createElement('div');
      tip.className = 'ai-msg sys'; tip.textContent = '有什么想问的？';
      msgsEl.appendChild(tip); return;
    }
    history.forEach(function (m) {
      var div = document.createElement('div');
      div.className = 'ai-msg ' + (m.role === 'user' ? 'user' : 'ai');
      if (m.role === 'user') div.textContent = m.content;
      else div.innerHTML = renderMD(m.content);
      attachCopyBtn(div, m.content);
      msgsEl.appendChild(div);
    });
    scrollToBottom();
  }

  function showToast(msg) {
    var t = document.getElementById('aiToast');
    if (!t) {
      t = document.createElement('div'); t.id = 'aiToast';
      t.style.cssText = 'position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(12px);background:#45b98c;color:#fff;font-size:13px;font-weight:600;padding:10px 22px;border-radius:30px;z-index:2000;box-shadow:0 10px 26px rgba(69,185,140,.34);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(function () { t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(12px)'; }, 1800);
  }

  function send() {
    if (isStreaming) { stopStream(); return; }
    var text = inputEl.value.trim();
    if (!text) return;
    if (!hasValidCfg()) { showConfig(); return; }
    inputEl.value = ''; inputEl.style.height = 'auto';
    var sys = msgsEl.querySelector('.ai-msg.sys'); if (sys) sys.remove();
    history.push({ role: 'user', content: text }); saveHistory();
    addMsg('user', text);

    var pageCtx = buildPageContext();
    var systemContent = cfg.system + (pageCtx ? '\n\n===== 当前页面上下文 =====\n' + pageCtx : '');
    var messages = [{ role: 'system', content: systemContent }].concat(history.slice(-12));

    var aiDiv = addMsg('ai', '');
    // 移除临时复制按钮（等回复完再加）
    var tempBtn = aiDiv.querySelector('.ai-copy-btn');
    if (tempBtn) tempBtn.remove();

    var cursor = document.createElement('span'); cursor.className = 'ai-cursor'; aiDiv.appendChild(cursor);
    var acc = ''; isStreaming = true; setSendBtn(true);
    controller = new AbortController();

    var url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify({ model: cfg.model, messages: messages, stream: true, temperature: 0.6 }),
      signal: controller.signal
    })
    .then(function (res) {
      if (!res.ok) {
        return res.text().then(function (txt) {
          var errMsg = 'HTTP ' + res.status;
          try { var j = JSON.parse(txt); errMsg = (j.error && j.error.message) || j.message || txt; } catch (e) { errMsg = txt || errMsg; }
          throw new Error(errMsg);
        });
      }
      if (!res.body) throw new Error('当前浏览器不支持流式响应');
      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffer = '';
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          buffer += decoder.decode(r.value, { stream: true });
          var lines = buffer.split('\n'); buffer = lines.pop();
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line || line.indexOf('data:') !== 0) continue;
            var data = line.slice(5).trim();
            if (data === '[DONE]') continue;
            try {
              var json = JSON.parse(data);
              var delta = (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content)
                       || (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content)
                       || '';
              if (delta) {
                acc += delta;
                aiDiv.innerHTML = renderMD(acc);
                aiDiv.appendChild(cursor);
                scrollToBottom();
              }
            } catch (e) {}
          }
          return pump();
        });
      }
      return pump();
    })
    .then(function () {
      cursor.remove();
      if (!acc.trim()) {
        aiDiv.className = 'ai-msg err';
        aiDiv.textContent = '未收到回复，请检查 API Key、模型名称或账户余额。';
        return;
      }
      history.push({ role: 'assistant', content: acc }); saveHistory();
      attachCopyBtn(aiDiv, acc);
    })
    .catch(function (err) {
      cursor.remove();
      if (err.name === 'AbortError') {
        if (acc.trim()) {
          history.push({ role: 'assistant', content: acc }); saveHistory();
          attachCopyBtn(aiDiv, acc);
        } else aiDiv.remove();
        return;
      }
      aiDiv.className = 'ai-msg err';
      aiDiv.innerHTML = '❌ 请求失败：' + escapeHtml(err.message || '未知错误')
        + '<br><br>常见原因：<br>· API Key 错误或余额不足<br>· Base URL 或模型名填错<br>· 网络无法访问该接口<br>· 服务商未开放浏览器直连（需换服务商或走代理）';
    })
    .then(function () {
      isStreaming = false; controller = null; setSendBtn(false); scrollToBottom();
    });
  }

  function stopStream() {
    if (controller) { try { controller.abort(); } catch (e) {} controller = null; }
    isStreaming = false; setSendBtn(false);
  }
  function setSendBtn(streaming) {
    if (streaming) {
      sendBtn.classList.add('stop');
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
      sendBtn.title = '停止';
    } else {
      sendBtn.classList.remove('stop');
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
      sendBtn.title = '发送';
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', function () {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && panel.classList.contains('show')) closePanel();
  });

  initPresetSelect();
  fillConfigForm();
})();
</script>
