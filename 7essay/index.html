            { id: 'h2q3', special: '宏观·第二层次', qid: '3',
                question: '为应对金融危机，美国政府实施了财政刺激计划，国债纪录屡创新高。2011年5月16日，美国国债终于触及国会所允许的14.29万亿美元上限。2011年8月2日美国国会通过了债务上限协议，同意将债务上限从2.1万亿美元提高至2.4万亿美元，但代价是未来十年内需削减1.2万亿美元规模的财政赤字。请根据宏观经济理论分析：\n（1）美国债务危机产生的原因？\n（2）试说明美国政府应该怎样选择债务融资与货币融资来弥补赤字？\n（3）美国债务危机对中国经济的影响。\n（对外经贸2012年考题）',
                answer: `（1）美元的国际地位是诱发债务危机的根本原因。
美元是世界货币，具有储备和投资的功能，美国国债实际上也是世界各国竞相购买以获取稳定收益的投资对象。在这种情况下，美国国债的发行虽然是其国内行为，却具有世界影响。一方面，世界需要美国以财政和贸易双赤字为条件向全球输出美元货币，世界则每年向美国支付数百亿美元的"铸币税"；另一方面，由于缺乏美元币值稳定的有效机制以及美国长期举债过日，客观上诱使美国通过增发美元来稀释其负债。当美国财政赤字和公共债务累积到难以为继的程度时，市场必然对美元币值以及美国国债的投资价值产生怀疑，这是美国债务危机产生的根本原因。具体而言：
① 预算赤字。联邦债务是每年的预算短缺和盈余的总和。
② 储蓄赤字。"储蓄"一词在美国公民的生活中几乎不出现，因为美国公民几乎不储蓄，取而代之的是信贷，他们习惯于使用信用卡，提前支出自己将来的收入用于当前的消费。
③ 贸易逆差。近年来，美国在全世界的贸易当中贸易逆差越来越大，进口远大于出口。
④ 领导能力缺乏。对于美国的债务问题，联邦政府所体现出的是领导能力的缺乏。面对如此巨额的账单，联邦政府决定大量印制美元来支付，然而这样做的后果是导致美元的快速贬值。
（2）债务融资和货币融资的区别表现在：
① 对货币发行量的不同效应。
如果财政是向公众借贷，则公众手里会持有更多债券，但他们持有的高能货币数量不会变化，因为政府卖掉公债的货币最终又会通过公共支出回到公众手里。
如果政府财政向中央银行借款或出售公债，那么公众手里的国库券或公债数额不会发生变化，但他们持有的高能货币会增加，原因在于政府赤字的弥补是通过中央银行增发货币实现的。
② 对投资的不同效应。
货币融资法会增加名义货币存量，而债务融资法由于不可能改变名义货币存量，就不会产生这种效应。而短期内由于货币存量增加，利率下降，因而货币融资法会刺激投资。
③ 对价格水平的不同效应。
与债务融资法相比，货币融资法会使价格上升得更高。因为货币融资法会增加货币存量，而货币存量的上升显然会提高价格水平。
综上所述，货币融资的三种效应归根结底是增发高能货币的效应。而债务融资虽然可以避免眼前的通货膨胀，却会增加未来的债务。这种债务会越背越重，从而产生未来的通货膨胀或税负压力。因此，针对美国严重的债务危机，应该选择货币融资法来弥补赤字。
（3）爆发的美国债务危机给世界经济特别是对以中国为首的发展中国家的经济发展带来深刻影响。这种影响既有积极的一面，如加强中国在国际货币体系中的话语权，但更多的是不利的一面，具体体现为：
① 美国债务危机将给世界市场增加不确定性及风险，将冲击包括中国在内的各国对外投资决策与现有经济政策。因为美国债务危机引发的全球性危机，可能导致美欧经济出现第二次衰退，这将严重影响到我国的出口，国内出口型产业面临洗牌，继而影响我国以出口带动经济增长的模式。
② 美国债务危机可能导致中国的房地产崩溃，进而银行坏账急剧增加，金融系统崩溃。
③ 面对欧美各国经济衰退的风险，中国货币政策也到了是否要调整的十字路口。一旦美国债务危机爆发，国际货币美元必然大幅贬值，人民币对美元升值，会造成人民币对内的大幅贬值，这将使中国国内产生通货膨胀。`,
                hasImage: false },

            { id: 'h2q4', special: '宏观·第二层次', qid: '4',
                question: '关于总供给与总需求。\n（1）为什么总供给曲线会有垂直与倾斜两种？哪一种是正确的？\n（2）如果美国和欧洲政府开始"退市"，即不再采取由政府主导刺激需求的政策，请问它对全球经济会产生什么样的影响？请分别用曲线分析和用经济学原理直观地解释。\n（3）请用总供给与总需求曲线分析次贷危机是如何引发全球经济衰退的。并用经济学原理解释其背后的机制。\n（4）如我们所知道的，中国政府用4万亿元人民币的刺激需求政策应对金融危机对中国经济的影响。请问该政策能够刺激的GDP生产是4万亿元还是比4万亿元多？为什么？请利用乘数原理解释其刺激程度受到哪些因素的影响。\n（5）假设在遭遇次贷危机引发的全球金融危机时，包括中国在内，全球都没有采取任何刺激需求的政策，请问中国经济（或全球经济）在短期内和长期内分别会受到什么样的影响？用总供给与总需求如何分析？',
                answer: `（1）因为所涉及的时期长短不同，所以总供给曲线会有垂直和倾斜两种。在长期中，一个经济的物品与劳务生产取决于它的劳动、资本和自然资源的供给。因此，长期总供给曲线是垂直的。
在短期中，物价水平确实影响经济的产量，至少有三种理论可解释总供给曲线向右上方倾斜：
① 黏性工资理论：未预期到的低物价水平增加了真实工资，这引起企业减少雇用工人并减少生产的物品与劳务量。
② 黏性价格理论：未预期到的低物价水平使一些企业的价格高于合意的水平，这就抑制了它们的销售，并引起他们生产的减少。
③ 不完全信息理论：未预期到的低物价水平使一些供给者认为自己的相对价格下降了，这引起生产减少。
两种总供给曲线都是正确的，长期垂直的总供给曲线建立在价格是完全可伸缩的基础上，而短期向右上方倾斜的总供给曲线建立在价格黏性的基础之上。
（2）将世界看作一个封闭经济体。欧盟和美国作为世界主要的经济体，其政策变化会对世界的总需求产生影响。欧盟的财政缩减计划以及美国开始退出量化宽松货币政策将会对全球的总需求造成巨大的负面冲击，短期内，导致总需求曲线向左移动，在总供给不变的情况下，均衡物价下降，产出下降。长期内，随着预期物价水平的调整，短期总供给曲线向右移动，产出最终恢复到充分就业水平。
（3）次贷危机开始于住房市场的价格下降，住房价格的大幅度下降导致金融机构出现亏损，金融机构的亏损和倒闭风潮导致了大量的失业、股价的下跌和房地产市场的低迷又使人们的财产缩水，这些都使社会总体消费水平下降，另一方面，银行业的亏损使得银行业产生严重的借贷情绪，企业无法获得贷款，私人投资水平下降，打击了实体经济的发展。由于这些事件，经济的总需求的大幅度收缩。
美国是全世界第一大经济体，在全球化和开放经济的前提下，其所面临的负向需求冲击对世界经济的总需求也产生了收缩的作用。总需求的下降使得总需求曲线向左移动，降低了短期全球经济的总产出水平，同时使得价格下降，工资下降，经济衰退，引发全球性的经济危机。
（4）该政策能够刺激的GDP生产比4万亿元多。该政策的具体表现是政府购买支出增加以及减税。假定消费边际倾向为β，不考虑减税的情况下，则政府购买支出乘数为 1/(1−β)，由于边际消费倾向 0<β<1，所以政府购买乘数大于1，此时GDP的增加量为 4/(1−β) 万亿，因此超过了4万亿元。
中国政府4万亿的刺激需求的政策的刺激程度主要受到以下因素的影响：
① 社会中过剩生产能力的大小。如果没有过剩生产能力，没有闲置资源，则投资增加及由此造成的消费支出增加，并不会引起生产增加，只会刺激物价水平上升。
② 投资和储蓄决定的相互独立性。要假定它们相互独立，否则，乘数作用要小得多，因为增加投资所引起的对货币资金需求的增加会使利率上升，而利率上升会部分地抵消由于投资增加引起收入的增加。
③ 货币供给量增加能否适应支出增加的需要。假使货币供给受到限制，则投资和消费支出增加时，货币需求的增加就得不到货币供给相应增加的支持，利率会上升，抑制投资，产生挤出效应，使总需求降低。
④ 增加的收入不能用于购买进口货物，否则GDP增加会受到限制。
⑤ 对政府增加的公共工程支出，也可能存在一些抵消作用。
（5）在短期内，中国经济或全球经济都会陷入衰退甚至萧条状态，但在长期内，经济会自行恢复到充分就业水平。
假定初始经济位于均衡点A，此时产出为Y₁，物价水平为P₁。当经济受到负向的需求冲击，那么总需求曲线向左移动到AD₂，短期总产出下降到Y₂，价格下降到P₂。此时，由于价格水平下降，人们会对价格预期进行调整，即公众的预期价格水平下降，短期总供给曲线右移。最终预期价格等于实际价格，产出恢复到潜在产出的水平，即经济最终恢复到C点。相对于政策干预，经济自行恢复到充分就业水平需要一段较长的时间。
【本题有图示】`,
                hasImage: true },

            { id: 'h2q5', special: '宏观·第二层次', qid: '5',
                question: '2022年7月以来，在国内经济修复放缓、美联储坚定收紧货币政策、欧洲能源危机加剧的背景之下，美元指数大幅上行，人民币持续走贬，并引发央行下调外汇存款准备金率以引导市场预期。2022年9月7日银行间外汇市场人民币汇率中间价为1美元对人民币6.9160元，较上一交易日下调64个基点。在岸人民币对美元汇率跌破6.97元关口，离岸人民币对美元汇率跌破6.99元关口。\n请结合以上信息回答如下问题：\n（1）人民币贬值的原因是什么？\n（2）面对人民币贬值，我国应该如何应对？',
                answer: `（1）① 美元是全球主要储备货币，美联储掌握着全球流动性的阀门，历史上每次美元周期均会导致全球跨国资本流动的动荡。为解决当前美国市场面临的高通胀以及稳定民众的通胀预期，今年美联储开启40年来最大力度的加息进程。美联储紧缩预期叠加欧元区滞胀风险上升，导致美元走势较强，推动美元指数重新升至二十年新高。跨国资本从我国回流至美国，人民币相对贬值。
② 国内经济反弹受阻。经济恢复不及市场预期，我国经济正面临需求收缩、供给冲击和预期转弱三重压力。当前我国居民消费持续走弱，基建投资虽保持稳健增长，但房地产投资继续下探，世界经济下行压力下海外需求走弱。在市场信心不足的情况下，跨国资本回流至当前经济表现更好的美国，人民币相对贬值。
③ 中美利差倒挂加深，中美货币政策分化加剧。在美联储不断加息，联邦基金利率不断上调，其他发达国家和新兴市场国家追随美联储脚步进行加息的背景下，我国为应对市场经济疲软，央行采取一系列措施恢复信贷规模，银行间市场流动性持续宽松，资金利率持续下行。
④ 贸易顺差能够增加外汇市场上对于人民币的需求，对汇率具有支撑作用。但当前贸易顺差对汇率的支撑作用有所减弱，因为贸易顺差能否支持人民币汇率走强取决于三点：一是海关贸易顺差本身的规模，二是贸易顺差转化为结售汇顺差的能力，三是贸易结售汇顺差被其他渠道结售汇逆差对冲的程度。
⑤ 但是，从经济基本面看，人民币汇率不具有单边持续贬值的基础。近期汇率波动反映了美元的强势，在美元强势的大背景下，人民币短期或仍将承压，但是从长期来看，人民币走势将回归人民币的基本供需。
（2）① 真正决定汇率中长期走势的是经济的基本面，因此就我国而言，现阶段政策的关键是稳增长。
a. 积极的财政政策要提升效能，更加注重精准、可持续。财政直达消费，比如给受疫情影响的人群、低收入人群直接发放补助，可以直接拉动需求；用好政策性金融工具和政府专项债，加大新基建和新能源的投资力度，短期有助于稳增长、稳就业，长期有助于打造中国经济的新引擎。
b. 稳健的货币政策要灵活适度，保持流动性合理充裕。发挥货币政策工具的总量和结构双重功能，为实体经济提供更有力支持；扩大新增贷款规模；疏通货币政策传导机制，引导资金更多流向重点领域和薄弱环节，扩大普惠金融覆盖面；提振民营经济信心，解决当前宽信用和资金"堰塞湖"堵点问题，促进稳增长、带动就业、激发创新、释放市场活力。
c. 把实施扩大内需战略同深化供给侧结构性改革有机结合起来，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，把发展的基点牢牢放在自己力量的基础上。统筹谋划扩大内需和优化供给，充分发挥超大规模市场优势，提升供给体系对国内需求适配性，打通经济循环卡点堵点，推动供需良性互动，在实现自身高质量发展的同时为世界经济注入新动力。
② 加快汇率形成机制改革，扩大汇率弹性。当汇率的形成是通过市场供求关系确定时，汇率的灵活变动就能够在一定程度上吸收发达国家货币政策的溢出效应，既确保不会形成持续的价格错配，弱化跨国资金大规模投机的行为动机，又能够有效稳定经济金融运行，降低对实体经济的负面冲击。
③ 加强宏观审慎政策对资本账户的监管。将资本管制纳入到宏观审慎政策框架中，如对跨境银行的借贷规模和借贷行为进行实时监测，有需要的情况下可以加大管制力度，规定借贷规模限额和设定借贷行为门槛，降低跨境资金过度流动，促使跨境交易主体主动调整跨境投资行为。`,
                hasImage: false },

            /* ---------- 宏观 · 第三层次（6道） ---------- */
            { id: 'h3q1', special: '宏观·第三层次', qid: '1',
                question: '讨论有关经济增长的问题。\n（1）请指出经济增长的源泉有哪些，并说明促成人均GDP增长的动力是什么。\n（2）中国已经经历了持续28年的高速经济增长，请利用经济增长理论和GDP核算理论说明，中国经济增长的隐忧是什么？应该如何消除这些隐忧？\n（3）是总供给方面的因素还是总需求方面的因素促进了经济增长？\n（武汉大学2007年考题）',
                answer: `（1）① 根据经济增长核算方程 ΔY/Y = α(ΔK/K) + (1−α)(ΔL/L) + ΔA/A，经济增长的源泉主要有：
第一，资本存量的增加，如储蓄率的提高等。中国的高储蓄率支撑了高速增长所需要的资本。对外开放，招商引资，引进国外资本，大大解决了资本不足的问题，同时带来了国外先进技术，提高了生产率。此外金融机构的崛起，规范化，规模化的发展，使得很多企业解决了资本不足的问题。
第二，劳动数量增加和质量提高，即人力资本的增长。改革开放，对内改革，释放了广大人口劳动力的积极性，人口的增长，使越来越多的人进入到市场经济中来，增大了产出。同时，人口流动性加强，大量人口从农村转移到城市，从农田转移到工厂，使得人均生产率大幅跃升。此外国家重视教育，人力资源得到极大培育，人口红利进一步展现。
第三，技术进步，这里是广义概念，包括采用新技术、新产品、先进管理手段以及资源配置的高效率等。处于计算机高速发展的年代，经济全球化，信息化，知识水平的提高，管理水平的增长，国家建设创新型国家的决策，这些进一步促进了我国的企业发展，使增长加快。
第四，经济制度的完善。保证了一个良好的市场运行环境，企业家的合法利润得到保证，经济运行的外在阻力进一步减少，审核制度，权利寻租现象的减少，也让企业的发展更加长久和高效。
② 促成人均GDP增长的动力主要来自于技术进步和资本深化。
第一，由索洛模型的稳态条件 Δk = s f(k) − (δ+n+g)k = 0，稳态时有效人均资本和有效人均产出增长率为0，而人均产出增长率 ΔY/Y = ΔA/A + Δy/y = g，因此技术进步可以带来稳态人均产出的持续增加。
第二，由有效人均资本的动态方程 Δk = s f(k) − (δ+n+g)k 可知，当资本深化不断增加，即 Δk>0 时，有效人均资本存量不断增加，导致有效人均产出和人均产出不断增加。
（2）经济增长理论说明了资本深化（新古典增长理论）以及技术进步（新经济增长理论）对于经济增长的贡献。【长期，供给端】
GDP核算理论则说明，经济增长直观地来源于消费、投资、政府购买以及国外需求等方面。【短期，需求端】
中国经济已经持续30多年高速增长，但是存在着隐忧：
① 从增长理论方面来看：
第一，过去很多年中，我国经济增长主要发挥了廉价劳动力优势。农村富余劳动力向城市转移是典型的现象，这些劳动力为城市基础设施建设以及劳动密集型产业的发展提供了支持，我国城市化进程迅速加快，同时纺织业、电子工业等制造业产业的产品在国际上获得了竞争优势。
但是随着我国计划生育政策周期性结果的产生以及老龄化进程的加快，人口金字塔结构已经发生了变化。农村空巢以及"民工荒"等现象屡屡出现，我国"人口红利"即将耗尽的问题正在逐渐成为热点问题。
第二，要素供应效率下降。劳动投入、资本形成、科技进步是实体经济发展的三个要素。过去这几十年里，中国奇迹的出现靠的就是劳动和资本投入的不断增加以及科技的不断进步，但现在这两个要素供应效率在下降，科技进步同样缓慢。
第三，科技创新能力滞后。很多因素导致我国无法继续在引进、模仿基础上进行创新，所以创新已经成为中国经济发展的首要任务。现在全世界正酝酿第三次工业革命，主要内容就是数字化、服务化、网络化等，但这些内容大部分都被发达经济体掌握，他们依然引领技术潮流，我们目前在科技创新方面是落后的。
第四，环境资源约束。雾霾、饮用水污染、重金属超标等环境污染问题已经对生产形成硬约束，如果生产函数中考虑环境污染因素，将其作为负因素纳入生产函数中，那么估算的劳动生产率很可能是下降的。
② 从GDP核算方面来看：
在前几年的发展过程中，投资和外贸是经济增长的主要贡献力量。我国投资率长期处于较高水平，其中又以政府投资居多。另一方面，国际市场对中国廉价产品的需求十分旺盛，我国制造业产品持续多年保持强劲的出口态势，由此产生了巨额贸易顺差，带来了大量的外汇储备。
然而，政府投资项目主要是公共产品，居民消费水平的提高远远滞后于经济发展速度，作为经济增长"三驾马车"之一的消费始终疲软，成为阻碍经济增长的重要原因。同时，我国的制造业产品在欧美市场遭遇了越来越严重的贸易壁垒，反倾销、反补贴、配额、关税等等手段的同时使用阻碍了产品的出口，给外贸企业造成了利益损失。巨额的外汇储备也使人民币面临升值压力，而外汇管理制度改革的滞后使得中央银行必须发行人民币来购买外汇，国内流动性过剩问题难以有效解决。此外，近年来的发展很大程度上牺牲了环境与资源，而这一些因素尚未进入GDP统计。粗放型经济增长方式亟待转变。
（3）消除这些隐忧的主要办法是：
第一，树立重视人力资本和新知识的观念。新经济增长理论的专业化知识和人力资本积累是经济增长持续和永久的源泉与动力的观点对具有丰富人力资源的我国经济发展具有重大的现实意义。以教育培训为主体，加大的人力资本投入以及提高新知识积累效应对我国经济增长率和收入水平的提高是巨大的推动作用。【供给角度】
第二，加强国际间的交流与合作，进行知识的传递与交换。新经济增长理论还认为，开放经济有利于知识的积累，从而促使经济发展。【供给角度】
第三，促进创新，提高技术进步率。通过技术进步获得高效的生产能力，由此取得竞争优势，弥补劳动力在未来可能出现的短缺所造成的经济增长隐忧。【供给角度】
第四，拉动国内消费需求。发展消费信贷市场，更新消费观念；发展农村消费品市场，挖掘产品销售潜力等办法可以提高消费水平，使之成为促进我国经济增长的又一重要源泉；建立健全社会保障体系。【需求角度】
第五，发展绿色GDP核算。在经济发展的同时考虑环境保护和资源使用效率，由粗放型增长转变为集约型增长，树立科学发展观。
（4）从以上的分析可以看出，促进我国经济增长的主要动力既有总供给方面的因素，也有总需求方面的因素：我国经济增长一部分是来自劳动力供给和技术革新（工业化改造），另外一部分是来自投资需求，出口需求以及政府公共支出的增长。`,
                hasImage: false },

            { id: 'h3q3', special: '宏观·第三层次', qid: '3',
                question: '近年来，中国经济增速开始下降并进入增长"新常态"。请用IS-LM模型图示和文字说明如果政府继续采用传统的经济刺激政策，经济在短期内和长期内应该如何调整？',
                answer: `"新常态"意味着经济增长从高速转为中高速，从规模速度型粗放增长转向质量效率型集约增长，从要素投资驱动转向创新驱动。传统的经济刺激政策指的是凯恩斯主义的需求管理政策，主要包括扩张性财政政策与扩张性货币政策。
（1）短期传统经济刺激政策效果
若政府采取扩张性财政政策，如增加政府支出，短期内可以使IS曲线右移，虽然推高利率，挤出了私人投资，但是总需求增加，短期GDP上升。
若政府采取扩张性货币政策，如增发货币，降低基准利率，短期内可以使LM曲线右移，降低利率，鼓励私人投资，从而总需求增加，短期GDP上升。
（2）长期传统经济刺激政策效果
"新常态"时期造成中国经济增速回落的原因是多方面的，其中主导因素是阶段性的结构因素，但同时也存在着短期因素和周期性因素的作用。
短期传统经济刺激政策效果，无论是扩张性财政政策还是扩张性货币政策，本质上都是凯恩斯主义需求管理政策，只能作用于总需求。这种需求管理政策在应对以周期的短期波动为核心的经济下滑时往往能起到不错的效果，但如果经济回落的核心是结构性的，那这种政策调整不仅不能防止经济增速的持续回落，反而可能会成为经济波动和经济扭曲的新源泉，这表现为：
① 财政赤字
扩张性财政政策会带来财政赤字。近年来，我国地方和中央的政府债务余额逐年上升，政府部门杠杆率明显提高，沉重的公共债务必将推高长期利率，增加整体经济运行的成本。
同时政府债务会加重家庭和企业的纳税负担，因为政府不创造财富，只是分配财富。政府的国内债务最终不论是地方政府自行还贷还是中央财政救助，还债的始终是纳税人。政府目前欠债越多，未来家庭和企业纳税负担越重。
② 通货膨胀
扩张性政策推高总需求，带来巨大的通货膨胀压力。过剩的流动性还会流入大宗商品、固定资本及原材料市场，造成该类资产的上涨，从而导致下游成品价格的上涨，最终导致物价的不断上涨。同时，实体经济的发展不容乐观：一面是货币供应量大增，另一面是制造业不断衰退，此消彼长，通货膨胀率上升压力增大。
③ 结构化问题积聚
在我国经济结构性调整尚不全面、产业结构优化升级尚未取得明显成效之时，如果政府盲目实行扩张性政策，投入大量资金进行项目开发，这些项目、资金很可能流入产能过剩行业，不仅没有形成效益，而且养活了本该被淘汰的"僵尸企业"，使产能过剩问题积重难返。
④ 长期贸易条件恶化
当一国长期实行扩张性的财政政策时，国民储蓄下降，本国利率上升，导致资本净流出下降，甚至出现资本净流入，本国成为净债务国，这意味着本国国际债务负担加重。资本净流出下降使得外汇市场上本币供给减少，本币升值，净出口下降，贸易条件恶化。
除此之外，扩张性财政政策会带来财政赤字，如果财政过度负债，就可能引发国际市场对政府债务可持续性的信心危机，国家主权债的信用评级可能因此下降，融资成本上升。
⑤ 长期增长乏力
传统经济刺激政策更注重于在短期内通过扩张性政策刺激市场活力，抬高总需求，以达到逆周期消除经济增长波动的效果，在长期来看缺乏刺激经济增长新动力的长期机制。一方面，扩张性财政政策对私人投资产生挤出效应，不利于建立规范、稳定的市场秩序。另一方面，扩张性财政政策使得国民储蓄减少，进而会使经济中的资本积累下降，从而对长期内的经济增长带来不利影响。更高的财政赤字带来更少的未来投资，从而导致更低的未来产出。
【本题有图示】`,
                hasImage: true },

            { id: 'h3q4', special: '宏观·第三层次', qid: '4',
                question: '有的学者认为中国有后发优势，有的学者认为由于经济发展存在着路径依赖问题，所以中国有后发劣势，你如何看待这个争论？为什么？',
                answer: `（1）后发优势是指落后国家或后发展的经济体可以借鉴先进国家的经验、技术、管理等，从而在较短的时间内实现经济跨越式发展。后发优势具体表现在以下三个方面：
① 技术引进和技术模仿优势。后发展的经济体通过从发达国家引进先进技术，并经过模仿、消化、吸收、改进、提高，从而使其在更高的技术层次上开始发展经济。
② 制度学习和制度模仿优势。后发展的经济体通过从先进国家引进各种先进的制度并经过本土化改造，从而极大的促进本国经济的发展。
③ 社会意识优势。后发展的经济体因受自身相对落后的经济限制，以及受到发达国家经验的刺激和启迪的影响，从而激发了它们赶超发达国家的强烈的社会意识，而且一国落后程度愈大，这种意识及其功能就越显著。

            showToast('✏️ 正在编辑，点击 💾 保存 或 ❌ 取消');
        }

        function saveEdit(id) {
            const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
            if (!editBtn || !editBtn.classList.contains('is-editing')) return;

            const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
            const editA = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner.editable`);

            if (!editQ || !editA) {
                showToast('⚠️ 编辑内容不存在');
                return;
            }

            const newQ = editQ.textContent.trim();
            const pNodes = editA.querySelectorAll('p');
            let newA = '';
            if (pNodes.length > 0) {
                newA = Array.from(pNodes).map(p => p.textContent.trim()).join('\n');
            } else {
                newA = editA.textContent.trim();
            }

            if (!newQ || !newA) {
                showToast('⚠️ 题目和答案不能为空');
                return;
            }

            edits[id] = { question: newQ, answer: newA };
            saveEdits();

            exitEditMode(id, true);
            showToast('✅ 修改已保存');
        }

        function cancelEdit(id) {
            const backup = editBackups[id];
            if (!backup) {
                exitEditMode(id, false);
                return;
            }

            const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
            const editA = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner.editable`);

            if (editQ) {
                const newSpan = document.createElement('span');
                newSpan.className = 'q-text';
                newSpan.textContent = backup.question;
                editQ.replaceWith(newSpan);
            }

            if (editA) {
                const newDiv = document.createElement('div');
                newDiv.className = 'answer-inner';
                newDiv.innerHTML = renderAnswerParagraphs(backup.answer);
                editA.replaceWith(newDiv);
            }

            delete editBackups[id];
            exitEditMode(id, false);
            showToast('🔙 已取消编辑');
        }

        function exitEditMode(id, saved) {
            const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
            const cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);

            if (editBtn) {
                editBtn.classList.remove('is-editing');
                editBtn.textContent = '✏️';
                editBtn.title = '编辑题目和答案';
                editBtn.onclick = function(e) {
                    e.stopPropagation();
                    enterEditMode(id);
                };
            }

            if (cancelBtn) {
                cancelBtn.style.display = 'none';
            }

            if (saved) {
                render(singleModeId || null);
            }

            delete editBackups[id];
        }

        // ---- 获取筛选后的ID ----
        function getFilteredIds() {
            const specialVal = filterSpecial.value;
            const favVal = filterFav.value;
            const searchVal = filterSearch.value.trim().toLowerCase();

            return currentData
                .filter(d => {
                    if (specialVal !== 'all' && d.special !== specialVal) return false;
                    if (favVal === 'fav' && !favorites.includes(d.id)) return false;
                    if (searchVal) {
                        const q = d.question.toLowerCase();
                        const a = d.answer.toLowerCase();
                        if (!q.includes(searchVal) && !a.includes(searchVal)) return false;
                    }
                    return true;
                })
                .map(d => d.id);
        }

        // ---- 渲染 ----

        function render(singleId = null) {

                        history.push(singleId);

        // ---- 图片点击 ----
        function bindImgClick(editor) {
            const imgs = editor.querySelectorAll('img');
            imgs.forEach(img => {
                img.removeEventListener('click', imgClickHandler);
                img.addEventListener('click', imgClickHandler);
            });
        }

        function imgClickHandler(e) {
            e.stopPropagation();
            const img = this;
            const editor = img.closest('.note-editor');
            if (!editor) return;
            const id = editor.dataset.id;

            const allImgs = editor.querySelectorAll('img');
            allImgs.forEach(i => i.classList.remove('selected'));
            img.classList.add('selected');

            const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
            if (!rc) return;
            rc.classList.add('show');

            const slider = rc.querySelector('input[type="range"]');
            const valSpan = rc.querySelector('.size-val');
            if (!slider) return;

            let currentPct = 100;
            if (img.style.width) {
                const w = parseInt(img.style.width);
                if (w > 0 && w <= 200) currentPct = w;
            }
            slider.value = currentPct;
            if (valSpan) valSpan.textContent = currentPct + '%';

            slider.oninput = function() {
                const val = parseInt(slider.value);
                if (valSpan) valSpan.textContent = val + '%';
                img.style.width = val + '%';
                img.style.maxWidth = val + '%';
                img.dataset.origWidth = val;
            };

            const resetBtn = rc.querySelector('.btn-reset-size');
            if (resetBtn) {
                resetBtn.onclick = function(e2) {
                    e2.stopPropagation();
                    img.style.width = '';
                    img.style.maxWidth = '100%';
                    img.dataset.origWidth = '100';
                    slider.value = 100;
                    if (valSpan) valSpan.textContent = '100%';
                    showToast('📐 已重置');
                };
            }
        }

                    editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
                }
                bindImgClick(editor);
            });
        }, 100);
    </script>
