<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>南开经济学 · 知识库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
  background: #f2f8f3;
  color: #1e3a2a;
  padding: 20px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1100px; margin: 0 auto; }

/* ================= 顶部卡片 ================= */
header {
  position: relative;
  padding: 28px 28px 30px;
  border-radius: 20px;
  text-align: center;
  background: linear-gradient(150deg, #eefaf3 0%, #e2f4e9 60%, #ddf2ea 100%);
  border: 1px solid #e4f2e9;
  box-shadow: 0 6px 18px rgba(70, 120, 90, .10),
              inset 0 1px 0 rgba(255, 255, 255, .85);
  margin-bottom: 22px;
  overflow: hidden;
}

header::before {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: linear-gradient(90deg,
    #7fd1b0, #8fbcec, #ebcb86, #ef9fc0,
    #7bd0dd, #a99eea, #f0a288, #c096dd);
  opacity: .5;
}

header h1 {
  font-size: 23px;
  font-weight: 700;
  color: #1b4a2b;
  letter-spacing: .6px;
  line-height: 1.35;
}

header p {
  font-size: 12.5px;
  color: #6a8f76;
  margin-top: 10px;
  line-height: 1.6;
}

/* ================= 卡片网格 ================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.mod {
  position: relative;
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 1px solid #e8f2ec;
  border-radius: 16px;
  padding: 20px 20px 16px 24px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 4px 14px rgba(70, 115, 90, .07);
  overflow: hidden;
  transition: transform .2s cubic-bezier(.2,.7,.4,1),
              box-shadow .2s ease,
              border-color .2s ease;
}
.mod::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 6px;
  background: linear-gradient(180deg, var(--c), var(--c2));
  transition: width .2s ease;
}
.mod:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(70, 115, 90, .14);
  border-color: var(--soft);
}
.mod:hover::before { width: 8px; }
.mod:active { transform: translateY(-1px); }

.mod .ic {
  width: 46px; height: 46px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 13px;
  background: var(--soft);
  font-size: 23px;
  line-height: 1;
  margin-bottom: 12px;
  transition: transform .2s ease;
}
.mod:hover .ic { transform: scale(1.06); }

.mod .t {
  font-size: 16px;
  font-weight: 600;
  color: #1e4a2a;
  letter-spacing: .3px;
}
.mod .d {
  font-size: 12.5px;
  color: #75907c;
  margin-top: 7px;
  line-height: 1.6;
  flex: 1;
}

.mod .foot {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 0;

  background-image: repeating-linear-gradient(
    to right,
    #e2efe7 0 4px,
    transparent 4px 9px
  );
  background-repeat: no-repeat;
  background-position: top left;
  background-size: 100% 1px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mod .count {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c);
  background: var(--soft);
  padding: 3px 11px;
  border-radius: 20px;
  letter-spacing: .3px;
}
.mod .go {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--c);
  opacity: .5;
  transition: opacity .2s ease, transform .2s ease;
}
.mod:hover .go { opacity: 1; transform: translateX(3px); }

/* ================= 学习进度条 + 朗读 + 清除 + 同步 ================= */
.note-bar {
  position: relative;
  z-index: 30;
  background: #fdf9ee;
  border: 2px dashed #d4c49a;
  border-radius: 14px;
  padding: 9px 12px 9px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.note-bar .lb {
  font-size: 13px;
  font-weight: 600;
  color: #7a5a2a;
  white-space: nowrap;
}

.note-bar input {
  flex: 1;
  min-width: 130px;
  border: 1px solid #e8ddc0;
  background: #fffdf6;
  border-radius: 30px;
  padding: 8px 16px;
  font-size: 13.5px;
  color: #3f3a1a;
  outline: none;
  font-family: inherit;
  transition: .2s;
}

.note-bar input::placeholder {
  color: #c4b48d;
}

.note-bar input:focus {
  border-color: #d4a24e;
  box-shadow: 0 0 0 3px rgba(212, 162, 78, .15);
}

.note-bar .tip {
  font-size: 11.5px;
  color: #b0a184;
  white-space: nowrap;
  min-width: 42px;
  text-align: right;
}

/* ================= 朗读（TTS） ================= */
.tts {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
}

.tts-btn {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  padding: 0;
  border-radius: 50%;
  border: 1.5px solid #cbe6d8;
  background: #fff;
  color: #3d8f6e;
  font-size: 15px;
  line-height: 1;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .18s ease, box-shadow .22s ease,
              border-color .22s ease, background .22s ease, color .22s ease;
}

.tts-btn svg {
  display: block;
  width: 15px;
  height: 15px;
  pointer-events: none;
}

.tts-btn:hover {
  transform: scale(1.08);
  border-color: #8fd4b0;
  background: #f3fbf7;
  box-shadow: 0 2px 8px rgba(63, 174, 140, .18);
}
.tts-btn:active { transform: scale(.95); }

.tts-btn.speaking {
  border-color: #7fc9a8;
  background: #eaf8f2;
  animation: ttsPulse 1.5s ease-in-out infinite;
}
.tts-btn.paused {
  border-color: #e5c882;
  background: #fdf7e6;
  color: #b8891f;
  animation: none;
}
.tts-btn:disabled {
  cursor: not-allowed;
  opacity: .45;
  animation: none;
}

@keyframes ttsPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(63, 174, 140, .30); }
  70%      { box-shadow: 0 0 0 8px rgba(63, 174, 140, 0); }
}

.tts-range {
  -webkit-appearance: none;
  appearance: none;
  width: 76px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, #a9e0c6 0%, #d8ecdf 100%);
  outline: none;
  cursor: pointer;
  flex: 0 0 auto;
}
.tts-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #7fc9a8;
  box-shadow: 0 1px 4px rgba(60, 130, 100, .28);
  cursor: pointer;
  transition: transform .15s ease;
}
.tts-range::-webkit-slider-thumb:hover { transform: scale(1.15); }
.tts-range::-moz-range-thumb {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #7fc9a8;
  box-shadow: 0 1px 4px rgba(60, 130, 100, .28);
  cursor: pointer;
}
.tts-range::-moz-range-track {
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(90deg, #a9e0c6 0%, #d8ecdf 100%);
}

.tts-val {
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 700;
  color: #3d8f6e;
  background: #eaf8f2;
  border-radius: 20px;
  padding: 3px 8px;
  min-width: 38px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  letter-spacing: .2px;
  user-select: none;
}

/* ================= 清除数据 · 花瓣 ================= */
:root {
  --petal-w: 34px;
  --petal-h: 48px;
  --dist: 56px;

  --orb-size: 40px;
  --orb-dist: 56px;
}

.clear-section {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 6;
}
.clear-section.open { z-index: 40; }

.petal-layer {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  pointer-events: none;
}

.petal {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--petal-w);
  height: var(--petal-h);
  margin-left: calc(var(--petal-w) / -2);
  margin-top: calc(var(--petal-h) / -2);

  border-radius: 50% 50% 50% 50% / 66% 66% 34% 34%;

  border: 1.5px solid var(--pc);
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 45%, var(--soft) 100%);
  box-shadow: 0 2px 8px rgba(90, 140, 115, .12);

  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: none;
  user-select: none;

  opacity: 0;
  transform: rotate(var(--angle)) translateY(0) scale(.3);
  transition: transform .42s cubic-bezier(.34,1.56,.64,1),
              opacity .28s ease,
              box-shadow .22s ease,
              background .22s ease,
              border-color .22s ease;
}

.clear-section.open .petal {
  opacity: 1;
  pointer-events: auto;
  transform: rotate(var(--angle)) translateY(calc(-1 * var(--dist))) scale(1);
}

.clear-section.open .petal:nth-child(1) { transition-delay: 0s; }
.clear-section.open .petal:nth-child(2) { transition-delay: .035s; }
.clear-section.open .petal:nth-child(3) { transition-delay: .07s; }
.clear-section.open .petal:nth-child(4) { transition-delay: .105s; }
.clear-section.open .petal:nth-child(5) { transition-delay: .14s; }
.clear-section.open .petal:nth-child(6) { transition-delay: .175s; }
.clear-section.open .petal:nth-child(7) { transition-delay: .21s; }
.clear-section.open .petal:nth-child(8) { transition-delay: .245s; }

.petal-face {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  transform: rotate(calc(-1 * var(--angle)));
  line-height: 1;
}
.petal-num {
  font-size: 9px;
  font-weight: 700;
  color: var(--pcd);
  opacity: .85;
}
.petal-ic {
  font-size: 12px;
  line-height: 1.15;
}

.petal.selected {
  background: var(--pc);
  border-color: #fff;
  box-shadow: 0 0 0 2.5px var(--pc),
              0 4px 12px rgba(90, 140, 115, .18);
}
.petal.selected .petal-num { color: #fff; opacity: 1; }

.clear-btn {
  position: relative;
  z-index: 20;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid #f3d27c;
  background: #fff;
  color: #b8891f;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .4px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 0 0 3px rgba(245, 214, 122, .22),
              0 2px 8px rgba(212, 162, 78, .18),
              0 0 12px 2px rgba(255, 220, 130, .25);
  transition: transform .2s ease,
              box-shadow .25s ease,
              color .25s ease,
              border-color .25s ease,
              font-size .2s ease;
}
.clear-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 0 4px rgba(245, 214, 122, .3),
              0 4px 12px rgba(212, 162, 78, .22),
              0 0 16px 3px rgba(255, 220, 130, .3);
}
.clear-btn:active { transform: scale(.97); }

.clear-btn.check-mode {
  font-size: 20px;
  color: #2fa27a;
  border-color: #8fd4b0;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(143, 212, 176, .22),
              0 2px 8px rgba(47, 162, 122, .18),
              0 0 12px 2px rgba(143, 212, 176, .25);
}

/* ================= 数据同步 · 上下小球（浅蓝） ================= */
.sync-section {
  position: relative;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 25;
  overflow: visible;
  transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
}

.sync-btn {
  position: relative;
  z-index: 26;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 2px solid #a8cfe8;
  background: #fff;
  color: #2e6a99;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .4px;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 0 0 3px rgba(168, 207, 232, .22),
              0 2px 8px rgba(79, 148, 196, .18),
              0 0 12px 2px rgba(139, 194, 228, .25);
  transition: transform .2s ease, box-shadow .25s ease,
              color .25s ease, border-color .25s ease, background .25s ease;
}
.sync-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 0 4px rgba(168, 207, 232, .3),
              0 4px 12px rgba(79, 148, 196, .22),
              0 0 16px 3px rgba(139, 194, 228, .3);
}
.sync-btn:active { transform: scale(.97); }
.sync-btn.open {
  background: #eaf4fc;
  transform: scale(1.05);
  border-color: #8bbde0;
}

/* ---------- 上下小球 ---------- */
.sync-orb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--orb-size);
  height: var(--orb-size);
  margin-left: calc(var(--orb-size) / -2);
  margin-top: calc(var(--orb-size) / -2);

  border-radius: 50%;
  border: 1.8px solid var(--oc);
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 42%, var(--osoft) 100%);
  box-shadow: 0 2px 8px rgba(90, 140, 115, .14);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;

  cursor: pointer;
  user-select: none;

  opacity: 0;
  pointer-events: none;
  transform: translateY(0) scale(.3);
  transition: transform .42s cubic-bezier(.34,1.56,.64,1),
             opacity .28s ease,
             box-shadow .22s ease,
             background .22s ease,
             border-color .22s ease;

  z-index: 24;
}

.sync-orb .orb-ic {
  font-size: 14px;
  line-height: 1;
  display: block;
}
.sync-orb .orb-tx {
  font-size: 8px;
  font-weight: 700;
  color: var(--ocd);
  letter-spacing: .3px;
  line-height: 1;
  display: block;
}

.sync-section.open .sync-orb.import {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(calc(-1 * var(--orb-dist))) scale(1);
  transition-delay: 0s;
}
.sync-section.open .sync-orb.export {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(var(--orb-dist)) scale(1);
  transition-delay: .08s;
}

.sync-section.open .sync-orb.import:hover {
  transform: translateY(calc(-1 * var(--orb-dist))) scale(1.08);
  box-shadow: 0 4px 14px rgba(90, 140, 115, .22);
}
.sync-section.open .sync-orb.export:hover {
  transform: translateY(var(--orb-dist)) scale(1.08);
  box-shadow: 0 4px 14px rgba(90, 140, 115, .22);
}

.sync-orb.import {
  --oc: #e8a8c8;
  --ocd: #a85a7a;
  --osoft: #fceef4;
}

.sync-orb.export {
  --oc: #b89ee0;
  --ocd: #6a4a9a;
  --osoft: #f0eaf8;
}

.note-bar.petals-open .sync-section {
  opacity: .15;
  transform: scale(.85);
  pointer-events: none;
  transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
}

/* ================= 确认弹层 ================= */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28, 48, 36, .38);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}
.confirm-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.confirm-box {
  width: min(90vw, 350px);
  background: #fff;
  border-radius: 20px;
  padding: 24px 24px 20px;
  box-shadow: 0 24px 60px rgba(25, 60, 42, .24);
  transform: translateY(14px) scale(.95);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  text-align: center;
}
.confirm-overlay.show .confirm-box {
  transform: translateY(0) scale(1);
}

.confirm-icon {
  font-size: 30px;
  line-height: 1;
  margin-bottom: 10px;
}
.confirm-title {
  font-size: 17px;
  font-weight: 700;
  color: #1e4a2a;
  letter-spacing: .3px;
}
.confirm-desc {
  font-size: 12.5px;
  color: #75907c;
  margin-top: 8px;
  line-height: 1.6;
}

.confirm-list {
  list-style: none;
  margin: 12px 0 4px;
  max-height: 168px;
  overflow-y: auto;
  text-align: left;
  background: #f7fcf9;
  border: 1px solid #e5f2ea;
  border-radius: 12px;
  padding: 8px 12px;
}
.confirm-list li {
  font-size: 12.5px;
  color: #35603f;
  padding: 5px 0;
  display: flex;
  align-items: center;
  gap: 7px;
}
.confirm-list li + li {
  border-top: 1px dashed #e5f2ea;
}
.confirm-list .li-dot {
  flex: 0 0 auto;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
  opacity: .65;
}

.confirm-warn {
  font-size: 11.5px;
  color: #d4816a;
  margin-top: 12px;
  letter-spacing: .3px;
}

.confirm-btns {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.cbtn {
  flex: 1;
  border: none;
  border-radius: 12px;
  padding: 11px 0;
  font-size: 13.5px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: .5px;
  transition: transform .15s ease, filter .15s ease, background .15s ease;
}
.cbtn:active { transform: scale(.97); }

.cbtn-cancel {
  background: #eef6f1;
  color: #587a68;
}
.cbtn-cancel:hover { background: #e4f0e9; }

.cbtn-ok {
  background: linear-gradient(135deg, #f3a98c, #e57c62);
  color: #fff;
  box-shadow: 0 4px 12px rgba(229, 124, 98, .28);
}
.cbtn-ok:hover { filter: brightness(1.05); }

/* ================= 提示 toast ================= */
.toast {
  position: fixed;
  left: 50%;
  bottom: 34px;
  transform: translateX(-50%) translateY(20px);
  background: #45b98c;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .5px;
  padding: 11px 24px;
  border-radius: 30px;
  box-shadow: 0 10px 26px rgba(69, 185, 140, .34);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 2000;
  max-width: 86vw;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ================= 页脚 ================= */
footer {
  text-align: center;
  font-size: 12.5px;
  color: #96b3a2;
  margin-top: 22px;
  line-height: 1.9;
}

/* ================= 移动端 ================= */
@media (max-width: 640px) {
  body { padding: 14px; }

  header {
    padding: 22px 16px 24px;
    border-radius: 16px;
    margin-bottom: 18px;
  }
  header h1 { font-size: 17px; letter-spacing: .2px; }
  header p { font-size: 11.5px; margin-top: 8px; }

  .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .mod { padding: 14px 13px 12px 18px; border-radius: 14px; }
  .mod .ic { width: 40px; height: 40px; font-size: 20px; margin-bottom: 9px; border-radius: 11px; }
  .mod .t { font-size: 13.5px; }
  .mod .d { font-size: 11px; margin-top: 5px; }
  .mod .foot { margin-top: 11px; padding-top: 9px; }
  .mod .count { font-size: 10.5px; padding: 2px 9px; }
  .mod .go { font-size: 11.5px; }

  :root {
    --petal-w: 30px;
    --petal-h: 42px;
    --dist: 48px;
    --orb-size: 36px;
    --orb-dist: 48px;
  }
  .note-bar { padding: 8px 9px 8px 14px; gap: 8px; }
  .note-bar .lb { font-size: 12px; }
  .note-bar input { font-size: 12.5px; padding: 7px 13px; min-width: 100px; }

  .tts-btn { width: 30px; height: 30px; }
  .tts-btn svg { width: 13px; height: 13px; }

</head>
<body>
<div class="wrap">

  <header>
    <h1>南开经济学 · 知识库</h1>
    <p>八大模块 · 一站式学习 · 学习进度记录保存在本地</p>

  </div>

  <footer>
    © 南开经济学备考知识库<br />
    数据仅保存在本机浏览器，换设备或清理缓存会丢失
  </footer>

</div>

<!-- 隐藏的文件选择器（导入用） -->
<input type="file" id="importFile" accept=".json,application/json" style="display:none" />

<!-- ============ 确认弹层 ============ -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">⚠️</div>
    <p class="confirm-title">确认清除</p>
    <p class="confirm-desc">以下章节的数据将被清除：</p>
    <ul class="confirm-list" id="confirmList"></ul>
    <p class="confirm-warn">此操作不可恢复，请谨慎操作</p>

      <button class="cbtn cbtn-cancel" id="confirmCancel" type="button">取消</button>
      <button class="cbtn cbtn-ok" id="confirmOk" type="button">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">已清除选中数据</div>

<script>
/* ==========================================================
   ① 八个模块配置（含 storagePrefix，与各版块实际 key 对应）
   ========================================================== */
const MODULES = [
  {
    icon: '📗', title: '背诵（微观）', desc: '微观背诵手册 · 概念与简答',
    count: 110,
    c: '#3FAE8C', c2: '#7FD1B0', soft: '#EAF8F2',
    url: './1micro-recitation/',
    storagePrefix: 'micro_recite_'
  },
  {
    icon: '📘', title: '背诵（宏观）', desc: '宏观背诵手册 · 概念与简答',
    count: 100,
    c: '#5A96DE', c2: '#8FBCEC', soft: '#EAF2FD',
    url: './2macro-recitation/',
    storagePrefix: 'macro_recite_'
  },
  {
    icon: '🧮', title: '计算要点', desc: '十五个专题 · 知识点与例题',
    count: 84,
    c: '#D0A44E', c2: '#EBCB86', soft: '#FDF7E9',
    url: './3calc-keypoints/',
    storagePrefix: 'calc_key_'
  },
  {
    icon: '📐', title: '计算专项', desc: '微观/宏观 · 题型突破',
    count: 212,
    c: '#D9739F', c2: '#EF9FC0', soft: '#FCEFF5',
    url: './4calc-special/',
    storagePrefix: 'calc_special_'
  },
  {
    icon: '✏️', title: '简答专项（微观）', desc: '微观简答题 · 分专题训练',
    count: 108,
    c: '#3FAFC2', c2: '#7BD0DD', soft: '#E9F7F9',
    url: './5micro-short-answer/',
    storagePrefix: 'micro_short_'
  },
  {
    icon: '✒️', title: '简答专项（宏观）', desc: '宏观简答题 · 分专题训练',
    count: 103,
    c: '#7E70D6', c2: '#A99EEA', soft: '#F1EFFC',
    url: './6macro-short-answer/',
    storagePrefix: 'macro_short_'
  },
  {
    icon: '📝', title: '论述专项', desc: '微观/宏观 · 答题思路',
    count: 50,
    c: '#E0785A', c2: '#F0A288', soft: '#FDF1EC',
    url: './7essay/',
    storagePrefix: 'essay_'
  },
  {
    icon: '📜', title: '历年真题', desc: '应用经济学 / 理论经济学 / 金融学',
    count: 466,
    c: '#9B6BC4', c2: '#C096DD', soft: '#F7EFFB',
    url: './8past-exams/',
    storagePrefix: 'past_exams_'
  }
];

/* ==========================================================
   ② 通用工具
   ========================================================== */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* 全局 toast */
function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1900);
}

/* ==========================================================
   ③ 渲染卡片
   ========================================================== */
function renderHome() {
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = MODULES.map(m => `
    <a class="mod" href="${esc(m.url)}"
       style="--c:${m.c};--c2:${m.c2};--soft:${m.soft}"
       title="${esc(m.title)}">
      <div class="ic">${m.icon}</div>
      <div class="t">${esc(m.title)}</div>
      <div class="d">${esc(m.desc)}</div>
      <div class="foot">
        <span class="count">${m.count} 张</span>
        <span class="go">进入 →</span>
      </div>
    </a>
  `).join('');
}

/* ==========================================================
   ④ 学习进度记录（本地保存）
   ========================================================== */
(function () {
  const PROG_KEY = 'eco_kb_progress';
  const input = document.getElementById('progressNote');
  const tip = document.getElementById('saveTip');
  let timer = null;

  try { input.value = localStorage.getItem(PROG_KEY) || ''; } catch (e) {}

  input.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      try {
        localStorage.setItem(PROG_KEY, input.value);
        tip.textContent = '已保存';
        setTimeout(() => { tip.textContent = ''; }, 1200);
      } catch (e) {
        tip.textContent = '保存失败';
      }
    }, 400);
  });
})();

/* ==========================================================
   ⑤ 朗读学习进度（语速可调）
   ========================================================== */
(function () {
  const synth = window.speechSynthesis;
  const supported = !!(synth && typeof window.SpeechSynthesisUtterance === 'function');

  const btn   = document.getElementById('ttsBtn');
  const range = document.getElementById('ttsRate');
  const val   = document.getElementById('ttsVal');
  const input = document.getElementById('progressNote');
  const RATE_KEY = 'eco_kb_tts_rate';

  const svg = (body, size = 24) =>
    `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true">${body}</svg>`;

  const ICON = {
    speaker: svg(`
      <path fill="currentColor" d="M12.5 3.6a1 1 0 0 0-1.6-.8L6.6 6.4H4A2 2 0 0 0 2 8.4v7.2a2 2 0 0 0 2 2h2.6l4.3 3.6a1 1 0 0 0 1.6-.8z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            d="M16 8.7a5 5 0 0 1 0 6.6M19 6a9 9 0 0 1 0 12"/>
    `),
    pause: svg(`
      <rect x="6.6" y="4" width="4.2" height="16" rx="1.7" fill="currentColor"/>
      <rect x="13.2" y="4" width="4.2" height="16" rx="1.7" fill="currentColor"/>
    `),
    play: svg(`
      <path fill="currentColor" d="M8.2 5.1v13.8a1 1 0 0 0 1.54.84l10.2-6.9a1 1 0 0 0 0-1.68L9.74 4.26A1 1 0 0 0 8.2 5.1z"/>
    `),
    mute: svg(`
      <path fill="currentColor" d="M12.5 3.6a1 1 0 0 0-1.6-.8L6.6 6.4H4A2 2 0 0 0 2 8.4v7.2a2 2 0 0 0 2 2h2.6l4.3 3.6a1 1 0 0 0 1.6-.8z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
            d="M16.4 9.6l5 4.8M21.4 9.6l-5 4.8"/>
    `)
  };

  if (!supported) {
    btn.disabled = true;
    btn.innerHTML = ICON.mute;
    btn.title = '当前浏览器不支持语音朗读';
    range.disabled = true;
    range.style.opacity = '.45';
    return;
  }

  let state = 'idle';
  let voices = [];
  let token = 0;
  let rateTimer = null;
  let currentRate = 1;

  try {
    const saved = parseFloat(localStorage.getItem(RATE_KEY));
    if (!isNaN(saved) && saved >= 0.5 && saved <= 2) {
      currentRate = Math.round(saved * 10) / 10;
    }
  } catch (e) {}

  range.value = currentRate;
  val.textContent = currentRate.toFixed(1) + '×';

  function refreshVoices() {
    try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
  }
  refreshVoices();
  try {
    synth.addEventListener('voiceschanged', refreshVoices);
  } catch (e) {
    synth.onvoiceschanged = refreshVoices;
  }

  function pickVoice() {
    if (!voices.length) refreshVoices();
    if (!voices.length) return null;
    const zh = voices.filter(v => /^zh|^cmn/i.test(v.lang || ''));
    return zh.find(v => /zh[-_]?(CN|Hans)/i.test(v.lang)) || zh[0] || null;
  }

  function setState(s) {
    state = s;
    btn.classList.toggle('speaking', s === 'speaking');
    btn.classList.toggle('paused', s === 'paused');
    if (s === 'speaking') {
      btn.innerHTML = ICON.pause;
      btn.title = '暂停朗读';
    } else if (s === 'paused') {
      btn.innerHTML = ICON.play;
      btn.title = '继续朗读';
    } else {
      btn.innerHTML = ICON.speaker;
      btn.title = '朗读学习进度';
    }
  }

  function stop() {
    token++;
    try { synth.cancel(); } catch (e) {}
    if (state !== 'idle') setState('idle');
  }
  window.stopTTS = stop;

  function speak() {
    const text = (input.value || '').trim();
    if (!text) {
      showToast('先写点学习进度，再朗读哦');
      return;
    }

    const my = ++token;
    try { synth.cancel(); } catch (e) {}

    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'zh-CN'; }
    u.rate = currentRate;
    u.pitch = 1;
    u.volume = 1;

    u.onend = () => { if (my === token) setState('idle'); };
    u.onerror = () => { if (my === token) setState('idle'); };

    synth.speak(u);
    setState('speaking');
  }

  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (state === 'idle') {
      speak();
    } else if (state === 'speaking') {
      try { synth.pause(); } catch (err) {}
      setState('paused');
    } else {
      try { synth.resume(); } catch (err) {}
      setState('speaking');
    }
  });

  range.addEventListener('input', () => {
    currentRate = Math.round(parseFloat(range.value) * 10) / 10;
    val.textContent = currentRate.toFixed(1) + '×';
    try { localStorage.setItem(RATE_KEY, String(currentRate)); } catch (e) {}

    clearTimeout(rateTimer);

    if (state === 'paused') { stop(); return; }
    if (state !== 'speaking') return;

    rateTimer = setTimeout(() => {
      if (state === 'speaking') speak();
    }, 480);
  });

  range.addEventListener('click', e => e.stopPropagation());
  range.addEventListener('pointerdown', e => e.stopPropagation());

  input.addEventListener('input', () => {
    if (state !== 'idle') stop();
  });

  window.addEventListener('pagehide', stop);
  window.addEventListener('beforeunload', stop);

  setState('idle');
})();

/* ==========================================================
   ⑥ 清除数据 · 花瓣按钮（行内靠右）
   ========================================================== */
(function () {
  const N = MODULES.length;
  const petalLayer   = document.getElementById('petalLayer');
  const clearSection = document.getElementById('clearSection');
  const clearBtn     = document.getElementById('clearBtn');
  const clearText    = document.getElementById('clearText');
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmList  = document.getElementById('confirmList');
  const confirmOk    = document.getElementById('confirmOk');
  const confirmCancel= document.getElementById('confirmCancel');
  const noteBar      = document.getElementById('noteBar');

  let isOpen = false;
  const selected = new Set();

  function buildPetals() {
    petalLayer.innerHTML = MODULES.map((m, i) => {
      const angle = (360 / N) * i;
      return `
        <div class="petal" data-idx="${i}"
             style="--angle:${angle}deg; --pc:${m.c2}; --pcd:${m.c}; --soft:${m.soft};"
             title="${esc(m.title)}">
          <span class="petal-face">
            <span class="petal-num">${i + 1}</span>
            <span class="petal-ic">${m.icon}</span>
          </span>
        </div>`;
    }).join('');

    petalLayer.querySelectorAll('.petal').forEach(p => {
      p.addEventListener('click', e => {
        e.stopPropagation();
        const idx = Number(p.dataset.idx);
        if (selected.has(idx)) {
          selected.delete(idx);
          p.classList.remove('selected');
        } else {
          selected.add(idx);
          p.classList.add('selected');
        }
      });
    });
  }

  function openPetals() {
    if (typeof window.closeSync === 'function') window.closeSync();
    isOpen = true;
    clearSection.classList.add('open');
    noteBar.classList.add('petals-open');
    clearText.textContent = '✓';
    clearBtn.classList.add('check-mode');
  }

  function resetAll() {
    isOpen = false;
    selected.clear();
    clearSection.classList.remove('open');
    noteBar.classList.remove('petals-open');
    clearText.textContent = '清除';
    clearBtn.classList.remove('check-mode');
    petalLayer.querySelectorAll('.petal').forEach(p => p.classList.remove('selected'));
    confirmOverlay.classList.remove('show');
  }

  window.closePetals = resetAll;

  clearBtn.addEventListener('click', e => {
    e.stopPropagation();

    if (!isOpen) { openPetals(); return; }

    if (selected.size === 0) { resetAll(); return; }

    const items = [...selected].sort((a, b) => a - b);
    confirmList.innerHTML = items.map(i => {
      const m = MODULES[i];
      return `<li><span class="li-dot" style="color:${m.c2}"></span>
                第 ${i + 1} 项 · ${esc(m.title)}</li>`;
    }).join('');
    confirmOverlay.classList.add('show');
  });

  document.addEventListener('click', e => {
    if (!isOpen) return;
    if (clearSection.contains(e.target)) return;
    if (confirmOverlay.classList.contains('show')) return;
    resetAll();
  });

  confirmOk.addEventListener('click', () => {
    const toRemove = [];

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;

        if (key === 'eco_kb_progress') { toRemove.push(key); continue; }

        for (const idx of selected) {
          const prefix = MODULES[idx].storagePrefix;
          if (prefix && key.startsWith(prefix)) {
            toRemove.push(key);
            break;
          }
        }
      }

      toRemove.forEach(k => localStorage.removeItem(k));
    } catch (e) {
      console.warn('清除失败', e);
    }

    try {
      const input = document.getElementById('progressNote');
      if (input && toRemove.includes('eco_kb_progress')) input.value = '';
    } catch (e) {}

    if (typeof window.stopTTS === 'function') window.stopTTS();

    const clearedNames = [...selected].sort((a, b) => a - b)
      .map(i => MODULES[i].title).join('、');

    resetAll();
    showToast(clearedNames ? `已清除：${clearedNames}` : '已清除数据');
  });

  confirmCancel.addEventListener('click', e => {
    e.stopPropagation();
    confirmOverlay.classList.remove('show');
  });

  confirmOverlay.addEventListener('click', e => {
    if (e.target === confirmOverlay) confirmOverlay.classList.remove('show');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (confirmOverlay.classList.contains('show')) {
        confirmOverlay.classList.remove('show');
      } else if (isOpen) {
        resetAll();
      }
    }
  });

  buildPetals();
})();

/* ==========================================================
   ⑦ 数据同步 · 导入 / 导出（JSON）
   ----------------------------------------------------------
   同步内容：
   - 8 个模块的学习数据（收藏 / 笔记 / 编辑）
   - 学习进度记录
   - AI 助手：提示词 / 对话历史 / 面板尺寸
   注意：
   - 导出时会剔除 AI 的 API Key，防止泄露
   - 导入时会保留本机已有的 API Key，不会被覆盖
   ========================================================== */
(function () {
  const syncSection  = document.getElementById('syncSection');
  const syncBtn      = document.getElementById('syncBtn');
  const orbImport    = document.getElementById('orbImport');
  const orbExport    = document.getElementById('orbExport');
  const fileInput    = document.getElementById('importFile');

  /* 8 个模块的存储前缀 */
  const MODULE_PREFIXES = MODULES.map(m => m.storagePrefix).filter(Boolean);

  /* AI 助手相关前缀（key 在导出时会被剔除） */
  const EXTRA_PREFIXES = [
    'ai_assistant_cfg_',      // AI 配置（key 会被剔除）
    'ai_assistant_history_',  // 对话记录
    'ai_assistant_size_',     // 面板尺寸
    'ai_assistant_sys_ver'    // 提示词版本号
  ];

  const PREFIXES = MODULE_PREFIXES.concat(EXTRA_PREFIXES);
  const ALLOW    = ['eco_kb_progress'];

  /* AI 配置的 key 名（用于导出时剔除 key / 导入时保留 key） */
  const AI_CFG_KEY = 'ai_assistant_cfg_v1';

  let isOpen = false;

  function openSync() {
    if (typeof window.closePetals === 'function') window.closePetals();
    isOpen = true;
    syncSection.classList.add('open');
    syncBtn.classList.add('open');
  }

  function resetSync() {
    isOpen = false;
    syncSection.classList.remove('open');
    syncBtn.classList.remove('open');
  }
  window.closeSync = resetSync;

  syncBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (isOpen) resetSync(); else openSync();
  });

  document.addEventListener('click', e => {
    if (!isOpen) return;
    if (syncSection.contains(e.target)) return;
    resetSync();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isOpen) resetSync();
  });

  function collectData() {
    const data = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        const hit = ALLOW.indexOf(key) >= 0 ||
                    PREFIXES.some(p => key.indexOf(p) === 0);
        if (hit) data[key] = localStorage.getItem(key);
      }
    } catch (e) {
      console.warn('读取本地数据失败', e);
    }
    return data;
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  /* ---------- 导出 ---------- */
  function doExport() {
    const data = collectData();
    const keys = Object.keys(data);
    if (!keys.length) {
      showToast('本机暂无学习记录，先学一点再导出吧~~');
      resetSync();
      return;
    }

    /* ★ 导出前，剔除 AI 配置里的 API Key（防止泄露） */
    let aiCfgIncluded = false;
    if (data[AI_CFG_KEY]) {
      try {
        const cfg = JSON.parse(data[AI_CFG_KEY]);
        delete cfg.key;
        data[AI_CFG_KEY] = JSON.stringify(cfg);
        aiCfgIncluded = true;
      } catch (e) {}
    }

    const now = new Date();
    const payload = {
      app: 'nankai-econ-kb',
      version: 1,
      exportedAt: now.toISOString(),
      count: keys.length,
      note: aiCfgIncluded ? '含 AI 助手配置（不含 API Key）' : '',
      data: data
    };

    let blob, url;
    try {
      blob = new Blob([JSON.stringify(payload, null, 2)],
                      { type: 'application/json;charset=utf-8' });
      url = URL.createObjectURL(blob);
    } catch (e) {
      showToast('导出失败，请换个浏览器试试');
      resetSync();
      return;
    }

    const name = `南开经济学知识库-备份-`
      + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate())
      + '-' + pad2(now.getHours()) + pad2(now.getMinutes()) + '.json';

    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 2000);

    showToast(`导出成功！${keys.length} 条记录已保存` + (aiCfgIncluded ? '（含 AI 配置，不含 Key）' : ''));
    resetSync();
  }

  /* ---------- 导入 ---------- */
  function handleFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (ev) {
      let obj = null;
      try {
        obj = JSON.parse(ev.target.result);
      } catch (err) {
        showToast('导入失败：不是有效的 JSON 文件');
        return;
      }

      if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
        showToast('导入失败：文件格式不正确');
        return;
      }

      let data = null;
      if (obj.data && typeof obj.data === 'object' && !Array.isArray(obj.data)) {
        data = obj.data;
      } else {
        data = obj;
      }

      const keys = Object.keys(data).filter(k => typeof data[k] === 'string');
      if (!keys.length) {
        showToast('文件里没有可导入的数据');
        return;
      }

      const hasAI = keys.some(k => k === AI_CFG_KEY);
      const ok = window.confirm(
        '即将导入 ' + keys.length + ' 条数据。\n\n'
        + (hasAI ? '📦 包含 AI 助手配置（提示词 / 对话历史等），但不含 API Key。\n导入后本机已有的 API Key 会保留。\n\n' : '')
        + '同名的记录会被覆盖，本机独有而文件里没有的记录会保留。\n\n'
        + '确定继续吗？'
      );
      if (!ok) return;

      let done = 0;
      try {
        keys.forEach(k => {
          /* ★ 导入 AI 配置时，保留本机已有的 API Key */
          if (k === AI_CFG_KEY) {
            try {
              const incoming = JSON.parse(data[k]);
              const existing = JSON.parse(localStorage.getItem(AI_CFG_KEY) || '{}');
              // 文件里没带 key，但本机有 key → 用本机的
              if (!incoming.key && existing.key) {
                incoming.key = existing.key;
              }
              localStorage.setItem(k, JSON.stringify(incoming));
            } catch (e) {
              localStorage.setItem(k, data[k]);
            }
          } else {
            localStorage.setItem(k, data[k]);
          }
          done++;
        });
      } catch (err) {
        showToast('导入中断：浏览器存储空间可能已满');
        return;
      }

      if (typeof window.stopTTS === 'function') window.stopTTS();

      showToast('已导入成功 ' + done + ' 条记录，页面即将刷新~~');
      setTimeout(() => location.reload(), 900);
    };

    reader.onerror = function () {
      showToast('导入失败：文件读取错误');
    };

    reader.readAsText(file, 'utf-8');
  }

  orbExport.addEventListener('click', e => {
    e.stopPropagation();
    doExport();
  });

  orbImport.addEventListener('click', e => {
    e.stopPropagation();
    resetSync();
    fileInput.value = '';
    fileInput.click();
  });

  fileInput.addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    handleFile(f);
  });

  [orbImport, orbExport].forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
  });
})();

/* ==========================================================
   ⑧ 初始化页面
   ========================================================== */
renderHome();
</script>
</body>
</html>
