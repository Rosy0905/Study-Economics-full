{id:'h40',special:'宏观·稳态及黄金律',qid:'A2 ★★★',question:'经济的产出函数为 Y=K^(1/3)(AL)^(2/3)，经济的技术进步率 g=0.03，储蓄率 s=0.2，折旧率为 δ=0.05，人口增长率 n=0.02。（1）求黄金律稳态的储蓄率，储蓄率 s=0.2 能否实现消费最大化？（2）画出 s 从0.2的稳态水平到0.25的稳态水平，有效人均消费 lnc 的变化图（要求表示出最初的状态、变化的过程和结果）。（3）画出 s 从0.4的稳态水平到0.45的稳态水平，有效人均消费 lnc 的变化图（要求表示出最初的状态、变化的过程和结果）。（4）根据（2）（3）问的结果，从有效人均消费的角度分析政府是否应该调整储蓄率；（5）计算总产出、人均产出、有效人均产出的稳态增长率，并说明索洛模型中增长来源与 n 和 g 的关系。',answer:`**考察知识点**：索洛模型、黄金律、储蓄率调整、稳态增长率。\n**思路**：黄金律条件 f′(k)=δ+n+g；分析储蓄率变化对消费的动态影响；稳态增长率分解。\n**答案**：（1）sgold=1/3>0.2，不能实现消费最大化。（2）消费先降后升，最终高于原稳态。（3）消费先降后升，最终低于原稳态。（4）s<sgold 时应提高储蓄率；s>sgold 时应降低储蓄率。（5）有效人均产出增长率0；人均产出增长率 g；总产出增长率 n+g。\n##**详解**\n（1）令有效人均资本 k = K/(AL)，则有效人均产出 y = Y/(AL) = k^(1/3) = f(k)。\n此时稳态条件为 sy = (δ + n + g)k，所以稳态时有效人均消费 c = y − sy = f(k) − (δ + n + g)k。有效人均消费最大化的一阶条件为：\n$$dc/dk = f′(k) − (δ + n + g) = 0\n代入 f(k) = k^(1/3)，δ = 0.05，n = 0.02，g = 0.03，解得黄金律稳态的有效人均资本：\n$$k_gold = (10/3)^(3/2)\n将其代入稳态条件 sy = (δ + n + g)k，解得此时的储蓄率 s_gold = 1/3 > 0.2，所以储蓄率 s = 0.2 无法实现消费最大化。\n（2）在达到黄金律稳态的储蓄率水平之前，储蓄率的增加会导致稳态时有效人均消费水平的增加；在达到黄金律稳态以后，继续提高储蓄率会导致新稳态的有效人均消费下降。\n当储蓄率由0.2变化到0.25时，由于黄金律稳态的储蓄率 s_gold = 1/3，所以 s = 0.25 稳态水平的有效人均消费大于 s = 0.2 稳态下的有效人均消费。\n如下图所示，横轴表示时间，纵轴表示有效人均消费的对数值 lnc，此时曲线 lnc 的斜率表示有效人均消费的变化率。假设经济在 t₀ 时刻以前处于 s = 0.2 的稳态；t₀ 时刻储蓄率由0.2上升到0.25，由于有效人均消费 c = (1 − s)y，所以 t₀ 时刻有效人均消费会有瞬间的减少，对应的 lnc 也瞬间减少。由于储蓄率上升，对应的有效人均消费不断增加，并且增加的速率越来越慢，即 lnc 不断增加，但 lnc 曲线的斜率不断变小。最终经济在 t₁ 时刻达到新的稳态，此后的 lnc 曲线变为水平线，同时对应的 lnc 水平高于 s = 0.2 稳态下的水平。\n【此处有图示】\n（3）当储蓄率由0.4变化到0.45时，由于黄金律稳态的储蓄率 s_gold = 1/3，所以 s = 0.4 稳态水平的有效人均消费大于 s = 0.45 稳态下的有效人均消费。\n如下图所示，假设经济在 t₀ 时刻以前处于 s = 0.4 的稳态，t₀ 时刻储蓄率由0.4上升到0.45，此时 t₀ 时刻有效人均消费会有瞬间的减少，对应的 lnc 也瞬间减少。由于储蓄率上升，对应的有效人均消费不断增加，并且增加的速率越来越慢，即 lnc 不断增加，但 lnc 曲线的斜率不断变小。最终经济在 t₁ 时刻达到新的稳态，此后的 lnc 曲线变为水平线，同时对应的 lnc 水平低于 s = 0.4 稳态下的水平。\n【此处有图示】\n（4）由（2）（3）可知，当 s < s_gold 时，提高储蓄率会带来有效人均消费水平的增加；当 s > s_gold 时，继续提高储蓄率会导致稳态的有效人均消费下降。所以，从有效人均消费的角度看，当 s < s_gold 时，政府应该提高储蓄率；当 s > s_gold 时，政府应该降低储蓄率。\n（5）稳态时 Δk = 0，由于 y = f(k) = k^(1/3)，所以稳态时有效人均产出增长率 Δy/y = 0。人均产出 Y/L = Ay，总产出 Y = y·AL，所以由增长率的性质可得：\n$$Δ(Y/L)/(Y/L) = ΔA/A + Δy/y = g\n$$ΔY/Y = Δy/y + ΔA/A + ΔL/L = n + g\n所以，人均产出增长来源取决于技术进步率 g，总产出增长来源取决于技术进步率 g 与人口增长率 n。`},
{id:'h41',special:'宏观·稳态及黄金律',qid:'B1 ★★',question:'假设在Solow模型中，人均生产函数 y=k^0.5，储蓄率为 s，人口增长率 n=0.005，折旧率为 d=0.035。（1）计算在储蓄率 s=0.16 时的稳态人均资本存量。（2）计算在储蓄率提高到 s′=0.41 后的稳态人均资本存量，并用图形说明储蓄率的提高对稳态人均资本存量的影响（保留一位小数）。（3）计算稳态黄金律下的储蓄率。（4）以储蓄率 s=0.16 时的稳态为初期。这时人口为1000单位，如果储蓄率提高到 s′=0.41 后，计算下一期的总产出和人均资本，结合画图描述总产出和人均资本动态调整路径。（上海财经大学 2014 年考题）',answer:`**考察知识点**：索洛模型、稳态、黄金律、动态调整。\n**思路**：稳态 k*=(s/(n+d))²；黄金律 f′(k)=n+d；动态调整分析。\n**答案**：（1）k*=16。（2）k*≈105.1。（3）sgold=0.5。（4）下一期人均资本17；总产出 1005√17。\n##**详解**\n（1）稳态时有 Δk = sy − (n + d)k = 0，将 y = k^0.5 代入可解得：\n$$k* = [s/(n + d)]²\n代入 s = 0.16，n = 0.005，d = 0.035，解得 k* = 16。\n（2）当储蓄率提高到 s′ = 0.41 时，代入 k* = [s/(n + d)]² 可得：\n$$k_new = [0.41/(0.005 + 0.035)]² = 105.1\n储蓄率的提高使得投资曲线上移，稳态下均衡人均资本量上升。\n【此处有图示】\n（3）人均消费 c = y − sy，稳态时有 sy = (n + d)k，同时 y = k^0.5，故 c = k^0.5 − (n + d)k。由消费最大化的一阶条件：\n$$dc/dk = 0.5k^(−0.5) − (n + d) = 0\n解得 k_gold = 1/0.08² = 156.25，代入稳态条件 sy = (n + d)k，解得：\n$$s_gold = (n + d)k_gold^0.5 = 0.04×12.5 = 0.5\n（4）初期 n = 0.005，d = 0.035，s₀ = 0.16，代入 k* = [s/(n + d)]² 解得初始稳态下人均资本和人均产出分别为 k₀ = 16，y₀ = 4，总产出 Y₀ = N₀y₀ = 4000。\n在 n = 0.005，d = 0.035，s′ = 0.41 下得到新的稳态 k_new = 105.1，y_new = 10.25（这是指在储蓄率变化之后经济重新达到均衡后的人均资本和人均产出）。\n下一期人口为 N₁ = N₀(1 + n) = 1005。下一期人均资本量为：\n$$k₁ = k₀ + s′y₀ − (n + d)k₀ = 16 + 0.41×4 − 0.04×16 = 17\n下一期的总产出为：\n$$Y₁ = N₁y₁ = 1005×√17 ≈ 4143.4\n① 人均资本的动态调整路径：在储蓄率变化之前（t₀ 之前），稳态下的人均资本量为 k₀ = 16，且 Δk = 0；在 t₀ 到 t* 之间，由于 Δk = s′k^0.5 − (n + d)k，储蓄率上升后 Δk > 0，即 k 关于时间 t 变化曲线的斜率大于0。\n进一步地，d(Δk)/dk = 0.5s′k^(−0.5) − (n + d)，当 0.5s′k^(−0.5) < (n + d) 即 k > [s′/(2(n + d))]² = 5.125² 时，dk/dt 的增速放缓。故当 k < 5.125² 时，k 关于时间 t 变化曲线的斜率越来越大；当 k > 5.125² 时，斜率越来越小；并在 t = t* 时变为水平线。\n【此处有图示】\n② 总产出的动态调整路径：为了更清楚地在图像上看出总产出增长率的情况，把纵坐标改成 lnY。由于 Y = Ly = Lf(k) = Lk^0.5，所以：\n$$dlnY/dt = ΔY/Y = ΔL/L + 0.5Δk/k\n在储蓄率变化之前且经济达到均衡时 Δk = 0，这意味着总产出增长率为一恒定的常数 ΔY/Y = n，这反映在图像上是一条右上倾斜的直线且斜率不变。在储蓄率变化之后且经济重新达到均衡后 Δk = 0，这意味着重新达到平衡之后总产出增长率仍为一恒定的常数，且等于储蓄率变化之前的总产出增长率。然而在 t₀ 到 t* 之间有 Δk > 0，故 ΔY/Y = ΔL/L + 0.5Δk/k > n，且 d²lnY/dt² < 0，综上我们可以画出如下的图形：\n【此处有图示】\n注意上面图我们用 lnY 来代替 Y，可以更直观地看出总产出增长率在储蓄率变化之后的变化路径；而如果直接用 Y = Ly = Lk^0.5 求斜率 dY/dt，很难表现在图形上。`},
{id:'h42',special:'宏观·稳态及黄金律',qid:'B2 ★★',question:'利用索洛模型。生产函数为 Y=F[K(t),A(t)L(t)]，资本动态 K̇=sY−δK。令 k=K/(AL)，y=Y/(AL)。Ȧ/A=g 指技术进步率，L̇/L=n 指人口增长率。（1）为何可以写成 Y/(AL)=f(k)，k=K/(AL)？（2）求 k 的动态方程。（3）说明稻田条件的作用。（北大软微经典考题）',answer:`**考察知识点**：索洛模型、规模报酬不变、稻田条件。\n**思路**：利用规模报酬不变化简；求 k 的动态方程；稻田条件保证稳态存在且稳定。\n**答案**：（1）规模报酬不变，令 c=1/(AL) 可得。（2）k̇=sf(k)−(δ+n+g)k。（3）稻田条件保证稳态存在且唯一、稳定。\n##**详解**\n（1）两种要素投入加上规模报酬不变，生产函数最终可以从二元的形式密集成一元的形式。由于存在规模报酬不变，所以生产函数满足 F(cK, cAL) = cF(K,AL)。令 c = 1/(AL)，得到：\n$$y = Y/(AL) = F(K/(AL), AL/(AL)) = F(K/(AL), 1) = F(k, 1) = f(k)\n（2）k = K/(AL) 两端对时间 t 求导可得：\n$$Δk = [ΔK·AL − K·(ΔA·L + A·ΔL)]/(AL)² = ΔK/(AL) − (K/(AL))(ΔA/A) − (K/(AL))(ΔL/L)\n代入资本积累方程 ΔK = sY − δK，进一步整理可得：\n$$Δk = sf(k) − (δ + n + g)k\n（3）稻田条件为：\n$$lim(k→0) f′(k) = ∞，lim(k→∞) f′(k) = 0\n稻田条件的经济含义是：当资本存量足够小时，资本的边际产量很大；而当资本存量变得很大时，资本的边际产量变得很小，即资本的边际产量递减规律。稻田条件本质上说明了资本的边际产量也是递减的。其数学作用是保证经济的路径不发散，这对经济均衡的存在性、稳定性至关重要。\n由（2）可知，k 的动态方程为 Δk = sf(k) − (δ + n + g)k，均衡时有：\n$$sf(k) = (δ + n + g)k\n具体分析如下：等式左边是一条关于 k 的曲线，斜率为 sf′(k)，且 f′(k) > 0，f″(k) < 0；右边是一条斜率为 (δ + n + g) 的直线。稻田条件的作用是可以保证两条线有且只有一个交点：\nlim(k→0) f′(k) = ∞，且 f′(k) > 0，f″(k) < 0，保证开始的时候曲线一定比直线更陡（不然没有交点）；lim(k→∞) f′(k) = 0，且 f′(k) > 0，f″(k) < 0，保证最终曲线一定比直线更平坦（不然没有交点）。\n【此处有图示】`},
{id:'h43',special:'宏观·索洛模型证明',qid:'A1 ★★★',question:'经济体的生产函数为：Y=F(K,AL)，满足规模报酬不变假定，证明以下问题：（1）规模报酬不变时存在：∂F/∂K=f′(k̃)，∂F/∂L=A[f(k̃)−k̃f′(k̃)]，其中 k̃=K/(AL)。（2）稳态时资本的实际租赁价格是不变的，实际工资以技术进步率 g 增长；（3）稳态时人均资本和人均产出的增长率为 g，总资本与总产出的增长率为 (n+g)；（4）稳态时资本总收入和劳动总收入的增长率都等于人口增长率加技术进步率 (n+g)。\n进一步假定经济体的生产函数为：Y=K^a(AL)^(1−a)，证明或求解：（5）资本和劳动收入占总收入的份额分别为 α 和 1−α；（6）解稳态时人有效人均资本水平；（7）稳态时资本-产出比率是不变的；（8）资本黄金律水平的储蓄率为 α。',answer:`**考察知识点**：索洛模型、规模报酬不变、要素收入份额、黄金律。\n**思路**：分别求偏导；利用稳态条件；求黄金律储蓄率。\n**答案**：证明略；结论成立。\n##**详解**\n令有效人均资本、有效人均产出、人均资本、人均产出分别为 k̃ = K/(AL)，ỹ = Y/(AL)，k = K/L，y = Y/L；资本的实际租赁价格、劳动的实际工资、资本收入、劳动收入分别为 r、w、R、W。\n（1）由于存在规模报酬不变，故 F(K,AL) = AL·F(K/(AL), 1) = AL·f(k̃)，故：\n$$∂F(K,AL)/∂K = AL·f′(k̃)·(1/(AL)) = f′(k̃)\n$$∂F(K,AL)/∂L = A·f(k̃) + AL·f′(k̃)·(−K/(AL²)) = A[f(k̃) − k̃f′(k̃)]\n（2）由（1）可知：资本的实际租赁价格 r = MP_K = ∂F/∂K = f′(k̃)；劳动的实际工资 w = ∂F/∂L = A[f(k̃) − k̃f′(k̃)]。\n由于稳态时 Δk̃ = 0，故稳态时 Δf′(k̃) = 0，Δ[f(k̃) − k̃f′(k̃)] = 0，从而稳态时资本的实际租赁价格 r 不变，劳动的实 际工资 w 与 A 同比例增长：\n$$Δr/r = Δf′(k̃)/f′(k̃) = 0\n$$Δw/w = ΔA/A + Δ[f(k̃) − k̃f′(k̃)]/[f(k̃) − k̃f′(k̃)] = g\n（3）稳态时 Δk̃ = 0，故稳态时有效人均资本增长率 Δk̃/k̃ = 0；由于有效人均产出是关于 k̃ 的函数，故有效人均产出增长率 Δỹ/ỹ = 0。由于 k = Ak̃，y = Aỹ，K = ALk̃，Y = ALỹ，所以由增长率的性质可知：\n$$Δk/k = ΔA/A + Δk̃/k̃ = g\n$$Δy/y = ΔA/A + Δỹ/ỹ = g\n$$ΔK/K = ΔA/A + ΔL/L + Δk̃/k̃ = n + g\n$$ΔY/Y = ΔA/A + ΔL/L + Δỹ/ỹ = n + g\n（4）资本收入 R = rK，劳动收入 W = wL，故资本收入和劳动收入增长率分别为：\n$$ΔR/R = Δr/r + ΔK/K = 0 + (n + g) = n + g\n$$ΔW/W = Δw/w + ΔL/L = g + n = n + g\n（5）资本收入 R = rK = MP_K·K，其中 r 为资本的实际租赁价格，资本收入占总收入的份额：\n$$R/Y = MP_K·K/Y = αK^(α−1)(AL)^(1−α)·K/[K^α(AL)^(1−α)] = α\n劳动收入 W = wL = MP_L·L，其中 w 为劳动的实际工资，劳动收入占总收入的份额：\n$$W/Y = MP_L·L/Y = (1 − α)K^α(AL)^(−α)·A·L/[K^α(AL)^(1−α)] = 1 − α\n**【提示】**由于资本和劳动收入占总收入的份额分别为 α 和 1 − α，所以资本和劳动收入的增长率等于总收入增长率，即二者增长率均为 (n + g)，此为第（3）问结论的另一种证明思路。\n（6）由于 k̃ = K/(AL)，由增长率的性质可知 Δk̃/k̃ = ΔK/K − ΔA/A − ΔL/L。由资本积累方程 ΔK = sY − δK 可将其化简为：\n$$Δk̃/k̃ = (sY − δK)/K − g − n = s(Y/K) − (δ + n + g)\n即：\n$$Δk̃ = sỹ − (δ + n + g)k̃\n稳态时 Δk̃ = 0，故稳态条件为 sỹ = (δ + n + g)k̃。代入 ỹ = k̃^α 解得稳态时有效人均资本：\n$$k̃* = [s/(δ + n + g)]^(1/(1 − α))\n（7）由（6）可知稳态条件为 sỹ = (δ + n + g)k̃，故稳态时 k̃/ỹ = s/(δ + n + g)。从而稳态时资本产出比：\n$$K/Y = (k̃·AL)/(ỹ·AL) = s/(δ + n + g)\n为固定的常数。\n（8）有效工人的平均消费量 c = ỹ − sỹ，其中 ỹ = f(k̃) = k̃^α。稳态时有 sỹ = (δ + n + g)k̃，故 c = k̃^α − (δ + n + g)k̃。由消费最大化的一阶条件可得：\n$$dc/dk̃ = αk̃^(α−1) − (δ + n + g) = 0\n解得资本黄金律水平的有效人均资本：\n$$k̃_gold = [α/(δ + n + g)]^(1/(1 − α))\n将其代入稳态条件 sỹ = (δ + n + g)k̃ 可以解得 s_gold = α。\n**【提示】**本题需要重点掌握。南开曾多次考过类似索洛模型基本结论的证明题，2022年、2023年真题考的就和本题中某几问的证明类似。本题每一小问都是课本上的基本结论，在这里以一道综合题的形式展现，希望大家看完答案以后也能自己对这些结论多推导几遍，对每个结论都做到熟稔于心。`},
{id:'h44',special:'宏观·索洛模型证明',qid:'A2 ★★★',question:'假设在某国，资本在GDP中的份额为30%左右；产出的平均增长为每年3%左右；折旧率为每年4%左右；资本-产出比率为2.5左右。假设生产函数是柯布-道格拉斯生产函数，因此，资本在产出中的份额是不变的，而且，该国已经处于稳定状态。（1）在初始稳定状态，储蓄率应该是多少？（提示：使用稳定状态的关系式 sy=(δ+n+g)k）（2）在初始稳定状态，资本的边际产量是多少？（3）假设公共政策提高了储蓄率，从而使经济达到了资本的黄金律水平。在黄金律稳定状态，资本的边际产量将是多少？比较黄金律稳定状态的边际产量和初始稳定状态的边际产量，并解释。（4）在黄金律稳定状态，资本-产出比率将是多少？（5）要达到黄金律稳定状态，储蓄率必须是多少？（上海财经大学 2018 年考题）',answer:`**考察知识点**：索洛模型、黄金律、储蓄率。\n**思路**：利用稳态条件 s=(δ+n+g)(K/Y)；黄金律 f′(k)=δ+n+g；C-D函数性质。\n**答案**：（1）s=0.175。（2）MPK=0.12。（3）黄金律 MPK=0.07；黄金律边际产量小于初始稳态。（4）K/Y=30/7。（5）sgold=0.3。\n##**详解**\n令总产出函数为 F = K^α(AL)^(1−α)。由题意可知 α = 0.3，有效人均资本、有效人均产出分别为 k = K/(AL)，y = Y/(AL) = k^0.3。\n（1）由题意可知，稳态时 K/Y = k/y = 2.5，ΔY/Y = n + g = 0.03，折旧率 δ = 0.04。由稳态条件 sy = (δ + n + g)k 可知：\n$$k/y = s/(δ + n + g) = 2.5\n代入 n + g = 0.03 和 δ = 0.04 可解得此时的储蓄率 s = 0.175。\n（2）由于生产函数为柯布-道格拉斯型，故此时存在 MP_K = αK^(α−1)(AL)^(1−α) = αY/K。代入 α = 0.3，K/Y = k/y = 2.5，解得：\n$$MP_K = 0.3/2.5 = 0.12\n（3）资本黄金律水平满足条件 f′(k) = MP_K = δ + n + g，代入 n + g = 0.03 和 δ = 0.04 可解得此时资本的边际产量 MP_K = 0.07。\n黄金律稳定状态的资本边际产量小于初始稳定状态。因为初始稳定状态的资本存量小于黄金律水平，而边际产量是递减的。\n（4）由柯布-道格拉斯生产函数的性质 MP_K = αY/K，和黄金律稳态的条件 f′(k) = MP_K = δ + n + g 可得，资本黄金律水平下：\n$$K/Y = α/MP_K = α/(δ + n + g) = 0.3/0.07 = 30/7\n（5）由稳态条件 sy = (δ + n + g)k，可得稳态时储蓄率 s_gold = (δ + n + g)(k/y)_gold。代入 n + g = 0.03、δ = 0.04 以及（4）求得的 (K/Y)_gold = (k/y)_gold = 30/7，可解得：\n$$s_gold = 0.07×(30/7) = 0.3\n即要达到黄金规则稳定状态，储蓄率需达到30%。\n**【题干分析】**题干中生产函数为C-D函数，通过该题可以得到如下结论：由"资本在GDP中的份额为30%左右"得到 α = 0.3，因此有效人均产出函数 y = k^0.3；由"产出的平均增长为每年3%左右"得到 n + g = 0.03；由"资本-产出比率为2.5左右"得到 K/Y = k/y = s/(δ + n + g) = 2.5。\n**【提示】**本题题干中并未给出具体函数形式和具体数值，但是题目却需要求具体的数据，此时就需要大家能够熟练使用课本中的结论。如果能够对上一题的结论熟稔于心，那么这道题就很简单；如果对上一题的结论不够了解，就会感觉无从下手。`},
{id:'h45',special:'宏观·索洛模型证明',qid:'A3 ★★★',question:'考虑带有技术进步的索洛模型。假设一国的生产函数为柯布-道格拉斯生产函数，且资本产出弹性 0.36，是不变的。假设当前经济已经处于稳态，此时产出(Y)的稳态增速为每年5%，折旧率为4%，资本产出比率 K/Y 等于3。（1）求初始稳态时的储蓄率；（2）求初始稳态时资本的边际产量；（3）初始稳态是否符合“黄金律”？若不符合是更低还是更高？应增加还是降低储蓄率？（4）求经济达到“黄金律”时的储蓄率。（中财 803 经济学综合 2023 年考题）',answer:`**考察知识点**：索洛模型、技术进步、黄金律。\n**思路**：稳态增长率 n+g=5%；储蓄率 s=(δ+n+g)(K/Y)；黄金律储蓄率等于资本份额。\n**答案**：（1）s=27%。（2）MPK=0.12。（3）不符合；初始稳态资本低于黄金律，应增加储蓄率。（4）sgold=36%。\n##**详解**\n（1）令有效人均资本 k = K/(AL)，有效人均产出 y = Y/(AL) = f(k) = k^α。当考虑技术进步率时，稳态的条件为：\n$$Δk = sy − (δ + n + g)k = 0\n所以稳态时有效人均资本增长率 Δk/k = 0；由于 y = f(k)，所以有效人均产出增长率 Δy/y = 0。由增长率的性质可知总产出增长率 ΔY/Y = ΔA/A + ΔL/L = n + g。\n因此由题意可知：n + g = 5%，K/Y = k/y = 3，δ = 4%。由于当前经济已经处于稳态，所以：\n$$s = (k/y)·(δ + n + g) = 3×(0.05 + 0.04) = 0.27\n（2）由题意知，初始稳态时资本产出弹性 (∂Y/∂K)·(K/Y) = 0.36，所以资本的边际产量：\n$$∂Y/∂K = 0.36/3 = 0.12\n（3）由（1）（2）可知，初始稳态时资本的边际产量 f′(k) = ∂Y/∂K = 0.12，δ + n + g = 0.09。此时存在 f′(k) > δ + n + g，所以初始稳态不是黄金律稳态，此时稳态有效人均资本存量低于黄金律水平，应该增加储蓄率。\n（4）初始稳态时资本产出弹性 (∂Y/∂K)·(K/Y) = 0.36，即资本收入占总收入的份额为0.36，所以 α = 0.36，对应的黄金律水平的储蓄率 s_gold = α = 36%。`},
{id:'h46',special:'宏观·索洛模型证明',qid:'B1 ★★',question:'假设劳动与资本均按其边际产品支付。令 w 表示 ∂F(K,AL)/∂L 且 r 表示 ∂F(K,AL)/∂K−δ。（1）证明劳动的边际产品 w 是 A[f(k)−kf′(k)]。（2）证明如果资本与劳动均按其边际产品支付，那么不变的规模报酬意味着生产要素的总支付量等于总的净产出，即证明 wL+rK=F(K,AL)−δK。（3）随着产出份额被支付给资本与劳动，资本报酬 r 大致也不随时间而变化。处在平衡增长路径上的索洛经济展现这些特征吗？处在均衡增长路径上的 w 与 r 的增长率是多少？（4）假设经济由一个数量为 k<k* 的水平开始。随着 k 移向 k*，w 是否以大于、小于或等于其处在平衡增长路径时的增长率的速度增长？r 会怎样呢？',answer:`**考察知识点**：索洛模型、边际产品、平衡增长路径。\n**思路**：利用规模报酬不变和欧拉定理；分析平衡增长路径上工资和资本报酬增长率。\n**答案**：证明略；结论成立。\n##**详解**\n（1）劳动的边际产品为 w = ∂F(K,AL)/∂L。生产函数为 Y = F(K,AL)，由于规模报酬不变，所以 Y = ALf(k) = ALf(K/(AL))。两边关于 L 求导：\n$$w = ∂Y/∂L = ALf′(k)·(−K/(AL²)) + A·f(k) = A[f(k) − kf′(k)]\n（2）资本的边际产品为 r = ∂F(K,AL)/∂K − δ。生产函数两边关于 K 求导：\n$$r = ALf′(k)·(1/(AL)) − δ = f′(k) − δ\n将上面两式代入 wL + rK 得：\n$$wL + rK = A[f(k) − kf′(k)]·L + [f′(k) − δ]·K = ALf(k) − δK = F(K,AL) − δK\n（3）第（2）式中 r = f′(k) − δ。因为 δ 保持不变，而 k 在平衡增长路径上也保持不变，因此 f′(k) 不变，r 也将保持不变，这意味着 Δr/r = 0，从而资本回报率在索洛模型中保持不变。\n资本的产出份额 R = rK/Y，求其增长率：\n$$ΔR/R = Δr/r + ΔK/K − ΔY/Y = 0 + (n + g) − (n + g) = 0\n所以在平衡增长路径上，资本的产出份额保持不变。又因为资本与劳动的产出份额之和为1，因此劳动的产出份额也保持不变。\n劳动的边际产品是 w = A[f(k) − kf′(k)]，两边取对数求增长率：\n$$Δw/w = ΔA/A + [f′(k)·Δk − Δk·f′(k) − k·f″(k)·Δk]/[f(k) − kf′(k)] = g − k·f″(k)·Δk/[f(k) − kf′(k)]\n在平衡增长路径上 Δk = 0，因此 Δw/w = g，即劳动的边际产品的增长率为技术进步率。\n（4）当 k < k* 时，Δk > 0，又因为 f″(k) < 0，同时 w = A[f(k) − kf′(k)] > 0，即 f(k) − kf′(k) > 0，所以上式中第二项为正，即当 k < k* 时 Δw/w > g，此时劳动的边际产品增长率比平衡增长路径时更快。\n资本的边际产品 r = ∂F(K,AL)/∂K − δ，其增长率为：\n$$Δr/r = f″(k)·Δk/[f′(k) − δ]\n当 k < k* 时 Δk > 0，又因为 f″(k) < 0，所以 Δr/r < 0，即当 k < k* 时，k 向 k* 移动的过程中资本的边际产品增长率下降。\n**【提示】**本题为南开考研试题，前三问也是南开2021年计算题原题。题源来自罗默《高级宏观经济学》课后题。`},
{id:'h47',special:'宏观·索洛模型证明',qid:'B2 ★★',question:'假设像上题中的一样，资本与劳动按其边际产品获得收益。另外，假定所有资本都被储蓄，所有劳动收入被消费。这样，k̇=[∂F(K,AL)/∂K]K−δK。（1）证明：这一经济收敛于一平衡增长路径。（2）处于该平衡增长路径上的 k 是大于、小于还是等于 k 的黄金率水平？如何直观地理解这一结果？',answer:`**考察知识点**：索洛模型、平衡增长路径、黄金律。\n**思路**：证明收敛性；分析平衡增长路径上的资本水平与黄金律关系。\n**答案**：证明略；k 等于黄金律水平。\n##**详解**\n（1）平衡增长路径的定义是模型中所涉及到的各经济变量均维持稳定的增长率水平。\n由 k = K/(AL)，左右同时取对数并全微分可得：\n$$Δk/k = ΔK/K − ΔA/A − ΔL/L\n根据题意有 ΔK = [∂F(K,AL)/∂K]K − δK，ΔL/L = n，ΔA/A = g，所以有：\n$$Δk/k = ΔK/K − g − n = ∂F(K,AL)/∂K − δ − n − g\n即：\n$$Δk = [∂F(K,AL)/∂K − δ − n − g]k\n将 ∂F(K,AL)/∂K = f′(k) 代入上式，可得：\n$$Δk = [f′(k) − (δ + n + g)]k\n当 Δk = 0 时，每单位有效劳动的资本保持不变，即 [f′(k) − (δ + n + g)]k = 0，因此平衡增长路径上的每单位有效劳动的资本可以由该式潜在地决定。\n由于在平衡增长路径上 k 保持不变，因此 K 必须与 AL 保持同样的增长速度。AL 的增长速度为 n + g，所以 K 的增长速度为 n + g。由于生产函数规模报酬不变，因此在平衡增长路径上的产出增长速度也必须是 n + g。综上所述，所有变量增长速度均不变。\n下面证明经济收敛于平衡增长路径。在 k = k* 时，f′(k) = δ + n + g，此时经济处于平衡增长路径上。如果 k > k*，由于 f″(k) < 0，所以 f′(k) < δ + n + g，故 Δk < 0，经济向下调整；反之，如果 k < k*，则 f′(k) > δ + n + g，故 Δk > 0，经济向上调整。所以，不管初始的 k 如何，经济都将收敛于平衡增长路径，此时所有的经济变量都以不变的速率增长。\n（2）由题意可知，所有资本都被储蓄，所有劳动收入都被消费，所以总消费 C = wL = A[f(k) − kf′(k)]·L，有效人均消费：\n$$c = wL/(AL) = f(k) − kf′(k)\n由第（1）问稳态条件可知，稳态时满足 kf′(k) = (δ + n + g)k，故稳态时有效人均消费 c = f(k) − (δ + n + g)k。满足黄金规则的资本水平是指使每单位有效劳动的消费最大时的资本水平，即：\n$$∂c/∂k = f′(k_GR) − (δ + n + g) = 0\n即 f′(k_GR) = δ + n + g。由（1）可知，本模型稳态时满足 f′(k*) = δ + n + g，因此本模型经济收敛到均衡增长路径时 k 的水平 k* 等于 k 的黄金率水平 k_GR。这时所有的资本收入被储蓄，所有的劳动收入被消费。`},
{id:'h48',special:'宏观·经济增长核算',qid:'A1 ★★',question:'假设总产出 Yt=At Kt^α Lt^(1−α)，其中 t 为时间，At 为全要素生产率，Kt 为资本，Lt 为劳动。（1）请将总产出的增长分解为全要素生产率、资本和劳动三部分的增长之和。（2）请将人均产出的增长分解为全要素生产率和人均资本两部分的增长之和。（中山大学国际金融学院考题）',answer:`**考察知识点**：增长核算、全要素生产率。\n**思路**：对生产函数取对数求导；分解总产出和人均产出增长。\n**答案**：（1）gY=gA+αgK+(1−α)gL。（2）gy=gA+αgk。\n##**详解**\n（1）设全要素生产率 A_t、资本 K_t、劳动 L_t 的增长率分别为 g、i、n，即：\n$$(1/A_t)·(dA_t/dt) = g，(1/K_t)·(dK_t/dt) = i，(1/L_t)·(dL_t/dt) = n\n则总产出增长率为：\n$$(1/Y_t)·(dY_t/dt) = [K_t^α L_t^(1−α)·(dA_t/dt) + A_t L_t^(1−α)·αK_t^(α−1)(dK_t/dt) + A_t K_t^α·(1−α)L_t^(−α)(dL_t/dt)]/(A_t K_t^α L_t^(1−α))\n$$= (1/A_t)(dA_t/dt) + α(1/K_t)(dK_t/dt) + (1−α)(1/L_t)(dL_t/dt) = g + αi + (1 − α)n\n**【提示】**这里直接对 Y_t = A_t K_t^α L_t^(1−α) 左右同时取对数然后对时间 t 求导更简单：\n$$(1/Y_t)(dY_t/dt) = dlnY_t/dt = dlnA_t/dt + α·dlnK_t/dt + (1−α)·dlnL_t/dt = g + αi + (1 − α)n\n（2）设人均产出 y_t = Y_t/L_t，人均资本 k_t = K_t/L_t，且人均资本增长率为 (i − n)。\n则人均产出：\n$$y_t = Y_t/L_t = A_t K_t^α L_t^(1−α)/L_t = A_t (K_t/L_t)^α = A_t k_t^α\n人均产出增长率为：\n$$(1/y_t)(dy_t/dt) = (1/A_t)(dA_t/dt) + α(1/k_t)(dk_t/dt) = g + α(i − n)\n**【提示】**当题目中给的变量带下角标 t 时，说明各个变量是时间 t 的函数，此时求增长率不再建议用增长率的性质，而是用变量对时间 t 求导。`},
{id:'h49',special:'宏观·经济增长核算',qid:'A2 ★★★',question:'索洛增长模型描述的一个经济有以下生产函数：Y(t)=A(t)K(t)^a L(t)^β。（1）对于上述生产函数，我们一般要求 0<a<1，0<β<1。为什么？除此之外，我们还会对它们做什么样的假设限制？（2）如果假设时间 t 是连续的，证明经济增长因素分解等式 gY=gA+agK+βgL 成立。（3）资本的演化方程式是：K̇=sY−δK，gA=g，gL=n。求稳态时人均资本 k 的增长率。（上海财经大学考题）',answer:`**考察知识点**：增长核算、规模报酬、稳态增长率。\n**思路**：分析参数限制；取对数求导；求稳态人均资本增长率。\n**答案**：（1）保证边际报酬递减；通常还假设 α+β=1。（2）证明略。（3）稳态时人均资本增长率 g/(1−α)。\n##**详解**\n（1）之所以要求 0 < α < 1，0 < β < 1，是因为在此条件下，资本和劳动都和产出呈正相关，同时保证资本和劳动的边际报酬递减。除此之外，还会假定 α + β = 1，从而使生产函数呈规模报酬不变。\n（2）由生产函数 Y(t) = A(t)K(t)^α L(t)^β 两边取对数则有：\n$$lnY(t) = lnA(t) + αlnK(t) + βlnL(t)\n等式两边同时对时间 t 求导，则有：\n$$(1/Y)(dY/dt) = (1/A)(dA/dt) + α(1/K)(dK/dt) + β(1/L)(dL/dt)\n即：\n$$ΔY/Y = ΔA/A + αΔK/K + βΔL/L\n则可得经济增长因素分解等式 g_Y = g_A + αg_K + βg_L。**【提示】**以上表达式就是经济增长核算方程。\n（3）**【法一】**利用经济增长核算方程求解。\n由资本的演化方程 ΔK = sY − δK 可得总资本的增长率：\n$$g_K = (sY − δK)/K = s(Y/K) − δ\n由稳态时 g_K 为常数，可知 Y/K 为常数，所以总产出与总资本的增长率相等，即 g_Y = g_K。将其代入增长核算方程 g_Y = g_A + αg_K + βg_L（β = 1 − α）可得：\n$$g_K = g + αg_K + (1 − α)n\n解得：\n$$g_K = g/(1 − α) + n\n人均资本 k = K/L，故人均资本增长率 g_k = g_K − n = g/(1 − α)。\n**【法二】**对总产出函数变形并利用稳态条件。\n生产函数为 Y(t) = A(t)K(t)^α L(t)^β = A(t)K(t)^α L(t)^(1−α)，此时 A 以 Y = AF(K,L) 的形式进入，但 A 不是常数，因此技术进步为希克斯中性的。\n两边同除以 A^(1/(1−α))L，可以得到密集形式（要找到稳态，首先要找到密集形式）：\n$$Y/(A^(1/(1−α))L) = A K^α L^(1−α)/(A^(1/(1−α))L) = [K/(A^(1/(1−α))L)]^α\n即 ŷ = k̂^α，其中 ŷ = Y/(A^(1/(1−α))L)，k̂ = K/(A^(1/(1−α))L)。\n稳态时 k̂ 的增长率为0；由于人均资本 k = K/L = A^(1/(1−α))k̂，所以稳态时人均资本的增长率（增长率的性质）= [1/(1−α)] 倍的 A 的增长率 + k̂ 的增长率 = g/(1 − α)。\n**【提示1】**曼昆教材中涉及的是劳动增强型（哈罗德中性）的总产出函数，其函数形式为 Y = F(K,AL)，A 不为常数，即其增长率不为零。本题为希克斯中性的总产出函数，其函数形式为 Y = AF(K,L)，A 在括号外面，且不为常数（增长率不为零），此时 A 是全要素生产率，因为它加强所有要素（全要素）。稳态时人均资本的增长率和总资本的增长率都为常数但是不为零，就是本题第（3）问，需要用上面答案的两种方法。此类函数形式求稳态的方法见宏观拔高专项一细分专项（一）。\n还有一类题目，其函数形式也为 Y = AF(K,L)，A 在括号外面，但此时 A 为常数（增长率为零），碰到此类题目按照曼昆教材上不包含技术进步的索洛模型进行求解即可。\n**【提示2】**稳态需要满足两个条件（这两个条件在后面拔高专项的新增长理论中经常会用到，是新增长理论求稳态的核心思路）：第一，稳态时存在一点满足所有变量的增长率都为常数；第二，该点是稳定的，即经济会自动趋向该点。对于本题第（3）问就要求稳态时总产出与总资本的增长率相等，同时稳态时总资本的增长率必须是常数（稳态要求所有变量的增长率都为常数），即总资本必须按照某一固定的增长率增长，否则不可能稳态。\n**【提示3】**除上面提到的两种形式的总产出函数外，还有一种资本增强型总产出函数，其函数形式为 Y = F(AK,L)，此类函数求稳态的方法见宏观拔高专项一细分专项（一）。`},
{id:'h50',special:'宏观·两部门模型',qid:'A1 ★★★',question:'假设两部门模型的生产函数为：Y=K^a[(1−u)LE]^(1−a)，研究性大学的生产函数为 ΔE=g(u)E，资本的积累为 ΔK=sY−δK。式中，u 为大学的劳动力比例，1−u 为制造业的劳动力比例；E 为知识存量，它又决定了劳动效率；g 为表明知识增长如何取决于大学的劳动力比例的函数。（1）写出有效工人的平均资本生产函数。（2）在这个经济中，收支相抵的投资是多少？求出稳态时有效工人的平均资本。（3）发生自然灾害导致经济中资本存量减半，求稳态变化。（4）影响短期增长率的措施和影响长期增长率的措施有哪些？（5）求出有效工人的平均资本 k 的黄金律稳态水平和有效工人的平均产出 y 的黄金律稳态水平。（6）求出黄金律稳态时对应的储蓄率为多少？是否与 u 有关？',answer:`**考察知识点**：两部门模型、有效工人、稳态、黄金律。\n**思路**：定义有效人均资本；求稳态条件；分析灾害影响；求黄金律。\n**答案**：（1）y=(1−u)^(1−α)k^α。（2）收支相抵投资 [δ+n+g(u)]k；k*=(1−u)[s/(δ+n+g(u))]^(1/(1−α))。（3）短期内资本减半，随后恢复至稳态。（4）短期措施：提高储蓄率等；长期措施：提高技术进步率等。（5）k*gold=(1−u)[α/(δ+n+g(u))]^(1/(1−α))；y*gold=(1−u)[α/(δ+n+g(u))]^(α/(1−α))。（6）sgold=α，与 u 无关。\n##**详解**\n（1）令 k = K/(LE)，y = Y/(LE)，生产函数 Y = K^α[(1 − u)LE]^(1−α) 两端同除以 LE 可得有效工人的平均资本生产函数：\n$$y = (1 − u)^(1−α)k^α\n（2）收支相抵的投资现在包括三个方面：折旧的补偿（δk）、为新增工人配置资本（nk）、为劳动效率的提高配置资本 [g(u)k]，其中 g(u) 是劳动效率型技术进步率。所以，现在收支相抵的投资为 [δ + n + g(u)]k。\n**【注】**这一步为防止出错，可以用如下的方法求解或验证。令有效人均资本 k = K/(LE)，两边对时间求导（求导法则）或者根据增长率的性质：\n$$Δk/k = ΔK/K − ΔL/L − ΔE/E = (sY − δK)/K − [n + g(u)]\n进一步整理可得：\n$$Δk = sy − [δ + n + g(u)]k\n其中 y = (1 − u)^(1−α)k^α，收支相抵的投资为 [δ + n + g(u)]k。故稳态条件为 sy = [δ + n + g(u)]k。代入 y 可以解得稳态时有效工人的平均资本：\n$$k* = (1 − u)[s/(δ + n + g(u))]^(1/(1−α))\n（3）经济一开始处于均衡状态，当发生自然灾害时，经济中资本存量减半，即 K 减半，这样 k 在短期内会由于 K 的减半而减半，这使得短期内 sy > [δ + n + g(u)]k，即储蓄超过增长所需要的单位效率工人的补偿水平，这将使得资本积累加快，Δk > 0，随着时间推移，最终恢复至稳态均衡。\n（4）由于短期内人口增长率和技术进步率可以看作是不变的量，所以短期经济增长率主要和资本增长率相关，因此短期内影响资本增长率的因素会导致经济增长率变化，比如改变储蓄率的所有政策。\n经济的长期增长率等于技术进步率和人口增长率之和，所以要提高长期增长率应该提高技术进步率和人口增长率，比如配置经济的投资、加大对人力资本的投资、加大对研究部门劳动的投入、加大对科技教育的投入、鼓励二胎政策以提高人口增长率等措施。\n（5）黄金律稳态时满足 f′(k) = δ + n + g(u)，代入 y = f(k) = (1 − u)^(1−α)k^α 解得黄金律稳态时：\n$$k_gold = (1 − u)[α/(δ + n + g(u))]^(1/(1−α))\n$$y_gold = (1 − u)[α/(δ + n + g(u))]^(α/(1−α))\n（6）将 k_gold 代入稳态条件 sy = [δ + n + g(u)]k 可以解得资本黄金律水平的储蓄率 s_gold = α。\n**【提示1】**第（6）问也可以通过对比第（2）（5）问中 k* 和 k_gold 的表达式直接得到资本黄金律水平时的储蓄率。黄金律时对应的储蓄率为资本 K 的指数 α，这其实是一个结论，以后求黄金律水平的储蓄率时都可以用这个结论验证自己算得对不对（引入失业率、资本利用率、税收后，黄金律稳态时储蓄率均为资本 K 的指数）。\n**【提示2】**还有一类变形题目，就是题干中不会直接给出 A、L 的变化率，而是给出它们关于时间 t 的表达式，需要大家根据变化率的定义自己求 g、n（变化率的定义公式为 g = (1/A_t)(dA_t/dt)，n = (1/L_t)(dL_t/dt)，一般思路是对 A、L 表达式取对数，然后对时间 t 求导，相关题目见南开大学2018和2022年真题）。`},
{id:'h51',special:'宏观·两部门模型',qid:'B1 ★★★',question:'一个封闭经济体包含制造业和教育两部门，其生产函数分别为：Y=AK^α(uEL)^(1−α)，ΔE=B(1−u)E。其中，Y、E 分别表示制造业的产出和教育部门的知识存量，ΔE 表示变量 E 随时间的变化量，A、B 为正的常数，u 表示制造业工人占劳动人数 L 的比率，0≤u≤1。储蓄率、折旧率、总劳动人数增长率为外生给定，分别用 s、δ、n 表示。（1）用 y 表示平均有效工人产出，k 表示平均有效工人资本存量，写 y 与 k 的关系式，并写出 Δk 的表达式。（2）总产出 Y 的稳态增长率是多少？s 和 u 分别对其有什么影响？（3）结合图形说明当 u 提高时，稳态时有效工人的人均资本存量将发生什么变化？（4）什么是储蓄的黄金率水平？写出黄金率水平时的资本存量 kgold 以及储蓄率 sgold。（5）甲、乙两国分别在 s>sgold 和 s<sgold 的情况下达到稳态，请问政府可以采取什么措施来提高或降低储蓄率？请从帕累托改进的角度分析，在甲、乙两国采取调整储蓄率的措施，哪一国政策更好？（6）索洛残差是什么？如何通过题目中已有的数据来估计？',answer:`**考察知识点**：两部门模型、稳态、黄金律、索洛残差。\n**思路**：求有效人均资本动态；分析稳态增长率；求黄金律；分析储蓄率调整。\n**答案**：略。\n##**详解**\n（1）令平均有效工人资本存量 k = K/(EL)，则有效人均生产函数：\n$$y = Y/(EL) = A u^(1−α)k^α\n由增长率的性质可得：\n$$Δk/k = ΔK/K − ΔE/E − ΔL/L = (sY − δK)/K − B(1 − u) − n\n进一步整理可得：\n$$Δk = sy − [δ + B(1 − u) + n]k = sA u^(1−α)k^α − [δ + B(1 − u) + n]k\n（2）稳态时满足 Δk = 0。由于 y = A u^(1−α)k^α，所以稳态时有效人均资本和有效人均产出增长率为0。由增长率的性质可得，稳态时总产出 Y 的增长率：\n$$ΔY/Y = Δy/y + ΔE/E + ΔL/L = B(1 − u) + n\n因此，储蓄率 s 的变动不影响稳态时 Y 的增长率，而 u 的上升会导致稳态时总产出增长率下降。\n（3）由（1）可知，Δk = sy − [δ + B(1 − u) + n]k，其中 y = A u^(1−α)k^α。稳态时满足 Δk = 0，所以曲线 sy 与 [δ + B(1 − u) + n]k 的交点即为稳态点。如下图所示，初始稳态点为A点。当 u 提高时，一方面，曲线 sy 上移；另一方面，[δ + B(1 − u) + n]k 变得更加平坦。新的稳态点为B点，所以新的稳态时有效人均资本水平更高。\n【此处有图示】\n（4）储蓄的黄金律水平是指索洛模型达到稳态时，人均消费达到最大化时的储蓄率水平。稳态时有效工人的人均消费：\n$$c = y − sy = A u^(1−α)k^α − [δ + B(1 − u) + n]k\n一阶条件为：\n$$dc/dk = αA u^(1−α)k^(α−1) − [δ + B(1 − u) + n] = 0\n解得黄金律稳态时有效人均资本：\n$$k_gold = [αA u^(1−α)/(δ + B(1 − u) + n)]^(1/(1−α))\n将其代入稳态条件解得黄金律水平的储蓄率 s_gold = α。\n（5）甲、乙两国政府应分别降低储蓄率和提高储蓄率，使得储蓄率等于黄金率水平。\n提高储蓄率的措施：利用宣传鼓励民众提高储蓄率，减少政府预算赤字，或增加预算盈余。降低储蓄率的措施：提高整体市场的预期，促进居民的投资热情；减少国际摩擦，促进外贸交易；扩大公共福利领域的政府支出。\n如下图（a）所示，甲国在储蓄率降低的瞬间 t₀ 时刻，有效人均消费增加。此后，由于储蓄率的降低会带来产出下降，所以有效人均消费不断减少；但由于黄金律稳态是对应消费水平最大的稳态，所以最终有效人均消费高于初始水平。在此过程中，有效人均消费都高于初始水平。\n如下图（b）所示，乙国在储蓄率上升的瞬间 t₀ 时刻，有效人均消费减少。此后，由于储蓄率的上升会带来产出增加，所以有效人均消费不断增加；由于黄金律稳态是对应消费水平最大的稳态，所以最终有效人均消费高于初始水平。在此过程中，有效人均消费有一段时间低于初始稳态水平。\n由下图可以得到：在提高储蓄率的情况下产出 y 和消费 c 都提高；但是在降低储蓄率的情况下消费 c 提高，产出 y 最终下降。所以从帕累托改进的角度来看，乙国提高储蓄率的政策更好。\n【此处有图示】\n（6）索洛残差就是除了劳动力和资本以外的因素对经济增长率的贡献度。本题中，由 Y = AK^α(uEL)^(1−α) 可得：\n$$ΔY/Y = αΔK/K + (1 − α)(ΔE/E + ΔL/L)\n其中资本对经济增长的贡献为 αΔK/K，劳动对经济增长的贡献为 (1 − α)ΔL/L，所以索洛残差就是 (1 − α)ΔE/E = (1 − α)B(1 − u)。`},
{id:'h52',special:'宏观·变形的索洛模型',sub:'细分（一）：三种技术进步',qid:'A1 ★★★',question:'已知：一国经济中的生产函数是：Y=K^(1/3)(AN)^(2/3)，人口年增长率为0.05，资本折旧率也是0.05。（1）如果储蓄率为10%，A=2，计算该国稳态条件下的人均资本、人均产出、人均投资和人均消费水平。（2）分析从增加人均消费角度看，该国是否应该调整储蓄率？（3）如果 A 以每年2%的比率增长，稳态的经济增长率是多少？如果稳态增速不能进一步提高，该国可以用什么方法来提高本国的人均收入水平？（4）如果生产函数变为 Y=(AK)^(1/3)N^(2/3)，A 仍以每年2%的比率增长，其它各个参数不变，稳态经济增长率是多少？（对外经贸 2020 年考题）',answer:`**考察知识点**：索洛模型、技术进步、稳态、黄金律。\n**思路**：分别按无技术进步、劳动增强型技术进步、资本增强型技术进步求解。\n**答案**：（1）k=2，y=2，人均投资0.2，人均消费1.8。（2）应提高储蓄率。（3）总产出增长率7%；可通过提高技术进步率提高人均收入。（4）总产出增长率6%。\n##**详解**\n（1）人均产出函数 y = Y/N = A^(2/3)k^(1/3)。由于此时不存在技术进步，故稳态时满足条件 sy = (δ + n)k。代入 s = 0.1，n = 0.05，δ = 0.05，A = 2：\n$$0.1×2^(2/3)k^(1/3) = 0.1k\n解得稳态时人均资本 k = 2，因此人均产出 y = 2，人均投资 = sy = 0.2，人均消费 c = y − sy = 1.8。\n（2）人均消费 c = y − sy，稳态时满足条件 sy = (δ + n)k，故 c = y − (δ + n)k。由人均消费最大化的一阶条件可得，资本黄金律水平满足条件：\n$$(1/3)A^(2/3)k^(−2/3) = δ + n\n代入 n = 0.05，δ = 0.05，A = 2，解得资本黄金律水平的人均资本：\n$$k_gold = 2×(10/3)^(3/2)\n将其代入 sy = (δ + n)k 解得资本黄金律水平的储蓄率 s_gold = 1/3。该储蓄率水平要大于初始的储蓄率水平，因此该国应该提高储蓄率以增加人均消费。\n（3）人均有效产出函数 y = Y/(AN) = k^(1/3)，稳态时有效人均资本变化量 Δk = 0，故总产出增长率：\n$$ΔY/Y = ΔA/A + ΔN/N + Δy/y = g + n = 2% + 5% = 7%\n人均收入增长率等于技术进步率（2%）。因此，如果稳态增速不能进一步提高，该国可以通过提高技术进步率（A 的增长率）来进一步提高本国的人均收入水平。\n（4）此问是资本增加型的技术进步。平衡增长路径上：\n$$ΔY/Y = [a/(1 − a)]·ΔA/A + ΔN/N + Δỹ/ỹ = (1/3)/(2/3)×2% + 5% = 6%\n**【提示】**第（4）问也可以用经济增长核算方程求稳态增长率，之前例题中讲过，这里不再赘述。`},
{id:'h52b',special:'宏观·变形的索洛模型',sub:'细分（一）：三种技术进步',qid:'A2 ★★★',question:'考虑一个经济，生产部门的生产函数为 Y=AK^aL^(1−a)，假设储蓄率为0.1，人口增长率为 n=0.01，资本折旧率 δ=0.01。（1）计算劳动所得与资本所得在总收入中的份额；（2）假设技术水平 A 以 2% 的速度增长，计算总产出和人均资本存量的均衡增长率。',answer:`**考察知识点**：要素收入份额、经济增长核算、希克斯中性技术进步、稳态增长率。\n**思路**：由边际产品乘以要素数量求份额；第（2）问给出两种解法——增长核算方程，以及希克斯中性产出函数的稳态条件。\n**答案**：（1）劳动所得份额 1−a，资本所得份额 a。（2）稳态总产出增长率 0.02/(1−a)+0.01，人均资本存量增长率 0.02/(1−a)。\n##**详解**\n（1）由生产函数 Y = AK^aL^(1−a) 可得两种要素的边际产品：\n$$MP_L = (1 − a)AK^aL^(−a)，MP_K = aAK^(a−1)L^(1−a)\n所以劳动所得占总收入的份额为：\n$$MP_L·L/Y = (1 − a)AK^aL^(−a)·L/(AK^aL^(1−a)) = 1 − a\n资本所得占总收入的份额为：\n$$MP_K·K/Y = aAK^(a−1)L^(1−a)·K/(AK^aL^(1−a)) = a\n即在柯布-道格拉斯生产函数下，要素收入份额恰好等于各要素的产出弹性，与要素价格、要素数量都无关。\n（2）**【法一】**利用经济增长核算方程求解。\n本题中 A 位于括号之外、不是常数（增长率不为零），此时稳态下人均资本增长率与总资本增长率都是常数，但都不为零，不能直接套用“稳态时人均量增长率为零”的结论。\n增长核算方程为：\n$$ΔY/Y = ΔA/A + a·ΔK/K + (1 − a)·ΔL/L\n稳态时资本产出比 K/Y 为常数，故 Y 与 K 同速增长：\n$$ΔY/Y = ΔK/K\n代入增长核算方程，并记 ΔA/A = g、ΔL/L = n：\n$$ΔY/Y = g + a·ΔY/Y + (1 − a)n\n移项解得：\n$$ΔY/Y = ΔK/K = g/(1 − a) + n\n代入 g = 2%、n = 1%：\n$$ΔY/Y = 0.02/(1 − a) + 0.01\n人均资本存量的增长率等于总资本增长率减去人口增长率：\n$$Δ(K/L)/(K/L) = ΔK/K − n = ΔY/Y − n = 0.02/(1 − a)\n**【法二】**利用希克斯中性产出函数的稳态条件求解。\nA 以 Y = AF(K, L) 的形式进入生产函数且 A 不为常数，故该技术进步是希克斯中性的。令有效人均资本为：\n$$k̃ = K/(A^(1/(1−a))·L)\n生产函数两边同除以 A^(1/(1−a))L，得到密集形式：\n$$ỹ = Y/(A^(1/(1−a))·L) = AK^aL^(1−a)/(A^(1/(1−a))L) = k̃^a\n稳态时 k̃ 的增长率为零，故 ỹ 的增长率也为零。由增长率的性质可得：\n$$ΔY/Y = [1/(1 − a)]·ΔA/A + ΔL/L + Δỹ/ỹ = g/(1 − a) + n = 0.02/(1 − a) + 0.01\n$$人均资本增长率 = [1/(1 − a)]·ΔA/A + Δk̃/k̃ = 0.02/(1 − a)\n**【注】**本题很多版本的答案都是错的，上面每一问的解析都很清晰，大家把握好思路。\n**【校注】**原书第（2）问法二末尾把结果写成 0.02/(1−a)+g，按题意 n = 1%，此处应为 0.02/(1−a)+0.01；同段又把“增长核算方程”印作“资本核算方程”，一并改正。`},
{id:'h52c',special:'宏观·变形的索洛模型',sub:'细分（一）：三种技术进步',qid:'B1 ★★★',question:'物化（embodied）的技术进步。有关技术进步的一种看法是：资本品在时刻 t 的生产力依赖于时刻 t 的技术水平，而与此后的技术进步无关，这就是物化的技术进步（技术进步必须物化为新的资本才能增加产出）。本题旨在探讨物化技术进步的影响。\n作为一个前提，把基本的索洛模型修改为技术进步是资本增加型的而非劳动增加型的。为了保证平衡增长路径的存在，假设生产函数为柯布-道格拉斯函数：Y(t)=[A(t)K(t)]^α·L(t)^(1−α)，A 的增长率为 μ，即 ΔA(t)=μA(t)。证明该经济收敛于一个平衡增长路径，并计算 Y 与 K 在平衡增长路径上的增长率。',answer:`**考察知识点**：资本增强型（物化）技术进步、平衡增长路径、有效人均资本动态。\n**思路**：把 [A(t)K(t)]^αL(t)^(1−α) 改写为 K^α·(A^φL)^(1−α)，其中 φ=α/(1−α)；令有效人均资本 k=K/(A^φL)，写出其积累方程并讨论零点的稳定性，最后回到总量增长率。\n**答案**：经济收敛于平衡增长路径；Y 与 K 的增长率均为 φμ+n = αμ/(1−α)+n。\n##**详解**\n资本增强型技术进步下的生产函数为：\n$$Y(t) = [A(t)K(t)]^α·L(t)^(1−α)\n把它改写为劳动增强型（哈罗德中性）的形式：\n$$Y(t) = K(t)^α·[A(t)^(α/(1−α))·L(t)]^(1−α)\n令 φ = α/(1 − α)，并定义有效人均资本与有效人均产出：\n$$k(t) = K(t)/(A(t)^φ·L(t))，y(t) = Y(t)/(A(t)^φ·L(t))\n则有效人均产出可写成 k 的函数：\n$$y(t) = K(t)^α·[A(t)^φL(t)]^(1−α)/(A(t)^φL(t)) = [K(t)/(A(t)^φL(t))]^α = k(t)^α\n为求 k 的动态变化，对 k(t) = K(t)/(A(t)^φL(t)) 两边取对数后对时间 t 求导：\n$$Δk/k = ΔK/K − φ·ΔA/A − ΔL/L = (sY − δK)/K − (φμ + n)\n进一步整理可得有效人均资本的积累方程：\n$$Δk(t) = s·k(t)^α − (δ + φμ + n)k(t)\n【此处有图示】\n先分析有效人均资本与有效人均产出。当 Δk > 0，即 sk^α > (δ + φμ + n)k 时，k 上升趋向于 k*；当 sk^α < (δ + φμ + n)k 时，k 下降趋向于 k*。忽略 k = 0 这一退化解，经济将收敛于 k = k*，即收敛到平衡增长路径。\n因为有效人均产出 y(t) = k(t)^α，所以 k = k* 时 y 也保持不变。\n再分析总资本与总产出。总资本可写为 K = A^φL·k，由于 k 在稳态时不变，故 K 在稳态时的增长率为：\n$$ΔK/K = φ·ΔA/A + ΔL/L + Δk/k = φμ + n\n同理总产出可写为 Y = A^φL·y，由于 y 在稳态时不变，故 Y 的增长率也为：\n$$ΔY/Y = φμ + n\n由于 A 与 L 都被假定按既定速率增长，所有变量在稳态下均按既定速率增长，所以经济收敛于平衡增长路径，且有：\n$$ΔY/Y = ΔK/K = αμ/(1 − α) + n\n**【提示】**通过本题掌握判断一个点是否为稳态点的基本思路——先把总量化为有效人均量，写出其积累方程，再讨论该方程零点的存在性与稳定性。这一思路在后面新经济增长理论部分会反复用到。\n**【校注】**原书本题多处把 φ 印作 α（提示中的 A^αL、解中的 k=K/(A^αL)、总资本 A^αL·k 等）。由 [A^φL]^(1−α) = A^αL^(1−α) 可知该指数应为 φ = α/(1−α)，已一并改正；又原书整理式误作 (δ+φn+g)k，与其后的 (δ+φμ+n)k 不一致，已统一为 (δ+φμ+n)k。`},
{id:'h53',special:'宏观·变形的索洛模型',sub:'细分（二）：引入失业率',qid:'A1 ★★★',question:'假定产出是根据含有失业率的生产函数 Y=K^a[(1−u*)L]^(1−α) 来表示的。K 为资本，L 为劳动力，u* 为自然失业率。国民储蓄率为 s，劳动力增长率为 n，资本折旧率为 δ。（1）请把人均产出 y=Y/L 表示为人均资本 k=K/L 和自然失业率的函数。（2）计算该经济的稳态的人均资本和人均产出。（3）失业通过哪两种途径影响稳态的产出水平？（4）求出黄金律稳态时的储蓄率水平，自然失业率对它有影响吗？（南开大学 2017 年考题）',answer:`**考察知识点**：索洛模型、失业率、稳态、黄金律。\n**思路**：求人均产出函数；稳态条件；黄金律。\n**答案**：（1）y=(1−u*)^(1−α)k^α。（2）k*=(1−u*)[s/(δ+n)]^(1/(1−α))，y*=(1−u*)[s/(δ+n)]^(α/(1−α))。（3）失业降低给定资本下的人均产出；失业降低稳态人均资本。（4）sgold=α，与自然失业率无关。\n##**详解**\n（1）由生产函数 Y = K^α[(1 − u*)L]^(1−α) 两边同时除以劳动力 L 则有：\n$$Y/L = K^α[(1 − u*)L]^(1−α)/L = (K/L)^α·[(1 − u*)L/L]^(1−α) = (K/L)^α(1 − u*)^(1−α)\n令人均资本 k = K/L，人均产出 y = Y/L，则有：\n$$y = f(k) = (1 − u*)^(1−α)k^α\n（2）人均资本 k = K/L，两边对时间全微分（或者说由增长率的性质）可得：\n$$Δk/k = ΔK/K − ΔL/L = (sY − δK)/K − ΔL/L = sY/K − (δ + n)\n进一步整理可得 Δk = sf(k) − (δ + n)k。稳态时有 Δk = 0，即：\n$$s(1 − u*)^(1−α)k^α = (δ + n)k\n解得稳态时人均资本为：\n$$k* = (1 − u*)[s/(δ + n)]^(1/(1−α))\n从而稳态的人均产出为：\n$$y* = (1 − u*)^(1−α)(k*)^α = (1 − u*)[s/(δ + n)]^(α/(1−α))\n（3）失业通过以下两种途径影响稳态的产出水平：\n① 由（1）中 y = f(k) = (1 − u*)^(1−α)k^α 可知，对任一给定的 k，失业降低了产出 y。\n② 由（2）中 k* = (1 − u*)[s/(δ + n)]^(1/(1−α)) 可知，失业还降低了稳态的 k*，通过 k* 又降低了 y*。\n（4）人均消费水平 c = y − sy，其中 y = f(k)，稳态时满足 sy = (δ + n)k，故 c = y − (δ + n)k。由人均消费最大化的一阶条件可得 f′(k) = δ + n，即：\n$$αk^(α−1)(1 − u*)^(1−α) = δ + n\n解得：\n$$k_gold = (1 − u*)[α/(δ + n)]^(1/(1−α))\n将 k_gold 代入稳态条件 sy = (δ + n)k 可解得黄金律水平的储蓄率 s_gold = α。因此，黄金律稳态时的储蓄率为 K 的指数 α，与自然失业率 u* 无关。\n**【注】**本题为曼昆课后原题，前几年北大考过原题，2017年南开大学又考了，并增加了第（4）问。\n**【提示】**本题为曼昆课后原题，前几年北大考过原题。在 2017 年南开大学又考了，但是加了一问，就是本题的第（4）问，这一问很精彩。`},
{id:'h54',special:'宏观·变形的索洛模型',sub:'细分（二）：引入失业率',qid:'A2 ★★★',question:'假设某国的社会总生产函数为：Y=K^θ(aL×E)^(1−θ)，其中 0<a≤1，1/2<θ<1。只有 aL 人口是劳动力。储蓄率为 s，资本折旧率为 δ，人口的增长速度为 n，劳动生产率的增长率为 g。定义每个效率工人的资本为 k=K/(aL×E)。（1）计算稳态时的每个效率工人的资本表达式。（2）为了获得黄金规则下的每个效率工人的资本，对应的储蓄率应该为多少？（中山大学 2019 年考题）',answer:`**考察知识点**：索洛模型、劳动参与率、黄金律。\n**思路**：定义有效人均资本；求稳态；黄金律储蓄率。\n**答案**：（1）k*=[s/(δ+n+g)]^(1/(1−θ))。（2）sgold=θ。\n##**详解**\n（1）令 y = Y/(aL×E)，k = K/(aL×E)，则 y = k^θ。每个效率工人的资本为 k = K/(aL×E)，且 ΔK = sY − δK。\n两边对时间求导（求导法则）或者根据增长率的性质，可得：\n$$Δk/k = ΔK/K − (ΔL/L + ΔE/E) = (sY − δK)/K − (n + g) = s(Y/K) − (δ + n + g)\n可得：\n$$Δk = sy − (δ + n + g)k\n稳态时：\n$$k* = [s/(δ + n + g)]^(1/(1−θ))\n（2）黄金规则时每个效率工人的资本 k_gold 满足 f′(k) = δ + n + g，即 θk^(θ−1) = δ + n + g，解得：\n$$k_gold = [θ/(δ + n + g)]^(1/(1−θ))\n又稳态时 k* = [s/(δ + n + g)]^(1/(1−θ))，对比可得黄金律稳态对应的储蓄率为 s = θ。\n**【注】**题干中 a 为劳动参与率（0 < a ≤ 1），θ 为资本产出弹性（1/2 < θ < 1），本题结论表明黄金律储蓄率恰为资本产出弹性 θ，与劳动参与率 a 无关。\n**【提示】**南开 876（微宏政）在 2022 年考过类似题。`},
{id:'h55',special:'宏观·变形的索洛模型',sub:'细分（三）：引入资本利用率',qid:'A1 ★★★',question:'假定生产函数为柯布道格拉斯形式：Y=(uK)^a L^(1−a)，其中 K、L 分别是资本存量水平和劳动力投入水平，u 是资本利用率，0<a<1。人口按照速率 n 增大，资本折旧率为 δ，储蓄率为 s。根据索洛模型回答下列问题。（1）求出稳态时的人均资本存量、资本-产出比率。（2）求出黄金律水平的储蓄率、资本-产出比率。（3）分析资本利用率改变对人均产出的即刻影响和随着时间的推移的动态影响。',answer:`**考察知识点**：索洛模型、资本利用率、稳态、黄金律。\n**思路**：求人均生产函数；稳态条件；黄金律；动态分析。\n**答案**：（1）k=[su^a/(δ+n)]^(1/(1−a))，K/Y=s/(δ+n)。（2）sgold=a，K/Y=a/(δ+n)。（3）资本利用率提高即刻增加人均产出，随后资本积累增加，最终达到新稳态。\n##**详解**\n（1）① 由题意可知，人均生产函数为：\n$$y = f(k) = Y/L = (uK)^a L^(1−a)/L = u^a k^a\n人均资本 k = K/L，两边对时间求导（链式法则或者增长率的性质）可得：\n$$Δk/k = ΔK/K − ΔL/L = (sY − δK)/K − n = s(uK)^a L^(1−a)/K − (δ + n)\n化简整理得 Δk = sf(k) − (δ + n)k。稳态时满足 Δk = 0，即：\n$$s u^a k^a = (δ + n)k\n得稳态时人均资本：\n$$k* = [s u^a/(δ + n)]^(1/(1−a))\n稳态时资本-产出比：\n$$K/Y = k/y = s/(δ + n)\n（2）人均消费水平 c = y − sy，其中 y = f(k)，稳态时满足 sy = (δ + n)k，故 c = y − (δ + n)k。由人均消费最大化的一阶条件可得 f′(k) = δ + n，即：\n$$a u^a k^(a−1) = δ + n\n解得黄金律水平的人均资本：\n$$k_gold = [a u^a/(δ + n)]^(1/(1−a))\n将 k_gold 代入稳态条件 sy = (δ + n)k 可以解得黄金律水平的储蓄率 s_gold = a。资本黄金律稳态时资本-产出比：\n$$K/Y = k/y = s_gold/(δ + n) = a/(δ + n)\n（3）假设资本利用率在 t₀ 时点上从 u₀ 上升至 u₁。然而在这一瞬间，资本利用率的改变并不会影响人均资本存量 k，所以资本利用率上升的即刻影响是人均产出 y 由 y = (u₀)^a·k^a 变为 y = (u₁)^a·k^a，即在 t₀ 时刻人均产出出现跳跃式上升。\n然而随着时间的推移，由于 u 上升提高了投资的回报，sy 曲线上移，人均资本存量会上升，最终重新均衡，之后人均资本存量为 k₁，重新达到稳态后的人均产出为 y = (u₁)^a·(k₁)^a，高于 t₀ 时刻的即刻水平。\n人均产出 y = u^a k^a 对 t 求导可得：\n$$dy/dt = a u^a k^(a−1)·Δk\n在 t₀ 之前，经济处于均衡状态下 Δk = 0，所以 dy/dt = 0；在资本利用率变化后，且经济重新达到均衡 t₁ 之后仍有 Δk = 0，所以 t₁ 之后 dy/dt = 0。然而在 t₀ 到 t₁ 之间 Δk > 0，所以 dy/dt > 0，且在此期间 d²y/dt² < 0，即人均产出先跳跃上升、再以递减的速度上升，最后在 t₁ 之后保持不变。综上我们可以画出如下图形：\n【此处有图示】\n**【提示】**柯布-道格拉斯生产函数，和曼昆教材第九版第 185 页第 8 题类似，只是那里 u 作用在 L 上。`},
{id:'h56',special:'宏观·变形的索洛模型',sub:'细分（四）：引入政府部门',qid:'A1 ★★★',question:'考虑一个标准的索洛增长模型：Y=(1−t)K^a(AL)^(1−a)，0<a<1，储蓄率为 s，人口增长率为0，技术进步率为 g，t 是政府对产出征收的税收。（1）假设政府在收税之后，不用于生产产出和进行投资，计算稳态时人均有效产出和人均有效资本。（2）如果政府减税，稳态的人均有效产出如何变化？简要解释你的结论。（3）求出黄金律稳态时的储蓄率水平，政府的税率对它有影响吗？（4）现在假设税收降低了人们研发的动力，技术进步率变为 g=b(1−t)^(1−a)，b>0。计算新的稳态人均有效产出。减税对稳态产出有什么影响？简要解释你的结论。（中国人民大学 2018 年考题）',answer:`**考察知识点**：索洛模型、税收、黄金律。\n**思路**：求稳态条件；分析减税影响；黄金律储蓄率；技术进步受税收影响。\n**答案**：（1）k=[s(1−t)/g]^(1/(1−a))，y=(1−t)^(1/(1−a))(s/g)^(a/(1−a))。（2）减税提高人均有效产出。（3）sgold=a，与税率无关。（4）y=(s/b)^(1/(1−a))(1−t)^((a²−a+1)/(1−a))；减税提高稳态产出。\n##**详解**\n（1）由题意可知，有效人均生产函数为：\n$$y = f(k) = Y/(AL) = (1 − t)K^a(AL)^(1−a)/(AL) = (1 − t)k^a\n人均有效资本 k = K/(AL)，两边对时间求导（链式法则或者增长率的性质）可得：\n$$Δk/k = ΔK/K − (ΔA/A + ΔL/L) = (sY − δK)/K − (g + n) = s(1 − t)K^a(AL)^(1−a)/K − (δ + g + n)\n根据题意，题目中没有出现折旧率（折旧率不用写，或者折旧率就是0，人口增长率为0），则：\n$$Δk = sf(k) − (δ + g + n)k = sf(k) − gk = 0\n以上求出来的是稳态时满足的方程（这一步必须求出来，以免直接写出来的式子是错的）。所以 s(1 − t)k^a = gk，得人均有效资本：\n$$k* = [s(1 − t)/g]^(1/(1−a))\n人均有效产出：\n$$y* = (1 − t)(k*)^a = (1 − t)^(1/(1−a))·(s/g)^(a/(1−a))\n（2）政府减税，即 t 值减小。又由于 1/(1 − α) > 0、α/(1 − α) > 0，由（1）可得：t 减小，f(k) 即人均有效产出增加。\n（3）有效人均消费水平 c = y − sy，其中 y = f(k)，稳态时满足 sy = gk，故 c = y − gk。\n**【提示】**注意这里的 y = (1 − t)k^α 代表的就是征税后的人均有效产出，所以在求有效人均消费水平时，y 前面不需要再乘 (1 − t)。\n由人均消费最大化的一阶条件可得 f′(k) = g，即：\n$$α(1 − t)k^(α−1) = g\n解得黄金律稳态的人均有效资本：\n$$k_gold = [α(1 − t)/g]^(1/(1−α))\n将其代入稳态条件 sy = gk 可以解得黄金律水平的储蓄率 s_gold = α。因此，黄金律稳态时的储蓄率为 K 的指数 α，与政府的税率 t 无关。\n（4）由（1）的稳态条件式 sf(k) − gk = 0，代入 g = b(1 − t)^(1−α) 可得：\n$$s(1 − t)k^α = b(1 − t)^(1−α)k\n解得 k = [(s/b)(1 − t)^α]^(1/(1−α))，从而：\n$$y = f(k) = (s/b)^(α/(1−α))·(1 − t)^((α² − α + 1)/(1−α))\n由于 (α² − α + 1)/(1 − α) = [(α − 1)² + α]/(1 − α) > 0，所以减税导致 t 减小，从而使得 f(k) 即人均有效产出增加。\n**【提示】**索洛模型中引入税收（政府部门）在南开及其他很多名校真题中都考过，南开应用经济学2023年和2025年的计算压轴题都是引入税收（政府部门）的索洛模型。此类题目的核心思路是搞清楚此时资本积累方程是怎样的，或者说是推导出投资 I 的表达式。`},
{id:'h57',special:'宏观·变形的索洛模型',sub:'细分（四）：引入政府部门',qid:'B1 ★★',question:'考虑封闭经济中的索洛增长模型：储蓄率 s 外生给定，0<s<1，即储蓄率始终为可支配收入的固定比率；人均生产函数 y=f(k)=Ak^a，0<a<1；资本折旧率 σ 为0；技术 A 的进步速率为 g=0，人口增长率为 n>0。（1）假如政府通过一项移民法令使得人口增长率从 n 下降到 nnew，0<nnew<n。假设这一政策改革瞬间完成，并一直持续下去。进一步假设该国在政策改革之前就已经处于稳定状态。请回答：这一政策改革对于稳态的人均资本存量 k、人均产出 y、工资率 w、资本价格 r 的影响？谁是受益者，劳动者还是资本所有者？（2）假设政府通过的移民法令并未改变人口增长率，但限制了高技术人员的移民门槛，这使得技术水平从 A 下降到 Anew，0<Anew<A。请绘图并回答：该国的人均资本存量 k 和人均产出 y 是如何随着时间而变化的？（3）假设我们把模型引入政府。政府消耗资源但不参与生产或资本积累。人均负担政府消费为 gt，唯一收入来源是对产出征税，税率为 τt。请推导出人均资本存量的积累方程，并求解稳态时人均资本存量。作图回答一项永久性的政府支出增加对于人均产出、人均资本存量、人均消费的影响。（4）假设生产函数为 yt=kt^α gt^β，α>0，β>0，0<α+β<1。请推导出人均资本存量的积累方程，并求解稳态时人均资本存量。定义最优税率为最大化人均资本存量的税率，求解这一最优税率水平。（北大 ccer 考题）',answer:`**考察知识点**：索洛模型、移民、政府支出、税收。\n**思路**：分析人口增长率变化、技术水平变化、政府支出和税收对稳态的影响。\n**答案**：略。\n##**详解**\n（1）当资本折旧率和技术进步速率均为零时，经济稳态条件为 sy = nk，即 sk^α = nk（人均生产函数 y = Ak^α）。\n人口增长率下降使稳态的人均资本存量 k 和人均产出 y 提高，其初始提高速度很快，然后逐步放缓，直至提高速度降为零，经济实现新的稳态。\n稳态的工资率是使劳动力市场供求均衡的工资率。人口增长率下降不影响劳动力需求的增长率，但降低了劳动力供给的增长率，故劳动力供不应求，稳态工资率 w 提高了。由于新的稳态下人均资本水平上升，资本的边际产出 MP_K 是下降的，当资本折旧率为零时，资本价格 r = MP_K 也下降了。\n综上，此项政策使劳动者受益。\n（2）经济稳态条件为 sy = nk。当技术水平发生变化时，稳态的人均资本也随之变化：由于 k* = (sA/n)^(1/(1−α))，当移民政策导致经济的技术水平由 A 下降到 A_new 时，稳态的人均资本与人均产出均下降。\n具体路径：t₁ 时刻 A 突然下降，此时 K、L 均未变，故 k 不变，但人均产出 y = Ak^α 在 t₁ 时刻向下跳跃；随后由于新稳态的 k 更低，Δk < 0，k 逐渐下降；t₂ 时刻 A 恢复原水平，y 在 t₂ 时刻向上跳跃，此后 k 逐渐回升，最终回到原稳态。即 k_t 表现为 t₁ 之后逐步下降、t₂ 之后逐步回升的 U 形（底部平滑），y_t 则在 t₁、t₂ 两个时点各出现一次跳跃，中间段随 k 一起下降。如下图（a）、图（b）分别代表 k_t、y_t 的变化路径。\n【此处有图示】\n（3）此时资本积累方程 ΔK_t = s(1 − τ_t)Y_t，人均资本 k_t = K_t/L_t。由增长率的性质可得：\n$$Δk_t/k_t = ΔK_t/K_t − ΔL_t/L_t = s(1 − τ_t)Y_t/K_t − n\n进一步整理可得人均资本存量的积累方程：\n$$Δk_t = (1 − τ_t)s y_t − n k_t\n其中 y_t = f(k_t) = A k_t^α。稳态时 Δk_t = 0，即 (1 − τ_t)sA k_t^α = n k_t，解得稳态时人均资本存量为：\n$$k* = [(1 − τ_t)sA/n]^(1/(1−α))\n因为 τ_t 的一次性提高相当于整个社会的储蓄率下降，储蓄曲线下移，稳态人均资本下降。k_t、y_t 的变化路径如下图（a）、图（b）所示，即在征税前处于稳态水平，税率提高后，k_t、y_t 在向新稳态过渡的过程中逐渐减少并达到新的稳态水平。\n【此处有图示】\n**【提示】**注意这里问的是人均产出 y_t = Ak_t^α 随时间 t 的变化路径，而不是征税后的人均可支配产出（收入），所以人均产出的变化在 t₁ 时刻没有突变。\n因为 c_t = y_t − i_t − g_t = y_t − s(1 − τ_t)y_t − τ_t y_t = (1 − s)(1 − τ_t)y_t，所以 c_t 的变化路径为：税率提高后，在 t₁ 时刻突然减少，并随着时间推移不断减少，直至达到新的稳态。\n**【提示】**南开2023年880（微宏观）真题也考到索洛模型中引入税收，只不过真题中考的是总量税，这里是比例税，大家学习时可以把两种情况放在一起，比较其稳态有何不同。\n（4）因为 τ_t·y_t = g_t，且 y_t = k_t^α g_t^β，所以：\n$$y_t = (k_t^α τ_t^β y_t^β)^(1/(1−β))，即 y_t = τ_t^(β/(1−β))·k_t^(α/(1−β))\n此时人均资本积累方程为 Δk_t = (1 − τ_t)s y_t − n k_t。当 Δk_t = 0 时，经济达到稳态：\n$$(1 − τ_t)s τ_t^(β/(1−β)) k_t^(α/(1−β)) = n k_t\n整理得稳态时人均资本：\n$$k_t* = [(1 − τ_t)s/n]^((1−β)/(1−α−β))·τ_t^(β/(1−α−β))\n为求最优税率，对上式取对数：\n$$ln k_t* = [(1−β)/(1−α−β)]·[ln(1 − τ_t) + ln s + (β/(1−β))ln τ_t − ln n]\n对 τ_t 求导并令其为零：\n$$−1/(1 − τ_t) + (β/(1−β))·(1/τ_t) = 0\n即 β(1 − τ_t) = (1 − β)τ_t，解得最优税率 τ_t = β。即最大化稳态人均资本的税率恰等于政府支出的产出弹性 β。\n**【校注】**原文稳态人均资本中 τ 的指数写作 (1−β)/(1−α−β)，按 (1−τ)sτ^(β/(1−β))k^(α/(1−β)) = nk 解出应为 β/(1−α−β)；原文最优税率一阶导表达式亦有多处指数错误，此处改用对数求导，结论 τ* = β 与原文一致。`},
{id:'h58',special:'宏观·变形的索洛模型',sub:'细分（五）：特殊产出函数',qid:'B1 ★',question:'有一个经济增长模型：Y=A{a(bK)^θ+(1−a)[(1−b)L]^θ}^(1/θ)，其中 A 为常数。该经济的折旧率为 δ，劳动增长率为 n，储蓄率为 s，资本积累方程为：K̇=sY−δK。（1）令人均资本 k=K/L，人均产出 y=Y/L，求 y(k)；（2）s 满足什么条件时，人均资本可以持续增长？（3）在（2）的条件下，求人均资本增长率？（4）与传统索洛模型的生产函数有什么联系与区别？（北大软微 2022 年考题）',answer:`**考察知识点**：CES生产函数、内生增长、索洛模型。\n**思路**：求人均产出函数；分析持续增长条件；求增长率；比较与传统索洛模型。\n**答案**：（1）y=A{a(bk)^θ+(1−a)[(1−b)L]^θ}^(1/θ)。（2）s>(δ+n)/(Aa^(1/θ)b)。（3）k̇/k=sAa^(1/θ)b−(δ+n)。（4）当 θ→0 时变为C-D函数；本题具有内生增长特征。\n##**详解**\n（1）人均产出：\n$$y = Y/L = A{a(bK)^θ + (1 − a)[(1 − b)L]^θ}^(1/θ)/L = A{a(bk)^θ + (1 − a)(1 − b)^θ}^(1/θ)\n（2）人均资本 k = K/L，由增长率的性质可得：\n$$Δk/k = ΔK/K − ΔL/L = (sY − δK)/K − n = s(Y/K) − (δ + n)\n代入生产函数可得：\n$$Δk/k = sA{a b^θ + (1 − a)[(1 − b)/k]^θ}^(1/θ) − (δ + n)\n如果人均资本 k 可以持续增长，那么 k 会趋于无穷大，并且增长率是正的，即 Δk/k > 0。当 k → ∞ 时：\n$$lim(k→∞) {sA[a b^θ + (1 − a)[(1 − b)/k]^θ]^(1/θ) − (δ + n)} = sA a^(1/θ) b − (δ + n)\n因此 k 持续增长需要满足：\n$$sA a^(1/θ) b − (δ + n) > 0，即 s > (δ + n)/(A a^(1/θ) b)\n（3）由（2）可得，在（2）的条件下，人均资本增长率为：\n$$Δk/k = sA a^(1/θ) b − (δ + n)\n（4）该生产函数是CES生产函数。与传统索洛模型的生产函数（柯布-道格拉斯生产函数）的联系是：当 θ → 0 时，本题的生产函数就变为柯布-道格拉斯生产函数 Y = A(bK)^a[(1 − b)L]^(1−a)。\n区别是：传统的索洛模型的人均资本增长率为假定外生的技术进步率 g，本题的人均资本具有内生增长的特点，即使没有考虑技术进步率 g，仍然具有人均资本增长率，即经济增长具有内生性。\n**【提示】**线性生产函数、C-D生产函数和固定投入比例生产函数都是CES生产函数的特例（效用函数同理）：设CES生产函数为 f(x₁,x₂) = (a₁x₁^ρ + a₂x₂^ρ)^(1/ρ)，且 a₁ + a₂ = 1。① 当 ρ → 0 时，CES生产函数变为柯布-道格拉斯生产函数；② 当 ρ = 1 时，f(x₁,x₂) = a₁x₁ + a₂x₂，显然为线性生产函数；③ 当 ρ → −∞ 时，求极限可得 f(x₁,x₂) = min(x₁,x₂)，此时为完全互补生产函数。`},
{id:'h59',special:'宏观·离散时间索洛',qid:'A1 ★★★',question:'考虑离散时间的索罗模型。假定某国宏观生产函数为 Yt=F(Kt,Lt)=AKt^0.5 Lt^0.5。其中 t 代表时期，Yt 代表产出水平，A 代表技术水平，Kt 代表资本总量，Lt 代表劳动总量，并用 yt 和 kt 分别表示人均产出和人均资本。如果资本的变动方程为 Kt+1=It+(1−d)Kt，其中 d 为资本折旧率，It 为固定资产投资。假设该国的人口均为劳动力且零增长。用 a 表示边际消费倾向，不考虑政府部门。（1）请推导人均生产函数。（2）请推导稳态人均收入、人均资本和人均消费的具体表达式。（3）假若该国技术水平为2，边际消费倾向为0.9，d 为5%。请计算该国处于稳态时人均收入水平、人均资本水平和人均消费水平。',answer:`**考察知识点**：离散时间索洛模型、稳态。\n**思路**：推导人均生产函数；求稳态条件；代入数值。\n**答案**：（1）yt=Akt^0.5。（2）k*=[(1−a)A/d]²，y*=(1−a)A²/d，c*=a(1−a)A²/d。（3）k*=16，y*=8，c*=7.2。\n##**详解**\n（1）由于总产出函数为 Y_t = A K_t^0.5 L_t^0.5，人均资本 k_t = K_t/L_t，所以人均产出：\n$$y_t = Y_t/L_t = A k_t^0.5\n（2）由于不存在政府部门，由国民收入核算恒等式 Y_t = C_t + I_t 可得：\n$$I_t = Y_t − C_t = Y_t − aY_t = (1 − a)Y_t\n所以资本积累方程为：\n$$K_(t+1) = I_t + (1 − d)K_t = (1 − a)Y_t + (1 − d)K_t\n上式左右同时除以 L_(t+1) 可得：\n$$K_(t+1)/L_(t+1) = (1 − a)Y_t/L_(t+1) + (1 − d)K_t/L_(t+1)\n由于劳动力数量固定，所以 L_(t+1) = L_t，上式化简为 k_(t+1) = (1 − a)Y_t/L_t + (1 − d)K_t/L_t，进一步整理可得：\n$$k_(t+1) = (1 − a)A k_t^0.5 + (1 − d)k_t\n稳态时满足 k_(t+1) = k_t = k*，即 d k* = (1 − a)A(k*)^0.5，所以稳态的人均资本：\n$$k* = [(1 − a)A/d]²\n人均收入：\n$$y* = A(k*)^0.5 = (1 − a)A²/d\n人均消费 c* = a y* = a(1 − a)A²/d。\n（3）代入 A = 2，a = 0.9，d = 5%，解得：稳态的人均资本 k* = (0.1×2/0.05)² = 16，人均收入 y* = 8，人均消费 c* = 0.9×8 = 7.2。`},
{id:'h60',special:'宏观·离散时间索洛',qid:'A2 ★★★',question:'设 Yt=F(Kt,AtLt)，其中 F(·) 具有不变的规模报酬，并且密集形式的生产函数满足稻田条件。也设 At+1=(1+g)At，Lt+1=(1+n)Lt，以及 Kt+1=Kt+sYt−δKt。（1）求出作为 kt 函数的 kt+1 的表达式。（2）画出作为 kt 函数的 kt+1。经济处在均衡增长路径上吗？如果 k 的初始水平不同于其在均衡增长路径上的值，经济会收敛于均衡增长路径吗？（3）求出作为 k 的均衡增长路径值函数的单位有效劳动的消费的表达式，当 k 最大化均衡增长路径上单位有效劳动的消费时，资本的边际产品 f′(k) 是什么？假设生产函数是柯布-道格拉斯式的：（4）作为 kt 函数的 kt+1 是什么？（5）k 在均衡增长路径上的值 k* 是什么？（6）在 kt=k* 附近线性化（4）中的表达式，并且求出 k 收敛于 k* 的速率。',answer:`**考察知识点**：离散时间索洛模型、收敛性、黄金律。\n**思路**：推导动态方程；分析收敛性；求黄金律；线性化。\n**答案**：略。\n##**详解**\n（1）第二期的资本存量等于第一期的资本存量加上当期的投资并且减去当期的折旧，即 K_(t+1) = K_t + sY_t − δK_t。将上式两端同时除以 A_(t+1)L_(t+1)：\n$$K_(t+1)/(A_(t+1)L_(t+1)) = [(1 − δ)K_t + sY_t]/[(1 + n)(1 + g)A_tL_t] = [(1 − δ)k_t + sf(k_t)]/[(1 + n)(1 + g)]\n上式简化为：\n$$k_(t+1) = [(1 − δ)/((1 + n)(1 + g))]k_t + [s/((1 + n)(1 + g))]f(k_t)\n该式即为 k_t 的函数 k_(t+1) 的表达式。\n（2）下面检验该函数是否满足收敛的条件。分别求 k_(t+1) 关于 k_t 的一阶和二阶导数：\n$$∂k_(t+1)/∂k_t = (1 − δ)/[(1 + n)(1 + g)] + [s/((1 + n)(1 + g))]f′(k_t) > 0\n$$∂²k_(t+1)/∂k_t² = [s/((1 + n)(1 + g))]f″(k_t) < 0\n检验稻田条件：\n$$lim(k→0) ∂k_(t+1)/∂k_t = ∞\n$$lim(k→∞) ∂k_(t+1)/∂k_t = (1 − δ)/[(1 + n)(1 + g)] < 1\n该函数的斜率小于1，则它必然与45°线相交。由上可见，该函数定义良好且与45°线只相交一次。\n注意，k = 0 并不是一个稳定点，任何大于0的资本存量都会收敛于 k*。例如，设某点小于 k*，由于 k_(t+1) 大于 k_t，因此 k 值会不断地变大，最终收敛于 k* 点；相反，设某一点大于 k*，由于 k_(t+1) 小于 k_t，因此 k 值会不断地变小，最终收敛于 k* 点。在 k* 点，存在一条均衡增长路径。\n【此处有图示】\n（3）在均衡增长路径上，有 k_(t+1) = k_t ≡ k*，将其代入状态方程可得：\n$$k* = [(1 − δ)/((1 + n)(1 + g))]k* + [s/((1 + n)(1 + g))]f(k*)\n化简为 (n + g + ng + δ)k* = sf(k*)。由该式求储蓄率 s，可得：\n$$s = (n + g + ng + δ)k*/f(k*)\n在均衡增长路径上每单位有效劳动的消费为 c* = (1 − s)f(k*)，代入上式可得：\n$$c* = f(k*) − (n + g + ng + δ)k*\n为求得均衡增长路径上每单位有效劳动资本的边际产品，将 c* 关于 k* 求导：\n$$∂c*/∂k* = f′(k*) − (n + g + ng + δ) = 0\n则黄金律资本存量由下式隐性决定：f′(k_GR) = n + g + ng + δ。\n（4）将柯布-道格拉斯生产函数 f(k_t) = k_t^α 代入状态方程，得：\n$$k_(t+1) = [(1 − δ)/((1 + n)(1 + g))]k_t + [s/((1 + n)(1 + g))]k_t^α\n（5）在均衡增长路径上，有 k_(t+1) = k_t ≡ k*，代入上式可得：\n$$k* = [(1 − δ)/((1 + n)(1 + g))]k* + [s/((1 + n)(1 + g))](k*)^α\n化简得 (n + g + ng + δ)k* = s(k*)^α，由此推出：\n$$k* = [s/(n + g + ng + δ)]^(1/(1−α))\n（6）对状态方程两边求导，可得：\n$$dk_(t+1)/dk_t |_(k_t=k*) = (1 − δ)/[(1 + n)(1 + g)] + [αs/((1 + n)(1 + g))](k*)^(α−1)\n将 k* 的表达式代入，并利用 (n + g + ng + δ) = (1 + n)(1 + g) − (1 − δ)，可将上式化简为：\n$$dk_(t+1)/dk_t |_(k_t=k*) = α + (1 − δ)(1 − α)/[(1 + n)(1 + g)]\n对状态方程在 k = k* 处一阶泰勒展开，可得：\n$$k_(t+1) ≅ k* + [α + (1 − δ)(1 − α)/((1 + n)(1 + g))](k_t − k*)\n即：\n$$k_t − k* ≅ [α + (1 − δ)(1 − α)/((1 + n)(1 + g))]^t·(k_0 − k*)\n因此，经济向均衡增长路径移动的速度为：\n$$1 − [α + (1 − δ)(1 − α)/((1 + n)(1 + g))] = (1 − α)(n + g + ng + δ)/[(1 + n)(1 + g)]\n**【提示1】**注意离散时间的索洛模型中每个变量在以时间 t 为横轴的坐标系中为一个个离散的点，所以此时变量不能对时间 t 求导，也不可以用增长率的性质。\n**【提示2】**离散时间索洛模型和连续时间索洛模型的比较：① 资本积累方程：离散时间下 K_(t+1) = K_t + sY_t − δK_t，整理可得 K_(t+1) − K_t = ΔK = sY_t − δK_t，本质上和连续时间索洛模型一样；② 稳态条件：离散时间下 k_(t+1) = k_t = k*，整理可得 k_(t+1) − k_t = Δk = 0，本质上和连续时间索洛模型相同。`},
{id:'h60b',special:'宏观·离散时间索洛',qid:'B1 ★★',question:'考虑离散时间的索洛模型，经济的生产函数为 Y_t=zN_t^(1−α)K_t^α，α∈(0,1)，其中 Y_t、K_t 和 N_t 分别为 t 期的产出、资本存量和劳动人口，z 是反映技术水平的参数，劳动人口 N_(t+1)=(n+1)N_t，n≥0，资本折旧率为 δ∈(0,1)，家庭以收入的既定比例 (1−s) 进行消费，s 是储蓄率。求：（1）稳态人均产出、人均产出增长率；（2）储蓄率上升对长期中人均产出及其增长率的影响；（3）若 Y_t=zK_t，求人均产出增长率，此时经济是否存在稳态？储蓄率上升如何影响人均产出增长率？',answer:`**考察知识点**：离散时间索洛模型、稳态、储蓄率的水平效应与增长效应、无稳态的持续增长。\n**思路**：令 k_t=K_t/N_t 写出人均资本的一步差分方程，令 k_(t+1)=k_t 求稳态；第（3）问 Y=zK 时人均产出增长率为常数，再讨论 sz 与 δ+n 的大小。\n**答案**：（1）k*=[sz/(n+δ)]^(1/(1−α))，y*=z^(1/(1−α))·[s/(n+δ)]^(α/(1−α))，人均产出增长率 0。（2）储蓄率上升提高长期人均产出水平，但不影响其增长率。（3）增长率为 [sz−(δ+n)]/(1+n)；sz>δ+n 时经济不存在非零稳态，储蓄率上升提高人均产出增长率。\n##**详解**\n（1）令人均资本 k_t = K_t/N_t，则人均产出为：\n$$y_t = Y_t/N_t = zN_t^(1−α)K_t^α/N_t = zk_t^α\n由题意，资本积累方程为：\n$$K_(t+1) = K_t + sY_t − δK_t\n两边同除以 N_(t+1) = (1 + n)N_t，得人均资本的一步差分方程：\n$$k_(t+1) = [(1 − δ)k_t + s·zk_t^α]/(1 + n)\n稳态满足 k_(t+1) = k_t = k*，代入上式：\n$$(1 + n)k* = (1 − δ)k* + sz(k*)^α\n即 (n + δ)k* = sz(k*)^α，解得稳态人均资本：\n$$k* = [sz/(n + δ)]^(1/(1−α))\n代回生产函数得稳态人均产出：\n$$y* = z(k*)^α = z^(1/(1−α))·[s/(n + δ)]^(α/(1−α))\n由于 z、s、n、δ 均为外生参数，稳态时人均产出不再变化：\n$$g_y = 0\n（2）由（1）知 y* = z^(1/(1−α))·[s/(n+δ)]^(α/(1−α))，其中 α/(1−α) > 0，因此：\n$$dy*/ds > 0\n所以储蓄率上升会提高长期中的人均产出水平，这是水平效应；但稳态时人均产出增长率为零，且该增长率只由外生参数决定，故储蓄率上升并不影响长期中的人均产出增长率，即没有增长效应。\n（3）若 Y_t = zK_t，则人均产出为：\n$$y_t = Y_t/N_t = zK_t/N_t = zk_t\n人均产出增长率为：\n$$(y_(t+1) − y_t)/y_t = y_(t+1)/y_t − 1 = k_(t+1)/k_t − 1 = (K_(t+1)/K_t)·(N_t/N_(t+1)) − 1\n代入 K_(t+1) = K_t + sY_t − δK_t 与 N_(t+1) = (1 + n)N_t：\n$$= [(K_t + szK_t − δK_t)/K_t]·[1/(1 + n)] − 1 = [sz − (δ + n)]/(1 + n)\n可见此时人均产出增长率是一个与 t 无关的常数。若 sz > δ + n，该增长率始终大于零，人均产出持续增长；而此时稳态条件 (1 + n)k = (1 − δ + sz)k 只有零解（非零解要求 sz = δ + n），故经济不存在非零稳态。并且储蓄率 s 上升会提高这一增长率，即此时储蓄率具有增长效应。`},
{id:'h61',special:'宏观·新经济增长模型',qid:'B1 ★',question:'有的知识积累不是有意努力的结果，而是传统经济活动的副产品，这种知识积累被称为干中学或干中学模型问题。假定生产函数为：Y(t)=K(t)^a[A(t)L(t)]^(1−a)，L 为常数且等于1，K̇(t)=sY(t)，且知识积累作为产品生产的一个副产品出现：Ȧ(t)=BY(t)。（1）用 Ȧ(t)、K(t) 和各参数表示 gA(t) 和 gK(t)，其中，gA(t) 和 gK(t) 分别为 A(t) 和 K(t) 的增长率。（2）在 (gA,gK) 空间中画出 ġA=0 和 ġK=0 曲线。（3）该经济是否收敛于平衡增长路径？如果是这样，平衡增长路径上 K、A 和 Y 的增长率是多少？（4）s 的增加如何影响长期增长？',answer:`**考察知识点**：干中学模型、内生增长、平衡增长路径。\n**思路**：求增长率；画相位图；分析收敛性；求长期增长率。\n**答案**：（1）gK=sK^(a−1)A^(1−a)，gA=BK^aA^(−a)。（2）图略。（3）收敛；平衡增长路径上 gK=gA=g*=s^aB^(1−a)。（4）s 增加提高长期增长率。\n##**详解**\n（1）相关等式为：Y(t) = K(t)^a A(t)^(1−a)（L = 1）；ΔK(t) = sY(t)；ΔA(t) = BY(t)。\n将生产函数代入资本积累方程可得 ΔK(t) = sK(t)^a A(t)^(1−a)，两边同时除以 K(t) 得到资本增长率：\n$$g_K(t) = ΔK(t)/K(t) = sK(t)^(a−1)A(t)^(1−a)\n将生产函数代入知识积累方程可得 ΔA(t) = BK(t)^a A(t)^(1−a)，两边同时除以 A(t) 得到知识增长率：\n$$g_A(t) = ΔA(t)/A(t) = BK(t)^a A(t)^(−a)\n（2）资本：对 g_K 的表达式取对数后对时间求导，求出资本增长率的增长率：\n$$ġ_K(t)/g_K(t) = (a − 1)ΔK(t)/K(t) + (1 − a)ΔA(t)/A(t) = (a − 1)g_K(t) + (1 − a)g_A(t)\n可以看出，当 (a − 1)g_K + (1 − a)g_A = 0 即 g_K = g_A 时，g_K 将是常数。因此，在 (g_A, g_K) 空间中，ġ_K = 0 曲线是45°线。当 g_K < g_A 时 g_K 将上升，因此 g_K 在 ġ_K = 0 曲线下方是上升的；当 g_K > g_A 时 g_K 将下降，因此 g_K 在 ġ_K = 0 曲线上方是下降的。\n知识：对 g_A 的表达式取对数后对时间求导：\n$$ġ_A(t)/g_A(t) = aΔK(t)/K(t) − aΔA(t)/A(t) = a g_K(t) − a g_A(t)\n可以看出，当 a g_K − a g_A = 0 即 g_K = g_A 时，g_A 将是常数。因此，在 (g_A, g_K) 空间中，ġ_A = 0 曲线也是45°线。当 g_K > g_A 时 g_A 将上升，因此 g_A 在 ġ_A = 0 曲线上方是上升的；当 g_K < g_A 时 g_A 将下降，因此 g_A 在 ġ_A = 0 曲线下方是下降的。\n【此处有图示】\n（3）把 ġ_K = 0 和 ġ_A = 0 曲线放在一张图中，虽然能够看出来经济最终达到 g_K = g_A 的形态且它们是常数，但是仍旧没有足够的信息来决定平衡增长路径的唯一性。\n把 g_K、g_A 的表达式重新写为：\n$$g_K(t) = sK(t)^(a−1)A(t)^(1−a) = s[A(t)/K(t)]^(1−a)\n$$g_A(t) = BK(t)^a A(t)^(−a) = B[A(t)/K(t)]^(−a)\n在任何时刻，资本和知识的增长率都只依赖于 t 时刻知识对资本的比率。由 g_A 的表达式可得 [A(t)/K(t)]^a = B/g_A(t)，化简可得：\n$$A(t)/K(t) = [B/g_A(t)]^(1/a)\n代入 g_K 的表达式可得：\n$$g_K(t) = s[B/g_A(t)]^((1−a)/a)\n如下图所示，满足该式的 g_A 和 g_K 落在一条曲线上（记为AA曲线）。无论 A/K 的初始比率为何值，经济都在该曲线上的某处开始，然后就沿着曲线向 E 点运动。因此经济确实收敛于平衡增长路径上的点 E。\n【此处有图示】\n为了计算平衡增长路径上资本和知识的增长率，注意在 E 点有 g_K = g_A。令 g* 表示这一共同的增长率，则由上式可得：\n$$g* = s[B/g*]^((1−a)/a)\n解得：\n$$g* = s^a B^(1−a)\n对生产函数取对数后对时间求导可得 ΔY/Y = a g_K + (1 − a)g_A，在平衡增长路径上 g_K = g_A = g*，因此：\n$$ΔY/Y = a g* + (1 − a)g* = g* = s^a B^(1−a)\n综上，在平衡增长路径上，资本、知识和产量都以 g* 的比率增长。\n（4）显然，由 g* = s^a B^(1−a) 可知，储蓄率 s 的提高会提高 g*，因此提高了长期资本、知识和产量的增长率——这是与新古典增长模型的重要区别（后者 s 只有水平效应）。\n运动过程如下图所示：当 s 改变时，ġ_K = 0 和 ġ_A = 0 曲线都不会移动；由 g_K = s[A/K]^(1−a) 可知，储蓄率 s 的上升使 g_K 向上跳跃。于是，在 s 上升的时刻，经济从平衡增长路径上的 E 点移到 F 点，然后沿着 AA 曲线向下移动，直到达到新的平衡增长路径 E_new 点。\n【此处有图示】`},
{id:'h62',special:'宏观·新经济增长模型',qid:'B2 ★',question:'考虑下面这个具有实物资本和人力资本的模型：Y(t)=[(1−aK)K(t)]^a[(1−aH)H(t)]^(1−a)，K̇(t)=sY(t)−δK K(t)，Ḣ(t)=B[aKK(t)]^γ[aHH(t)]^φ[A(t)L(t)]^(1−γ−φ)−δH H(t)，L̇(t)=nL(t)，Ȧ(t)=gA(t)。（1）定义 k=K/(AL)，h=H/(AL)，请推导 k̇ 和 ḣ 的方程。（2）求使得 k̇=0 的由 ḣ 和 k̇ 的组合构成的方程，在 (h,k) 空间中画出它。对 ḣ=0 进行同样的处理。（3）该经济是否具有一条均衡增长路径？如果是，它是否是唯一的？它是否稳定？均衡增长路径上人均实物资本、人均人力资本和人均产出增长率是多少？（4）假设经济最初处于均衡增长路径上，且 s 有一个持久性的增加。这一变动如何影响人均产出随时间变化的路径？',answer:`**考察知识点**：实物资本与人力资本、内生增长、平衡增长路径。\n**思路**：推导动态方程；画相位图；分析稳态和收敛性；储蓄率变化的影响。\n**答案**：略。\n##**详解**\n（1）对 k(t) = K(t)/(A(t)L(t)) 两边对 t 求导，可以得到：\n$$Δk = [ΔK·AL − K·(ΔA·L + A·ΔL)]/(AL)²\n进一步整理可得：\n$$Δk = ΔK/(AL) − [ΔA/A + ΔL/L]k\n将资本积累方程 ΔK = sY − δ_K K 以及不变的知识和劳动增长率代入上式，可得：\n$$Δk = (sY − δ_K K)/(AL) − (g + n)k\n将生产函数 Y = [(1 − a_K)K]^a[(1 − a_H)H]^(1−a) 代入得：\n$$Δk = s[(1 − a_K)K/(AL)]^a[(1 − a_H)H/(AL)]^(1−a) − (n + g + δ_K)k\n定义 c_K ≡ s(1 − a_K)^a(1 − a_H)^(1−a)，以及 h = H/(AL)，所以上式可以写为：\n$$Δk = c_K k^a h^(1−a) − (n + g + δ_K)k\n同理，对 h(t) = H(t)/(A(t)L(t)) 两边对 t 求导并化简得：\n$$Δh = ΔH/(AL) − [ΔA/A + ΔL/L]h\n将人力资本积累方程 ΔH = B(a_K K)^γ(a_H H)^φ(AL)^(1−γ−φ) − δ_H H 代入，可得：\n$$Δh = B[a_K K/(AL)]^γ[a_H H/(AL)]^φ − (n + g + δ_H)h\n定义 c_H ≡ B a_K^γ a_H^φ，可将上式写为：\n$$Δh = c_H k^γ h^φ − (n + g + δ_H)h\n（2）令 Δk = 0，求 k 作为 h 的函数：\n$$c_K k^a h^(1−a) = (n + g + δ_K)k ⟹ k = [c_K/(n + g + δ_K)]^(1/(1−a))·h\n即 Δk = 0 是一条过原点的射线，斜率为 [c_K/(n + g + δ_K)]^(1/(1−a)) > 0。由 Δk 的表达式可知，Δk 随 h 递增，因此在该线右边 Δk > 0、k 上升；在该线左边 Δk < 0、k 下降。\n令 Δh = 0，求 k 作为 h 的函数：\n$$c_H k^γ h^φ = (n + g + δ_H)h ⟹ k = [c_H/(n + g + δ_H)]^(−1/γ)·h^((1−φ)/γ)\n对其关于 h 求一阶、二阶导数：\n$$dk/dh = [(1 − φ)/γ]·[c_H/(n + g + δ_H)]^(−1/γ)·h^((1−φ)/γ − 1) > 0\n$$d²k/dh² = [(1 − φ)/γ]·[(1 − φ − γ)/γ]·[c_H/(n + g + δ_H)]^(−1/γ)·h^((1−φ)/γ − 2) > 0\n即 Δh = 0 曲线向上倾斜且凸向下方（二阶导为正），如下图所示。由 Δh 的表达式可知 Δh 是 k 的增函数，因此在该曲线上方 Δh > 0、h 上升；在曲线下方 Δh < 0、h 下降。\n【此处有图示】\n（3）将 Δk = 0 和 Δh = 0 放在一起，可以发现经济将收敛于均衡增长路径上的 E 点。这一稳定的均衡增长路径点是唯一的（忽略掉原点 k = h = 0 的情况）。\n由图形可知，每单位有效劳动的物质资本 k = K/(AL) 在均衡增长路径上不变，因此人均物质资本 K/L = k·A 必须与知识保持同样的增长率 g；同理，每单位有效劳动的人力资本 h = H/(AL) 不变，因此人均人力资本 H/L = h·A 也以增长率 g 增长。\n对总生产函数除以 L 得到人均产出：\n$$Y/L = [(1 − a_K)K/L]^a[(1 − a_H)H/L]^(1−a)\n因为 K/L 和 H/L 在均衡增长路径上都以 g 的速度增长，生产函数规模报酬不变，所以人均产出的增长率也是 g。\n（4）由（2）可知，Δk = 0 的斜率是 [c_K/(n + g + δ_K)]^(1/(1−a))，其中 c_K = s(1 − a_K)^a(1 − a_H)^(1−a)。因此，s 的一个持久性增加使得 Δk = 0 更加陡峭。因为 s 没有出现在 Δh = 0 的表达式中，因此 Δh = 0 保持不变。经济将从旧均衡增长路径上的 E 点移动到新均衡增长路径上的 E′ 点。\n在储蓄率上升之前，人均产出都以 g 的速度增长。在从 E 到 E′ 的过渡过程中，h 和 k 都在增长，因此人均人力资本和人均物质资本在过渡时期的增长率都大于 g，这意味着人均产出的增长率也大于 g。\n一旦经济到达新的均衡增长路径，h 和 k 再次保持不变，因此人均人力资本和人均物质资本的增长率再次等于 g，从而人均产出再次以 g 的速度增长。\n因此，s 的一个持久性增加对于人均产出仅有水平效应而没有持久的增长效应。\n【此处有图示】\n**【提示】**在新增长理论中，很多情况下都是有多个变量随时间 t 不断积累（不像基本索洛模型中只有 k 随时间积累），这个时候的稳态就要求多个变量同时实现自身变化量等于零（或同时实现变化率为常数，即变化率的变化量为零）。此类题目的分析思路与本题大同小异，要掌握这种分析的方法。`},
{id:'h63',special:'宏观·周期理论抽象函数',sub:'细分（一）：基本的抽象 IS-LM 模型',qid:'A1 ★★',question:'考虑下述IS-LM模型。假设产品市场和货币市场的均衡条件分析如下：Y=C(Y−T)+I(i−π)+G，M/P=m(i,Y)。其中，Y、C、I、G、T、M、P、i、π 分别表示总产出、总消费、总投资、政府购买、税收、货币供给、总价格水平、名义利率和通货膨胀率。消费函数满足：0<C′(·)<1；投资函数满足：I′(·)<0；货币需求函数满足：mi<0，mY>0。（1）假定政府税收采取固定税的形式，通货膨胀率给定，求政府购买乘数、税收乘数、平衡预算乘数，并判断此时平衡预算乘数是小于1、等于1还是大于1。（2）在通货膨胀率给定的情况下，政府购买和税收的等量增加如何影响总需求曲线的位置？（3）现假定税收采取比例税的形式：T=tY，其中 0<t<1 表示边际税率。试分析在通货膨胀率给定的情况下，边际税率对于财政政策（政府购买变动）和货币政策影响的效果。',answer:`**考察知识点**：IS-LM、乘数、比例税、政策效果。\n**思路**：全微分求乘数；比较固定税和比例税下政策效果。\n**答案**：（1）政府购买乘数 1/[1−C′+I′(mY/mi)]；税收乘数 −C′/[1−C′+I′(mY/mi)]；平衡预算乘数小于1。（2）总需求曲线向右移动，但移动距离小于政府购买增加量。（3）比例税下财政政策效果减弱，货币政策效果也减弱。\n##**详解**\n（1）IS、LM方程两侧同时对 T 求偏导得：\n$$IS: ∂Y/∂T = C′·∂(Y − T)/∂T + I′·∂(i − π)/∂T\n$$LM: 0 = m_i·∂i/∂T + m_Y·∂Y/∂T\n化简可得：\n$$IS: ∂Y/∂T = C′(∂Y/∂T − 1) + I′·∂i/∂T\n$$LM: 0 = m_i·∂i/∂T + m_Y·∂Y/∂T\n联立可得税收乘数：\n$$∂Y/∂T = −C′/[1 − C′ + I′(m_Y/m_i)]\nIS、LM方程两侧同时对 G 求偏导，同理化简可得：\n$$IS: ∂Y/∂G = C′·∂Y/∂G + I′·∂i/∂G + 1\n$$LM: 0 = m_i·∂i/∂G + m_Y·∂Y/∂G\n联立可得政府购买乘数：\n$$∂Y/∂G = 1/[1 − C′ + I′(m_Y/m_i)]\n平衡预算乘数为：\n$$∂Y/∂G + ∂Y/∂T = (1 − C′)/[1 − C′ + I′(m_Y/m_i)] < 1\n故此时平衡预算乘数小于1。\n（2）政府购买和税收等量增加时，总需求曲线向右移动，但其向右平移的距离要小于政府购买增加的量（因为税收乘数绝对值小于政府购买乘数）。\n（3）① 首先考虑财政政策效果。比例税下，IS曲线和LM曲线表达式分别为：\n$$IS: Y = C(Y − tY) + I(i − π) + G\n$$LM: M/P = m(i,Y)\nIS、LM方程两侧同时对 G 求偏导并化简可得：\n$$IS: ∂Y/∂G = C′(1 − t)·∂Y/∂G + I′·∂i/∂G + 1\n$$LM: 0 = m_i·∂i/∂G + m_Y·∂Y/∂G\n联立可得政府购买乘数：\n$$∂Y/∂G = 1/[1 − C′(1 − t) + I′(m_Y/m_i)]\n与固定税下的 1/[1 − C′ + I′(m_Y/m_i)] 相比，比例税下分母更大、乘数更小，因此比例税下财政政策效果减弱。\n② 下面考虑货币政策效果。固定税下：Y = a + b(Y − T) + c − dr + G，解得 Y = (a + c + G − bT − dr)/(1 − b)；比例税下：Y = a + b(Y − tY) + c − dr + G，解得 Y = (a + c + G − dr)/[1 − b(1 − t)]。由于 t < 1，故 1 − b(1 − t) > 1 − b，比例税下IS曲线更加陡峭。\n当实施扩张性货币政策时，LM曲线右移，相较于固定税，比例税下产出增加量降低，货币政策效果减弱。\n**【提示1】**关于IS-LM的计算题主要有两类：① 具体函数计算题，题目通常给出具体参数值，根据产品市场和货币市场的均衡条件求解均衡产出和利率，此外还会求挤出效应、挤出的投资、为达到某一目的的政府购买/货币供给变动量、总需求曲线等，见宏观计算专项二；② 抽象函数计算题，思路很简单，总结起来就是"IS、LM方程左右全微分，然后联立求解"，求解时需要足够细心，不要漏掉参数或联立出现错误。\n**【提示2】**IS曲线越平坦，货币政策效果越好；LM曲线越平坦，财政政策效果越好。这一结论无论何时都成立，可以自行用带有挤出效应的乘数表达式验证。如果用IS曲线的斜率来分析财政政策效果，其前提是IS曲线在两种情况下水平移动的距离相同；如果用LM曲线的斜率来分析货币政策效果，其前提是LM曲线在两种情况下水平移动的距离相同。`},
{id:'h63b',special:'宏观·周期理论抽象函数',sub:'细分（一）：基本的抽象 IS-LM 模型',qid:'B1 ★★',question:'假设经济体的 IS 曲线方程为 Y=C(Y−T)+I(r,Y)+G，LM 曲线方程为 M/P=L(r,Y)，同时假设 C′(Y−T)∈(0,1)，∂I/∂r<0，∂I/∂Y∈(0,1)，∂L/∂r<0，∂L/∂Y>0，C′(Y−T)+∂I/∂Y<1，其中 Y、C、T、I、r、G、M/P、L(r,Y) 分别表示总需求、消费、税收、投资、利率、政府支出、实际货币供给和实际货币需求。若实施扩张的政府支出政策，即 dG>0，求均衡下投资水平变大（即 dI>0）的边界条件。',answer:`**考察知识点**：抽象 IS-LM 模型、全微分、财政政策的投资效应与挤出效应。\n**思路**：对 IS、LM 求全微分，解出 dY 与 dr，再由 dI=(∂I/∂r)dr+(∂I/∂Y)dY 判断 dI 的符号。\n**答案**：dI>0 的边界条件为 (∂I/∂Y)(∂L/∂r) < (∂I/∂r)(∂L/∂Y)。\n##**详解**\n分别对 IS 曲线和 LM 曲线方程求全微分：\n$$IS：dY = C′(Y − T)dY + (∂I/∂r)dr + (∂I/∂Y)dY + dG\n$$LM：d(M/P) = (∂L/∂r)dr + (∂L/∂Y)dY\n实施扩张的政府支出政策时 dG > 0，此时 G 是变量，而 T 与 M/P 是常量，故 d(M/P) = 0。\n由 LM 的全微分可得：\n$$dr = −[(∂L/∂Y)/(∂L/∂r)]·dY\n代入 IS 的全微分并合并 dY 项：\n$$dY·[1 − C′(Y − T) − ∂I/∂Y + (∂I/∂r)(∂L/∂Y)/(∂L/∂r)] = dG\n解得：\n$$dY = dG/[1 − C′(Y − T) − ∂I/∂Y + (∂I/∂r)(∂L/∂Y)/(∂L/∂r)]\n由 C′(Y−T)∈(0,1)、∂I/∂Y∈(0,1)、C′+∂I/∂Y<1 知分母的前三项之和为正；又 ∂I/∂r<0、∂L/∂Y>0、∂L/∂r<0，故 (∂I/∂r)(∂L/∂Y)/(∂L/∂r) > 0，分母整体为正。于是 dG > 0 时 dY > 0、dr > 0。\n再对投资函数求全微分：\n$$dI = (∂I/∂r)dr + (∂I/∂Y)dY = −(∂I/∂r)(∂L/∂Y)/(∂L/∂r)·dY + (∂I/∂Y)dY\n$$dI = {[(∂I/∂Y)(∂L/∂r) − (∂I/∂r)(∂L/∂Y)]/(∂L/∂r)}·dY\n由于 dY > 0、∂L/∂r < 0，要使 dI > 0，必须且只需上式的分子为负：\n$$(∂I/∂Y)(∂L/∂r) − (∂I/∂r)(∂L/∂Y) < 0\n即 dI > 0 的边界条件为：\n$$(∂I/∂Y)(∂L/∂r) < (∂I/∂r)(∂L/∂Y)\n用绝对值表示，记 i = ∂I/∂Y > 0、a = −∂I/∂r > 0、b = ∂L/∂Y > 0、c = −∂L/∂r > 0，则该条件等价于 i·c > a·b，即 i/a > b/c。\n其经济含义是：政府支出扩张一方面通过乘数推高 Y，按 ∂I/∂Y 引致投资增加；另一方面推高 r，按 |∂I/∂r| 挤出投资。dI > 0 要求引致效应强于挤出效应——投资对收入的敏感度相对于其对利率的敏感度，要大于货币需求对收入的敏感度相对于其对利率的敏感度。`},
{id:'h64',special:'宏观·周期理论抽象函数',sub:'细分（二）：变形的抽象 IS-LM 模型',qid:'A1 ★★',question:'假设一个封闭经济体，请用IS-LM曲线分析下面两种不同假设：（A）消费同时被所得和利率所影响：C=C(Y,r)，CY>0，Cr<0；（B）消费只受所得的影响：C=C(Y)，CY>0。此处我们暂时忽略税负对消费的影响。IS-LM曲线的公式如下：IS:Y=C+I(r)+G；LM:M/P=K(Y)+L(r)。（1）请分别计算IS曲线在这两种假设下的斜率，并说明IS曲线在哪种情况下更陡？（2）请分别计算在两种假设下，货币政策对均衡产出的边际影响，也就是 dY/d(M/P)。（3）请参考（1）的答案画出IS-LM曲线，并用图说明货币政策在哪种情况下更有效？（中央财经大学考题）',answer:`**考察知识点**：IS-LM、消费函数、货币政策效果。\n**思路**：求IS斜率；求货币政策乘数；比较政策效果。\n**答案**：（1）情况A斜率 (1−CY)/(Cr+I′)；情况B斜率 (1−CY)/I′；情况B更陡。（2）情况A货币政策乘数 (Cr+I′)/[K′(Cr+I′)+L′(1−CY)]；情况B货币政策乘数 I′/[K′I′+L′(1−CY)]。（3）情况A货币政策更有效。\n##**详解**\n（1）① 当消费同时被所得和利率所影响时，IS曲线方程为 Y = C(Y,r) + I(r) + G。对方程两边求全微分有：\n$$dY = C_Y dY + C_r dr + I′(r)dr\n则有IS曲线的斜率：\n$$dr/dY = (1 − C_Y)/[C_r + I′(r)]\n② 当消费只受所得影响时，IS曲线的方程为 Y = C(Y) + I(r) + G，同理可得该假设下IS曲线的斜率：\n$$dr/dY = (1 − C_Y)/I′(r)\n由于 C_r < 0，可知IS曲线在情况（B）下更陡。\n（2）① 当消费同时被所得和利率所影响时，由LM曲线方程求全微分有：\n$$d(M/P) = K′(Y)dY + L′(r)dr\n将（1）中的 dr/dY 代入上式得：\n$$d(M/P) = {K′(Y)[C_r + I′(r)] + L′(r)(1 − C_Y)}/[C_r + I′(r)]·dY\n解得货币政策对均衡产出的边际影响：\n$$dY/d(M/P) = [C_r + I′(r)]/{K′(Y)[C_r + I′(r)] + L′(r)(1 − C_Y)}\n② 当消费只受所得影响时，同理可得：\n$$dY/d(M/P) = I′(r)/[K′(Y)I′(r) + L′(r)(1 − C_Y)]\n（3）货币政策在情况（A）下更有效。\n如下图所示，当消费同时被所得和利率所影响时，IS曲线较平缓，反映在图形中为 IS₁；当消费只受所得影响时，IS曲线较陡峭，反映在图形中为 IS₂。当实施扩张性货币政策时，LM曲线向右移动，当IS曲线更加平坦时，产出增加量越大，此时货币政策效果越有效，即情况（A）下货币政策更有效。\n【此处有图示】`},
{id:'h65',special:'宏观·周期理论抽象函数',sub:'细分（二）：变形的抽象 IS-LM 模型',qid:'B1 ★',question:'我们考察中央银行控制真实利率的能力。假设经济由两个方程描述：第一个是IS方程 Y=Y(r)，Y′(r)<0；第二个方程是货币市场的均衡条件 m−p=L(r+πe,Y)，Lr+πe<0，LY>0。其中 m、p 表示 lnM 与 lnP，下角标代表对该变量进行求偏导。（1）假设 P=P̄，πe=0。求出 dr/dm 的表达式，并说明货币供给的增加会降低真实利率吗？（2）假设价格对货币供给增加做出局部反应，dp/dm 外生，0<dp/dm<1。仍假设 πe=0。求出 dr/dm，并说明货币供给的增加会降低真实利率吗？（3）假设货币增加也影响预期的通货膨胀。dπe/dm 外生，dπe/dm>0。仍旧假设 0<dp/dm<1。求出 dr/dm。（4）假设存在完全的和连续的价格调整：dp/dm=1，dπe/dm=0。求出 dr/dm。',answer:`**考察知识点**：IS-LM、货币市场、真实利率、货币政策。\n**思路**：全微分求 dr/dm；分别讨论不同假设下的结果。\n**答案**：（1）dr/dm=1/[Lr+LYY′(r)]<0；降低真实利率。（2）dr/dm=(1−dp/dm)/[Lr+LYY′(r)]<0。（3）dr/dm=[(1−dp/dm)−Lr+πe·dπe/dm]/[Lr+πe+LYY′(r)]<0。（4）dr/dm=0；不影响真实利率。\n##**详解**\n（1）将IS方程代入货币市场均衡条件中，可得：\n$$m − p = L(r + π^e, Y(r))\n当 P = P̄，π^e = 0 时，上式变为 m − p̄ = L(r, Y(r))，其中 p̄ = lnP̄。两边对 m 求导可得：\n$$1 = L_r(dr/dm) + L_Y Y′(r)(dr/dm)\n整理可得：\n$$dr/dm = 1/[L_r + L_Y Y′(r)]\n因为 L_r < 0，L_Y > 0，Y′(r) < 0，所以 dr/dm < 0，这意味着货币供给的增加会降低真实利率。\n（2）将假设条件 π^e = 0 代入可得 m − p = L(r, Y(r))。两边对 m 求导可得：\n$$1 − dp/dm = L_r(dr/dm) + L_Y Y′(r)(dr/dm)\n整理得：\n$$dr/dm = (1 − dp/dm)/[L_r + L_Y Y′(r)]\n由（1）可知分母是负数，且当 0 < dp/dm < 1 时分子是正的，因而 dr/dm < 0，即货币供给的增加会降低真实利率。\n比较两式可知，由于 0 < dp/dm < 1，第（2）问中 dr/dm 的绝对值更小。因此，m 的既定变化会导致 r 的更小变化；反过来说，对于任何既定的 r 的变化，要求 m 更大的变化。\n（3）原式两边对 m 求导可得：\n$$1 − dp/dm = L_(r+π^e)·(dr/dm + dπ^e/dm) + L_Y Y′(r)(dr/dm)\n整理可得：\n$$dr/dm = (1 − dp/dm)/[L_(r+π^e) + L_Y Y′(r)] − L_(r+π^e)(dπ^e/dm)/[L_(r+π^e) + L_Y Y′(r)]\n由（2）可知第一项为负；第二项中 L_(r+π^e) < 0、dπ^e/dm > 0、分母 < 0，故该项亦为负。两项皆负，因而 dr/dm < 0，即货币供给的增加会降低真实利率。\n比较（2）与（3）可知，（3）中 dr/dm 的绝对值更大。这意味着，当名义货币供给增加时通货膨胀预期变大，m 的既定变化将对真实利率产生更大的影响；因而与（2）相比，真实利率 r 的既定变动要求 m 更小的变动。\n（4）将 dp/dm = 1、dπ^e/dm = 0 代入（3）的表达式整理可得 dr/dm = 0。这意味着，存在完全的和连续的价格调整时，货币供给的增加不会影响真实利率（货币中性）。\n**【提示】**本题是罗默《高级宏观经济学》原题。\n**【校注】**原文称"第二项是正的（不算负号）"表述易误解，该项实为 −(负)/(负) = 负，故两项同为负，结论 dr/dm < 0 不变，此处已改按符号直接判断。`},
{id:'h66',special:'宏观·动态AD-AS模型',qid:'A1 ★',question:'假定人们的通货膨胀预期受到随机冲击的影响。预期性机制为：时期 t−1 对时期 t 的通货膨胀的预期是 Et−1πt=πt−1+ηt−1，式中 ηt−1 是一个随机冲击。这一冲击一般为 0，但是当过去的通货膨胀以外的某些事件引起通货膨胀变化时，它就会偏离零。产品和服务的需求方程：Yt=Ȳt−α(rt−ρ)+εt；费雪方程：rt=it−Etπt+1；菲利普斯曲线：πt=Et−1πt+φ(Yt−Ȳt)+νt；货币政策规则：it=πt+ρ+θπ(πt−πt*)+θY(Yt−Ȳt)。（1）推导动态总需求方程和动态总供给方程。（2）假定经济经历了一场通货膨胀恐慌。在时期 t，由于某些原因人们相信时期 t+1 的通货膨胀会更高，因此 ηt 大于零。则时期 t、时期 t+1 以及以后的时期里的经济会发生什么变化？（3）在何种意义上通货膨胀恐慌自我实现了？',answer:`**考察知识点**：动态AD-AS模型、通货膨胀预期、货币政策。\n**思路**：推导DAD和DAS；分析通胀恐慌的短期和长期影响。\n**答案**：（1）DAS：πt=πt−1+ηt−1+φ(Yt−Ȳt)+νt；DAD：Yt=Ȳt−αθπ(πt−πt*)/(1+αθY)+αηt/(1+αθY)+εt/(1+αθY)。（2）短期产出和通胀上升，随后DAS左移，经济进入滞涨，最终回到初始均衡。（3）通胀恐慌自我实现，因为预期通胀上升导致实际通胀上升。\n##**详解**\n（1）如果通货膨胀预期受到随机冲击的影响，即 E_(t−1)π_t = π_(t−1) + η_(t−1)。\nDAS曲线：将适应性预期方程代入菲利普斯曲线 π_t = E_(t−1)π_t + φ(Y_t − Ȳ_t) + ν_t 中，就能得到DAS曲线的表达式：\n$$π_t = π_(t−1) + η_(t−1) + φ(Y_t − Ȳ_t) + ν_t\nDAD曲线：由产品和服务的需求方程 Y_t = Ȳ_t − α(r_t − ρ) + ε_t，将费雪方程 r_t = i_t − E_tπ_(t+1) 代入可得：\n$$Y_t = Ȳ_t − α(i_t − E_tπ_(t+1) − ρ) + ε_t\n再代入货币政策方程 i_t = π_t + ρ + θ_π(π_t − π*) + θ_Y(Y_t − Ȳ_t) 和预期方程 E_tπ_(t+1) = π_t + η_t 可得：\n$$Y_t = Ȳ_t − α[θ_π(π_t − π*) + θ_Y(Y_t − Ȳ_t) − η_t] + ε_t\n移项整理可得DAD曲线方程：\n$$Y_t = Ȳ_t − [αθ_π/(1 + αθ_Y)](π_t − π*) + [α/(1 + αθ_Y)]η_t + [1/(1 + αθ_Y)]ε_t\n（2）如果t时期 η_t 大于零（通货膨胀恐慌），那么DAS曲线不变而DAD曲线向右移动。产出和通货膨胀都上升，经济均衡从A点移动到B点。\n在t+1时期，DAD曲线会回到初始位置，因为 η_(t+1) 等于零；而DAS曲线则会向左移动，因为上一期的随机冲击大于零（π_t 已上升）。经济均衡从B点移动到C点，与初始均衡点A相比，新的均衡时产出降低但通货膨胀率上升，经济进入滞胀。\n在接下来的时期，因为较低的产出降低了通货膨胀，从而降低了对未来通货膨胀的预期，DAS曲线缓慢向下移动，最终回到其初始位置A点。\n【此处有图示】\n（3）通货膨胀恐慌自我实现了：当人们相信未来会有高的通货膨胀时，他们会改变当前的预期与行为（要求更高的名义工资与利率），这样的行为最终导致了高通货膨胀的实际发生。即预期的变化通过DAS曲线的移动，本身成了通货膨胀上升的原因。`}
];

/* 事件委托：监听器只绑一次，卡片重绘后依然有效（原来是每次 render 重绑 2800+ 个） */
var __delegated = Object.create(null);
function delegateOnce(selector, type, handler) {
    var k = type + '::' + selector;
    if (__delegated[k]) return;
    __delegated[k] = 1;
    grid.addEventListener(type, function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        var el = t.closest(selector);
        if (!el || !grid.contains(el)) return;
        return handler.call(el, e);
    });
}

/* HTML 转义 */
/* safeText() 已统一到 shared/escape.js */
/* 小问自动换行：只有「位于段首」或「紧随句末标点（。；！？：）」、
   且编号恰好比上一问大 1 的（n），才当作新小问换行。
   其余一律视为回指、不换行——如「代入（1）中需求函数」「情况（1）更好」「本题（1）问」「将（1）中的…代入」 */
function addSubBreaks(escaped){
  if(!escaped) return '';
  const re = /（(\d+)）/g;
  let out = '', lastEnd = 0, lastNo = 0, m;
  while((m = re.exec(escaped)) !== null){
    const n = parseInt(m[1], 10);
    /* 26/10/20：标签改成 <strong>【答案】</strong> 后，（1）前面紧挨的是 > 而不是 】，
       所以先把标签剥掉再看前一个可见字符，否则整段不再拆行。 */
    const prevText = escaped.slice(0, m.index).replace(/<[^>]*>/g, '');
    const atStart = (prevText === '');
    const afterStop = atStart || /[。；！？：】）]/.test(prevText.slice(-1));
    if(n === lastNo + 1){
      if(afterStop){
        out += escaped.slice(lastEnd, m.index) + '<br>（' + m[1] + '）';
        lastEnd = m.index + m[0].length;
      }
      lastNo = n;
    } else if(atStart && lastNo === 0){
      lastNo = n;
    }
  }
  out += escaped.slice(lastEnd);
  return out.replace(/^<br>/, '');
}
function renderAnswerParagraphs(text){
  if(!text) return '';
  const paragraphs = text.split('\n');
  const filtered = paragraphs.filter(p => p.trim() !== '');
  if(filtered.length === 0) return '';
  return filtered.map(p => {
    let raw = p.trim();
    let cls = '';
    if(raw.indexOf('$$') === 0){ cls = 'formula'; raw = raw.slice(2).trim(); }
    /* 26/10/20：详解标题仍用 **详解** 的写法，冒号由程序补 */
    else if(raw.indexOf('##') === 0){ cls = 'detail-head'; raw = raw.slice(2).trim() + '：'; }
    /* 26/10/20：加粗只认「前面不是字母数字」的 **，这样答案里的数学记号 Q**、p**（税后均衡量）能原样显示，不会被当成加粗的起止符。 */
    let esc = safeText(raw).replace(/(^|[^\w*])\*\*(.+?)\*\*/g, '$1<strong>$2</strong>');
    if(cls === 'formula') return `<p class="formula">${esc}</p>`;
    /* 26/10/19：段内由 addSubBreaks 拆出的小问原来用 <br> 分行，
       而 text-indent:2em 只作用于段落首行，导致「答案：」后的（1）（2）…
       全部顶格。改为拆成独立段落，每个小问都吃到 2em 缩进。 */
    const segs = addSubBreaks(esc).split('<br>');
    if(segs.length === 1) return `<p class="${cls}">${segs[0]}</p>`;
    return segs.map((s, i) => `<p class="${(cls + (i ? ' cont' : '')).trim()}">${s}</p>`).join('');
  }).join('');
}
function renderQuestionText(text){
  if(!text) return '';
  return addSubBreaks(safeText(text));
}
function getCardData(id){
  const original = currentData.find(d => d.id === id);
  if(!original) return null;
  if(edits[id]) return {...original, question: edits[id].question || original.question, answer: edits[id].answer || original.answer};
  return {...original};
}

/* ============= 筛选下拉初始化 ============= */
/* 26/10/20：分组标题原来用 <optgroup>，浏览器不允许选中，点了没反应。
   改成「可点的组标题 option」（value=__grp__索引，选中 = 该部分全部专项）
   + 全角空格缩进的成员，与 1/2 页一致。 */
function majorMatch(d){
  const v = filterMajor.value;
  if(v === 'all') return true;
  if(v.indexOf('__grp__') === 0){
    const g = filterTree[parseInt(v.slice(7), 10)];
    return !!g && g.items.some(item => item.major === d.major);
  }
  return d.major === v;
}
function buildMajorOptions(){
  let html = '<option value="all">全部专项</option>';
  filterTree.forEach((g, gi) => {
    html += `<option value="__grp__${gi}" style="font-weight:600;">${safeText(g.group)}（共 ${g.items.length} 个专项）</option>`;
    g.items.forEach(item => {
      html += `<option value="${safeText(item.major)}">　　${safeText(item.major)}</option>`;
    });
  });
  filterMajor.innerHTML = html;
}
function buildSubOptions(major){
  if(major === 'all'){
    filterSub.innerHTML = '<option value="all">全部细分</option>';
    filterSub.disabled = true;
    return;
  }
  const group = filterTree.find(g => g.items.some(item => item.major === major));
  if(!group){filterSub.innerHTML = '<option value="all">全部细分</option>';filterSub.disabled = true;return;}
  const item = group.items.find(i => i.major === major);
  if(!item || item.subs.length === 0){
    filterSub.innerHTML = '<option value="all">全部细分</option>';
    filterSub.disabled = true;
    return;
  }
  filterSub.disabled = false;
  let html = '<option value="all">全部细分</option>';
  item.subs.forEach(sub => { html += `<option value="${safeText(sub)}">${safeText(sub)}</option>`; });
  filterSub.innerHTML = html;
}

function exitSingleMode(silent){
  if(singleModeId === null) return;
  singleModeId = null; history = []; historyIndex = -1;
  singleModeBar.classList.remove('show');
  filterBar.classList.remove('disabled');
  render();
  if (!silent) showToast('📋 已退出抽查模式');
}
function enterSingleMode(id){
  if(!id) return;
  if(singleModeId !== null){
    if(singleModeId === id) return;
    exitSingleMode();
    setTimeout(()=>{enterSingleMode(id);},100);
    return;
  }
  const card = getCardData(id);
  if(!card){showToast('🫥卡片不存在哦~');return;}
  singleModeId = id;
  const existIdx = history.indexOf(id);
  if(existIdx !== -1){historyIndex = existIdx;}
  else{history.push(id);historyIndex = history.length - 1;}
  singleModeBar.classList.add('show');
  filterBar.classList.add('disabled');
  updateSingleBadge(id);
  updateNavButtons();
  render(id);
  showToast(`🎯 抽查: ${card.sub || card.major} · ${card.qid}`);
}
function updateSingleBadge(id){
  const card = getCardData(id);
  if(card) singleCardBadge.textContent = `${card.sub || card.major} · ${card.qid}`;
  else singleCardBadge.textContent = id;
}
function updateNavButtons(){
  prevCardBtn.classList.toggle('disabled', historyIndex <= 0);
  const ids = getFilteredIds();
  nextCardBtn.classList.toggle('disabled', ids.length <= 1);
}
function goPrevCard(){
  if(singleModeId === null) return;
  if(historyIndex <= 0){showToast('已经是第一张了');return;}
  historyIndex--;
  const id = history[historyIndex];
  if(id){singleModeId = id;updateSingleBadge(id);updateNavButtons();render(id);}
  else exitSingleMode();
}
function goNextCard(){
  if(singleModeId === null) return;
  /* 26/10/19 方案C：下一张同样守档位 */
  const baseIds = getFilteredIds();
  const pool = (typeof window.__stPool === 'function') ? window.__stPool(baseIds) : null;
  const ids = pool || baseIds;
  /* 26/10/19：池子只剩 1 张不能直接拦，可能是另一张没抽过的卡 */
  if(ids.length === 0){showToast('🤧没有更多卡片可抽查了~');return;}
  const available = ids.filter(id => id !== singleModeId);
  if(available.length === 0){showToast('🤧没有更多卡片可抽查了~');return;}
  const randomId = available[Math.floor(Math.random() * available.length)];
  history = history.slice(0, historyIndex + 1);
  history.push(randomId);
  historyIndex = history.length - 1;
  singleModeId = randomId;
  updateSingleBadge(randomId);
  updateNavButtons();
  render(randomId);
  const card = getCardData(randomId);
  if(card) showToast(`▶ 下一张: ${card.sub || card.major} · ${card.qid}`);
}
function doRandom(){
  /* 26/10/19 方案C：自测档位优先 */
  const baseIds = getFilteredIds();
  const pool = (typeof window.__stPool === 'function') ? window.__stPool(baseIds) : null;
  const ids = pool || baseIds;
  if(ids.length === 0){showToast(pool ? '🎯 当前档位没有卡片可抽，换个档位或先自评几张吧' : '😶‍🌫️当前没有卡片可抽查，请调整筛选条件~');return;}
  /* 26/10/19：按 R 或重复点抽查时静默退出 */
  if(singleModeId !== null){exitSingleMode(true);setTimeout(()=>{doRandom();},150);return;}
  const randomId = ids[Math.floor(Math.random() * ids.length)];
  enterSingleMode(randomId);
}

const editBackups = {};
function enterEditMode(id){
  const card = getCardData(id);
  if(!card) return;
  const questionEl = document.querySelector(`.card-question[data-id="${id}"] .q-text`);
  const answerInner = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner`);
  const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
  if(!questionEl || !answerInner || !editBtn) return;
  if(editBtn.classList.contains('is-editing')) return;
  const currentQ = questionEl.textContent.trim();
  const pNodes = answerInner.querySelectorAll('p');
  let currentA = '';
  if(pNodes.length > 0) currentA = Array.from(pNodes).map(p => p.textContent.trim()).join('\n');
  else currentA = answerInner.textContent.trim();
  editBackups[id] = {question: currentQ, answer: currentA};
  const editQ = document.createElement('div');
  editQ.contentEditable = true;
  editQ.className = 'q-text editable';
  editQ.textContent = currentQ;
  editQ.style.cssText = 'display:inline-block;min-width:60px;outline:none;border-bottom:2px solid #6a9e9e;padding:2px 4px;white-space:pre-wrap;';
  questionEl.replaceWith(editQ);
  const editA = document.createElement('div');
  editA.className = 'answer-inner editable';
  editA.contentEditable = true;
  const paragraphs = currentA.split('\n').filter(p => p.trim() !== '');
  if(paragraphs.length === 0) editA.innerHTML = '<p><br></p>';
  else editA.innerHTML = paragraphs.map(p => `<p>${safeText(p.trim())}</p>`).join('');
  editA.style.cssText = 'background:transparent;border-left:none;padding:4px 6px;min-height:40px;outline:none;border:2px dashed #6a9e9e;border-radius:8px;';
  answerInner.replaceWith(editA);
  editBtn.classList.add('is-editing');
  editBtn.textContent = '💾';
  editBtn.title = '保存修改';
  let cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);
  if(!cancelBtn){
    cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel-edit';
    cancelBtn.dataset.id = id;
    cancelBtn.textContent = '❌';
    cancelBtn.title = '取消编辑';
    cancelBtn.style.cssText = 'font-size:18px;padding:4px 6px;background:transparent;border:none;cursor:pointer;border-radius:10px;color:#8a4a4a;';
    editBtn.parentNode.insertBefore(cancelBtn, editBtn.nextSibling);
    cancelBtn.addEventListener('click', function(e){e.stopPropagation();cancelEdit(id);});
  } else cancelBtn.style.display = 'inline-block';
  editBtn.onclick = function(e){e.stopPropagation();saveEdit(id);};
  showToast('✏️ 正在编辑，点击 💾 保存 或 ❌ 取消');
}
function saveEdit(id){
  const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
  if(!editBtn || !editBtn.classList.contains('is-editing')) return;
  const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
  const editA = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner.editable`);
  if(!editQ || !editA){showToast('⚠️ 编辑内容不存在');return;}
  const newQ = editQ.textContent.trim();
  const pNodes = editA.querySelectorAll('p');
  let newA = '';
  if(pNodes.length > 0) newA = Array.from(pNodes).map(p => p.textContent.trim()).join('\n');
  else newA = editA.textContent.trim();
  if(!newQ || !newA){showToast('⚠️ 题目和答案不能为空');return;}
  edits[id] = {question: newQ, answer: newA};
  saveEdits();
  exitEditMode(id, true);
  showToast('✅ 修改已保存');
}
function cancelEdit(id){
  const backup = editBackups[id];
  if(!backup){exitEditMode(id, false);return;}
  const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
  const editA = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner.editable`);
  if(editQ){
    const newSpan = document.createElement('span');
    newSpan.className = 'q-text';
    newSpan.textContent = backup.question;
    editQ.replaceWith(newSpan);
  }
  if(editA){
    const newDiv = document.createElement('div');
    newDiv.className = 'answer-inner';
    newDiv.innerHTML = renderAnswerParagraphs(backup.answer);
    editA.replaceWith(newDiv);
  }
  delete editBackups[id];
  exitEditMode(id, false);
  showToast('🔙 已取消编辑');
}
function exitEditMode(id, saved){
  const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
  const cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);
  if(editBtn){
    editBtn.classList.remove('is-editing');
    editBtn.textContent = '✏️';
    editBtn.title = '编辑题目和答案';
    editBtn.onclick = function(e){e.stopPropagation();enterEditMode(id);};
  }
  if(cancelBtn) cancelBtn.style.display = 'none';
  if(saved) render(singleModeId || null);
  delete editBackups[id];
}

/* ============= 筛选 ============= */
function getFilteredIds(){
  const majorVal = filterMajor.value;
  const subVal = filterSub.value;
  const favVal = filterFav.value;
  const searchVal = filterSearch.value.trim().toLowerCase();
  return currentData.filter(d => {
    if(!majorMatch(d)) return false;
    if(subVal !== 'all' && d.sub !== subVal) return false;
    if(favVal === 'fav' && !favorites.includes(d.id)) return false;
    if(searchVal){
      const q = d.question.toLowerCase();
      const a = d.answer.toLowerCase();
      if(!q.includes(searchVal) && !a.includes(searchVal)) return false;
    }
    return true;
  }).map(d => d.id);
}

/* ============= 渲染 ============= */
function render(singleId = null){
  if(singleId !== null && singleModeId === null){
    const ids = getFilteredIds();
    if(ids.includes(singleId)){
      singleModeId = singleId;
      if(history.length === 0 || history[history.length - 1] !== singleId){
        history.push(singleId);
        historyIndex = history.length - 1;
      }
      singleModeBar.classList.add('show');
      filterBar.classList.add('disabled');
      updateSingleBadge(singleId);
      updateNavButtons();
    } else singleId = null;
  }
  if(singleId === null && singleModeId !== null){exitSingleMode();return;}

  const isSingleMode = singleModeId !== null;
  let filtered;
  if(isSingleMode){
    const card = getCardData(singleModeId);
    filtered = card ? [card] : [];
    if(filtered.length === 0){exitSingleMode();return;}
    updateSingleBadge(singleModeId);
  } else {
    const majorVal = filterMajor.value;
    const subVal = filterSub.value;
    const favVal = filterFav.value;
    const searchVal = filterSearch.value.trim().toLowerCase();
    filtered = currentData.map(d => getCardData(d.id)).filter(d => {
      if(!d) return false;
      if(!majorMatch(d)) return false;
      if(subVal !== 'all' && d.sub !== subVal) return false;
      if(favVal === 'fav' && !favorites.includes(d.id)) return false;
      if(searchVal){
        const q = d.question.toLowerCase();
        const a = d.answer.toLowerCase();
        if(!q.includes(searchVal) && !a.includes(searchVal)) return false;
      }
      return true;
    });
  }
  totalSpan.textContent = currentData.length;
  favSpan.textContent = favorites.length;
  grid.classList.toggle('single-mode', isSingleMode);
  if(filtered.length === 0){
    grid.innerHTML = `<div class="no-result">🌿 没有找到匹配的卡片，试试调整筛选条件吧</div>`;
    return;
  }
  let html = '';
  filtered.forEach(d => {
    const isFav = favorites.includes(d.id);
    const note = notes[d.id] || '';

    const aHtml = renderAnswerParagraphs(d.answer);

    html += `
      <div class="card-item ${isFav ? 'favorited' : ''}" data-id="${d.id}">

            <button class="btn-note ${note ? 'active' : ''}" data-id="${d.id}" title="笔记">📝</button>
            <button class="btn-edit" data-id="${d.id}" title="编辑题目和答案">✏️</button>
          </div>
        </div>
        <div class="card-question" data-id="${d.id}">
          <span class="q-text">${qText}</span>
          <span class="toggle-hint">(点击展开答案)</span>
        </div>
        <div class="card-answer" data-id="${d.id}">
          <div class="answer-inner">${aHtml}</div>
        </div>
        <div class="card-note-area" data-id="${d.id}">
          <div class="note-editor" contenteditable="false" data-id="${d.id}">${note}</div>
          <div class="img-resize-control" data-id="${d.id}">
            <span>📐 大小</span>
            <input type="range" min="10" max="200" value="100" step="2" />
            <span class="size-val">100%</span>
            <button class="btn-reset-size" data-id="${d.id}">重置</button>
          </div>
          <div class="note-actions">
            <button class="btn-insert-img" data-id="${d.id}">🖼️ 插入图片</button>
            <button class="note-save" data-id="${d.id}">💾 保存笔记</button>

    delegateOnce('.card-question', 'click', function (e) {

    delegateOnce('.note-save', 'click', function (e) {

      let content = editor.innerHTML.trim();

      if(content.indexOf('note-placeholder') > -1){
        const tmpDiv = document.createElement('div');
        tmpDiv.innerHTML = content;
        tmpDiv.querySelectorAll('.note-placeholder').forEach(n => n.remove());

      }
      if(content === '<br>' || content === '') content = '';
      if(content) notes[id] = content;
      else delete notes[id];
      saveNotes();
      /* 26/09/17 修复：保存后回到查看态，避免可编辑状态残留导致下次点📝自动进入编辑 */
      editor.setAttribute('contenteditable', 'false');

    delegateOnce('.note-clear', 'click', async function (e) {

      const editor = document.querySelector(`.note-editor[data-id="${id}"]`);

              range.insertNode(img);
              range.setStartAfter(img);

function bindImgClick(editor){
  editor.querySelectorAll('img').forEach(img => {
    img.removeEventListener('click', imgClickHandler);
    img.addEventListener('click', imgClickHandler);
  });
}
function imgClickHandler(e){
  e.stopPropagation();
  const img = this;
  const editor = img.closest('.note-editor');
  if(!editor) return;
  const id = editor.dataset.id;
  editor.querySelectorAll('img').forEach(i => i.classList.remove('selected'));
  img.classList.add('selected');
  const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
  if(!rc) return;
  rc.classList.add('show');
  const slider = rc.querySelector('input[type="range"]');
  const valSpan = rc.querySelector('.size-val');
  if(!slider) return;
  let currentPct = 100;
  if(img.style.width){
    const w = parseInt(img.style.width);
    if(w > 0 && w <= 200) currentPct = w;
  }
  slider.value = currentPct;
  if(valSpan) valSpan.textContent = currentPct + '%';
  slider.oninput = function(){
    const val = parseInt(slider.value);
    if(valSpan) valSpan.textContent = val + '%';
    img.style.width = val + '%';
    img.style.maxWidth = val + '%';
  };
  const resetBtn = rc.querySelector('.btn-reset-size');
  if(resetBtn){
    resetBtn.onclick = function(e2){
      e2.stopPropagation();
      img.style.width = ''; img.style.maxWidth = '100%';
      slider.value = 100;
      if(valSpan) valSpan.textContent = '100%';
      showToast('📐 已重置');
    };
  }
}

/* ============= 事件绑定 ============= */

  if(singleModeId !== null) exitSingleMode();
  else render();
}

  buildSubOptions(this.value);
  onFilterChange();
});
filterSub.addEventListener('change', onFilterChange);

document.querySelectorAll('.filter-bar select').forEach(function (sel) {
  sel.addEventListener('change', function () { this.blur(); });
});
/* 搜索防抖：避免每敲一个字就全量重绘所有卡片 */
var __searchTimer = null;
filterSearch.addEventListener('input', function () {
    clearTimeout(__searchTimer);
    __searchTimer = setTimeout(onFilterChange, 220);
});
clearBtn.addEventListener('click', function(){
  filterMajor.value = 'all';
  buildSubOptions('all');
  filterFav.value = 'all';
  filterSearch.value = '';

  else render();
});
exitSingleBtn.addEventListener('click', exitSingleMode);
prevCardBtn.addEventListener('click', goPrevCard);
nextCardBtn.addEventListener('click', goNextCard);
randomBtn.addEventListener('click', doRandom);

document.addEventListener('keydown', function(e){
  if(e.key === 'r' || e.key === 'R'){
    if(!e.ctrlKey && !e.metaKey && !e.altKey){
      const t = e.target;
      if(t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA' && t.contentEditable !== 'true'){
        e.preventDefault();
        doRandom();
      }
    }
  }
  if(e.key === 'Escape'){
    if(singleModeId !== null){e.preventDefault();exitSingleMode();}
  }
  if(singleModeId !== null){
    if(e.key === 'ArrowLeft'){e.preventDefault();goPrevCard();}
    if(e.key === 'ArrowRight'){e.preventDefault();goNextCard();}
  }
});

/* 26/10/17：把「专项 → 细分专项」的重建函数交给筛选记忆（恢复专项后先重建细分列表，再填细分） */

/* 26/10/17：还原上次的筛选（级联下拉按 DOM 顺序恢复，必须在首次 render 之前） */
