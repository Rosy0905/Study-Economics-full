<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="../icons/icon.svg">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#6A2C91">
<meta charset="UTF-8" />

<title>计算专项 · 记忆卡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC',Roboto,'Helvetica Neue',sans-serif;background:#f0f7f0;color:#1e3a2a;padding:20px;}
.app-header{max-width:1200px;margin:0 auto 20px auto;background:#d9edd9;padding:18px 28px;border-radius:18px;box-shadow:0 4px 12px rgba(60,110,60,0.12);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.app-header h1{font-size:24px;font-weight:600;color:#1e4a2a;letter-spacing:0.5px;}
.app-header .stats{display:flex;gap:20px;font-size:14px;background:#c4e0c4;padding:6px 18px;border-radius:40px;}
.app-header .stats span{font-weight:500;}
.app-header .stats .num{color:#1f6b3a;font-weight:700;}
.filter-bar{max-width:1200px;margin:0 auto 20px auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#e6f3e6;padding:12px 20px;border-radius:14px;transition:opacity 0.3s;}
.filter-bar.disabled{opacity:0.5;pointer-events:none;}
.filter-bar label{font-size:14px;font-weight:500;color:#1f4a2a;}
.filter-bar select,.filter-bar input{padding:6px 14px;border-radius:30px;border:1px solid #b3d9b3;background:#fafffa;font-size:14px;color:#1e3a2a;outline:none;}
.filter-bar input:focus{border-color:#6a9e6a;box-shadow:0 0 0 3px rgba(80,150,80,0.2);}
/* 26/09/18：筛选下拉框点击时显示光圈，选中某一项后由脚本自动收起；搜索框光圈保留 */
.filter-bar select:focus{border-color:#6a9e6a;box-shadow:0 0 0 3px rgba(80,150,80,0.2);}
.filter-bar select optgroup{font-style:normal;font-weight:700;color:#1f5a2f;}
.filter-bar select:disabled{opacity:0.5;cursor:not-allowed;}
.filter-bar .btn-clear-filter{background:#cfe2cf;border:none;padding:6px 18px;border-radius:30px;font-size:13px;cursor:pointer;color:#1e4a2a;font-weight:500;transition:background 0.2s;}
@media (hover: hover) and (pointer: fine) {
    .filter-bar .btn-clear-filter:hover{background:#b8d4b8;}
}
.filter-bar .btn-random{background:#d4c49a;border:none;padding:6px 22px;border-radius:30px;font-size:14px;cursor:pointer;color:#3f3a1a;font-weight:600;transition:background 0.2s,transform 0.1s;}
@media (hover: hover) and (pointer: fine) {
    .filter-bar .btn-random:hover{background:#c9b888;transform:scale(1.02);}
}
.filter-bar .btn-random:active{transform:scale(0.96);}
.single-mode-bar{max-width:1200px;margin:0 auto 16px auto;background:#f5efe0;border:2px solid #d4a24e;border-radius:14px;padding:8px 20px;display:none;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;animation:fadeSlide 0.3s ease;}
.single-mode-bar.show{display:flex;}
.single-mode-bar .mode-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.single-mode-bar .mode-left .btn-nav{background:transparent;border:none;font-size:22px;cursor:pointer;padding:2px 10px;border-radius:8px;color:#7a5a2a;transition:background 0.15s,transform 0.1s;line-height:1;}
@media (hover: hover) and (pointer: fine) {
    .single-mode-bar .mode-left .btn-nav:hover{background:#e8ddd0;transform:scale(1.05);}
}
.single-mode-bar .mode-left .btn-nav:active{transform:scale(0.92);}
.single-mode-bar .mode-left .btn-nav.disabled{opacity:0.35;pointer-events:none;}
.single-mode-bar .card-id-badge{font-size:15px;font-weight:600;color:#5a4a2a;background:#e8ddd0;padding:4px 18px;border-radius:30px;white-space:nowrap;}
.single-mode-bar .mode-hint{font-size:13px;color:#8a7a5a;margin-left:4px;}
.single-mode-bar .btn-exit-single{background:transparent;border:none;font-size:20px;cursor:pointer;padding:2px 10px;border-radius:8px;color:#8a5a4a;transition:background 0.15s,transform 0.1s;line-height:1;}
@media (hover: hover) and (pointer: fine) {
    .single-mode-bar .btn-exit-single:hover{background:#e8d5d0;transform:scale(1.05);}
}
.single-mode-bar .btn-exit-single:active{transform:scale(0.92);}
.card-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:18px;}
.card-grid.single-mode{max-width:820px;}
.card-grid.single-mode .card-item{box-shadow:0 8px 32px rgba(60,100,60,0.18);border-left-width:8px;}
.card-item{background:#ffffff;border-radius:18px;box-shadow:0 4px 14px rgba(60,100,60,0.08);border-left:6px solid #8fbe8f;transition:box-shadow 0.25s,transform 0.15s,border-color 0.3s;overflow:hidden;position:relative;}
@media (hover: hover) and (pointer: fine) {
    .card-item:hover{box-shadow:0 8px 24px rgba(50,100,50,0.13);}
}
.card-item.favorited{border-left-color:#d4a24e;background:#fdfbf6;}
.card-item.favorited .toggle-hint{color:#bd9333;opacity:0.9;}
.card-item.favorited .card-header .label .qid { color: #8a6a1a; }
.card-item.favorited .card-question { color: #2b2b2b; }
.card-item.favorited .card-answer .answer-inner strong { color: #1a1a1a; }
.card-item.favorited .card-answer .answer-inner p.formula { color: #2b2b2b; background: #f6eddd; }
.card-item.favorited .card-answer .answer-inner p.detail-head { border-top-color: #e8d9b0; }
.card-item.favorited .card-answer .answer-inner .img-placeholder { background: #efe4c8; color: #5a4a1a; }
.card-item.favorited .card-header .label .tag{background:#f2e8ce;color:#5a4a1a;}
.card-item.favorited .card-answer .answer-inner { background: #faf6ea; color: #2b2b2b; }
.card-item.favorited .card-question.editable{background:#fdfaf1;border-color:#e8d9b0;}
.card-item.favorited .card-answer.editable{background:#fdfaf1;border-color:#e8d9b0;}
.card-item.favorited .card-note-area .note-editor{background:#fdfaf1;border-color:#e8d9b0;}
.card-item.favorited .card-note-area .note-editor:focus{border-color:#d4a24e;box-shadow:0 0 0 3px rgba(212, 162, 78, 0.16);}
.card-item.favorited .card-note-area .note-editor img.selected{border-color:#d4a24e;box-shadow:0 0 0 3px rgba(212, 162, 78, 0.25), 0 4px 16px rgba(0, 0, 0, 0.12);}
.card-item.favorited .card-note-area .note-editor .note-placeholder{color:#b8a478;}
.card-item.favorited .card-note-area .img-resize-control{background:#f8f1de;border-color:#e8d9b0;color:#6a5620;}
.card-item.favorited .card-note-area .img-resize-control input[type="range"]{accent-color:#d4a24e;}
.card-item.favorited .card-note-area .img-resize-control .btn-reset-size{background:#f0e6cc;color:#5a4a1a;}
.card-item.favorited .card-note-area .note-actions button{background:#f1e7cd;color:#5a4a1a;}
.card-item.favorited .card-note-area .note-actions .btn-insert-img{background:#ece1c4;color:#5a4a1a;}
.card-item.favorited .card-note-area .note-actions .note-save{background:#e6d5a2;color:#4a3a0a;}
.card-item.favorited .card-note-area .note-actions .note-clear{background:#ecded6;color:#6a4a3a;}
.card-item.favorited .card-note-area .note-actions .note-size-hint{color:#a8926a;}
@media (hover: hover) and (pointer: fine) {
    .card-item.favorited .card-actions button:hover{background:#f5ecd8;}
    .card-item.favorited .card-note-area .note-actions button:hover{background:#e8dbb8;}
    .card-item.favorited .card-note-area .note-actions .btn-insert-img:hover{background:#e2d5b0;}
    .card-item.favorited .card-note-area .note-actions .note-save:hover{background:#dcc78e;}
    .card-item.favorited .card-note-area .note-actions .note-clear:hover{background:#e2d0c6;}
    .card-item.favorited .card-note-area .img-resize-control .btn-reset-size:hover{background:#e8dbb8;}
}
.card-header{padding:16px 22px 8px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.card-header .label{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.card-header .label .tag{background:#dcebd9;padding:2px 12px;border-radius:40px;font-size:12px;font-weight:600;color:#1a4a2a;white-space:nowrap;}
.card-header .label .tag.sub-tag{background:#e8e0c8;color:#5a4a2a;}
.card-header .label .qid{font-weight:600;font-size:15px;color:#1f5a2f;}
.card-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.card-actions button{background:transparent;border:none;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:10px;transition:background 0.15s,transform 0.1s;line-height:1;color:#3f6a3f;}
@media (hover: hover) and (pointer: fine) {
    .card-actions button:hover{background:#e6f0e6;transform:scale(1.05);}
}
.card-actions .btn-fav{color:#b8a06a;}
.card-actions .btn-fav.active{color:#d4a24e;}
.card-actions .btn-note{color:#4f7a4f;}
.card-actions .btn-note.active{color:#2b6b2b;}
.card-actions .btn-edit{color:#4f6a8f;}
.card-actions .btn-edit.is-editing{color:#2b6b2b;}
.card-actions .btn-cancel-edit{color:#8a4a4a;}
.card-question{padding:6px 22px 12px 22px;font-size:15.5px;line-height:1.7;color:#1c3322;cursor:pointer;user-select:none;position:relative;}
.card-question .q-text{display:inline;white-space:pre-wrap;}
.card-question .toggle-hint{font-size:13px;color:#5f8a5f;margin-left:10px;font-weight:400;opacity:0.7;white-space:nowrap;}
.card-question.editable{cursor:text;user-select:text;border:2px dashed #6a9e9e;border-radius:10px;padding:10px 18px;background:#fafffe;}
.card-question.editable:focus{border-color:#2b6b6b;outline:none;box-shadow:0 0 0 3px rgba(60,150,150,0.15);}
.card-answer{padding:0 22px 6px 22px;display:none;animation:fadeSlide 0.3s ease;}
.card-answer.open{display:block;}
.card-answer .answer-inner{background:#f3faf3;padding:18px 22px;border-radius:14px;font-size:14.8px;line-height:1.75;color:#1a3322;word-break:break-word;}
.card-answer .answer-inner p{text-indent:2em;margin:0 0 0.2em 0;padding:0;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
.card-answer .answer-inner p.cont{text-indent:2em;margin:0;}
.card-answer .answer-inner p:last-child{margin-bottom:0;}
.card-answer .answer-inner p.formula{text-indent:0;margin-left:2em;font-family:'Times New Roman','Cambria Math',serif;color:#1c4a3a;background:#eaf5ea;border-radius:6px;padding:2px 10px;display:block;width:fit-content;max-width:100%;}
.card-answer .answer-inner strong{color:#0f3d1f;font-weight:700;}
.card-answer .answer-inner p.detail-head{text-indent:2em;margin:18px 0 6px 0;padding:8px 0 0 0;border-top:1px dashed #b9d8b9;border-bottom:none;color:inherit;font-weight:400;letter-spacing:0;}
.card-answer.editable{cursor:text;user-select:text;border:2px dashed #6a9e9e;border-radius:10px;padding:8px 16px;background:#fafffe;}
.card-answer.editable .answer-inner{background:transparent;padding:4px 6px;}
.card-answer.editable:focus{border-color:#2b6b6b;outline:none;box-shadow:0 0 0 3px rgba(60,150,150,0.15);}
.card-note-area{padding:0 22px 18px 22px;display:none;animation:fadeSlide 0.3s ease;}
.card-note-area.open{display:block;}
.card-note-area .note-editor{background:#f8fcf8;border:1px solid #c2ddc2;border-radius:14px;padding:12px 16px;min-height:80px;max-height:360px;overflow-y:auto;font-size:14px;line-height:1.7;color:#1c3322;outline:none;transition:border 0.2s,box-shadow 0.2s;word-break:break-word;position:relative;}
.card-note-area .note-editor:focus{border-color:#6a9e6a;box-shadow:0 0 0 3px rgba(80,150,80,0.15);}
.card-note-area .note-editor img{max-width:100%;max-height:300px;border-radius:10px;margin:6px 0;display:block;box-shadow:0 2px 8px rgba(0,0,0,0.08);background:#f0f5f0;border:2px solid transparent;transition:border 0.2s,box-shadow 0.2s;cursor:pointer;}
.card-note-area .note-editor img.selected{border-color:#4f8a4f;box-shadow:0 0 0 3px rgba(79,138,79,0.25),0 4px 16px rgba(0,0,0,0.12);}
.card-note-area .note-editor .note-placeholder{color:#8aaa8a;font-style:italic;}
.card-note-area .img-resize-control{display:none;align-items:center;gap:12px;margin-top:8px;padding:6px 14px;background:#edf5ed;border-radius:30px;border:1px solid #c2ddc2;font-size:13px;color:#2a5a2a;flex-wrap:wrap;}
.card-note-area .img-resize-control.show{display:flex;}
.card-note-area .img-resize-control input[type="range"]{flex:1;min-width:80px;accent-color:#4f8a4f;height:4px;cursor:pointer;}
.card-note-area .img-resize-control .size-val{font-weight:600;min-width:44px;text-align:center;}
.card-note-area .img-resize-control .btn-reset-size{background:#dcebd9;border:none;padding:2px 14px;border-radius:30px;font-size:12px;cursor:pointer;color:#1e4a2a;transition:background 0.2s;}
.card-note-area .note-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
.card-note-area .note-actions button{background:#dcebd9;border:none;padding:4px 18px;border-radius:30px;font-size:13px;cursor:pointer;color:#1e4a2a;font-weight:500;transition:background 0.2s,transform 0.1s;}
.card-note-area .note-actions .btn-insert-img{background:#d4d9c4;color:#2f4a2f;}
.card-note-area .note-actions .note-save{background:#a8c8a8;color:#1a3a1a;}
.card-note-area .note-actions .note-clear{background:#e6d6d6;color:#6a3a3a;}
.card-note-area .note-actions .note-size-hint{font-size:12px;color:#6f8f6f;margin-left:auto;opacity:0.7;}
@keyframes fadeSlide{0%{opacity:0;transform:translateY(-6px);}100%{opacity:1;transform:translateY(0);}}
.no-result{text-align:center;padding:50px 20px;color:#4f7a4f;font-size:17px;background:#e6f3e6;border-radius:24px;}
.footer-note{max-width:1200px;margin:30px auto 10px auto;text-align:center;font-size:13px;color:#5f7f5f;border-top:1px solid #cce0cc;padding-top:18px;}
.footer-note kbd{background:#dce8dc;padding:0 8px;border-radius:4px;font-size:12px;}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2a4a2a;color:#f0faf0;padding:10px 28px;border-radius:40px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,0.25);z-index:999;opacity:0;transition:opacity 0.4s,transform 0.4s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media (max-width:640px){.app-header{flex-direction:column;align-items:stretch;padding:14px 18px;}.app-header h1{font-size:20px;}.filter-bar{flex-direction:column;align-items:stretch;}.single-mode-bar{flex-direction:column;align-items:stretch;text-align:center;padding:10px 14px;}.single-mode-bar .mode-left{justify-content:center;}.card-header{padding:14px 16px 4px 16px;}.card-question{padding:4px 16px 10px 16px;font-size:14.5px;}.card-answer{padding:0 16px 6px 16px;}.card-answer .answer-inner{padding:14px 16px;font-size:14px;}.card-note-area{padding:0 16px 14px 16px;}.card-grid.single-mode{max-width:100%;}}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#dce8dc;border-radius:10px;}
::-webkit-scrollbar-thumb{background:#8fbe8f;border-radius:10px;}
/* ================= 返回主页按钮 ================= */
.app-header .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.back-home {
    display: inline-flex;

    .app-header .header-left { gap: 10px; }

/* 触摸设备：按下反馈（悬停效果已在支持鼠标的设备上保留） */

</style>

<body>

<div class="app-header">
  <div class="header-left">
    <a href="../index.html" class="back-home" title="返回主页">
        <span class="arrow">⬅</span><span>主页</span>
    </a>
    <h1>📐 南开经济学 · 计算专项记忆卡</h1>
</div>
  <div class="stats">
    <span>📚 总卡 <span class="num" id="totalCards">0</span></span>
    <span>⭐ 收藏 <span class="num" id="favCount">0</span></span>
    <span id="learnedTag" style="display:none">🧩 已学 <span class="num" id="learnedCount">0</span></span>
  </div>
</div>

<div class="filter-bar" id="filterBar">
  <label for="filterMajor">专项</label>
  <select id="filterMajor"></select>
  <label for="filterSub">细分专项</label>
  <select id="filterSub"></select>
  <label for="filterFav">⭐ 收藏</label>
  <select id="filterFav">
    <option value="all">全部</option>
    <option value="fav">仅收藏</option>
  </select>
  <input type="text" id="filterSearch" placeholder="搜索题目关键词…" style="flex:1;min-width:140px;" />
  <button class="btn-clear-filter" id="clearFilterBtn">重置筛选</button>
  <button class="btn-random" id="randomBtn">🎲 随机抽查</button>
</div>

<div class="single-mode-bar" id="singleModeBar">
  <div class="mode-left">
    <button class="btn-nav" id="prevCardBtn" title="上一张">◀</button>
    <span class="card-id-badge" id="singleCardBadge">卡片 #1</span>
    <button class="btn-nav" id="nextCardBtn" title="下一张">▶</button>
    <span class="mode-hint">抽查中</span>
  </div>
  <button class="btn-exit-single" id="exitSingleBtn" title="退出抽查模式">✕</button>
</div>

<div class="card-grid" id="cardGrid"></div>

<div class="footer-note">
  点击题目区域可展开/收起答案 · 点击 ⭐ 收藏 · 点击 📝 添加笔记 · 点击 ✏️ 编辑题目/答案
  <span style="display:block;font-size:12px;color:#8aaa8a;margin-top:4px;">
    按 <kbd>R</kbd> 键快速随机抽查 · 抽查模式中 ◀ ▶ 切换卡片 · 点击笔记图片可调大小
  </span>
</div>

<div class="toast" id="toast"></div>

<script src="../shared/escape.js"></script>
<script>

const cardData = [
{id:'m1',special:'微观·消费者最优选择',qid:'A1 ★★',question:'假设某君的收入为 M、商品价格为 Px、Py 和消费品的效用函数 U=f(x,y) 为已知，请给出效用极大化所需条件。假如他只消费两种消费品，他是否必然总是同时买进这两种商品？为什么？',answer:`**考察知识点**：消费者效用最大化、拉格朗日法、角点解、完全替代品。\n**思路**：构造拉格朗日函数求一阶条件；举例说明完全替代品可能角点解。\n**答案**：效用最大化条件为 MUx/MUy=fx/fy=Px/Py；消费者不必然同时买进两种商品。例如 U=x+y 且价格不等时，会全部购买较便宜商品。\n##**详解**\n（1）消费者的效用最大化可写为：\n$$max f(x,y)，s.t. P_x·x + P_y·y = M\n构造拉格朗日函数为：\n$$L = f(x,y) − λ(P_x·x + P_y·y − M)\n效用最大化的一阶条件为：\n$$∂L/∂x = f_x − λP_x = 0\n$$∂L/∂y = f_y − λP_y = 0\n因此效用最大化必须满足的条件为：\n$$MU_x/MU_y = f_x/f_y = P_x/P_y\n（2）消费者并不必然同时买进两种商品。\n例如，如果效用函数为：\n$$U = x + y\n即两种商品是完全替代品，且两者的价格不相等，此时消费者会将所有的收入都用来购买价格较低的那种商品，此时存在角点解。\n**【提示】**效用最大化的条件 MU_x/MU_y = f_x/f_y = P_x/P_y 只适用于边际替代率递减的效用函数。`},
{id:'m2',special:'微观·消费者最优选择',qid:'A2 ★★★',question:'假设一个消费者的效用函数为 u(x1,x2)=min{ax1,bx2}，收入为 m，商品1和商品2的价格分别是 p1 和 p2。（1）求出该消费者的最优选择。（2）如果对商品1征收从量税 t，请用图分析由此产生的替代效应和收入效应。（3）如果政府采用收入所得税的方式得到上述的税收收入，那么与征收从量税相比，该消费者的境况是变好，变坏，还是没有变化？请给出解释。（中山大学考题）',answer:`**考察知识点**：完全互补品、从量税、替代效应与收入效应、税收方式比较。\n**思路**：完全互补品满足 ax1=bx2，代入预算约束；从量税等价于价格上升；比较所得税与从量税。\n**答案**：（1）x1=bm/(bp1+ap2)，x2=am/(bp1+ap2)。（2）替代效应为0，需求变动完全归因于收入效应。（3）没有变化；完全互补品下两种征税方式对消费者影响相同。\n**【分析】**根据给定的效用函数可判断两种商品为完全互补品，因此要结合完全互补品这种特例来进行分析。第三小问，可参见范里安《微观经济学：现代观点》第5章，对税收类型的选择进行了分析，范里安第 99 页。\n##**详解**\n（1）对于完全互补品，消费者的最优选择点满足：\n$$ax₁ = bx₂\n将 ax₁ = bx₂ 代入预算约束方程 p₁x₁ + p₂x₂ = m，可得出商品1和商品2的最优选择：\n$$x₁ = bm/(bp₁+ap₂)，x₂ = am/(bp₁+ap₂)\n（2）对商品1征收从量税 t，则相当于将商品1的价格从原来的 p₁ 变为 p₁+t。如下图所示，此时替代效应为零，需求变动完全归因于收入效应。\n【此处有图示】\n（3）如果政府采用收入所得税的方式得到上述的税收收入，与征收从量税相比，该消费者的境况没有变化。分析如下：\n征收从量税后消费者的最优消费组合满足：\n$$ax₁ = bx₂\n$$(p₁+t)x₁ + p₂x₂ = m\n解得：\n$$x₁ = bm/(bp₁+ap₂+bt)，x₂ = am/(bp₁+ap₂+bt)\n政府的税收收入：\n$$T = t·x₁ = bmt/(bp₁+ap₂+bt)\n如果政府采取征收所得税的方式，则消费者的收入减少 T，新的最优消费组合应满足：\n$$ax₁′ = bx₂′\n$$p₁x₁′ + p₂x₂′ = m − T = (amp₂+bmp₁)/(bp₁+ap₂+bt)\n解得：\n$$x₁′ = bm/(bp₁+ap₂+bt) = x₁，x₂′ = am/(bp₁+ap₂+bt) = x₂\n从上述分析可以看出，对于完全互补品来说，不论政府采取什么样的征税方式，对消费者的影响都是一样的。`},
{id:'m3',special:'微观·消费者最优选择',qid:'A3 ★★',question:'假设某消费者的效用函数具有以下形式：U(X,Y)=ln(3+X)+ln(Y−2)，其中，X≥0，Y>2。商品 X 的价格为 p，Y 的价格为 q，消费者的收入为 I。（1）求出消费者关于 X 和 Y 的最优消费量，并说明 I≥3p+2q 是使得 X 和 Y 存在有效需求量的必备条件？（2）求出消费者对 X 和 Y 的需求收入弹性，X 和 Y 是否属于奢侈品？（3）X 和 Y 是否有劣质品或吉芬商品的情形？请给出严格的证明。（北大光华考题）',answer:`**考察知识点**：对数效用、需求收入弹性、正常品/奢侈品。\n**思路**：拉格朗日法求需求函数；求收入弹性；判断导数符号。\n**答案**：（1）X=(I−2q−3p)/(2p)，Y=(I+2q+3p)/(2q)；X≥0 要求 I≥3p+2q。（2）eI(X)=I/(I−2q−3p)>1，X 为奢侈品；eI(Y)=I/(I+2q+3p)<1，Y 为必需品。（3）∂X/∂I=1/(2p)>0，∂Y/∂I=1/(2q)>0，均为正常品，无劣质品或吉芬商品。\n##**详解**\n（1）消费者面临的问题可以表示为：\n$$max ln(X+3) + ln(Y−2)，s.t. pX + qY = I\n构造拉格朗日函数为：\n$$L = ln(X+3) + ln(Y−2) − λ(pX + qY − I)\n消费者效用最大化的一阶条件为：\n$$∂L/∂X = 1/(X+3) − λp = 0\n$$∂L/∂Y = 1/(Y−2) − λq = 0\n$$∂L/∂λ = I − pX − qY = 0\n联立解得：\n$$X = (I−2q−3p)/(2p)，Y = (I+2q+3p)/(2q)\n因为 X ≥ 0，所以 X = (I−2q−3p)/(2p) ≥ 0，即 I ≥ 3p+2q 是使得 X 和 Y 存在有效需求量的必备条件。\n（2）消费者对 X 和 Y 的需求收入弹性分别为：\n$$e_I(X) = (dX/dI)·(I/X) = 1/(2p) · I/(I−2q−3p) = I/(I−2q−3p) > 1\n$$e_I(Y) = (dY/dI)·(I/Y) = 1/(2q) · I/(I+2q+3p) = I/(I+2q+3p) < 1\n所以 X 为奢侈品，Y 为必需品。\n（3）由于\n$$∂X/∂I = 1/(2p) > 0，∂Y/∂I = 1/(2q) > 0\n这表明 X 和 Y 的需求量都随收入的增加而增加，故两者都为正常品。`},
{id:'m4',special:'微观·消费者最优选择',qid:'A4 ★★★',question:'假设某消费者的效用函数是 u(x,y)=y+12x−x²/2，其中 x 和 y 的价格分别为 px、py，该消费者收入为 m。（1）求此人对 x 的需求；（2）如果此人将消费3单位的 x，他能得到多少效用？（3）如果 x 的价格是9，此人对 x 的需求价格弹性是多少？（北大考题）',answer:`**考察知识点**：拟线性偏好、需求函数、需求价格弹性。\n**思路**：用预算约束消去 y，求一阶条件；代入求效用和弹性。\n**答案**：（1）x=12−px/py。（2）u=m/py+4.5。（3）ε=px/(12py−px)；当 px=9 时 ε=3/(4py−3)。\n##**详解**\n（1）效用最大化问题为：\n$$max y + 12x − x²/2，s.t. p_x·x + p_y·y = m\n利用预算约束消去 y，则有：\n$$max 12x − x²/2 + m/p_y − (p_x/p_y)·x\n效用最大化的一阶条件为：\n$$12 − x − p_x/p_y = 0\n则此人对 x 的需求为：\n$$x = 12 − p_x/p_y\n**【注】**这里也可以自行验证边际替代率是否递减，MRS_xy = −dy/dx = MU_x/MU_y = 12 − x，且 dMRS_xy/dx = −1 < 0。\n（2）若 x = 12 − p_x/p_y = 3，则 p_x/p_y = 9，此时：\n$$y = m/p_y − 27\n代入可得消费者得到的效用为：\n$$u = m/p_y + 4.5\n（3）由 x 的需求 x = 12 − p_x/p_y 可得 x 的需求价格弹性：\n$$ε = −(dx/dp_x)·(p_x/x) = 1/p_y · p_x/(12 − p_x/p_y) = p_x/(12p_y − p_x)\n代入 p_x = 9，得需求价格弹性：\n$$ε = 3/(4p_y − 3)\n**【提示】**本题第（1）问给出了求最优化选择的另外一种方法，将有约束的多元函数极值问题化为无约束的一元函数极值问题。\n**【练习】**用这一方法求柯布-道格拉斯、完全替代、拟线性和凹偏好的需求函数。`},
{id:'m5',special:'微观·消费者最优选择',qid:'A5 ★★★',question:'假设小明的效用函数为 U(x,y)=x¹²y³⁸，其中 x 为食品消费量，y 为其它商品消费量，且该居民的收入为5000元，x 与 y 的价格均为10元，请计算：（1）该居民的最优消费组合。（2）若政府提供给该居民2000元的食品兑换券，此兑换券只能用于食品消费，则该居民的消费组合有何变化？（对外经贸 2015 年考题）',answer:`**考察知识点**：柯布-道格拉斯效用、预算约束、实物补贴/兑换券。\n**思路**：拉格朗日法或边际替代率条件；兑换券改变预算约束，分段讨论。\n**答案**：（1）x=120，y=380。（2）最终消费组合为 x=200，y=500。\n##**详解**\n（1）**【法一】**利用消费者效用最大化的条件。\n由题意可得消费预算约束方程为：\n$$10x + 10y = 5000\n消费者效用最大化的均衡条件为：\n$$MRS_xy = MU_x/MU_y = (12x¹¹y³⁸)/(38x¹²y³⁷) = 6y/(19x) = p_x/p_y\n联立上述条件可得：\n$$x = 120，y = 380\n**【法二】**拉格朗日法求解。\n此时消费者效用最大化的问题为：\n$$max x¹²y³⁸，s.t. 10x + 10y = 5000\n构造拉格朗日函数 L = x¹²y³⁸ − λ(10x + 10y − 5000)，由一阶条件可得：\n$$∂L/∂x = 12x¹¹y³⁸ − 10λ = 0\n$$∂L/∂y = 38x¹²y³⁷ − 10λ = 0\n$$∂L/∂λ = 5000 − 10x − 10y = 0\n解得 x = 120，y = 380。\n（2）政府提供2000元的食品兑换券，此时消费者可以不用减少其他商品的消费就可以得到200单位食品，因此消费者效用最大化时，食品消费量不会低于200单位。\n此时该居民的预算约束方程为：\n$$y = 500，0 ≤ x ≤ 200\n$$10x + 10y = 7000，x > 200\n① 当 x > 200 时，将效用最大化的均衡条件 6y/(19x) = p_x/p_y 代入约束预算方程 10x + 10y = 7000，可得 x = 168，y = 532。显然此时的消费点在预算约束外，因此 x = 168，y = 532 不是消费者的最优点。\n② 当 0 ≤ x ≤ 200 时，此时为实现最大效用，消费者会选择用2000元食品兑换券全部购买食品，因此此时的最优消费点为 x = 200，y = 500。\n综上所述，该居民追求效用最大化，最终消费组合为 x = 200，y = 500。`},
{id:'m6',special:'微观·消费者最优选择',qid:'A6 ★★★',question:'已知市场价格为 Px=2，Py=1，消费者收入为20，消费者的效用函数是 U(x,y)=xy。（1）写出消费者的预算线并求解消费者的选择；（2）现在厂家促销，消费者购买前两个单位的商品 x 时享受半价，之后回到原价，写出消费者的新的预算线；（3）写出消费者的新最优解。（上财 2018 年考题）',answer:`**考察知识点**：预算线、分段定价、最优选择。\n**思路**：先求一般需求；再根据促销写分段预算线；分区间讨论。\n**答案**：（1）预算线 2x+y=20，选择 x=5，y=10。（2）新预算线：0≤x≤2 时 x+y=20；x>2 时 2x+y=22。（3）最优解 x=5.5，y=11。\n##**详解**\n消费者效用最大化问题为：\n$$max xy，s.t. P_x·x + P_y·y = m\n构造拉格朗日函数 L = xy − λ(P_x·x + P_y·y − 20)，一阶条件为：\n$$∂L/∂x = y − λP_x = 0，∂L/∂y = x − λP_y = 0，∂L/∂λ = 20 − P_x·x − P_y·y = 0\n解得需求函数：\n$$x = m/(2P_x)，y = m/(2P_y)\n（1）此时消费者的预算约束为：\n$$2x + y = 20\n代入 P_x = 2，P_y = 1，m = 20，解得此时消费者最优选择：x = 5，y = 10。\n（2）当 0 ≤ x ≤ 2 时，P_x′ = 1，此时消费者预算约束为 x + y = 20。\n当 x > 2 时，P_x = 2，此时消费者预算约束为 1×2 + 2(x−2) + y = 20，整理得 2x + y = 22。\n综上，新的预算线方程为：\n$$x + y = 20，0 ≤ x ≤ 2\n$$2x + y = 22，x > 2\n（3）当 0 ≤ x ≤ 2 时，代入 P_x′ = 1，P_y = 1，m = 20，解得此时最优选择 x = 10，y = 10（舍去）。\n当 x > 2 时，代入 P_x = 2，P_y = 1，m′ = 22，解得此时最优选择 x = 5.5，y = 11（符合题意）。\n综上，此时消费者的最优解为：x = 5.5，y = 11。`},
{id:'m7',special:'微观·消费者最优选择',qid:'A7 ★★★',question:'A县冬季取暖主要依靠消耗大量的天然气，为鼓励居民节约资源，该县天然气公司对天然气采取阶梯定价：家庭每月消费不超过100立方米的部分按照每立方米2元计价；超过100立方米的部分按照每立方米2.5元计价。令 x1 为天然气消费量，x2 为其他商品消费金额。（1）请写出月收入1000元家庭的预算方程，并在横轴为天然气消费量、纵轴为其他商品消费金额的坐标系中画出预算线（标明截距值）。（2）假设该家庭的效用函数为 U(x1,x2)=min(x1,x2)，请计算该家庭每月消费的天然气数量。（对外经贸 2023 年考题）',answer:`**考察知识点**：阶梯定价、分段预算线、完全互补品。\n**思路**：分段写预算约束；完全互补品满足 x1=x2，分区间讨论。\n**答案**：（1）预算约束：0≤x1≤100 时 2x1+x2=1000；100<x1≤420 时 2.5x1+x2=1050。横轴截距420，纵轴截距1000。（2）x1=300。\n##**详解**\n（1）由题意可知，商品 x₂ 的价格为1，假设家庭收入为 m = 1000。\n当 0 ≤ x₁ ≤ 100 时，天然气价格 p₁ = 2，此时预算约束为：\n$$2x₁ + x₂ = 1000\n当 x₁ > 100 时，超出部分天然气价格 p₁ = 2.5，此时预算约束为：\n$$2×100 + 2.5(x₁−100) + x₂ = 1000\n整理可得家庭的预算约束为：\n$$2x₁ + x₂ = 1000，0 ≤ x₁ ≤ 100\n$$2.5x₁ + x₂ = 1050，100 < x₁ ≤ 420\n此时预算约束线作图如下，横轴截距为 x₁ = 420，纵轴截距为 x₂ = 1000。\n【此处有图示】\n（2）由于该家庭效用函数为 U(x₁,x₂) = min(x₁,x₂)，为完全互补型偏好，因此效用最大化时满足条件 x₁ = x₂，下面进行分类讨论：\n① 当 0 ≤ x₁ ≤ 100 时，将 x₁ = x₂ 代入预算约束 2x₁ + x₂ = 1000，解得 x₁ = x₂ = 1000/3（舍去）。\n② 当 100 < x₁ ≤ 420 时，将 x₁ = x₂ 代入预算约束 2.5x₁ + x₂ = 1050，解得 x₁ = x₂ = 300，符合条件。\n综上，消费者每月消费的天然气数量 x₁ = 300。\n**【提示】**以上两道题涉及的都是折线形状预算线下消费者最优选择问题，此时需要分类讨论，分别求出不同情况下的最优选择点，并根据预算线的范围排除不符合条件的点。`},
{id:'m8',special:'微观·消费者最优选择',qid:'B1 ★★',question:'效用函数为 u(x1,x2)=min{x2+2x1, x1+2x2}。（1）当 p1/p2 为何值的时候，唯一的最优解是 x1=0？（2）当 p1/p2 为何值的时候，唯一的最优解是 x2=0？',answer:`**考察知识点**：分段线性无差异曲线、角点解。\n**思路**：比较两段无差异曲线斜率与预算线斜率。\n**答案**：（1）p1/p2>2。（2）p1/p2<1/2。\n##**详解**\n令横轴代表 x₁ 的消费数量，纵轴代表 x₂ 的消费数量。\n当 x₂ + 2x₁ < x₁ + 2x₂，即 x₁ < x₂ 时，u(x₁,x₂) = x₂ + 2x₁。\n同理，当 x₂ + 2x₁ ≥ x₁ + 2x₂，即 x₁ ≥ x₂ 时，u(x₁,x₂) = x₁ + 2x₂。\n令 u(x₁,x₂) = x₂ + 2x₁ = a，可得：\n$$x₂ = a − 2x₁，x₁ < x₂\n此时无差异曲线斜率为 −2。\n令 u(x₁,x₂) = x₁ + 2x₂ = a，可得：\n$$x₂ = a/2 − x₁/2，x₁ ≥ x₂\n此时无差异曲线斜率为 −1/2。\n根据已知条件，预算线的斜率为 −p₁/p₂。\n（1）如果预算线斜率绝对值大于2，则 x₁ = 0，所以条件为：\n$$p₁/p₂ > 2\n（2）同理，如果预算线斜率绝对值小于 1/2 更平坦，x₂ = 0，所以条件是：\n$$p₁/p₂ < 1/2\n**【提示】**对于本题效用函数的更多情况：\n如果 p₁/p₂ = 1/2，此时最优选择为预算线 p₁x₁ + p₂x₂ = m 上满足 x₁ ≥ x₂ 的任意一点；\n如果 1/2 < p₁/p₂ < 2，此时的最优选择为拐点，满足 x₂ + 2x₁ = x₁ + 2x₂，即 x₁ = x₂ = m/(p₁+p₂)；\n如果 p₁/p₂ = 2，此时最优选择为预算线 p₁x₁ + p₂x₂ = m 上满足 x₁ < x₂ 的任意一点。\n**【提示】**上财很喜欢考这类题甚至更复杂一些的，大家可以做一下上财同类计算题。`},
{id:'m9',special:'微观·消费者最优选择',qid:'B2 ★',question:'一个消费者消费食油(x1)和大米(x2)，一单位食油的价格是2元加1单位粮票。一单位大米的价格是1元加2单位粮票。此人拥有60元钱和30张粮票。效用函数是 U(x1,x2)=x1x2+10x2。（1）当货币和粮票不能互换的情况下，画出可能的 x1 和 x2 消费集。求出最优消费量。（2）假若存在黑市交易，该消费者可以以一元钱买入或者卖出一单位粮票，在图上画出可能消费集合。求出 x1 和 x2 最优消费量，请问该消费者会购买或者卖出多少粮票？（北大光华 2013 考题）',answer:`**考察知识点**：双重约束、配额、黑市交易、效用最大化。\n**思路**：分别列出货币约束和粮票约束；可互换时合并为单一预算约束。\n**答案**：（1）最优消费量(10,10)。（2）最优 x1=10，x2=20；需用20元钱换取20张粮票。\n##**详解**\n（1）由题意可知，存在两条预算约束线：\n$$2x₁ + x₂ ≤ 60，x₁ + 2x₂ ≤ 30\n由下图可得，只有满足第二个约束条件，即只有消费集 (x₁,x₂) 为预算约束线2与坐标轴围成面积内的点，消费者才能在买得起的同时实现自身效用最大。所以，最优消费点是效用函数与预算约束线2的切点 A 点。\n【此处有图示】\nA 点满足的条件为 x₁ + 2x₂ = 30，代入消费者的效用函数求得最大值，解得 x₁ = 10，x₂ = 10，所以最优消费量为 (10,10)。\n（2）在货币和粮票能按照1:1互换的情况下，钱和粮票已无实质差别，不妨将粮票看成钱，于是该消费者在下图中面临的预算约束线实际上只有1条：\n$$3x₁ + 3x₂ = 90，即 x₁ + x₂ = 30\n此时消费者效用最大化问题为：\n$$max x₁x₂ + 10x₂，s.t. x₁ + x₂ = 30\n上述问题可以转化为：\n$$max U(x₁) = x₁(30−x₁) + 10(30−x₁) = −x₁² + 20x₁ + 300\n由其一阶最大化条件得：\n$$dU/dx₁ = −2x₁ + 20 = 0\n解得 x₁ = 10，x₂ = 20。\n因此在效用最大化时，需要钱的数量为 10×2 + 20×1 = 40 元，需要粮票数量为 10×1 + 20×2 = 50 张。因此，该消费者可用20元钱换取20张粮票从而保证自己的效用最大化。\n【此处有图示】`},
{id:'m10',special:'微观·替代收入效应',qid:'A1 ★★★',question:'小明在A城市的一家企业工作，每期的收入为12个单位，他每月主要消费两种产品 x 和 y。他的效用函数为 U(x,y)=x^0.5y^0.5。A城市的两种产品 x,y 的价格分别是1和1，小明所在的企业往城市B发展，并设立分支机构。上司希望小明到城市B去上班，在城市B，两种产品 x,y 的价格分别为2和1。（1）如果在两个城市，小明的收入相同，问在城市A和城市B对商品X的需求变化是多少，其中有多少可以归结为替代效应，有多少归结为收入效应？（2）小明从城市A到城市B工作，要保证他福利不变，需要对他的收入进行多少补偿？',answer:`**考察知识点**：柯布-道格拉斯需求、斯勒茨基分解、补偿变化。\n**思路**：先求需求；用斯勒茨基补偿收入求替代效应；用支出最小化求补偿。\n**答案**：（1）总效应 −3；替代效应 −1.5；收入效应 −1.5。（2）需补偿 12(√2−1)。\n##**详解**\n（1）由柯布-道格拉斯效用函数的性质可知，小明对 x 和 y 的需求函数分别为：\n$$x = m/(2p_x)，y = m/(2p_y)\n当 p_x = p_y = 1，m = 12 时，x = 6，即小明在城市A每月对商品 x 的需求为6。\n当 p_x′ = 2，p_y = 1，m = 12 时，x′ = 3，即小明在城市B每月对商品 x 的需求为3。\n当商品 x 的价格变为2时，为了使原先的消费束仍能支付得起，收入必须作出变动，即要使购买力保持不变，所需的收入水平为：\n$$m′ = m + Δp_x·x = 12 + 1×6 = 18\n代入 p_x′ = 2，p_y = 1，m′ = 18 到需求函数 x = m/(2p_x) 得：\n$$x″ = 4.5\n因此，替代效应 = x″ − x = 4.5 − 6 = −1.5，收入效应 = x′ − x″ = 3 − 4.5 = −1.5。\n总效应 = x′ − x = 3 − 6 = −3。\n（2）本小题要求的是保证小明的效用水平不变，即要给予消费者足够多的货币补偿使他恰好能够回到原先的无差异曲线，从而保证福利不变。\n初始效用水平：\n$$U = √(6×6) = 6\n此时小明面临的问题为：\n$$min 2x + y，s.t. √(xy) = 6\n构造拉格朗日函数并由一阶条件可得：\n$$x″ = 3√2，y″ = 6√2\n此时收入水平：\n$$m″ = 2x″ + y″ = 12√2\n需要补偿的收入为：\n$$Δm = m″ − m = 12√2 − 12 = 12(√2 − 1)`},
{id:'m11',special:'微观·替代收入效应',qid:'A2 ★★★',question:'某消费者效用函数为 U=xy，消费者初始收入 m=100，如果商品 x 的价格由 px=2 下降为 px′=1，求：（1）价格变动对商品 x 的斯勒茨基替代效应和收入效应；（2）价格变动对商品 x 的希克斯替代效应和收入效应。',answer:`**考察知识点**：斯勒茨基分解、希克斯分解、柯布-道格拉斯。\n**思路**：求初始/最终消费；斯勒茨基补偿收入；希克斯补偿保持效用不变。\n**答案**：（1）斯勒茨基替代效应12.5，收入效应12.5，总效应25。（2）希克斯替代效应 25(√2−1)，收入效应 25(2−√2)，总效应25。\n##**详解**\n由柯布-道格拉斯效用函数的基本结论可知，两种商品的需求函数分别为：\n$$x = m/(2p_x)，y = m/(2p_y)\n（1）当 p_x = 2 时，商品 x 初始消费量：\n$$x₁ = 100/(2×2) = 25\n当 p_x′ = 1 时，商品 x 最终消费量：\n$$x₂ = 100/(2×1) = 50\n在新的价格水平下，消费者能消费得起初始消费束所需要的收入：\n$$m′ = m + Δp_x·x₁ = 100 + (1−2)×25 = 75\n在收入 m′ = 75，p_x′ = 1 时，消费者对商品 x 的需求量：\n$$x₃ = 75/(2×1) = 37.5\n因此斯勒茨基替代效应 = x₃ − x₁ = 37.5 − 25 = 12.5。\n收入效应 = x₂ − x₃ = 50 − 37.5 = 12.5。\n总效应 = x₂ − x₁ = 50 − 25 = 25。\n（2）假设商品 y 的价格为 p_y。\n当商品 x 和 y 的价格分别为2和 p_y 时，消费者初始消费束为：\n$$x₁ = 100/(2×2) = 25，y₁ = 50/p_y\n初始效用水平：\n$$U₁ = x₁y₁ = 1250/p_y\n当商品 x 和 y 的价格分别为1和 p_y 时，消费者最终消费束为：\n$$x₂ = 100/(2×1) = 50，y₂ = 50/p_y\n为求希克斯替代效应，消费者面临的问题为：\n$$min x + p_y·y\n$$s.t. xy = 1250/p_y\n构造拉格朗日函数并由一阶条件可以解得：\n$$x₃′ = 25√2，y₃ = 25√2/p_y\n因此希克斯替代效应 = x₃′ − x₁ = 25√2 − 25 = 25(√2 − 1)。\n收入效应 = x₂ − x₃′ = 50 − 25√2 = 25(2 − √2)。\n总效应 = x₂ − x₁ = 50 − 25 = 25。\n**【提示】**本题的新颖之处在于题目并没有给出另外一种商品的价格，同时由于柯布-道格拉斯存在的性质（商品的需求量只与自身价格和收入相关，与其他商品价格无关），因此即使本题没有给出商品 y 的价格，也可以求出商品 x 的替代效应和收入效应。`},
{id:'m12',special:'微观·替代收入效应',qid:'A3 ★★★',question:'假设小明只喜欢吃用两片奶酪(C)配三片面包(B)的三明治。（1）用B和C来定义这种效用函数，并求小明对B和C的需求函数。（2）如果价格 PB=2，PC=2，并且小明能花在食品上面的收入为72元，求小明的最优选择。（3）现在假定B的价格上涨为 PB′=4，小明的最优决策现在是什么？（4）求解B价格变化的斯勒茨基收入效应、替代效应，用图形表示。（5）求解小明的收入提供曲线和商品B的恩格尔曲线。',answer:`**考察知识点**：完全互补品、需求函数、斯勒茨基分解、恩格尔曲线。\n**思路**：构造 U=min{C/2,B/3}；最优满足 C/2=B/3；斯勒茨基替代效应为0。\n**答案**：（1）U=min{C/2,B/3}，B=3M/(3PB+2PC)，C=2M/(3PB+2PC)。（2）B=21.6，C=14.4。（3）B′=13.5，C′=9。（4）替代效应0，收入效应 −8.1。（5）收入提供曲线 C=2B/3；B的恩格尔曲线 B=3M/(3PB+2PC)。\n##**详解**\n（1）对于小明来说，奶酪和面包是完全互补品，效用函数为：\n$$U(C,B) = min{C/2, B/3}\n小明的效用最大化问题为：\n$$max min{C/2, B/3}，s.t. P_B·B + P_C·C = M\n效用最大化时满足 C/2 = B/3，代入预算方程，解得需求函数为：\n$$B = 3M/(3P_B + 2P_C)，C = 2M/(3P_B + 2P_C)\n（2）当 P_B = 2，P_C = 2，M = 72 时，代入（1）中需求函数：\n$$B = 21.6，C = 14.4\n（3）当 P_B′ = 4，P_C = 2，M = 72 时，代入需求函数：\n$$B′ = 13.5，C′ = 9\n（4）在新的价格水平下，购买初始消费束需要的收入水平：\n$$m′ = 4×21.6 + 2×14.4 = 115.2\n此时消费者最优化问题为：\n$$max min{C/2, B/3}，s.t. 4B + 2C = 115.2\n解得 B″ = 21.6，C″ = 14.4，则最小支出 M = 21.6×4 + 14.4×2 = 115.2。\n可见，替代效应 = B″ − B = 21.6 − 21.6 = 0，收入效应 = B′ − B″ = 13.5 − 21.6 = −8.1。\n【此处有图示】\n（5）由（1）可知，小明最优选择点为无差异曲线的拐点，此时效用最大化满足 C/2 = B/3，整理可得：\n$$C = 2B/3\n此即为小明的收入提供曲线。\n小明对 B 的消费函数为 B = 3M/(3P_B + 2P_C)，此即为 B 的恩格尔曲线，当表示恩格尔曲线时，P_B、P_C 外生给定。\n**【提示】**本题的难点在于根据题设条件写出消费者效用函数，关于完全互补品效用函数如何构造，大家可以结合教材进行回顾。如果老师想在此类题制造难度，一般也就是要大家自己根据题意写效用函数。同时，关于特殊商品：完全互补品、完全替代品、凹偏好，它们的替代效应和收入效应是怎样的，希望大家能借这道题结合课本进行回顾分析。\n如何根据题意自己构造完全互补品的效用函数（以本题为例）：假设效用函数的一般形式为 U = min(mC, nB)，本题中小明总是两片奶酪(C)搭配三片面包(B)一起消费，也就是最优选择点的消费量为 C = 2，B = 3，又由于最优选择点处满足 mC = nB，所以此时 2m = 3n。令 n = 2，则 m = 3，所以小明的效用函数为 U = min(3C, 2B)，该效用函数与答案中给的 U = min{C/2, B/3} 是等价的。`},
{id:'m13',special:'微观·替代收入效应',qid:'A4 ★★★',question:'某人的效用函数是 U(x1,x2)=lnx1+x2，他的收入 m=100。最初的商品价格向量是 p=(4,2)，假设现在价格变化为 p′=(1,2)。求：（1）商品1和商品2的斯勒茨基替代效应、收入效应与总效应；（2）CV、EV 和 ΔCS。',answer:`**考察知识点**：拟线性偏好、斯勒茨基分解、补偿变化、等价变化、消费者剩余。\n**思路**：求需求函数；拟线性偏好商品1收入效应为0；用支出函数求CV、EV。\n**答案**：（1）商品1：替代效应3/2，收入效应0，总效应3/2；商品2：替代效应−0.75，收入效应0.75，总效应0。（2）CV=−4ln2，EV=−4ln2，ΔCS=4ln2。\n##**详解**\n（1）假设商品1和商品2的价格分别为 p₁、p₂，收入为 m。\n消费者的效用最大化问题为：\n$$max ln x₁ + x₂，s.t. p₁x₁ + p₂x₂ = m\n构造拉格朗日函数可求解得：\n$$x₁ = p₂/p₁，x₂ = m/p₂ − 1\n代入 p₁ = 4，p₂ = 2，m = 100，可得价格变化前商品的消费量：\n$$x₁ = 1/2，x₂ = 49\n代入 p₁′ = 1，p₂ = 2，m = 100，可得价格变化后商品1的消费量：\n$$x₁′ = 2，x₂′ = 49\n价格变化后，为消费得起初始消费束所需要的收入：\n$$m′ = m + Δp₁·x₁ = 100 − 3×(1/2) = 98.5\n代入 p₁′ = 1，p₂ = 2，m′ = 98.5，可得此时消费量：\n$$x₁″ = 2，x₂″ = 48.25\n所以商品1的替代效应 = x₁″ − x₁ = 3/2，收入效应 = x₁′ − x₁″ = 0，总效应 = x₁′ − x₁ = 3/2。\n商品2的替代效应 = x₂″ − x₂ = −0.75，收入效应 = x₂′ − x₂″ = 0.75，总效应 = x₂′ − x₂ = 0。\n（2）① 求补偿变化 CV。\n由（1）可知，价格变化前商品的消费量 x₁ = 1/2，x₂ = 49，此时的效用：\n$$U = 49 − ln2\n此时消费者在新的价格水平下为维持价格变动前的效用水平所愿意付出的最小支出量问题可以描述为：\n$$min x₁ + 2x₂\n$$s.t. ln x₁ + x₂ = 49 − ln2\n构造拉格朗日函数并由一阶条件解得：\n$$x₁″ = 2，x₂″ = 49 − 2ln2\n此时的最小支出：\n$$m″ = x₁″ + 2x₂″ = 100 − 4ln2\n补偿变化：\n$$CV = m″ − m = −4ln2\n② 求等价变化 EV。\n由（1）可知，价格变化后商品1的消费量 x₁′ = 2，x₂′ = 49，效用水平：\n$$U′ = 49 + ln2\n此时消费者在初始价格水平下为维持价格变动后的效用水平所愿意付出的最小支出量问题可以描述为：\n$$min 4x₁ + 2x₂\n$$s.t. ln x₁ + x₂ = 49 + ln2\n构造拉格朗日函数可求解得：\n$$x₁‴ = 0.5，x₂‴ = 49 + 2ln2\n此时的最小支出：\n$$m‴ = 4x₁‴ + 2x₂‴ = 100 + 4ln2\n等价变化：\n$$EV = m − m‴ = −4ln2\n③ 求消费者剩余的变化 ΔCS。\n$$ΔCS = ∫[1,4] (2/p₁) dp₁ = 2ln4 − 2ln1 = 4ln2\n**【提示】**这里补充利用支出函数求 CV 和 EV 的方法。\n效用函数 U(x₁,x₂) = ln x₁ + x₂；需求函数 x₁ = p₂/p₁，x₂ = m/p₂ − 1。\n所以间接效用函数 V = ln(p₂/p₁) + m/p₂ − 1，支出函数 E = (1 + U − ln(p₂/p₁))·p₂。\n初始效用水平 U = 49 − ln2，价格变化后的效用水平 U′ = 49 + ln2。\n补偿变化：\n$$CV = E(p₁′,p₂,U) − E(p₁,p₂,U) = 2×(1+49−ln2−ln2) − 100 = −4ln2\n等价变化：\n$$EV = E(p₁,p₂,U) − E(p₁,p₂,U′) = 100 − 2×(50 + 2ln2) = −4ln2\n**【提示】**补偿变化 CV 是价格变化之后使消费者回复到初始无差异曲线上所必须的收入变化；等价变化 EV 是价格变化以前必须从消费者那里取走多少货币，才能使他的境况同价格变化以后一样好。总结起来：补偿变化——新价格原效用；等价变化——原价格新效用。\n**【提示】**本题验证了拟线性偏好的两个性质，形式为 u = v(x₁) + x₂ 的拟线性偏好：（1）商品1的全部需求变动都归因于替代效应，收入效应等于0；（2）补偿变化、等价变化、消费者剩余变化量的绝对值是相同的。\n**【提示】**CV 和 EV 的正负号有其自身的经济学含义，并不是说二者总是为正。\n**【提示】**在 x₁ 和 x₂ 两种商品中，商品 x₁ 更符合生活必需品的特征。原因如下：效用函数 U = ln x₁ + x₂ 对应拟线性偏好，通常指消费者对一种商品 x₂ 的喜好明显，而对另一种商品 x₁ 的喜好不明显，因为商品 x₁ 的需求量与收入无关。`},
{id:'m14',special:'微观·替代收入效应',qid:'A5 ★★★',question:'假设某个学生的月收入为 m=1000 元，他对面包的需求函数为 x=20/p+1000/m，面包的价格为 p=4。（1）当价格从4上涨到 p′=5 时，为使该学生仍买得起原来的面包消费量，他的收入应增加多少？（2）请计算斯勒茨基替代效应。（3）请计算收入效应。',answer:`**考察知识点**：斯勒茨基分解、需求函数直接给定。\n**思路**：按定义计算初始消费、补偿收入、替代效应和收入效应。\n**答案**：（1）收入应增加6。（2）斯勒茨基替代效应约 −1.006。（3）收入效应约 0.006。\n##**详解**\n（1）根据该学生对面包的需求函数 x = 20/p + 1000/m。\n当 m = 1000，p = 4 时，该学生对面包的需求量为：\n$$x = 20/4 + 1000/1000 = 6\n当价格从4上涨到5，为使其仍买得起原来的面包消费量，收入应增加：\n$$Δm = x·Δp = 6×(5−4) = 6\n为使该学生仍买得起原来的面包消费量，收入水平为：\n$$m′ = m + Δm = 1000 + 6 = 1006\n将 m′ = 1006，p′ = 5 代入需求函数可得：\n$$x′ = x(p′,m′) = 20/5 + 1000/1006 ≈ 4.994\n所以，斯勒茨基替代效应为：\n$$Δx′ = x(p′,m′) − x(p,m) = x′ − x = 4.994 − 6 = −1.006\n（3）将 m = 1000，p′ = 5 代入需求函数可得：\n$$x″ = x(p′,m) = 20/5 + 1000/1000 = 5\n所以，斯勒茨基收入效应为：\n$$Δx″ = x(p′,m) − x(p′,m′) = x″ − x′ = 5 − 4.994 = 0.006\n**【提示】**本题的新颖之处在于题目并没有给消费者的效用函数，而是直接给的需求函数，此时要紧扣斯勒茨基替代效应和收入效应的定义来求解。`},
{id:'m15',special:'微观·替代收入效应',qid:'A6 ★★★',question:'某人的效用函数是 u(x1,x2)=x1x2，他的收入 m=100。最初的商品价格是 p=(1,1)，假设现在价格变化为 p′=(1/4,1)。计算 EV、CV 和 ΔCS，比较计算结果并作简明的解释。',answer:`**考察知识点**：柯布-道格拉斯、等价变化、补偿变化、消费者剩余。\n**思路**：求间接效用和支出函数；计算EV、CV；积分求CS变化。\n**答案**：EV=−100，CV=−50，ΔCS=100ln2；三者不等价，|CV|≤|ΔCS|≤|EV|。\n##**详解**\n此时消费者的效用最大化问题为：\n$$max x₁x₂，s.t. p₁x₁ + p₂x₂ = m\n构造拉格朗日函数并由一阶条件可以解得需求函数为：\n$$x₁ = m/(2p₁)，x₂ = m/(2p₂)\n因此间接效用函数：\n$$V(p₁,p₂,m) = m²/(4p₁p₂)\n支出函数：\n$$E(p₁,p₂,U) = 2√(p₁p₂U)\n当 p = (1,1)，m = 100 时：\n$$x₁ = 50，x₂ = 50，U = 2500\n当 p′ = (1/4,1)，m = 100 时：\n$$x₁′ = 200，x₂′ = 50，U′ = 10000\n等价变化：\n$$EV = E(p₁,p₂,U′) − E(p₁,p₂,U) = 2√(1×1×10000) − 100 = −100\n补偿变化：\n$$CV = E(p₁′,p₂,U) − E(p₁,p₂,U) = 2√((1/4)×1×2500) − 100 = −50\n当 m = 100 时，需求函数为 x₁ = 50/p₁，因此消费者剩余变化：\n$$ΔCS = ∫[1/4,1] (50/p₁) dp₁ = 50ln1 − 50ln(1/4) = 100ln2\n通过比较得出：\n$$|CV| ≤ |ΔCS| ≤ |EV|\n此时三者并不等价。`},
{id:'m16',special:'微观·替代收入效应',qid:'B1 ★★',question:'假设消费者的效用函数为 U(x,y)=x+y，商品价格分别为：Px=4，Py=6，消费者的收入为：m=60。（1）假设商品 x 的价格由 Px=4 下降为 Px′=3，求此过程中商品 x 需求量变化的斯勒茨基替代效应和收入效应。（2）假设商品 y 的价格由 Py=6 下降为 Py′=3，求出此过程中商品 y 需求量变化的斯勒茨基替代效应和收入效应。（3）假设商品 x 的价格由 Px=4 上升为 Px′=5，求此过程中的消费者剩余变化、补偿变化、等价变化。（上财 2012 年考题）',answer:`**考察知识点**：完全替代品、斯勒茨基分解、CS、CV、EV。\n**思路**：完全替代品角点解；按定义求替代/收入；积分求CS。\n**答案**：（1）替代效应0，收入效应5，总效应5。（2）替代效应20，收入效应0，总效应20。（3）ΔCS=60ln(4/5)，CV=15，EV=12。\n##**详解**\n由于消费者效用函数为 U(x,y) = x + y，所以：\np_x/p_y < 1 时，消费者只消费商品 x，需求函数为 x = m/P_x，y = 0。\np_x/p_y = 1 时，消费者选择预算线上任意一点是无差别的。\np_x/p_y > 1 时，消费者只消费商品 y，需求函数为 x = 0，y = m/P_y。\n（1）初始价格下，当 P_x = 4，P_y = 6，m = 60 时，x = 15，y = 0。\n商品 x 价格下降，当 P_x′ = 3，P_y = 6，m = 60 时，x′ = 20，y′ = 0。\n在新的价格下，为实现初始的消费组合，需要的最小收入：\n$$m′ = P_x′·x + P_y·y = 3×15 + 6×0 = 45\n当 P_x′ = 3，P_y = 6，m′ = 45 时，消费者最优消费量：x″ = 15，y″ = 0。\n所以替代效应 = x″ − x = 0，收入效应 = x′ − x″ = 5，总效应 = x′ − x = 5。\n（2）初始价格下，当 P_x = 4，P_y = 6，m = 60 时，x = 15，y = 0。\n商品 y 价格下降，当 P_x = 4，P_y′ = 3，m = 60 时，x′ = 0，y′ = 20。\n在新的价格下，为实现初始的消费组合，需要的最小收入：\n$$m′ = P_x·x + P_y′·y = 4×15 + 3×0 = 60\n当 P_x = 4，P_y′ = 3，m′ = 60 时，消费者最优消费量：x″ = 0，y″ = 20。\n所以替代效应 = y″ − y = 20，收入效应 = y′ − y″ = 0，总效应 = y′ − y = 20。\n（3）初始价格下，当 P_x = 4，P_y = 6，m = 60 时，x = 15，y = 0，效用水平 U = 15。\n商品 x 价格上升，当 P_x′ = 5，P_y = 6，m = 60 时，x′ = 12，y′ = 0，效用水平 U′ = 12。\n① 补偿变化。\n在新的价格水平下实现初始效用的支出最小化问题为：\n$$min 5x + 6y，s.t. x + y = 15\n解得 x″ = 15，y″ = 0，所以补偿变化：\n$$CV = P_x′·x″ + P_y·y″ − m = 5×15 + 6×0 − 60 = 15\n② 等价变化。\n在初始价格水平下实现新效用的支出最小化问题为：\n$$min 4x + 6y，s.t. x + y = 12\n解得 x″ = 12，y″ = 0，所以等价变化：\n$$EV = m − (P_x·x″ + P_y·y″) = 60 − (4×12 + 6×0) = 12\n③ 消费者剩余变化。\n价格变化前后，消费者都是只消费商品 x，所以消费者对商品 x 的需求函数：\n$$x = m/P_x = 60/P_x\n当商品 x 由4上升为5时，消费者剩余的变化：\n$$ΔCS = ∫[5,4] (60/P_x) dP_x = 60ln4 − 60ln5 = 60ln(4/5)\n**【提示】**补充（1）（2）问希克斯分解法下替代和收入效应的求解。\n（1）当 P_x = 4，P_y = 6，m = 60 时，x = 15，y = 0，初始效用水平 U = 15。\n当 P_x′ = 3，P_y = 6，m = 60 时，x′ = 20，y′ = 0。\n在新的价格水平下实现初始效用的支出最小化问题为：\n$$min 3x + 6y，s.t. x + y = 15\n解得 x″ = 15，y″ = 0。\n所以替代效应 = x″ − x = 0，收入效应 = x′ − x″ = 5，总效应 = x′ − x = 5。\n（2）当 P_x = 4，P_y = 6，m = 60 时，x = 15，y = 0，初始效用水平 U = 15。\n当 P_x = 4，P_y′ = 3，m = 60 时，x′ = 0，y′ = 20。\n在新的价格水平下实现初始效用的支出最小化问题为：\n$$min 4x + 3y，s.t. x + y = 15\n解得 x″ = 0，y″ = 15。\n所以替代效应 = y″ − y = 15，收入效应 = y′ − y″ = 5，总效应 = y′ − y = 20。`},
{id:'m17',special:'微观·替代收入效应',qid:'B2 ★★',question:'某消费者对两种商品 x 和 y 的效用函数为 u(x,y)=xy²。商品 x 每单位售价2元，商品 y 每单位售价1元。如果该消费者初始的禀赋为3单位的商品 x 和6单位的商品 y。求：（1）她会消费多少单位的商品 x 和商品 y？（2）当商品 x 的价格变为每单位1元，求商品 x 的替代效应、普通收入效应、禀赋收入效应和总效应。',answer:`**考察知识点**：禀赋收入、斯勒茨基分解、总效应。\n**思路**：先求禀赋价值；求最优消费；再分解为替代、普通收入、禀赋收入。\n**答案**：（1）x1=2，y1=8。（2）替代效应4/3，普通收入效应2/3，禀赋收入效应−1，总效应1。\n##**详解**\n（1）初始价格水平下，消费者拥有的禀赋价格为：\n$$2×3 + 1×6 = 12（元）\n此时消费者效用最大化问题为：\n$$max xy²，s.t. 2x + y = 12\n解得初始消费量：\n$$x₁ = 2，y₁ = 8\n（2）当商品 x 的价格变为每单位1元，消费者拥有的禀赋价值：\n$$1×3 + 1×6 = 9（元）\n此时消费者效用最大化问题为：\n$$max xy²，s.t. x + y = 9\n解得此时的消费量：\n$$x₂ = 3，y₂ = 6\n新的价格水平下，维持初始消费水平不变所需要的收入：\n$$m′ = 1×2 + 1×8 = 10（元）\n此时消费者最优化问题为：\n$$max xy²，s.t. x + y = 10\n解得：\n$$x₃ = 10/3，y₃ = 20/3\n不考虑禀赋价值变动时，价格变动后消费者最优化问题为：\n$$max xy²，s.t. x + y = 10\n解得：\n$$x₄ = 4，y₄ = 8\n所以，替代效应 = x₃ − x₁ = 10/3 − 2 = 4/3。\n普通收入效应 = x₄ − x₃ = 4 − 10/3 = 2/3。\n禀赋收入效应 = x₂ − x₄ = 3 − 4 = −1。\n总效应 = x₂ − x₁ = 3 − 2 = 1。\n【此处有图示】\n**【提示】**不考虑禀赋求替代收入效应是找三个点，如图（a）所示；而考虑禀赋求替代和收入效应是找四个点，如图（b）所示。`},
{id:'m18',special:'微观·替代收入效应',qid:'B3 ★',question:'已知某消费者的效用函数为 u(x,y)=x+min(2x,y)，收入 m=100，初始时商品 x 的价格为 px=2，商品 y 的价格 py=4，现在商品 x 的价格变为 px′=8。（1）求商品 x 和商品 y 的需求函数。（2）求价格变动后商品 x 的斯勒茨基替代效应和收入效应。（3）求价格变动后的补偿变化 CV 和等价变化 EV。',answer:`**考察知识点**：分段效用、角点解/拐点解、斯勒茨基分解、CV、EV。\n**思路**：分 2x≤y 与 2x>y 讨论；求需求；按定义求替代/收入；支出最小化求CV、EV。\n**答案**：（1）当 px/py<1：x=m/px，y=0；当 px/py=1：预算线上满足 y<2x 任意点；当 px/py>1：x=m/(px+2py)，y=2m/(px+2py)。（2）替代效应 −25，收入效应 −18.75。（3）CV=500/3，EV=62.5。\n##**详解**\n（1）当 2x ≤ y 时，效用函数 u(x,y) = 3x；当 2x > y 时，效用函数 u(x,y) = x + y。\n所以效用函数：\n$$u(x,y) = 3x，y ≥ 2x\n$$u(x,y) = x + y，y < 2x\n如下图所示为消费者无差异曲线。\n【此处有图示】\n根据无差异曲线的性质可得：\n当 p_x/p_y < 1 时，最优选择点为角点，此时消费者只消费商品 x，即：\n$$x = m/p_x，y = 0\n当 p_x/p_y = 1 时，最优选择为预算线 p_x·x + p_y·y = m 上满足 y < 2x 部分的任意一点。\n当 p_x/p_y > 1 时，最优选择点为拐点，此时满足 3x = x + y，所以：\n$$x = m/(p_x + 2p_y)，y = 2m/(p_x + 2p_y)\n（2）价格变化前，p_x = 2，p_y = 4，m = 100，商品需求量 x = 50，y = 0，效用水平 U = 50。\n价格变化后，p_x′ = 8，p_y = 4，m = 100，商品需求量 x′ = 6.25，y′ = 12.5，效用水平 U′ = 18.75。\n新的价格水平下，购买初始消费束需要的收入水平：\n$$m′ = p_x′·x + p_y·y = 8×50 + 4×0 = 400\n当 p_x′ = 8，p_y = 4，m′ = 400 时，商品需求量 x″ = 25，y″ = 50。\n所以斯勒茨基替代效应 = x″ − x = 25 − 50 = −25，收入效应 = x′ − x″ = 6.25 − 25 = −18.75。\n（3）① 补偿变化。\n补偿变化是指价格变化之后使消费者回复到初始无差异曲线上所必须的收入变化。\n价格变化之后消费者最优选择点为无差异曲线拐点，此时满足 2x = y，初始效用水平 U = 50，所以此时消费者既定效用水平下支出最小化的最优选择点为：\n$$x₁ = 50/3，y₁ = 100/3\n对应的补偿变化：\n$$CV = (p_x′x₁ + p_y y₁) − m = (8×50/3 + 4×100/3) − 100 = 500/3\n② 等价变化是指价格变化以前必须从消费者那里取走多少货币，才能使他的境况同价格变化以后一样好。\n价格变化之前消费者最优选择点为角点，此时满足 x = m/p_x，y = 0，价格变化前的效用水平 U′ = 18.75，所以此时消费者既定效用水平下支出最小化的最优选择点为 x₂ = 18.75，y₂ = 0。\n对应的等价变化：\n$$EV = m − (p_x x₂ + p_y y₂) = 100 − (2×18.75 + 4×0) = 62.5`},
{id:'m19',special:'微观·跨期消费',qid:'A1 ★★★',question:'假设消费者只进行两期消费选择，两期收入分别为 Y1、Y2，两期消费分别为 C1、C2，消费者效用函数为 U(C)=(C^(1−θ)−1)/(1−θ)，其中 0<θ<1。同时假设年轻人对现在的偏好胜于未来偏好的程度（即时间偏好率 δ）高于贴现率（银行利率 r）。试用跨期选择理论说明，均衡时 C1>C2。',answer:`**考察知识点**：跨期消费、欧拉方程、时间偏好。\n**思路**：构造跨期效用最大化；由一阶条件得 (C2/C1)^θ=(1+r)/(1+δ)。\n**答案**：因 0<θ<1、δ>r，所以 C1>C2。\n##**详解**\n**【法一】**\n消费者的最优化问题可以描述为：\n$$max U(C₁) + U(C₂)/(1+δ)\n$$s.t. C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)\n即：\n$$max (C₁^(1−θ)−1)/(1−θ) + (1/(1+δ))·(C₂^(1−θ)−1)/(1−θ)\n$$s.t. C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)\n构建拉格朗日函数：\n$$L = (C₁^(1−θ)−1)/(1−θ) + (1/(1+δ))·(C₂^(1−θ)−1)/(1−θ) − λ(C₁ + C₂/(1+r) − Y₁ − Y₂/(1+r))\n由一阶条件可得：\n$$∂L/∂C₁ = C₁^(−θ) − λ = 0\n$$∂L/∂C₂ = (1/(1+δ))·C₂^(−θ) − λ/(1+r) = 0\n$$∂L/∂λ = Y₁ + Y₂/(1+r) − C₁ − C₂/(1+r) = 0\n化简得：\n$$(C₂/C₁)^θ = (1+r)/(1+δ)\n因为 0 < θ < 1，δ > r，所以 C₁ > C₂。\n**【法二】**\n消费者的均衡条件为：\n$$MU₁/MU₂ = 1+r\n由于 U(C₁,C₂) = (C₁^(1−θ)−1)/(1−θ) + (1/(1+δ))·(C₂^(1−θ)−1)/(1−θ)，所以：\n$$MU₁ = C₁^(−θ)，MU₂ = (1/(1+δ))·C₂^(−θ)\n代入 MU₁/MU₂ = 1+r，可得：\n$$(C₂/C₁)^θ = (1+r)/(1+δ)\n因为 0 < θ < 1，δ > r，所以 C₁ > C₂。`},
{id:'m20',special:'微观·跨期消费',qid:'A2 ★★★',question:'小明时期1的收入为1000元，时期2的收入为1200元，他的跨时期效用函数为 U(C1,C2)=C1^0.8 C2^0.2。利率为25%，请回答以下问题。（满分 20 分）（1）画出小明的预算线，并标出其斜率值和收入禀赋点。（2）求小明两个时期的最优消费，并标注在同一图中。（3）如果政府加征20%的利息收入税，请重新计算小明的预算线以及跨期最优消费。（南开 2007 年考题）',answer:`**考察知识点**：跨期预算、柯布-道格拉斯跨期效用、利息收入税。\n**思路**：求两期最大消费；拉格朗日求最优；利息税改变有效利率。\n**答案**：（1）斜率 −1.25，禀赋点(1000,1200)。（2）C1=1568，C2=490。（3）新有效利率 r′=0.2，C1=1600，C2=480。\n##**详解**\n（1）由题知：Y₁ = 1000，Y₂ = 1200，r = 25%。\n小明第二时期的最大消费量：\n$$Y₁(1+r) + Y₂ = 1000×1.25 + 1200 = 2450\n小明第一时期的最大消费量：\n$$Y₁ + Y₂/(1+r) = 1000 + 1200/1.25 = 1960\n因此，小明的预算线如下图，其斜率 = −(1+r) = −1.25，收入禀赋点为 W 点 (1000,1200)。\n【此处有图示】\n（2）小明效用最大化问题为：\n$$max C₁^0.8·C₂^0.2\n$$s.t. C₁ + C₂/(1+r) = Y₁ + Y₂/(1+r)\n构造拉格朗日函数：\n$$L = C₁^0.8·C₂^0.2 − λ(C₁ + C₂/(1+r) − Y₁ − Y₂/(1+r))\n由一阶条件可得：\n$$∂L/∂C₁ = 0.8C₁^(−0.2)·C₂^0.2 − λ = 0\n$$∂L/∂C₂ = 0.2C₁^0.8·C₂^(−0.8) − λ/(1+r) = 0\n$$∂L/∂λ = Y₁ + Y₂/(1+r) − C₁ − C₂/(1+r) = 0\n解得：\n$$C₁ = 0.8(Y₁ + Y₂/(1+r))，C₂ = 0.2[(1+r)Y₁ + Y₂]\n代入 Y₁ = 1000，Y₂ = 1200，r = 25% 得：\n$$C₁ = 1568，C₂ = 490\n小明最优消费点为 A 点 (1568,490)，如下图。\n【此处有图示】\n（3）如果政府加征20%的利息收入税。\n此时小明第二期消费为：\n$$C₂ = Y₂ + (1+r)(Y₁−C₁) − t·r(Y₁−C₁)\n整理可得新的预算约束为：\n$$C₁ + C₂/(1+r−tr) = Y₁ + Y₂/(1+r−tr)\n令 r′ = r − tr，因此由（1）可知需求函数为：\n$$C₁ = 0.8(Y₁ + Y₂/(1+r′))，C₂ = 0.2[(1+r′)Y₁ + Y₂]\n代入 r′ = 0.25 − 0.2×0.25 = 0.2，Y₁ = 1000，Y₂ = 1200 可得：\n$$C₁ = 1600，C₂ = 480\n即下图 B 点。\n【此处有图示】`},
{id:'m21',special:'微观·跨期消费',qid:'A3 ★★★',question:'考虑一个单一产品经济，假定张三的寿命分两期：第一期参加工作，收入用于当期的消费和储蓄；第二期张三作为退休的老人，不参加工作，使用第一期的储蓄满足该期的消费。效用函数为 U(c1,c2)=(c1^(1−θ)−1)/(1−θ)+β(c2^(1−θ)−1)/(1−θ)，0<β<1，θ>0。（1）写出张三的效用最大化问题，并给出张三在一、二期的消费函数。（2）讨论利率 r 升高后，储蓄 s 如何变化？并给出经济解释。（南开大学 2013 年考题）',answer:`**考察知识点**：跨期消费、储蓄函数、利率变动的替代效应与收入效应。\n**思路**：由欧拉方程和预算约束求消费；对储蓄函数求导判断符号。\n**答案**：（1）c1=w/[1+β^(1/θ)(1+r)^((1−θ)/θ)]，c2=[β(1+r)]^(1/θ)w/[1+β^(1/θ)(1+r)^((1−θ)/θ)]。（2）∂s/∂r 符号取决于 (θ−1)/θ：0<θ<1 时储蓄随利率上升而增加；θ>1 时减少；θ=1 时不变。\n##**详解**\n（1）张三效用最大化问题可以表示为：\n$$max U(c₁,c₂) = (c₁^(1−θ)−1)/(1−θ) + β(c₂^(1−θ)−1)/(1−θ)\n$$s.t. c₁ + c₂/(1+r) = w\n由消费者的均衡条件 MU₁/MU₂ = 1+r 及 MU₁ = c₁^(−θ)，MU₂ = βc₂^(−θ) 可得：\n$$(c₂/c₁)^θ = (1+r)β\n代入约束曲线方程可得张三在第一、二期的消费分别为：\n$$c₁ = w/[1 + β^(1/θ)·(1+r)^((1−θ)/θ)]\n$$c₂ = [β(1+r)]^(1/θ)·w/[1 + β^(1/θ)·(1+r)^((1−θ)/θ)]\n（2）由 s = w − c₁ 可得储蓄函数：\n$$s(r) = w − c₁ = w·β^(1/θ)·(1+r)^((1−θ)/θ)/[1 + β^(1/θ)·(1+r)^((1−θ)/θ)]\n求导可得：\n$$∂s/∂r = w·β^(1/θ)·(1+r)^((1−θ)/θ−1)·((1−θ)/θ)/[1 + β^(1/θ)·(1+r)^((1−θ)/θ)]²\n由此可知 ∂s/∂r 的符号取决于 (θ−1)/θ，也即取决于 θ 与 1 的大小关系。\n① 当 ∂s/∂r > 0，即 0 < θ < 1 时，储蓄随着利率的上升而增加。经济学解释：利率提高对张三的替代效应大于收入效应。\n② 当 ∂s/∂r < 0，即 θ > 1 时，储蓄随利率的上升而减少。经济学解释：利率提高对张三的替代效应小于收入效应。\n③ 当 ∂s/∂r = 0，即 θ = 1 时，储蓄不受利率影响。\n**【校注】**原书此处把 s(r) 直接写成了 c₁ 的表达式，按 s = w − c₁ 展开应为上面的形式，结论不变。\n**【提示】**跨期消费问题本质上还是消费者效用最大化的问题，只是这里的商品是第一期和第二期的消费，第一期商品的价格为1，第二期商品的价格为 1/(1+r)（现值表达式），因此两期的消费也可以用替代效应和收入效应来解释。\n当利率 r 上升时，第一期消费的相对价格上升，替代效应为负（与价格反向变动）；利率上升，如果消费者为贷款者（第一期消费小于第一期收入），则储蓄收入增加，收入效应为正（与价格同方向变动）。\n① 当替代效应大于收入效应，总效应为负，即利率与第一期消费反方向变动，此时储蓄与利率同方向变动，即 ∂s/∂r > 0。\n② 当替代效应小于收入效应，总效应为正，即利率与第一期消费同方向变动，此时储蓄与利率反方向变动，即 ∂s/∂r < 0。\n**【思考】**如果消费者为借款者，则利率上升时，第一期消费的替代效应与收入效应是怎样的？`},
{id:'m22',special:'微观·跨期消费',qid:'B1 ★★',question:'考虑一个只有消费者借贷的债券市场。假定150个消费者具有相同的两期消费效用函数 U=C1C2。设100个消费者每个人都有预期的收入流 y1=10000，y2=8400，而剩下的50个消费者都有预期的收入流 y1=8000，y2=14000。求使债券市场均衡的利息率。',answer:`**考察知识点**：跨期消费与债券市场均衡、一般均衡。\n**思路**：求每类消费者第一期消费和超额需求；令总超额需求为0。\n**答案**：r=0.1。\n##**详解**\n此时每个消费者面临的效用最大化问题都为：\n$$max C₁C₂\n$$s.t. C₁ + C₂/(1+r) = y₁ + y₂/(1+r)\n构造拉格朗日函数：\n$$L = C₁C₂ − λ(C₁ + C₂/(1+r) − y₁ − y₂/(1+r))\n由一阶条件可得：\n$$∂L/∂C₁ = C₂ − λ = 0\n$$∂L/∂λ = y₁ + y₂/(1+r) − C₁ − C₂/(1+r) = 0\n解得第一期消费为：\n$$C₁ = (1/2)(y₁ + y₂/(1+r))\n消费者对债券的超额需求是：\n$$y₁ − C₁ = y₁ − (1/2)(y₁ + y₂/(1+r)) = (1/2)y₁ − y₂/(2(1+r))\n债券市场的均衡要求两组消费者的总超额需求等于零，即：\n$$100×[(1/2)×10000 − 8400/(2(1+r))] + 50×[(1/2)×8000 − 14000/(2(1+r))] = 0\n化简得：\n$$700000 − 770000/(1+r) = 0\n解得：\n$$r = 0.1\n**【提示】**本质上是一般均衡与跨期消费结合的题目，2025 年 847 才考过相关题型，真题考的是只有两个消费者的情形。`},
{id:'m23',special:'微观·跨期消费',qid:'B2 ★',question:'假设一个人只存活两期，并拥有效用函数 lnC1+lnC2。假定这个人的劳动收入在其生命的第一期为 Y1，在第二期为0。因此，其第二期消费为 (1+r)(Y1−C1)；收益 r 是随机的，r=E(r)+ε，这里 ε 是均值为0的随机误差。（1）求这个人在选择 C1 时的一阶最优条件；（2）假定 r 从随机变为确定，且 E(r) 没有任何变化，C1 将如何对这一调整做出反应？（北大汇丰考题，也是罗默课后题）',answer:`**考察知识点**：不确定性、跨期消费、期望效用。\n**思路**：对 C1 求期望效用最大化一阶条件；利用 E(1/(Y1−C1))=1/(Y1−C1)。\n**答案**：（1）一阶条件为 1/C1−E(1/(Y1−C1))=0。（2）C1=Y1/2，不受 r 确定性影响。\n##**详解**\n（1）实际利率可能是随机的，定义 r = E(r) + ε，其中 ε 是一均值为零的随机误差项。\n这里之所以第二期消费前面要取期望，是因为由于利率是不确定的，所以第二期的消费水平也是不确定的。\n对期望效用函数求导可得：\n$$∂U/∂C₁ = 1/C₁ + E[−(1+E(r)+ε)/((1+E(r)+ε)(Y₁−C₁))] = 0\n化简得：\n$$1/C₁ − E(1/(Y₁−C₁)) = 0\n（2）由于 1/(Y₁−C₁) 不是随机的，所以：\n$$E(1/(Y₁−C₁)) = 1/(Y₁−C₁)\n并且经过简单的代数运算可以得出：\n$$C₁ = Y₁/2\n在这种情况下，C₁ 并不受 r 的确定性的影响。即使 r 是随机变量，个人仅消费第一期收入的一半而将另一半储蓄起来。\n**【提示】**本题属于不确定性与跨期消费相结合的计算题。`},
{id:'m24',special:'微观·不确定性',qid:'A1 ★★★',question:'假定某居民具有期望效用函数，其效用函数为 u(w)=lnw，他有机会参与掷硬币，头面朝上的概率为 π。如果他下注 x 元，若头面朝上，他会拥有 w+x；反之，若背面朝上，则他拥有 w−x。（1）请解出居民作为 π 的函数的最优赌注 x 量。（2）当 π=1/2 时，什么是他的关于 x 的最优选择？为什么会有这个结果？',answer:`**考察知识点**：期望效用、风险规避、最优赌注。\n**思路**：最大化 πln(w+x)+(1−π)ln(w−x)。\n**答案**：（1）x*=0（0≤π<1/2）；x*=2πw−w（1/2<π≤1）。（2）x*=0，风险规避者不参与公平赌博。\n##**详解**\n（1）对于消费者而言，最优的赌注就意味着在此赌注下，他的期望效用达到最大。所以，消费者对最优赌注的选择可以归结为如下优化问题：\n$$max πln(w+x) + (1−π)ln(w−x)\n对上式求导并令一阶导数等于0，得：\n$$π/(w+x) − (1−π)/(w−x) = 0\n解得：\n$$x* = 2πw − w\n下面分两种情况讨论：\n① 如果 0 ≤ π < 1/2，那么对任意的 x ≥ 0，都有 π/(w+x) < (1−π)/(w−x)，即一阶导数恒为负，这意味着消费者的期望效用关于赌注的数量是递减的，所以他的最优选择就是不下赌注，即 x* = 0。\n② 如果 π > 1/2，那么 x* = 2πw − w > 0。\n综上可知消费者的最优赌注为：\n$$x* = 0，0 ≤ π < 1/2\n$$x* = 2πw − w，1/2 < π ≤ 1\n（2）当 π = 1/2 时，x* = 0，即他选择不赌博。从该居民的效用函数 u(w) = ln w 可看出该居民是一个风险规避者。作为风险规避者，如果参与赌博获得的期望财富（(1/2)(w+x) + (1/2)(w−x)）跟不赌博时拥有的财富值 w 一样，当然会选择不赌博。`},
{id:'m25',special:'微观·不确定性',qid:'A2 ★★★',question:'假定张三的效用函数为 u(y)=y²，其中 y 代表年收入，单位为万元。（1）张三是风险中性的、风险规避的、还是风险爱好型的？请解释。（2）假设张三现在的年收入是2万元，该收入是稳定的，他可以获得另一份工作，收入为1万元的概率是0.5，收入为3万元的概率是0.5，张三会做何选择？原因是什么？（3）在第（2）问中，张三会为了防止新工作收入的波动，愿意购买保险吗？如果愿意，他愿意支付多少保费。',answer:`**考察知识点**：风险偏好、期望效用、保险。\n**思路**：看二阶导；比较期望效用；比较买保险效用。\n**答案**：（1）风险爱好型，因 u″(y)=2>0。（2）选择新工作，期望收入相同但风险更大，风险爱好者偏好。（3）不愿意购买保险。\n##**详解**\n（1）由效用函数 u(y) = y² 可知：\n$$u′(y) = 2y，u″(y) = 2 > 0\n边际效用递增，所以张三是风险爱好型。\n（2）张三会选择另外一份工作。\n因为不稳定工作的期望收入为：\n$$1×0.5 + 3×0.5 = 2（万元）\n这与稳定工作的年收入相等，由于张三是风险爱好型，所以他会选择另外一份风险更大的工作而不是稳定性工作。\n（3）张三不愿意购买保险。\n假设张三购买保险，则不论在收入多还是少的情况下期望收入均为2万元，买保险带来的效用为：\n$$U(2) = 2² = 4\n不购买保险时新工作的期望效用为：\n$$E(U) = 0.5×1² + 0.5×3² = 5\n因为新工作的期望效用大于买保险的效用，所以他不愿意购买保险。`},
{id:'m26',special:'微观·不确定性',qid:'A3 ★★★',question:'某人具有预期效用函数 u(w)=√w。他具有初始财富4美元。除此之外，他还有一张彩票，彩票能够得到12美元的概率为1/2，能够得到0美元的概率为1/2。（1）判断该人的风险偏好类型；（2）他的预期效用是多少？（3）他卖掉彩票的最低价格是多少？',answer:`**考察知识点**：期望效用、风险规避、确定性等价。\n**思路**：二阶导判断风险规避；计算期望效用；令卖彩票后效用等于原期望效用。\n**答案**：（1）风险规避者。（2）EU=3。（3）最低价格5美元。\n##**详解**\n（1）效用函数 u(w) = √w，一阶导、二阶导分别为：\n$$du(w)/dw = (1/2)w^(−1/2)，d²u(w)/dw² = −(1/4)w^(−3/2)\n二阶导小于0，因此该人是风险规避者。\n（2）期望效用：\n$$EU = (1/2)×√(4+12) + (1/2)×√4 = (1/2)×4 + (1/2)×2 = 3\n（3）假设卖掉彩票的价格为 p。\n不卖掉彩票，其期望效用 EU = 3；卖掉彩票，其效用为：\n$$U = √(4+p)\n卖掉彩票的价格应该满足：\n$$√(4+p) ≥ 3\n解得 p ≥ 5，因此彩票的最低价格为5美元。`},
{id:'m27',special:'微观·不确定性',qid:'A4 ★★★',question:'一消费者拥有关于火灾风险的初始财富160000货币单位。设发生较大火灾的概率为5%，其造成的损失为70000货币单位；发生严重火灾的概率为5%，损失为120000货币单位。假设消费者的效用函数为 U=W^0.5。他面临一种扣除性预防保险政策，根据这种政策，他自己要承担任何火灾损失的前7620。（1）对于这种政策，他愿意支付的最大保险金是多少？（2）与公平保金相比，保险公司的最大利润是多少？',answer:`**考察知识点**：期望效用、保险、公平保费、风险溢价。\n**思路**：分别求不买保险期望效用和买保险期望效用；令两者相等求最大保费；公平保费使期望利润为0。\n**答案**：（1）最大保险金约11004。（2）保险公司最大利润约2266。\n##**详解**\n（1）假设保金的价格为 R。\n不购买保险时，该消费者的期望效用：\n$$EU = 0.9×√160000 + 0.05×√(160000−70000) + 0.05×√(160000−120000) = 385\n购买保险时，不发生火灾，其财富为 160000 − R。\n发生较大火灾时，其财富为：\n$$160000 − R − 7620 − 70000 + 70000 = 152380 − R\n发生严重火灾时，其财富为：\n$$160000 − R − 7620 − 120000 + 120000 = 152380 − R\n所以，购买保险时，该消费者的期望效用：\n$$EU′ = 0.9×√(160000−R) + 0.05×√(152380−R) + 0.05×√(152380−R)\n购买保险时应该满足：\n$$0.9×√(160000−R) + 0.05×√(152380−R) + 0.05×√(152380−R) ≥ 385\n解得 R ≤ 11004，即消费者愿意支付的最大保金是11004。\n（2）公平保金满足保险公司的期望利润为0，即：\n$$Eπ = 0.9×R + 0.05×[R−(70000−7620)] + 0.05×[R−(120000−7620)] = 0\n解得 R = 8738。\n因此保险公司的最大利润就等于消费者愿意支付的最大保金减去公平保金，即：\n$$11004 − 8738 = 2266\n**【提示】**本题第（1）问和上一题第（3）问本质考的都是风险溢价，相关题目的分析思路就是求出不同情形下消费者的效用或期望效用，二者的差值即为"风险溢价"。`},
{id:'m28',special:'微观·不确定性',qid:'A5 ★★',question:'在一自由市场，一商贩的效用函数为 U(w)=lnw，w 代表收入。他每天的收入为200元，但按规定应交纳50元固定税费。市场监管人员按10%的概率抽查。被抽中肯定能被查清是否已缴税。偷税者将被罚款。（1）为了打击偷税，市场监管人员需要决定罚款额至少应为多少？（2）假定该商贩还有其他与该市场无关的随机收入，即各以50%的概率获得100元和300元，那么你对第一问中的回答是否有变化？如果有，请给出。（北大考题）',answer:`**考察知识点**：期望效用、偷税决策、罚款威慑。\n**思路**：令偷税与不偷税期望效用相等；加入随机收入后重新计算。\n**答案**：（1）罚款额至少 F=138.7。（2）有变化，F′=214.2。\n##**详解**\n（1）设罚款额为 F。\n若不偷税，商贩的效用为：\n$$U₁ = ln150\n若偷税，商贩的期望效用为：\n$$EU₂ = (9/10)ln200 + (1/10)ln(150−F)\n商贩偷或不偷税得到的期望收益应一样大。因此：\n$$U₁ = EU₂\n解得 F = 138.7。\n（2）记商贩获得100元和300元分别为事件 A 和 Ā，市场监管人员查和不查为事件 B 和 B̄，则：\n$$P(A) = P(Ā) = 1/2，P(B) = 1/10，P(B̄) = 9/10\n因此，商贩若偷税时的收益与其概率分布如下：\n被查且获得100元：概率 1/20，收益 250 − F′\n被查且获得300元：概率 1/20，收益 450 − F′\n未被查且获得100元：概率 9/20，收益 300\n未被查且获得300元：概率 9/20，收益 500\n因此，偷税时：\n$$EU₂ = (1/20)ln(250−F′) + (9/20)ln300 + (1/20)ln(450−F′) + (9/20)ln500\n而不偷税时：\n$$EU₁ = (1/2)ln(150+100) + (1/2)ln(150+300)\n令 EU₁ = EU₂，可解得 F′ = 214.2 或 F′ = 485.8（舍去）。\n显然 F′ = 214.2 时就足以使商贩失去偷税的动力。`},
{id:'m29',special:'微观·不确定性',qid:'A6 ★★★',question:'老王开了一家冰粥店，冰粥的价格非常依赖于天气状况。如果天气晴朗，每碗冰粥要卖30元；如果下雨，每碗冰粥只能卖20元。冰粥必须头一天晚上熬制，第二天卖掉，否则就会变质。冰粥店每天的成本函数为 C=0.5q²+5q+100，其中 q 为冰粥的产量。在当晚生产第二天的冰粥之前，老王并不清楚第二天的天气情况，只能推测第二天是晴天和雨天的概率各为50%。（1）为了实现期望利润最大化，老王每天应该生产多少碗冰粥？（2）假设老王的效用函数为 U=√π，其中 π 为利润。请问，老王的风险态度是什么类型？他的期望效用水平为多少？（3）假设老王通过天气预报可以准确地知道第二天的天气状况，但是不能改变冰粥的价格。请问在这种情况下，他的期望效用水平是多少？天气的不确定性给他带来了多少效用损失？（人大考题）',answer:`**考察知识点**：不确定性生产、期望利润、期望效用、风险规避、信息价值。\n**思路**：分别写晴天/雨天利润；最大化期望利润；判断风险态度；完全信息下分别最优。\n**答案**：（1）q=20。（2）风险规避型；E(U)=5√2。（3）E(U)=½(√212.5+√12.5)；效用损失为 ½(√212.5+√12.5)−5√2。\n##**详解**\n（1）晴天时，老王的利润为：\n$$π₁ = pq − C = 30q − (0.5q² + 5q + 100) = −0.5q² + 25q − 100\n雨天时，老王的利润为：\n$$π₂ = 20q − (0.5q² + 5q + 100) = −0.5q² + 15q − 100\n因此，老王的期望利润函数为：\n$$E(π) = (1/2)π₁ + (1/2)π₂ = −0.5q² + 20q − 100\n期望利润最大化的一阶条件为：\n$$dE(π)/dq = −q + 20 = 0\n解得 q = 20，且 d²E(π)/dq² = −1 < 0。故老王每天应该生产20碗粥。\n（2）由效用函数 U = √π 可得：\n$$dU/dπ = 1/(2√π) > 0，d²U/dπ² = −(1/4)π^(−3/2) < 0\n故老王的风险态度为风险规避型。\n由（1）可知，晴天时，老王利润水平为：\n$$π₁ = −0.5×20² + 25×20 − 100 = 200\n雨天时，老王利润水平为：\n$$π₂ = −0.5×20² + 15×20 − 100 = 0\n因此老王的期望效用为：\n$$E′(U) = (1/2)×√200 + (1/2)×√0 = 5√2\n（3）晴天时，老王利润函数为 π₁ = −0.5q² + 25q − 100。\n利润最大化的一阶条件为：\n$$dπ₁/dq = −q + 25 = 0\n解得 q₁ = 25，此时：\n$$π₁ = −0.5×25² + 25×25 − 100 = 212.5\n同理可得：\n$$q₂ = 15，π₂ = −0.5×15² + 15×15 − 100 = 12.5\n故老王的期望效用水平为：\n$$E(U) = (1/2)U₁ + (1/2)U₂ = (1/2)(√212.5 + √12.5)\n因此，天气的不确定性给老王带来的效用损失为：\n$$E(U) − E′(U) = (1/2)(√212.5 + √12.5) − 5√2`},
{id:'m30',special:'微观·不确定性',qid:'A7 ★★★',question:'小明在未名湖畔拥有一家店，专门出租滑冰和攀岩装置。他认为今年寒冬的概率为0.55，暖冬的概率为0.45。如果是寒冬，很多学生就会租用滑冰装置在未名湖上滑冰，而在旁边攀岩的人就会很少。小明必须要决定准备多少滑冰装置，多少攀岩装置。他的报酬矩阵如下：寒冬(0.55)滑冰20000、攀岩5000；暖冬(0.45)滑冰5000、攀岩15000。（1）如果小明选择只出租滑冰装置，他的期望报酬是多少？只出租攀岩装置呢？（2）如果小明选择将 x 比例的资源分配到滑冰装置上，他的期望报酬是多少（以 x 表示）？（3）假设小明是风险中性，他会把多大比例的资源分配在滑冰装置上？（4）如果小明的效用函数是 U(x)=lnx，写出他的期望效用（以 x 表示）。这种情况下，小明会把多大比例的资源分配在滑冰装置上？（5）一家保险公司给小明建议：“你只出租滑冰装置。如果是暖冬，我赔给你5000元；如果是寒冬，你付我5000元”。保险公司的期望报酬是多少？在什么条件下，小明会接受这个建议？（北京大学考题）',answer:`**考察知识点**：期望报酬、风险中性、期望效用、保险。\n**思路**：按概率加权；风险中性最大化期望报酬；对数效用求一阶条件。\n**答案**：（1）只滑冰13250；只攀岩9500。（2）E(x)=9500+3750x。（3）x=1。（4）E(U)=0.55ln(5000+15000x)+0.45ln(15000−10000x)；x=0.675。（5）保险公司期望报酬500；接受条件为 0.55ln15000+0.45ln10000>（4）中的最大期望效用。\n##**详解**\n（1）如果小明只出租滑冰装置，他的期望报酬是：\n$$0.55×20000 + 0.45×5000 = 13250\n如果小明只出租攀岩装置，他的期望报酬是：\n$$0.55×5000 + 0.45×15000 = 9500\n（2）如果小明选择将 x 比例的资源分配到滑冰装置上，他的期望报酬是：\n$$E(x) = 0.55[20000x + 5000(1−x)] + 0.45[5000x + 15000(1−x)] = 9500 + 3750x\n（3）假设小明是风险中性，则期望报酬的效用与期望效用相同。\n由（2）中小明的期望报酬函数已知，当 x = 1，即全部的资源分配在滑冰装置上时，小明的期望报酬最大，期望效用也最大。\n（4）小明的期望效用为：\n$$E(U) = 0.55ln[20000x + 5000(1−x)] + 0.45ln[5000x + 15000(1−x)]\n$$= 0.55ln(5000 + 15000x) + 0.45ln(15000 − 10000x)\n期望效用最大化的一阶条件为：\n$$dE(U)/dx = 0.55×15000/(5000 + 15000x) − 0.45×10000/(15000 − 10000x) = 0\n解得 x = 0.675，即小明会把0.675比例的资源分配在滑冰装置上。\n（5）保险公司的期望报酬是：\n$$0.55×5000 − 0.45×5000 = 500\n此时，小明的期望效用为：\n$$E(U) = 0.55ln(20000−5000) + 0.45ln(5000+5000) = 0.55ln15000 + 0.45ln10000\n只有在上述期望效用大于（4）中的最大期望效用时，小明才会接受保险公司的建议。`},
{id:'m31',special:'微观·不确定性',qid:'B1 ★★',question:'某消费者面临跨期消费选择问题。假设此消费者在今天的消费量为 c0，在明天的消费量为 c1，两期的价格均为1。假设该消费者今天的收入为 I0=100，说明天的收入为 I1。消费者的效用函数是 U(c0,c1)=lnc0+lnc1。消费者可以选择储蓄，但不能向他人借款，假设利率水平为 r=0。求：（1）若明天的收入为 I1=34，求消费者的消费决策。（2）若明天的收入存在两种可能，分别为 I1=100 和 I1=0，概率均为50%，求消费者的消费决策。（北京大学考题）',answer:`**考察知识点**：跨期消费、不确定性、借贷约束。\n**思路**：先求确定性最优；不确定时求期望效用最大化，注意 c0≤100。\n**答案**：（1）c0=67，c1=67。（2）c0=(900−100√17)/8，需满足 c0≤100。\n##**详解**\n（1）消费者效用最大化问题为：\n$$max ln c₀ + ln c₁\n$$s.t. c₀ + c₁ = I₀ + I₁\n该效用最大化问题可以进一步写为：\n$$max ln c₀ + ln(I₀ + I₁ − c₀)\n由一阶条件可得：\n$$1/c₀ − 1/(I₀ + I₁ − c₀) = 0\n解得：\n$$c₀ = (I₀ + I₁)/2，c₁ = (I₀ + I₁)/2\n代入 I₀ = 100，I₁ = 34 可得两期消费：\n$$c₀ = 67，c₁ = 67\n此时满足 c₀ ≤ 100 的条件。\n（2）明天的消费：\n$$c₁ = (I₀ − c₀)(1+r) + I₁ = 100 − c₀ + I₁\n明天的收入 I₁ = 100 的概率为 p = 1/2，此时明天的消费 c₁ = 200 − c₀。\n明天的收入 I₁ = 0 的概率为 1−p = 1/2，此时明天的消费 c₁ = 100 − c₀。\n此时期望效用最大化问题为：\n$$max EU = ln c₀ + E(ln c₁) = ln c₀ + (1/2)ln(200−c₀) + (1/2)ln(100−c₀)\n一阶条件为：\n$$dEU/dc₀ = 1/c₀ − 1/(400−2c₀) − 1/(200−2c₀) = 0\n整理可得：\n$$4c₀² − 900c₀ + 40000 = 0\n解得：\n$$c₀ = (900 ± 100√17)/8\n由于消费者不能借款，所以第一期的消费需要满足 c₀ ≤ 100，因此：\n$$c₀ = (900 − 100√17)/8`},
{id:'m32',special:'微观·不确定性',qid:'B2 ★★',question:'一个纳税人，效用函数为 lnw，w 为收入，w 是固定值。国家按照固定税率 t（0<t<1）对纳税人上报的收入征税，但此人可以少报收入，即报的收入为 x（0<x<w）。同时税务机关有 p 的概率（0<p<1）查此人的收入。一旦查肯定能查出此人的真实收入。查出之后，不仅要补齐所应缴纳的税款，同时还要承担罚金，罚金为应补交税款乘以一个大于0的固定常数 θ。（1）求此纳税人选择的最优 x 值。同时求此纳税人选择的 x 与其收入的关系；（2）如果 θ=0，问此时此人选择的最优 x；（3）此人有没有可能选择 x=0？在什么条件下此人会这样做？',answer:`**考察知识点**：偷税、期望效用、最优申报。\n**思路**：写期望效用；对 x 求一阶条件；讨论角点解。\n**答案**：（1）当 pθ−(1−p)(1−t−tθ)≥0 时，x*=[pθ−(1−p)(1−t−tθ)]w/(tθ)；否则 x*=0。（2）θ=0 时 x*=0。（3）有可能；条件为 pθ−(1−p)(1−t−tθ)<0。\n##**详解**\n（1）由题意知，纳税人的期望效用最大化问题为：\n$$max EU = (1−p)ln(w−xt) + p·ln[w − wt − (w−x)tθ]\n一阶条件为：\n$$−(1−p)·t/(w−xt) + pθt/[w − wt − (w−x)tθ] = 0\n解得：\n当 pθ − (1−p)(1−t−tθ) ≥ 0 时，\n$$x* = [pθ − (1−p)(1−t−tθ)]/(tθ) · w\n当 pθ − (1−p)(1−t−tθ) < 0 且 x ≥ 0 时，EU′ < 0，所以此时 x* = 0。\n因此，此纳税人选择的最优 x 值为上述分段形式，即最优 x 值与收入 w 成正比，或者恒为0。\n（2）当 θ = 0 时：\n$$EU = (1−p)ln(w−xt) + p·ln(w−wt)\n期望效用函数关于 x 递减，因此 x* = 0，即如果逃税没有成本的话，纳税人将完全逃税。\n（3）由第（1）问可知，当 pθ − (1−p)(1−t−tθ) < 0 时，此人选择 x = 0。此时意味着：税率较低（被查出谎报收入所需要缴纳的罚金较少）；税务机关检查的概率较低（补全税收并缴纳罚款的概率较低）；罚金的乘数较低（缴纳罚款的数额较少）。`},
{id:'m33',special:'微观·不确定性',qid:'B3 ★',question:'当决定在一个非法的地点停车时，任何人都知道，会收到罚款通知单的可能性是 P，并且罚金为 f。假定所有的个人都是风险厌恶型的（也就是说，u″(w)<0，其中，w 是个人的财富）。那么被抓到的可能性按比例增加和罚金按比例增加在防止非法停车方面哪个更有效？（提示：运用泰勒级数展开式 u(w−f)=u(w)−fu′(w)+f²u″(w)/2）（北京大学软微 2020 年考题，尼科尔森课后题）',answer:`**考察知识点**：期望效用、风险厌恶、威慑效果。\n**思路**：用泰勒展开比较同比例增加 P 与 f 对期望效用的降低。\n**答案**：罚金按比例增加更有效。\n##**详解**\n利用泰勒级数展开式，非法停车的期望效用为：\n$$Pu(w−f) + (1−P)u(w) ≈ P[u(w) − fu′(w) + (f²/2)u″(w)] + u(w) − Pu(w)\n$$= u(w) − Pfu′(w) + (1/2)Pf²u″(w)\n假设罚金的比例增加为原来的 t（t > 1）倍，那么非法停车的期望效用就变为：\n$$u(w) − tPfu′(w) + (1/2)t²Pf²u″(w)\n假设收到罚款通知单的可能性增加为原来的 t（t > 1）倍，那么非法停车的期望效用就变为：\n$$u(w) − tPfu′(w) + (1/2)tPf²u″(w)\n由于消费者是风险厌恶型的，所以 u″(w) < 0，于是：\n$$u(w) − tPfu′(w) + (1/2)t²Pf²u″(w) < u(w) − tPfu′(w) + (1/2)tPf²u″(w)\n这说明罚金的比例和收到罚款通知单的可能性同比例增加，前者会使消费者的效用更低，所以罚金按比例增加在防止非法停车方面更有效。`},
{id:'m34',special:'微观·不确定性',qid:'B4 ★★',question:'抛一枚硬币，正面朝上的概率是 p；你连续抛硬币，直到第一次出现正面为止（连抛 j 次，在第 j 次第一次出现正面），这时候你的回报是 2^j。（1）如果 p=1/2，计算你的期望回报；（2）假定你的效用函数为 u(x)=lnx，用级数求和的形式表示抛硬币带来的期望效用。（3）如果 p=1/2，计算该预期效用值。',answer:`**考察知识点**：期望值、圣彼得堡悖论、期望效用。\n**思路**：几何分布概率 pj=(1−p)^(j−1)p；期望回报求和；期望效用级数。\n**答案**：（1）期望回报为 n（若有限次）或无穷（无限次）。（2）Eu=∑(1−p)^(j−1)p·jln2。（3）Eu=2ln2。\n##**详解**\n（1）在第 j 次第一次出现正面朝上的概率是：\n$$p_j = (1−p)^(j−1)·p（j = 1,2,…）\n期望回报：\n$$E = Σ p_j·2^j = Σ (1−p)^(j−1)·p·2^j\n当 p = 1/2 时，期望回报：\n$$E = Σ (1/2)^(j−1)·(1/2)·2^j = Σ 1 = n\n（2）效用函数为 u(x) = ln x，则第 j 次出现正面的时候，效用：\n$$u_j = ln(2^j) = j·ln2\n因此期望效用：\n$$Eu = Σ p_j·u_j = Σ (1−p)^(j−1)·p·j·ln2\n（3）当 p = 1/2 时，期望效用：\n$$Eu = Σ (1−1/2)^(j−1)·(1/2)·j·ln2 = ln2·Σ (j/2^j)\n令：\n$$S_n = Σ j/2^j = 1/2 + 2/2² + 3/2³ + … + n/2^n\n因此：\n$$2S_n = 1 + 2/2¹ + 3/2² + … + n/2^(n−1)\n进而可得：\n$$2S_n − S_n = 1 + 1/2 + 1/2² + … + 1/2^(n−1) − n/2^n\n所以：\n$$S_n = (1 − (1/2)^n)/(1 − 1/2) − n/2^n\n当 n → ∞ 时，lim S_n = 2，即预期效用值：\n$$Eu = 2ln2`},
{id:'m35',special:'微观·不确定性',qid:'B5 ★',question:'作为ASP行业董事会的主席，你估计你的年度利润如下表所示。利润（π）取决于市场需求和你新任CEO的努力水平。市场需求低(0.3)、中(0.4)、高(0.3)。低努力时利润分别为500万、1000万、1500万美元；高努力时分别为1000万、1500万、1700万美元。你必须设计一个酬金计划能够最大化企业的预期利润。如果企业是风险中性的，CEO是风险规避的，CEO的效用函数为：不努力时 U=W^0.5；努力时 U=W^0.5−100。在以下三种薪酬制度下，你宁愿选择哪一种？为什么？第一种，支付CEO固定工资575000美元/年；第二种，支付CEO企业年利润的6%；第三种，支付CEO固定工资500000美元/年，加上当企业利润超过1500万美元后超出部分的50%。',answer:`**考察知识点**：委托代理、激励薪酬、期望效用、风险规避。\n**思路**：分别计算三种制度下CEO努力与不努力的期望效用，判断其选择；再算企业期望利润。\n**答案**：应选择第三种。三种制度下企业期望利润分别约为942.5、1325.4、1330万美元；第三种最大。\n##**详解**\n对每一种薪酬制度，首先计算CEO是采取高的努力程度还是低的努力程度；接下来计算每种努力下公司的期望利润；最后比较三个制度，从而选定期望利润最大化的那个薪酬制度。\n三种需求下的企业利润（万美元）：\n低需求：低努力500，高努力1000\n中等需求：低努力1000，高努力1500\n高需求：低努力1500，高努力1700\n概率分别为0.3、0.4、0.3。\n（1）薪酬制度1：固定工资575000美元/年。\nCEO不努力时的期望效用：\n$$EU_L = √575000 ≈ 758.29\nCEO努力时的期望效用：\n$$EU_H = √575000 − 100 ≈ 658.29\n因此在制度1下，CEO选择不努力。此时公司所能获得的期望利润为：\n$$Eπ_L = 0.3×500 + 0.4×1000 + 0.3×1500 − 57.5 = 942.5（万美元）\n即CEO不努力，期望效用758.29，公司期望利润942.5万美元。\n（2）薪酬制度2：支付CEO企业年利润的6%。\nCEO不努力时，其期望效用为：\n$$EU_L = 0.3√(0.06×5000000) + 0.4√(0.06×10000000) + 0.3√(0.06×15000000) ≈ 758.76\nCEO努力时，其期望效用为：\n$$EU_H = 0.3√(0.06×10000000) + 0.4√(0.06×15000000) + 0.3√(0.06×17000000) − 100 ≈ 818.84\n因此在制度2下，CEO选择努力。此时公司的期望利润为：\n$$Eπ_H = 0.94×(0.3×1000 + 0.4×1500 + 0.3×1700) = 1325.4（万美元）\n即CEO选择努力，期望效用818.84，公司期望利润1325.4万美元。\n（3）薪酬制度3：固定工资500000美元/年，加上当企业利润超过1500万美元后超出部分的50%。\nCEO不努力时，利润最高1500万，拿不到超额分成，其期望效用为：\n$$EU_L = 0.3√500000 + 0.4√500000 + 0.3√500000 ≈ 707.11\nCEO努力时，只有高需求下利润1700万，分成 0.5×(1700−1500) = 100 万，报酬为150万，其期望效用为：\n$$EU_H = 0.3√500000 + 0.4√500000 + 0.3√1500000 − 100 ≈ 762.4\n因此在制度3下，CEO选择努力。此时公司的期望利润为：\n$$Eπ_H = 0.3×(1000−50) + 0.4×(1500−50) + 0.3×(1700−50−200×0.5) = 1330（万美元）\n即CEO选择努力，期望效用762.4，公司期望利润1330万美元。\n综上所述，ASP公司为了获得最大期望利润，它应该选择薪酬制度3，此时它所获得的期望利润为1330万美元。CEO为了使期望效用最大化，将选择努力。`},
{id:'m36',special:'微观·不确定性',qid:'B6 ★★★',question:'一个在市场上售卖盗版光盘的小贩，以零成本拷贝正版光盘再转手卖给他人。如果小贩被警察抓住了，需要上交所有的非法所得收入，并且额外支付罚金 F。用 π(x) 表示小贩被警察抓住的概率，其中 x 表示售卖的光盘数量。小贩售卖的光盘越多，他被警察抓住的概率越大，因此 π(x) 是关于 x 的单调递增函数，且一阶可导。此外，假设盗版光盘市场是一个完全竞争市场，每个售卖小贩的长期均衡利润均为零。（1）请证明小贩售卖光盘的最优数量 x* 与罚金 F 或光盘价格 p 均无关。（2）请将盗版光盘的售卖价格 p 表示成 x*、π(x*) 和 F 的函数。（3）如果给定 π(x)=1−e^(−λx)，其中 λ>0，请计算出 x*。（中财 803 经济学综合 2019 年考题）',answer:`**考察知识点**：期望利润、完全竞争、最优数量、罚金。\n**思路**：写期望利润；利润最大化一阶条件；长期零利润条件。\n**答案**：（1）证明略；一阶条件中不含 F、p。（2）p=π(x*)F/[1−π(x*)]x*。（3）x*=0。\n##**详解**\n（1）此时小贩的期望利润函数为：\n$$Eπ = [1−π(x)]px + π(x)(−F)\n利润最大化的一阶条件为：\n$$dEπ/dx = [1−π(x)]p − π′(x)px − π′(x)F = 0\n由于光盘市场是完全竞争市场，厂商不断进入直到预期利润为零，即：\n$$[1−π(x)]px + π(x)(−F) = 0\n对其整理可得：\n$$px/F = π(x)/[1−π(x)]\n对一阶条件进行整理可得：\n$$[1−π(x)]/x · px/F − π′(x)·px/F − π′(x) = 0\n将 px/F = π(x)/[1−π(x)] 代入上式并整理可得：\n$$π(x)[1−π(x)] − xπ′(x) = 0\n由此一阶条件中不包含 F、p 等变量，因此售卖光盘的最优数量 x* 与罚金 F 或光盘价格 p 均无关。\n（2）当最优数量为 x* 时，由利润为零的条件 [1−π(x)]px + π(x)(−F) = 0 可以求得此时对应的价格为：\n$$p = π(x*)F/{[1−π(x*)]x*}\n（3）将 π(x) = 1 − e^(−λx)（λ > 0）代入（1）中得到的条件 π(x)[1−π(x)] − xπ′(x) = 0。\n此时 π′(x) = λe^(−λx)，代入可得：\n$$(1−e^(−λx))·e^(−λx) − x·λe^(−λx) = 0\n两边同除以 e^(−λx) 得：\n$$1 − e^(−λx) − λx = 0\n显然 x = 0 满足该方程，解得 x* = 0。`},
{id:'m37',special:'微观·要素需求函数',qid:'A1 ★★★',question:'假设一个企业具有Cobb-Douglas生产函数 y=x1^α x2^β；其中，x1 和 x2 分别是两个投入要素，它们的价格外生给定，分别是 w1 和 w2；请回答以下问题：（1）请描述该企业长期的成本最小化问题；（2）假设长期内企业需要生产的产量为 y，请找出两个要素的最优投入量，以及此时的最小成本；（3）假设 a+b<1，求长期的要素需求函数；（4）假设该企业是规模报酬不变，并且第二种要素 x2 的投入量短期内固定在 k 的水平上，那么该企业的短期平均成本、短期平均可变成本与平均固定成本分别为多少。（中山大学考题改编）',answer:`**考察知识点**：成本最小化、条件要素需求、长期成本函数、短期成本。\n**思路**：拉格朗日法求条件要素需求；由利润最大化求要素需求；短期固定要素。\n**答案**：（1）min w1x1+w2x2 s.t. x1^α x2^β=y。（2）x1=(w2a/w1b)^(β/(α+β))y^(1/(α+β))，x2=(w1b/w2a)^(α/(α+β))y^(1/(α+β))；最小成本 TC=w1x1+w2x2。（3）要素需求函数略。（4）短期：AC=w1k^(b/a)y^(1/a−1)+w2k/y，AVC=w1k^(b/a)y^(1/a−1)，AFC=w2k/y。\n##**详解**\n**【分析】**根据生产函数和给定的要素价格可推导得出成本函数，这个知识点非常重要，特别容易出计算题。本题的解答在范里安《微观经济学：现代观点》第 21 章附录予以介绍，建议考生多看看，并多加练习。\n（1）企业的长期成本可以描述为 C = w₁x₁ + w₂x₂，式中 C 为企业的长期总成本。企业成本最小化是说当企业产量 y 确定的情况下，所投入生产要素的总价值最小，即成本最小。\n（2）企业的成本最小化问题：\n$$min w₁x₁ + w₂x₂，s.t. x₁^α·x₂^β = y\n构建拉格朗日辅助函数：\n$$L = w₁x₁ + w₂x₂ − λ(x₁^α·x₂^β − y)\n由一阶条件可得：\n$$∂L/∂x₁ = w₁ − λαx₁^(α−1)x₂^β = 0\n$$∂L/∂x₂ = w₂ − λβx₁^α x₂^(β−1) = 0\n$$∂L/∂λ = y − x₁^α·x₂^β = 0\n联立可解得：\n$$x₁ = (w₂α/(w₁β))^(β/(α+β))·y^(1/(α+β))\n$$x₂ = (w₁β/(w₂α))^(α/(α+β))·y^(1/(α+β))\n这就是能使企业生产产量 y 时两个要素的最优投入量，也即条件要素需求函数。\n此时生产产量 y 的最小成本，也即长期成本函数为：\n$$TC = w₁x₁ + w₂x₂ = w₁(w₂α/(w₁β))^(β/(α+β))·y^(1/(α+β)) + w₂(w₁β/(w₂α))^(α/(α+β))·y^(1/(α+β))\n（3）假设市场价格为 p，此时厂商的利润最大化问题为：\n$$max π = p·x₁^α·x₂^β − w₁x₁ − w₂x₂\n由利润最大化的一阶条件可得：\n$$∂π/∂x₁ = αp·x₁^(α−1)x₂^β − w₁ = 0，∂π/∂x₂ = βp·x₁^α x₂^(β−1) − w₂ = 0\n两式相除整理得 x₂ = (βw₁/(αw₂))·x₁，代回一阶条件可得要素需求函数：\n$$x₁ = (αp/w₁)^(1/(1−α−β))·(βw₁/(αw₂))^(β/(1−α−β))\n$$x₂ = (βp/w₂)^(1/(1−α−β))·(αw₂/(βw₁))^(α/(1−α−β))\n**【校注】**原书此处 x₁ 的表达式排版有误，上面是按一阶条件重新推得的结果。\n（4）当短期内要素 x₂ 的投入量固定在 k 的水平上时，由生产函数 y = x₁^α·k^β 可得：\n$$x₁ = (y/k^β)^(1/α)\n此即为短期的条件要素需求函数。\n因此短期总成本函数为：\n$$TC = w₁x₁ + w₂x₂ = w₁(y/k^β)^(1/α) + w₂k\n短期平均成本为：\n$$AC = TC/y = w₁k^(β/α)·y^(1/α−1) + w₂k/y\n短期平均可变成本为：\n$$AVC = TVC/y = w₁k^(β/α)·y^(1/α−1)\n平均固定成本为：\n$$AFC = TFC/y = w₂k/y`},
{id:'m38',special:'微观·要素需求函数',qid:'B1 ★★',question:'已知某企业的生产函数为 f(x1,x2)=[min{x1,x2}]^(1/a)，x1 和 x2 为两种投入要素的数量，α>0 为常数。已知产品价格为 p，要素价格分别为 w1 和 w2。请求出利润最大化的要素需求函数、供给函数和利润函数。再讨论利润最大化时 α 必须满足什么样的约束条件。（北大早年考题）',answer:`**考察知识点**：完全互补投入、利润最大化、规模报酬。\n**思路**：最优时 x1=x2=x；一阶条件求要素需求；供给函数；规模报酬递减条件。\n**答案**：要素需求 x1=x2=[(w1+w2)a/p]^(1/(1−a))；供给 Q=[(w1+w2)a/p]^(1/(1−a))；利润函数略；要求 a≥1。\n##**详解**\n利润最大化满足：\n$$max p[min{x₁,x₂}]^(1/α) − w₁x₁ − w₂x₂\n最优解处 x₁ = x₂ = x，则利润最大化变为：\n$$max p·x^(1/α) − (w₁+w₂)x\n由利润最大化的一阶条件得：\n$$p·(1/α)·x^(1/α−1) − (w₁+w₂) = 0\n$$x = [(w₁+w₂)α/p]^(α/(1−α))\n因此要素需求函数为：\n$$x₁ = [(w₁+w₂)α/p]^(α/(1−α))，x₂ = [(w₁+w₂)α/p]^(α/(1−α))\n供给函数为：\n$$Q = x^(1/α) = [(w₁+w₂)α/p]^(1/(1−α))\n企业要能利润最大化，则其必然是规模报酬递减或不变的生产函数，即：\n$$f(tx₁,tx₂) ≤ tf(x₁,x₂)\n从而：\n$$[min{tx₁,tx₂}]^(1/α) ≤ t[min{x₁,x₂}]^(1/α)\n$$t^(1/α)[min{x₁,x₂}]^(1/α) ≤ t[min{x₁,x₂}]^(1/α)\n$$α ≥ 1\n所以利润最大化时 α ≥ 1，其中 α = 1 时，经济利润为0。`},
{id:'m39',special:'微观·要素需求函数',qid:'B2 ★★',question:'某厂商的生产函数为 q=10min(k,l)^γ，其中 k 为资本数量，l 为劳动数量，γ 是表示该生产函数的规模报酬的参数。该产品的市场价格为 P，资本和劳动的价格分别为 v、w。（1）解释为什么此处的利润最大化模型要求 0<γ<1。（2）假定 γ=0.5，计算该学校的总成本、供给函数以及利润最大化时的利润水平。（3）如果 γ=1000，w=500，P=600，则该厂商的产量是多少？对应的利润是多少？',answer:`**考察知识点**：规模报酬、成本函数、供给函数、利润最大化。\n**思路**：利润最大化二阶条件要求边际成本递增，即规模报酬递减；求成本函数；完全竞争 P=MC。\n**答案**：（1）需 0<γ<1 使边际成本递增。（2）C=q²(v+w)/100；供给 q=50P/(v+w)；利润 π=25P²/(v+w)。（3）q=20；π=6000。\n##**详解**\n（1）为了使利润最大化的二阶条件得以满足，边际成本必须递增，此时要求规模报酬递减，从而要求 0 < γ < 1。\n（2）当 γ = 0.5 时，厂商生产函数为 q = 10·min(k,l)^0.5。\n为生产既定产量，厂商成本最小时满足 k = l，所以条件要素需求函数为：\n$$k = l = q²/100\n厂商成本函数：\n$$C = vk + wl = (q²/100)(v+w)\n利润最大化要求 P = MC = q(v+w)/50，从而可得供给函数：\n$$q = 50P/(v+w)\n因此利润最大化时的利润水平为：\n$$π = Pq − C = P·(50P/(v+w)) − (v+w)/100·(50P/(v+w))² = 25P²/(v+w)\n（3）由（2）可知，厂商供给函数为 q = 50P/(v+w)，利润最大化时的利润水平 π = 25P²/(v+w)。\n代入 v = 1000，w = 500，P = 600 求得利润最大化时的产量水平：\n$$q = 50×600/(1000+500) = 20\n此时厂商最大利润：\n$$π = 25×600²/(1000+500) = 6000`},
{id:'m40',special:'微观·要素需求函数',qid:'B3 ★★',question:'某企业的生产函数为：f(x1,x2,x3,x4,x5)=[min(3x1+x2,x3)]^(1/3)[min(3x4,x5)]^(1/3)，x1,x2,x3,x4,x5 分别为五种生产要素的投入量。假定所有要素均为可变要素，并且要素价格分别为 w1=w4=2，w3=w5=1，w2=7。求出该企业的条件要素需求函数及长期成本函数。',answer:`**考察知识点**：多要素、替代与互补、条件要素需求、长期成本。\n**思路**：先判断 x1,x2 替代关系；再令互补要素相等；拉格朗日求条件需求。\n**答案**：x2=0；x1=y^(3/2)/3，x3=y^(3/2)，x4=y^(3/2)/3，x5=y^(3/2)；长期成本 C=10y^(3/2)/3。\n##**详解**\n根据企业生产函数的形式，可知 x₁ 和 x₂ 是相互替代的，所以当 w₁/w₂ < 3 时 x₂ = 0，当 w₁/w₂ > 3 时 x₁ = 0。由于本题 w₁ = 2，w₂ = 7，w₁/w₂ = 2/7 < 3，所以 x₂ = 0。\n此时该企业的生产函数变为：\n$$f = [min(3x₁,x₃)]^(1/3)·[min(3x₄,x₅)]^(1/3)\n该企业的目标函数为：\n$$[min(3x₁,x₃)]^(1/3)·[min(3x₄,x₅)]^(1/3) = y\n由生产函数的形式可得 3x₁ = x₃，3x₄ = x₅，并且要素价格 w₁ = w₄ = 2，w₃ = w₅ = 1。\n因此企业的成本最小化问题进一步可以表示为：\n$$min (5/3)x₃ + (5/3)x₅\n$$s.t. x₃^(1/3)·x₅^(1/3) = y\n构造拉格朗日函数，并由一阶条件可以解得：\n$$x₃ = x₅ = y^(3/2)\n所以该企业的条件要素需求函数分别为：\n$$x₁ = (1/3)y^(3/2)，x₂ = 0，x₃ = y^(3/2)，x₄ = (1/3)y^(3/2)，x₅ = y^(3/2)\n该企业的长期成本函数为：\n$$C = (2/3)y^(3/2) + 0 + y^(3/2) + (2/3)y^(3/2) + y^(3/2) = (10/3)y^(3/2)`},
{id:'m41',special:'微观·一厂商多工厂',qid:'A1 ★★',question:'某垄断企业由两个工厂构成，工厂1的生产函数为 y1=x1^α x2^(1−α)，工厂2的生产函数为 y2=x1^β x2^(1−β)，其中 x1 和 x2 为两种要素的投入数量，α 与 β 为常数。如果要素市场为完全竞争市场，r1 和 r2 为两种要素的价格，则该企业的成本函数如何？（北大考题）',answer:`**考察知识点**：多工厂成本函数、等边际成本、柯布-道格拉斯。\n**思路**：分别求两工厂成本函数；成本最小化时 MC1=MC2。\n**答案**：C1(Q)=(r1/α)^α(r2/(1−α))^(1−α)Q，C2(Q)=(r1/β)^β(r2/(1−β))^(1−β)Q；总成本函数按 MC1=MC2 分配产量，表达式略。\n##**详解**\n利用成本最小化来求解。首先来分析工厂1，厂商决策：\n$$min r₁x₁ + r₂x₂，s.t. x₁^α·x₂^(1−α) = Q\n利用拉格朗日方程求解：\n$$x₁ = ((1−α)/α·r₁/r₂)^(α−1)·Q，x₂ = ((1−α)/α·r₁/r₂)^α·Q\n则：\n$$C₁(Q) = r₁x₁ + r₂x₂ = (r₁/α)^α·(r₂/(1−α))^(1−α)·Q\n同理可以算出工厂2的成本函数：\n$$C₂(Q) = (r₁/β)^β·(r₂/(1−β))^(1−β)·Q\n由于：\n$$AC₁ = MC₁ = (r₁/α)^α·(r₂/(1−α))^(1−α)\n$$AC₂ = MC₂ = (r₁/β)^β·(r₂/(1−β))^(1−β)\n厂商成本最小化时，必定 MC₁ = MC₂，否则厂商必定会让其中一个工厂停产。所以其成本函数按产量分配，使两厂边际成本相等；当 MC₁ = MC₂ 时，任意分配产量。\n**【提示】**本题同时涉及求条件要素需求函数和多工厂问题。这里是柯布-道格拉斯生产函数，并且规模报酬不变，回顾之前关于其成本函数的结论。`},
{id:'m42',special:'微观·一厂商多工厂',qid:'A2 ★★',question:'考虑一个两工厂厂商，其工厂的成本函数分别为 C1(y1)=2y1² 和 C2(y2)=(y2+1)²。（1）什么条件下厂商只使用一个工厂？什么条件下厂商需要两个工厂同时生产？（2）推导厂商的成本函数。',answer:`**考察知识点**：多工厂、边际成本、成本函数。\n**思路**：比较边际成本；求等边际成本分配。\n**答案**：（1）y≤1/2 时只用工厂1；y>1/2 时同时使用两工厂。（2）C(y)=2y²+1（y≤1/2）；C(y)=2(y+1)²/3（y>1/2）。\n##**详解**\n（1）如果厂商同时使用两个工厂，应当满足 MC₁(y₁) = MC₂(y₂)，即：\n$$4y₁ = 2(y₂+1)\n但是，注意到 MC₂(y₂) ≥ MC₂(0) = 2，而当 y₁ ≤ 1/2 时 MC₁(y₁) ≤ 2。\n所以当总产量满足 y ≤ 1/2 时，厂商只会选择在工厂1生产；当总产量满足 y > 1/2 时，厂商会同时使用两个工厂。\n（2）在同时使用两个工厂的情况下，厂商的产量分配满足 MC₁(y₁) = MC₂(y₂) 以及 y₁ + y₂ = y，由此解得：\n$$y₁ = (y+1)/3，y₂ = (2y−1)/3\n此时总成本为：\n$$C(y) = C₁(y₁) + C₂(y₂) = 2((y+1)/3)² + ((2y−1)/3 + 1)² = (2/3)(y+1)²\n成本函数为：\n$$C(y) = 2y² + 1，y ≤ 1/2\n$$C(y) = (2/3)(y+1)²，y > 1/2\n**【提示1】**等边际法则推导过程。当一个厂商想在多个工厂之间分配产量时，其面临的问题为：\n$$min Σ C_i(y_i)，s.t. Σ y_i = y\n构造拉格朗日函数并由一阶条件可得均衡条件为：MC₁(y₁) = MC₂(y₂) = … = MC_n(y_n)。\n**【提示2】**一厂商多工厂分配产量需要注意是否存在特殊情况，两类特殊情况遗忘的可以回顾三大本第2册《计算专题与知识要点总结》第一部分计算专题总结的专题八。`},
{id:'m43',special:'微观·一厂商多工厂',qid:'B1 ★★★',question:'一个富有进取心的企业家购买了两个工厂以生产装饰品。每个工厂生产相同产品而且每个工厂的生产函数都是 q=√(KiLi)（i=1,2）。每个工厂在各自拥有的资本存量方面却不同。工厂1拥有 K1=25，工厂2拥有 K2=100。L 与 K 的租金价格由 w=v=1 元给出。（1）如果该企业家试图使短期生产总成本最小，则产出应如何在两个厂间分配？（2）给定在两个工厂间的最优产量分配，计算短期总成本、平均成本与边际成本。（3）在长期，应如何在两个工厂间分配产量？计算长期总成本、平均成本与边际成本曲线。（4）如果两个厂商呈现规模报酬递减，则（3）将会有什么变化？',answer:`**考察知识点**：多工厂短期/长期成本、等边际成本、规模报酬。\n**思路**：短期固定资本，求各厂短期成本；等边际成本分配；长期资本可调。\n**答案**：（1）产量分配 q1:q2=1:4，即 q1=Q/5，q2=4Q/5。（2）STC=125+Q²/125，SAC=125/Q+Q/125，SMC=2Q/125。（3）长期任意分配不影响总成本；LTC=2Q，LAC=LMC=2。（4）规模报酬递减时，最优使两厂边际成本相等，且因生产函数相同，q1=q2=Q/2。\n##**详解**\n（1）短期内，每个工厂的固定投入的数量是确定的，所以它们的生产函数就变为：\n$$q₁ = 5√L₁，q₂ = 10√L₂\n于是两个工厂各自的短期成本函数为：\n$$STC₁(q₁) = 25 + q₁²/25，STC₂(q₂) = 100 + q₂²/100\n工厂1边际成本为 SMC₁(q₁) = 2q₁/25；工厂2边际成本为 SMC₂(q₂) = q₂/50。\n由等边际法则 SMC₁(q₁) = SMC₂(q₂)，即有：\n$$2q₁/25 = q₂/50\n解得 q₁ = q₂/4，即产量在两个工厂之间分配的比例为1:4。设总产量为 Q，则工厂1产量为 Q/5，工厂2产量为 4Q/5。\n（2）把 q₁ = 0.2Q，q₂ = 0.8Q 代入成本最小化问题的目标函数式中，就得到了该企业的短期总成本函数：\n$$STC = STC₁(Q/5) + STC₂(4Q/5) = 125 + Q²/125\n则短期平均成本函数为：\n$$SAC = 125/Q + Q/125\n短期边际成本函数为：\n$$SMC = 2Q/125\n（3）长期内，由于两个工厂的生产函数相同，那么对于每一个单独的工厂而言，其成本最小化问题是：\n$$min wL + vK\n$$s.t. q = K^(1/2)·L^(1/2)\n利用拉格朗日乘数法解得资本和劳动力的条件要素需求函数为：\n$$K = q(w/v)^(1/2)，L = q(w/v)^(−1/2)\n把要素需求函数代入目标函数式中得到单个工厂的长期成本函数：\n$$LTC = 2q(wv)^(1/2) = 2q\n这样企业的成本最小化问题就是：\n$$min 2q₁ + 2q₂\n$$s.t. q₁ + q₂ = q\n易见，长期内无论在两个工厂之间如何分配产量，都不会影响企业的总成本。这是由于长期内厂商可以自由调整要素投入量，要素可在各部门之间自由流动，所以企业的长期成本函数为 LTC = 2q，相应的长期边际成本和长期平均成本分别为 LAC = LMC = 2。\n（4）如果两个工厂的生产技术表现出规模报酬递减，那么厂商的产量分配标准是使得每个工厂生产的最后一单位产品的边际成本相同，即 MC₁(q₁) = MC₂(q₂)。特别地，由于本题假设两个工厂的生产函数相同，所以最优的产量分配方案是每个工厂生产相同的产量，即：\n$$q₁ = q₂ = q/2\n**【提示】**本题为尼科尔森《微观经济理论》课后题，人大考过本题的前两问。`},
{id:'m44',special:'微观·生产者其他计算',qid:'A1 ★★',question:'已知某企业的生产函数为 Q=L^(2/3)K^(1/3)，劳动的价格 w=4，资本的价格 r=2。（1）当产量 Q=2000 时，企业实现最小成本的 L、K 购买量及最小成本 C 的值。（2）当成本 C=6000 时，企业实现最大产量的 L、K 购买量及最大产量 Q 的值。',answer:`**考察知识点**：成本最小化、产量最大化、拉格朗日法。\n**思路**：分别构造拉格朗日函数求一阶条件。\n**答案**：（1）K=L=2000，最小成本 C=12000。（2）K=L=1000，最大产量 Q=1000。\n##**详解**\n（1）企业在既定产量下实现成本最小化的问题可以描述为：\n$$min 4L + 2K\n$$s.t. L^(2/3)·K^(1/3) = 2000\n构造拉格朗日函数：\n$$F = 4L + 2K − λ(L^(2/3)·K^(1/3) − 2000)\n由一阶条件可得：\n$$∂F/∂L = 4 − (2/3)λ(K/L)^(1/3) = 0\n$$∂F/∂K = 2 − (1/3)λ(L/K)^(2/3) = 0\n$$∂F/∂λ = 2000 − L^(2/3)·K^(1/3) = 0\n解得 K = L = 2000，此时最小成本为：\n$$C = 4L + 2K = 12000\n（2）企业在既定成本下实现产量最大化的问题可以描述为：\n$$max L^(2/3)·K^(1/3)\n$$s.t. 4L + 2K = 6000\n构造拉格朗日函数：\n$$F = L^(2/3)·K^(1/3) − λ(4L + 2K − 6000)\n由一阶条件可得：\n$$∂F/∂L = (2/3)(K/L)^(1/3) − 4λ = 0\n$$∂F/∂K = (1/3)(L/K)^(2/3) − 2λ = 0\n$$∂F/∂λ = 6000 − 4L − 2K = 0\n解得 K = L = 1000，此时最大产量为 Q = 1000。`},
{id:'m45',special:'微观·生产者其他计算',qid:'A2 ★★',question:'Q=f(L,K)=AL^α K^(1−α)，A>0，0<α<1。（1）证明 MPL>0，MPK>0，∂²Q/∂L²<0，∂²Q/∂K²<0。（2）证明其满足欧拉定理。（3）证明其扩展线为通过原点的一条直线（当 w=4，r=2）。（4）劳动的产出弹性为 eL=α，资本的产出弹性为 eK=1−α。（5）证明 MRTSLK 只取决于 K/L，而不依赖于生产规模，而且 MRTSLK 随着 L/K 的增加而递减。（6）若市场为完全竞争市场，则使用资本的成本占总成本比例为 1−α，而劳动的相对份额为 α。',answer:`**考察知识点**：柯布-道格拉斯生产函数性质、欧拉定理、扩展线、要素份额。\n**思路**：求偏导；验证欧拉定理；由 MRTS=w/r 求扩展线；求弹性与份额。\n**答案**：证明略；结论如题所述。扩展线 K=2(1−α)L/α。\n##**详解**\n（1）由于 A > 0，0 < α < 1：\n$$MP_L = ∂Q/∂L = αAL^(α−1)K^(1−α) > 0，∂²Q/∂L² = α(α−1)AL^(α−2)K^(1−α) < 0\n$$MP_K = ∂Q/∂K = (1−α)AL^α K^(−α) > 0，∂²Q/∂K² = −α(1−α)AL^α K^(−α−1) < 0\n（2）由欧拉定理：\n$$f_L·L + f_K·K = MP_L·L + MP_K·K = αAL^α K^(1−α) + (1−α)AL^α K^(1−α) = AL^α K^(1−α) = Q\n故该生产函数满足欧拉定理。\n（3）生产的最优条件为 MP_L/MP_K = w/r，即：\n$$αAL^(α−1)K^(1−α)/((1−α)AL^α K^(−α)) = αK/((1−α)L) = w/r = 2\n整理可得生产扩展线为 K = 2(1−α)L/α，即扩展线为通过原点的一条直线。\n（4）劳动的产出弹性：\n$$e_L = (∂Q/∂L)·(L/Q) = αAL^(α−1)K^(1−α)·L/(AL^α K^(1−α)) = α\n资本的产出弹性：\n$$e_K = (∂Q/∂K)·(K/Q) = (1−α)AL^α K^(−α)·K/(AL^α K^(1−α)) = 1−α\n（5）\n$$MRTS_LK = MP_L/MP_K = αAL^(α−1)K^(1−α)/((1−α)AL^α K^(−α)) = α/(1−α)·(1/(L/K))\n所以：\n$$∂MRTS_LK/∂(L/K) = −α/(1−α)·1/(L/K)² < 0\nMRTS_LK 只取决于 K/L，而不依赖于生产规模，而且 MRTS_LK 随着 L/K 的增加而递减。\n（6）在完全竞争市场上，厂商按照生产的最优条件 MP_L/MP_K = w/r 进行生产，即：\n$$αAL^(α−1)K^(1−α)/((1−α)AL^α K^(−α)) = αK/((1−α)L) = w/r\n化简得 αrK = (1−α)wL。\n资本成本和劳动成本分别为 rK 和 wL，总成本为 rK + wL。\n$$rK/(rK+wL) = rK/((1/(1−α))rK + rK) = 1−α\n$$wL/(rK+wL) = wL/((1/α)wL + wL) = α\n即资本的相对份额为 1−α，劳动的相对份额为 α。\n**【提示】**本题第（6）问的结论在宏观经济增长理论中也经常用到，务必记住并掌握其推导。`},
{id:'m46',special:'微观·生产者其他计算',qid:'A3 ★★',question:'假设一家企业的生产函数是 f(K,L)=K²L²/4，其中 L 的价格是 w，K 的价格是 r，请回答以下问题：（1）证明企业的生产技术是规模报酬递增的。（2）长期扩展路径是由资本和劳动最优组合所组成的曲线，请用画图的方法把这一路径找出来。（3）如果 w=10，r=2，请找出这条长期扩展路径具体的函数形式。',answer:`**考察知识点**：规模报酬、扩展线、最优要素组合。\n**思路**：验证 f(λK,λL)>λf(K,L)；由 MRTS=w/r 求扩展线。\n**答案**：（1）规模报酬递增。（2）图略，为等成本线与等产量线切点连线。（3）K=5L。\n##**详解**\n（1）规模报酬递增是指随着投入量成比例地增加，产出量增加的比例大于各种生产要素增加的比例，用生产函数表示就是：对任意 λ > 1，有 f(λK,λL) > λf(K,L)。\n对于本题，对任意 λ > 1，因为：\n$$f(λK,λL) = (1/4)(λK)²(λL)² = (1/4)λ⁴K²L² > λf(K,L) = (1/4)λK²L²\n所以企业的生产技术是规模报酬递增的。\n（2）资本和劳动的最优组合点为等成本曲线与等产量曲线的切点，即成本一定时的最大生产量，或者是生产量一定下的最小成本。如下图所示，均衡点的连线即为长期扩展路径。\n【此处有图示】\n（3）由最优组合点的条件 MRTS_LK = w/r 可得：\n$$((1/2)K²L)/((1/2)KL²) = w/r\n即 K/L = w/r，整理可得长期扩展路径为 K = (w/r)L。\n将 w = 10，r = 2 代入上式，可得长期扩展路径的具体形式为 K = 5L。\n**【提示】**生产扩展线类似于消费者理论中的收入-消费曲线（收入-提供曲线）。对于柯布-道格拉斯的生产函数，其生产扩展线是一条过原点的射线，因此可以推知，对于柯布-道格拉斯效用函数，其收入-消费曲线也是一条过原点的射线。`},
{id:'m47',special:'微观·生产者其他计算',qid:'A4 ★★★',question:'若生产函数为 y=x1^α x2^(1−α)，求其利润函数。',answer:`**考察知识点**：利润最大化、规模报酬不变、利润函数。\n**思路**：一阶条件；规模报酬不变时最大利润为0。\n**答案**：利润函数 π(p,w1,w2)=0。\n##**详解**\n生产函数为 y = x₁^α·x₂^(1−α) 的利润最大化问题为：\n$$max π = p·x₁^α·x₂^(1−α) − w₁x₁ − w₂x₂\n一阶条件为：\n$$∂π/∂x₁ = αp·x₁^(α−1)x₂^(1−α) − w₁ = 0，∂π/∂x₂ = (1−α)p·x₁^α x₂^(−α) − w₂ = 0\n可得：\n$$w₁x₁ = αp·x₁^α x₂^(1−α)，w₂x₂ = (1−α)p·x₁^α x₂^(1−α)\n将以上两式代入利润函数式 π = p·x₁^α x₂^(1−α) − w₁x₁ − w₂x₂，可得：\n$$π(p,w₁,w₂) = 0\n**【提示】**通过上面柯布-道格拉斯生产函数的具体例子的计算，可以证明一个结论"如果厂商在规模报酬不变阶段实现最大利润，那么此时最大利润一定为零"。大家可以自己计算规模报酬递减和规模报酬递增的情况。\n同时，通过上面的例子也可以知道，当规模报酬不变时，利用利润最大化求不出要素需求函数。\n**【提示】**可参考范里安教材第 19 章「利润最大化和规模报酬不变」。`},
{id:'m48',special:'微观·长短期均衡',qid:'A1 ★★★',question:'假设一个完全竞争厂商，生产成本为：TC=10q²−20q+100，q 是产出水平，TC 是总成本。（1）写出该厂商的平均可变成本 AVC 和边际成本 MC。（2）如果市场价格 P=80，为实现利润最大化，它应生产多少产量？利润是多少？（3）在短期中该厂商是否可能关闭？请解释原因。',answer:`**考察知识点**：短期成本、利润最大化、停业条件。\n**思路**：求 AVC、MC；P=MC；比较 MC 与 AVC。\n**答案**：（1）AVC=10q−20，MC=20q−20。（2）q=5，利润150。（3）不可能关闭，因任何产量下 MC>AVC。\n##**详解**\n（1）根据总成本 TC = 10q² − 20q + 100 可得：\n平均可变成本 AVC = TVC/q = (10q² − 20q)/q = 10q − 20；\n边际成本 MC = dTC/dq = 20q − 20。\n（2）当价格 P = 80 时，企业的利润：\n$$π = 80q − (10q² − 20q + 100) = −10q² + 100q − 100\n利润最大化的一阶条件为：\n$$dπ/dq = −20q + 100 = 0\n解得 q = 5。\n此时的最大利润：\n$$π = 80×5 − (10×5² − 20×5 + 100) = 150\n（3）在短期内，只有当完全竞争厂商利润最大化点处的边际成本小于平均可变成本时，厂商才会停止营业。\n厂商边际成本 MC = 20q − 20，平均可变成本 AVC = 10q − 20，显然在任何产量水平上都存在 MC > AVC，故在短期内该厂商不可能关闭。`},
{id:'m49',special:'微观·长短期均衡',qid:'A2 ★★★',question:'A企业所在的市场为完全竞争市场。A的短期成本函数为 C(q)=20+5q+q²，其中20为企业的固定成本。（1）请推导出A企业的短期供给曲线。（2）当市场价格为15时，短期均衡的利润为多少？此时的生产者剩余是多少？（3）若产量大于0时，长期成本函数 C(q)=9+4q+q²，则长期均衡的产出是多少？长期均衡的利润为多少？',answer:`**考察知识点**：短期供给曲线、生产者剩余、长期均衡。\n**思路**：P=MC 且 P≥AVC；生产者剩余 PS=π+TFC；长期 P=ACmin。\n**答案**：（1）q=(P−5)/2（P≥5）。（2）利润5，生产者剩余25。（3）长期均衡产出 q=3，利润0。\n##**详解**\n（1）由企业A的成本函数可得：\n$$MC = dC/dq = 5 + 2q，AVC = TVC/q = 5 + q\n显然有 MC ≥ AVC。\n根据完全竞争市场利润最大化条件 P = MC，则有：\n$$P = 2q + 5\n故A企业的短期供给曲线为：\n$$q = (1/2)(P−5)（P ≥ 5）\n（2）当 P = 15 时，此时企业的利润最大化问题为：\n$$max π = 15q − 20 − 5q − q²\n利润最大化的一阶条件为：\n$$dπ/dq = 15 − 5 − 2q = 0\n解得 q = 5，故短期均衡利润为：\n$$π = 15×5 − 20 − 5×5 − 5² = 5\n生产者剩余为：\n$$PS = π + TFC = 5 + 20 = 25\n**【提示】**短期 PS 和 π 的关系 PS = π + TFC，参见平狄克《微观经济学》第 8 版第 274 页。这里也可以利用生产者剩余的定义来求解。\n补充：利用定义求生产者剩余 PS = (1/2)×(15−5)×5 = 25。\n（3）由长期成本函数可得长期平均成本函数为：\n$$AC = C(q)/q = 9/q + 4 + q\n长期平均成本最小化的一阶条件为：\n$$dAC/dq = −9/q² + 1 = 0\n解得 q = 3 或 q = −3（负值舍去）。\n此时：\n$$AC_min = 9/q + 4 + q = 10\n由于长期竞争厂商的均衡产出为长期平均成本最低点处的产出，且产品价格等于长期平均成本的最小值，故有长期均衡产出为 q = 3，P = AC_min = 10，企业长期均衡的利润为0。`},
{id:'m50',special:'微观·长短期均衡',qid:'A3 ★★★',question:'已知完全竞争的成本不变行业的单个厂商长期总成本函数为 LTC=Q³−4Q²+10Q。求：（1）该行业实现长期均衡时单个厂商的产量的市场价格。（2）当市场需求函数为 Q=200−10P 时，行业长期均衡时的企业数目。（3）当行业长期均衡时市场需求的价格点弹性是多少。',answer:`**考察知识点**：成本不变行业、长期均衡、需求弹性。\n**思路**：LAC 最低点；P=LACmin；市场需求求行业产量；企业数 n=Q/q。\n**答案**：（1）Q=2，P=6。（2）企业数70。（3）需求价格弹性3/7。\n##**详解**\n（1）完全竞争行业的单个厂商在最低平均成本处实现长期均衡。\n而：\n$$LAC = LTC/Q = Q² − 4Q + 10\n令其一阶导数为零，得 2Q − 4 = 0，得出最低平均成本时单个厂商的产量 Q = 2。因平均成本函数二阶导数大于零，此时最低平均成本为 LAC = 6，市场价格 P 即为6。\n（2）因为是成本不变行业，所以行业的供给曲线就是水平线 P = 6，代入市场需求函数 Q = 200 − 10P 得整个市场的产量 Q = 140，因此行业长期均衡时的企业数目：\n$$n = 140/2 = 70\n（3）当行业长期均衡时，将 dQ/dP = −10，P = 6，Q = 140 代入到需求价格弹性公式 E_d = −(dQ/dP)·(P/Q)，得：\n$$E_d = −(−10)×6/140 = 3/7\n即当行业长期均衡时市场需求的价格点弹性为 3/7。\n**【提示】**虽然说长期不存在固定成本，因为长期厂商可以调整所有的生产要素。但需要知道的是，厂商可以调整所有要素，但它并不是总愿意调整所有要素，对于那部分厂商不愿意调整的生产要素就形成了长期的固定成本。所以大家有的时候见到题目给的长期成本函数包含了固定成本也不用过多纠结，按照题目给的成本函数来就行。因为大多数情况下题目给的长期成本函数中包含固定成本的主要目的是方便计算，就比如本题第（3）问，如果没有常数项，就算不出长期平均成本的最小值。`},
{id:'m51',special:'微观·长短期均衡',qid:'A4 ★★★',question:'完全竞争市场存在着大量的潜在进入者。假设每个厂商都有相同的成本结构，且该行业为成本不变行业。当其产量为 q=20 单位时，长期平均成本最小，且最小的平均成本为10元。市场总需求曲线为 D=1500−50P。求：（1）该行业长期供给函数；（2）长期的均衡价格是多少？厂商数目是多少？（3）与每个厂商长期均衡产出相关的短期成本函数为 C=0.5q²−10q+200，求出厂商短期平均成本最低时的产出水平；（4）计算每个厂商的短期供给曲线和行业的短期供给函数；（5）假设市场需求曲线向外移动到 D=2000−50P。在短期中，重新计算均衡价格及厂商的产出水平。（对外经贸 2021 年考题）',answer:`**考察知识点**：成本不变行业、长期供给、短期供给、短期均衡。\n**思路**：长期供给水平线 P=LACmin；短期 P=MC；市场供求相等。\n**答案**：（1）P=10。（2）P=10，n=50。（3）q=20。（4）单个 q=P+10；行业 S=50P+500。（5）短期 P=15，Q=1250，单个厂商 q=25。\n##**详解**\n（1）成本不变行业长期供给曲线为 P = LAC_min。\n由题意可知，当厂商产量 q = 20 时，LAC 取得最小值，且 LAC_min = 10。\n所以行业长期供给函数为 P = 10。\n（2）由于长期中存在大量的潜在进入者，所以长期均衡时厂商满足利润最大化 P = LMC 和经济利润为零 P = LAC，进而由 LMC 与 LAC 的关系可知，长期均衡时存在 P = LMC = LAC_min。\n由题意可知 q = 20 时 LAC_min = 10，所以长期均衡价格 P = 10，代入市场总需求函数，求得均衡总产量：\n$$Q = 1500 − 50×10 = 1000\n所以厂商数目：\n$$n = Q/q = 1000/20 = 50\n（3）短期成本函数 C = 0.5q² − 10q + 200，所以短期平均成本：\n$$AC = 0.5q − 10 + 200/q\n求一阶导可得：\n$$dAC/dq = 0.5 − 200/q² = 0\n所以当 q = 20 时，AC 取得最小值，且 AC_min = 10。\n（4）完全竞争厂商利润最大化时满足 P = MC，即：\n$$P = q − 10\n所以单个厂商的供给函数为 q = P + 10（P ≥ 0）。\n由（2）可知，此时厂商数目为 n = 50，所以行业短期供给函数：\n$$S = 50q = 50P + 500\n（5）短期均衡时满足供求相等，即：\n$$50P + 500 = 2000 − 50P\n解得短期均衡价格和产量：P = 15，Q = 1250，此时单个厂商的产量 q = P + 10 = 25。`},
{id:'m52',special:'微观·长短期均衡',qid:'A5 ★★★',question:'在一个完全竞争、成本不变的行业中有几百个企业，这些企业的长期成本函数相同，均为 LTC=0.1q³−1.2q²+111q，其中 q 是单个企业的年产量，市场对该行业产品的需求曲线为 Q=6000−20p，其中 Q 是行业的年产量。问：（1）该行业的长期均衡产量。（2）均衡时该行业将有多少企业？（3）若政府决定将该行业的企业数减至60家，并且用竞争性投标的方式每年出售60份许可证。于是企业的数目固定为60家，并且这60家企业的竞争性经营将形成新的均衡。那么产品的新价格是多少？一份一年期许可证的竞争均衡价格是多少？',answer:`**考察知识点**：长期均衡、许可证、租金。\n**思路**：长期 P=LACmin=LMC；市场需求求行业产量；限制企业数后市场均衡；许可证价格等于超额利润。\n**答案**：（1）行业长期均衡产量3852。（2）企业数642。（3）新价格约227.64；许可证价格约2108.25。\n##**详解**\n（1）市场中单个企业的长期平均成本和边际成本分别为：\n$$LAC = 0.1q² − 1.2q + 111，LMC = 0.3q² − 2.4q + 111\n达到长期均衡时，每个厂商的最大经济利润都是零，所以均衡的市场价格必定等于厂商的长期最低平均成本。\n由于在长期平均成本的最低点处有 LAC = LMC，即：\n$$0.1q² − 1.2q + 111 = 0.3q² − 2.4q + 111\n解得单个企业的均衡产量和市场价格分别为 q* = 6，p* = 107.4。\n行业的长期均衡产量：\n$$Q* = 6000 − 20×107.4 = 3852\n（2）长期均衡时，行业中厂商数目：\n$$N = Q*/q* = 3852/6 = 642\n（3）单个厂商利润最大化的条件为 p = LMC，即：\n$$p = 0.3q² − 2.4q + 111\n所以如果把厂商数量限制为60家，那么市场达到新的均衡时，就有：\n$$p = 0.3q² − 2.4q + 111\n$$60q = 6000 − 20p\n联立解得 q* = 24.12，p* = 227.64。\n从而单个厂商的利润为：\n$$π* = p*q* − LTC(q*) ≈ 2108.25\n这就是许可证的价格。原因如下：\n如果政府通过出售经营许可证的方法把厂商的数量限制为60家，那么对于获得经营权的厂家，它的长期成本需要在原来的成本函数上再加上它为获得许可证而支付的资金。这样在达到新的均衡时，每个厂商的利润必然又会回到零（否则的话，就会有其他未获得许可证的厂家愿意对许可证支付比当前价格略高的价格以获得经营权，并且该厂商会获得正利润）。\n以上的分析表明，每份许可证的竞争性价格恰好等于 π* = 2108.25。`},
{id:'m53',special:'微观·长短期均衡',qid:'A6 ★★★',question:'在某一座10万人口的城市，政府发了1000辆出租车经营牌照。为了模型的简便，我们设每辆出租车每天固定载客运行300公里，每天运行的成本（包括汽车折旧、司机劳动力投入和汽油等）是300元。设该城市中每人每天对出租车的需求函数是 p=32−10q，其中 q 为坐出租车出行的公里数，p 为每公里的价格。假设出租车市场是完全竞争的。（1）试计算当地出租车市场的均衡价格（每公里价格）以及数量（总里程数）。（2）设每一年365天，一辆出租车每天都按上述的情况在跑，人们对未来收益的年折现率是10%，求每块出租车经营牌照的价格。',answer:`**考察知识点**：完全竞争、牌照租金、永续年金现值。\n**思路**：市场供给固定为300000公里；需求求价格；利润现值。\n**答案**：（1）均衡价格2元，总里程300000公里。（2）牌照价格1095000元。\n##**详解**\n（1）由每人每天对出租车的需求 p = 32 − 10q，即 q = 3.2 − 0.1p，可知该城市每天对出租车的需求为：\n$$Q = 100000q = 320000 − 10000p\n1000辆出租车每天载客运行 300×1000 = 300000 公里。\n由完全竞争市场的均衡条件，可知当地出租车市场的均衡数量为 Q* = 300000，代入需求函数可得均衡价格：\n$$p* = 2（元）\n（2）每辆出租车每年利润为：\n$$π = 365(p*q* − C) = 365×(2×300 − 300) = 109500\n由未来收益的年折现率是10%，可知每辆出租车未来收益的现值为：\n$$π/10% = 109500/0.1 = 1095000\n因此，每块出租车经营牌照的价格为1095000元。\n**【提示】**这里第（2）问未来收益的现值之所以是 π/10% 而不是 π/110%，是因为取得牌照后未来每一期都可以获得利润，这里就相当于是永续年金。`},
{id:'m54',special:'微观·长短期均衡',qid:'B1 ★★★',question:'在某一产品市场，仅有七个企业可能经营，生产完全同质化产品，均为价格接受者，每个企业总成本函数 Ci=1+q²/i，i=1,2,…,7。市场需求 Q=30−P，Q 为总需求，P 为均衡价格。求产品市场的长期均衡价格。（2012 年北大ccer考题）',answer:`**考察知识点**：完全竞争、市场供给、长期均衡。\n**思路**：求各企业供给；加总市场供给；供求相等。\n**答案**：P=2。\n##**详解**\n由企业 i 的总成本函数可得其边际成本函数为：\n$$MC_i = 2q_i/i\n则企业 i 的供给函数为：\n$$P = MC_i = 2q_i/i\n即：\n$$q_i = (P/2)·i\n由于产品市场上由七个企业经营，因此市场总供给为：\n$$Q = Σ q_i = (P/2)(1+2+3+4+5+6+7) = 14P\n产品市场均衡时，市场需求等于市场供给，即有：\n$$30 − P = 14P\n解得 P = 2，此即为长期均衡价格。\n**【提示】**本题和前面两道题都涉及完全竞争市场长期均衡，注意区分：\n前两道题在长期厂商可以自由进入和退出，因此满足两个条件：利润最大化条件 p = MC，利润为零的条件 p = LAC，进而可以得到 p = MC = LAC_min。\n本题虽然也是长期问题，但是由于存在外部力量限制了厂商自由进出市场，因此长期均衡时不再满足利润为零的条件，即 p = LAC 不再满足，此时解题思路是：市场供求相等。`},
{id:'m55',special:'微观·长短期均衡',qid:'B2 ★★',question:'在家政市场上，每个家政钟点工做每次家政的成本（MC）为10元，每天可以做7次家政工作，市场上对于家政工作的需求函数为 D(p)=1900−50p。（1）求每次家政工作的均衡价格、家政工作总次数以及家政工人的数量。（2）需求函数改变为：D(p)=2000−50p 时，如果政府给原有的家政人员每人颁发一个家政服务牌照，从而使得市场上的家政人员数量以及家政服务总量保持不变，那么均衡价格和利润是多少？（3）假设一年家政人员工作300天，利率 r=10%，那么，政府颁发的牌照值多少钱，其他的家政人员为了阻止政府多发放一个牌照，愿意支付多少钱？（对外经贸 2018 年考题）',answer:`**考察知识点**：完全竞争、牌照价值、超额利润现值。\n**思路**：P=MC；市场均衡；牌照价格等于未来超额利润现值。\n**答案**：（1）价格10元，总次数1400，工人数200。（2）均衡价格12元，单个利润14元。（3）牌照价格42000元；其他家政人员愿支付2940元阻止多发一个牌照。\n##**详解**\n（1）在题设情况下，可以将家政市场上的生产者（家政钟点工）看作完全竞争厂商，由完全竞争厂商利润最大化的条件 p = MC 可得，市场供给曲线为 p = 10。\n联立市场供求曲线，可得：\n$$(1900 − Q)/50 = 10\n解得市场均衡的家政总数 Q = 1400，均衡价格 p = 10（元），家政工人数量：\n$$n = Q/7 = 200\n（2）此时市场均衡满足：\n$$2000 − 50p = 200×7\n解得均衡价格 p = 12（元）。单个家政工人的利润：\n$$π = 12×7 − 10×7 = 14（元）\n（3）家政人员愿意支付的牌照价格等于未来所获得的所有超额利润的现值。\n故牌照的价格：\n$$P = 14×300/10% = 42000（元）\n当市场中有201位家政工人时，市场均衡时满足供求相等，即：\n$$2000 − 50p = 7×201\n解得均衡价格 p = 11.86（元）。\n单个家政工人每天的利润：\n$$π = 11.86×7 − 10×7 = 13.02（元）\n家政工人未来所获得的利润的现值为：\n$$13.02×300/10% = 39060（元）\n此时家政工人的利润下降 42000 − 39060 = 2940 元，此即为每一位家政人员为了阻止政府多发放一个牌照所愿意支付的钱。`},
