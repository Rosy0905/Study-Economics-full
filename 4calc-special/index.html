{id:'h19',special:'宏观·总供给曲线求解',qid:'A1 ★★★',question:'已知某宏观经济中的总量生产函数 Y=K^α L^β，α+β=1，K 和 L 分别为两个生产要素，它们相应的价格分别为 C 和 W，产出 Y 的价格为 P。（1）写出劳动需求函数；（2）写出总供给函数；（3）设 α=β=0.5，K=500，W=25，W/P=1，写出新凯恩斯学派的总供给函数和古典学派的总供给函数。',answer:`考察知识点：劳动需求、总供给函数、新凯恩斯与古典学派。\n思路：利润最大化求劳动需求；代入生产函数求AS。\n答案：（1）L=f(W/P)，劳动需求是实际工资的减函数。（2）Y=K(W/P)^(−(1−α)/α)(1−α)^((1−α)/α)。（3）新凯恩斯：Y=10P；古典：Y=250。`},
{id:'h20',special:'宏观·总供给曲线求解',qid:'A2 ★★★',question:'假设生产函数和劳动供给函数分别由以下两个式子 F(N)=20N−N² 和 NS=W/(2P) 刻画，其中 N 为工人人数，W 为名义工资，P 为价格水平。（1）求解劳动力市场均衡工资水平和均衡雇佣人数。（2）假设价格水平外生给定，若政府推行最低名义工资水平 W=50，计算存在最低工资时的均衡价格水平和就业人数。（3）在最低名义工资水平为50时，推导总供给曲线。',answer:`考察知识点：劳动市场均衡、最低工资、总供给曲线。\n思路：求劳动需求与供给；分情况讨论最低工资下的均衡。\n答案：（1）W/P=10，N=5。（2）P=5，N=5。（3）总供给曲线分段：P<2.5 时 Y=0；2.5<P<5 时 Y=100−625/P²；P≥5 时 Y=500−625/P²。`},
{id:'h21',special:'宏观·带有预期的AS',qid:'A1 ★★',question:'一个经济的总需求和总供给分别为：AD:m+v=p+y；AS:p=p*+λ(y−y*)。其中，p* 代表对价格水平的预期，y* 为充分就业产出水平，m 为货币总量。（1）若预期为完全预期，求出均衡的价格与产出水平。（2）若货币当局实行了一次意料外的并且是永久性的货币扩张，图解这次政策操作的短期和长期效应。',answer:`考察知识点：AD-AS、预期、货币政策短期与长期效应。\n思路：完全预期时 p=p*；未预期到的货币扩张短期影响产出，长期只影响价格。\n答案：（1）y=y*，p=m+v−y*。（2）短期产出增加、价格上升，长期产出回到充分就业、价格进一步上升。`},
{id:'h22',special:'宏观·带有预期的AS',qid:'A2 ★★',question:'假设一个经济体中的总需求曲线为 y=m+v−p，总供给曲线为 y=y*+λ(p−E(p))。（1）上述形式总需求方程的理论基础是什么？为什么货币量对总需求有正面影响，而物价水平对总需求的影响是负面的。（2）在总供给曲线中为什么预期价格的失误会导致总供给偏离充分就业水平？（3）该经济中的均衡产量水平是什么？它受什么因素的影响？与预期价格有关吗？（4）如果人们对价格的预期是理性的，该经济中的均衡产量水平是什么？（5）在 v 是随机外在冲击的情况下，请问中央银行有没有必要采取货币政策以稳定经济于充分就业水平？',answer:`考察知识点：AD-AS、理性预期、货币政策有效性。\n思路：货币数量论；预期误差影响产出；理性预期下产出回到自然率。\n答案：（1）理论基础为货币数量论。（2）预期失误导致实际价格偏离预期价格，从而产出偏离充分就业。（3）y=y*/(1+λ)+λ(m+v−E(p))/(1+λ)；受货币量、流通速度、预期价格影响。（4）y=y*。（5）没有必要。`},
{id:'h23',special:'宏观·带有预期的AS',qid:'B1 ★',question:'AD-AS模型由下式说明：AD:y=m−p；AS:p=pe+λ(y−y*)。（1）假如预期价格是外生变量，请计算均衡的GDP是多少？用经济学原理解释，当货币量增加时，GDP会如何变动？其内在机制是什么？（2）假如预期是完全预见，GDP是多少？货币量的增加对GDP的影响是什么？（3）什么是理性预期？利用模型说明，当公众使用理性预期时，预期价格是多少？实际价格是什么？均衡GDP是多少？（4）假如预期是理性预期，同时信息不完全，根据你对第（2）问的回答说明货币供给量增加对GDP的影响是什么？（5）在理性预期的条件下，讨论当货币量增加时有没有可能出现（1）和（2）的结果。如果有，各在什么情况下出现？（6）在理性预期条件下，政府想增加产量到潜在产量以上的做法会不会奏效？怎样才能奏效？从长远看结果怎样？',answer:`考察知识点：AD-AS、理性预期、信息不完全、政策有效性。\n思路：分别讨论预期外生、完全预见、理性预期、信息不完全下的均衡。\n答案：略。`},
{id:'h24',special:'宏观·汇率相关计算',qid:'A1 ★★',question:'加拿大的名义利率是每年12%，而美国是每年8%。假定国际资本流动使得这两个国家实际利率相等，购买力平价成立。（1）利用费雪方程，关于加拿大和美国的预期通货膨胀，你能作出什么推断？（2）关于加拿大元和美元之间汇率的预期变动，你能作出什么推断？（3）从一家美国银行以8%的利率借钱，存入利率为12%的一家加拿大银行，就可以赚到4%的利润。该说法对吗？',answer:`考察知识点：费雪方程、购买力平价、利率平价。\n思路：费雪方程 i=r+πe；购买力平价下预期汇率变动等于预期通胀差；套利分析。\n答案：（1）加拿大预期通胀比美国高4个百分点。（2）预期加元贬值4%。（3）说法不正确，套利后无利润。`},
{id:'h25',special:'宏观·短期开放经济',qid:'A1 ★★★',question:'在蒙代尔-弗莱明模型中，考虑一个由以下方程所描述的小型开放经济：LM曲线方程 Y=2M/P+100i；IS曲线方程 Y=1000+2G−T+NX−50i；净出口方程 NX=2500−100e。其中 Y 为收入水平，i 为利率，e 为汇率（外币/本币）；设货币供应量 M=1000，价格水平 P=1，世界利率 i*=10，政府支出 G=500，税收收入 T=800。求（1）短期内该经济体的均衡国民收入和均衡汇率；（2）假设让 T 减少到500，该国采取浮动汇率制度，则新的均衡国民收入和新的均衡汇率将会是多少？（3）如果该国采取的是固定汇率，且该国欲将固定汇率值维持在本题（1）问中的均衡汇率水平，那么保持 G 不变，而 T 减少到500，新的均衡国民收入将会是多少？其中央行将怎样设定货币供给的大小以维持这个固定汇率水平？',answer:`考察知识点：蒙代尔-弗莱明模型、浮动/固定汇率、财政政策。\n思路：资本完全流动下 i=i*；分别求IS-LM；固定汇率下货币供给内生。\n答案：（1）Y=3000，e=2。（2）Y=3000，e=5。（3）Y=3300；央行应设定 M=1150。`},
{id:'h26',special:'宏观·短期开放经济',qid:'A2 ★★★',question:'在一个小国模型中不考虑价格变化（简化为1），假设货币需求是 L=0.2Y−10r，Y 和 r 分别是收入和利率，货币供给 M=200，消费 C=60+0.8Yd，Yd 为可支配收入，税收 T=100，投资 I=150−2r，政府支出 G=100。（1）封闭经济下均衡的国民收入、利率和投资；（2）如果该国资本完全流动，世界利率为1.5，则均衡的国民收入为多少；（3）在开放条件（资本完全流动）下，当政府支出由100增加到120，均衡的国民收入怎样变动？挤出效应是多少。',answer:`考察知识点：封闭与开放经济、蒙代尔-弗莱明、挤出效应。\n思路：封闭经济求IS-LM；开放经济利率等于世界利率；浮动/固定汇率下政策效果不同。\n答案：（1）r=2.5，Y=1125，I=145。（2）Y=1075。（3）浮动汇率下财政政策完全无效，挤出效应100；固定汇率下无挤出效应，收入增加100。`},
{id:'h27',special:'宏观·短期开放经济',qid:'A3 ★★★',question:'假设大型开放经济在短期内可以用下列等式描述：C=0.5(Y−T)，T=1000，I=2500−250r，G=1500，NX=1000−250e，M/P=0.5Y−500r，M=1000，P=1，CF=500−250r，NX=CF。（1）求短期均衡的产出、利率、汇率、贸易余额和资本净流出。（2）假设经济体实行浮动汇率制，为实现贸易平衡，求政府税收变动量，以及新均衡的产出、利率和汇率水平。（3）假设经济体实行固定汇率制，当政府购买增加500，为保证经济的汇率处于（1）中水平，求此时货币供给变动量。',answer:`考察知识点：大型开放经济、浮动/固定汇率、财政政策。\n思路：产品市场均衡 Y=C+I+G+CF；货币市场均衡；外汇市场均衡 NX=CF。\n答案：（1）Y=5000，r=3，e=5，NX=−250，CF=−250。（2）ΔT=2000；Y=4000，r=2，e=4。（3）ΔM=500。`},
{id:'h28',special:'宏观·长期开放经济',qid:'A1 ★★★',question:'考虑一个由下列方程所描述的资本完全流动的小型开放经济：Y=C+I+G+NX，Y=5000，G=1000，T=1000，C=250+0.75(Y−T)，I=1000−50r，NX=500−500e，r=r*=5。（1）求该经济的国民储蓄、投资、贸易差额及均衡汇率；（2）现在假定 G 增加到1250，求国民储蓄、投资、贸易差额及均衡汇率，并解释你的结果；（3）现在假定世界利率由5上升至10，求国民储蓄、投资、贸易差额及均衡汇率，并解释你的结果。',answer:`考察知识点：小型开放经济长期模型、储蓄、投资、贸易差额、汇率。\n思路：国民储蓄 S=Y−C−G；投资 I=I(r*)；贸易差额 NX=S−I；汇率由 NX(e)=S−I 决定。\n答案：（1）S=750，I=750，NX=0，e=1。（2）S=500，I=750，NX=−250，e=1.5。（3）S=750，I=500，NX=250，e=0.5。`},
{id:'h29',special:'宏观·长期开放经济',qid:'A2 ★★',question:'假设下列方程描述了一个大型开放经济：Y=5000，C=0.5(Y−T)，I=2000−100r，NX=500−500e，CF=−100r，CF=NX，G=1500，T=1000。（1）求解均衡的产出与汇率，以及此时的消费量、净出口量与资本净流出量。（2）政府增税1000，求解新均衡的实际汇率与净出口量，并对这一均衡结果的变化给出经济学解释。（3）政府实施贸易限制政策，新的净出口曲线为 NX=1000−500e，求解新均衡的实际汇率与净出口量，并对这一均衡结果的变化给出经济学解释。',answer:`考察知识点：大型开放经济、可贷资金市场、外汇市场、贸易政策。\n思路：可贷资金市场均衡 S=I+CF；外汇市场均衡 CF=NX(e)。\n答案：（1）r=2.5，C=2000，CF=−250，e=1.5，NX=−250。（2）r=0，CF=0，e=1，NX=0。（3）r=2.5，CF=−250，e=2.5，NX=−250。`},
{id:'h30',special:'宏观·数量论与通胀',qid:'A1 ★★',question:'假定一国的货币需求函数为 (M/P)d=kY，式中，k 为一个常数。货币供给每年增加12%，实际收入每年增长4%。（1）平均通货膨胀率是多少？（2）如果实际收入增长更快，通货膨胀将会有什么不同？请作出解释。（3）假定货币需求函数不再是不变的，相反，该经济的货币流通速度由于金融创新而稳定地上升。这将会如何影响通货膨胀率？请作出解释。',answer:`考察知识点：货币数量论、通货膨胀率、货币流通速度。\n思路：由 M/P=kY 得通胀率=货币增长率−实际收入增长率；货币流通速度上升增加通胀。\n答案：（1）8%。（2）实际收入增长更快会降低通胀率。（3）货币流通速度上升会提高通胀率。`},
{id:'h31',special:'宏观·数量论与通胀',qid:'A2 ★★',question:'假定货币需求函数的形式为 (M/P)d=L(i,Y)=Y/(5i)。（1）如果产出增长速度为 g，实际货币余额需求将会以什么速度增长（假定名义利率恒定）？（2）这一经济的货币流通速度是多少？（3）如果通货膨胀和名义利率恒定，那么，货币流通速度将会以什么速度增长（如果有的话）？（4）利率水平的一个永恒的（一次性）增加将如何影响货币流通速度？它将如何影响随后的货币流通速度增长率？',answer:`考察知识点：货币需求、货币流通速度、利率。\n思路：求实际货币余额增长率；由 V=PY/M 求流通速度；分析利率影响。\n答案：（1）以速度 g 增长。（2）V=5i。（3）增长速度为0。（4）利率一次性增加使货币流通速度一次性增加，但增长率仍为0。`},
{id:'h32',special:'宏观·菲利普斯曲线',qid:'A1 ★★★',question:'假设一国的菲利普斯曲线为 π=πe−3(u−un)，自然失业率为5%。对通货膨胀的预期为适应性预期，中央银行对下一年的通货膨胀目标为2%。（1）如果当前的通货膨胀率为5%，那么中央银行为实现下一年的通货膨胀目标，能够引起的失业率是多少？（2）如果中央银行在次年继续保持2%的通货膨胀目标，那么失业率将是多少？（3）根据奥肯定律，计算降低通货膨胀的产出牺牲率。（4）如果对通货膨胀的预期为理性预期，那么产出牺牲率为多少？',answer:`考察知识点：菲利普斯曲线、适应性预期、理性预期、牺牲率。\n思路：适应性预期下 πe=π−1；奥肯定律；理性预期下牺牲率为0。\n答案：（1）u=6%。（2）u=5%。（3）牺牲率≈0.67%。（4）牺牲率为0。`},
{id:'h33',special:'宏观·菲利普斯曲线',qid:'A2 ★★★',question:'假设一个经济有以下菲利普斯曲线：π=π−1−0.5(u−0.06)。（1）自然失业率是多少？（2）画出通货膨胀与失业之间的短期与长期关系。（3）为了使通货膨胀减少5个百分点，必须有多少周期性失业？用奥肯定律计算牺牲率。（4）通货膨胀为10%，美联储想把它降到5%。给出两种能达到这个目标的方案。',answer:`考察知识点：菲利普斯曲线、自然失业率、牺牲率、奥肯定律。\n思路：自然失业率使 π=π−1；牺牲率由失业率变动和奥肯定律求；两种方案对应不同失业路径。\n答案：（1）6%。（2）短期向右下方倾斜，长期垂直。（3）周期性失业10个百分点；牺牲率4%。（4）方案一：一年高失业率；方案二：多年较低失业率。`},
{id:'h34',special:'宏观·菲利普斯曲线',qid:'A3 ★★★',question:'假设一个经济体有如下的菲利普斯曲线：通货膨胀率=去年的通货膨胀率−0.5(失业率−0.05)。（1）这条菲利普斯曲线对于通胀的假设，是理性预期还是适应性预期？（2）这一经济体的自然失业率是多少？（3）假设初始时，失业率等于自然失业率。为了使通货膨胀率比去年降低0.02，需要周期失业率达到多少？（4）假设初始时，失业率等于自然失业率，通货膨胀等于0。如果使失业率降为0.03，之后一直保持不变，计算第一年、第二年和第十年的通货膨胀率？',answer:`考察知识点：菲利普斯曲线、适应性预期、自然失业率。\n思路：适应性预期下预期通胀等于去年通胀；代入不同失业率计算。\n答案：（1）适应性预期。（2）5%。（3）周期性失业率4%。（4）第一年0；第二年0.01；第十年0.09。`},
{id:'h35',special:'宏观·菲利普斯曲线',qid:'A4 ★★',question:'假定经济的菲利普斯曲线是：π=π−1−0.5(u−u*)，而且自然失业率是过去两年失业的平均数：u*=0.5(u−1+u−2)。（1）为什么自然失业率会取决于最近的失业？（2）假设美联储遵循永久性地降低通货膨胀1%的政策。这种政策对一段时期中的失业率有什么影响？（3）这个经济中的牺牲率是多少？请解释。（4）这些方程式对通货膨胀与失业之间的短期和长期取舍关系意味着什么？',answer:`考察知识点：菲利普斯曲线、滞后效应、牺牲率。\n思路：滞后理论；失业率动态调整；牺牲率计算；短期与长期取舍关系。\n答案：（1）滞后理论，近期失业影响自然失业率。（2）第一年失业率高于自然失业率2个百分点，之后逐步调整。（3）牺牲率4%。（4）短期存在取舍，长期因滞后也存在取舍。`},
{id:'h36',special:'宏观·宏观经济政策',qid:'A1 ★★',question:'假设政府的目标函数是 W(u,π)=−L(u,π)=−(u²+yπ²)，同时面对的非利普斯曲线为 π=πe−β(u−u*)，其中 πe 是居民的通货膨胀预期，u* 是自然失业率。首先由政府宣布自己的政策目标 π0，然后理性预期的居民在看到政府的宣布后形成自己的预期，政府观察到居民的预期后决定实际的货币政策 π。（1）请计算并比较在固定规则与相机制定规则下社会福利的大小，并给出相应的解释。（2）关于通货膨胀率，在相机制定规则下，政府能否做出零通货膨胀的承诺？为什么？如果不能，那么在相机制定规则政府能够做出的可信承诺是什么？',answer:`考察知识点：政策规则、相机抉择、理性预期、动态不一致。\n思路：固定规则下 π=πe；相机抉择下求最优通胀；比较社会福利。\n答案：（1）固定规则下通胀为0，失业率为自然失业率；相机抉择下通胀为正，失业率仍为自然失业率，社会福利更小。（2）不能；可信承诺为 πe=u*/(βy)。`},
{id:'h37',special:'宏观·宏观经济政策',qid:'A2 ★★',question:'假设政府要把如下目标函数最小化：W(u,π)=u²+βπ²，其中 u 是实际失业率，π 是实际通货膨胀率。假设这个经济体的失业率和通货膨胀率之间存在如下关系：u=un−α(π−πe)，其中 un 是自然失业率，πe 是居民的预期通货膨胀率。α、β 均大于零。政府和居民的行动时间顺序如下：政府首先宣布一个通货膨胀率作为规则，记为 π0；然后居民形成预期 πe；政府看到 πe 之后再决定实际通货膨胀率 π。（1）政府决定按规则行事，居民也相信政府的承诺。那么请问政府会选怎么样的 π0，居民会选什么样的 πe，实际失业率是多少？（2）现在居民仍然相信政府的承诺，但是政府决定悄悄改变货币政策，实行相机抉择。那么政府会选怎么样的 π0 和 π？比较（1）和（2），说明政府为什么要相机抉择？（3）居民在实践中慢慢学会准确预期政府的实际通货膨胀率了。如果政府仍然贯彻上述相机抉择的货币政策，那么实际通货膨胀又会是多少？实际失业率是多少？比较（3）和（1），请问你会建议政府采用何种政策？',answer:`考察知识点：政策规则、相机抉择、理性预期、动态不一致。\n思路：分别求固定规则、居民相信下相机抉择、理性预期下相机抉择的均衡。\n答案：（1）π0=πe=0，u=un。（2）π0=−un/α，π=0；相机抉择下政府损失更小。（3）π=αun/β，u=un；建议采用固定规则政策。`},
{id:'h38',special:'宏观·微观基础',qid:'A1 ★★',question:'生命周期假说。假设小张0岁开始工作，20岁退休，40岁离世。工作时年收入为常数10000元，初始财富 W0=0，利率也假设为常数0。（1）计算0岁时小张的财富边际消费倾向和收入边际消费倾向；（2）计算10岁时小张的财富边际消费倾向和收入边际消费倾向，其消费 C10 和财富 W10 各是多少？（3）20岁时，小张的平均消费倾向是否与10岁的平均消费倾向不同？它能解释库兹涅茨的消费之谜吗？',answer:`考察知识点：生命周期假说、消费函数、平均消费倾向。\n思路：生命周期消费 C=(W+RY)/T；财富边际消费倾向 1/T，收入边际消费倾向 R/T。\n答案：（1）财富边际消费倾向1/40；收入边际消费倾向0.5。（2）财富边际消费倾向1/30；收入边际消费倾向1/3；C10=5000，W10=50000。（3）20岁平均消费倾向1/2，与10岁相同；能解释消费之谜。`},
{id:'h39',special:'宏观·稳态及黄金律',qid:'A1 ★★★',question:'一国宏观生产函数为 Y=(AN)^0.5 K^0.5，且 A=1，Y、A、N、K 分别为产出、技术、劳动数量、资本存量；储蓄率、人口增长率、折旧率分别为60%、4%、6%。（1）请计算经济实现稳态增长时的人均产出、人均资本和人均消费分别是多少？（2）请计算人均资本的黄金律水平是多少？其对应的人均产出、人均消费和储蓄率分别是多少？（3）当宏观生产函数变为 Y=N^0.6(AK)^0.4，且 A 按3%增长时，请计算人均产出和总产出的增长率分别是多少？（4）若原宏观生产函数中的 A=9K/N，则人均产出增长率是多少？',answer:`考察知识点：索洛模型、稳态、黄金律、技术进步。\n思路：稳态条件 sy=(δ+n)k；黄金律 f′(k)=δ+n；增长率分解。\n答案：（1）k*=36，y*=6，c*=2.4。（2）kgold=25，ygold=5，cgold=2.5，sgold=50%。（3）总产出增长率6%，人均产出增长率2%。（4）人均产出增长率170%。`},
{id:'h40',special:'宏观·稳态及黄金律',qid:'A2 ★★★',question:'经济的产出函数为 Y=K^(1/3)(AL)^(2/3)，经济的技术进步率 g=0.03，储蓄率 s=0.2，折旧率为 δ=0.05，人口增长率 n=0.02。（1）求黄金律稳态的储蓄率，储蓄率 s=0.2 能否实现消费最大化？（2）画出 s 从0.2的稳态水平到0.25的稳态水平，有效人均消费 lnc 的变化图。（3）画出 s 从0.4的稳态水平到0.45的稳态水平，有效人均消费 lnc 的变化图。（4）根据（2）（3）问的结果，从有效人均消费的角度分析政府是否应该调整储蓄率；（5）计算总产出、人均产出、有效人均产出的稳态增长率。',answer:`考察知识点：索洛模型、黄金律、储蓄率调整、稳态增长率。\n思路：黄金律条件 f′(k)=δ+n+g；分析储蓄率变化对消费的动态影响；稳态增长率分解。\n答案：（1）sgold=1/3>0.2，不能实现消费最大化。（2）消费先降后升，最终高于原稳态。（3）消费先降后升，最终低于原稳态。（4）s<sgold 时应提高储蓄率；s>sgold 时应降低储蓄率。（5）有效人均产出增长率0；人均产出增长率 g；总产出增长率 n+g。`},
{id:'h41',special:'宏观·稳态及黄金律',qid:'B1 ★★',question:'假设在Solow模型中，人均生产函数 y=k^0.5，储蓄率为 s，人口增长率 n=0.005，折旧率为 d=0.035。（1）计算在储蓄率 s=0.16 时的稳态人均资本存量。（2）计算在储蓄率提高到 s′=0.41 后的稳态人均资本存量。（3）计算稳态黄金律下的储蓄率。（4）以储蓄率 s=0.16 时的稳态为初期。这时人口为1000单位，如果储蓄率提高到 s′=0.41 后，计算下一期的总产出和人均资本。',answer:`考察知识点：索洛模型、稳态、黄金律、动态调整。\n思路：稳态 k*=(s/(n+d))²；黄金律 f′(k)=n+d；动态调整分析。\n答案：（1）k*=16。（2）k*≈105.1。（3）sgold=0.5。（4）下一期人均资本17；总产出 1005√17。`},
{id:'h42',special:'宏观·稳态及黄金律',qid:'B2 ★★',question:'利用索洛模型。生产函数为 Y=F[K(t),A(t)L(t)]，资本动态 K̇=sY−δK。令 k=K/(AL)，y=Y/(AL)。Ȧ/A=g 指技术进步率，L̇/L=n 指人口增长率。（1）为何可以写成 Y/(AL)=f(k)，k=K/(AL)？（2）求 k 的动态方程。（3）说明稻田条件的作用。',answer:`考察知识点：索洛模型、规模报酬不变、稻田条件。\n思路：利用规模报酬不变化简；求 k 的动态方程；稻田条件保证稳态存在且稳定。\n答案：（1）规模报酬不变，令 c=1/(AL) 可得。（2）k̇=sf(k)−(δ+n+g)k。（3）稻田条件保证稳态存在且唯一、稳定。`},
{id:'h43',special:'宏观·索洛模型证明',qid:'A1 ★★★',question:'经济体的生产函数为：Y=F(K,AL)，满足规模报酬不变假定，证明以下问题：（1）规模报酬不变时存在：∂F/∂K=f′(k̃)，∂F/∂L=A[f(k̃)−k̃f′(k̃)]，其中 k̃=K/(AL)。（2）稳态时资本的实际租赁价格是不变的，实际工资以技术进步率 g 增长；（3）稳态时人均资本和人均产出的增长率为 g，总资本与总产出的增长率为 (n+g)；（4）稳态时资本总收入和劳动总收入的增长率都等于人口增长率加技术进步率 (n+g)。进一步假定经济体的生产函数为：Y=K^a(AL)^(1−a)，证明或求解：（5）资本和劳动收入占总收入的份额分别为 α 和 1−α；（6）解稳态时人有效人均资本水平；（7）稳态时资本-产出比率是不变的；（8）资本黄金律水平的储蓄率为 α。',answer:`考察知识点：索洛模型、规模报酬不变、要素收入份额、黄金律。\n思路：分别求偏导；利用稳态条件；求黄金律储蓄率。\n答案：证明略；结论成立。`},
{id:'h44',special:'宏观·索洛模型证明',qid:'A2 ★★★',question:'假设在某国，资本在GDP中的份额为30%左右；产出的平均增长为每年3%左右；折旧率为每年4%左右；资本-产出比率为2.5左右。假设生产函数是柯布-道格拉斯生产函数，而且该国已经处于稳定状态。（1）在初始稳定状态，储蓄率应该是多少？（2）在初始稳定状态，资本的边际产量是多少？（3）假设公共政策提高了储蓄率，从而使经济达到了资本的黄金律水平。在黄金律稳定状态，资本的边际产量将是多少？比较黄金律稳定状态的边际产量和初始稳定状态的边际产量，并解释。（4）在黄金律稳定状态，资本-产出比率将是多少？（5）要达到黄金律稳定状态，储蓄率必须是多少？',answer:`考察知识点：索洛模型、黄金律、储蓄率。\n思路：利用稳态条件 s=(δ+n+g)(K/Y)；黄金律 f′(k)=δ+n+g；C-D函数性质。\n答案：（1）s=0.175。（2）MPK=0.12。（3）黄金律 MPK=0.07；黄金律边际产量小于初始稳态。（4）K/Y=30/7。（5）sgold=0.3。`},
{id:'h45',special:'宏观·索洛模型证明',qid:'A3 ★★★',question:'考虑带有技术进步的索洛模型。假设一国的生产函数为柯布-道格拉斯生产函数，且资本产出弹性0.36。假设当前经济已经处于稳态，此时产出(Y)的稳态增速为每年5%，折旧率为4%，资本产出比率 K/Y 等于3。（1）求初始稳态时的储蓄率；（2）求初始稳态时资本的边际产量；（3）初始稳态是否符合“黄金律”？若不符合是更低还是更高？应增加还是降低储蓄率？（4）求经济达到“黄金律”时的储蓄率。',answer:`考察知识点：索洛模型、技术进步、黄金律。\n思路：稳态增长率 n+g=5%；储蓄率 s=(δ+n+g)(K/Y)；黄金律储蓄率等于资本份额。\n答案：（1）s=27%。（2）MPK=0.12。（3）不符合；初始稳态资本低于黄金律，应增加储蓄率。（4）sgold=36%。`},
{id:'h46',special:'宏观·索洛模型证明',qid:'B1 ★★',question:'假设劳动与资本均按其边际产品支付。令 w 表示 ∂F(K,AL)/∂L 且 r 表示 ∂F(K,AL)/∂K−δ。（1）证明劳动的边际产品 w 是 A[f(k)−kf′(k)]。（2）证明如果资本与劳动均按其边际产品支付，那么不变的规模报酬意味着生产要素的总支付量等于总的净产出，即证明 wL+rK=F(K,AL)−δK。（3）随着产出份额被支付给资本与劳动，资本报酬 r 大致也不随时间而变化。处在平衡增长路径上的索洛经济展现这些特征吗？处在均衡增长路径上的 w 与 r 的增长率是多少？（4）假设经济由一个数量为 k<k* 的水平开始。随着 k 移向 k*，w 是否以大于、小于或等于其处在平衡增长路径时的增长率的速度增长？r 会怎样呢？',answer:`考察知识点：索洛模型、边际产品、平衡增长路径。\n思路：利用规模报酬不变和欧拉定理；分析平衡增长路径上工资和资本报酬增长率。\n答案：证明略；结论成立。`},
{id:'h47',special:'宏观·索洛模型证明',qid:'B2 ★★',question:'假设像上题中的一样，资本与劳动按其边际产品获得收益。另外，假定所有资本都被储蓄，所有劳动收入被消费。这样，k̇=[∂F(K,AL)/∂K]K−δK。（1）证明：这一经济收敛于一平衡增长路径。（2）处于该平衡增长路径上的 k 是大于、小于还是等于 k 的黄金率水平？如何直观地理解这一结果？',answer:`考察知识点：索洛模型、平衡增长路径、黄金律。\n思路：证明收敛性；分析平衡增长路径上的资本水平与黄金律关系。\n答案：证明略；k 等于黄金律水平。`},
{id:'h48',special:'宏观·经济增长核算',qid:'A1 ★★',question:'假设总产出 Yt=At Kt^α Lt^(1−α)，其中 t 为时间，At 为全要素生产率，Kt 为资本，Lt 为劳动。（1）请将总产出的增长分解为全要素生产率、资本和劳动三部分的增长之和。（2）请将人均产出的增长分解为全要素生产率和人均资本两部分的增长之和。',answer:`考察知识点：增长核算、全要素生产率。\n思路：对生产函数取对数求导；分解总产出和人均产出增长。\n答案：（1）gY=gA+αgK+(1−α)gL。（2）gy=gA+αgk。`},
{id:'h49',special:'宏观·经济增长核算',qid:'A2 ★★★',question:'索洛增长模型描述的一个经济有以下生产函数：Y(t)=A(t)K(t)^a L(t)^β。（1）对于上述生产函数，我们一般要求 0<a<1，0<β<1。为什么？除此之外，我们还会对它们做什么样的假设限制？（2）如果假设时间 t 是连续的，证明经济增长因素分解等式 gY=gA+agK+βgL 成立。（3）资本的演化方程式是：K̇=sY−δK，gA=g，gL=n。求稳态时人均资本 k 的增长率。',answer:`考察知识点：增长核算、规模报酬、稳态增长率。\n思路：分析参数限制；取对数求导；求稳态人均资本增长率。\n答案：（1）保证边际报酬递减；通常还假设 α+β=1。（2）证明略。（3）稳态时人均资本增长率 g/(1−α)。`},
{id:'h50',special:'宏观·两部门模型',qid:'A1 ★★★',question:'假设两部门模型的生产函数为：Y=K^a[(1−u)LE]^(1−a)，研究性大学的生产函数为 ΔE=g(u)E，资本的积累为 ΔK=sY−δK。（1）写出有效工人的平均资本生产函数。（2）在这个经济中，收支相抵的投资是多少？求出稳态时有效工人的平均资本。（3）发生自然灾害导致经济中资本存量减半，求稳态变化。（4）影响短期增长率的措施和影响长期增长率的措施有哪些？（5）求出有效工人的平均资本 k 的黄金律稳态水平和有效工人的平均产出 y 的黄金律稳态水平。（6）求出黄金律稳态时对应的储蓄率为多少？是否与 u 有关？',answer:`考察知识点：两部门模型、有效工人、稳态、黄金律。\n思路：定义有效人均资本；求稳态条件；分析灾害影响；求黄金律。\n答案：（1）y=(1−u)^(1−α)k^α。（2）收支相抵投资 [δ+n+g(u)]k；k*=(1−u)[s/(δ+n+g(u))]^(1/(1−α))。（3）短期内资本减半，随后恢复至稳态。（4）短期措施：提高储蓄率等；长期措施：提高技术进步率等。（5）k*gold=(1−u)[α/(δ+n+g(u))]^(1/(1−α))；y*gold=(1−u)[α/(δ+n+g(u))]^(α/(1−α))。（6）sgold=α，与 u 无关。`},
{id:'h51',special:'宏观·两部门模型',qid:'B1 ★★★',question:'一个封闭经济体包含制造业和教育两部门，其生产函数分别为：Y=AK^α(uEL)^(1−α)，ΔE=B(1−u)E。其中，Y、E 分别表示制造业的产出和教育部门的知识存量，A、B 为正的常数，u 表示制造业工人占劳动人数 L 的比率。储蓄率、折旧率、总劳动人数增长率为外生给定，分别用 s、δ、n 表示。（1）用 y 表示平均有效工人产出，k 表示平均有效工人资本存量，写 y 与 k 的关系式，并写出 Δk 的表达式。（2）总产出 Y 的稳态增长率是多少？s 和 u 分别对其有什么影响？（3）结合图形说明当 u 提高时，稳态时有效工人的人均资本存量将发生什么变化？（4）什么是储蓄的黄金率水平？写出黄金率水平时的资本存量 kgold 以及储蓄率 sgold。（5）甲、乙两国分别在 s>sgold 和 s<sgold 的情况下达到稳态，请问政府可以采取什么措施来提高或降低储蓄率？请从帕累托改进的角度分析，在甲、乙两国采取调整储蓄率的措施，哪一国政策更好？（6）索洛残差是什么？如何通过题目中已有的数据来估计？',answer:`考察知识点：两部门模型、稳态、黄金律、索洛残差。\n思路：求有效人均资本动态；分析稳态增长率；求黄金律；分析储蓄率调整。\n答案：略。`},
{id:'h52',special:'宏观·变形的索洛模型',qid:'A1 ★★★',question:'已知：一国经济中的生产函数是：Y=K^(1/3)(AN)^(2/3)，人口年增长率为0.05，资本折旧率也是0.05。（1）如果储蓄率为10%，A=2，计算该国稳态条件下的人均资本、人均产出、人均投资和人均消费水平。（2）分析从增加人均消费角度看，该国是否应该调整储蓄率？（3）如果 A 以每年2%的比率增长，稳态的经济增长率是多少？（4）如果生产函数变为 Y=(AK)^(1/3)N^(2/3)，A 仍以每年2%的比率增长，其它各个参数不变，稳态经济增长率是多少？',answer:`考察知识点：索洛模型、技术进步、稳态、黄金律。\n思路：分别按无技术进步、劳动增强型技术进步、资本增强型技术进步求解。\n答案：（1）k=2，y=2，人均投资0.2，人均消费1.8。（2）应提高储蓄率。（3）总产出增长率7%；可通过提高技术进步率提高人均收入。（4）总产出增长率6%。`},
{id:'h53',special:'宏观·变形的索洛模型',qid:'A2 ★★★',question:'假定产出是根据含有失业率的生产函数 Y=K^a[(1−u*)L]^(1−α) 来表示的。K 为资本，L 为劳动力，u* 为自然失业率。国民储蓄率为 s，劳动力增长率为 n，资本折旧率为 δ。（1）请把人均产出 y=Y/L 表示为人均资本 k=K/L 和自然失业率的函数。（2）计算该经济的稳态的人均资本和人均产出。（3）失业通过哪两种途径影响稳态的产出水平？（4）求出黄金律稳态时的储蓄率水平，自然失业率对它有影响吗？',answer:`考察知识点：索洛模型、失业率、稳态、黄金律。\n思路：求人均产出函数；稳态条件；黄金律。\n答案：（1）y=(1−u*)^(1−α)k^α。（2）k*=(1−u*)[s/(δ+n)]^(1/(1−α))，y*=(1−u*)[s/(δ+n)]^(α/(1−α))。（3）失业降低给定资本下的人均产出；失业降低稳态人均资本。（4）sgold=α，与自然失业率无关。`},
{id:'h54',special:'宏观·变形的索洛模型',qid:'A3 ★★★',question:'假设某国的社会总生产函数为：Y=K^θ(aL×E)^(1−θ)，其中 0<a≤1，1/2<θ<1。只有 aL 人口是劳动力。储蓄率为 s，资本折旧率为 δ，人口的增长速度为 n，劳动生产率的增长率为 g。定义每个效率工人的资本为 k=K/(aL×E)。（1）计算稳态时的每个效率工人的资本表达式。（2）为了获得黄金规则下的每个效率工人的资本，对应的储蓄率应该为多少？',answer:`考察知识点：索洛模型、劳动参与率、黄金律。\n思路：定义有效人均资本；求稳态；黄金律储蓄率。\n答案：（1）k*=[s/(δ+n+g)]^(1/(1−θ))。（2）sgold=θ。`},
{id:'h55',special:'宏观·变形的索洛模型',qid:'A4 ★★★',question:'假定生产函数为柯布道格拉斯形式：Y=(uK)^a L^(1−a)，其中 u 是资本利用率，0<a<1。人口按照速率 n 增大，资本折旧率为 δ，储蓄率为 s。（1）求出稳态时的人均资本存量、资本-产出比率。（2）求出黄金律水平的储蓄率、资本-产出比率。（3）分析资本利用率改变对人均产出的即刻影响和随着时间的推移的动态影响。',answer:`考察知识点：索洛模型、资本利用率、稳态、黄金律。\n思路：求人均生产函数；稳态条件；黄金律；动态分析。\n答案：（1）k=[su^a/(δ+n)]^(1/(1−a))，K/Y=s/(δ+n)。（2）sgold=a，K/Y=a/(δ+n)。（3）资本利用率提高即刻增加人均产出，随后资本积累增加，最终达到新稳态。`},
{id:'h56',special:'宏观·变形的索洛模型',qid:'A5 ★★★',question:'考虑一个标准的索洛增长模型：Y=(1−t)K^a(AL)^(1−a)，0<a<1，储蓄率为 s，人口增长率为0，技术进步率为 g，t 是政府对产出征收的税收。（1）假设政府在收税之后，不用于生产产出和进行投资，计算稳态时人均有效产出和人均有效资本。（2）如果政府减税，稳态的人均有效产出如何变化？（3）求出黄金律稳态时的储蓄率水平，政府的税率对它有影响吗？（4）现在假设税收降低了人们研发的动力，技术进步率变为 g=b(1−t)^(1−a)，b>0。计算新的稳态人均有效产出。',answer:`考察知识点：索洛模型、税收、黄金律。\n思路：求稳态条件；分析减税影响；黄金律储蓄率；技术进步受税收影响。\n答案：（1）k=[s(1−t)/g]^(1/(1−a))，y=(1−t)^(1/(1−a))(s/g)^(a/(1−a))。（2）减税提高人均有效产出。（3）sgold=a，与税率无关。（4）y=(s/b)^(1/(1−a))(1−t)^((a²−a+1)/(1−a))；减税提高稳态产出。`},
{id:'h57',special:'宏观·变形的索洛模型',qid:'B1 ★★',question:'考虑封闭经济中的索洛增长模型：储蓄率 s 外生给定，0<s<1；人均生产函数 y=f(k)=Ak^a，0<a<1；资本折旧率 σ 为0；技术 A 的进步速率为 g=0，人口增长率为 n>0。（1）假如政府通过一项移民法令使得人口增长率从 n 下降到 nnew，0<nnew<n。政策改革之前该国已处于稳态。请回答：这一政策改革对于稳态的人均资本存量 k、人均产出 y、工资率 w、资本价格 r 的影响？谁是受益者？（2）假设政府通过的移民法令并未改变人口增长率，但限制了高技术人员的移民门槛，这使得技术水平从 A 下降到 Anew，0<Anew<A。请绘图并回答：该国的人均资本存量 k 和人均产出 y 是如何随着时间而变化的？（3）假设我们把模型引入政府。政府消耗资源但不参与生产或资本积累。人均负担政府消费为 gt，唯一收入来源是对产出征税，税率为 τt。请推导出人均资本存量的积累方程，并求解稳态时人均资本存量。作图回答一项永久性的政府支出增加对于人均产出、人均资本存量、人均消费的影响。（4）假设生产函数为 yt=kt^α gt^β，α>0，β>0，0<α+β<1。请推导出人均资本存量的积累方程，并求解稳态时人均资本存量。定义最优税率为最大化人均资本存量的税率，求解这一最优税率水平。',answer:`考察知识点：索洛模型、移民、政府支出、税收。\n思路：分析人口增长率变化、技术水平变化、政府支出和税收对稳态的影响。\n答案：略。`},
{id:'h58',special:'宏观·变形的索洛模型',qid:'B2 ★',question:'有一个经济增长模型：Y=A{a(bK)^θ+(1−a)[(1−b)L]^θ}^(1/θ)，其中 A 为常数。该经济的折旧率为 δ，劳动增长率为 n，储蓄率为 s，资本积累方程为：K̇=sY−δK。（1）令人均资本 k=K/L，人均产出 y=Y/L，求 y(k)；（2）s 满足什么条件时，人均资本可以持续增长？（3）在（2）的条件下，求人均资本增长率？（4）与传统索洛模型的生产函数有什么联系与区别？',answer:`考察知识点：CES生产函数、内生增长、索洛模型。\n思路：求人均产出函数；分析持续增长条件；求增长率；比较与传统索洛模型。\n答案：（1）y=A{a(bk)^θ+(1−a)[(1−b)L]^θ}^(1/θ)。（2）s>(δ+n)/(Aa^(1/θ)b)。（3）k̇/k=sAa^(1/θ)b−(δ+n)。（4）当 θ→0 时变为C-D函数；本题具有内生增长特征。`},
{id:'h59',special:'宏观·离散时间索洛',qid:'A1 ★★★',question:'考虑离散时间的索罗模型。假定某国宏观生产函数为 Yt=F(Kt,Lt)=AKt^0.5 Lt^0.5。如果资本的变动方程为 Kt+1=It+(1−d)Kt，其中 d 为资本折旧率，It 为固定资产投资。假设该国的人口均为劳动力且零增长。用 a 表示边际消费倾向，不考虑政府部门。（1）请推导人均生产函数。（2）请推导稳态人均收入、人均资本和人均消费的具体表达式。（3）假若该国技术水平为2，边际消费倾向为0.9，d 为5%。请计算该国处于稳态时人均收入水平、人均资本水平和人均消费水平。',answer:`考察知识点：离散时间索洛模型、稳态。\n思路：推导人均生产函数；求稳态条件；代入数值。\n答案：（1）yt=Akt^0.5。（2）k*=[(1−a)A/d]²，y*=(1−a)A²/d，c*=a(1−a)A²/d。（3）k*=16，y*=8，c*=7.2。`},
{id:'h60',special:'宏观·离散时间索洛',qid:'A2 ★★★',question:'设 Yt=F(Kt,AtLt)，其中 F(·) 具有不变的规模报酬，并且密集形式的生产函数满足稻田条件。也设 At+1=(1+g)At，Lt+1=(1+n)Lt，以及 Kt+1=Kt+sYt−δKt。（1）求出作为 kt 函数的 kt+1 的表达式。（2）画出作为 kt 函数的 kt+1。经济处在均衡增长路径上吗？如果 k 的初始水平不同于其在均衡增长路径上的值，经济会收敛于均衡增长路径吗？（3）求出作为 k 的均衡增长路径值函数的单位有效劳动的消费的表达式，当 k 最大化均衡增长路径上单位有效劳动的消费时，资本的边际产品 f′(k) 是什么？假设生产函数是柯布-道格拉斯式的：（4）作为 kt 函数的 kt+1 是什么？（5）k 在均衡增长路径上的值 k* 是什么？（6）在 kt=k* 附近线性化（4）中的表达式，并且求出 k 收敛于 k* 的速率。',answer:`考察知识点：离散时间索洛模型、收敛性、黄金律。\n思路：推导动态方程；分析收敛性；求黄金律；线性化。\n答案：略。`},
{id:'h61',special:'宏观·新经济增长模型',qid:'B1 ★',question:'有的知识积累不是有意努力的结果，而是传统经济活动的副产品，这种知识积累被称为干中学或干中学模型问题。假定生产函数为：Y(t)=K(t)^a[A(t)L(t)]^(1−a)，L 为常数且等于1，K̇(t)=sY(t)，且知识积累作为产品生产的一个副产品出现：Ȧ(t)=BY(t)。（1）用 Ȧ(t)、K(t) 和各参数表示 gA(t) 和 gK(t)，其中，gA(t) 和 gK(t) 分别为 A(t) 和 K(t) 的增长率。（2）在 (gA,gK) 空间中画出 ġA=0 和 ġK=0 曲线。（3）该经济是否收敛于平衡增长路径？如果是这样，平衡增长路径上 K、A 和 Y 的增长率是多少？（4）s 的增加如何影响长期增长？',answer:`考察知识点：干中学模型、内生增长、平衡增长路径。\n思路：求增长率；画相位图；分析收敛性；求长期增长率。\n答案：（1）gK=sK^(a−1)A^(1−a)，gA=BK^aA^(−a)。（2）图略。（3）收敛；平衡增长路径上 gK=gA=g*=s^aB^(1−a)。（4）s 增加提高长期增长率。`},
{id:'h62',special:'宏观·新经济增长模型',qid:'B2 ★',question:'考虑下面这个具有实物资本和人力资本的模型：Y(t)=[(1−aK)K(t)]^a[(1−aH)H(t)]^(1−a)，K̇(t)=sY(t)−δK K(t)，Ḣ(t)=B[aKK(t)]^γ[aHH(t)]^φ[A(t)L(t)]^(1−γ−φ)−δH H(t)，L̇(t)=nL(t)，Ȧ(t)=gA(t)。（1）定义 k=K/(AL)，h=H/(AL)，请推导 k̇ 和 ḣ 的方程。（2）求使得 k̇=0 的由 ḣ 和 k̇ 的组合构成的方程，在 (h,k) 空间中画出它。对 ḣ=0 进行同样的处理。（3）该经济是否具有一条均衡增长路径？如果是，它是否是唯一的？它是否稳定？均衡增长路径上人均实物资本、人均人力资本和人均产出增长率是多少？（4）假设经济最初处于均衡增长路径上，且 s 有一个持久性的增加。这一变动如何影响人均产出随时间变化的路径？',answer:`考察知识点：实物资本与人力资本、内生增长、平衡增长路径。\n思路：推导动态方程；画相位图；分析稳态和收敛性；储蓄率变化的影响。\n答案：略。`},
{id:'h63',special:'宏观·周期理论抽象函数',qid:'A1 ★★',question:'考虑下述IS-LM模型。假设产品市场和货币市场的均衡条件分析如下：Y=C(Y−T)+I(i−π)+G，M/P=m(i,Y)。其中消费函数满足：0<C′(·)<1；投资函数满足：I′(·)<0；货币需求函数满足：mi<0，mY>0。（1）假定政府税收采取固定税的形式，通货膨胀率给定，求政府购买乘数、税收乘数、平衡预算乘数，并判断此时平衡预算乘数是小于1、等于1还是大于1。（2）在通货膨胀率给定的情况下，政府购买和税收的等量增加如何影响总需求曲线的位置？（3）现假定税收采取比例税的形式：T=tY，其中 0<t<1 表示边际税率。试分析在通货膨胀率给定的情况下，边际税率对于财政政策（政府购买变动）和货币政策影响的效果。',answer:`考察知识点：IS-LM、乘数、比例税、政策效果。\n思路：全微分求乘数；比较固定税和比例税下政策效果。\n答案：（1）政府购买乘数 1/[1−C′+I′(mY/mi)]；税收乘数 −C′/[1−C′+I′(mY/mi)]；平衡预算乘数小于1。（2）总需求曲线向右移动，但移动距离小于政府购买增加量。（3）比例税下财政政策效果减弱，货币政策效果也减弱。`},
{id:'h64',special:'宏观·周期理论抽象函数',qid:'A2 ★★',question:'假设一个封闭经济体，请用IS-LM曲线分析下面两种不同假设：（A）消费同时被所得和利率所影响：C=C(Y,r)，CY>0，Cr<0；（B）消费只受所得的影响：C=C(Y)，CY>0。IS-LM曲线的公式如下：IS:Y=C+I(r)+G；LM:M/P=K(Y)+L(r)。（1）请分别计算IS曲线在这两种假设下的斜率，并说明IS曲线在哪种情况下更陡？（2）请分别计算在两种假设下，货币政策对均衡产出的边际影响，也就是 dY/d(M/P)。（3）请参考（1）的答案画出IS-LM曲线，并用图说明货币政策在哪种情况下更有效？',answer:`考察知识点：IS-LM、消费函数、货币政策效果。\n思路：求IS斜率；求货币政策乘数；比较政策效果。\n答案：（1）情况A斜率 (1−CY)/(Cr+I′)；情况B斜率 (1−CY)/I′；情况B更陡。（2）情况A货币政策乘数 (Cr+I′)/[K′(Cr+I′)+L′(1−CY)]；情况B货币政策乘数 I′/[K′I′+L′(1−CY)]。（3）情况A货币政策更有效。`},
{id:'h65',special:'宏观·周期理论抽象函数',qid:'B1 ★',question:'我们考察中央银行控制真实利率的能力。假设经济由两个方程描述：第一个是IS方程 Y=Y(r)，Y′(r)<0；第二个方程是货币市场的均衡条件 m−p=L(r+πe,Y)，Lr+πe<0，LY>0。（1）假设 P=P̄，πe=0。求出 dr/dm 的表达式，并说明货币供给的增加会降低真实利率吗？（2）假设价格对货币供给增加做出局部反应，dp/dm 外生，0<dp/dm<1。仍假设 πe=0。求出 dr/dm，并说明货币供给的增加会降低真实利率吗？（3）假设货币增加也影响预期的通货膨胀。dπe/dm 外生，dπe/dm>0。仍旧假设 0<dp/dm<1。求出 dr/dm。（4）假设存在完全的和连续的价格调整：dp/dm=1，dπe/dm=0。求出 dr/dm。',answer:`考察知识点：IS-LM、货币市场、真实利率、货币政策。\n思路：全微分求 dr/dm；分别讨论不同假设下的结果。\n答案：（1）dr/dm=1/[Lr+LYY′(r)]<0；降低真实利率。（2）dr/dm=(1−dp/dm)/[Lr+LYY′(r)]<0。（3）dr/dm=[(1−dp/dm)−Lr+πe·dπe/dm]/[Lr+πe+LYY′(r)]<0。（4）dr/dm=0；不影响真实利率。`},
{id:'h66',special:'宏观·动态AD-AS模型',qid:'A1 ★',question:'假定人们的通货膨胀预期受到随机冲击的影响。预期性机制为：时期 t−1 对时期 t 的通货膨胀的预期是 Et−1πt=πt−1+ηt−1，式中 ηt−1 是一个随机冲击。产品和服务的需求方程：Yt=Ȳt−α(rt−ρ)+εt；费雪方程：rt=it−Etπt+1；菲利普斯曲线：πt=Et−1πt+φ(Yt−Ȳt)+νt；货币政策规则：it=πt+ρ+θπ(πt−πt*)+θY(Yt−Ȳt)。（1）推导动态总需求方程和动态总供给方程。（2）假定经济经历了一场通货膨胀恐慌。在时期 t，由于某些原因人们相信时期 t+1 的通货膨胀会更高，因此 ηt 大于零。则时期 t、时期 t+1 以及以后的时期里的经济会发生什么变化？（3）在何种意义上通货膨胀恐慌自我实现了？',answer:`考察知识点：动态AD-AS模型、通货膨胀预期、货币政策。\n思路：推导DAD和DAS；分析通胀恐慌的短期和长期影响。\n答案：（1）DAS：πt=πt−1+ηt−1+φ(Yt−Ȳt)+νt；DAD：Yt=Ȳt−αθπ(πt−πt*)/(1+αθY)+αηt/(1+αθY)+εt/(1+αθY)。（2）短期产出和通胀上升，随后DAS左移，经济进入滞涨，最终回到初始均衡。（3）通胀恐慌自我实现，因为预期通胀上升导致实际通胀上升。`}
];

/* HTML 转义 */
function escapeHtml(text){
  if(!text) return '';
  return String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
/* 小问自动换行 */
function addSubBreaks(escaped){
  if(!escaped) return '';
  let s = escaped;
  s = s.replace(/（(\d+)）/g, '<br>（$1）');
  s = s.replace(/^<br>/, '');
  return s;
}
function renderAnswerParagraphs(text){
  if(!text) return '';
  const paragraphs = text.split('\n');
  const filtered = paragraphs.filter(p => p.trim() !== '');
  if(filtered.length === 0) return '';
  return filtered.map(p => {
    const esc = escapeHtml(p.trim());
    return `<p>${addSubBreaks(esc)}</p>`;
  }).join('');
}
function renderQuestionText(text){
  if(!text) return '';
  return addSubBreaks(escapeHtml(text));
}
function getCardData(id){
  const original = currentData.find(d => d.id === id);
  if(!original) return null;
  if(edits[id]) return {...original, question: edits[id].question || original.question, answer: edits[id].answer || original.answer};
  return {...original};
}

/* ============= 筛选下拉初始化 ============= */
function buildMajorOptions(){
  let html = '<option value="all">全部专项</option>';
  filterTree.forEach(g => {
    html += `<optgroup label="${g.group}">`;
    g.items.forEach(item => {
      html += `<option value="${item.major}">${item.major}</option>`;
    });
    html += '</optgroup>';
  });
  filterMajor.innerHTML = html;
}
function buildSubOptions(major){
  if(major === 'all'){
    filterSub.innerHTML = '<option value="all">全部细分</option>';
    filterSub.disabled = true;
    return;
  }
  const group = filterTree.find(g => g.items.some(item => item.major === major));
  if(!group){filterSub.innerHTML = '<option value="all">全部细分</option>';filterSub.disabled = true;return;}
  const item = group.items.find(i => i.major === major);
  if(!item || item.subs.length === 0){
    filterSub.innerHTML = '<option value="all">全部细分</option>';
    filterSub.disabled = true;
    return;
  }
  filterSub.disabled = false;
  let html = '<option value="all">全部细分</option>';
  item.subs.forEach(sub => { html += `<option value="${sub}">${sub}</option>`; });
  filterSub.innerHTML = html;
}

/* ============= 单卡模式 ============= */
function exitSingleMode(){
  if(singleModeId === null) return;
  singleModeId = null; history = []; historyIndex = -1;
  singleModeBar.classList.remove('show');
  filterBar.classList.remove('disabled');
  render();
  showToast('📋 已退出抽查模式');
}
function enterSingleMode(id){
  if(!id) return;
  if(singleModeId !== null){
    if(singleModeId === id) return;
    exitSingleMode();
    setTimeout(()=>{enterSingleMode(id);},100);
    return;
  }
  const card = getCardData(id);
  if(!card){showToast('😅 卡片不存在');return;}
  singleModeId = id;
  const existIdx = history.indexOf(id);
  if(existIdx !== -1){historyIndex = existIdx;}
  else{history.push(id);historyIndex = history.length - 1;}
  singleModeBar.classList.add('show');
  filterBar.classList.add('disabled');
  updateSingleBadge(id);
  updateNavButtons();
  render(id);
  showToast(`🎯 抽查: ${card.sub || card.major} · ${card.qid}`);
}
function updateSingleBadge(id){
  const card = getCardData(id);
  if(card) singleCardBadge.textContent = `${card.sub || card.major} · ${card.qid}`;
  else singleCardBadge.textContent = id;
}
function updateNavButtons(){
  prevCardBtn.classList.toggle('disabled', historyIndex <= 0);
  const ids = getFilteredIds();
  nextCardBtn.classList.toggle('disabled', ids.length <= 1);
}
function goPrevCard(){
  if(singleModeId === null) return;
  if(historyIndex <= 0){showToast('已经是第一张了');return;}
  historyIndex--;
  const id = history[historyIndex];
  if(id){singleModeId = id;updateSingleBadge(id);updateNavButtons();render(id);}
  else exitSingleMode();
}
function goNextCard(){
  if(singleModeId === null) return;
  const ids = getFilteredIds();
  if(ids.length <= 1){showToast('😅 没有更多卡片可抽查');return;}
  const available = ids.filter(id => id !== singleModeId);
  if(available.length === 0){showToast('😅 没有更多卡片可抽查');return;}
  const randomId = available[Math.floor(Math.random() * available.length)];
  history = history.slice(0, historyIndex + 1);
  history.push(randomId);
  historyIndex = history.length - 1;
  singleModeId = randomId;
  updateSingleBadge(randomId);
  updateNavButtons();
  render(randomId);
  const card = getCardData(randomId);
  if(card) showToast(`▶ 下一张: ${card.sub || card.major} · ${card.qid}`);
}
function doRandom(){
  const ids = getFilteredIds();
  if(ids.length === 0){showToast('😅 当前没有卡片可抽查，请调整筛选条件');return;}
  if(singleModeId !== null){exitSingleMode();setTimeout(()=>{doRandom();},150);return;}
  const randomId = ids[Math.floor(Math.random() * ids.length)];
  enterSingleMode(randomId);
}

/* ============= 编辑 ============= */
const editBackups = {};
function enterEditMode(id){
  const card = getCardData(id);
  if(!card) return;
  const questionEl = document.querySelector(`.card-question[data-id="${id}"] .q-text`);
  const answerInner = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner`);
  const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
  if(!questionEl || !answerInner || !editBtn) return;
  if(editBtn.classList.contains('is-editing')) return;
  const currentQ = questionEl.textContent.trim();
  const pNodes = answerInner.querySelectorAll('p');
  let currentA = '';
  if(pNodes.length > 0) currentA = Array.from(pNodes).map(p => p.textContent.trim()).join('\n');
  else currentA = answerInner.textContent.trim();
  editBackups[id] = {question: currentQ, answer: currentA};
  const editQ = document.createElement('div');
  editQ.contentEditable = true;
  editQ.className = 'q-text editable';
  editQ.textContent = currentQ;
  editQ.style.cssText = 'display:inline-block;min-width:60px;outline:none;border-bottom:2px solid #6a9e9e;padding:2px 4px;white-space:pre-wrap;';
  questionEl.replaceWith(editQ);
  const editA = document.createElement('div');
  editA.className = 'answer-inner editable';
  editA.contentEditable = true;
  const paragraphs = currentA.split('\n').filter(p => p.trim() !== '');
  if(paragraphs.length === 0) editA.innerHTML = '<p><br></p>';
  else editA.innerHTML = paragraphs.map(p => `<p>${escapeHtml(p.trim())}</p>`).join('');
  editA.style.cssText = 'background:transparent;border-left:none;padding:4px 6px;min-height:40px;outline:none;border:2px dashed #6a9e9e;border-radius:8px;';
  answerInner.replaceWith(editA);
  editBtn.classList.add('is-editing');
  editBtn.textContent = '💾';
  editBtn.title = '保存修改';
  let cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);
  if(!cancelBtn){
    cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel-edit';
    cancelBtn.dataset.id = id;
    cancelBtn.textContent = '❌';
    cancelBtn.title = '取消编辑';
    cancelBtn.style.cssText = 'font-size:18px;padding:4px 6px;background:transparent;border:none;cursor:pointer;border-radius:10px;color:#8a4a4a;';
    editBtn.parentNode.insertBefore(cancelBtn, editBtn.nextSibling);
    cancelBtn.addEventListener('click', function(e){e.stopPropagation();cancelEdit(id);});
  } else cancelBtn.style.display = 'inline-block';
  editBtn.onclick = function(e){e.stopPropagation();saveEdit(id);};
  showToast('✏️ 正在编辑，点击 💾 保存 或 ❌ 取消');
}
function saveEdit(id){
  const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
  if(!editBtn || !editBtn.classList.contains('is-editing')) return;
  const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
  const editA = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner.editable`);
  if(!editQ || !editA){showToast('⚠️ 编辑内容不存在');return;}
  const newQ = editQ.textContent.trim();
  const pNodes = editA.querySelectorAll('p');
  let newA = '';
  if(pNodes.length > 0) newA = Array.from(pNodes).map(p => p.textContent.trim()).join('\n');
  else newA = editA.textContent.trim();
  if(!newQ || !newA){showToast('⚠️ 题目和答案不能为空');return;}
  edits[id] = {question: newQ, answer: newA};
  saveEdits();
  exitEditMode(id, true);
  showToast('✅ 修改已保存');
}
function cancelEdit(id){
  const backup = editBackups[id];
  if(!backup){exitEditMode(id, false);return;}
  const editQ = document.querySelector(`.card-question[data-id="${id}"] .q-text.editable`);
  const editA = document.querySelector(`.card-answer[data-id="${id}"] .answer-inner.editable`);
  if(editQ){
    const newSpan = document.createElement('span');
    newSpan.className = 'q-text';
    newSpan.textContent = backup.question;
    editQ.replaceWith(newSpan);
  }
  if(editA){
    const newDiv = document.createElement('div');
    newDiv.className = 'answer-inner';
    newDiv.innerHTML = renderAnswerParagraphs(backup.answer);
    editA.replaceWith(newDiv);
  }
  delete editBackups[id];
  exitEditMode(id, false);
  showToast('↩️ 已取消编辑');
}
function exitEditMode(id, saved){
  const editBtn = document.querySelector(`.btn-edit[data-id="${id}"]`);
  const cancelBtn = document.querySelector(`.btn-cancel-edit[data-id="${id}"]`);
  if(editBtn){
    editBtn.classList.remove('is-editing');
    editBtn.textContent = '✏️';
    editBtn.title = '编辑题目和答案';
    editBtn.onclick = function(e){e.stopPropagation();enterEditMode(id);};
  }
  if(cancelBtn) cancelBtn.style.display = 'none';
  if(saved) render(singleModeId || null);
  delete editBackups[id];
}

/* ============= 筛选 ============= */
function getFilteredIds(){
  const majorVal = filterMajor.value;
  const subVal = filterSub.value;
  const favVal = filterFav.value;
  const searchVal = filterSearch.value.trim().toLowerCase();
  return currentData.filter(d => {
    if(majorVal !== 'all' && d.major !== majorVal) return false;
    if(subVal !== 'all' && d.sub !== subVal) return false;
    if(favVal === 'fav' && !favorites.includes(d.id)) return false;
    if(searchVal){
      const q = d.question.toLowerCase();
      const a = d.answer.toLowerCase();
      if(!q.includes(searchVal) && !a.includes(searchVal)) return false;
    }
    return true;
  }).map(d => d.id);
}

/* ============= 渲染 ============= */
function render(singleId = null){
  if(singleId !== null && singleModeId === null){
    const ids = getFilteredIds();
    if(ids.includes(singleId)){
      singleModeId = singleId;
      if(history.length === 0 || history[history.length - 1] !== singleId){
        history.push(singleId);
        historyIndex = history.length - 1;
      }
      singleModeBar.classList.add('show');
      filterBar.classList.add('disabled');
      updateSingleBadge(singleId);
      updateNavButtons();
    } else singleId = null;
  }
  if(singleId === null && singleModeId !== null){exitSingleMode();return;}

  const isSingleMode = singleModeId !== null;
  let filtered;
  if(isSingleMode){
    const card = getCardData(singleModeId);
    filtered = card ? [card] : [];
    if(filtered.length === 0){exitSingleMode();return;}
    updateSingleBadge(singleModeId);
  } else {
    const majorVal = filterMajor.value;
    const subVal = filterSub.value;
    const favVal = filterFav.value;
    const searchVal = filterSearch.value.trim().toLowerCase();
    filtered = currentData.map(d => getCardData(d.id)).filter(d => {
      if(!d) return false;
      if(majorVal !== 'all' && d.major !== majorVal) return false;
      if(subVal !== 'all' && d.sub !== subVal) return false;
      if(favVal === 'fav' && !favorites.includes(d.id)) return false;
      if(searchVal){
        const q = d.question.toLowerCase();
        const a = d.answer.toLowerCase();
        if(!q.includes(searchVal) && !a.includes(searchVal)) return false;
      }
      return true;
    });
  }
  totalSpan.textContent = currentData.length;
  favSpan.textContent = favorites.length;
  grid.classList.toggle('single-mode', isSingleMode);
  if(filtered.length === 0){
    grid.innerHTML = `<div class="no-result">🌿 没有找到匹配的卡片，试试调整筛选条件吧</div>`;
    return;
  }
  let html = '';
  filtered.forEach(d => {
    const isFav = favorites.includes(d.id);
    const note = notes[d.id] || '';
    const qText = renderQuestionText(d.question);
    const aHtml = renderAnswerParagraphs(d.answer);
    const subLabel = d.sub || d.major;
    html += `
      <div class="card-item ${isFav ? 'favorited' : ''}" data-id="${d.id}">
        <div class="card-header">
          <div class="label">
            <span class="tag">${escapeHtml(d.major)}</span>
            ${d.sub ? `<span class="tag sub-tag">${escapeHtml(d.sub)}</span>` : ''}
            <span class="qid">${d.qid}</span>
          </div>
          <div class="card-actions" data-id="${d.id}">
            <button class="btn-fav ${isFav ? 'active' : ''}" data-id="${d.id}" title="收藏">${isFav ? '⭐' : '☆'}</button>
            <button class="btn-note ${note ? 'active' : ''}" data-id="${d.id}" title="笔记">📝</button>
            <button class="btn-edit" data-id="${d.id}" title="编辑题目和答案">✏️</button>
          </div>
        </div>
        <div class="card-question" data-id="${d.id}">
          <span class="q-text">${qText}</span>
          <span class="toggle-hint">(点击展开答案)</span>
        </div>
        <div class="card-answer" data-id="${d.id}">
          <div class="answer-inner">${aHtml}</div>
        </div>
        <div class="card-note-area" data-id="${d.id}">
          <div class="note-editor" contenteditable="false" data-id="${d.id}">${note}</div>
          <div class="img-resize-control" data-id="${d.id}">
            <span>📐 大小</span>
            <input type="range" min="10" max="200" value="100" step="2" />
            <span class="size-val">100%</span>
            <button class="btn-reset-size" data-id="${d.id}">重置</button>
          </div>
          <div class="note-actions">
            <button class="btn-insert-img" data-id="${d.id}">🖼️ 插入图片</button>
            <button class="note-save" data-id="${d.id}">💾 保存笔记</button>
            <button class="note-clear" data-id="${d.id}">🗑️ 清空</button>
            <span class="note-size-hint">支持粘贴图片 · 点击图片调大小</span>
          </div>
        </div>
      </div>
    `;
  });
  grid.innerHTML = html;

  document.querySelectorAll('.card-question').forEach(el => {
    el.addEventListener('click', function(e){
      if(this.classList.contains('editable')) return;
      const id = this.dataset.id;
      const answerDiv = document.querySelector(`.card-answer[data-id="${id}"]`);
      const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
      const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
      if(!answerDiv) return;
      if(answerDiv.classList.contains('open')){
        answerDiv.classList.remove('open');
        if(noteArea){noteArea.classList.remove('open');if(noteBtn) noteBtn.classList.remove('active');}
      } else {
        answerDiv.classList.add('open');
        if(noteArea){
          if(notes[id] && notes[id].trim().length > 0){
            noteArea.classList.add('open');
            if(noteBtn) noteBtn.classList.add('active');
          }
        }
      }
    });
  });

  document.querySelectorAll('.btn-fav').forEach(btn => {
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const id = this.dataset.id;
      const idx = favorites.indexOf(id);
      if(idx > -1){favorites.splice(idx,1);this.classList.remove('active');this.textContent = '☆';}
      else{favorites.push(id);this.classList.add('active');this.textContent = '⭐';}

      if(card) card.classList.toggle('favorited', favorites.includes(id));

      document.body.appendChild(fileInput);

          showToast('🖼️ 图片已插入，点击图片可调大小');
          document.body.removeChild(fileInput);
          bindImgClick(editor);
        };
        reader.readAsDataURL(file);
      };
      fileInput.click();
    });

  document.querySelectorAll('.note-save').forEach(btn => {

      if(!editor) return;
      let content = editor.innerHTML.trim();
      if(content === '<br>' || content === '') content = '';
      if(content) notes[id] = content;
      else delete notes[id];
      saveNotes();
      const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
      if(noteBtn) noteBtn.classList.toggle('active', !!content);
      if(content){
        const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
        if(noteArea) noteArea.classList.add('open');
      }
      const orig = btn.textContent;
      btn.textContent = '✅ 已保存';
      setTimeout(()=>{btn.textContent = orig;},1200);
    });
  });

  document.querySelectorAll('.note-clear').forEach(btn => {
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      const id = this.dataset.id;
      if(!(await window.showConfirm({ title: '清空笔记', message: '确定要清空这条笔记吗？', okText: '清空', danger: true }))) return;
      const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
      if(editor){
        editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
        editor.setAttribute('contenteditable', 'false');
        delete notes[id];
        saveNotes();
        const noteBtn = document.querySelector(`.btn-note[data-id="${id}"]`);
        if(noteBtn) noteBtn.classList.remove('active');
        const noteArea = document.querySelector(`.card-note-area[data-id="${id}"]`);
        if(noteArea) noteArea.classList.remove('open');
        const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
        if(rc) rc.classList.remove('show');
        showToast('🗑️ 笔记已清空');
      }
    });
  });

  document.querySelectorAll('.note-editor').forEach(editor => {
    editor.addEventListener('paste', function(e){
      const items = e.clipboardData && e.clipboardData.items;
      if(!items) return;
      for(let item of items){
        if(item.type && item.type.startsWith('image/')){
          e.preventDefault();
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = function(ev){
            const img = document.createElement('img');
            img.src = ev.target.result;
            try { __shrinkNoteImg(img, ev.target.result); } catch (e) {}
            img.alt = '粘贴图片';
            img.style.maxWidth = '100%';
            img.style.maxHeight = '300px';
            img.style.borderRadius = '10px';
            img.style.margin = '6px 0';
            img.style.display = 'block';
            img.dataset.noteImg = 'true';
            const sel = window.getSelection();
            if(sel && sel.rangeCount > 0 && editor.contains(sel.anchorNode)){
              const range = sel.getRangeAt(0);
              range.insertNode(img);
              range.setStartAfter(img);
              range.collapse(true);
              sel.removeAllRanges();
              sel.addRange(range);
            } else editor.appendChild(img);
            showToast('🖼️ 图片已粘贴，点击可调整大小');
            bindImgClick(editor);
          };
          reader.readAsDataURL(file);
          break;
        }
      }
    });
  });

  document.querySelectorAll('.note-editor').forEach(editor => {
    const id = editor.dataset.id;
    const content = notes[id] || '';
    if(!content || content.trim() === '') editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
    editor.addEventListener('focus', function(){
      const placeholder = this.querySelector('.note-placeholder');
      if(placeholder) this.innerHTML = '';
    });
    editor.addEventListener('blur', function(){
      if(this.innerHTML.trim() === '' || this.innerHTML === '<br>') this.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
    });
    editor.addEventListener('click', function(){
      if(this.getAttribute('contenteditable') === 'false'){
        this.setAttribute('contenteditable', 'true');
        this.focus();
      }
    });
  });

  document.querySelectorAll('.note-editor').forEach(editor => bindImgClick(editor));

  document.querySelectorAll('.btn-reset-size').forEach(btn => {
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const id = this.dataset.id;
      const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
      if(!editor) return;
      editor.querySelectorAll('img').forEach(img => {
        img.style.width = ''; img.style.maxWidth = '100%'; img.dataset.origWidth = '100';
      });
      const slider = document.querySelector(`.img-resize-control[data-id="${id}"] input[type="range"]`);
      if(slider){
        slider.value = 100;
        const valSpan = slider.closest('.img-resize-control').querySelector('.size-val');
        if(valSpan) valSpan.textContent = '100%';
      }
      showToast('📐 图片大小已重置');
    });
  });

  document.querySelectorAll('.img-resize-control input[type="range"]').forEach(slider => {
    slider.addEventListener('input', function(){
      const id = this.closest('.img-resize-control').dataset.id;
      const val = parseInt(this.value);
      const valSpan = this.closest('.img-resize-control').querySelector('.size-val');
      if(valSpan) valSpan.textContent = val + '%';
      const editor = document.querySelector(`.note-editor[data-id="${id}"]`);
      if(!editor) return;
      editor.querySelectorAll('img').forEach(img => {
        if(img.classList.contains('selected')){
          img.style.width = val + '%';
          img.style.maxWidth = val + '%';
        }
      });
    });
  });

  document.querySelectorAll('.btn-edit').forEach(btn => {
    btn.onclick = function(e){
      e.stopPropagation();
      const id = this.dataset.id;
      if(this.classList.contains('is-editing')) return;
      enterEditMode(id);
    };
  });

  if(isSingleMode) window.scrollTo({top:0,behavior:'smooth'});
}

function bindImgClick(editor){
  editor.querySelectorAll('img').forEach(img => {
    img.removeEventListener('click', imgClickHandler);
    img.addEventListener('click', imgClickHandler);
  });
}
function imgClickHandler(e){
  e.stopPropagation();
  const img = this;
  const editor = img.closest('.note-editor');
  if(!editor) return;
  const id = editor.dataset.id;
  editor.querySelectorAll('img').forEach(i => i.classList.remove('selected'));
  img.classList.add('selected');
  const rc = document.querySelector(`.img-resize-control[data-id="${id}"]`);
  if(!rc) return;
  rc.classList.add('show');
  const slider = rc.querySelector('input[type="range"]');
  const valSpan = rc.querySelector('.size-val');
  if(!slider) return;
  let currentPct = 100;
  if(img.style.width){
    const w = parseInt(img.style.width);
    if(w > 0 && w <= 200) currentPct = w;
  }
  slider.value = currentPct;
  if(valSpan) valSpan.textContent = currentPct + '%';
  slider.oninput = function(){
    const val = parseInt(slider.value);
    if(valSpan) valSpan.textContent = val + '%';
    img.style.width = val + '%';
    img.style.maxWidth = val + '%';
  };
  const resetBtn = rc.querySelector('.btn-reset-size');
  if(resetBtn){
    resetBtn.onclick = function(e2){
      e2.stopPropagation();
      img.style.width = ''; img.style.maxWidth = '100%';
      slider.value = 100;
      if(valSpan) valSpan.textContent = '100%';
      showToast('📐 已重置');
    };
  }
}

/* ============= 事件绑定 ============= */
function onFilterChange(){
  if(singleModeId !== null) exitSingleMode();
  else render();
}
filterMajor.addEventListener('change', function(){
  buildSubOptions(this.value);
  onFilterChange();
});
filterSub.addEventListener('change', onFilterChange);
filterFav.addEventListener('change', onFilterChange);
filterSearch.addEventListener('input', onFilterChange);
clearBtn.addEventListener('click', function(){
  filterMajor.value = 'all';
  buildSubOptions('all');
  filterFav.value = 'all';
  filterSearch.value = '';
  if(singleModeId !== null) exitSingleMode();
  else render();
});
exitSingleBtn.addEventListener('click', exitSingleMode);
prevCardBtn.addEventListener('click', goPrevCard);
nextCardBtn.addEventListener('click', goNextCard);
randomBtn.addEventListener('click', doRandom);

document.addEventListener('keydown', function(e){
  if(e.key === 'r' || e.key === 'R'){
    if(!e.ctrlKey && !e.metaKey && !e.altKey){
      const t = e.target;
      if(t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA' && t.contentEditable !== 'true'){
        e.preventDefault();
        doRandom();
      }
    }
  }
  if(e.key === 'Escape'){
    if(singleModeId !== null){e.preventDefault();exitSingleMode();}
  }
  if(singleModeId !== null){
    if(e.key === 'ArrowLeft'){e.preventDefault();goPrevCard();}
    if(e.key === 'ArrowRight'){e.preventDefault();goNextCard();}
  }
});

/* ============= 初始化 ============= */
buildMajorOptions();
buildSubOptions('all');
render();
setTimeout(() => {
  document.querySelectorAll('.note-editor').forEach(editor => {
    const id = editor.dataset.id;
    const content = notes[id] || '';
    if(!content || content.trim() === '') editor.innerHTML = '<span class="note-placeholder">✏️ 点击写下笔记，支持粘贴/插入图片…</span>';
    bindImgClick(editor);
  });
}, 100);
</script>

<script>
/* ===== 存储安全：图片压缩 + 笔记自动保存 + 离开提醒 ===== */
(function () {
    var MAXW = 1200, QUALITY = 0.72, KEEP_UNDER = 220 * 1024;
    var dirty = false, timer = null;

    /* 压缩笔记里的图片：原图 base64 极易撑爆 localStorage（约 5MB 上限） */
    window.__shrinkNoteImg = function (img, dataUrl) {
        if (!img || !dataUrl || dataUrl.indexOf('data:image/') !== 0) return;
        if (dataUrl.length < KEEP_UNDER) return;
        var im = new Image();
        im.onload = function () {
            try {
                var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
                var scale = Math.min(1, MAXW / (w || 1));
                var c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(w * scale));
                c.height = Math.max(1, Math.round(h * scale));
                var ctx = c.getContext('2d');
                ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(im, 0, 0, c.width, c.height);
                var out = c.toDataURL('image/jpeg', QUALITY);
                if (out && out.length < dataUrl.length) {
                    img.src = out;
                    img.dataset.shrunk = '1';
                    schedule(img);
                }
            } catch (e) {}
        };
        im.src = dataUrl;
    };

    function saveFrom(el) {
        var ed = el && el.closest ? el.closest('.note-editor') : null;
        if (!ed) return;
        try {
            var id = ed.dataset.id;
            var content = (ed.innerHTML || '').trim();
            if (content === '<br>' || content === '') content = '';
            if (content) { notes[id] = content; } else { delete notes[id]; }
            saveNotes();
        } catch (e) {
            var btn = document.querySelector('.note-save[data-id="' + (ed.dataset.id || '') + '"]');
            if (btn) btn.click();
        }
    }

    function schedule(el) {
        dirty = true;
        clearTimeout(timer);
        timer = setTimeout(function () {
            try { saveFrom(el); dirty = false; } catch (e) {}
        }, 900);
    }

    document.addEventListener('input', function (e) {
        var ed = e.target && e.target.closest ? e.target.closest('.note-editor') : null;
        if (ed) schedule(ed);
    }, true);

    document.addEventListener('paste', function (e) {
        var ed = e.target && e.target.closest ? e.target.closest('.note-editor') : null;
        if (ed) setTimeout(function () { schedule(ed); }, 150);
    }, true);

    /* 手动点过保存就认为已保存，不再拦离开 */
    document.addEventListener('click', function (e) {
        if (e.target && e.target.closest && e.target.closest('.note-save')) dirty = false;
    }, true);

    window.addEventListener('beforeunload', function (e) {
        if (!dirty) return;
        e.preventDefault();
        e.returnValue = '';
        return '';
    });
})();
</script>
