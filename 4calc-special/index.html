{id:'m56',special:'微观·长短期均衡',qid:'B3 ★★',question:'假定市场对某种产品的需求为：Q=1500−50P。生产该产品的厂商才能是稀缺的，假定每一个生产该产品的厂商需要并且只需要一个企业家（因此，所雇佣的企业家数量就等于厂商数目）。每个厂商的长期总成本为：C(q,w)=0.5q²−10q+w，w 为付给企业家的年工资。企业家的供给函数为 Qs=0.25w。（1）产品的长期均衡数量是多少？每个厂商均衡产量为多少？该产品长期均衡价格是多少？会有多少厂商？会雇佣多少企业家，其工资是多少？（2）假定产品的需求向外移至 Q=2500−50P，短期内产品均衡价格和数量是多少？厂商利润是多少？',answer:`**考察知识点**：长期均衡、企业家市场、短期均衡。\n**思路**：企业家市场均衡 n=0.25w；长期 P=ACmin；短期厂商数不变。\n**答案**：（1）长期均衡数量1000，单个厂商产量20，价格10，厂商数50，企业家工资200。（2）短期价格20，数量2000，单个厂商利润200。\n##**详解**\n（1）假设有 n 个厂商，那么企业家市场上均衡时满足供求相等，即 0.25w = n，从而有 w = 4n。\n因此厂商的成本函数为：\n$$C(q,w) = 0.5q² − 10q + 4n\n厂商边际成本为 MC = q − 10，平均成本为：\n$$AC = 0.5q − 10 + 4n/q\n完全竞争厂商长期均衡时满足利润最大化 P = MC 以及利润为零 P = AC，由 MC 与 AC 关系可知，长期均衡条件为 P = MC = AC_min。\n由一阶条件可得：\n$$dAC/dq = 0.5 − 4n/q² = 0\n解得 q = √(8n)，长期均衡价格 P = √(8n) − 10，市场上该产品总的供给量为：\n$$Q_s = nq = n√(8n)\n长期均衡时满足供求相等，即：\n$$1500 − 50P = n√(8n)\n代入长期均衡价格 P = √(8n) − 10 解得 n = 50。\n因此，产品长期均衡数量 Q = 1000，每个厂商产量 q = 20，长期均衡价格 P = 10，厂商数量 n = 50，企业家数量为50，企业家工资 w = 200。\n（2）市场需求函数变化后，短期内厂商数目不变，因此企业家市场的均衡不变，即 n = 50，w = 200。\n厂商成本函数为 C(q,w) = 0.5q² − 10q + 200，边际成本为 MC = q − 10。\n因此，厂商的供给函数为 P = MC = q − 10，市场供给函数为：\n$$Q_s = 50q = 50P + 500\n短期均衡时满足市场供求相等，即：\n$$50P + 500 = 2500 − 50P\n解得 P = 20，Q = 2000，单个厂商的产量：\n$$q = Q/50 = 40\n厂商利润：\n$$π = 20×40 − (0.5×40² − 10×40 + 200) = 200`},
{id:'m57',special:'微观·市场均衡与政府干预',qid:'A1 ★★★',question:'假设商品X市场中有1000个相同的消费者，每个人的需求函数为 d=12−2P；同时又有100个相同的生产者，每个生产者的供给函数为 s=40P。求：（1）市场均衡时的价格和产量。（2）如果政府对每个企业销售的每单位商品X都征收3块钱的销售税，在这3块钱的税收中，消费者和生产者各承担多少？（3）与征税前相比，消费者剩余和生产者剩余的变化是多少？政府税收是多少？税收造成的福利净损失是多少？（同济大学考题）',answer:`**考察知识点**：市场均衡、从量税、税收归宿、福利分析。\n**思路**：加总需求供给；征税后 Pd=Ps+3；求CS、PS、税收、无谓损失。\n**答案**：（1）P=2，Q=8000。（2）消费者承担2元，生产者承担1元。（3）ΔCS=−12000，ΔPS=−6000，政府税收12000，福利净损失6000。\n##**详解**\n（1）由个人需求曲线 d = 12 − 2P 水平加总得市场需求曲线 Q_d = 12000 − 2000P。\n由个人供给函数得市场供给函数 Q_s = 4000P。\n市场均衡时满足供求相等，即：\n$$12000 − 2000P = 4000P\n解得均衡价格和产量分别为 P = 2，Q = 8000。\n（2）政府对每个企业销售的单位产品征收3块钱后，满足 P_s = P_d − 3。\n均衡时满足：\n$$12000 − 2000P_d = 4000P_s\n解得消费者支付的价格 P_d = 4，生产者获得的价格 P_s = 1，均衡产量 Q′ = 4000。\n因此消费者承担2元税收，生产者承担1元税收。\n（3）征税后，消费者剩余变化量：\n$$ΔCS = −(1/2)×(4−2)×(4000+8000) = −12000\n生产者剩余变化量：\n$$ΔPS = −(1/2)×(2−1)×(8000+4000) = −6000\n政府税收收入：\n$$T = 3×4000 = 12000\n福利净损失：\n$$12000 + 6000 − 12000 = 6000\n**【提示】**此类题目要注意题目要求的是什么量，不同量正负号不同。这里求的是福利损失量，损失量应该是正值，而福利变化量为负值，如果要求无谓损失，也为正值。`},
{id:'m58',special:'微观·市场均衡与政府干预',qid:'A2 ★★★',question:'设一个商品的供给与需求曲线都是直线，函数分别为：QD=a−bp 和 Qs=c+dp。假如就该商品对厂商或销售方征收从量税，单位商品税收为 t。请回答如下问题：（1）计算其对均衡价格和均衡数量的影响；（2）计算供求双方各自负担的税收是多少，并利用经济学原理解释税收为什么被转嫁，又为什么没有全部转嫁；（3）计算双方各自负担的税收份额和供求弹性之间的关系，并利用经济学原理进行解释；（4）用曲线说明征税以后的均衡价格和数量的变化，并比较供求双方的税收份额。',answer:`**考察知识点**：从量税、税收归宿、弹性。\n**思路**：联立征税后方程；比较价格变化；弹性与税负份额关系。\n**答案**：（1）Q**=(ad+bc−bdt)/(b+d)，p**=(a−c+dt)/(b+d)。（2）消费者负担 TD=dt/(b+d)，生产者负担 TS=bt/(b+d)。（3）TD/t=eS/(eS+eD)，TS/t=eD/(eS+eD)。（4）图略。\n##**详解**\n（1）在没有征税时，均衡时满足条件 Q_D = Q_s，即：\n$$a − bp = c + dp\n解得均衡价格和均衡产量为：\n$$Q* = (ad + bc)/(b + d)，p* = (a − c)/(b + d)\n假设对厂商征收从量税 t，此时存在 p_s = p_d − t，联立以下方程：\n$$a − bp_d = c + dp_s\n$$p_s = p_d − t\n解得：\n$$Q** = (ad + bc − bdt)/(b + d)，p** = p_d = (a − c + dt)/(b + d)\n所以征税以后价格上涨：\n$$Δp = p** − p* = dt/(b + d)\n产品数量变动为：\n$$ΔQ = Q** − Q* = −bdt/(b + d)\n（2）消费者承受的税收负担为：\n$$T_D = p** − p* = dt/(b + d)\n生产者承受的税收负担为：\n$$T_S = t − T_D = bt/(b + d)\n税收负担能够被转嫁，是因为供给曲线和需求曲线存在弹性；而不能完全转嫁，是因为供给弹性和需求弹性并不是无穷大，即 b ≠ 0，d ≠ 0。\n当 b = 0，即需求曲线完全无弹性时，T_D = t，T_S = 0，税负全部转嫁给消费者；\n当 d = 0，即供给曲线完全无弹性时，T_D = 0，T_S = t，税负全部转嫁给生产者。\n（3）由征税前的均衡点，需求价格弹性为：\n$$e_D = −p*/(a − bp*)·∂Q_D/∂p = (ab − bc)/(ad + bc)\n供给价格弹性为：\n$$e_S = p*/(c + dp*)·∂Q_S/∂p = (ad − cd)/(ad + bc)\n由（2）可得，消费者负担的税收份额为：\n$$T_D/t = d/(b + d)\n厂商负担的税收份额为：\n$$T_S/t = b/(b + d)\n同时：\n$$e_S/(e_S + e_D) = [(ad−cd)/(ad+bc)]/[(ad−cd+ab−bc)/(ad+bc)] = d/(b+d) = T_D/t\n因此，消费者和厂商的税收份额和供求弹性之间的关系分别为：\n$$T_D/t = e_S/(e_S + e_D)，T_S/t = e_D/(e_S + e_D)\n其经济学含义为：① 需求弹性越大，供给弹性越小，消费者负担的税收份额越小，生产者负担的税收份额越大。② 供给弹性越大，需求弹性越小，消费者负担的份额越大，生产者负担的份额越小。\n其原因在于：当某种商品的需求弹性大于供给弹性时，说明当该商品由于政府征税而价格变动时，其需求量的变动幅度大于供给量的变动幅度。在这种情况下，税负转嫁给消费者较困难，税负会更多地由生产要素提供者或生产者自己承担。反之，当需求弹性小于供给弹性时，需求量的变动幅度小于供给量的变动幅度，税负会更多地由消费者承担。\n（4）如图所示，在未征税前，市场均衡价格为 p*，均衡数量为 Q*。在对每单位产品征收 t 的税收后，市场均衡价格为 p**（即消费者支付的价格），均衡数量为 Q**。此时消费者承担的税负为 T_D，厂商承担的税负为 T_S。\n【此处有图示】\n**【校注】**原书此处把 T_D/t 与 T_S/t 写反了，按 T_D = dt/(b+d)、T_S = bt/(b+d) 展开应为上面的结果，与弹性关系式的对应关系不变。`},
{id:'m59',special:'微观·市场均衡与政府干预',qid:'A3 ★★★',question:'市场中共有3000人，男女比例为2:1，其中男生对商品的需求函数为 q1=20−p，女生对商品的需求函数为 q2=20−2p。市场的供给函数为 Q=6000p。（1）求市场总的需求函数，当 p=5 时，求 ed1、ed2 以及市场的需求价格弹性；（2）求均衡价格与产量；（3）政府对每单位商品征收 t=1 的税收，求征税后的均衡价格和产量，计算政府税收收入与税率的关系，求最优解并解释。',answer:`**考察知识点**：市场加总、需求弹性、从量税、拉弗曲线。\n**思路**：分段加总需求；求弹性；征税后供求相等；税收收入最大化。\n**答案**：（1）总需求：0≤p≤10 时 Q=60000−4000p；10<p≤20 时 Q=40000−2000p。p=5 时 ed1=−1/3，ed2=−1，ed=−0.5。（2）均衡 p=6，Q=36000。（3）征税后 p=6.6，Q=33600；税收收入 T=−2400t²+36000t（t≤20/3）或 T=−1500t²+30000t（t>20/3）；最优税率 t=10，最大税收150000。\n##**详解**\n（1）男生对商品的需求函数为 Q₁ = 2000q₁ = 40000 − 2000p，其中 0 ≤ p ≤ 20。\n女生对商品的需求函数为 Q₂ = 1000q₂ = 20000 − 2000p，其中 0 ≤ p ≤ 10。\n因此市场总的需求函数为：\n$$Q = 60000 − 4000p，0 ≤ p ≤ 10\n$$Q = 40000 − 2000p，10 < p ≤ 20\n当 p = 5 时：\n$$e_d1 = (dq₁/dp)·(p/q₁) = −1×5/(20−5) = −1/3\n$$e_d2 = −(dq₂/dp)·(p/q₂) = −2×5/(20−2×5) = −1\n市场需求价格弹性：\n$$e_d = (dQ/dp)·(p/Q) = −4000×5/(60000 − 4000×5) = −0.5\n（2）市场均衡时满足供求相等，即 Q_d = Q_s。\n当 0 ≤ p ≤ 10 时，6000p = 60000 − 4000p，解得 p = 6，Q = 36000，符合题意。\n当 10 < p ≤ 20 时，6000p = 40000 − 2000p，解得 p = 8，不符合题意。\n（3）政府征收 t = 1 的从量税后，满足 p_d − p_s = 1。\n当 0 ≤ p ≤ 10 时，联立：\n$$p_d − p_s = 1\n$$6000p_s = 60000 − 4000p_d\n解得均衡价格和产量：p = p_d = 6.6，Q = 33600，符合题意，所以不用再考虑 10 < p ≤ 20 的情形。此时政府税收收入：\n$$T = tQ = 33600\n假设税率为 t，联立：\n$$p_d − p_s = t\n$$6000p_s = 60000 − 4000p_d\n解得均衡价格和产量：p = p_d = 6 + 0.6t，Q = 36000 − 2400t。\n注意此时均衡价格要满足 p = 6 + 0.6t ≤ 10，即税率 t 要满足 t ≤ 20/3，下面分情况讨论：\n① 当 t ≤ 20/3 时。\n均衡价格和产量：p = p_d = 6 + 0.6t，Q = 36000 − 2400t。\n政府税收收入：\n$$T = tQ = t(36000 − 2400t) = −2400t² + 36000t\n当 t = 7.5 时，税收收入达到最大，但由于 0 ≤ t ≤ 20/3，所以在此范围内，随着税率的上升，税收收入不断增加。\n② 当 t > 20/3 时。\n联立：\n$$p_d − p_s = t\n$$6000p_s = 40000 − 2000p_d\n解得均衡价格和产量：p = p_d = 5 + 0.75t，Q = 30000 − 1500t。\n政府税收收入：\n$$T = tQ = t(30000 − 1500t) = −1500t² + 30000t\n所以随着税率从 t = 20/3 开始增加，政府税收收入增加；当 t = 10 时，政府税收收入达到最大 T = 150000；随之再提高税率会导致政府税收收入的减少。\n**【提示】**关于第（1）问，这里补充一个结论，即 e_d = s₁e_d1 + s₂e_d2，其中 e_d 为市场的需求价格弹性，e_d1 与 e_d2 为细分市场的需求价格弹性，s₁ 与 s₂ 为两个市场的销量占市场总销量的份额，即 s₁ = q₁/(q₁+q₂)，s₂ = q₂/(q₁+q₂)。`},
{id:'m60',special:'微观·市场均衡与政府干预',qid:'A4 ★★',question:'某地区鲜花的市场需求函数是 D(p)=2000−40p，这里 p 是每一束花的价格，D(p) 是鲜花的需求量（以束为单位）。同时，鲜花的市场供给函数是 S(p)=−400+20p，这里 S(p) 是鲜花的供给量（以束为单位）。（1）找出市场的均衡价格和均衡数量。（2）计算均衡下的消费者剩余和生产者剩余。（3）假设政府对鲜花征收消费税，消费者为每一束花需要额外支付15元的税。找到新的均衡价格和均衡数量。（4）仍然假设 15 元的鲜花消费税。计算这个税收政策所导致的无谓损失。（5）假设除了15元的消费税，政府又决定征收 t 元的生产税，即生产者为每一束花需要额外支付 t 元的税。新的市场均衡数量为100束。计算 t 的数值。',answer:`**考察知识点**：均衡、CS/PS、从量税、无谓损失。\n**思路**：供求相等；积分求剩余；征税后 Pd=Ps+15；无谓损失三角形。\n**答案**：（1）p=40，Q=400。（2）CS=2000，PS=4000。（3）p′=45，Q′=200。（4）无谓损失1500。（5）t=7.5。\n##**详解**\n（1）联立市场需求函数 D(p) = 2000 − 40p 和市场供给函数 S(p) = −400 + 20p，得：\n$$2000 − 40p = −400 + 20p\n解得均衡价格 p = 40，均衡产量 Q = 400。\n（2）由 D(p) = 2000 − 40p 可知：D(p) = 0 时，p = 50。\n则消费者剩余：\n$$CS = (1/2)×(50−40)×400 = 2000\n由 S(p) = −400 + 20p 可知：S(p) = 0 时，p = 20。\n则生产者剩余：\n$$PS = (1/2)×(40−20)×400 = 4000\n（3）由于政府征收对每单位鲜花征收15元的消费税，此时满足 p_d = p_s + 15。均衡时满足 D(p_d) = S(p_s)，即：\n$$2000 − 40p_d = −400 + 20p_s\n联立：\n$$2000 − 40p_d = −400 + 20p_s\n$$p_d = p_s + 15\n解得均衡价格 p′ = p_d = 45，均衡产量 Q′ = 200。\n（4）**【法一】**无谓损失 = (1/2)×15×(400−200) = 1500。\n**【法二】**征税后，消费者剩余：\n$$CS′ = (1/2)×(50−45)×200 = 500\n生产者剩余：\n$$PS′ = (1/2)×(30−20)×200 = 1000\n政府税收收入：\n$$T = 15×200 = 3000\n所以无谓损失：\n$$(CS+PS) − (CS′+PS′+T) = (2000+4000) − (500+1000+3000) = 1500\n（5）如果此时还对生产者每单位产量征收 t 元生产税，此时满足 p_s = p_d − 15 − t。\n均衡时满足 D(p_d) = S(p_s)，即：\n$$2000 − 40p_d = −400 + 20p_s\n$$p_s = p_d − 15 − t\n解得市场均衡价格 p″ = p_d = 45 + t/3，均衡产量 Q″ = 200 − 40t/3。\n代入均衡产量100解得税率 t = 7.5。`},
{id:'m61',special:'微观·市场均衡与政府干预',qid:'A5 ★★',question:'大学曲棍球运动员市场的供给和需求曲线如下：QD=1600−20P，QS=−900+30P，其中 Q 为运动员数量，P 为每周工资。（1）如果市场是完全自由的，均衡时的每周工资为多少？雇佣的运动员为多少？（2）现在假设全美大学体育运动联合会（NCAA）介入，决定降低运动员的工资。NCAA并不反对给队员付工资，但是对工资水平太高感到不满，所以NCAA规定付给运动员的工资不能高于35美元/周。在这种情况下，达到均衡时雇佣了多少名运动员？（3）在价格控制下，生产者剩余（即运动员剩余）如何变化？（4）在价格控制下，与自由市场均衡时相比，学校少付给运动员多少工资？（5）价格上限带来的无谓损失为多大？（暨南大学考题）',answer:`**考察知识点**：最高限价、生产者剩余、无谓损失。\n**思路**：自由均衡；限价后由供给决定雇佣量；计算剩余变化和福利损失。\n**答案**：（1）P*=50，Q*=600。（2）雇佣150名。（3）ΔPS=−5625。（4）学校少付24750。（5）无谓损失8437.5。\n##**详解**\n（1）市场完全自由时，均衡时满足供求相等，即：\n$$−900 + 30P = 1600 − 20P\n解得均衡价格和产量：P* = 50，Q* = 600。\n（2）当 P = 35 时，Q_D = 900，Q_S = 150。\n此时需求大于供给，运动员出现短缺。\n在这种工资水平的限制下，均衡由供给方决定，因此雇佣的运动员为：\n$$Q₁ = Q_S = 150\n（3）如下图所示，在价格控制 P₀ = 35 下，由于运动员的供给数量只有 Q₁，这意味着一部分原有运动员将退出。其中，对继续雇佣的运动员而言，他们的生产者剩余由于工资的下降而减少了，其损失为矩形面积 A；对退出的运动员而言，他们的生产者剩余的损失为三角形面积 C。总体来说，市场上生产者剩余的变化量为 −(A+C)。\n因此生产者剩余的变化量：\n$$ΔPS = −(1/2)×(P*−P₀)×(Q*+Q₁) = −(1/2)×(50−35)×(600+150) = −5625\n（4）学校少付的工资：\n$$50×600 − 35×150 = 24750\n（5）此时消费者剩余的变化量 ΔCS = A − B，生产者剩余的变化量 ΔPS = −(A+C)，所以总的福利变化量 = −(B+C)。\n当 Q₁ = 150 时，消费者愿意支付的最高价格 P_d = 72.5。\n无谓损失：\n$$(1/2)×(72.5−35)×(600−150) = 8437.5\n【此处有图示】\n**【提示】**本题实际上考的是最高限价，最高限价时会导致商品供给短缺。\n**【提示】**相较于最低限价，最高限价情况较为简单，最低限价更为复杂，因为最低限价有三种情况：① 不存在生产过剩，此时均衡数量由需求方决定；② 存在生产过剩，政府不收购多余产量；③ 存在生产过剩，政府收购多余产量。这三种情况下社会福利、CS、PS 的变化情况都不一样，大家做题时要学会根据题目要求进行判断。`},
{id:'m62',special:'微观·市场均衡与政府干预',qid:'A6 ★★★',question:'棉花市场的需求函数为 Qd=10−2p，供给函数是 Qs=3p−5，政府觉得棉花的价格过低，为保护棉农的利益，决定采取政策。（1）政府规定棉花的最低收购价格是4，即政府愿意以4的价格采购任意数量的棉花。计算最低收购价政策前后棉农的供给量的变化，市场需求量的变化，以及在政策之后，政府采购量。（2）计算最低收购价政策前后消费者剩余和生产者剩余的变化，实施该政策政府的成本。（3）假设政府把最低收购价改成补贴政策，即棉农每销售单位棉花，政府给棉农补贴 s。问 s 为多少时，生产者认为政策变化不会影响其利益？问该补贴政策的政府成本是多少？（上财 2011 年考题）',answer:`**考察知识点**：最低收购价、政府采购、补贴。\n**思路**：求原均衡；限价后供给、需求、收购量；剩余变化；补贴使生产者剩余相同。\n**答案**：（1）原均衡 p=3，Q=4；限价4后供给7，需求2，政府收购5。（2）ΔCS=−3，ΔPS=5.5，政府成本20。（3）s=2.5；政府成本17.5。\n##**详解**\n（1）政府实施最低收购价之前，由供求相等可得：\n$$10 − 2p = 3p − 5\n解得市场均衡价格 p* = 3，此时的均衡数量 Q* = 4。\n政府实施最低收购价 p = 4 以后，市场需求量 Q_d = 10 − 2×4 = 2，市场供给量 Q_s = 3×4 − 5 = 7，所以政府收购量：\n$$Q = Q_s − Q_d = 7 − 2 = 5\n（2）如下图所示，实施最低收购政策以后：\n消费者剩余的变化量：\n$$ΔCS = −(1/2)×(2+4)×(4−3) = −3\n生产者剩余的变化量：\n$$ΔPS = (1/2)×(7+4)×(4−3) = 5.5\n政府的采购成本：\n$$(7−2)×4 = 20\n【此处有图示】\n（3）实施收购政策以后生产者剩余：\n$$PS′ = (1/2)×(4 − 5/3)×7 = 49/6\n由于政府对每单位的棉花生产补贴 s，设消费者最终实际支付的价格为 P_d，生产者最终实际得到的价格为 P_s，则有 P_d + s = P_s。\n最终均衡时供求相等，即：\n$$10 − 2P_d = 3P_s − 5\n联立解得均衡时厂商获得的支付：\n$$P_s = 3 + (2/5)s\n均衡数量：\n$$Q = 4 + (6/5)s\n此时的生产者剩余：\n$$PS′ = (1/2)×(3 + (2/5)s − 5/3)×(4 + (6/5)s) = 49/6\n解得 s = 2.5，即当政府为每单位的棉花生产补贴2.5时，生产者的利益和实行最低价格时相同，此时政府的成本为：\n$$2.5×7 = 17.5`},
{id:'m63',special:'微观·市场均衡与政府干预',qid:'A7 ★★',question:'某产品市场需求函数为 D=20−2p，市场供给函数为 S=2p−10，若政府进行如下补贴：消费者在购买商品时，只需按照市场价格的一半进行支付，另一半由政府买单，求：（1）补贴前的市场均衡价格、数量、消费者剩余、生产者剩余；（2）补贴后的消费者剩余、生产者剩余及政府补贴量，并结合以上分析社会福利的变化。',answer:`**考察知识点**：从价补贴、福利分析。\n**思路**：补贴前均衡；补贴后 pd=ps/2；计算剩余和补贴。\n**答案**：（1）p*=7.5，q*=5，CS=6.25，PS=6.25。（2）ps=10，pd=5，q′=10，CS′=25，PS′=25，政府补贴50；社会总福利0，比补贴前下降12.5。\n##**详解**\n（1）由市场均衡条件可知：\n$$20 − 2p = 2p − 10\n解得 p* = 7.5，q* = 5。\n由下图可知：消费者剩余：\n$$CS = (1/2)×5×(10−7.5) = 6.25\n生产者剩余：\n$$PS = (1/2)×5×(7.5−5) = 6.25\n社会总福利 = CS + PS = 12.5\n（2）政府以半价补贴，此时满足条件 p_d = (1/2)p_s。\n由均衡条件可知：\n$$20 − p_s = 2p_s − 10\n联立解得：p_s = 10，p_d = 5，q′ = 10。\n即此时消费者实际支付的价格为5，厂商获得的价格为10，则新的消费者剩余：\n$$CS′ = (1/2)×(10−5)×10 = 25\n新的生产者剩余：\n$$PS′ = (1/2)×(10−5)×10 = 25\n政府补贴：\n$$(1/2)×10×10 = 50\n社会总福利 = CS + PS − T = 0\n与补贴之前相比，社会总福利下降12.5。\n【此处有图示】\n**【提示】**政府干预通常会结合福利分析进行考察，要熟练掌握不同的税收方式对 CS、PS 和社会总福利的影响。常考的政府干预是限价和从量税，但本题实质上考察的是从价补贴（负的从价税）。`},
{id:'m64',special:'微观·市场均衡与政府干预',qid:'A8 ★★',question:'某商品的国内需求为：Q=5000−100P，国内供给曲线为：Q=150P。这里，价格（P）用美元来测度。（1）在该商品的国内市场上，均衡点在何处？（2）假定可以以每单位10美元的世界市场价格进口。如果贸易不会受到限制，那么新的市场均衡点位于何处？会进口多少该商品？（3）如果国内该商品的生产者成功地要求政府征收5美元关税，那么，这将会怎样改变市场均衡？关税收益为多少？多少消费者剩余会转移到国内生产者手中？关税所带来的总损失会是多少？（4）如果政府与外国供应商达成了一项协议，每年会把该商品的出口量“自愿”限制在125单位，那么你在（3）中得出的结论将会有什么变化？请解释这与关税的情况有什么不同。',answer:`**考察知识点**：国际贸易、关税、配额、福利。\n**思路**：国内均衡；世界价格下进口；关税后价格；配额后进口固定。\n**答案**：（1）P=20，Q=3000。（2）价格10，需求4000，供给1500，进口2500。（3）价格15，需求3500，供给2250，进口1250；关税收入6250；消费者剩余转移给生产者9375；总损失3125。（4）配额下其他不变，但政府没有关税收益，福利损失更大。\n##**详解**\n（1）国内市场均衡条件为：\n$$150P = 5000 − 100P\n解得均衡价格 P = 20，均衡产量 Q = 3000。\n（2）假定可以按单位10美元的世界市场价格进口，则国内商品价格降为10美元，此时国内市场的需求量 Q_D = 4000，国内厂商的供给量为 Q_S = 1500，因而需要的进口量为：\n$$Q_D − Q_S = 4000 − 1500 = 2500\n（3）在征收关税的情况下，市场价格将上升为15美元，因而国内市场的需求量为 Q_D = 3500，国内厂商的供给量为 Q_S = 2250，因而需要的进口量为：\n$$3500 − 2250 = 1250\n关税收入为：\n$$T = 5×1250 = 6250\n在未征收关税的情况下，消费者剩余为：\n$$CS = (1/2)×(50−10)×4000 = 80000\n在征收关税的情况下，消费者剩余为：\n$$CS = (1/2)×(50−15)×3500 = 61250\n因而消费者剩余的损失为：\n$$80000 − 61250 = 18750\n在未征收关税的情况下，国内生产者的剩余为：\n$$PS = (1/2)×10×1500 = 7500\n在征收关税的情况下，国内生产者的剩余为：\n$$PS = (1/2)×15×2250 = 16875\n生产者剩余的增加量为：\n$$16875 − 7500 = 9375\n因此，消费者损失的剩余中，会有9375转移给生产者。无谓损失：\n$$18750 − 6250 − 9375 = 3125\n（4）在自愿配额的情况下，重新解答上一问可知，其他的结论没有变化，只有关税收益不复存在了，即此时政府没有获得原来总额为6250的关税收益，此时社会福利的损失量大于关税下的情形。`},
{id:'m65',special:'微观·综合题',qid:'A1 ★★★',question:'在一个完全竞争市场，企业使用两种原材料，记为1和2，两种原材料的市场价格均为1。每个企业的固定成本为 F=32，生产函数为 f(x1,x2)=√(x1x2)，其中 xi 是原材料 i 的使用量，消费者对该产品的需求函数为 Q=280−5p，其中 p 为市场价格。请找出这个市场的长期均衡价格和企业个数。',answer:`**考察知识点**：成本最小化、长期均衡、企业数。\n**思路**：求条件要素需求和成本函数；长期 P=ACmin；市场均衡求企业数。\n**答案**：长期均衡价格16；企业个数50。\n##**详解**\n（1）企业的成本最小化问题为：\n$$min x₁ + x₂ + 32\n$$s.t. x₁x₂ = q²\n构建拉格朗日函数：\n$$L = x₁ + x₂ + 32 + λ(q² − x₁x₂)\n成本最小化的一阶条件为：\n$$∂L/∂x₁ = 1 − λx₂ = 0\n$$∂L/∂x₂ = 1 − λx₁ = 0\n$$∂L/∂λ = q² − x₁x₂ = 0\n由上述三式解得 x₁ = x₂ = q。\n因此，该企业的成本函数为 TC = 2q + 32。\n（注：按题给生产函数 f = √(x₁x₂)，若保持原题结论，则 x₁ = x₂ = q²，成本函数为 TC = 2q² + 32。）\n从而可得：\n$$AC = 2q + 32/q\n平均成本最小化的一阶条件为：\n$$dAC/dq = 2 − 32/q² = 0\n解得 q = 4。\n完全竞争市场长期均衡的条件是 p = AC_min，则有：\n$$p = 2q + 32/q = 2×4 + 32/4 = 16\n即当价格为16时，市场实现长期均衡。\n（2）当价格为16时，市场的总需求为：\n$$Q = 280 − 5p = 200\n每个厂商的供给为4，所以，这个市场的长期均衡的企业个数为：\n$$n = Q/q = 200/4 = 50`},
{id:'m66',special:'微观·综合题',qid:'A2 ★★★',question:'假设企业生产衣服需要两种投入资本和劳动力要素。生产函数为 f(K,L)=K^(1/4)L^(1/4)，其中 K 和 L 分别表示这个企业在资本和劳动力上的投入量，假设资本和劳动的单价分别为40元和10元。（1）若企业决定生产 y 件衣服，那么需要花费的最小成本是多少？（2）假设该企业处在一个完全竞争的市场环境中，若该企业所生产的衣服的市场价格为 p 元每件，这个企业应该生产多少件衣服？（提示：生产的衣服的数量是关于 p 的函数）（3）我们进一步假设在该完全竞争的市场中有800个企业，所有企业都生产相同的衣服，并且所有这些企业的生产技术都一样，即每个企业的生产函数都是 f(K,L)=K^(1/4)L^(1/4)。同时该衣服的市场反需求函数为 p=800−D/10，其中 D 表示市场的总需求，试求出当市场处于均衡时，该衣服的市场价格为多少？每个企业卖出的衣服数量是多少？（上海财经大学 2016 年考题）',answer:`**考察知识点**：成本最小化、完全竞争供给、市场均衡。\n**思路**：由 MPL/MPK=w/r 求条件要素需求；成本函数；P=MC；市场供求相等。\n**答案**：（1）C=40y²。（2）y=p/80。（3）p*=400，y*=5。\n##**详解**\n（1）均衡时：\n$$MP_L/MP_K = 10/40\n即：\n$$[(1/4)K^(1/4)L^(−3/4)]/[(1/4)K^(−3/4)L^(1/4)] = K/L = 10/40\n解得 K/L = 1/4，即 L = 4K，将其代入 K^(1/4)L^(1/4) = y 可得条件要素需求函数为：\n$$K = y²/2，L = 2y²\n成本函数为：\n$$C = 40K + 10L = 20y² + 20y² = 40y²\n（2）完全竞争均衡条件为 p = MC = 80y，因此单个厂商的供给函数为：\n$$y = p/80\n（3）完全竞争时，单个厂商的供给曲线是 y = p/80。\n则市场中有800个相同的企业时的总供给函数为：\n$$Q = 800y = 10p\n当市场需求与供给相等时则达到均衡，所以有：\n$$8000 − 10p = 10p ⇒ p* = 400\n将均衡价格 p* = 400 代入单个企业的供给函数即可得：\n$$y* = 5`},
{id:'m67',special:'微观·综合题',qid:'B1 ★★★',question:'假设在完全竞争市场中，有100位完全相同的消费者，每个消费者的效用函数均为 u(x,y)=x−x²/2+y，其中 x 和 y 分别为两种商品的数量，x 的价格为 p，y 的价格为1，消费者的收入为比较大的某个值 m。（1）写出对 x 的市场需求函数。（2）假定市场中有若干个具有同样生产技术的厂商，每个厂商的长期成本函数为 c(q)=q²/16+1，请问均衡时，该行业中最多有多少个厂商？此时市场均衡价格和产量分别是多少？（假设厂商数目为整数）',answer:`**考察知识点**：拟线性效用、市场需求、长期均衡、企业数。\n**思路**：单个消费者需求 x=1−p；市场加总；长期 P=ACmin 或零利润；求最多厂商数。\n**答案**：（1）D(p)=100−100p。（2）最多12个厂商；均衡价格 pE=0.51，市场总产量49。\n##**详解**\n（1）对每个消费者而言，其效用最大化问题为：\n$$max x − x²/2 + y\n$$s.t. px + y = m\n构造拉格朗日函数：\n$$L = x − x²/2 + y − λ(px + y − m)\n由一阶条件可得：\n$$∂L/∂x = 1 − x − λp = 0，∂L/∂y = 1 − λ = 0，∂L/∂λ = m − px − y = 0\n解得单个消费者对商品 x 的需求函数为 x = 1 − p，从而市场总需求为：\n$$D(p) = 100 − 100p\n**【提示】**在利用拉格朗日法之前，也可以自己验证一下边际替代率是不是递减的：\n$$MRS_xy = −dy/dx = MU_x/MU_y = 1 − x，dMRS_xy/dx = −1 < 0\n（2）假设长期均衡时，留在该行业中的厂商数量为 N，市场均衡价格为 p_E，从而单个厂商的产量满足边际成本定价原则，即：\n$$p_E = MC = q_E/8\n整理得 q_E = 8p_E，此时市场的总供给为 8Np_E。\n又因为对于给定的价格 p_E，市场总需求为 D(p_E) = 100 − 100p_E，根据均衡时总供给等于总需求的条件，就有：\n$$100 − 100p_E = 8Np_E\n解得市场均衡价格：\n$$p_E = 25/(2N + 25)\n长期均衡时每个厂商至少可以获得零利润，即：\n$$p_E q_E − c(q_E) = 8p_E² − 4p_E² − 1 = 4p_E² − 1 ≥ 0\n从而解得 p_E ≥ 0.5，由于均衡价格 p_E = 25/(2N+25)，所以：\n$$25/(2N + 25) ≥ 0.5\n解得 N ≤ 12.5。\n特别地，N = 12 是在保证每个厂商获得非负利润的条件下，该行业可以容纳的最多厂商数量。这就意味着，如果行业内厂商数量再增加一个，那么每个厂商的利润就会严格小于零。所以均衡时，行业内的厂商数量为12。把 N = 12 代入 p_E = 25/(2N+25)，可以得到均衡价格为 p_E = 0.51，此时市场的总产量为：\n$$100 − 100p_E = 49`},
{id:'m68',special:'微观·垄断均衡与政府干预',qid:'A1 ★★',question:'某垄断厂商短期固定生产成本为3000元，短期边际成本函数为 SMC=0.3Q²−12Q+140，其中 Q 为每月产量（吨）。为使利润最大，它每月生产40吨，获得利润为1000元。（1）计算该厂商的边际收益、销售价格和总收益。（2）计算在利润最大点的需求价格弹性。（3）假定该厂商面临线性的需求函数，请推导出这个函数的具体表达式。',answer:`**考察知识点**：垄断利润最大化、边际收益、需求弹性、线性需求。\n**思路**：MR=SMC；由利润求价格；弹性与 MR 关系；线性需求求参数。\n**答案**：（1）MR=140，P=160，TR=6400。（2）Ed=8。（3）需求函数 Q=360−2P。\n##**详解**\n（1）从题意可知，当产量为40时，厂商实现了利润最大化。按照利润最大化的条件 MR = MC 有：\n$$MR = SMC = 0.3×40² − 12×40 + 140 = 140\n由 SMC = 0.3Q² − 12Q + 140 和 TFC = 3000 可得，厂商短期成本函数为：\n$$TC = ∫(0.3Q² − 12Q + 140)dQ + 3000 = 0.1Q³ − 6Q² + 140Q + 3000\n当 Q = 40 时，短期总成本 TC = 5400。\nπ = 1000，故：\n$$PQ − (0.1Q³ − 6Q² + 140Q + 3000) = 1000\n代入 Q = 40 解得 P = 160。\n故总收益：\n$$TR = π + TC = 6400\n（2）垄断厂商利润最大化时满足条件 MR = MC，故：\n$$MC = P(1 − 1/E_d)\n代入 P = 160，SMC = 140，解得厂商在利润最大点的需求价格点弹性 E_d = 8。\n（3）假设厂商面临的反需求函数为 P = a − bQ。\n由厂商利润最大化的条件 MR = MC 可得：\n$$a − 2bQ = 140\n由厂商利润最大化时需求价格点弹性 E_d = 8 可得：\n$$−(dQ/dP)(P/Q) = (1/b)(a−bQ)/Q = 8\n将 Q = 40 代入可以解得 a = 180，b = 0.5。\n故厂商面临的需求函数为：\n$$Q = 360 − 2P`},
{id:'m69',special:'微观·垄断均衡与政府干预',qid:'A2 ★★★',question:'在一个中等城市中电话的需求为：Q=1000−50P，其中 Q 是家庭安装电话的数量（单位千门），P 是使用电话的每月租金（单位美元）。电话系统的成本由下式给出：TC=500ln(0.1Q−20)，对于 Q>200。（1）本城市的电信业务是否是一个自然垄断的行业？（2）在这种情况下，什么样的产出水平将产生一个无管制的垄断？消费者要支付的价格是多少？垄断利润是多少？（3）如果允许活跃的竞争，价格会有什么变化？',answer:`**考察知识点**：自然垄断、垄断均衡、竞争。\n**思路**：看平均成本是否递减；MR=MC；竞争导致价格下降。\n**答案**：（1）是自然垄断。（2）Q=450，P=11，利润 4950−500ln25。（3）竞争使价格下降。\n##**详解**\n（1）自然垄断行业是说该行业中企业的平均成本在相当大的产量范围内都是递减的。一般而言，自然垄断的情况常常出现在那些在生产的初始阶段需要大量固定投资，但以后的运营成本相对较低的行业。\n本题中电信业务的边际成本：\n$$MC = 500/(Q − 200)\n因为随着 Q 的增加，MC 递减，所以平均成本随产出增大而减少，因此该行业是自然垄断行业。\n（2）对于垄断厂商而言，其利润最大化的必要条件是 MR = MC，即：\n$$20 − Q/25 = 500/(Q − 200)\n解得 Q = 250 或 450。又因为 Q = 250 时，∂²π/∂Q² > 0，所以 Q = 250 舍去。\n当 Q = 450 时，市场价格 P = 11，厂商利润为：\n$$π = 4950 − 500ln25\n（3）如果允许竞争，那么在没有市场准入的限制下，短期内会有新的厂商进入市场，从而市场上的各个厂商会进行寡头竞争，总产量上升，产品价格下降，同时单个厂商的产量下降，每个厂商都会发生不同程度的亏损；但是在长期内，只有那些资本实力雄厚的厂商会留存下来，而其他厂商会逐渐选择退出市场，所以市场最终又会恢复到垄断状态。`},
{id:'m70',special:'微观·垄断均衡与政府干预',qid:'A3 ★★★',question:'假设一个垄断厂商面临的需求曲线为 P=10−3Q，成本函数为 TC=Q²+2Q。（1）求厂商实现利润最大化时的产量、价格和利润；（2）如果政府试图对该垄断厂商采取限价措施迫使其达到完全竞争行业所能达到的产量水平，则限价应为多少？（3）如果政府通过对厂商生产的每单位产品进行补贴，使其生产的产量为完全竞争行业所能达到的产量水平，此时政府每单位补贴额为多少？（4）如果政府对该垄断厂商征收一笔固定的调节税，以便取得该厂商所获得的超额利润，那么这笔固定税的总额应是多少？（5）以上三种方法对消费者会产生什么影响？（暨南大学 2010 考题）',answer:`**考察知识点**：垄断、限价、补贴、固定税、福利。\n**思路**：垄断 MR=MC；竞争 P=MC；补贴使 MC 下降；固定税拿走超额利润。\n**答案**：（1）Q=1，P=7，π=4。（2）限价5.2。（3）每单位补贴4.8。（4）固定税4。（5）限价和补贴使消费者剩余增加；固定税对消费者无直接影响。\n##**详解**\n（1）厂商利润函数为：\n$$π = PQ − TC = (10−3Q)Q − (Q² + 2Q)\n利润最大化的条件为：\n$$dπ/dQ = 10 − 6Q − 2Q − 2 = 0\n解得 Q = 1。\n把 Q = 1 代入需求曲线方程，可得 P = 7。\n利润：\n$$π = −4×1² + 8×1 = 4\n（2）完全竞争条件下，厂商利润极大化的条件是 P = MC，则有：\n$$10 − 3Q = 2Q + 2\n解得 Q = 1.6。\n把 Q = 1.6 代入需求曲线方程，可得 P = 5.2。\n即如果政府企图对该垄断厂商采取限价措施迫使其达成完全竞争行业所能达到的产量水平，则限价应为5.2。\n（3）假设政府每单位补贴 s，此时厂商的利润函数为：\n$$π = PQ − TC = (10−3Q)Q − (Q² + 2Q − sQ)\n利润最大化的条件为：\n$$dπ/dQ = 10 − 6Q − 2Q − 2 + s = 0\n由（2）可知完全竞争条件下的产量为 Q = 1.6，将其代入厂商利润最大化条件，解得 s = 4.8，即政府应对每单位产品补贴4.8。\n（4）因为政府征收的固定调节税要把该厂商的超额利润都拿走，所以政府对该厂商征收的固定调节税就是其获得的超额利润，即为4单位。征税后，市场产量、价格都没有变，但是垄断厂商的超额利润为零。\n（5）第一种方法即政府迫使垄断厂商采取限价措施扩大产量，和第二种方法对厂商进行补贴，都会使得消费者剩余增加，因为此时消费者能够以更低的价格购买更多商品。第三种方法即政府对生产者征收一笔固定调节税，对消费者来说没有直接得到好处，因为价格和产量没有任何变化。`},
{id:'m71',special:'微观·垄断均衡与政府干预',qid:'A4 ★★★',question:'某完全垄断厂商面临的市场需求曲线是 Q=120−2P，其中 Q 是产量，P 是价格，成本函数为 TC=Q²。试求：（1）该厂商在利润最大化时的产量、价格和利润；（2）垄断带来的效率损失（即纯损）；（3）如果政府对每销售一单位产品向厂商征税15元，该厂商在利润最大化时的产量、价格和利润又是多少？与不征税相比，福利变化如何？',answer:`**考察知识点**：垄断、无谓损失、从量税、福利。\n**思路**：MR=MC；有效产出 P=MC；征税后 MC 增加15；计算福利变化。\n**答案**：（1）Q=20，P=50，π=600。（2）效率损失20。（3）征税后 Q=15，P=52.5，π=337.5；福利变化 −81.25。\n##**详解**\n（1）根据需求函数，可得出反需求函数为：\n$$P = 60 − Q/2\n利润函数为：\n$$π = PQ − TC = (60 − Q/2)Q − Q²\n利润最大化的一阶条件为：\n$$dπ/dQ = 60 − Q − 2Q = 0\n解得 Q = 20，将其代入反需求函数求得市场均衡价格 P = 50。\n厂商利润：\n$$π = 50×20 − 20² = 600\n即该厂商在利润最大化时的产量、价格和利润分别为20、50和600。\n（2）如下图所示，有效率的产出水平应满足边际成本等于价格，即：\n$$60 − Q/2 = 2Q\n可得 Q = 24，P = 48，即有效率的产出水平为24，价格为48。与有效率的产出水平相比，垄断的总经济福利减少了，减少的数量等于下图中的小三角形 abc。通过计算可得小三角形 abc 的面积为：\n$$S = (1/2)×(24−20)×(50−40) = 20\n即垄断带来的效率损失为20。\n【此处有图示】\n（3）如果政府对每销售一单位产品向厂商征税15元，新的成本函数为 TC = Q² + 15Q。\n利润函数为：\n$$π = PQ − TC = (60 − Q/2)Q − Q² − 15Q\n利润最大化的一阶条件为：\n$$dπ/dQ = 60 − Q − 2Q − 15 = 0\n解得 Q = 15，将其代入反需求函数求得市场均衡价格 P = 52.5。\n厂商利润：\n$$π = 52.5×15 − 15² − 15×15 = 337.5\n不征税时：\n消费者剩余：\n$$CS = (1/2)×(60−50)×20 = 100\n生产者剩余：\n$$PS = (1/2)×[(50−2×20)+50]×20 = 600\n社会总福利 = CS + PS = 100 + 600 = 700\n征税后：\n消费者剩余：\n$$CS′ = (1/2)×(60−52.5)×15 = 56.25\n生产者剩余：\n$$PS′ = (1/2)×[(52.5−2×15−15)+(52.5−15)]×15 = 337.5\n政府税收收入：\n$$T = 15×15 = 225\n社会总福利 = CS′ + PS′ + T = 56.25 + 337.5 + 225 = 618.75\n所以福利的变化量：\n$$(CS′+PS′+T) − (CS+PS) = 618.75 − 700 = −81.25\n**【提示】**边际成本曲线上的点代表的是既定产量下厂商愿意接受的最低支付，所以对于垄断厂商求消费者和生产者剩余也是紧扣定义。对每销售一单位产品向厂商征税15元，其实相当于边际成本增加15，此时边际成本曲线为 MC = 2Q + 15，需要注意此时求生产者剩余与征税前的不同。`},
{id:'m72',special:'微观·垄断均衡与政府干预',qid:'A5 ★★★',question:'一家垄断厂商具有不变的边际成本 C，其面临的市场需求曲线为 D(P)，具有不变的需求弹性2。该厂商追求利润最大化。（1）求该厂商制定的垄断价格。此价格与竞争价格相比，有何差异？（2）如果政府对这个垄断厂商每单位产量征收 t 元的从量税，那么此时价格是多少？与问题（1）中没有税收的情况相比，价格有何变化？如果改为对利润征收税率为 t 的利润税，价格又将如何变化？（3）回到问题1中没有税收的情况。如果政府想使垄断厂商生产社会最优产量，考虑对该厂商的边际成本进行补贴，那么该选择怎样的补贴水平？（中国人民大学考题）',answer:`**考察知识点**：垄断定价、从量税、利润税、补贴。\n**思路**：MR=P(1−1/ed)=MC；从量税增加 MC；利润税不影响 MC；社会最优 P=MC。\n**答案**：（1）Pm=2C，高于竞争价格 C。（2）从量税后 Pm′=2(C+t)；利润税后价格仍 2C。（3）补贴 C/2。\n##**详解**\n（1）垄断厂商利润最大化的条件为 MR = MC，其中：\n$$MR = P(1 − 1/e_d)\n（这里需求价格弹性 e_d 取正值）。\n因此垄断厂商利润最大化时满足：\n$$P(1 − 1/e_d) = MC\n整理可得其定价规则为：\n$$P = MC/(1 − 1/e_d)\n因此这里垄断价格：\n$$P_m = C/(1 − 1/2) = 2C\n在竞争市场下，产品价格等于厂商的边际成本，即竞争价格为：\n$$P_c = MC = C\n可知，垄断价格高于竞争价格，即 P_m > P_c。\n（2）① 若政府对垄断厂商每单位产量征税 t 元。\n垄断厂商的边际成本变为 MC′ = C + t，从而此时的价格为：\n$$P_m′ = (C+t)/(1 − 1/2) = 2(C+t)\n与问题1中相比，价格上升，P_m′ > P_m。\n② 若政府改为征收利润税。\n利润税并不改变垄断厂商的边际成本，边际成本仍为 C，此时厂商的垄断价格：\n$$P_m = C/(1 − 1/2) = 2C\n（3）若政府使垄断厂商生产社会最优产量，则有：\n$$P_m = MC*/(1 − 1/2) = P_c = C\n从而可得：\n$$MC* = (1/2)C\n因此政府应对垄断厂商每一单位产出补贴：\n$$MC − MC* = C − (1/2)C = (1/2)C\n总补贴为 (1/2)CQ*，Q* 为社会最优产量。`},
{id:'m73',special:'微观·垄断均衡与政府干预',qid:'A6 ★★',question:'假设垄断市场有需求函数 Q=(20−P)(1+0.1A−0.01A²)，垄断厂商的成本函数为：TC=10Q+15+A。（1）假设没有广告（A=0）。利润最大化的厂商选择的产出是多少？市场价格是多少？垄断利润是多少？垄断的福利损失是多少？（2）现在假设厂商选择最佳广告支出水平。在此情况下，产出水平为多少？价格是多少？广告水平是多少？此时厂商的利润是多少？',answer:`**考察知识点**：垄断、广告、利润最大化。\n**思路**：分别对 P 和 A 求偏导；联立一阶条件。\n**答案**：（1）Q=5，P=15，π=10；福利损失12.5。（2）P=15，A=3，Q=6.05，π=12.25。\n##**详解**\n（1）当 A = 0 时，社会需求函数为 Q = 20 − P，厂商的成本函数为 TC = 10Q + 15。\n此时垄断厂商的利润最大化问题为：\n$$max π(Q) = (20−Q)Q − (10Q+15)\n由一阶条件可得：\n$$dπ/dQ = 20 − 2Q − 10 = 0\n解得 Q = 5，此时市场价格 P = 15。\n厂商利润：\n$$π = 15×5 − (10×5+15) = 10\n完全竞争条件下均衡结果满足 P = MC，即 20 − Q = 10，解得 Q* = 10，P* = 10。\n因此垄断的福利损失：\n$$(1/2)×(15−10)×(10−5) = 12.5\n（2）此时垄断厂商利润最大化问题为：\n$$max π = PQ − TC = PQ − 10Q − 15 − A = (P−10)(20−P)(1+0.1A−0.01A²) − 15 − A\n利润最大化的一阶条件为：\n$$∂π/∂P = (1+0.1A−0.01A²)(30−2P) = 0\n$$∂π/∂A = (P−10)(20−P)(0.1−0.02A) − 1 = 0\n解得 P = 15，A = 3，产量 Q = 6.05。\n厂商利润 π = 12.25。\n**【提示】**常见的求垄断均衡都是构造利润关于产量的函数，但是需要知道的是，垄断厂商也可以控制价格，所以在反需求函数不好求、从而没办法构造关于产量函数的情况下，也可以将价格作为变量，构造利润关于价格的函数。`},
{id:'m74',special:'微观·垄断均衡与政府干预',qid:'A7 ★★',question:'某垄断厂商以两个工厂的生产来供给这个市场，成本函数分别是 C1=y1²+2y1 和 C2=2y2²。求厂商在两个工厂的最佳产量。（1）求该厂商的总成本函数。（2）如果市场需求函数为 y=8−p，该厂商应该如何安排产量？（3）如果市场需求函数为 y=100/p，该厂商应该如何安排产量？',answer:`**考察知识点**：多工厂垄断、成本函数、需求函数。\n**思路**：等边际成本分配；求总成本；垄断 MR=MC。\n**答案**：（1）C(y)=2y²（y≤1/2）；C(y)=(2y²+4y−1)/3（y>1/2）。（2）y=2，y1=1，y2=1。（3）总收益为常数100，只需成本最小，令工厂2生产极小的 ε>0，工厂1停产。\n##**详解**\n（1）根据两个工厂的成本函数，可得：\n$$MC₁ = 2y₁ + 2，MC₂ = 4y₂\n当 y₁ = 0，y₂ ≤ 1/2 时，MC₁ = 2，而工厂2的边际成本不超过2，故当总产量 y ≤ 1/2 时，厂商将只使用工厂2，此时 y₁ = 0，y₂ = y，总成本为 C(y) = 2y²。\n当总产量 y > 1/2 时，厂商要同时在两个工厂生产，此时产量分配依据边际成本相等原则，即 2y₁ + 2 = 4y₂，从而得到 y₁ = 2y₂ − 1。由于 y₁ + y₂ = y，所以有：\n$$y₁ = (2y−1)/3，y₂ = (y+1)/3\n总成本为：\n$$C(y) = ((2y−1)/3)² + 2·(2y−1)/3 + 2·((y+1)/3)² = (2y² + 4y − 1)/3\n综上，总成本函数为：\n$$C(y) = 2y²，y ≤ 1/2\n$$C(y) = (2y² + 4y − 1)/3，y > 1/2\n（2）① 如果 0 ≤ y ≤ 1/2，由厂商利润最大化的条件 MR = MC 可得 8 − 2y = 4y，解得 y = 4/3（舍去）。\n② 如果 y > 1/2，由 MR = MC 可得：\n$$8 − 2y = (4/3)y + 4/3\n解得 y = 2，此时工厂1的产量 y₁ = 1，工厂2的产量 y₂ = 1。\n（3）根据需求函数，只要厂商的产量 y > 0，厂商总有收益 TR = py = 100，这是与产量无关的一个常数。\n因此厂商要实现利润最大化，只需成本最小即可，而厂商的产量越小其成本也越小，但产量又不能为零，所以厂商只要选取一个非常小但又不为零的产量 ε > 0，按一开始的分析，让工厂2生产这个产量，闲置工厂1。\n**【提示】**本题较为新颖：第一，不仅涉及垄断问题，同时还涉及厂商多工厂分配产量的问题；第二，本题（3）中需求函数非常特殊，由需求函数算得的厂商的总收益为一常数，此时厂商利润最大化问题就转化为厂商成本最小化问题。\n**【提示】**生产者行为理论中求厂商成本函数的两种方法：① 由生产函数求条件要素需求函数，进而求成本函数；② 由一厂商多工厂问题求解成本函数。在求出成本函数后，可以和一系列市场理论中的模型结合进行考察。`},
{id:'m75',special:'微观·垄断行为',qid:'A1 ★★★',question:'假定一个垄断企业以利润最大化为目标，并且不受政府管制。它的成本函数为 C=100−5Q+Q²，它面对两个完全分离的市场，分别是市场A和市场B。市场A的需求弹性是2，市场B的需求弹性是3。请分析两个市场的商品价格应具有什么关系。（中山大学考题）',answer:`**考察知识点**：三级价格歧视、需求弹性与垄断定价。\n**思路**：利润最大化满足 MRA=MRB=MC；由 MR=P(1−1/|ε|) 比较价格。\n**答案**：PA/PB=4/3。\n##**详解**\n该垄断企业的利润为：\n$$π = TR_A(Q_A) + TR_B(Q_B) − TC(Q_A + Q_B)\n分别对 Q_A 和 Q_B 求导，可得该企业的利润最大化一定满足的条件为：\n$$MR_A(Q_A) = MC(Q_A + Q_B)\n$$MR_B(Q_B) = MC(Q_A + Q_B)\n因此均衡时满足：\n$$MR_A(Q_A) = MR_B(Q_B)\n由于：\n$$MR = P(1 − 1/|ε|)\n因此可得：\n$$P_A(1 − 1/|ε_A|) = P_B(1 − 1/|ε_B|)\n由题意知 |ε_A| = 2，|ε_B| = 3，代入上式，即可解得两个市场商品价格的关系为：\n$$P_A/P_B = 4/3`},
{id:'m76',special:'微观·垄断行为',qid:'A2 ★★★',question:'一家服装企业在两个子市场销售生产的相同服装。第一个市场贴畅销品牌（A品牌）；第二个市场贴自营品牌（B品牌）。两个市场对其产品的需求都表现为等弹性需求曲线的特征，分别为：lnQA=320−2lnPA 和 lnQB=260−4lnPB。这家企业当前在A品牌市场定价40元，在B品牌市场定价25元。（1）该企业面对的两个市场，需求的价格弹性分别是多少；（2）通过计算，判断该企业当前的定价是否已经实现了最优；（3）如果该企业的最优定价是在A市场定价30元，那么在B市场应该定价多少元？（中财 801 经济学 2024 年考题）',answer:`**考察知识点**：三级价格歧视、等弹性需求、最优定价条件。\n**思路**：由对数需求求弹性；利润最大化满足 PA(1+1/edA)=PB(1+1/edB)。\n**答案**：（1）edA=−2，edB=−4。（2）最优价格比应为1.5，当前为1.6，未实现最优。（3）PB=20。\n##**详解**\n（1）A 市场需求函数为 ln Q_A = 320 − 2ln P_A，所以需求价格弹性：\n$$e_dA = (dQ_A/Q_A)/(dP_A/P_A) = dln Q_A/dln P_A = −2\nB 市场需求函数为 ln Q_B = 260 − 4ln P_B，所以需求价格弹性：\n$$e_dB = (dQ_B/Q_B)/(dP_B/P_B) = dln Q_B/dln P_B = −4\n（2）根据题意，厂商在两个市场以不同价格销售同一种商品，即厂商进行三级价格歧视。\n三级价格歧视下厂商利润最大化问题为：\n$$max π = TR_A(Q_A) + TR_B(Q_B) − TC(Q_A + Q_B)\n由一阶条件可得：\n$$∂π/∂Q_A = MR_A(Q_A) − MC(Q_A+Q_B) = 0，∂π/∂Q_B = MR_B(Q_B) − MC(Q_A+Q_B) = 0\n所以三级价格歧视下厂商利润最大化时满足条件：\n$$MR_A(Q_A) = MR_B(Q_B) = MC(Q_A+Q_B)\n同时由于：\n$$MR = P(1 + 1/e_d)\n所以三级价格下厂商利润最大化时满足：\n$$P_A(1 + 1/e_dA) = P_B(1 + 1/e_dB)\n由（1）可知 e_dA = −2，e_dB = −4，所以此时价格之比应该满足：\n$$P_A/P_B = (1 + 1/e_dB)/(1 + 1/e_dA) = (1 − 1/4)/(1 − 1/2) = 1.5\n当前价格 P_A = 40，P_B = 25，所以：\n$$P_A/P_B = 40/25 = 1.6 ≠ 1.5\n所以此时定价无效，厂商没有实现最大利润。\n（3）由（2）可知，三级价格歧视下厂商利润最大化时的价格之比满足 P_A/P_B = 1.5。\n所以 P_A = 30，达到有效时，追求利润最大化的厂商应将价格设置为：\n$$P_B = 30/1.5 = 20`},
{id:'m77',special:'微观·垄断行为',qid:'A3 ★★★',question:'某航空公司只有一条航线，同时售票给休闲旅客和商务旅客。休闲旅客的周需求函数为 QT=6000−10P，商务旅客的周需求函数为 QB=1000−P。如果每张票的边际成本为200美元。（1）该航空公司如何设定休闲票和商务票的价格？（2）如果政府强制要求所有票价必须一致，则该航空公司如何定价？两类消费者在该价格上的需求弹性是多少？（3）假设该航空公司每周最多只能售出1300张票，则分别应当给两类消费者售出多少张票，定价多少？',answer:`**考察知识点**：三级价格歧视、统一定价、容量约束。\n**思路**：分别求两市场 MR=MC；统一定价时分段加总需求；容量约束下最大化利润。\n**答案**：（1）PT=400，PB=600。（2）统一定价 P*=4600/11；EdT=23/10，EdB=23/32。（3）QT=1000，QB=300，PT=500，PB=700。\n##**详解**\n（1）当可以实行三级价格歧视时，厂商利润最大化问题为：\n$$max π = P_TQ_T + P_BQ_B − 200(Q_T + Q_B)\n由利润最大化的一阶条件可得：\n$$∂π/∂Q_T = 600 − 0.2Q_T − 200 = 0\n$$∂π/∂Q_B = 1000 − 2Q_B − 200 = 0\n解得 Q_T = 2000，P_T = 400，Q_B = 400，P_B = 600。\n因此，航空公司设定的休闲票和商务票的价格分别是400美元和600美元。\n（2）当航空公司在两个市场上实行统一的价格时。\n当市场价格 0 ≤ P < 600 时，市场总需求函数为：\n$$Q = Q_T + Q_B = 7000 − 11P\n当市场价格 600 ≤ P ≤ 1000 时，整个市场的总需求就为商务旅客的总需求，即 Q = Q_B = 1000 − P。\n则市场总需求函数为分段函数：\n$$Q = 7000 − 11P，0 ≤ P < 600\n$$Q = 1000 − P，600 ≤ P ≤ 1000\n① 当 0 ≤ P < 600，此时航空公司的利润为：\n$$π = PQ − TC = ((7000−Q)/11)Q − 200Q = (4800Q − Q²)/11\n利润最大化的一阶条件为：\n$$dπ/dQ = (4800 − 2Q)/11 = 0\n解得 Q* = 2400。\n代入需求函数，得：\n$$P* = 4600/11（美元）\n代入休闲旅客和商务旅客的周需求函数中得到：\n$$Q_T = 20000/11，Q_B = 6400/11，π₁ = 523636.36\n② 当 600 ≤ P ≤ 1000 时，此时航空公司的利润为：\n$$π = PQ − TC = (1000−Q)Q − 200Q = 800Q − Q²\n利润最大化的一阶条件为：\n$$dπ/dQ = 800 − 2Q = 0\n解得 Q = 400，P = 600，π₂ = 160000。\n比较两种方案的利润可知，厂商会选择第一种方案。\n此时由于两个市场的需求价格弹性不同，应该用点弹性公式 E_d = −(dQ/dP)(P/Q)，将 P*、Q_T、Q_B 代入需求价格弹性的公式可以得到：\n$$E_dT = 23/10，E_dB = 23/32\n**【提示】**这里求的是两类市场各自的需求价格弹性，所以应该代入到它们各自的需求函数中，而不是总的需求函数。\n（3）该航空公司每周最多只能售出1300张票，满足 Q_T + Q_B = 1300，Q_B = 1300 − Q_T，航空公司的利润函数为：\n$$π = TR − TC = P_TQ_T + P_BQ_B − TC\n$$= (600−0.1Q_T)Q_T + (1000−Q_B)Q_B − 200(Q_T + Q_B)\n$$= (600−0.1Q_T)Q_T + (Q_T−300)(1300−Q_T) − 200×1300\n$$= −1.1Q_T² + 2200Q_T − 650000\n利润最大化的一阶条件：\n$$π′ = −2.2Q_T + 2200 = 0\n解得 Q_T = 1000，Q_B = 300，P_T = 500，P_B = 700。\n**【提示】**本题与 2024 年 877（微宏观）一道计算题真题十分相像，只是数字不一样，同时本题也是当年三大本中的题目。`},
{id:'m78',special:'微观·垄断行为',qid:'A4 ★★★',question:'假设一垄断者供应两个分市场，这两个分市场的反需求函数分别为：p1(x1)=1−x1（0<x1<1）；p2(x2)=2(1−x2)（0<x2<1）。垄断者的成本函数为 c(x)=k，这里 x=x1+x2。（1）假设垄断者按照第三级价格歧视的原则分别供应两个市场，那么它在两个市场上的价格和销售量分别为多少？（2）假设该垄断者必须以相同的价格供应这两个市场，那么什么是它的最优价格和最优销售量？（3）谁能从价格歧视中得益？谁会因价格歧视而受损失？（上海财经大学 2008 年考题）',answer:`**考察知识点**：三级价格歧视、统一定价、消费者剩余、福利分析。\n**思路**：价格歧视下 MR1=MR2=MC=0；统一定价时加总需求，分段讨论；比较CS和利润。\n**答案**：（1）x1=0.5，p1=0.5；x2=0.5，p2=1。（2）p=2/3，x=1。（3）垄断厂商得益；总消费者剩余减少，但市场1消费者因价格下降而受益，市场2消费者受损。\n##**详解**\n（1）两个分市场上的边际收益分别为：\n$$MR₁ = 1 − 2x₁，MR₂ = 2 − 4x₂\n根据第三级价格歧视利润最大化均衡条件 MR₁ = MR₂ = MC，即有：\n$$1 − 2x₁ = 2 − 4x₂ = 0\n解得 x₁ = 0.5，x₂ = 0.5。\n将 x₁ = 0.5 和 x₂ = 0.5 代入各自的反需求函数，可得出 p₁ = 0.5，p₂ = 1。\n即假设垄断者按照第三级价格歧视的原则分别供应两个市场，那么它在市场1的定价为0.5，最优销售量为0.5；它在市场2的定价为1，最优销售量为0.5。\n（2）假设该垄断者必须以相同的价格供应这两个市场，则定价 p₁ = p₂ = p。\n根据两个分市场的反需求函数可得出需求函数为 x₁ = 1 − p 和 x₂ = 1 − 0.5p，则两个市场总的需求函数：\n① 当 0 ≤ p < 1 时，x = 2 − 1.5p。\n此时厂商利润最大化问题为：\n$$max π = ((4−2x)/3)x − k\n由利润最大化的一阶条件可得：\n$$dπ/dx = (4−4x)/3 = 0\n解得 x = 1，市场价格 p = 2/3。此时 x₁ = 1/3，x₂ = 2/3，厂商利润 π = 2/3 − k。\n② 当 1 ≤ p ≤ 2 时，x = 1 − 0.5p。\n此时厂商利润最大化问题为：\n$$max π = (2−2x)x − k\n由利润最大化的一阶条件可得：\n$$dπ/dx = 2 − 4x = 0\n解得 x = 0.5，市场价格 p = 1。此时 x₁ = 0，x₂ = 0.5，厂商利润 π′ = 0.5 − k。\n综上，由于 π ≥ π′，因此最优价格 p = 2/3，最优销量 x = 1。\n（3）要判断谁能从价格歧视中得益或受损失，可以借助消费者剩余和生产者利润来进行分析。\n① 在价格歧视下，市场价格 p₁ = 0.5，p₂ = 1，产量 x₁ = 0.5，x₂ = 0.5。此时生产者利润 = p₁x₁ + p₂x₂ − k = 0.75 − k。消费者的消费剩余为图中三角形的面积：市场1的消费者剩余 = (1/2)×(1−1/2)×(1/2) = 1/8；市场2的消费者剩余 = (1/2)×(2−1)×(1/2) = 1/4；总消费者剩余 = 1/8 + 1/4 = 3/8。\n② 在无价格歧视下，价格 p = 2/3，产量 x = 1，其中 x₁ = 1/3，x₂ = 2/3。此时生产者的利润 π = 2/3 − k。然后考虑消费者剩余。\n**【法一】**利用加总后的市场总需求曲线求消费者剩余。两个市场总的需求函数：\n$$x = x₁ + x₂ = 2 − 1.5p，0 ≤ p < 1\n$$x = x₁ + x₂ = 1 − 0.5p，1 ≤ p ≤ 2\n此时总的消费者剩余：\n$$(1/2)×(2−1)×(1/2) + (1/2)×(1/2+1)×(1−2/3) = 0.5\n【此处有图示】\n**【法二】**分别考虑两个市场的消费者剩余。市场1的消费者剩余 = (1/2)×(1−2/3)×(1/3) = 1/18；市场2的消费者剩余 = (1/2)×(2−2/3)×(2/3) = 4/9；总消费者剩余 = 1/18 + 4/9 = 0.5。\n【此处有图示】\n通过比较可发现，在价格歧视下的消费者剩余小于统一定价时的消费者剩余，因此消费者会在价格歧视中受损。但需要注意的是，由于价格歧视时市场1的价格低于统一定价时的价格，市场2价格歧视的价格高于统一定价的价格，因此市场1的消费者因为价格歧视而受益，市场2的消费者受损。\n另外，在价格歧视下，垄断厂商总利润大于无价格歧视下的总利润，因此垄断厂商会在价格歧视中受益。\n**【提示】**本题市面上的答案都是错的，本题给的答案是正确的，需要大家理解正确解法的经济学含义。`},
{id:'m79',special:'微观·垄断行为',qid:'A5 ★★',question:'市场上有A、B两种消费者，各占50%。其中A类的效用函数为：UA=5x−x²/2+y，B类的效用函数为：UB=6x−x²/2+y。垄断厂商的成本函数为 C(x)=x。其中 x 为垄断厂商生产的产品，y 为其它商品组合，价格为1。（1）求有A、B两类人各自对 x 的需求函数；（2）若垄断厂商在A、B中选一种消费者出售商品，那么你认为应该选择哪类消费者？若垄断厂商采用两部分定价制，问边际价格和一次性付费是多少？（3）若同时在A、B中出售，并且采用两部分定价制，问厂商的边际价格和一次性付费各为多少时，厂商能够实现利润最大化？',answer:`**考察知识点**：两部分定价、需求函数、利润最大化。\n**思路**：由效用最大化求需求；比较仅服务一类消费者的利润；两部分定价时边际价格等于MC，固定费等于消费者剩余。\n**答案**：（1）xA=5−p，xB=6−p。（2）选择B类；边际价格 p=1，一次性付费12.5。（3）边际价格1.5，一次性付费6.125。\n##**详解**\n（1）对 A 类人，效用最大化问题为：\n$$max 5x − x²/2 + y，s.t. px + y = m\n拉格朗日函数为 L = 5x − x²/2 + y − λ(px + y − m)。一阶条件为：\n$$∂L/∂x = 5 − x − λp = 0，∂L/∂y = 1 − λ = 0，∂L/∂λ = m − px − y = 0\n可得 x_A = 5 − p，这就是 A 类人对 x 的需求函数。同样的方法可求得 B 类人对 x 的需求函数为：\n$$x_B = 6 − p\n（2）假设 A 类和 B 类消费者人数均为 n，则 A 市场的需求函数为 X_A = n(5−p)，B 市场的需求函数为 X_B = n(6−p)。\n若选 A 类消费者，则厂商利润函数为：\n$$π_A = (5 − X_A/n)X_A − X_A\n利润最大化的一阶条件为：\n$$dπ_A/dX_A = 5 − 2X_A/n − 1 = 0\n解得 X_A* = 2n，π_A* = 4n。\n若选 B 类消费者，则厂商利润函数为：\n$$π_B = (6 − X_B/n)X_B − X_B\n利润最大化的一阶条件为：\n$$dπ_B/dX_B = 6 − 2X_B/n − 1 = 0\n解得 X_B* = 2.5n，π_B* = 6.25n。\n因为 π_B* > π_A*，所以厂商选择在 B 类消费者中垄断销售。\n若在 B 类消费者中采用二部定价，则 p = MC = 1，一次性付费等于每个消费者的消费者剩余，其大小为：\n$$(1/2)×(6−1)×5 = 12.5\n（3）若在 A、B 中同时出售，设边际价格为 p，如果两种消费者都进行购买，则有 1 ≤ p ≤ 5。此时每个 A 类消费者的剩余为 (1/2)(5−p)²，每个 B 类消费者的剩余为 (1/2)(6−p)²。\n由于 (1/2)(6−p)² > (1/2)(5−p)²，所以一次性付费为：\n$$F = (1/2)(5−p)²\n此时厂商的总利润为：\n$$π = 2nF + n(p−1)(5−p) + n(p−1)(6−p) = n(−p² + 3p + 14)\n利润最大化的一阶条件为：\n$$dπ/dp = −2p + 3 = 0\n解得 p = 1.5。当 p = 1.5 时，厂商得到最大利润 π = 16.25n。此时固定价格为：\n$$F = (1/2)(5−p)² = (1/2)×(5−1.5)² = 6.125\n所以，厂商的边际价格为1.5，固定价格为6.125时，能获得最大利润。`},
{id:'m80',special:'微观·垄断行为',qid:'B1 ★★★',question:'一家垄断厂商在市场1和市场2销售产品，两个市场的需求曲线为：Q1=60−0.25P1，Q2=100−0.5P2，厂商提供 Q 单位产品的成本为：C=1000+40Q，其中 Q=Q1+Q2。（1）市场1和市场2利润最大化价格和数量各是多少？（2）厂商只能定单一的价格时它会定什么价格，以及它在市场1和市场2的销量分别为多少？（3）在上面哪种情况下厂商是得益的？从消费者剩余的角度，市场1的消费者更偏爱哪种情况？市场2的消费者更偏爱哪种情况？为什么？',answer:`**考察知识点**：三级价格歧视、统一定价、消费者剩余。\n**思路**：价格歧视下 MR1=MR2=MC；统一定价加总需求；比较利润和CS。\n**答案**：（1）P1=140，Q1=25；P2=120，Q2=40。（2）P=126.67，Q1=28.3，Q2=36.7。（3）价格歧视下厂商利润更高；市场1消费者偏爱统一定价，市场2消费者偏爱价格歧视。\n##**详解**\n（1）当厂商可以实行三级价格歧视时，厂商利润最大化问题为：\n$$max π = (240−4Q₁)Q₁ + (200−2Q₂)Q₂ − [1000 + 40(Q₁+Q₂)]\n由利润最大化的一阶条件可得：\n$$∂π/∂Q₁ = 240 − 8Q₁ − 40 = 0，∂π/∂Q₂ = 200 − 4Q₂ − 40 = 0\n解得 Q₁ = 25，Q₂ = 40，P₁ = 140，P₂ = 120。故市场1和市场2的利润最大化价格和数量分别是140、25和120、40。\n（2）厂商只能实行统一定价时，两个市场总的需求函数为：\n$$Q = 160 − 0.75P，0 ≤ P ≤ 200\n$$Q = 60 − 0.25P，200 < P ≤ 240\n① 当 0 ≤ P ≤ 200 时，厂商利润最大化问题为：\n$$max π = (4/3)(160−Q)Q − (1000 + 40Q)\n由利润最大化的一阶条件得：\n$$∂π/∂Q = (4/3)(160−2Q) − 40 = 0\n解得 Q = 65，P = 126.67，此时 Q₁ = 28.3，Q₂ = 36.7。\n② 当 200 < P ≤ 240 时，厂商利润最大化问题为：\n$$max π = (240−4Q)Q − (1000 + 40Q)\n由利润最大化的一阶条件得：\n$$∂π/∂Q = 240 − 8Q − 40 = 0\n解得 Q = 25，P = 140（舍去）。\n综上，实行统一定价时，市场价格为 P = 126.67，两个市场的销量 Q₁ = 28.3，Q₂ = 36.7。\n（3）① 在（1）中，厂商利润为：\n$$π = P₁Q₁ + P₂Q₂ − [1000 + 40(Q₁+Q₂)] = 140×25 + 120×40 − [1000 + 40×(25+40)] = 4700\n在（2）中，厂商利润为：\n$$π′ = PQ − (1000 + 40Q) = 126.67×65 − (1000 + 40×65) = 4633.55\nπ > π′，因此对于厂商来说情况（1）更好。\n② 在（1）中，两个市场消费者剩余分别为：\n$$CS₁ = 0.5×(240−140)×25 = 1250，CS₂ = 0.5×(200−120)×40 = 1600\n在（2）中，两个市场消费者剩余分别为：\n$$CS₁′ = 0.5×(240−126.67)×28.3 = 1603.62，CS₂′ = 0.5×(200−126.67)×36.7 = 1345.61\n因此，市场1的消费者更偏爱统一定价（价格更低），市场2的消费者更偏爱价格歧视（价格更低）。\n**【提示】**市面上垄断厂商三级价格歧视和统一定价的题目有很多，但是很少涉及不同定价两种情况下消费者剩余的计算方法。`},
{id:'m81',special:'微观·垄断行为',qid:'B2 ★★',question:'某垄断厂商生产产品X的边际成本和平均成本均为常数 c，所生产的X产品在两个分割的市场上销售，这两个市场的需求函数分别是 P1=a1−bq1 和 P2=a2−bq2，其中，a1>a2>c>0，且 3a2>a1+2c。证明：（1）该厂商无论实行三级价格歧视还是统一定价，总产量水平相同。（2）若统一定价时的价格为 P，三级价格歧视时两个市场的价格分别为 P1 和 P2，则 P1>P>P2。（对外经贸 2016 年考题）',answer:`**考察知识点**：三级价格歧视与统一定价的产量/价格比较。\n**思路**：分别求三级价格歧视和统一定价下的均衡产量与价格；比较总产量和价格。\n**答案**：证明略；结论成立。\n##**详解**\n（1）① 三级价格歧视时，厂商利润最大化问题为：\n$$max π = (a₁−bq₁)q₁ + (a₂−bq₂)q₂ − c(q₁+q₂)\n利润最大化的一阶条件为：\n$$∂π/∂q₁ = a₁ − 2bq₁ − c = 0，∂π/∂q₂ = a₂ − 2bq₂ − c = 0\n解得：\n$$q₁ = (a₁−c)/(2b)，q₂ = (a₂−c)/(2b)\n总产量：\n$$Q = q₁ + q₂ = (a₁+a₂−2c)/(2b)\n② 统一定价。由于 a₁ > a₂，所以市场总需求函数为：\n$$Q = (a₁+a₂−2P)/b，0 ≤ P ≤ a₂\n$$Q = (a₁−P)/b，a₂ < P ≤ a₁\n当 0 ≤ P ≤ a₂ 时，由利润最大化的一阶条件 MR = MC 可得：\n$$(1/2)(a₁+a₂) − bQ = c\n解得市场均衡产量：\n$$Q = (a₁+a₂−2c)/(2b)\n此时市场价格：\n$$P = (a₁+a₂+2c)/4\n由于 3a₂ > a₁ + 2c，所以此时 P = (a₁+a₂+2c)/4 < a₂，符合条件。\n当 a₂ < P ≤ a₁ 时，由 MR = MC 可得 a₁ − 2bQ = c，解得市场均衡产量：\n$$Q = (a₁−c)/(2b)\n此时市场价格 P = (a₁+c)/2。\n此时需要进一步分类讨论：\n在两个市场都有销量时，P = (a₁+a₂+2c)/4，此时利润：\n$$π = (a₁+a₂−2c)²/(8b)\n只在市场1有销量时，P = (a₁+c)/2，此时利润：\n$$π′ = (a₁−c)²/(4b)\n两式相减：\n$$π − π′ = [(a₁−c)² + (a₂−c)² + 2(a₁−c)(a₂−c) − 2(a₁−c)²]/(8b)\n$$= [(a₂−c)² + 2(a₁−c)(a₂−c) − (a₁−c)²]/(8b)\n$$= [(a₂−c)² + (a₁−c)(2a₂−a₁−c)]/(8b)\n$$> [(a₂−c) + (2a₂−a₁−c)]/[8b(a₂−c)]\n$$= (3a₂−a₁−2c)/[8b(a₂−c)] > 0\n所以应该同时在两个市场出售。\n综上，三级价格歧视时的总产量与统一定价时的总产量相等，均为 (a₁+a₂−2c)/(2b)。\n（2）由（1）可知，实施三级价格歧视时，两个市场的产量 q₁ = (a₁−c)/(2b)，q₂ = (a₂−c)/(2b)，所以此时两个市场的价格 P₁ = (a₁+c)/2，P₂ = (a₂+c)/2，而统一定价时市场价格 P = (a₁+a₂+2c)/4。\n由于 a₁ > a₂ > c > 0，所以 P₁ > P₂。并且：\n$$P = (a₁+a₂+2c)/4 < (2a₁+2c)/4 = (a₁+c)/2 = P₁\n$$P = (a₁+a₂+2c)/4 > (2a₂+2c)/4 = (a₂+c)/2 = P₂\n综上，P₁ > P > P₂。\n**【提示1】**统一定价时加总需求曲线需要分段考虑，求解厂商利润最大化的解也需要分段考虑，否则可能求出来的解在对应价格区间没有销量或者遗漏解。\n**【提示2】**2023年880（微宏观）的卷子也考到了三级价格歧视和统一定价，但是题目不像本题这样明确说是求什么情况下的均衡结果，而是给出此时的一些条件，让大家自己判断厂商的定价方式，以此来增加题目的难度。因此大家在平时做此类题目的时候也要留意不同价格歧视的前提条件，会根据题意判断出来此时应该是哪种定价方式。`},
{id:'m82',special:'微观·垄断行为',qid:'B3 ★★',question:'A、B两种人，各有N人，A的效用函数为：UA(x1,x2)=4x1−x1²+x2，B的效用函数为：UB(x1,x2)=2x1−x1²+x2，商品 x2 的价格为1，A和B两组人的收入都为200，现有一垄断厂商，且该厂商不能实行价格歧视，其生产 x1 的边际成本 c>0，求该厂商的最优价格及产量。',answer:`**考察知识点**：统一定价、市场需求加总、分段讨论。\n**思路**：由效用最大化求两类消费者各自的需求，水平加总得到市场需求；由于低价格段两类人都买、高价格段只有 A 类人买，必须分段用 MR = MC 求最优，再比较两段利润大小。\n**答案**：当 0 < c < 2−√2 时，p* = (3+c)/2，X* = N(3−c)/2；当 2−√2 ≤ c ≤ 4 时，p* = (4+c)/2，X* = N(4−c)/4。\n##**详解**\n（1）先求两类消费者各自的需求函数。\nA 类：max 4x₁ − x₁² + x₂，s.t. p₁x₁ + x₂ = 200。\n把约束代入消去 x₂，问题化为：\n$$max 4x₁ − x₁² + 200 − p₁x₁\n一阶条件为：\n$$4 − 2x₁ − p₁ = 0 ⟹ p₁ = 4 − 2x₁^A\n即 A 类的反需求函数为 p₁ = 4 − 2x₁^A，需求函数为 x₁^A = 2 − p₁/2（p₁ ≤ 4）。\nB 类同理，把 4 换成 2：\n$$p₁ = 2 − 2x₁^B，x₁^B = 1 − p₁/2\n注意 A 类在 p₁ ≤ 4 时就有需求，B 类要到 p₁ ≤ 2 才有需求——这个差别是后面分段的原因。\n（2）垄断厂商不能实行价格歧视，只能统一定价，市场需求是两类人需求的水平加总（各有 N 人）：\n$$X₁ = N(2 − p₁/2) + N(1 − p₁/2) = N(3 − p₁)，0 ≤ p₁ ≤ 2\n$$X₁ = N(2 − p₁/2)，2 < p₁ ≤ 4\n（3）分段求利润最大化。\n① 当 0 ≤ p₁ ≤ 2 时，反需求为 p₁ = 3 − X₁/N。\n$$TR = 3X₁ − X₁²/N，MR = 3 − 2X₁/N\n由 MR = MC 得：\n$$3 − 2X₁/N = c ⟹ X₁ = N(3−c)/2，p₁ = (3+c)/2\n$$π₁ = (p₁ − c)X₁ = N(3−c)²/4\n此段要求 0 ≤ (3+c)/2 ≤ 2，即 0 < c ≤ 1。\n② 当 2 < p₁ ≤ 4 时，反需求为 p₁ = 4 − 2X₁/N。\n$$TR = 4X₁ − 2X₁²/N，MR = 4 − 4X₁/N\n由 MR = MC 得：\n$$4 − 4X₁/N = c ⟹ X₁′ = N(4−c)/4，p₁′ = (4+c)/2\n$$π₁′ = (p₁′ − c)X₁′ = N(4−c)²/8\n此段要求 2 < (4+c)/2 ≤ 4，即 0 < c ≤ 4。\n（4）比较两段利润，确定哪一段最优。\n$$π₁ − π₁′ 的符号由 2(3−c)² − (4−c)² = c² − 4c + 2 决定\n$$c² − 4c + 2 = 0 ⟹ c = 2 ± √2\n在 0 < c ≤ 1 的范围内只有 c < 2 − √2（≈0.586）时才有 π₁ > π₁′，此时低价段通吃两类人更划算。\n（5）结论。\n① 若 0 < c < 2 − √2：\n$$p₁* = (3+c)/2，X₁* = N(3−c)/2，π* = N(3−c)²/4\n② 若 2 − √2 ≤ c ≤ 1：两段利润已持平或第二段更优，\n$$p₁* = (4+c)/2，X₁* = N(4−c)/4，π* = N(4−c)²/8\n③ 若 1 < c ≤ 4：第一段价格上界已不可行，只能是\n$$p₁* = (4+c)/2，X₁* = N(4−c)/4，π* = N(4−c)²/8\n②③ 合并起来就是：只要 c ≥ 2 − √2，最优解都是 p* = (4+c)/2、X* = N(4−c)/4。\n**【提示】**结论的经济含义：c 较低时厂商把价格压到 2 以下，两类人通吃；c 一旦超过 2 − √2，厂商宁可把价格抬到 2 以上，主动放弃 B 类人，只做 A 类的生意。定价区间从"两类人市场"跳到"只服务高支付意愿人群"，是统一定价下市场加总出现折点带来的结果。\n**【注】**若 c ≥ 4，则 (4+c)/2 ≥ 4，已超出 A 类人愿付的价格上限，需求量降为 0，厂商干脆不生产。`},
{id:'m83',special:'微观·垄断竞争市场',qid:'A1 ★★',question:'考虑一个 n 个企业的垄断竞争市场。每个企业面对的逆需求函数是：p=200/n−0.1q，其中 p 和 q 分别是企业产品的价格和产量。每个企业的成本函数是：C=160+2q。求：（1）在短期均衡里，每个企业所设立的价格和 n 之间的关系是什么？（2）在长期均衡里，市场里有多少个企业（即 n 是多大）？每个企业有垄断力吗？为什么？',answer:`**考察知识点**：垄断竞争、短期均衡、长期均衡、垄断力。\n**思路**：短期 MR=MC；长期零利润。\n**答案**：（1）p=1+100/n。（2）n=20，p=6；价格高于边际成本，有垄断力。
##**详解**
（1）短期内，企业的利润最大化问题为：max (200/n−0.1q)q−160−2q。利润最大化的一阶条件为：∂π/∂q=200/n−0.2q−2=0。解得厂商产量 q=1000/n−10，市场价格 p=1+100/n。
（2）达到长期均衡时，单个企业的利润为零，由（1）可知这就意味着：
$$π=(1+100/n)(1000/n−10)−160−2(1000/n−10)=0
解得 n=20，此时产品的价格为 p=6，由于单个产品的价格高于其边际成本，所以企业有垄断力。`},
{id:'m84',special:'微观·垄断竞争市场',qid:'B1 ★',question:'（产品异化模型）在大西洋城，有一条沿海滩修建的海滨大道，其长度设为1。两个小贩打算在海滨大道上出售冰淇淋。假定冰淇淋的价格是确定的，并且消费者是沿海滩均匀分布的。消费者的效用取决于购买冰淇淋的路程，路程越长，消费者的效用越低，即消费者的效用函数可以表示为：u(x)=−x，这里 x 是消费者购买冰淇淋的路程。那么从社会最优的角度看：（1）两个小贩各自应该在什么地方出售冰淇淋？（2）实际上会出现第一问的结果吗？（3）如果有三个小贩，对第二问的回答有什么变化？',answer:`**考察知识点**：产品差异化、霍特林模型、社会最优与均衡。\n**思路**：社会最优使总路程最小；实际均衡小贩向中间聚集。\n**答案**：（1）分别在1/4和3/4处。（2）不会，实际会在中央。（3）不存在均衡位置。
##**详解**
（1）社会最优的位置应当是小贩1待在大道的 (1/4) 处，小贩2待在大道的 (3/4) 处。分析如下：
假设小贩1的位置是 x₁，小贩2的位置是 x₂，且 x₂>x₁，由于位于小贩1左侧的消费者都会去小贩1那里购买，位于小贩2右侧的消费者都会去小贩2那里购买，在小贩1和2之间的消费者，选择离自己近的销售者，如下图所示。
【此处有图示】
所以加总的社会福利就是：
$$−∫_0^(x₁)t dt−∫_0^(1−x₂)t dt−2∫_0^((x₂−x₁)/2)t dt =−(1/2)x₁^2−(1/2)(1−x₂)²−(1/4)(x₂−x₁)²
对上式关于 x₁ 和 x₂ 求导，并令导数为零，就有：
$$−x₁+(1/2)(x₂−x₁)=0, 1−x₂−(1/2)(x₂−x₁)=1
解得：x₁=1/4，x₂=3/4。
（2）实际上最终的结果是两个小贩都位于大道的中央。这是因为：给定小贩2的位置不动，如果小贩1向右移动一点：他就会夺走小贩2的一些顾客，而不会失去原先的任何顾客。向右移动，对于1左边的所有顾客来说，1仍然是距离他们最近的小贩，但1此时却更接近他右边的顾客。因此，1的市场份额和利润都将增加。
但小贩2也可以进行相同的推理——向左移动，他也可以在不减少原有顾客的前提下，夺走另一个小贩的一些顾客。这表明，这种社会最优的区位模式不是一个均衡。惟一的均衡是两个小贩都在大道的中间叫卖。这种情况下，对顾客的争夺导致了低效率的区位模式。
（3）此时不存在均衡位置。
如下图所示。如果海滨大道上有3个小贩，那么，必定有其中一个位于另两个的中间，那么外围的两个小贩移向中间的小贩是有利可图的，因为这样做，他们可以在不损失原有顾客的情况下，夺走一部分顾客。但如果这两个小贩太靠近中间的小贩，那么，中间的小贩迅速跳到右边小贩的右方或左边小贩的左方去抢占市场就是值得的。无论采用哪种区位模式，保持移动总是有利可图的。
【此处有图示】\n**【提示】**通过本题加深对范里安产品差异化模型的理解。`},
{id:'m85',special:'微观·寡头垄断市场',qid:'A1 ★★★',question:'两家公司生产同一商品，需求函数为 p=80−Q，商品的边际成本为常数20，没有固定成本，在给定市场需求和边际成本情况下，确定商品产量。（1）如果两个公司为古诺垄断厂商，共同确定产量，问两个公司的产量分别是多少？价格分别为多少？利润分别为多少？（2）如果一公司先决定产量，二公司根据一公司产量来确定其产量，问两个公司的产量分别是多少？价格分别为多少？利润分别为多少？（3）如果两个公司形成卡特尔，请问市场供求和价格是多少？两家公司间如何分配产量？利润分别为多少？并说明企业的违约动机。（4）上述（1）中结果是否为囚徒困境？为什么？',answer:`**考察知识点**：古诺、斯塔克尔伯格、卡特尔、囚徒困境。\n**思路**：分别求反应函数、均衡产量、价格和利润；比较合作与不合作。\n**答案**：（1）QA=QB=20，p=40，πA=πB=400。（2）QA=30，QB=15，p=35，πA=450，πB=225。（3）Q=30，p=50，πA=πB=450；有违约动机，违约可增至506.25。（4）是囚徒困境。
**【分析】**寡头模型中的基础题，重点是掌握答题步骤，平时应多加练习。
##**详解**
（1）设两公司分别为A和B。对于A来说，其利润最大化问题为：max π_A=[80−(Q_A+Q_B)]Q_A−20Q_A。由一阶条件可得：∂π_A/∂Q_A=80−2Q_A−Q_B−20=0。整理得公司A的反应函数为：Q_A=(60−Q_B)/2。同理可得公司B的反应函数为：Q_B=(60−Q_A)/2。联立A、B两公司的反应函数，可以解得古诺均衡的产量：Q_A=Q_B=20。代入到市场反需求函数，可得市场均衡价格 p=40，代入到利润函数得两公司的利润为400。
（2）假定公司A是产量领导者，同时由（1）可知公司B的反应函数为 Q_B=(60−Q_A)/2。此时公司A的利润最大化问题为：max π_A=[80−(Q_A+(60−Q_A)/2)]Q_A−20Q_A。由一阶条件可得：(dπ_A)/(dQ_A)=50−Q_A−20=0，解得 Q_A=30。代入公司B的反应函数得公司B的产量 Q_B=15。将这两个产量代入到需求函数中得产品价格：p=80−(30+15)=35。利润分别是：π_A=(35−20)×30=450，π_B=(35−20)×15=225。
（3）如果两个公司形成卡特尔即形成了垄断，此时卡特尔组织的利润最大化问题为：
$$max π=(80−Q)Q−20Q
根据利润最大化的一阶条件得：dπ/dQ=80−2Q−20=0，解得总产量 Q=30。两个公司平分产量，此时每个公司的产量 Q_A=Q_B=15。商品价格为 p=80−30=50，各自获得的利润为 π_A=π_B=(50−20)×15=450。
下面说明卡特尔成员的违约动机：假设厂商B产量保持不变。
**【法一】**利用利润最大化问题。此时厂商A利润最大化问题为：max π_A=[80−(Q_A+15)]Q_A−20Q_A。由一阶条件可得：(dπ_A)/(dQ_A)=65−2Q_A−20=0，解得 Q_A=22.5。此时市场价格 P=42.5，厂商A的利润 π_A=506.25>450，所以厂商A有违约动机。
**【法二】**利用反应函数。由（1）可知，A的反应函数为 Q_A=(60−Q_B)/2，所以B产量为15的情形下，厂商A利润最大化的产量为 Q_A=22.5，市场价格 P=42.5，厂商A的利润 π_A=506.25>450，所以厂商A有违约动机。
（4）由（1）可知，进行古诺竞争（不合作）时，厂商的利润 π_A=π_B=400。由（3）可知，结合卡特尔（合作）时，厂商的利润 π_A=π_B=450。两厂商合作的利润大于古诺竞争下的利润，因此古诺均衡是囚徒困境。`},
{id:'m86',special:'微观·寡头垄断市场',qid:'A2 ★★★',question:'考虑一个新开发的市场，该市场每年的需求为 Q=10−p。在第一期企业1抢先进入，并以广告的方式进行大量宣传。在它正要进行生产时得知企业2正在订购生产此产品的设备，并通过调查得知企业2的成本函数为 C2(Q2)=Q2²。已知企业1的成本函数为 C1(Q1)=4+2Q1。（1）在第一期，如果厂商1可以抢先宣布生产计划，那么厂商1将宣布什么样的生产计划，这时厂商2会宣布生产多少？（2）在第一期，如果厂商1可以抢先宣布价格，求该价格水平？（3）在第二期期初，出于行业的惯例，两厂商同时发布产量，这时你预计产量会有变化吗？',answer:`**考察知识点**：斯塔克尔伯格、价格领导、古诺。\n**思路**：分别按产量领导、价格领导、古诺求解。\n**答案**：（1）Q1=11/3，Q2=19/12。（2）p=13/3。（3）会变化；古诺均衡 Q1=22/7，Q2=12/7。
##**详解**
（1）这是一个斯塔克尔伯格模型，其中厂商1是领导者，厂商2是追随者。给定厂商1的产量 Q₁，厂商2的利润最大化问题为：max π₂=[10−(Q₁+Q₂)]Q₂−Q₂^2。由一阶条件可得厂商2的反应函数为：Q₂=(10−Q₁)/4。此时厂商1的利润最大化问题为：max π₁=[10−(Q₁+(10−Q₁)/4)]Q₁−(4+2Q₁)。由利润最大化的一阶条件可得：(dπ₁)/(dQ₁)=7.5−(3/2)Q₁−2=0。解得厂商1的产量为：Q₁=11/3，把它代入厂商2的反应函数，得到厂商2的产量 Q₂=19/12。
（2）此时是价格领导模型，厂商1是价格领导者，假设厂商1宣布的价格为 p。厂商2的利润最大化问题为：max π₂=pQ₂−Q₂^2。由一阶条件可得厂商2的供给函数为：Q₂=p/2。厂商1面临的剩余需求函数为 Q₁=Q−Q₂=10−(3/2)p。此时厂商的利润最大化问题为：max π₁=(20/3−(2/3)Q₁)Q₁−(4+2Q₁)。由利润最大化的一阶条件可得：(dπ₁)/(dQ₁)=20/3−(4/3)Q₁−2=0。解得厂商1的产量为：Q₁=7/2。将其代入厂商1面临的剩余需求曲线可得厂商1抢先宣布的价格应为 p=13/3。
（3）这是一个古诺竞争模型，给定厂商2的产量 Q₂，厂商1的利润最大化问题为：max π₁=[10−(Q₁+Q₂)]Q₁−(4+2Q₁)。由一阶条件得到厂商1的反应函数为：Q₁=(8−Q₂)/2。由（1）可知，厂商2的反应函数为：Q₂=(10−Q₁)/4。联立两个厂商的反应函数可以解得古诺均衡产量为：Q₁=22/7，Q₂=12/7。`},
{id:'m87',special:'微观·寡头垄断市场',qid:'A3 ★★★',question:'某企业的生产函数 F(l,k)=l^0.2 k^0.8，l 和 k 分别表示劳动和资本的数量，劳动和资本的价格为 w=4，r=16。（1）用拉格朗日乘数法，求生产 q 单位的商品的条件要素需求函数。（2）生产 q 单位商品时成本为多少？（3）如果厂商是价格领导者，市场需求为 Q=100−2p，市场上有4个追随者，追随者的成本函数为 cf=4qf+qf²，给定市场需求函数，求追随者和领导者的利润。（上财 2019 年考题）',answer:`**考察知识点**：条件要素需求、成本函数、价格领导。\n**思路**：拉格朗日求条件要素需求；求成本函数；追随者按 P=MC 供给，领导者面临剩余需求。\n**答案**：（1）l*=q，k*=q。（2）C=20q。（3）领导者利润49，追随者利润95.06。
##**详解**
（1）条件要素需求函数是指：给定产量 y，实现成本最小化时，厂商对要素的需求量，此时厂商面临的问题为：min 4l+16k，s.t. l^(0.2)k^(0.8)=q。构建拉格朗日生产函数 L=4l+16k−λ(l^(0.2)k^(0.8)−q)，并由一阶条件可得：
$$∂L/∂l=4−0.2λ l^(−0.8)k^(0.8)=0
$$∂L/∂k=16−0.8λ l^(0.2)k^(−0.2)=0
$$∂L/∂λ=q−l^(0.2)k^(0.8)=0
解得：l^*=q，k^*=q，即为条件要素需求函数。
（2）把得到的条件要素需求函数带入到成本的定义式中得到成本函数：C=4l^*+16k^*=20q。
每个追随者厂商的边际成本为 MC_f=4+2q_f，给定领导厂商的价格 p，追随厂商利润最大化应满足 p=MC_f=4+2q_f，所以单个追随厂商的供给函数为 q_f=0.5p−2。领导厂商面临的剩余需求为：q=D−4q_f=108−4p，解得：p=(108−q)/4。领导厂商的利润函数为：π=(108−q)/4q−20q。领导厂商利润最大化时有：
$$dπ/dq=(108−2q)/4−20=0
解得 q=14，此时价格 p=(108−14)/4=23.5，q_f=0.5p−2=9.75。领导者和追随者的利润分别为：π_q=49，π_f=95.06。\n**【提示】**2025 年 847（微宏观）考到价格领导模型的计算题。`},
{id:'m88',special:'微观·寡头垄断市场',qid:'A4 ★★★',question:'市场中 N 个同质产品的古诺厂商。厂商的成本为 TCi(qi)=cqi，c>0，i=1,2,…,N。市场需求曲线为 P=a−bQ=a−b∑qi，P 为产品价格，参数 a,b>0，a>c。（1）给出厂商i利润最大化的一阶条件；（2）给出古诺纳什均衡结果，包括每个厂商的均衡产量、市场的总产量、市场的价格；（3）证明 N 趋近于无穷大时，此时古诺博弈的结果趋近于完全竞争结果。',answer:`**考察知识点**：古诺均衡、N厂商、完全竞争极限。\n**思路**：求一阶条件；对称均衡；取极限。\n**答案**：（1）a−bQ−bqi−c=0。（2）qi=(a−c)/[(N+1)b]，Q=N(a−c)/[(N+1)b]，P=(a+Nc)/(N+1)。（3）lim P=c，lim Q=(a−c)/b，与完全竞争一致。
##**详解**
（1）由题意知，厂商i的利润最大化问题为：max π_i=[a−b(Σ_(j=1)^N q_j)]q_i−cq_i。利润最大化的一阶条件为：∂π_i/∂q_i=a−b(Σ_(j=1)^N q_j)−bq_i−c=0。整理可得：q_i=(a−c−bQ)/b。
（2）由于 N 个厂商同质，所以每个厂商的利润最大化的一阶条件都相同，每个厂商古诺均衡时的产量相同。由（1）的结果可得：
$$q₁=q₂=…=q_N=(a−c−bQ)/b=(a−c−bNq₁)/b
解得各厂商均衡产量：
$$q₁=q₂=…=q_N=(a−c)/((N+1)b)
由此可知：市场的总产量
$$Q=Nq₁=(N(a−c))/((N+1)b)
市场价格
$$P=a−bQ=a−b(N(a−c))/((N+1)b)=(a+Nc)/(N+1)
当 N 趋于无穷大时，市场产量与市场价格分别为：
$$lim_(N→∞)P=lim_(N→∞)(a+Nc)/(N+1)=c
$$lim_(N→∞)Q=lim_(N→∞)(N(a−c))/((N+1)b)=(a−c)/b
（3）在完全竞争下，每个厂商都是市场价格的接受者，自己的产量决策也不影响市场价格。完全竞争均衡时，因为每个厂商的边际成本相同，都为 MC=c，所以最终竞争市场均衡时，市场价格为 P=c，从而由市场需求函数得市场产量为 Q=(a−c)/b，这与古诺情况下 N 趋于无穷大时的结果一致，所以 N 趋于无穷大时，古诺博弈的结果趋近于完全竞争市场的结果。`},
{id:'m89',special:'微观·寡头垄断市场',qid:'A5 ★★★',question:'假设企业A和B生产同种商品，消费者无法区分两个企业的产品。企业A的生产边际成本为10，企业B的生产边际成本为8。他们的固定成本均为0。市场需求函数为 QD=500−20P。（1）如果企业A和企业B进行伯特兰竞争，那么纳什均衡条件下的市场价格是多少？（2）每个企业的利润分别为多少？（3）该均衡是否为帕累托有效？（中央财经大学考题）',answer:`**考察知识点**：伯特兰竞争、边际成本差异、帕累托效率。\n**思路**：低成本企业定价略低于高成本企业边际成本；比较价格与边际成本。\n**答案**：（1）PA=10，PB=10−ε。（2）πA=0，πB=(2−ε)(500−20(10−ε))。（3）不是帕累托有效。
**【分析】**厂商寡头垄断四种类型（产量领导、价格领导、联合定产、联合定价）的计算题必须掌握。题型可以多种多样，但计算的模式流程都是一定的。此题的伯特兰竞争属于价格竞争模型。此题为平新乔《微观经济学十八讲》第十讲“策略性博弈与纳什均衡”课后习题第一题原题。
##**详解**
（1）当两个边际成本为常数（且不存在固定成本）但边际成本不相同的企业进行伯特兰竞争时，边际成本更低的企业将获得所有市场份额。本题中企业B边际成本更低，因此企业B将定一个比企业A边际成本10更低的价格，从而获得所有市场份额。下面讨论企业B如何定价：
如果企业B按照垄断情形进行定价，此时利润最大化的条件为 MR=MC，即 25−0.1Q=8，解得产量为 Q=170，此时垄断价格 P=16.5>10，因此企业B不能将价格定为垄断价格。
所以，此时企业B将按照略低于企业A的边际成本进行定价，即企业B定价略低于10，从而获取整个市场份额。因此，P_A=10，P_B=10−ε，ε→0^+ 且 0<ε<2。
（2）根据（1）知，企业B获取整个市场份额，从而获得全部的利润。企业A退出市场，因此利润为0。企业B利润为：
$$π_B=pq−c_Bq=(p−c_B)q=(2−ε)[500−20×(10−ε)]
（3）这个结果不是帕累托有效的。因为厂商B的产品的价格高于它的边际成本，所以如果厂商B和消费者可以为额外1单位的产品协商一个介于8到 10−ε 之间的价格，那么厂商B的利润和消费者的剩余就都可以得到提高，同时又不损害厂商A的剩余（因为A的利润还是零）。`},
{id:'m90',special:'微观·寡头垄断市场',qid:'A6 ★★',question:'某同质产品的市场，市场需求函数为 P=5−Q。市场中有两个厂商，厂商1和厂商2的边际成本分别为1和4，无固定成本。（1）若厂商组成卡特尔，求此时均衡的市场产量和价格；（2）若厂商进行价格竞争，求此时均衡的市场产量和价格。',answer:`**考察知识点**：卡特尔、伯特兰竞争、边际成本差异。\n**思路**：卡特尔由低成本厂商生产；伯特兰价格竞争。\n**答案**：（1）Q=2，P=3。（2）Q=2，P=3。
##**详解**
（1）由题意可知，厂商1的边际成本始终低于厂商2，因此组成卡特尔后，将由厂商1生产所有产量。此时卡特尔组织利润最大化问题为：max π=(5−Q)Q−Q。利润最大化的一阶条件为：dπ/dQ=5−2Q−1=0。解得产量 Q=2，市场价格 P=3。
（2）伯特兰竞争会导致厂商竞相削价来赢得更多的市场，因此厂商1若与厂商2进行价格竞争，由于 MC₂=4，MC₁=1，所以只要厂商1制定价格 P₁=4−ε，ε 为任意小的正数，则厂商1将占据整个市场，厂商2会退出市场。
当厂商1获得全部市场需求时，该产品市场为完全垄断市场，厂商1作为垄断厂商进行垄断定价。垄断利润最大化时满足：5−2Q=1，解得 Q^*=2，代入反需求函数可得 P^*=3。由于 P^*<MC₂，此时厂商2仍然不会进入市场，厂商1可以维持其垄断地位并获得最大垄断利润，因此伯特兰均衡价格 P^*=3，产量 Q^*=2。`},
{id:'m91',special:'微观·寡头垄断市场',qid:'A7 ★★★',question:'在一个古诺双寡头垄断市场中，市场需求函数为 p=100−q1−q2，其中 q1、q2 分别为企业1和2的产量。企业1的边际成本为20，企业2的边际成本为30，不考虑不变成本。（1）求两个企业的反应函数。（2）什么是纳什均衡？求纳什均衡价格、每个企业的产量和利润。（3）假如两个企业可以串谋，这时的市场价格、总产量和总利润又是什么？（4）现在假设企业2可以获得企业1同样的技术，其边际成本下降到企业1的水平。不考虑串谋，求新的均衡价格和企业2的产量。企业2为获得新技术愿意支付的成本是多少？',answer:`**考察知识点**：古诺、纳什均衡、串谋、技术授权。\n**思路**：求反应函数；联立求均衡；串谋由低成本厂商生产；技术改进后重新求均衡。\n**答案**：（1）q1=40−q2/2，q2=35−q1/2。（2）q1=30，q2=20，p=50，π1=900，π2=400。（3）q1=40，q2=0，p=60，π=1600。（4）q1=q2=80/3，p=140/3；企业2愿支付2800/9。
##**详解**
（1）给定企业2的产量 q₂，企业1的利润最大化问题为：max (100−q₁−q₂)q₁−20q₁。由一阶条件解得企业1的反应函数为：q₁=40−(1/2)q₂。同样方法，可得企业2的反应函数为：q₂=35−(1/2)q₁。
（2）纳什均衡指这样一种策略集，在这一策略集中，每一个博弈者都确信，在给定竞争对手策略决定的情况下，他选择了最好的策略。联立（1）中两反应函数解得纳什均衡的产量为 q₁=30，q₂=20。此时的总产量为50，市场价格为 p=100−30−20=50。两企业的利润分别为：π₁=50×30−20×30=900，π₂=50×20−30×20=400。
（3）由于企业1的边际成本总是低于企业2的边际成本，所以无法满足常规情况下卡特尔均衡条件 MC₁=MC₂，此时边际成本恒小的厂商生产所有产量，即串谋后企业2应当停产（q₂=0），由企业1生产全部的产量。串谋后的利润最大化问题为：max (100−q₁)q₁−20q₁。由利润最大化的一阶条件解得 q₁=40，因此总产量为40，市场价格为 p=100−40=60，两个企业的总利润为：π=60×40−20×40=1600。
（4）如果企业2获得了企业1的技术，两家厂商进行古诺竞争，采用类似于（1）和（2）问题的方法解得：q₁=q₂=80/3。此时每个厂商的利润为：π₁=π₂=6400/9。所以厂商2为了获得该技术而愿意支付的最高成本应当是使他在获得和不获得该技术之间没有差异，即他愿意支付：(6400/9)−400=2800/9。\n**【提示】**本题第（3）问属于卡特尔均衡的特殊情况，即厂商边际成本均为常数同时不存在固定成本，此时所有产量均为边际成本更小的厂商生产，其原理类似于一厂商多工厂问题中的特殊情况，见三大本第2册《计算专题与知识要点总结》第一部分计算专题总结的专题八。`},
{id:'m92',special:'微观·寡头垄断市场',qid:'A8 ★★★',question:'市场需求是 D(P)=30−P，两个厂商，厂商1的边际成本是0，厂商2的边际成本是2，两厂商都无固定成本。（1）两个厂商同时决定价格，求均衡产量和利润。（2）厂商1先行定产，那么求均衡产量和利润；厂商2先行定产，求均衡产量和利润；（3）如果行动有两期，第一期研发产品，研发费用高的一方将研发出产品，并获得专利权，同时获得先行定产的权利。第二期，按照定产顺序定产，那么求均衡研发费用，均衡产量。（北大 2009 年考题）',answer:`**考察知识点**：伯特兰、斯塔克尔伯格、研发竞争。\n**思路**：分别按价格竞争、产量领导求解；研发费用取决于先行收益差。\n**答案**：（1）P=2−ε，Q=28+ε，π1=(2−ε)(28+ε)，π2=0。（2）厂商1先：Q1=16，Q2=6，π1=128，π2=36；厂商2先：Q1=17/2，Q2=13，π1=289/4，π2=169/2。（3）研发费在48.5到55.75之间；均衡 Q1=16，Q2=6。
##**详解**
（1）此时为伯特兰模型，低边际成本的厂商（厂商1）将独占市场。厂商1独占市场以后，如果进行垄断定价，由利润最大化的条件 MR=MC 可得：30−2Q=0。解得 Q=15，市场价格 P=15>2，因此厂商1独占市场以后无法按照垄断利润最大化进行定价，因为此时的价格高于厂商2的边际成本，无法将厂商2挤出市场。最终厂商1的定价为 P=2−ε，ε→0^+，市场产量 Q=28+ε。厂商1的利润 π₁=(2−ε)(28+ε)，厂商2的利润 π₂=0。
（2）此时为斯塔克尔伯格模型，厂商2利润最大化问题为：max π₂=[30−(Q₁+Q₂)]Q₂−2Q₂。根据利润最大化的一阶条件，可得厂商2的反应函数为：Q₂=14−Q₁/2。厂商1可根据厂商2的反应函数以求得自己利润最大化的产量，此时厂商1利润最大化问题为：
$$max π₁=[30−(Q₁+Q₂)]Q₁=(16−Q₁/2)Q₁
由厂商利润最大化的一阶条件可以解得：Q₁=16，Q₂=6，π₁=128，π₂=36。
同理可得厂商2先定产时，有：Q₁=17/2，Q₂=13，π₁=289/4，π₂=169/2。
（3）根据（2）可得厂商1愿意花费 128−(289/4)=55.75 的研发费，厂商2愿意花 (169/2)−36=48.5 的研发费，所以均衡时的研发费应该为高于48.5小于55.75之间的一个数，即研发费用 F=48.5+ε。厂商1出了较高的研发费，所以厂商1先定产，最终的均衡为：Q₁=16，Q₂=6，π₁=128−F，π₂=36。`},
{id:'m93',special:'微观·寡头垄断市场',qid:'A9 ★★★',question:'假设某一行业只有三家生产厂商，每家厂商的边际成本都等于0，行业的反需求函数是一线性函数，p=60−q。（1）古诺竞争情况下，厂商1的反应函数是什么？求出此时的古诺均衡解。（2）如果厂商2和3决定合并成一家企业，请计算新的均衡，并分析厂商1是变好了还是变差了？厂商2和3的利润与之前相比，增加了还是减少了？（3）如果厂商1事先宣布生产一定数量 q1，那么厂商2和3的最优生产数量是多大？',answer:`**考察知识点**：古诺、合并、产量领导。\n**思路**：求反应函数；合并后重新求均衡；领导者先行。\n**答案**：（1）q1=30−q2/2−q3/2；q1=q2=q3=15，p=15，π=225。（2）q1=q4=20，p=20，π1=π4=400；厂商1变好，厂商2、3总利润减少。（3）q1=30，q2=q3=10。
##**详解**
（1）每家厂商的边际成本都等于0，（下面的计算中我们可把固定成本忽略掉，因为它不影响厂商的均衡的产量）。厂商1的利润函数为：π₁=pq₁=(60−q₁−q₂−q₃)q₁。利润最大化的一阶条件为：∂π₁/∂q₁=60−2q₁−q₂−q₃=0。因此厂商1的反应函数为 q₁=30−q₂/2−q₃/2。每家厂商的成本相同，因此三家厂商的生产量是相等的，即 q₁=30−q₁。解得 q₁=q₂=q₃=15，所以 q=q₁+q₂+q₃=45，价格为 p=60−q=15。三家厂商利润（忽略了固定成本）都为：15×15=225。
（2）厂商2和3合并成一家企业，此时厂商1的利润函数为：π₁=(60−q₁−q₄)q₁，其中 q₄ 表示厂商2和3决定合并后企业的产量。利润最大化的一阶条件为：∂π₁/∂q₁=60−2q₁−q₄=0。厂商1的反应函数为：q₁=30−q₄/2。同理可得，合并为一家企业的厂商2和3的反应函数为：q₄=30−q₁/2。联立解得：q₁=q₄=20，价格 p=20。厂商1和合并之后的厂商2、3的利润都为 20×20=400。因此，厂商1的情况变好了，厂商1的利润增加了175，而厂商2、3的总利润减少了50。
（3）如果厂商1事先宣布产量为 q₁，则厂商2和厂商3的反应函数分别为：
$$q₂=30−q₁/2−q₃/2, q₃=30−q₁/2−q₂/2
联立可得 q₂=q₃=20−q₁/3。从而厂商1的利润函数为：π₁=pq₁=[60−q₁−2(20−q₁/3)]q₁。厂商1利润最大化的一阶条件为：∂π₁/∂q₁=20−(2/3)q₁=0。解得：q₁=30，从而厂商2和厂商3的最优生产数量是 q₂=q₃=10。\n**【提示】**本题第（2）问属于古诺模型中多厂商合并问题，第（3）问属于“一个领导者多个追随者”的产量领导模型，2023年880（微宏观）的计算题就考到了“一个领导者多个追随者”的产量领导模型。`},
{id:'m94',special:'微观·寡头垄断市场',qid:'A10 ★★★',question:'考虑两阶段三个企业的斯塔克尔伯格数量竞争模型。在第一阶段，企业1和企业2非合作地同时选择产量 q1 和 q2；在第二阶段，企业3选择产量 q3。已知市场的需求曲线为 P=60−5Q，P 和 Q 分别为市场价格和市场总需求量。假设所有企业的边际成本和固定成本都为零。（1）求出各个企业的均衡产量。（2）求出市场均衡价格。（3）通过计算说明，与三个企业同时进行产量竞争的情形相比较，企业3产出是增加了还是减少了？',answer:`**考察知识点**：多领导者一追随者、斯塔克尔伯格、古诺比较。\n**思路**：先求追随者反应；再求两个领导者古诺均衡；与三企业古诺比较。\n**答案**：（1）q1=q2=4，q3=2。（2）P=10。（3）三企业古诺时 q3=3，所以企业3产出减少。
##**详解**
（1）对于企业1和企业2来说，企业3属于追随者，故应先分析企业3的产量策略。对于企业3，其利润最大化问题为：π₃=[60−5(q₁+q₂+q₃)]q₃。由一阶条件解得企业3的反应函数为：q₃=6−(q₁+q₂)/2。
再分析企业1和企业2的决策。此时企业1的利润最大化问题为：max π₁=[60−5(q₁+q₂+6−(q₁+q₂)/2)]q₁。由利润最大化的一阶条件可得：∂π₁/∂q₁=30−5q₁−(5/2)q₂=0。整理可得企业1的反应函数为：q₁=6−(1/2)q₂。同理可得企业2的反应函数为：q₂=6−(1/2)q₁。联立企业1与企业2的反应函数解得：q₁=q₂=4。将其代入企业3的反应函数，可得企业3的产量为 q₃=2。
（2）将（1）的结果带入需求曲线方程，得 P=60−5(q₁+q₂+q₃)=10。
（3）若三个企业同时进行产量竞争，此时将进行三个企业的古诺模型分析。企业3的反应函数不变，仍为 q₃=6−(q₁+q₂)/2。由对称性可得企业1和企业2的反应函数：q₁=6−(q₂+q₃)/2，q₂=6−(q₁+q₃)/2。联立反应函数解得：q₁=q₂=q₃=3>2，说明（2）的情形下企业3的产出减少了。\n**【提示】**与上一道题不同，注意与上一道题第（3）问的区别，本题第（1）问涉及到了“多个领导者一个追随者”，与课本中常见的斯塔克尔伯格模型不同，对于此类模型，分析的核心思路不变，仍然是先分析追随者反应，再分析两个领导者的反应（两个领导者同时决定产量，相当于相互之间进行古诺竞争）。`},
{id:'m95',special:'微观·寡头垄断市场',qid:'A11 ★★',question:'考虑差别产品的价格竞争。两厂商通过选择价格竞争，它们面临的需求曲线是：Q1=20−P1+P2，Q2=20+P1−P2。式中，P1 和 P2 分别是两厂商所定的价格；Q1 和 Q2 则是相应的需求。注意对各产品的需求只取决于它们的价格差，如果两厂商共谋并定相同的价格，它们可以把价格定在任意的高度，并赚到无限的利润。厂商的边际成本为零。（1）假设两厂商同时决定它们的价格，求出相应的纳什均衡。各厂商会定什么价格，它们将销出多少，利润为多少？（2）设厂商1先定价格，然后厂商2定价。各厂商将定价多少，能销出多少，利润为多少？（3）设你是两厂商之一，且你们有三种博弈的方法：①两厂商同时定价；②你先定价；③你的竞争者先定价。如果能从中选择，你喜欢哪种？解释为什么。',answer:`**考察知识点**：差别产品价格竞争、纳什均衡、价格领导。\n**思路**：求价格反应函数；同时定价联立；序贯定价逆推。\n**答案**：（1）P1=P2=20，Q1=Q2=20，π1=π2=400。（2）P1=30，P2=25，Q1=15，Q2=25，π1=450，π2=625。（3）首选③，次选②；价格领导使双方利润均增加，追随者增加更多。
##**详解**
（1）此时厂商1利润最大化问题为：π₁=P₁Q₁=P₁(20−P₁+P₂)。由利润最大化的一阶条件可得：∂π₁/∂P₁=20−2P₁+P₂=0。整理可得厂商的反应函数为：P₁=(20+P₂)/2。同理可得厂商2的反应函数为 P₂=(20+P₁)/2。联立反应函数解得厂商的价格 P₁=P₂=20。此时，每个厂商生产的产量为：Q₁=Q₂=20，两个厂商的利润为：π₁=π₂=400。
（2）厂商1先定价时，厂商2会根据自身的反应函数 P₂=(20+P₁)/2 进行定价。厂商1知道厂商2将根据反应曲线 P₂=(20+P₁)/2 选择 P₂。因此，厂商1的利润最大化问题为：
$$max π₁=P₁Q₁=P₁(20−P₁+P₂)=P₁(20−P₁+(20+P₁)/2)
利润最大化的一阶条件为：(dπ₁)/(dP₁)=30−P₁=0。解得：P₁=30，因此 P₂=(20+P₁)/2=25。所以厂商1的产量为 Q₁=15，利润为 π₁=450；厂商2的产量为 Q₂=25，利润为 π₂=625。
（3）应该首选第③种，次选第②种。在价格领导模型中，将价格定在同时定价时的均衡值之上，所以价格领导模型对两厂商都是可选择的。根据反应曲线，价格领导会引起追随者价格提高，但追随者的价格小于价格领袖所定的价格，相当于削价与价格领袖竞争，双方都得到比同时定价增加的利润，追随者利润的增加更大。\n**【提示】**价格竞争：（1）相同产品的价格竞争：伯特兰模型。（2）差别产品的价格竞争：价格的纳什均衡。寡头垄断市场常常至少有某种程度的产品差别。市场份额并不只是由价格决定，同样也由各厂商产品的设计、性能和耐用性决定，因而厂商通过选择价格而不是选择产量竞争是很自然的。纳什均衡点就是两条关于价格的反应曲线相交的点，在这一点，由于各厂商所做的是在给定它的竞争者已定的价格的情况下所能做的最好的，因此没有哪个厂商有改变它价格的冲动。`},
{id:'m96',special:'微观·寡头垄断市场',qid:'B1 ★★',question:'一个双寡头市场的（反）需求函数是 p=a−bX，a,b>0，寡头1和2的边际成本分别为 c1 和 c2，且满足 c2<c1<a。（1）求Cournot竞争中双方的均衡产量；（2）求伯特兰均衡；（3）如果厂商1是先行定产者，求两厂商的均衡产量。',answer:`**考察知识点**：古诺、伯特兰、斯塔克尔伯格、成本差异。\n**思路**：分别按古诺、伯特兰、产量领导求解。\n**答案**：（1）X1=(a+c2−2c1)/(3b)，X2=(a+c1−2c2)/(3b)。（2）分情况：若 a+c2<2c1，P=(a+c2)/2；若 a+c2>2c1，P1=c1，P2=c1−ε。（3）X1=(a+c2−2c1)/(2b)，X2=(a+2c1−3c2)/(4b)。
##**详解**
（1）厂商1的最大化问题为：max π₁=[a−b(X₁+X₂)]X₁−c₁X₁。由利润最大化的一阶条件可得：∂π₁/∂X₁=a−2bX₁−bX₂−c₁=0。整理可得厂商1的反应函数为：X₁=(a−c₁−bX₂)/(2b)。同理可得厂商2反应函数：X₂=(a−c₂−bX₁)/(2b)。联立解得均衡产量：
$$X₁=(a+c₂−2c₁)/(3b), X₂=(a+c₁−2c₂)/(3b)
（2）如果两厂商进行伯特兰竞争，伯特兰均衡下的价格要低于高成本厂商1的边际成本 c₁，此时厂商2获得所有市场份额，下面分情况讨论：
① 如果厂商2进行垄断定价，均衡条件为：a−2bX₂=c₂。均衡产量 X₂=(a−c₂)/(2b)，垄断价格 P=(a+c₂)/2。如果 (a+c₂)/2<c₁，即满足 a+c₂<2c₁ 时，伯特兰均衡价格为 P=(a+c₂)/2。
如果 (a+c₂)/2>c₁，即 a+c₂>2c₁，厂商2不能制定垄断价格，此时伯特兰均衡价格为 p₁=c₁，p₂=c₁−ε，这里 ε→0^+，并且 0<ε<c₁−c₂。这是因为每个厂商只需要把自己的价格降得比对方略低，就可以获得整个市场，而价格的下限是自己的边际成本，即：X₁=0，X₂=(a−(c₁−ε))/b。
（3）由（1）可知厂商2的反应函数为：X₂=(a−c₂−bX₁)/(2b)。此时厂商1的利润最大化问题为：
$$max π₁=[a−b(X₁+(a−c₂−bX₁)/(2b))]X₁−c₁X₁
由利润最大化的一阶条件可得：∂π₁/∂X₁=(a+c₂)/2−bX₁−c₁=0。解得厂商1的产量为：X₁=(a+c₂−2c₁)/(2b)，此时厂商2的产量为 X₂=(a+2c₁−3c₂)/(4b)。`},
{id:'m97',special:'微观·寡头垄断市场',qid:'B2 ★★',question:'古诺市场上的寡头有 n 个，按固定边际成本 c 生产，需求曲线 P=a−Q，行业总产量为 Q。（1）所有厂商独立生产时的均衡产量及利润；（2）n 个厂商中有 m−1 个厂商合并，此时厂商的均衡产量及利润；（3）试说明合并外的企业可获得利润。（人大考题）',answer:`**考察知识点**：古诺、合并、利润比较。\n**思路**：分别求独立古诺和部分合并后的均衡；比较利润。\n**答案**：（1）q=(a−c)/(n+1)，π=(a−c)²/(n+1)²。（2）合并厂商利润 π=(a−c)²/(n−m+3)²，未合并企业利润相同。（3）说明略。
##**详解**
（1）市场需求曲线 P=a−Q=a−Σ_(j=1)^n q_j。对于厂商 i 而言，其利润函数为：π_i=(a−Σ_(j=1)^n q_j)q_i−cq_i。厂商 i 利润最大化的条件为：∂π_i/∂q_i=(a−Σ_(j=1)^n q_j)−q_i−c=0。分别对厂商1,2…n求一阶导，并对一阶条件进行加总可得：n(a−c)=(n+1)Q，化简得：Q=(n(a−c))/(n+1)。因此，每个厂商独立生产时的均衡产量为：q=(a−c)/(n+1)。单个厂商的利润为：
$$π=(a−(n(a−c))/(n+1))(a−c)/(n+1)=(a−c)/(n+1)((a−c)/(n+1))²
（2）假设m-1个厂商合并的产量为 Q_(m−1)=q+…+q_(m−1)，成本函数为：C_(m−1)=cQ_(m−1)。则市场需求曲线为：P=a−Q=a−Σ_(j=m)^n q_j−Q_(m−1)。对于合并的m-1个厂商而言，其利润函数为：
$$π_(m−1)=(a−Σ_(j=m)^n q_j−Q_(m−1))Q_(m−1)−cQ_(m−1)
当合并厂商达到利润最大化时，应满足：(∂π_(m−1))/(∂Q_(m−1))=(a−Σ_(j=m)^n q_j−Q_(m−1))−Q_(m−1)−c=0。化简得：(a−Q)−Q_(m−1)−c=0。
对于未合并的厂商 i(i=m,m+1,…,n) 而言，其利润函数为：
$$π_i=(a−Σ_(j=m)^n q_j−Q_(m−1))q_i−cq_i
厂商 i 利润最大化的条件为：
$$∂π_i/∂q_i=(a−Σ_(j=m)^n q_j−Q_(m−1))−q_i−c=0
化简得：(a−Q)−q_i−c=0。分别对厂商 m,m+1,…,n 求一阶导，并对一阶条件进行加总可得：
$$(n−m+1)(a−c−Q)=Q−Q_(m−1)
联立两式，可得：
$$Q=(a−c)(n−m+2)/(n−m+3), Q_(m−1)=(a−c)/(n−m+3)
此时合并厂商的利润：
$$π_(m−1)=(a−Q−c)Q_(m−1)=((a−c)/(n−m+3))²
（3）根据（2）可知，剩下未合并企业单个的产量为：
$$q=(Q−Q_(m−1))/(n−m+1)=(a−c)/(n−m+3)
则未合并企业的利润为：
$$π=(a−Q−c)q=((a−c)/(n−m+3))²\n**【提示】**本题单个厂商的边际成本均为固定的常数，因此合并后厂商的成本函数为 C_(m−1) = c·Q_(m−1)，如果单个厂商的边际成本不为常数且不相等，则在求合并后厂商的成本函数时需要用到等边际法则。`},
{id:'m98',special:'微观·寡头垄断市场',qid:'B3 ★',question:'考虑一个有 n 个厂商的古诺竞争行业，厂商的产量由 y1,…,yn 表示，总产量以 Y=∑yi 表示，行业需求曲线 P(Y)，每个厂商的成本函数由 ci(yi)=cyi 给出。为简单起见，P″(Y)<0，假定每个厂商要支付一个特别的税 ti。（1）写出厂商i的一阶条件。（2）证明：行业的产量和价格仅只依赖税率的总和。（3）假设单个厂商的税率发生了变化，但不影响整个行业的税负。令 Δti 代表厂商 i 的税率变化量，则 ∑Δti=0。计算此时厂商 i 均衡的产出变化 Δyi。',answer:`**考察知识点**：古诺、税收、比较静态。\n**思路**：写一阶条件；加总；求比较静态。\n**答案**：（1）P′(Y)yi+P(Y)=c+ti。（2）证明略。（3）Δyi=Δti/P′(Y)。
##**详解**
（1）厂商 i 的利润最大化问题为：max π_i=P(Y)y_i−(c+t_i)y_i。利润最大化的一阶条件为：∂π_i/∂y_i=P'(Y)y_i+P(Y)−(c+t_i)=0。整理可得一阶条件为：P'(Y)y_i+P(Y)=c+t_i。
（2）对所有厂商的一阶条件相加可得：
$$Σ_(i=1)^n[P'(Y)y_i+P(Y)]=Σ_(i=1)^n[c+t_i]
整理可得：P'(Y)Y+nP(Y)=nc+Σ_(i=1)^n t_i。因此行业的产量和价格仅只依赖税率的总和。
（3）由于行业的总产量和价格只依赖于税率的总和，所以当税率变化量满足 Σ_(i=1)^nΔ t_i=0 时，行业的产量和价格不变，假设行业总产量仍为 Y，价格仍为 P(Y)。此时厂商 i 的一阶条件为：P'(Y)(y_i+Δ y_i)+P(Y)=c+t_i+Δ t_i。此时仍然满足：P'(Y)y_i+P(Y)=c+t_i。联立解得：P'(Y)Δ y_i=Δ t_i，因此厂商 i 均衡产出的变化量：Δ y_i=(Δ t_i)/P'(Y)。`},
{id:'m99',special:'微观·寡头垄断市场',qid:'B4 ★',question:'产品A的市场需求函数为 Q=240−P，其中 P 为市场价格，Q 为市场需求。在当前科技水平下，产品A的边际成本为120，无固定成本。某风险中性的产学研机构拟投入研发资金 k 元进行技术攻关。如果成功，则将边际成本降低到了60元，但是成功几率为0.5。此外，如果成功，该机构可以将技术授权给至多一家生产产品A的厂商，并收取一次性授权费用 L 元。获得该技术的厂商可以无限期使用该技术，但不可以转卖该技术。假设两期间的贴现因子为常数0.8。（1）假设产品市场A的结构为垄断，该机构最多可以收取多少授权费？为使创新不亏损，研发投入 k 的最大值是多少？（2）假设产品市场A的结构是两家厂商进行产量竞争（古诺竞争），该机构最多可以收取多少授权费？为使得创新不亏损，研发投入 k 的最大值应该是多少？（3）假设产品市场A的结构是两家同质的进行价格竞争的厂商，该机构最多可以收取多少授权费？为了使创新不亏损，研发投入 k 的最大值应该是多少？（4）假设在（1）的情况下，垄断厂商面临着一家潜在的进入厂商。潜在进入者需要获得该技术才能进入市场。此外并无其他成本。若成功进入，两个厂商将进行产量竞争。为了使得利润最大化，请问该机构应该授权给在位厂商还是新厂商？为什么？',answer:`**考察知识点**：研发、技术授权、垄断/古诺/伯特兰、贴现。\n**思路**：分别计算不同市场结构下技术带来的利润增量现值；比较授权对象。\n**答案**：（1）L=22500，k=11250。（2）L=30000，k=15000。（3）L=36000，k=18000。（4）授权给在位厂商，最大授权费38500。
##**详解**
（1）如果垄断厂商没有获得该技术，厂商边际成本为 MC=120，由利润最大化的条件 MR=MC 可得：240−2Q=120，解得利润最大化的产量 Q=60，此时厂商的利润 π=3600。
如果垄断厂商获得该技术，则厂商边际成本下降为 MC'=60，由利润最大化的条件 MR=MC' 可得：240−2Q=60，解得利润最大化的产量 Q'=90，此时厂商的利润 π'=8100。
因此，获得该技术后，厂商每一期的利润可以增加 Δπ=π'−π=8100−3600=4500。该技术可以无限期使用，并且折现因子为常数0.8，则未来所有期增加的利润的现值为：
$$4500+4500×0.8+4500×0.8^2+…=4500Σ_(i=0)^∞(0.8)^i=4500×1/(1−0.8)=22500
此即为该机构最多可以收取的授权费，因此 L=22500。由于该技术成功率为0.5，所以该机构所获得的期望利润为 Eπ=22500×0.5+0×0.5=11250，此即为研发机构的最大的研发投入，因此 k=11250。
（2）假设存在两个厂商1和2，产量分别为 q₁，q₂。如果两个厂商都没有获得该技术，则边际成本 MC₁=MC₂=120。厂商1利润最大化问题为：max π₁=[240−(q₁+q₂)]q₁−120q₁。利润最大化的一阶条件为：∂π₁/∂q₁=240−2q₁−q₂−120=0。整理可得厂商1的反应函数：q₁=60−(1/2)q₂。同理可得厂商2的反应函数：q₂=60−(1/2)q₁。联立解得厂商产量：q₁=q₂=40，厂商利润 π₁=π₂=1600。
假设如果厂商1获得该技术，则厂商1的边际成本下降为 MC₁'=60。厂商1利润最大化问题为：max π₁'=[240−(q₁+q₂)]q₁−60q₁。利润最大化的一阶条件为：∂π₁'/∂q₁=240−2q₁−q₂−60=0。整理可得厂商1的反应函数：q₁=90−(1/2)q₂。厂商2的反应函数仍然为：q₂=60−(1/2)q₁。联立解得厂商产量：q₁'=80，q₂'=20，厂商利润 π₁'=6400，π₂=400。
由此可见，获得该技术的厂商利润由1600增加到6400，未获得该技术的厂商利润由1600减少到400，因此获得技术的厂商与未获得技术的厂商每期利润差额的现值即为该机构可以收取的最大授权费，即：
$$L=(6400−400)Σ_(t=0)^∞(0.8)^t=6000×1/(1−0.8)=30000
所以最大研发支出 k=30000×0.5+0×0.5=15000。
（3）假设存在两个厂商1和2，产量分别为 q₁，q₂。如果两个厂商都没有获得该技术，则边际成本 MC₁=MC₂=120。伯特兰均衡价格 P=MC₁=MC₂=120，此时厂商利润 π₁=π₂=0。
假设如果厂商1获得该技术，则厂商1的边际成本下降为 MC₁'=60。由于 MC₂<MC₁'，此时价格竞争的结果是市场中只有厂商1。如果厂商1制定垄断价格，由利润最大化的条件 MR=MC₁' 可得：240−2Q=60，解得利润最大化的产量 Q₁'=90，市场价格 P'=150>MC₂，所以厂商1无法制定垄断均衡的价格。因此最终市场价格为 P'=120−ε，ε→0^+，厂商1的产量 q₁'=120+ε。此时 π₁'=(120−ε−60)(120+ε)≈7200，π₂'=0。该机构可以收取的最大授权费
$$L=7200Σ_(t=0)^∞(0.8)^t=7200×1/(1−0.8)=36000
最大研发支出 k=36000×0.5+0×0.5=18000。
（4）假设厂商1为在位者，厂商2为潜在进入者。如果厂商1获得该技术，则市场始终为垄断市场。厂商1获得技术前，利润为 π₁=3600，厂商1获得技术后，利润为 π₁'=8100。如果厂商2获得该技术，则市场由垄断市场变为古诺竞争市场。厂商2获得技术前，各自的利润为：π₁=3600，π₂=0。厂商2获得技术后，各自的利润为：π₁'=400，π₂'=6400。所以厂商1愿意为该技术支付的最大支出
$$L₁=(π₁'−π₂')Σ_(t=0)^∞(0.8)^t=(8100−400)×1/(1−0.8)=38500
厂商2愿意为该技术支付的最大支出
$$L₂=(π₂'−π₂)Σ_(t=0)^∞(0.8)^t=6400×1/(1−0.8)=32000
所以该机构应该把技术授权给在位厂商，可以获得的最大授权费 L=38500。`},
{id:'m100',special:'微观·纳什均衡求解',qid:'A1 ★★',question:'考虑一个博弈的支付矩阵：A上/B左=(a,b)，A上/B右=(c,d)，A下/B左=(e,f)，A下/B右=(g,h)。（1）如果（上，左）为一占优策略均衡，那么关于a,…,h必须成立什么不等式？（2）如果（上，左）为一纳什均衡，那么，上述不等式中哪一个必须要满足？（3）如果（上，左）为占优策略均衡，它必然是一个纳什均衡吗？',answer:`**考察知识点**：占优策略、纳什均衡。\n**思路**：占优策略要求严格优于另一策略；纳什均衡只要求给定对方策略下最优。\n**答案**：（1）a>e，c>g，b>d，f>h。（2）a>e，b>d。（3）必然。
##**详解**
（1）当且仅当 a>e，c>g，“上”是参与人A的占优策略；当且仅当 b>d，f>h 时，“左”是参与人B的占优策略。因此如果（上，左）是占优策略均衡，则必有：a≥e，c>g，b>d，f>h。
（2）如果（上，左）是纳什均衡，那么给定A选择“上”，“左”就是参与人B的最优选择，这就意味着 b>d。同样，给定B选择“左”，“上”就是参与人A的最优选择，这意味着 a>e。综上可知：b>d 和 a>e 必须成立。
（3）如果（上，左）为占优策略均衡，则它也必然是一个纳什均衡。`},
{id:'m101',special:'微观·纳什均衡求解',qid:'A2 ★★★',question:'试求出以下静态博弈的所有纳什均衡（包括混合策略均衡）。参与人1有两个行动：B和S；参与人2有三个行动：B、S和X。支付矩阵为：B,B=(4,2)；B,S=(0,0)；B,X=(0,1)；S,B=(0,0)；S,S=(2,4)；S,X=(1,3)。方框中的第一个数字表示参与人1的效用，第二个数字表示参与人2的效用。',answer:`**考察知识点**：纯策略纳什均衡、混合策略纳什均衡。\n**思路**：划线法找纯策略；剔除X后求混合策略。\n**答案**：纯策略纳什均衡（B，B）和（S，S）；混合策略均衡为参与人1以(2/3,1/3)选择(B,S)，参与人2以(1/3,2/3)选择(B,S)。
##**详解**
（1）利用划线法，找出纯策略纳什均衡：
参与人1＼参与人2｜B｜S｜X
B｜4,2｜0,0｜0,1
S｜0,0｜2,4｜1,3
因此，该博弈的纯策略纳什均衡有两个，分别是（B，B）、（S，S）。
（2）根据博弈矩阵可知，无论参与人1选择B还是S，参与人2均不可能选择X，此时收益矩阵变为：
参与人1＼参与人2｜B｜S
B｜4,2｜0,0
S｜0,0｜2,4
因此，设参与人1选择B的概率为 p，则选择S的概率为 1−p，设参与人2选择B的概率为 q，则选择S的概率为 1−q。
因此，参与人1的期望支付为：E₁=4pq+2(1−p)(1−q)=2p(3q−1)−2q+2，进而可得参与人1的反应函数为：
$$p=｛0，q<1/3；[0,1]，q=1/3；1，q>1/3｝
同理，参与人2的期望支付为：E₂=2pq+4(1−p)(1−q)=2q(3p−2)−4p+4，进而可得参与人2的反应函数为：
$$q=｛0，p<2/3；[0,1]，p=2/3；1，p>2/3｝
由参与人1和参与人2的条件混合策略可得，混合策略的纳什均衡为：
$$((p,1−p),(q,1−q))=((2/3,1/3),(1/3,2/3))
即该博弈的混合策略纳什均衡为：参与人1以 (2/3,1/3) 的概率选择（B,S），参与人2以 (1/3,2/3) 的概率选择（B,S）。`},
{id:'m102',special:'微观·纳什均衡求解',qid:'A3 ★★★',question:'参与者A和B参加一个简单的单阶段博弈。两个人同时选择1和2。如果两个人都选择了1，则A需要付给B1元；如果两个人都选择了2，则A需要付给B2元；如果两个人选择的数字不一样，则B需要付给A1元。（1）在表格中表示出两个参与者的策略和支付矩阵。（2）该博弈是否存在占优策略、弱劣势策略或劣势策略？找出每个参与者的最佳反应。（3）该博弈是否存在纳什均衡？解出博弈的混合策略均衡。',answer:`**考察知识点**：支付矩阵、占优策略、混合策略纳什均衡。\n**思路**：写矩阵；求反应函数；联立求混合均衡。\n**答案**：（1）矩阵略。（2）无占优策略；最佳反应：A选1当B选1，A选2当B选2；B类似。（3）无纯策略纳什均衡；混合均衡 p=q=3/5。
##**详解**
（1）两个参与者的策略和支付矩阵如下表所示：
A＼B｜B选1｜B选2
A选1｜−1,1｜1,−1
A选2｜1,−1｜−2,2
（2）该博弈不存在占优策略、弱劣势策略或劣势策略。当A选1，B应该选1；当A选2，则B应该选2。同理，当B选1，A应选2；当B选2，则A应选1。
（3）该博弈不存在纯策略纳什均衡，下面求混合策略纳什均衡。设A选1的概率为 p，B选1的概率为 q，则A选2的概率为 1−p，B选2的概率为 1−q。
A的期望收益为：
$$E_A=−pq+p(1−q)+(1−p)q−2(1−p)(1−q)=p(3−5q)+3q−2
进而可得参与人A的反应函数为：
$$p=｛0，q>3/5；[0,1]，q=3/5；1，q<3/5｝
B的期望收益为：
$$E_B=qp−q(1−p)−(1−q)p+2(1−q)(1−p)=q(5p−3)−3p+2
进而可得参与人B的反应函数为：
$$q=｛0，p<3/5；[0,1]，p=3/5；1，p>3/5｝
联立解得 p=q=3/5。故博弈的混合策略均衡为：A以 (3/5) 的概率选择1，(2/5) 的概率选择2；B以 (3/5) 的概率选择1，(2/5) 的概率选择2。`},
{id:'m103',special:'微观·纳什均衡求解',qid:'A4 ★★',question:'两个邻居，i=1,2，同时选择自己花费多少时间 li 来修剪草坪。每小时的平均收益为：10−li+lj/2。同时，机会成本为每小时4元。房主 i 的平均收益随邻居 j 除草时间的增加而增加，这是由于邻居环境的美化能够增加房产的价值。（1）计算纳什均衡。（2）画出最优反应函数，并且在图中标注出纳什均衡。（3）如果每小时的平均收益函数的截距由10变为一个比10小的数值，纳什均衡如何变化。',answer:`**考察知识点**：纳什均衡、反应函数、比较静态。\n**思路**：写利润函数；求一阶条件；联立反应函数。\n**答案**：（1）li*=lj*=4。（2）图略。（3）均衡点向左下移动，修剪时间变短。
##**详解**
（1）房主 i 的利润最大化问题为：max π_i=(10−l_i+l_i/2)l_i−4l_i。利润最大化的一阶条件为：∂π_i/∂l_i=10−2l_i+l_i/2−4=0。整理可得房主 i 的反应函数为：l_i=3+l_i/4。同理可得邻居 j 的反应函数：l_j=3+l_i/4。联立两式子求得纳什均衡解：l_i^*=l_j^*=4。
（2）最优反应函数如图所示，交点即表示纳什均衡点。
【此处有图示】
（3）如果平均收益函数的截距由10变为一个比10小的数值 a，利用（1）中的方法，同样可以得到此时房主和邻居的最优反应函数：
$$｛l_i=a/2+l_i/4−2；l_j=a/2+l_i/4−2｝
解得均衡点为 ((2(a−4))/3,(2(a−4))/3)，这一点较（4,4）点更加靠左下，意味着房主及其邻居修剪草坪的时间变短了。`},
{id:'m104',special:'微观·纳什均衡求解',qid:'A5 ★★',question:'两个室友同时选择打扫寝室的努力程度 e1 与 e2，他们的效用函数分别为：U1=kln(e1+e2)−e1²，U2=ln(e1+e2)−e2²。其中 ln(e1+e2) 代表寝室的清洁度，它与打扫的努力成正比。假设寝室的清洁对两人的重要性并不一样，即 k>1。（1）求出纯策略纳什均衡；（2）讨论两人的不同清洁倾向（即 k）如何影响打扫的努力程度？（北大考题）',answer:`**考察知识点**：纳什均衡、反应函数、比较静态。\n**思路**：分别对 e1,e2 求一阶条件；联立。\n**答案**：（1）e1=k/√(2(1+k))，e2=1/√(2(1+k))。（2）k 越大，e1 越大，e2 越小。
##**详解**
（1）对于住宿者1来说，其效用最大化问题为：max kln(e₁+e₂)−(e₁)²。效用最大化的一阶条件为：k/(e₁+e₂)−2e₁=0，该等式也是住宿者1的反应函数。同理可得住宿者2的反应函数为：1/(e₁+e₂)−2e₂=0。纳什均衡的结果是双方的效用最大化条件同时得到满足，联立以上两式解得：
$$e₁=k/(√(2(1+k))), e₂=1/(√(2(1+k)))
因此，纯策略纳什均衡为 (e₁=k/(√(2(1+k))),e₂=1/(√(2(1+k))))。
（2）由（1）可知，对于住宿者1来说，其清洁倾向 k 更大，因此，其打扫的努力程度更大。而住宿者2的清洁倾向更小，打扫的努力程度更小。住宿者1打扫的努力程度是住宿者2的 k 倍。`},
{id:'m105',special:'微观·博弈论与寡头结合',qid:'A1 ★★',question:'假设你是一个相同产品的双寡头之一，你和你的竞争者生产的边际成本都是零。而市场的需求函数是：P=30−Q。（1）假设你们只有一次博弈，而且必须同时宣布产量，你会选择生产多少？你期望的利润为多少？为什么？（2）若你必须先宣布你的产量，你会生产多少？你认为你的竞争者会生产多少？你预计你的利润为多少？先宣布是一种优势还是劣势？为了得到先宣布或者后宣布的选择权，你愿意付出多少？（3）现在假设你正和同一个对手进行十次系列博弈中的第一次，每次都同时宣布产量。你想要十次利润的总和（不考虑贴现）最大化，在第一次你将生产多少？你期望第十次生产多少？第九次呢？为什么？',answer:`**考察知识点**：古诺、斯塔克尔伯格、有限重复博弈。\n**思路**：分别求古诺和斯塔克尔伯格均衡；有限重复博弈逆推。\n**答案**：（1）Q1=Q2=10，π=100。（2）Q1=15，Q2=7.5，π1=112.5；先宣布是优势，愿付12.5。（3）每次均为古诺产量10。
##**详解**
（1）由于只有一次博弈，所以这里的产量为古诺解。厂商1的利润为：π₁=(30−Q₁−Q₂)Q₁。由一阶条件可得到厂商1的反应函数为：Q₁=15−(1/2)Q₂。同理得到厂商2的反应函数为：Q₂=15−(1/2)Q₁。联立解得：Q₁=Q₂=10，P=10，π₁=π₂=100。
（2）这是一个斯塔克尔伯格模型。由（1）可知竞争对手的反应函数为 Q₂=15−(1/2)Q₁。此时领导厂商1的利润最大化问题为：max π₁=(30−Q₁−(30−Q₁)/2)Q₁。解得 Q₁=15，从而追随者厂商2的产量 Q₂=7.5，市场价格 P=7.5，厂商利润 π₁=112.5，π₂=56.25。由以上计算可知，先宣布是一种优势，为了得到先宣布产量的选择权，领导者愿意付出的代价应该不大于两种情况下的利润差，即 112.5−100=12.5。
（3）当两企业进行有限次的博弈时，按照古诺模型确定的产量是各自的最优选择，所以在每次博弈中，两个企业的产量都是10。这是因为两企业为了实现利润最大化的最优选择原本应该是按照联合定价的卡特尔模型行事，但在第十次生产时，双方都知道这是最后一次博弈，为了实现自身的利润最大，都会选择背叛，即实行先宣布产量的决策，从而使得市场的最后均衡为古诺均衡，而第九次博弈时，既然双方都知道在第十次博弈时，对方一定会背叛自己，那就没有理由在第九次博弈中合作，而市场的最终结果还是古诺均衡。以此类推，可知古诺产量是每一次博弈的均衡解。`},
{id:'m106',special:'微观·博弈论与寡头结合',qid:'A2 ★',question:'在一个重复、对称的双寡头垄断中，如果两个厂商生产最大化他们共同利润的产量（即两个厂商合谋时的产量），那么他们的利润为 πj；如果他们生产古诺产量水平，那么他们的利润为 πc。如果选择最大化自身利润的产量水平，每个局中人可以得到的最大支付为 πd。假设贴现率为 r，局中人采用的是惩罚策略，即如果在 t 期一个局中人背叛共同利润最大化策略，那么在 t 期以后的各期，另一个局中人就会生产古诺产量。试问要使惩罚策略构成该重复博弈的一个均衡，r 的取值应为多少？',answer:`**考察知识点**：重复博弈、触发策略、贴现率。\n**思路**：比较背叛与不背叛的利润现值。\n**答案**：r≤(πj−πc)/(πd−πj)。
##**详解**
如果一个局中人背叛，他在当期获得的利润为 π_d，此后获得的利润永远为 π_c，若不背叛，当期和以后所有期获得的利润都为 π_j。背叛的利润现值为：π_d+π_c/r；不背叛的利润现值为：π_j+π_j/r。为了使惩罚策略构成该重复博弈的一个均衡，利润必须满足
$$π_d+π_c/r≤π_j+π_j/r
进一步整理可得贴现率的取值范围：
$$r≤(π_j−π_c)/(π_d−π_j)\n**【提示】**欺骗行为的现值为 π_d + π_c/r 的原因是：在第一期，违约厂商获得更多的利润 π_d；而在以后所有期，厂商之间进行古诺竞争，违约厂商在以后所有期获得的利润都是 π_c，将以后所有期的利润折现到第一期就是 π_c/r（等比数列的无穷级数求和公式：首项除以 1−公比）。\n**【提示】**本题内容见范里安《微观经济学：现代观点》第九版第 366 页。`},
{id:'m107',special:'微观·博弈论与寡头结合',qid:'B1 ★',question:'有一个产业，厂商1已经进入该产业，厂商2观察厂商1的产量来决定自己是否进入产业以及相应的生产规模。市场的反需求函数为 p=56−2q，厂商1成本函数为 C1(q1)=20q1+f，厂商2的成本函数为 C2(q2)=20q2+f，其中 f 为固定成本。（1）给定厂商1的产量 q1，求厂商2的产量 q2 及利润 π2。（2）设 f=18，如果厂商2要求利润 π2 严格大于零才会进入该市场，那么厂商1预计到厂商2对 q1 的反应时，是允许厂商2进入该市场还是采取遏制措施阻止2进入？（3）若 f=2 时情况又如何？',answer:`**考察知识点**：序贯博弈、进入遏制、斯塔克尔伯格。\n**思路**：求追随者反应；比较垄断与允许进入的利润。\n**答案**：（1）q2=(18−q1)/2，π2=(18−q1)²/2−f。（2）f=18 时阻止进入。（3）f=2 时允许进入。
##**详解**
（1）给定厂商1的 q₁，厂商2的利润最大化问题为：max π₂=[56−2(q₁+q₂)]q₂−20q₂−f。由一阶条件可得 q₂=(18−q₁)/2，此即为厂商2的反应函数。将其代入厂商1的利润函数可得此时厂商1的利润为：
$$π₁^e=[56−2(q₁+(18−q₁)/2)]q₁−(20q₁+f)=−q₁^2+18q₁−f
厂商2的利润为：
$$π₂^e=[56−2(q₁+(18−q₁)/2)](18−q₁)/2−(20×(18−q₁)/2+f)=((18−q₁)²)/2−f
（2）当 f=18 时，厂商1和厂商2的利润分别是：π₁^e=−q₁^2+18q₁−18，π₂^e=((18−q₁)²)/2−18。
① 若厂商1允许厂商2进入行业，此时为产量领导模型。由 π₂^e>0 可以解得：q₁^e>24 或 q₁^e<12。由市场价格 p=56−2(q₁+q₂)=38−q₁≥0，可以解得：q₁≤38。综上 q₁^e∈(0,12)∪(24,38]。在此条件下，厂商1的利润最大化问题为：max π₁^e=−q₁^2+18q₁−18。一阶条件为：dπ₁^e/(dq₁)=−2q₁+18=0，解得：q₁^e=9，π₁^e=63。
② 若厂商1不允许厂商2进入行业，此时为垄断市场。由 π₂^e≤0 可以解得：12≤q₁^e≤24。此时厂商1垄断市场，其利润最大化问题为：max π₁^m=(56−2q₁)q₁−20q₁−18，s.t. 12≤q₁≤24。解得：q₁^m=12，π₁^m=126。由于 π₁^m>π₁^e，所以显然厂商1会选择垄断市场，不允许厂商2进入行业。
（3）当 f=2 时，厂商1和厂商2的利润分别是：π₁^e=−q₁^2+18q₁−2，π₂^e=((18−q₁)²)/2−2。
① 若厂商1允许厂商2进入行业，此时为产量领导模型。由 π₂^e>0 可以解得：q₁^e>20 或 q₁^e<16。由市场价格 p=56−2(q₁+q₂)=38−q₁≥0，可以解得：q₁≤38。综上 q₁^e∈(0,16)∪(20,38]。在此条件下，厂商1的利润最大化问题为：max π₁^e=−q₁^2+18q₁−2。一阶条件为：dπ₁^e/(dq₁)=−2q₁+18=0，解得：q₁^e=9，π₁^e=79。
② 若厂商1不允许厂商2进入行业，此时为垄断市场。由 π₂^e≤0 可以解得：16≤q₁^e≤20。此时厂商1垄断市场，其利润最大化问题为：max π₁^m=(56−2q₁)q₁−20q₁−2，s.t. 16≤q₁≤20。解得：q₁^m=16，π₁^m=62。由于 π₁^e>π₁^m，所以厂商1会选择不垄断市场，允许厂商2进入行业。`},
{id:'m108',special:'微观·要素需求与供给',qid:'A1 ★★',question:'设某大学教授A需要雇佣一名研究助理来协助自己完成某项科研项目。研究助理的科研产出和他的工作时间之间的关系是 Q=12L−L²。教授A认为该研究助理每单位科研产出的价值为10元。（1）科研助理的边际收益产品是多少？（2）设该大学中有100名和教授A一样的教授需要雇佣研究助理。那么这个大学对研究助理的总需求是多少？（3）设研究助理的总供给曲线为 LS=15w。w研究助理的工资。那么该学校研究助理市场的均衡工资是多少？（4）在均衡工资水平下，教授A需要他的研究助理为他工作多少小时？（人大 2012 年考题）',answer:`**考察知识点**：边际收益产品、要素需求、市场均衡。\n**思路**：求 MRP；加总需求；供求相等。\n**答案**：（1）MRP=120−20L。（2）Ld=600−5w。（3）w=30。（4）L=4.5。
##**详解**
（1）边际收益产品是指由于使用额外一单位投入品所带来的总收益的增加，它等于投入的边际产品乘以厂商的边际收益。由已知有边际产出为：MP_L=dQ/dL=12−2L，边际收益为 MR=10，则科研助理的边际收入产品为：MRP=MP_L× MR=(12−2L)×10=120−20L。
（2）教授雇佣研究助理的原则是 w=MRP，因此，单个教授的研究助理需求为：w=120−20L，即：L=6−w/20，从而这个大学对研究助理的总需求是：L_d=100L=600−5w。
（3）该学校研究助理市场的均衡时，研究助理的需求等于供给，即有：600−5w=15w，解得 w=30。即该学校研究助理市场的均衡工资是30元。
（4）当 w=30 时，L=6−w/20=4.5，故教授A需要他的研究助理为他工作4.5小时。`},
{id:'m109',special:'微观·要素需求与供给',qid:'A2 ★★★',question:'一个消费者要分配24小时给工作和休闲。她的效用来自于休闲时间 R 和收入 I，她工作一小时的工资率为 PL，她一天的效用函数为 U(R,I)=48R+RI−R²。（1）给出这个消费者的劳动供给函数。（2）她工作的时间会随着工资率的增加而增加吗？（3）不管工资率有多高，她的工作时间有一个极限吗？',answer:`**考察知识点**：劳动供给、效用最大化。\n**思路**：预算约束 I=(24−R)PL；对 R 求最大化。\n**答案**：（1）L=12PL/(1+PL)。（2）会，∂L/∂PL>0。（3）有，L<12。
##**详解**
（1）消费者的收入为 I=(24−R)P_L，整理可得该消费者的预算约束为：P_LR+I=24P_L。消费者目标是效用最大化，即：max 48R+RI−R²，s.t. P_LR+I=24P_L。将预算约束代入目标函数可得：max 48R+R(24P_L−P_LR)−R²。由一阶条件可得：dU/dR=48+24P_L−2P_LR−2R=0。解得最优的闲暇量：R=(24+12P_L)/(1+P_L)。因此劳动供给 L=24−R=(12P_L)/(1+P_L)，此即为消费者的劳动供给函数。
（2）因为
$$∂L/∂P_L=(12(1+P_L)−12P_L)/((1+P_L)²)=12/((1+P_L)²)>0
所以该消费者工作的时间会随着工资率的增加而增加。
（3）由于 L=(12P_L)/(1+P_L)=12/(1+1/P_L)<12，所以不管工资率有多高，她的工作时间不会超过12小时。`},
{id:'m110',special:'微观·要素需求与供给',qid:'B1 ★',question:'某厂商的生产函数为 q=f(x)，已知 f′(x)>0，f″(x)<0，该厂商只需要劳动这一种生产要素，市场对该产品的反需求函数 p(q) 是单调递减的，要素市场的工资率为 w。（1）若厂商在产品市场上是垄断者，而在要素市场上是完全竞争的，该如何求厂商的要素需求函数？（2）若厂商在产品市场上也是竞争的，又该如何求要素需求函数？（3）在前两小问所述的两种情况下，厂商对产品的要素需求量有何变化？请为你的结论给出严格证明。（北大考题）',answer:`**考察知识点**：要素需求、垄断与竞争、比较。\n**思路**：分别写利润最大化一阶条件；比较均衡条件。\n**答案**：（1）p′(f(x))f′(x)f(x)+p(f(x))f′(x)=w。（2）pf′(x)=w。（3）垄断下要素需求量小于竞争下，证明略。
##**详解**
（1）因为要素市场是完全竞争的，所以厂商在要素市场上是要素价格的接受者，此时厂商利润最大化问题为：max π=p[f(x)]f(x)−wx。利润最大化的一阶条件为：p'(f(x))f'(x)f(x)+p(f(x))f'(x)−w=0，此即为要素需求函数。
（2）厂商在产品市场和要素市场都是完全竞争的，此时厂商利润最大化问题为：max π=pf(x)−wx。利润最大化的一阶条件为：pf'(x)=w，此即为厂商的要素需求函数。
（3）令 x_c 为产品市场完全竞争条件下要素的需求量，x_m 是产品市场垄断条件下要素需求量。在完全竞争条件下：pf'(x_c)=w。垄断条件下：
$$[p'(f(x_m))f(x_m)+p(f(x_m))]f'(x_m)=w
可以断言 x_c>x_m，下面利用反证法求证：假设 x_c<x_m。由于 f''(x)<0，则 f'(x_m)<f'(x_c)。由于 f'(x)>0，则 f(x_m)>f(x_c)，进一步因为 p'(f(x))<0，则 p(f(x_m))<p(f(x_c))。因此有
$$[p'(f(x_m))f(x_m)+p(f(x_m))]f'(x_m)<p(f(x_m))f'(x_m)<p(f(x_c))f'(x_c)=w
此时出现了 [p'(f(x_m))f(x_m)+p(f(x_m))]f'(x_m)<w，这与厂商利润最大化的条件矛盾，因此必然有 x_c>x_m，即在完全竞争条件下要素需求量比垄断条件下要素需求量大。`},
{id:'m111',special:'微观·要素市场均衡与干预',qid:'A1 ★★★',question:'假设劳动市场完全竞争。劳动需求方程是 L=−50w+450，供给方程是 L=100w。这里，L 表示雇佣劳动的数量，w 代表每小时的实际工资率。（1）在这一市场上，w 与 L 各为多少时，才能达到均衡？（2）假设政府希望通过给雇主提供补贴的方法，使均衡时的工资为每小时4美元，这份补贴应该是多少？就业的均衡水平又是多少？补助的总额是多大？（3）假如政府宣布最低工资率为每小时4美元，在这种价格下，需要多少劳动？有多少人失业？（4）进一步假设劳动的需求均来自于生产产品A的厂商，A产品市场中厂商拥有相同的技术，且生产函数均为 qA=L^0.5，且产品A的市场价格 pA=6，求没有政府干预时每个厂商的要素使用量以及厂商数目。',answer:`**考察知识点**：劳动市场均衡、补贴、最低工资、厂商要素需求。\n**思路**：供求相等；补贴使 wD=wS−s；最低工资下取需求；厂商利润最大化。\n**答案**：（1）w=3，L=300。（2）补贴3；L′=400；补贴总额1200。（3）需求250，失业150。（4）每个厂商 L=1，厂商数600。
##**详解**
（1）劳动市场的均衡条件为：L_D=L_S，即：−50w+450=100w。联立解得均衡工资和劳动量分别为：w=3，L=300。
（2）假设政府对雇主每单位劳动补贴 s 美元，那么此时雇主支付的价格和劳动者获得的支付（工资）满足：w_D=w_S−s。此时均衡条件为：
$$｛L_D=L_S；w_D=w_S−s；L_D=−50w_D+450；L_S=100w_S｝
联立解得均衡工资和劳动量分别为：w_S=3+(1/3)s，L'=300+(100/3)s。要想使工资为4，则 s=3，此时均衡的劳动量 L'=400，补贴额为1200。
（3）如果最低工资率为4，此时劳动需求量 L_D=250，劳动供给量 L_S=400，失业人数为150。
（4）由（1）可知，要素市场均衡工资 w=3。此时代表性厂商的利润最大化问题为：max π=p_Aq_A−wL=6L^(0.5)−3L。利润最大化的一阶条件为：dπ/dL=3L^(−0.5)−3=0。解得厂商要素使用量 L=1，所以厂商数目 n=600/1=600。`},
{id:'m112',special:'微观·要素市场均衡与干预',qid:'A2 ★★★',question:'偏远小镇上，独一公司是唯一雇主。该公司对劳动力的需求为：w=12−2L，其中 w 是工资率，劳动供给函数为 w=2L。（1）独一公司将雇用多少工人？工资率是多少？（2）如果当地的最低工资率是7，独一公司将雇用多少工人？（3）假设劳动市场不是买方垄断而是完全竞争，（1）和（2）两问的答案又是什么？',answer:`**考察知识点**：买方垄断、最低工资、完全竞争。\n**思路**：买方垄断 MFC=VMP；最低工资下取需求；完全竞争供求相等。\n**答案**：（1）L=2，w=4。（2）L=2.5。（3）完全竞争下（1）L=3，w=6；（2）不变。
##**详解**
（1）由买方垄断厂商利润最大化的条件可知 WFC=VMP，即：4L=12−2L。解得均衡的劳动量 L=2，将其代入劳动供给函数，得到均衡的工资 w=4。
（2）在最低限价的条件下，厂商在要素市场上是要素价格的接受者，当最低工资为7时，此时厂商对于要素的需求量 L_d=6−(1/2)w=6−(1/2)×7=2.5。要素供给量 L_s=1/2w=1/2×7=3.5。均衡的劳动量由需求方决定，因此均衡量 L=L_d=2.5，此时最低限价增加了就业量。
（3）如果劳动力市场是完全竞争的，对于第（1）问，根据劳动力市场上供给等于需求可知：12−2L=2L。解得：L=3，w=6。第（2）问的答案不变，此时最低工资会带来失业。`},
{id:'m113',special:'微观·要素市场均衡与干预',qid:'A3 ★★★',question:'假设只有一家香烟生产者收购大量农户所生产的烟叶，烟叶市场的供给曲线为 W=X，W 和 X 分别表示烟叶价格及烟叶供给量。香烟生产者的边际产品收益为 30−X。试求：（1）烟叶生产量与烟叶价格。（2）假设政府规定的烟叶最低收购价格为 W=12，且禁止低于烟叶最低收购价的交易行为，则烟叶种植农户与香烟生产者的剩余如何变化？（上财考题）',answer:`**考察知识点**：买方垄断、最低收购价、剩余分析。\n**思路**：MRP=MFC；最低价下供给决定数量；计算剩余变化。\n**答案**：（1）X=10，W=10。（2）烟农剩余增加22，香烟生产者剩余减少6。
##**详解**
（1）收购烟叶的香烟生产者为买方垄断者，根据烟叶的供给曲线 W=X 可知，香烟生产者的总成本 TC=X²，因此其边际要素成本 MFC=2X。买方垄断条件下厂商要素需求的原则为 MRP=MFC，即 30−X=2X。解得均衡的烟叶数量 X=10，将其代入烟叶供给函数可得烟叶价格 W=10。
（2）政府规定最低限价时，此时香烟生产者是烟叶价格的接受者，在最低收购价格 W=12 下，烟叶的需求量 X_d=18，烟叶的供给量 X_s=12，此时均衡数量由供给方决定，因此均衡的烟叶数量和烟叶价格分别为 X'=12，W'=12。
如下图所示，没有规定最低收购价格时，烟叶均衡价格 W=10。因此烟叶生产者的剩余
$$PS_(烟叶生产者)=S_(OBD)=1/2×10×10=50
香烟生产者的剩余
$$CS_(香烟生产者)=S_(BDF)=1/2×[(20−10)+(30−10)]×10=150
政府规定最低限价时，此时香烟生产者是烟叶价格的接受者，在最低收购价格 W=12 下，烟叶的需求量 X_d=18，烟叶的供给量 X_s=12，此时均衡数量由供给方决定，因此均衡的烟叶数量和烟叶价格分别为 X'=12，W'=12。
此时烟叶生产者的剩余
$$PS_(烟叶生产者)=S_(OHE)=1/2×12×12=72
香烟生产者的剩余
$$CS_(香烟生产者)=S_(HLF)=1/2×[(18−12)+(30−12)]×12=144
可见，政府实施价格管制后，烟叶生产者的剩余增加了22，香烟生产者的剩余减少了6。
【此处有图示】`},
{id:'m114',special:'微观·要素市场均衡与干预',qid:'B1 ★★',question:'假设某个小镇有两个行业，一个生产服装，另一个生产钢铁。服装行业的生产函数为 yc=lc，钢铁行业生产函数为 ys=24√ls−2ls，lc 与 ls 分别是服装与钢铁行业的工人数。小镇中所有居民都会进入某个行业，居民的总人数为25，假设两个行业都是竞争性的，产品价格都是1。（1）假如劳动市场是竞争性的，服装业和钢铁业分别会雇佣多少工人，市场的工资是多少？（2）如果只有钢铁工人组成一个工会，它垄断性地向钢铁行业提供劳动力，工会的利益是最大化该本行业工人的总劳动收入，问此时服装业和钢铁业分别会雇佣多少工人，每个行业的工资会是多少？（3）如果两个行业的工人共同组成一个工会，它垄断性地向两个行业提供劳动力，工会的利益是最大化行业工人的总劳动收入，问此时服装业和钢铁业分别会雇佣多少工人，每个行业的工资会是多少？',answer:`**考察知识点**：劳动市场均衡、工会垄断、总劳动收入最大化。\n**思路**：竞争均衡 VMP=w；工会最大化总工资；联立求解。\n**答案**：（1）ls=16，lc=9，w=1。（2）ls=9，lc=16，ws=2，wc=1。（3）ls=4，lc=21，ws=4，wc=1。
##**详解**
（1）因为劳动市场完全竞争均衡，故设服装行业和钢铁行业的工资为 w_c=w_s=w。服装行业的生产函数为 y_c=l_c，所以服装行业工人的边际产量 MP_c=1，因为产品价格为1，所以服装行业工人的边际产品价值 VMP_c=P· MP_c=1，又因为劳动市场完全竞争，所以有 VMP_c=w_c=w_s=1。
对于钢铁行业，工人的边际产量 MP_s=12/√(l_s)−2，边际产品价值 VMP_s=P· MP_s=12/√(l_s)−2，劳动市场完全竞争，所以 VMP_s=w_s=1，即 12/√(l_s)−2=1，解得 l_s=16。因为 l_s+l_c=25，所以 l_c=9。
（2）此时服装行业因为没有发生变化，所以 VMP_c=w_c=1。但是钢铁行业发生了变化，产品市场依然是完全竞争市场而劳动市场不再是完全竞争市场，钢铁行业利润函数为：π_s=p_sy_s−w_sl_s=24√(l_s)−2l_s−w_sl_s。假如给定了钢铁行业工人的工资，则根据利润最大化的一阶条件，有：(dπ_s)/(dl_s)=12/√(l_s)−2−w_s=0。整理可得：w_s=12/√(l_s)−2，可以把该式看成是钢铁行业对工人工资的一个反应函数。
此时工会的目标是最大化收入函数，即 max R_s=w_sl_s。把反应函数 w_s=12/√(l_s)−2 代入该目标函数，得：max R_s=12√(l_s)−2l_s。则根据收入最大化的一阶条件，有：(dR_s)/(dl_s)=6/√(l_s)−2=0。解得：l_s=9，因为 l_s+l_c=25，所以 l_c=16。此时钢铁行业的工人工资为 w_s=12/√(l_s)−2=2。
（3）此时工会的目标函数是：max π=w_cl_c+w_sl_s。服装行业利润最大化问题为：max π_c=p_cy_c−w_cl_c=l_c−w_cl_c。由利润最大化的一阶条件解得：w_c=1。钢铁行业利润最大化问题为：max π_s=p_sy_s−w_sl_s=24√(l_s)−2l_s−w_sl_s。由利润最大化的一阶条件解得：w_s=12/√(l_s)−2。因为 l_s+l_c=25，所以工会的目标函数变为：max π=w_cl_c+w_sl_s=25−l_s+(12/√(l_s)−2)l_s。由一阶条件可得：dπ/(dl_s)=6/√(l_s)−3=0。解得：l_s=4，所以 l_c=21，w_s=12/√(l_s)−2=4。`},
{id:'m115',special:'微观·上下游垄断',qid:'A1 ★★',question:'假定垄断厂商A和垄断厂商B具有共同信息。垄断厂商A生产的产品为 xs，边际成本为常数20。垄断厂商A将其产品销售给垄断厂商B的单位为 k。垄断厂商B利用生产要素 x 生产最终产品 y，生产函数为 y=x。假设最终产品 y 的市场需求函数为 P(y)=100−2y。试求：（1）垄断厂商A的定价 k；（2）最终产品的产量和价格；（3）各垄断厂商的利润。（上财 2004 年考题）',answer:`**考察知识点**：上下游垄断、双重加价。\n**思路**：B根据 MR=MC 决定 x 需求；A面临需求曲线，再最大化利润。\n**答案**：（1）k=60。（2）y=10，P=80。（3）πA=400，πB=200。
##**详解**
（1）由于垄断厂商A和垄断厂商B具有共同信息，垄断厂商A在制定价格时，会考虑到垄断厂商B的情况。由题意，垄断厂商B生产1单位 y 需要1单位生产要素 x，且1单位 x 的价格为 k，所以 MC_B=k。由市场需求函数 P(y)=100−2y 得边际收益 MR_B=100−4y。根据均衡条件 MR_B=MC_B，可得垄断厂商B对 x 的需求函数为 x=(100−k)/4，这同时也是垄断厂商A的产量。可知，垄断厂商A面临的需求曲线为 k=100−4x，TR_A=kx=100x−4x²，故可得边际收益 MR_A=100−8x。根据均衡条件 MR_A=MC_A，可得 x=10，k=100−4x=60。即垄断厂商A的定价为60。
（2）最终产品的产量 y=x=10，P=100−2y=80。
（3）各垄断厂商的利润分别为：垄断厂商A：π_A=TR_A−TC_A=kx−20x=60×10−20×10=400；垄断厂商B：π_B=TR_B−TC_B=py−kx=80×10−60×10=200。`},
{id:'m116',special:'微观·上下游垄断',qid:'B1 ★★',question:'市场中一厂商生产和销售跑鞋。它面对的市场需求函数为 P=11−1.5QS，其中 QS 为销售跑鞋的数量，P 是以美元计的价格。生产一双跑鞋需要一单位的皮革。皮革由该厂商的生产部门成形和切割。皮革的成本函数是：TCL=1+QL+0.5QL²，其中，QL 是生产皮革的数量。跑鞋的成本函数（不包括皮革）是：TCS=2QS。（1）跑鞋的最优价格是多少？（2）皮革可以以价格 PL=1.5 在一竞争性市场上买卖，在这种情况下，皮革的市场价格为多少？生产部门应该内部供应多少皮革？它应该向外部市场供应多少？该厂商会在外部市场购买皮革吗？（3）现在假设该皮革是独特的和质量特别高的。因而，生产部门可能会作为外部市场的垄断供应商来供给外部市场。假设对皮革的外部需求由 P=32−QL 给出。此时，皮革卖到外部市场的价格应是多少？向外部市场销售的数量是多少？',answer:`**考察知识点**：内部转移定价、竞争性市场、垄断供应商。\n**思路**：分别按内部一体化、竞争市场、垄断外部市场求解。\n**答案**：（1）PS=8。（2）市场价格1.5；内部生产0.5，外部购买2。（3）只生产皮革，QL=31/3，PL=65/3。
##**详解**
（1）厂商利润函数为：π=(11−1.5Q_S)Q_S−2Q_S−(1+Q_L+0.5Q_L²)。因为生产一双鞋需要一单位皮革，所以 Q_S=Q_L，则：π=(11−1.5Q_L)Q_L−2Q_L−(1+Q_L+0.5Q_L²)。利润最大化的一阶条件为：dπ/(dQ_L)=11−3Q_L−2−1−Q_L=0。解得：Q_L=2，所以 Q_S=2，跑鞋的价格 P_S=11−1.5×2=8。
（2）如果皮革可以以价格 P_L=1.5 美元在一竞争市场上买卖，这一价格低于生产部门自己生产皮革的边际成本3美元，因此皮革的市场价格应为1.5美元。生产部门应使得皮革边际成本等于价格，即：1+Q_L=1.5，解得 Q_L=0.5。此时厂商的利润函数为：π=(11−1.5Q_L)Q_L−2Q_L−1.5Q_L。利润最大化的一阶条件为：dπ/(dQ_L)=11−3Q_L−2−1.5=0。解得：Q_L=2.5，即厂商需要的皮革总量为2.5单位，其中厂商自己生产0.5单位（内部供应的数量），并从外部市场购买2单位。
（3）如果生产部门同时向内部和外部市场供应皮革，假设 Q_S、Q_L 分别为内部供应量和外部供应量。为生产一双鞋需要一单位皮革，所以内部供应的皮革数量 Q_S 就是生产的跑鞋数量。此时厂商利润函数为：
$$π=(11−1.5Q_S)Q_S+(32−Q_L)Q_L−[2Q_S+1+(Q_S+Q_L)+0.5(Q_S+Q_L)²]
利润最大化的一阶条件为：
$$∂π/∂Q_S=11−3Q_S−2−1−(Q_S+Q_L)=0
$$∂π/∂Q_L=32−2Q_L−1−(Q_S+Q_L)=0
解得：Q_S<0，所以此时厂商将不会再生产跑鞋，而是只生产和销售皮革。当生产部门只向外部市场供应皮革时，厂商利润函数为：π=(32−Q_L)Q_L−(1+Q_L+0.5Q_L²)。利润最大化的一阶条件为：dπ/(dQ_L)=32−2Q_L−1−Q_L=0。解得：Q_L=31/3，市场价格 P_L=65/3，即生产部门向外部市场供应的皮革数量为 (31/3)，皮革的市场价格为 (65/3)。`},
{id:'m117',special:'微观·交换的一般均衡',qid:'A1 ★★★',question:'考虑有2×2交换经济，2种商品为X和Y，2个消费者A和B，消费者A的效用函数为 uA=xAyA，初始票赋为 wA=(2,2)；消费者B的效用函数为 uB=xByB²，初始票赋为 wB=(3,3)，一个决策者断言 (xA,yA)=(4,1) 和 (xB,yB)=(1,4)，以及 pX=pY=1 是竞争均衡。（1）请问决策者断言的均衡配置是初始票赋的帕累托改进吗，请解释。（2）在这个价格下，请分别求出消费者A和B的最优消费向量。（3）根据前面的计算，决策者断言的配置向量和价格是竞争均衡吗，如果不是，请计算竞争均衡。（中国人民大学考题）',answer:`**考察知识点**：交换经济、帕累托改进、竞争均衡。\n**思路**：比较效用；求最优消费；验证市场出清。\n**答案**：（1）不是，B效用下降。（2）A：(2,2)，B：(2,4)。（3）不是；竞争均衡为 pX/pY=2/3，A：(5/2,5/3)，B：(5/2,10/3)。
##**详解**
（1）决策者断言的均衡配置不是初始禀赋的帕累托改进。在初始禀赋下，消费者A的效用 u_A=x_Ay_A=2×2=4，消费者B的效用 u_B=x_By_B²=3×3^2=27。在决策者断言下，消费者A的效用 u_A=x_Ay_A=1×4=4，消费者B的效用 u_B=x_By_B²=1×4^2=16。将初始禀赋下消费者的效用和决策者断言的均衡配置下的消费者效用相比较，消费者A的效用不变，消费者B的效用下降，因此，决策者断言的均衡配置不是初始禀赋的帕累托改进。
（2）消费者A的效用最大化问题为：max x_Ay_A，s.t. x_A+y_A=4。构造拉格朗日函数并由一阶条件解得消费者A的最优消费量：x_A=y_A=2。同理可得在此价格体系下，消费者B的最优消费量：x_B=2，y_B=4。即 (x_A^*,y_A^*) 和 (x_B^*,y_B^*) 分别为（2，2）和（2，4）。
（3）在竞争均衡的条件下，需要满足：对于每个生产者来说达到利润最大化，对于每个消费者来说达到效用最大化，对于整个市场来说达到出清状态。由（2）可知，在 p_X=p_Y=1 时，消费者的最优消费量分别为（2，2）和（2，4），此时市场没有出清，所以决策者断言的状态不是竞争均衡状态。
设商品X价格为 p，商品Y的价格为1，即 p=p_X/p_Y。消费者A的效用最大化问题为：max x_Ay_A，s.t. px_A+y_A=2p+2。构造拉格朗日函数并由一阶条件解得：x_A=(p+1)/p，y_A=p+1。
消费者B的效用最大化问题为：max x_By_B²。构造拉格朗日函数并由一阶条件解得：x_B=(p+1)/p，y_B=2p+2。由市场出清条件可得：(p+1)/p+(p+1)/p=2+3。解得 p=2/3。因此消费者的消费量 (x_A,y_A)=(5/2,5/3)，(x_B,y_B)=(5/2,10/3)，价格之比 p=p_X/p_Y=2/3。`},
{id:'m118',special:'微观·交换的一般均衡',qid:'A2 ★★★',question:'a和b两人，在纯交换经济中，Ua=lnx1^a+2lnx2^a，Ub=lnx1^b+2lnx2^b，若初始禀赋为 a:(9,3)；b:(12,6)，求：（1）超额需求函数，并验证瓦尔拉斯定律。（2）均衡价格。（3）若总初始禀赋为(21,9)，求契约曲线。（北京大学真题）',answer:`**考察知识点**：纯交换经济、超额需求、瓦尔拉斯定律、契约曲线。\n**思路**：分别求需求；加总求超额需求；令超额需求为0；契约曲线满足 MRSA=MRSB。\n**答案**：（1）z1=3/p−14，z2=14p−3；验证略。（2）p=3/14。（3）契约曲线：x2a/(2x1a)=(9−x2a)/(2(21−x1a))。
##**详解**
｛x₁^a=3+1/p；x₂^a=6p+2｝，｛x₁^b=4+2/p；x₂^b=8p+4｝
$$｛x₁^a=3+1/p；x₂^a=6p+2｝，｛x₁^b=4+2/p；x₂^b=8p+4｝
商品1、2的超额需求分别为：
$$z₁=(x₁^a−w₁^a)+(x₁^b−w₁^b)=(3+1/p−9)+(4+2/p−12)=3/p−14
$$z₂=(x₂^a−w₂^a)+(x₂^b−w₂^b)=(6p+2−3)+(8p+4−6)=14p−3
此时瓦尔拉斯定律（瓦尔拉斯法则）：p₁z₁+p₂z₂=p(3/p−14)+(14p−3)=0 成立。
（2）均衡时满足市场出清条件：z₁=0，z₂=0。即：z₁=3/p−14=0，z₂=14p−3=0。解得：p=3/14，即商品1与商品2的价格之比 p₁/p₂=p=3/14。
（3）交换契约曲线上的点满足 MRS₁₂^a=MRS₁₂^b，即：x₂^a/2x₁^a=x₂^b/2x₁^b。禀赋条件为：x₁^a+x₁^b=9+12=21，x₂^a+x₂^b=3+6=9。因此上式可以进一步写为：x₂^a/2x₁^a=(9−x₂^a)/(2(21−x₁^a))，此即为交换的契约曲线。`},
{id:'m119',special:'微观·交换的一般均衡',qid:'A3 ★★★',question:'假定在一个经济中只有三种商品 (x1,x2,x3)，对于 x2 与 x3 的过度需求函数为 ED2=−3p2/p1+2p3/p1−1，ED3=4p2/p1−2p3/p1−2。（1）请证明这些函数关于 p1,p2 与 p3 是零次齐次的。（2）运用瓦尔拉斯法则证明，如果 ED2=ED3=0，ED1 也一定为零。能否同样用瓦尔拉斯法则去计算 ED1？（3）请解有关均衡相对价格 p2/p1 与 p3/p1 的方程组，p3/p2 的均衡值是多少？',answer:`**考察知识点**：零次齐次、瓦尔拉斯法则、均衡相对价格。\n**思路**：验证齐次性；利用瓦尔拉斯法则；解方程组。\n**答案**：（1）证明略。（2）可以；ED1 表达式略。（3）p2/p1=3，p3/p1=5，p3/p2=5/3。
##**详解**
（1）对任意的 t>0，有：
$$ED₂(tp)=−3(tp₂)/(tp₁)+2(tp₃)/(tp₁)−1=−3p₂/p₁+2p₃/p₁−1=ED₂(p)
$$ED₃(tp)=4(tp₂)/(tp₁)−2(tp₃)/(tp₁)−2=4p₂/p₁−2p₃/p₁−2=ED₃(p)
所以 ED₂ 和 ED₃ 关于 p₁，p₂，p₃ 是零次齐次的。
（2）根据瓦尔拉斯法则可知，均衡时每种商品的超额需求的价值之和为零，即：
$$p₁ED₁+p₂ED₂+p₃ED₃=0
若 ED₂=ED₃=0，则 p₁ED₁=0，可得 ED₁=0。把 ED₂ 和 ED₃ 的表达式代入上式中，可以解得：
$$ED₁=3p₂^2/p₁^2+2p₃^2/p₁^2−6(p₂p₃)/p₁^2+p₂/p₁+2p₃/p₁
（3）当市场达到均衡时，必有 ED₂=ED₃=0，即：
$$｛−3p₂/p₁+2p₃/p₁−1=0；4p₂/p₁−2p₃/p₁−2=0｝
解得：p₂/p₁=3，p₃/p₁=5，于是：p₃/p₂=(p₃/p₁)/(p₂/p₁)=5/3。`},
{id:'m120',special:'微观·交换的一般均衡',qid:'A4 ★★★',question:'经济体中有两种消费者A和B。已知两者的效用为：UA=XA+lnYA，UB=XBYB，已经知道A有3单位X和2单位Y，而B有1单位X和6单位Y，又知道经济体中有50个A消费者和100个B消费者。他们能够通过市场交易来实现效用的最大化。请推导市场的均衡价格和两类消费者的消费量。',answer:`**考察知识点**：交换经济、市场需求、均衡价格。\n**思路**：令 PX=1，求各消费者需求；加总超额需求；令为0。\n**答案**：PY=0.25；A：XA=2.5，YA=4；B：XB=1.25，YB=5。
##**详解**
首先设 P_X=1。先求解消费者A的需求函数，此时A的效用最大化问题为：max X_A+ln Y_A，s.t. X_A+P_YY_A=3+2P_Y。构造拉格朗日函数并由一阶条件解得：X_A=2+2P_Y，Y_A=1/P_Y。
再求解消费者B的需求函数，此时B的效用最大化问题为：max X_BY_B，s.t. X_B+P_YY_B=1+6P_Y。解得：X_B=1/2+3P_Y，Y_B=3+1/(2P_Y)。
因此商品X的超额需求函数为
$$50(X_A−3)+100(X_B−1)=50(2+2P_Y−3)+100(1/2+3P_Y−1)=400P_Y−100
当达到一般均衡时，超额需求为零，故得到 P_Y=0.25。代入到以上得到的消费者A、B的需求函数，得到：X_A=2.5，Y_A=4，X_B=1.25，Y_B=5。`},
{id:'m121',special:'微观·交换的一般均衡',qid:'A5 ★★★',question:'考虑一个拥有两个消费者和两种商品的纯交换经济。消费者A的效用函数为：UA(x1,x2)=3lnx1+lnx2，初始禀赋为 wA=(0,8)；消费者B的效用函数为：UB(x1,x2)=min(x1,x2)，初始禀赋为 wB=(8,0)。（1）请构造一个埃奇沃思盒状图清晰地描述出上述的纯交换经济；（2）假设商品1的价格是3，商品2的价格是1，请计算此时的消费者A的最优消费量；（3）请判断在第（2）题的价格体系下，该经济是否达到了具有帕累托最优的竞争均衡状态。如果达到了请给出证明或解释；如果没有达到，请说明价格应该如何调整才能趋于具有帕累托最优的竞争均衡状态。',answer:`**考察知识点**：埃奇沃思盒、竞争均衡、帕累托最优。\n**思路**：画图；A效用最大化；验证市场出清和契约曲线。\n**答案**：（1）图略。（2）x1A=x2A=2。（3）达到；市场出清且在契约曲线上。
##**详解**
（1）该交换经济的埃奇沃思盒形图如下图所示。由消费者A和消费者B的初始禀赋可得出埃奇沃思方框图的长和宽以及禀赋点。由消费者A和消费者B的效用函数可得出两人的无差异曲线。
【此处有图示】
（2）消费者A的效用最大化问题为：max 3ln x₁+ln x₂，s.t. 3x₁+x₂=8。构造拉格朗日函数：L=3ln x₁+ln x₂−λ(3x₁+x₂−8)。效用最大化的一阶条件为：∂L/∂x₁=3/x₁−3λ=0，∂L/∂x₂=1/x₂−λ=0，∂L/∂λ=8−3x₁−x₂=0。解得：x₁^A=x₂^A=2。
（3）在第（2）题的价格体系下，该经济达到了具有帕累托最优的竞争平衡。由题意可知，消费者B的效用函数为 U^B(x₁^B,x₂^B)=min(x₁^B,x₂^B)，所以B效用最大化的点满足 x₁^B=x₂^B，因此经济交换的契约曲线为 x₁^B=x₂^B。
当 p₁=3，p₂=1 时，消费者B的效用最大化问题为：max min(x₁,x₂)，s.t. 3x₁+x₂=24。解得B的消费量：x₁^B=x₂^B=6。此时市场超额需求 (x₁^A+x₁^B)−(w₁^A+w₁^B)=(2+6)−8=0，(x₂^A+x₂^B)−(w₂^A+w₂^B)=(2+6)−8=0。因此在（2）的价格体系下，市场实现竞争均衡，同时此时的消费组合点也位于交换的契约曲线 x₁^B=x₂^B 上，所以该经济达到了具有帕累托最优的竞争均衡。`},
{id:'m122',special:'微观·交换的一般均衡',qid:'A6 ★★',question:'A的效用函数为 uA(x1,x2)=x1+x2，B的效用函数为 uB(x1,x2)=max(x1,x2)，A和B有相同的初始禀赋，均为 (1/2,1/2)。（1）在埃奇沃思盒中给出这一情形。（2）p1 和 p2 之间的均衡关系是什么？什么是均衡分配？',answer:`**考察知识点**：交换经济、完全替代、均衡。\n**思路**：画无差异曲线；分析价格关系。\n**答案**：（1）图略。（2）均衡价格关系 p1=p2；均衡分配为(1,0),(0,1)或(0,1),(1,0)。
##**详解**
（1）消费者1的无差异曲线为斜率等于1的直线。消费者2的无差异曲线为顶点位于始自原点的45度线上，开口朝向原点的折线B。如下图所示，U_A 为消费者A的无差异曲线，U_B 为消费者B的无差异曲线。
【此处有图示】
（2）根据每个消费者的效用函数的形式可知，对于给定的一组商品的价格，每个消费者都选择消费价格便宜的那种商品，所以均衡时两种商品的价格必然相等。如果 p₁≠p₂，那么所有的消费者都会去买便宜的商品，而较贵的商品则无人购买，这就和均衡相矛盾。
在相等的价格条件下，消费者B选择只消费一种商品（这是因为消费者B的效用只取决于消费数量多的那种商品）。由于 p₁=p₂ 时，商品1和商品2对于消费者A来说是无差异的，所以此时消费者A只能选择消费另一种商品。
根据以上的分析可知：本题有两个均衡，即 (1,0),(0,1) 和 (0,1),(1,0)。均衡时的价格关系为：p₁=p₂。
