**【思考】**如果B的效用函数为 u_B(x₁,x₂)=min(x₁,x₂)，其他条件不变，均衡结果如何？2022年880（微宏观、政经）考过类似题目。`},
{id:'m123',special:'微观·交换的一般均衡',qid:'B1 ★★',question:'假设一个封闭的小国中只有A和B两个部落，在一个部落内人与人之间毫无差异，部落内的生产与消费都由其首领统一决定。两个部落消费的商品都只有食品（F）和衣物（C）两种。两个部落的效用函数分别为：UA(Fa,Ca)=FaCa，UB(Fb,Cb)=FbCb。假设今年A部落的收成为20单位食品和10单位衣物，而B部落为10单位食品和20单位衣物。两个首领聚在一起讨论是否需要交换。（1）用 P=Pf/Pc 表示两个部落对于两种商品的各自需求。（2）两个部落之间会发生交换吗？运用食品的市场出清条件，找出均衡价格 P*。（3）在价格水平 P* 下，不用通过计算，你能直接回答衣物市场存在过度供给或者过度需求吗？为什么？（4）在价格水平 P* 下，得到的是一个帕累托最优的分配吗？为什么？（5）如果世界价格水平为 P<1，哪个部落相对更加愿意对外开放？请提供相应的数字验证。',answer:`**考察知识点**：交换经济、均衡价格、帕累托最优。\n**思路**：求需求函数；市场出清；比较效用。\n**答案**：（1）Fa=10+5/P，Ca=10P+5；Fb=5+10/P，Cb=5P+10。（2）会；P*=1。（3）无过度供给或需求。（4）是帕累托最优。（5）B部落更愿意开放。
##**详解**
（1）根据消费者效用最大化条件 MRS_(fc)=(MU_f)/(MU_c)=P_f/P_c=P。对于A部落有：C_a/F_a=P_f/P_c=P，因此 C_a=PF_a。A部落预算约束为：F_aP_f+C_aP_c=20P_f+10P_c，也即 F_aP+C_a=20P+10。将 C_a=PF_a 代入A部落的预算约束：F_aP+C_a=20P+10，可得：A部落对食品的需求函数为 F_a=10+5/P，对衣服的需求函数为 C_a=10P+5。
同理，对于B部落，效用最大化时有：C_b/F_b=P_f/P_c=P，因此 C_b=PF_b。代入B部落的预算约束 F_bP+C_b=10P+20 可得：B部落对食品的需求函数为 F_b=5+10/P，对衣服的需求函数为 C_b=5P+10。
（2）交换的帕累托最优条件为：MRS_(fc)^A=MRS_(fc)^B，即 C_a/F_a=C_b/F_b。由禀赋条件可得：F_a+F_b=20+10=30，C_a+C_b=10+20=30。因此 C_a/F_a=(30−C_a)/(30−F_a) 或 (30−C_b)/(30−F_b)=C_b/F_b，整理可得 F_a=C_a 或 F_b=C_b，此即为交换的契约曲线。显然初始禀赋点不在交换契约线上，因此两个部落必然发生交换。
由（1）可知A部落对食品的需求函数为 F_a=10+5/P，B部落对食品的需求函数为 F_b=5+10/P。因此食品的总需求 F=F_a+F_b=15+15/P，市场出清时满足条件：15+15/P=20+10。解得均衡价格 P^*=1。
（3）在均衡价格 P^*=1 下衣物市场不存在过度供给或者过度需求。因为假如存在过度供给的话，衣物的价格必然高于食品的价格，如果存在过度需求的话，衣物的价格必然低于食品的价格，此时均衡价格不可能等于1。
（4）显然，在均衡价格 P^*=1 得到的是一个帕累托最优的分配，因为此时的配置是A部落和B部落分别都得到15单位食品和15单位衣物，因此在交换契约线上，市场出清。
（5）根据（1）得到的A部落对食品和衣物的需求函数可以得到价格 P 下该部落的效用为：
$$U_a=F_aC_a=(10+5/P)(10P+5)=100+100P+25/P
根据（1）得到的B部落对食品和衣物的需求函数可以得到价格 P 下该部落的效用为：
$$U_b=F_bC_b=(5+10/P)(10+5P)=100+25P+100/P
A部落和B部落的效用差为：
$$U_a−U_b=75P−75/P=(75(P²−1))/P
因此当世界价格水平为 P<1 时，B部落的效用大于A部落的效用，因此B部落更愿意对外开放。举个数字例子：当 P=0.5 时，A部落经对外交换后的最大效用为200，B部落经对外交换后的最大效用为312.5，当然B部落更愿意对外交换。`},
{id:'m124',special:'微观·交换的一般均衡',qid:'B2 ★',question:'X和Y是某荒岛上唯一两个人，他们只消费椰子（N）和樱桃（B）两种商品。X的效用函数为 U(NX,BX)=NXBX，Y的效用函数为 U(NY,BY)=2NY+BY。X的初始禀赋为13单位椰子和5单位樱桃，而Y的初始禀赋为8单位椰子和6单位樱桃。求该经济最终的竞争性均衡结果。',answer:`**考察知识点**：交换经济、竞争性均衡。\n**思路**：求需求函数；分情况讨论角点解。\n**答案**：PN/PB=17/13；NX=143/17，BX=11，NY=214/17，BY=0。
##**详解**
不妨设 P_B=1。此时消费者X的效用最大化问题为：max N_XB_X，s.t. N_XP_N+B_X=13P_N+5。解得消费者X的需求函数为：N_X=(13P_N+5)/(2P_N)，B_X=(13P_N+5)/2。
（1）首先考虑在竞争性均衡时消费者都消费两种商品的情况。此时满足条件 MRS_(NB)^X=MRS_(NB)^Y=P_N/P_B=2，即此时 P_N=2。当 P_N=2，N_X=(13×2+5)/(2×2)=7.75，B_X=(13×2+5)/2=15.5>11，消费者X对樱桃的需求量大于樱桃的总禀赋，所以这样的竞争性均衡结果达不到。
（2）下面考虑在竞争性均衡时消费者Y只消费一种商品的情况。
① 如果 P_N<2。由于 MRS_(NB)^Y=2>P_N/P_B，此时消费者Y将只消费椰子，即 N_Y=(8P_N+6)/P_N，B_Y=0。对于消费者X，要想实现竞争性均衡，其消费的樱桃数量应该为11，即 B_X=(13P_N+5)/2=11，解得此时椰子的价格为 P_N=17/13，该价格水平小于2，满足前提假设。
② 如果 P_N>2。由于 MRS_(NB)^Y=2<P_N/P_B，此时消费者Y将只消费樱桃，即 N_Y=0，B_Y=8P_N+6。对于消费者X，要想实现竞争性均衡，其消费的椰子数量应该为21，即 N_X=(13P_N+5)/(2P_N)=21，解得此时椰子的价格为 P_N=5/29，该价格水平小于2，不满足前提假设。
综上所述，该经济最终实现的均衡为：
$$P_N/P_B=17/13, N_X=(13P_N+5)/(2P_N)=143/17, B_X=11, N_Y=(8P_N+6)/P_N=214/17, B_Y=0`},
{id:'m125',special:'微观·交换和生产一般均衡',qid:'A1 ★★★',question:'鲁滨逊每天花9小时采摘椰子和捕鱼。他花 T 小时可以获得 T^0.5 单位的椰子，花 T 小时可以获得 T^0.5/2 单位的鱼。他消费这两种商品的效用是这两种商品数的乘积。（1）求他的生产可能性边界；（2）他劳动一天可以获得多少椰子和鱼？（范里安课后题）',answer:`**考察知识点**：生产可能性边界、效用最大化。\n**思路**：设时间分配；消去时间得PPF；在PPF上最大化效用。\n**答案**：（1）x²+4y²=9。（2）x=3√2/2，y=3√2/4。
##**详解**
（1）假设鲁滨逊每天花 T 小时采摘椰子，由于他的工作总时间为9小时，则他用在捕鱼的工作时间为 9−T 小时。因此，他可以收获的椰子为 T^(1/2) 单位，可收获的鱼为 (1/2)(9−T)^(1/2) 单位。
假设横坐标为椰子的产量 x，纵坐标为鱼的产量 y。令 x=T^(1/2)，y=1/2(9−T)^(1/2)，化简得到 T=x²=9−4y²，整理即有 x²+4y²=9，x>0，y>0，此即生产可能性边界。
（2）由于鲁滨逊的效用函数是这两种商品数量的乘积，即 U(x,y)=xy。他面临的约束是 x²+4y²=9，x>0，y>0。此时最优化问题为：
$$max xy s.t. x²+4y²=9
构造拉格朗日函数得：L=xy−λ(x²+4y²−9)。效用最大化的一阶条件为：
$$∂L/∂x=y−2λ x=0
$$∂L/∂y=x−8λ y=0
$$∂L/∂λ=9−x²−4y²=0
解得：x=3√2/2，y=3√2/4。因此，他劳动一天可以得到 3√2/2 单位的椰子，3√2/4 单位的鱼。`},
{id:'m126',special:'微观·外部性',qid:'A1 ★★★',question:'在某个小镇，一个果园挨着一个养蜂场。果园生产水果，养蜂场供养蜂蜜。果树的花朵为蜜蜂提供花蜜，蜜蜂也促进花粉传播。假设水果的价格为每单位是2元，而蜂蜜的价格是每单位4元。令 H 表示蜂蜜的产量，A 表示水果的产量。假设果园的成本函数为 CA(A,H)=A²/100−2H，养蜂场的成本函数为 CH(A,H)=H²/100−2A。（1）如果果园和养蜂场独立决策，那么水果和蜂蜜的产量分别是多少？（2）社会最优的水果和蜂蜜的产量各是多少？',answer:`**考察知识点**：正外部性、独立决策、社会最优。\n**思路**：分别最大化各自利润；合并后最大化总利润。\n**答案**：（1）A=100，H=200。（2）A=200，H=300。
##**详解**
（1）如果果园和养蜂场独立决策，那么对于果园来说利润函数为：π_A=2A−(A²)/100+2H。利润最大化的一阶条件为：∂π_A/∂A=2−A/50=0。解得：A=100。
对于养蜂场来说利润函数为：π_H=4H−(H²)/100+2A。利润最大化的一阶条件为：∂π_H/∂H=4−H/50=0。解得：H=200。故如果果园和养蜂场独立决策，那么水果产量为100，蜂蜜产量为200。
（2）如果果园和养蜂场合并，此时两者作为一个整体，其目标为总体利润的最大化。此时决策者的目标函数为：π=π_A+π_H=4A+6H−(A²)/100−(H²)/100。总利润最大化的一阶条件为：∂π/∂A=4−A/50=0，∂π/∂H=6−H/50=0。解得：A=200，H=300。社会最优的水果和蜂蜜的产量分别为：A=200，H=300。`},
{id:'m127',special:'微观·外部性',qid:'A2 ★★★',question:'某钢铁企业S生产时向河中排放污染物，已知其成本函数为 Cs(s,x)=s²+x²−10x，其中 s 是生产钢铁的数量，x 是污染量。企业F是位于河边的渔场，它受到钢厂排污量 x 的影响，其成本函数为 Cf(f,x)=f²+x²+2x，其中 f 是鱼的产量。企业S和F分别是钢铁市场和鱼市场的价格接受者。（提示：钢铁厂、渔场的生产函数中不包括污染物）（1）企业S排污量是多少？找到社会最优的排污量 x。（2）如果政府准备向污染企业征收每单位 t 元的庇古税，为达到社会最优配置应征收多少税？（3）假设钢厂拥有这条河流，企业F向钢厂每少排放一单位污染物支付 q 元，均衡时的 q 和 x 为多少？比较均衡时的 x 和社会最优排污量。如果是渔场拥有这条河流，结果如何？',answer:`**考察知识点**：负外部性、庇古税、科斯定理。\n**思路**：私人最优 MCx=0；社会最优 MCx+MECx=0；征税和产权交易。\n**答案**：（1）私人 x=5；社会最优 x=2。（2）t=6。（3）q=6，x=2，与社会最优相同；产权归属不影响结果。
##**详解**
**【法一】**利润最大化角度。假设钢铁和鱼的价格分别为 p_s、p_f。
（1）此时钢铁厂的利润最大化问题为：max π_s=p_ss−(s²+x²−10x)。利润最大化的一阶条件为：∂π_s/∂s=p_s−2s=0，∂π_s/∂x=−2x+10=0。解得排污量 x=5。
此时社会最优化问题为：max π=p_ss−(s²+x²−10x)+p_ff−(f²+x²+2x)。一阶条件为：∂π/∂s=p_s−2s=0，∂π/∂f=p_f−2f=0，∂π/∂x=−2x+10−2x−2=0。解得社会最优排污量 x=2。
（2）征税后钢铁厂的利润最大化问题为：max π_s=p_ss−(s²+x²−10x+tx)。利润最大化的一阶条件为：∂π_s/∂s=p_s−2s=0，∂π_s/∂x=−2x+10−t=0。代入社会最优排污量 x=2 可得此时的税率 t=6。
（3）① 如果钢铁厂拥有河流。设钢铁厂最多可以排放污染物 x̄，则此时钢铁厂和渔场的利润最大化问题分别为：
$$max π_s=p_ss−[s²+x²−10x−q(x̄−x)]
$$max π_f=p_ff−[f²+x²+2x+q(x̄−x)]
钢铁厂和渔场利润最大化的一阶条件分别为：
$$∂π_s/∂s=p_s−2s=0, ∂π_s/∂x=−2x+10−q=0
$$∂π_f/∂f=p_f−2f=0, ∂π_f/∂x=−2x−2+q=0
联立解得 x=2，q=6，此时的 x 正是社会最优水平。
② 如果渔场拥有河流，那么钢铁厂向河流中每排放一单位污染需要向渔场支付 q 元。则此时钢铁厂和渔场的利润最大化问题分别为：
$$max π_s=p_ss−[s²+x²−10x+qx]
$$max π_f=p_ff−[f²+x²+2x]+qx
钢铁厂和渔场利润最大化的一阶条件分别为：
$$∂π_s/∂s=p_s−2s=0, ∂π_s/∂x=−2x+10−q=0
$$∂π_f/∂f=p_f−2f=0, ∂π_f/∂x=−2x−2+q=0
联立解得 x=2，q=6，此时的 x 正是社会最优水平。可以发现，无论是钢铁厂还是渔场得到产权，最终的均衡结果是相同的，并且等于社会最优的均衡结果，这就是科斯定理的结论，即最终帕累托均衡结果与初始产权分配无关。
**【法二】**成本最小化的角度。
（1）由 ∂C_s/∂x=0，得到 2x−10=0，x=5，即 S 会排放5单位的污染物。社会最优排放水平应当满足 (∂(C_s+C_f))/∂x=(∂(s²+f²+2x²−8x))/∂x=0，解得：4x−8=0，x=2，即社会最优排放水平为2单位污染物。
（2）征税后，∂C_s/∂x=(∂(s²+x²−10x+tx))/∂x=0，为了使得 x=2，解得：t=6。
（3）① 如果钢铁厂拥有河流。设钢铁场最多可以排放污染物 x̄，则此时钢铁厂和渔场的成本函数分别为：
$$C_s(s,x)=s²+x²−10x−q(x̄−x)
$$C_f(f,x)=f²+x²+2x+q(x̄−x)
成本最小化的一阶条件为：∂C_s/∂x=2x−10+q=0，∂C_f/∂x=2x+2−q=0。解得：q=6，x=2，此时的 x 正是社会最优水平。
② 如果渔场拥有河流，那么钢铁厂向河流中每排放一单位污染需要向渔场支付 q 元。则此时钢铁厂和渔场的成本函数分别为：
$$C_s(s,x)=s²+x²−10x+qx
$$C_f(f,x)=f²+x²+2x−qx
成本最小化的一阶条件为：∂C_s/∂x=2x−10+q=0，∂C_f/∂x=2x+2−q=0。解得：q=6，x=2，此时的 x 正是社会最优水平。可以发现，无论是钢铁厂还是渔场得到产权，最终的均衡结果是相同的，并且等于社会最优的均衡结果，这就是科斯定理的结论，即最终帕累托均衡结果与初始产权分配无关。`},
{id:'m128',special:'微观·外部性',qid:'A3 ★★★',question:'假定1和2两个厂商的成本函数分别为 C1=2Q1²+20Q1 和 C2=Q2²+150Q2−2Q1Q2，其中厂商1的生产有外在性，产品市场是完全竞争的。（1）如果每个厂商按其私人边际成本等于市场价格 P=200 来确定产量，它们的产量和利润分别是多少？（2）如果它们按社会边际成本等于市场价格来确定产量，它们的产量和利润分别是多少？（3）如果厂商1因此而亏损，政府应给他补贴多少？（南开考博题）',answer:`**考察知识点**：外部性、私人边际成本、社会边际成本、补贴。\n**思路**：分别按私人和社会边际成本定价；补贴使产量达到社会最优。\n**答案**：（1）Q1=45，Q2=70，π1=4050，π2=4900。（2）Q1=115，Q2=140，π1=−5750，π2=19600。（3）补贴 S1=280，总补贴32200。
##**详解**
（1）厂商1的边际成本为：MC₁=4Q₁+20。厂商2的边际成本为：MC₂=2Q₂+150−2Q₁。由于产品市场是完全竞争的，所以每个厂商的最优产量决策应当满足价格等于边际成本，即：
$$4Q₁+20=200
$$2Q₂+150−2Q₁=200
联立解得：Q₁=45，Q₂=70。利润为：π₁=PQ₁−C₁(Q₁)=4050，π₂=PQ₂−C₂(Q₂)=4900。
（2）社会成本函数是私人成本函数之和，即：C=2Q₁^2+20Q₁+Q₂^2+150Q₂−2Q₁Q₂。令社会边际成本函数等于市场价格，就有：
$$4Q₁+20−2Q₂=200
$$2Q₂+150−2Q₁=200
联立解得：Q₁=115，Q₂=140。利润为：π₁=−5750，π₂=19600。
（3）假设政府对厂商1每单位产品每件补贴 S₁，则其成本函数变为：C₁=2Q₁^2+20Q₁−S₁Q₁。此时厂商利润最大化的条件为 4Q₁+20−S₁=200。由于政府补贴的目的是使得厂商生产帕累托有效数量的产品，所以补贴后，厂商的最优产量应当是 Q₁=115，将其代入此时厂商1的一阶条件中可以解得 S₁=280。所以政府的总补贴 S₁Q₁=280×115=32200。`},
{id:'m129',special:'微观·外部性',qid:'A4 ★★★',question:'一家垄断的钢铁厂的成本函数为：C(q)=q²+60q+100，该企业面临的需求曲线为：p=200−q，但是钢铁厂每生产1单位的钢铁将产生0.1单位的污染物 z，即 z=0.1q。清理污染的成本函数为：污染总成本=100+400z，其中 z 为污染物数量。（1）如果企业可以自由排放污染物，其产品价格和产出水平是多少？（2）假定生产者必须内部化其外部性，即它必须支付污染成本，则其产品价格和产出水平为多少？（3）上述计划是否能够消除污染？请分别计算出（1）和（2）两种情形下的污染物数量。（4）假定政府希望通过用税收减少企业的污染排放。如果政府希望减少的污染物排放量与（2）中相同，则应该怎样设计税收政策？（中财803经济学综合 2018 年考题）',answer:`**考察知识点**：垄断、外部性内部化、税收。\n**思路**：分别写利润函数；一阶条件求最优；税收使产量降至社会最优。\n**答案**：（1）q=35，p=165。（2）q=25，p=175。（3）z1=3.5，z2=2.5；不能完全消除。（4）从量税 t=40。
##**详解**
（1）当企业可以自由排放污染物时，企业的总成本就是生产成本。此时企业的利润函数为：π=(200−q)q−(q²+60q+100)。利润最大化的一阶条件为：dπ/dq=200−2q−2q−60=0。解得 q=35，p=165，即当企业自由排放污染物时，产出水平为35，价格为165。
（2）当企业需要内部化负外部性时，企业的总成本函数变为：
$$TC(q)=(q²+60q+100)+(100+400z)=q²+100q+200
企业的利润函数为：π=(200−q)q−(q²+100q+200)。利润最大化的一阶条件为：dπ/dq=200−2q−2q−100=0。解得：q=25，p=175，即当企业支付污染成本时，产量为25，价格为175。
（3）企业不考虑污染成本时的污染物为：z₁=0.1×35=3.5。企业支付全部污染成本时的污染物为：z₂=0.1×25=2.5。所以生产者内部化其外部性的计划可以减少一部分污染，但不能完全消除污染。
（4）① 如果政府对企业征收从量税，设政府对每单位产出征收 t 单位的税收。此时企业的成本为：TC(q)=(q²+60q+100)+tq=q²+(60+t)q+100。此时企业的利润函数为：π=(200−q)q−[q²+(60+t)q+100]。利润最大化的一阶条件为：dπ/dq=200−2q−2q−60−t=0。如果政府希望减少的污染物排放量与（2）相同，则企业生产 q=25，代入上式得：t=40。
② 如果政府对企业征收总量税，设政府对该企业征收 T 单位的税收。此时企业的成本为：TC(q)=q²+60q+100+T。此时企业的利润函数为：π=(200−q)q−[q²+60q+100+T]。利润最大化的一阶条件为：dπ/dq=200−2q−2q−60=0。解得 q=35，不能达到减少污染量的目的。综上所述，政府对企业每单位产出40单位的税收，可以使污染排放量减少到与（2）相同的水平。`},
{id:'m130',special:'微观·外部性',qid:'A5 ★★★',question:'垄断企业的生产总成本函数为 2q²，面临的需求曲线为 QD=150−p。计算：（1）垄断企业利润最大化的产量是多少？社会有效率的产量是多少？（2）如果垄断企业生产还额外造成负外部性（如污染），每单位负外部性成本为 a，其中 0<a<50，求此时社会有效率的产量是多少？（3）在存在负外部性情况下，政府干预市场，如果让垄断企业生产社会有效率的产量，政府应该对垄断企业每单位产量进行补贴还是征税？大小是多少？',answer:`**考察知识点**：垄断、负外部性、社会最优、补贴/征税。\n**思路**：垄断 MR=MC；社会最优 P=SMC；比较私人产量和社会最优产量。\n**答案**：（1）垄断产量25；社会有效率产量30。（2）社会有效率产量 q=30−a/5。（3）a<25 时补贴 s=30−6a/5；a=25 时不干预；a>25 时征税 t=6a/5−30。
##**详解**
（1）由题可知，垄断企业的利润最大化问题为：max π=(150−q)q−2q²。利润最大化的一阶条件为：dπ/dq=150−2q−4q=0。解得产量 q=25，此即为垄断企业利润最大化的产量。
社会有效率的产量要求站在社会的角度此时不存在帕累托改进，此时需要满足条件 p=MC，即 150−q=4q，解得 q=30，即社会有效率的产量为30。
（2）考虑负外部性时，社会总成本 TC=2q²+aq，因此社会边际成本 SMC=4q+a，社会有效率的产量需要满足条件：p=SMC，即 4q+a=150−q，解得 q=30−a/5，此即为社会有效率的产量。由于 0<a<50，所以 20<q<30。
（3）由（1）可知私人最优产量为25，无论是否存在外部性，厂商私人最优产量都为25，因为厂商在进行决策时不考虑外部成本。
① 当 30−a/5>25，即 0<a<25 时，社会有效率的产量高于对厂商来说利润最大的产量（私人最优的产量）时，该产品供给不足，政府会给予企业补贴来激励企业增加产量。假设企业每生产1单位产品，政府给 s 元补贴。此时企业的利润最大化问题为：max π=(150−q)q−2q²+sq。一阶条件为：dπ/dq=150−6q+s=0。代入社会有效率的产量 q=30−a/5，解得 s=30−(6/5)a。
② 当 30−a/5=25，即 a=25 时，社会有效率的产量等于对厂商来说利润最大的产量，不需要政府干预。
③ 当 30−a/5<25，即 25<a<50 时，社会有效率的产量低于对厂商来说利润最大的产量，该产品供给过多，政府会向企业征税来激励企业降低产量。假设企业每生产1单位产品，政府征税 t 元。此时企业的利润最大化问题为：max π=(150−q)q−2q²−tq。一阶条件为：dπ/dq=150−6q−t=0。代入社会有效率的产量 q=30−a/5，解得 t=6/5a−30。`},
{id:'m131',special:'微观·外部性',qid:'A6 ★★★',question:'某一个地区的纸品市场的需求曲线和供给曲线如下：QD=160000−2000P，QS=40000+2000P，其中 QD 是需求数量，QS 是供给数量（单位是百吨），P 表示每百吨的价格。由于没有任何废水排放管制措施，造纸厂向河中排放了大量废水。这些由于污染所产生的边际外部成本由曲线 MEC=0.0006QS 给出。（1）在没有任何管制措施下，竞争性的产出和价格是多少？（2）计算社会最优的产量和价格。（3）解释为什么（1）和（2）中的答案不同。（4）如果政府打算对纸张生产征收单位产出税，税率设置在什么水平比较合适？',answer:`**考察知识点**：负外部性、社会最优、庇古税。\n**思路**：竞争均衡供求相等；社会最优 SMC=P；税收使外部成本内部化。\n**答案**：（1）P=30，Q=100000。（2）Q=62500，P=48.75。（3）忽视外部成本导致产出过多、价格过低。（4）t=37.5。
##**详解**
（1）竞争性均衡满足供求相等 Q_S=Q_D，即：40000+2000P=160000−2000P。可得竞争性价格为：P=30，产出为：Q=100000。
（2）由 Q_S=40000+2000P 可得私人边际成本为：P=0.0005Q_S−20=MC。因此，社会边际成本为：SMC=MC+MEC=0.0005Q_S−20+0.0006Q_S=0.0011Q_S−20。均衡时满足 SMC=P，即：0.0011Q−20=80−0.0005Q。从而可以解得社会最优的产出和价格分别为：Q=62500，P=48.75。
（3）在（2）中，在社会最优下，均衡产出减少，均衡价格提高，是因为考虑了外部成本。忽视外部成本会导致产出过多，从而以一个较低的价格出售。
（4）假设每单位产品征收 t 的税，则：
$$｛Q_S=40000+2000P_S；Q_D=160000−2000P_D；Q_S=Q_D=62500；P_D−P_S=t｝
解得 t=37.5。如果政府打算对纸张生产征收单位产出税，税率 t=37.5。`},
{id:'m132',special:'微观·外部性',qid:'A7 ★★',question:'市场中有两个捕鱼的企业，已经知道市场上鱼的价格为 p，而两家企业捕鱼的成本为：C(qi)=Qqi，其中 Q=q1+q2，i=1,2。（1）求纳什均衡时，两家企业的捕鱼量和利润；（2）若两家企业合并为一家，那么再问捕鱼量和利润；（3）比较（1），（2）的利润，问为什么会有这些差异。',answer:`**考察知识点**：公地悲剧、纳什均衡、合并。\n**思路**：分别求纳什均衡和合并后最优；比较利润。\n**答案**：（1）q1=q2=p/3，π1=π2=p²/9。（2）Q=p/2，π=p²/4。（3）合并利润更大，因外部性内部化。
##**详解**
（1）首先求两个企业的最优反应曲线。企业1的利润最大化问题为：max π₁=pq₁−(q₁+q₂)q₁。由利润最大化的一阶条件可得：∂π₁/∂q₁=p−2q₁−q₂=0。整理可得企业1的反应函数为：q₁=(p−q₂)/2。同理可得企业2的反应函数为：q₂=(p−q₁)/2。联立解得：q₁=q₂=p/3，此即为纳什均衡时的情况。两企业利润：π₁=π₂=1/9p²。
（2）若两家合并成一家后，利润最大化问题为：max π=p(q₁+q₂)−Qq₁−Qq₂=pQ−Q²。由利润最大化的一阶条件可得：∂π/∂Q=p−2Q=0，解得 Q=p/2，此时的利润 π=1/4p²。
（3）π=1/4p²>π₁+π₂=2/9p²，故企业合并后的利润大于两企业竞争时的利润总和。虽然企业生产对价格没有影响，但是由于 ∂C(q₁)/∂q₂>0，∂C(q₂)/∂q₁>0，两家企业捕鱼的行为都对另一家企业的利润有负的外部性，故当企业分别实现自身利润最大化时，实际捕鱼业的总边际收益小于边际成本，使利润总和小于企业合并后的利润。`},
{id:'m133',special:'微观·外部性',qid:'B1 ★★',question:'假设一个地区有两家企业，企业1是上游企业，生产 x 产品，生产函数为 x=g(Lx)。企业2是下游企业，生产 y 产品，其产量不仅取决于自身劳动投入，还取决于企业1的产量 X，生产函数为 y=f(Ly,x)，劳动力的工资为 w，x,y 产品的价格分别为 px,py。请证明：在存在外部性的情况下，追求利润最大化的企业会出现无效率的资源配置。（中国人民大学 2017 年考题）',answer:`**考察知识点**：外部性、利润最大化、资源配置效率。\n**思路**：比较私人利润最大化条件和社会最优条件；证明二者不等。\n**答案**：证明略。
##**详解**
对于整个社会构造利润函数：
$$π_s=p_xg(L_x)+p_yf(L_y,x)−w(L_x+L_y)
由利润最大化的一阶条件可知：
$$∂π_s/∂L_x=p_xdg(L_x)/(dL_x)+p_y∂f(L_y,x)/∂xdg(L_x)/(dL_x)−w=0
$$∂π_s/∂L_y=p_y∂f(L_y,x)/∂L_y−w=0
即社会资源配置达到最优时满足以下条件：
$$p_xdg(L_x)/(dL_x)+p_y∂f(L_y,x)/∂xdg(L_x)/(dL_x) =p_y∂f(L_y,x)/∂L_y
即：SMRP_L^x=SMRP_L^y。
但是追求利润最大化的厂商的行为不一定使得上述条件满足。对于企业1，其利润最大化问题为：max π_x=p_xg(L_x)−wL_x。最优投入量满足一阶条件：∂π_x/∂L_x=p_xdg(L_x)/(dL_x)−w=0⇒ MRP_L^x=w。同理，企业2有：p_y∂f(L_y,x)/∂L_y−w=0⇒ MRP_L^y=w。此时有：
$$p_xdg(L_x)/(dL_x)=p_y∂f(L_y,x)/∂L_y
显然，要使 SMRP_L^x=SMRP_L^y 成立，必须存在 ∂f(L_y,x)/∂x=0，即不存在外部效应时追求利润最大化的企业才会出现有效率的资源配置。\n**【提示】**本题来源是吴汉洪主编《高级微观经济学习题集》中外部性部分的一道原题，属于各名校考博必看习题书。`},
{id:'m134',special:'微观·外部性',qid:'B2 ★★',question:'假设有 n 个企业生产同样的商品，但它们的生产函数不同。这些企业的产出只由劳动力投入决定，所以生产函数可以写为 qi=fi(Li)。企业在生产过程中会造成一定的污染，各个企业产生的污染量是其劳动力投入的函数 gi(Li)。（1）假定政府想设置一个总污染上限 K，那么企业间最有效率的劳动力配置是怎样的？（2）依据企业的产量对企业征收统一的庇古税能否实现（1）中描述的有效率的资源配置？（3）假定政府不是根据企业的产量征税，而是对每单位污染征收庇古税。那么应该怎样制定税收？这一税收能否实现（1）中描述的资源配置？',answer:`**考察知识点**：外部性、庇古税、污染上限。\n**思路**：构造拉格朗日函数求最优配置；分析统一产量税和污染税的效果。\n**答案**：（1）条件略。（2）不能。（3）按 t=λ 征税，可以实现。
##**详解**
（1）当企业间整体达到利润最大化时，劳动力配置是有效率的。企业面临的选择问题为：
$$max pΣ_(i=1)^n f_i(L_i)−wΣ_(i=1)^n L_i
$$s.t. Σ_(i=1)^n g_i(L_i)=K
构造拉格朗日函数：
$$y=pΣ_(i=1)^n f_i(L_i)−wΣ_(i=1)^n L_i−λ(Σ_(i=1)^n g_i(L_i)−K)
即对每个企业而言，劳动力的最佳投入为劳动力的净边际产出等于工资。其中劳动力的净边际产出定义为劳动力的边际产出减去由影子价格衡量的污染的边际成本。
（2）对于企业 i 来说，征收税率为 t 的庇古税以后，企业利润最大化问题为：
$$max π_i=pf_i(L_i)−wL_i−tf_i(L_i)
其一阶条件为：∂π_i/∂L_i=pf_i'(L_i)−w−tf_i'(L_i)=0，即 f_i'=w/(p−t)。当税率 t 上升后，企业的边际产出应当上升以维持利润最大化的条件，在边际产出递减的假设之下，这意味着企业降低产出和劳动力雇佣。庇古税仅仅作用于企业的边际产出，由于每个企业生产函数不同，所以此时不存在一个统一的税率 t 使得每个企业都生产有效率的产量。
（3）当对每单位污染征收庇古税之后，企业 i 面临的利润最大化问题变为：
$$max π_i=pf_i(L_i)−wL_i−tg_i(L_i)
其一阶条件为：∂π_i/∂L_i=pf_i'(L_i)−w−tg_i'(L_i)=0，所以当 t=λ 时，税收能使得劳动力达到（1）中的最有效率的配置。`},
{id:'m135',special:'微观·外部性',qid:'B3 ★★',question:'考虑这样一个外部性问题：某工厂的产品市场是完全竞争的，价格为 p；它生产过程中的噪音会影响附近一个住户，但它可以采取措施控制其生产过程中的噪音。假设厂商的成本函数是 c(x,e)，其中，x 是产量，e 是噪音水平。成本函数满足 ∂c/∂x>0，∂c/∂e≤0。住户的效用函数是 u(e)=v(e)+w，v′(e)<0。除这个住户以外，假设厂商的生产对社会其他个体的利益没有影响。（1）推导利润最大化厂商的产出和噪音水平满足的一阶必要条件。（2）推导社会最优产量和噪音水平满足的一阶必要条件。（3）假设政府对厂商的产出水平征税，证明：即使厂商与住户间不存在交易，这种税收也必然是无效的。（4）假设政府能够测量厂商产生的分贝水平 e，并直接对噪音征收从量税。证明：适量的税收可以导致帕累托有效配置。（5）假设 e 是按 x 的比例生产的，即 e(x)=αx，证明：对厂商产量征税能够导致帕累托有效配置，并求最优税率。（6）如果厂商与住户可以进行科斯式的交易，上一小问的结果是否会受影响？',answer:`**考察知识点**：外部性、庇古税、科斯定理。\n**思路**：分别求私人和社会最优一阶条件；分析不同税收工具。\n**答案**：略。
##**详解**
（1）厂商的目标函数为：px−c(x,e)，利润最大化的一阶必要条件：
$$c_x(x,e)=p, c_e(x,e)=0
（2）整个社会的目标函数为：px+v(e)+w−c(x,e)，社会最大化的一阶必要条件：
$$c_x(x,e)=p, c_e(x,e)=v'(e)
（3）在税率 t 下，厂商的目标函数为：px−c(x,e)−tx，利润最大化的一阶必要条件：
$$c_x(x,e)+t=p, c_e(x,e)=0
此时对于产出征税不会影响厂商产生的噪音水平，因此这种税收是无效率的。
（4）若对噪音水平征税的税率为 T，厂商的目标函数为：px−c(x,e)−Te，利润最大化的一阶必要条件：
$$c_x(x,e)=p, c_e(x,e)=−T
所以选取 T^*=−v'(e) 可以达到最优配置。
（5）假设政府对每单位产量的税率为 r，厂商的目标函数为：px−c(x,α x)−rx，利润最大化的一阶必要条件为：
$$p−c_x(x,α x)−α c_e(x,α x)−r=0
所以选取 r^*=−α v'(e) 可以达到最优配置。
（6）在科斯交易可行的前提下，政府对厂商征税将使噪音低于社会最优水平。`},
{id:'m136',special:'微观·公共资源',qid:'A1 ★★',question:'某海湾盛产一种龙虾，附近有一个村子以捕龙虾为生。经营一艘捕虾船每个月花费200，如果有 x 艘捕虾船，捕龙虾船的总收入为 f(x)=1000(10.2x−x²)。（1）请计算最大化捕捉龙虾的总利润的船只数，此时的最大利润为多少？（2）实际情况下，每个村民都有捕虾的权利，因此，没有人可以限制别人的进入，此时会有多少艘捕虾船进入？利润水平又是如何？（3）该村委会决定发放捕虾许可证，提供许可证的成本为0，每张许可证只允许一艘船使用。该村委会的目标是最大化从发放许可证中获得的利润。请问该村委会对发放每一张许可证收费多少？村委会的利润为多少？（4）请问从经济直觉上说明为什么（2）问中的解是无效率的，而（3）问可以解决这种无效率问题？（北大光华 2014 年考题）',answer:`**考察知识点**：公地悲剧、许可证、外部性内部化。\n**思路**：总利润最大化；自由进入零利润；许可证收费使进入数最优。\n**答案**：（1）x=5，π=25000。（2）x=10，π=0。（3）每张许可证收费5000，村委会利润25000。（4）产权明晰解决外部性。
##**详解**
（1）总利润函数为：π=1000(10.2x−x²)−200x。利润最大化的一阶条件为：dπ/dx=1000(10.2−2x)−200=0。解得：x=5，因此总利润 π=1000×(10.2×5−5^2)−200×5=25000。
（2）可以自由进出时，均衡应使得每艘船的利润为零，即：(1000(10.2x−x²))/x=200。解得：x=10。
（3）设村委会对发放每一张许可证收费 p，村委会的利润为 T=px。对村民而言，每艘捕龙虾船的收入不变，仍为 f(x)/x=1000(10.2−x)，但每艘捕龙虾船的成本上升为 200+p，解 f(x)/x=200+p，得 x=10−p/1000。则村委会的利润 T=p(10−p/1000)。其一阶条件为：dT/dp=10−p/1000−p/1000=0。解得：p=5000，则 x=5，T=25000。即该村委会对发放每一张许可证收费5000，村委会的利润为25000。
（4）在（2）问的情况下，没有人可以限制别人的进入，是一种典型的公地的悲剧。公地的悲剧产生的根源是产权不明晰。在产权不明晰的前提下，虽然每个人的行为对其他人造成了不利影响，但是不必为此付费，以至于每个人都按照个人利益最大化行事，最终的结果是市场无效率。（3）问可以解决这种无效率问题，是因为明晰了产权。赋予村委会发放捕虾许可证的权力，相当于把捕虾的权力分配给了村委会，使所有村民必须先向村委会付费获得捕虾许可证（捕虾的权力）才能捕虾，迫使村民必须考虑自己行为的外部影响，实现了外部性内在化，也就解决了无效率问题。`},
{id:'m137',special:'微观·公共资源',qid:'A2 ★★',question:'在一个小岛上有两个湖和20个垂钓者，每个垂钓者可以在任意一个湖上垂钓。在X湖上，可以钓到的鱼的总数量由下式给出：FX=10lx−lx²/2，这里，lx 是湖上垂钓的人数。Y湖的钓鱼数量为：FY=5ly，每单位鱼的价格为1。（1）均衡时钓到鱼的总数会是多少？（2）该小岛的管理者曾经读过一本经济学的书，认为通过限制在X湖上垂钓的人数可以增加钓到的鱼的数量。为了最大化总的钓鱼量，被准许在X湖上垂钓的人数应是多少？在这种情况下钓到的鱼的总量是多少？（3）与强制机制相反，管理者决定发放在X湖上垂钓的执照。如果发放执照会带来最优的人力配置，那么，（为了在 X 湖垂钓而）获取执照的费用应该是多少？（4）解释这个问题如何揭示了产权和外部性之间的联系？',answer:`**考察知识点**：公共资源、最优配置、执照收费。\n**思路**：均衡时两湖人均钓鱼量相等；最大化总钓鱼量；执照费等于租金。\n**答案**：（1）总数100。（2）lx=5，ly=15，总数112.5。（3）执照费2.5。（4）产权界定可解决外部性。
##**详解**
（1）由题意可知，l_x+l_y=20，每个垂钓者可以在任意一个湖上垂钓时，均衡时每个湖每人平均的钓鱼量将相等，从而有：F_x/l_x=F_y/l_y，即：10−(1/2)l_x=5，从而可以解得：l_x=10，l_y=10。钓鱼总数为：
$$F_x=(10×10−(1/2)×10^2)+(5×10)=100
钓鱼总量函数为：
$$F=F_x+F_y=10l_x−0.5l_x²+5l_y=10l_x−0.5l_x²−5(20−l_x)=5l_x−0.5l_x²+100
（2）钓鱼总量函数为：F=F_x+F_y=10l_x−0.5l_x²+5l_y=10l_x−0.5l_x²−5(20−l_x)=5l_x−0.5l_x²+100。总钓鱼量最大化的一阶条件为：dF/(dl_x)=5−l_x=0，解得：l_x=5，l_y=15。最大化的钓鱼量为：F=5×5−0.5×5^2+100=112.5。
（3）假设为了获取执照的费用是 p，均衡时两个湖每人平均利润相等，即：(10l_x−(1/2)l_x²)/l_x=(5l_y)/l_y。解得：l_x=10−2p，代入 l_x=5 解得 p=2.5，此即为执照的费用。
（4）该例子证明了在存在外部性的情况下，“竞争性”资源配置可能并非最优。X湖上新增一位钓鱼者将对其他在X湖的钓鱼者造成负的外部性，因为它将降低平均钓鱼量。此处，X湖被视为公地。如果X湖属于私人领地，它的所有者将选择 l_x 来最大化总钓鱼量与每个钓鱼者的机会成本（钓鱼者可以在Y湖上的钓鱼量5）之差，即私人所有者的问题是：max F_x−5l_x，从而解得：l_x=5，这少于竞争性的钓鱼人数。`},
{id:'m138',special:'微观·公共资源',qid:'B1 ★★',question:'考虑有一个任何人都可以捕鱼的湖泊。如果捕鱼的渔夫数量是 n，则总共可以捕到 f(n) 千克鱼（每个渔夫可捕 f(n)/n 千克），f′(n)>0，f″(n)<0。假设鱼的市场价格 p 不受这个湖泊鱼产量的影响，每个渔夫捕鱼的成本是 c>0。（1）求参与捕鱼的渔夫的均衡人数；（2）求参与捕鱼的渔夫的最优人数，将其与（1）的结果比较，解释为什么二者不同；（3）如果这个湖泊是某人的私人财产，他会派多少渔夫去湖上捕鱼？（蒋殿春《高级微观经济学》课后题）',answer:`**考察知识点**：公地悲剧、最优人数、私人产权。\n**思路**：自由进入零利润；社会最优边际条件；私人产权最大化利润。\n**答案**：（1）f(n*)/n*=c/p。（2）f′(ns)=c/p，ns<n*，因外部性。（3）ns。
##**详解**
（1）在捕鱼人数为 n 时，每个渔夫的所得为 pf(n)/n−c，只要该式大于零，就会有新的渔夫加入捕鱼行业，所以，均衡时 pf(n)/n−c=0，均衡捕鱼人数 n^* 满足：f(n^*)/n^*=c/p。
（2）从社会最优出发，参与捕鱼的最优人数 n_s 为下列问题的解：
$$max_n p(f(n)/n−c)
一阶必要条件为：f'(n_s)=c/p。为了比较 n_s 和 n^*，将（1）中的结果变形：
$$c/p=f(n^*)/n^*=(f(n^*)−f(0))/n^*=f'(n̄)
其中最后一个等式用到了微分中值定理，n̄ 为 [0,n^*] 间的实数。因为 f''(n)<0，所以 f'(n) 为单调递减的，所以上述一阶条件只有唯一解，所以：n_s=n̄<n^*。这意味着自由放任会导致湖泊捕鱼的人过多。其原因在于每个渔夫都只考虑自己的捕鱼成本 c，不考虑他参与捕鱼将降低其他人能捕获的鱼量，这其实是一种负的外部性。
（3）如果湖泊是私产，业主派遣捕鱼的人数当然满足条件 f'(n_s)=c/p。`},
{id:'m139',special:'微观·公共资源',qid:'B2 ★★',question:'乔治海滩是新英格兰海岸外鱼的高产地区，但根据鱼的总数可分为两个区域。1区每平方英里鱼的总数较高，但它对捕鱼努力来说是报酬严重递减的。1区每天的捕捞量（以吨计算）是：F1=200X1−2X1²，式中 X1 是在那里捕鱼的船只数目。2区每平方英里的鱼少些，但也大些，并且报酬递减也不那么成问题。它每天的捕捞量是：F2=100X2−X2²，式中 X2 是在 2 区捕鱼的船只数目。各区的边际捕捞量由下式给出：MFC1=200−4X1，MFC2=100−2X2。现在有100条船得到美国政府许可在这两个区域捕鱼。鱼以每吨100美元出售。每条船的总成本（资本和运作）为每天不变的1000美元。（1）如果船都能在他们想去的地方捕鱼，政府不加限制，每个区域将有多少条船捕鱼？捕捞的总值将是多少？（2）如果美国政府能够限制船只，每个区域应当配置多少条船？捕捞的总值将是多少？假定船的总数仍为100。（3）如果另有渔民想购买船只，加入捕鱼队伍，一个希望捕鱼净值最大化的政府是否应当给他们许可证让他们捕鱼？为什么？',answer:`**考察知识点**：公共资源、最优配置、许可证。\n**思路**：自由进入平均产量相等；社会最优边际产量相等；比较利润。\n**答案**：（1）X1=200/3，X2=100/3，总值666600。（2）X1=50，X2=50，总值750000。（3）不应，超过92.5条船会降低总利润。
##**详解**
（1）如果船都能在他们想去的地方捕鱼，政府不加限制，会使得船只在两个区的利润相等，因为如果某区的利润小于另一区域，就会有船只离开该区而到另一区捕鱼，直至两区的利润相等。
1区每只船的利润：π₁=F₁/X₁·100−1000。2区每只船的利润：π₂=F₂/X₂·100−1000。当两区利润相等时满足 F₁/X₁=F₂/X₂，此时两区平均捕捞量相等，即 AF₁=AF₂。因此，联立以下方程：
$$｛AF₁=AF₂；AF₁=200−2X₁；AF₂=100−X₂；X₁+X₂=100｝
解得：X₁=200/3，X₂=100/3。代入捕捞量的方程，解得：
$$F₁=200×(200/3)−2×(200/3)²=4444, F₂=100×(100/3)−(100/3)²=2222
总的捕捞量为 F₁+F₂=6666，在每吨100美元的价格下，总价值为666600。每条船的利润为：π=100×66.66−1000=5666（美元）。总利润为566600美元。
（2）如果美国政府能够限制船只，政府将会追求捕鱼的社会价值最大化，此时总的利润函数为：
$$π=100F₁+100F₂−1000(X₁+X₂)
$$=100(200X₁−2X₁^2)+100(100X₂−X₂^2)−100000
由利润最大化的一阶条件得：
$$∂π/∂X₁=200−4X₁=0, ∂π/∂X₂=100−2X₂=0
解得：X₁=50，X₂=50。代入捕捞量的方程，解得：
$$F₁=200×50−2×50^2=5000, F₂=100×50−50^2=2500
总的捕捞量为 F₁+F₂=7500，在每吨100美元的价格下，总价值为750000美元。
应该注意的是，利润在两个区域不是平均分配的。在1区，每条船的平均捕捞量为100吨，而2区每条船的平均捕捞量为50吨，1区的船只获得一个较高的利润。
（3）区域1：π₁=100(200X₁−2X₁^2)−1000X₁=19000X₁−200X₁^2。利润最大化一阶条件为：(dπ₁)/(dX₁)=19000−400X₁=0。解得：X₁=47.5，π₁=100×(200×47.5−2×47.5^2)−1000×47.5=451250。
同理，对区域2：π₂=100(100X₂−X₂^2)−1000X₂=9000X₂−100X₂^2。利润最大化一阶条件为：(dπ₂)/(dX₂)=9000−200X₂=0。解得：X₂=45，π₂=100×(100×45−45^2)−1000×45=202500。总利润为：π=π₁+π₂=451250+202500=653750。在1区和2区船只分别为47.5和45时，达到利润最大化。任何大于92.5的船只数都会降低总利润，因此政府不会再授予捕鱼许可证。`},
{id:'m140',special:'微观·公共物品',qid:'A1 ★★★',question:'某村庄有80户人家，他们正在决定是否在村里修一条马路，每个农户的效用函数可以表示为 u(x,y)=x^0.5+y，其中 x 代表马路长度，单位是米，y 代表花费在其他商品上的支出，单位是万元。修一米马路需要4万元，那么对于这个村庄而言，帕累托最优的马路长度是多少？',answer:`**考察知识点**：公共物品、萨缪尔森规则。\n**思路**：总效用最大化；或 ∑MRS=MC。\n**答案**：x=100 米。
##**详解**
**【法一】**帕累托最优的马路长度使得村庄的总效用最大化。设第 i 户人家的收入为 w_i，则村庄的总效用最大化问题为：
$$max 80x^(1/2)+Σ_(i=1)^(80)y_i
$$s.t. 4x+Σ_(i=1)^(80)y_i=Σ_(i=1)^(80)w_i
由约束条件可以得到：max 80x^(1/2)+Σ_(i=1)^(80)w_i−4x。由一阶条件得到 x=100，所以帕累托最优的长度为100米。
**【法二】**根据公共物品提供的萨缪尔森加总规则可知：帕累托最优的马路长度应该满足 Σ_(i=1)^(80)|MRS_i|=MC，即：80×1/2√x=4。由此解得 x=100 米。`},
{id:'m141',special:'微观·公共物品',qid:'A2 ★★',question:'假定社会上只有两个人，对甲来说蚊虫控制的需求曲线为：qa=100−p，对乙来说其需求曲线为：qb=200−p。（1）假定蚊虫控制是纯公共品，即一旦生产出来，每个人都会从中受益。如果它能以每单位120美元的不变边际成本得到，其最优水平是多少？（2）如果蚊虫控制由私人市场来进行，又会提供多少？你的答案是否取决于每个人都假定其他人会进行蚊虫控制？（3）如果政府提供最适当的蚊虫控制规模，这将花费多少？如果个人按其从蚊虫控制中所得的好处比例去分担费用，税收将怎样在两个人之间分配？',answer:`**考察知识点**：公共物品、私人提供、最优规模、税收分担。\n**思路**：垂直加总需求；私人提供由高需求者决定；按受益比例分担。\n**答案**：（1）Q=90。（2）私人提供80。（3）花费10800；甲900，乙9900。
##**详解**
（1）**【法一】**公共品的最优供给数量应当使得社会福利最大化，这里用消费者剩余作为每个消费者福利的度量，那么社会福利最大化问题为：
$$max_Q ∫_0^Q(100−t)dt+∫_0^Q(200−t)dt−120Q=180Q−Q²
社会福利最大化的一阶条件为：180−2Q=0，解得 Q=90，即最优产出水平为90。
**【法二】**假定蚊虫控制是纯公共品，如果个人对公共物品需求的垂直相加与生产它的边际成本相等，确定的公共物品的数量就是最优水平。通过垂直相加可得市场需求曲线，对应的市场需求曲线方程为：
$$p=｛200−Q，0≤Q≤100；100−Q，100<Q≤200｝
由 p=MC 得：q^*=90，p^*=120。
（2）**【法一】**给定乙对蚊虫控制的提供量为 q_b，因为甲为蚊虫控制愿意支付的最高价格（100）低于进行蚊虫控制的边际成本（120），所以甲的最优选择就是不提供蚊虫控制，即 q_a=0。给定甲不会选择提供，乙选择使自己福利最大化的蚊虫控制的供应量：
$$max_Q ∫_0^(q_b)(200−t)dt−120q_b=−(1/2)q_b²+80q_b
由最大化的一阶条件：80−q_b=0 解得 q_b=80，因此蚊虫控制的总供应量为 q_a+q_b=80，低于有效供应水平。
**【法二】**如果蚊虫控制由私人提供，此时两人对蚊虫控制的需求函数为：
$$q=｛200−p，0≤p≤100；300−2p，100<p≤200｝
由 p=MC 得：q=80，低于有效供应水平。
（3）如果由政府提供最优的蚊虫控制规模，这将花费 120×90=10800。把 q^*=90 代入甲、乙两人的需求曲线，可得：p_a=10，p_b=110。如果个人会按其从蚊虫控制中所得的好处比例去分担费用的话，甲支付的税收为 T_a=q^*· p_a=90×10=900，乙支付的税收为 T_b=q^*· p_b=90×110=9900。两消费者在总税收中负担比例为：T_a/T_b=900/9900=1/11。`},
{id:'m142',special:'微观·公共物品',qid:'A3 ★',question:'假定经济生活中有三种商品，n 个人。两种商品是纯公共物品（非排他的），第三种商品是普通的私人商品。（1）为了资源在任意一种公共品与私人商品之间有效率的配置，什么条件成立？（2）为了在两种公共品之间有效配置资源，什么条件一定要成立？',answer:`**考察知识点**：公共物品、资源配置效率、萨缪尔森规则。\n**思路**：分别写出公共品与私人品、两公共品之间的效率条件。\n**答案**：略。
##**详解**
这个问题可以采用如下模型进行解释：假设两种公共品的供应数量为 G₁ 和 G₂，每个人消费的私人的数量为 x_i，那么有效的资源配置应当使得全社会的福利最大化，即：
$$max_(x₁,…,x_n,G₁,G₂)Σ_(i=1)^n u_i(x_i,G₁,G₂)
$$s.t. T(X,G₁,G₂)=0
其中 X=Σ_(i=1)^n x_i，T(X,G₁,G₂)=0 是转换函数（相当于预算约束方程）。
构造拉格朗日函数：L=Σ_(i=1)^n u_i(x_i,G₁,G₂)−λ T(X,G₁,G₂)。相应的一阶条件为：
$$∂u_i/∂x_i=λ∂T/∂X, i=1,2,…,n
$$Σ_(i=1)^n∂u_i/∂G₁=λ∂T/∂G₁
$$Σ_(i=1)^n∂u_i/∂G₂=λ∂T/∂G₂
（1）由 ∂u_i/∂x_i=λ∂T/∂X(i=1,2,…,n)，解得 λ=(∂u_i/∂x_i)/(∂T/∂X)(i=1,2,…,n)。上式可以进一步改写为 Σ_(i=1)^n1/λ∂u_i/∂G₁=∂T/∂G₁。然后把 λ=(∂u_i/∂x_i)/(∂T/∂X)(i=1,2,…,n) 代入后整理就有：
$$Σ_(i=1)^n(∂u_i/∂G₁)/(∂u_i/∂x_i) =(∂T/∂G₁)/(∂T/∂X)
对于公共物品2，也有类似的等式成立：
$$Σ_(i=1)^n(∂u_i/∂G₂)/(∂u_i/∂x_i) =(∂T/∂G₂)/(∂T/∂X)
（2）上面两式两边分别相除就得到：
$$(Σ_(i=1)^n∂u_i/∂G₁)/(Σ_(i=1)^n∂u_i/∂G₂) =(∂T/∂G₁)/(∂T/∂G₂)`},
{id:'m143',special:'微观·公共物品',qid:'B1 ★',question:'离散型公共物品的有效供应问题。考虑一个两人经济社会。两人只能消费两种商品：私人物品和公共物品。个人最初拥有资源禀赋 wi，i=1,2；如果他为公共物品贡献 gi，i=1,2，将会有 xi=wi−gi 的私人物品消费；个人的效用函数为 ui(G,xi)，G=g1+g2，效用函数关于 G 和 xi 都是严格递增的。公共物品仅能以一种离散的数量被利用，供应一单位公共物品的成本为150。ri=100（i=1,2）表示个人 i 为获得一单位公共物品而愿意放弃私人物品的数量为100。个人独立地决定是否购买公共物品。如果公共物品被提供了的话，任何人都不能排除其他人对公共物品的消费。试用简单的博弈说明独立决策不能提供有效的公共物品数量。',answer:`**考察知识点**：公共物品、免费乘车、博弈。\n**思路**：写收益矩阵；找占优策略均衡。\n**答案**：占优策略均衡为（不买，不买），无法有效提供。
##**详解**
如果消费者1购买公共物品，那么他将支付150，而只获得100的收益，净值为-50；如果消费者1购买了公共物品而消费者2没有购买，消费者2将免费获得100的收益；如果2也购买，他也净损失了50；如果两人都没有购买，则在公共物品上获得的效用为0。
此时两消费者的收益矩阵如下：
消费者1＼消费者2｜买｜不买
买｜−50,−50｜−50,100
不买｜100,−50｜0,0
这一博弈的占优策略均衡是（不买，不买）。每一位消费者都不打算购买公共物品，而希望做“免费乘车者”。`},
{id:'m144',special:'微观·信息不对称',qid:'A1 ★★',question:'一个二手车市场有10000辆车。这些车的价值均匀的分布在5000到15000美金之间。二手车车主愿意以车的真实价值的售价出售该车。二手车买主无法评估每辆二手车的真实价值，他们的需求取决于二手车市场的所有车的平均价值（AP）以及二手车的售价（P），即需求 Q=1.5AP−P。（1）如果二手车买主根据整个二手车市场来估计平均价值AP，那么AP将是多少？二手车的均衡价格将是多少？（2）在（1）的均衡中，最终实际交易的二手车的平均价值应为多少？（3）如果二手车买家根据实际交易的二手车的平均价值修改他们对AP的估计，新的二手车均衡价格应该为多少？这时，交易的二手车平均价值又当为多少？（4）这样下去，会存在一个价格和交易量为正的市场均衡吗？（中财803经济学综合 2018 年考题）',answer:`**考察知识点**：逆向选择、二手车市场、均衡。\n**思路**：逐步下调平均价值估计；观察价格和交易量变化。\n**答案**：（1）AP=10000，P=10000。（2）AP=7500。（3）P=7500，AP=6250。（4）不存在正价格和正交易量的均衡。
##**详解**
（1）整个二手车市场的平均价值（即均匀分布的期望）为：AP=(5000+15000)/2=10000。需求取决于二手车市场的所有车的平均价值（AP）以及二手车的售价（P），将 AP=10000 代入需求函数 Q=1.5× AP−P 可得：Q=15000−P。该式说明，由于买主无法判断二手车的真实价值，买主只愿意支付二手车的平均价值，所以二手车的均衡价格为 P=10000，均衡数量 Q=5000，最终真实价值不大于10000的二手车可以成交（真实价值大于10000的不会被供给出来）。
（2）由（1）可知，最终实际交易的二手车价值均匀分布在5000到10000之间，故实际交易的二手车的平均价值为：AP=(5000+10000)/2=7500。
（3）由（2）可知，实际交易的二手车的平均价值为7500，所以新的需求函数为：Q=11250−P，新的交易均衡价格为 P'=7500，此时交易的二手车的平均价值为 AP''=(5000+7500)/2=6250。
（4）这样下去，二手车买主会不断压低其意愿支付价格，以至于不会有二手车买主愿意出售所拥有的车辆，因此该市场不存在价格和交易量为正的市场均衡。`},
{id:'m145',special:'微观·信息不对称',qid:'B1 ★★',question:'假设一个厂商试图找出最适的劳工雇用量(L)和效率工资(W)来极大化它的利润，它的生产函数(F)是由劳工数量(L)和劳工的努力程度所组成的，Y=F[e(W)L]，e 为每位劳工的努力程度，其中劳工的努力程度又和工资呈正比，也就是 e(W)=aW，eW=∂e/∂W>0。为简化问题，假设产品价格是固定的，且 P=1。（1）找出决定厂商利润极大化的均衡条件。（2）如果给定劳工的努力程度和工资的关系，e(W)=ln(W/3)，W>3；e(W)=0，W≤3 时。请根据（1）找出的均衡条件，求出最适效率工资是多少？',answer:`**考察知识点**：效率工资、利润最大化。\n**思路**：对 L 和 W 求一阶条件；代入具体函数求解。\n**答案**：（1）We′(W)/e(W)=1。（2）W=3e。
##**详解**
（1）当价格为1时，厂商利润最大化问题为：max π=P· F[e(W)L]−WL=F[e(W)L]−WL。利润最大化的一阶条件为：
$$∂π/∂L=F'[e(W)L]· e(W)−W=0
$$∂π/∂W=F'[e(W)L]· e'(W)L−L=0
整理可得均衡条件为：We'(W)/e(W)=1。
（2）当 W>3，将 e(W)=ln(W/3) 代入（1）中均衡条件 We'(W)/e(W)=1 解得：W=3e，即此时最适效率工资为 3e。W≤3 时，e(W)=0，此时厂商利润函数为：π=F(0)−WL=−WL，W=0 时利润最大，此时最适效率工资为0。`},
{id:'m146',special:'微观·信息不对称',qid:'B2 ★',question:'团队合作中团队人数的增加可能会降低团队成员工作的积极性，我们将在本题中说明这个结论。假设 n 个合作者的共同产出的收益为 R=e1+e2+…+en，其中 ei 是合作者的努力程度，他付出努力 ei 需要的成本为 c(ei)=ei²/2。（1）如果合作者平分收益 R，那么均衡的努力程度和剩余（收益 R 减去努力的成本）分别是多少？（2）如果最后只有一个合作者能够获得收益，那么均衡的努力程度和平均剩余是多少？最后分配收益时应该集中分配给一个合作者还是应该平均分配？（3）回到（1），一个合作者获得的剩余随 n 递增还是递减？随着 n 的增加，每个合作者获得剩余的极限值是多少？（4）分析现代企业中员工持股计划的激励特征。',answer:`**考察知识点**：团队合作、搭便车、激励。\n**思路**：分别求平分收益和集中收益下的均衡；比较剩余。\n**答案**：（1）ei=1/n，πi=(2n−1)/(2n²)。（2）ei=1，πi=1/2；平均分配更好。（3）递减；极限为0。（4）员工持股计划在大团队中激励作用有限。
##**详解**
（1）对于合作者 i，其利润最大化问题为：max π_i=(Σ_(j=1)^n e_j)/n−(e_i²)/2。解得最优选择为：e_i=1/n，π_i=(2n−1)/(2n²)。
（2）假设合作者 i 获得全部收益，其他合作者 j 利润最大化问题为：max π_j=0−(e_j²)/2，解得 e_j=0(j≠i)。合作者 i 利润最大化问题为：
$$max π_i=Σ_(k=1)^n e_k−(e_i²)/2=e_i−(e_i²)/2
解得 e_i=1，π_i=1/2，这样如果平均分配的话，每个人可得 1/(2n)。注意到 n>1 时恒有 (2n−1)/(2n²)>1/(2n)，所以最后分配收益时平均分配比集中分配给一个合作者要好。
（3）由（1）可知，合作者 i 获得的剩余为 π_i=(2n−1)/(2n²)。由于
$$(d((2n−1)/(2n²)))/dn=(1−n)/(n³)
因此当 n>1 时，合作者获得的剩余随 n 递减。lim_(n→∞)(2n−1)/(2n²)=lim_(n→∞)2/(4n)=0，也就是说随着 n 的增加，每个合作者获得剩余的极限值为0。
（4）上面的分析表明了在一个理性的模型中员工持股计划不可能给予员工努力工作的激励，因为合作者获得的剩余随着合作者数量的增加而递减。`},
{id:'h1',special:'宏观·宏观经济学数据',qid:'A1 ★★★',question:'假设某政府花钱10000修路，其中给工人支付工资5000，给水泥厂支付5000，水泥厂用5000来购买设备，而工人用2000来买大米，用2000来买电脑，另外1000存入银行。电脑店用收入获得的2000中的1000还之前电脑厂家贷款的欠款，又从银行借了1000，加上剩下的1000总共2000从电脑厂进了2000元的电脑（作为存货）。计算下列各项：GDP、个人消费支出、个人耐用品消费支出、个人非耐用品消费支出、个人服务支出、国民投资、国民投资中的存货投资和固定资产投资支出以及政府采购支出，并给出计算过程。（上海财经 2011 年考题）',answer:`**考察知识点**：GDP核算、支出法、消费分类、投资分类、政府采购。\n**思路**：按支出法 GDP=C+I+G；区分耐用品、非耐用品、服务；投资含固定资产投资和存货投资。\n**答案**：GDP=21000；消费支出=4000；耐用品消费支出=2000；非耐用品消费支出=2000；服务支出=0；国民投资=7000；存货投资=2000；固定资产投资=5000；政府采购=10000。\n##**详解**\n（1）用支出法计算三部门的 GDP = C + I + G。这里个人消费 C = 2000 + 2000 = 4000；企业投资 = 固定资产投资 + 存货投资 = 5000 + 2000 = 7000（注意，归还贷款既不是固定资产投资支出，也不是存货投资支出）；政府购买支出 G = 10000。所以：\n$$GDP = C + I + G = 4000 + 7000 + 10000 = 21000\n（2）个人消费支出一共是4000，其中2000用于个人耐用品消费支出，2000用于个人非耐用品消费支出，服务支出为0。\n（3）国民投资 = 固定资产投资 + 存货投资，其中固定资产投资为5000，存货投资为2000，因此国民投资一共为7000。\n（4）政府购买支出就是10000。`},
{id:'h2',special:'宏观·宏观经济学数据',qid:'A2 ★★',question:'假设一国的国民收入账户显示：GDP=100，C=70，I=40，G=20，NFP=0 以及 EX=20。其中 GDP 是国内生产总值，C 是消费，I 是投资，G 是政府支出，NFP 是净要素收入，EX 表示出口。求：（1）进口值（IM）是多少？（2）经常账目逆差是多少？（3）储蓄率是多少？（4）现在假设政府征税 T=10，其他条件不变。政府和私人和国民储蓄各为多少？（北大考题）',answer:`**考察知识点**：国民收入核算、经常账户、储蓄。\n**思路**：由 GDP=C+I+G+EX−IM 求IM；NX=EX−IM；储蓄 S=Y−C−G；征税后分别求私人、公共、国民储蓄。\n**答案**：（1）IM=50。（2）经常账户逆差 NX=−30。（3）储蓄率10%。（4）政府储蓄 −10；私人储蓄20；国民储蓄10。\n##**详解**\n（1）由 GDP = C + I + G + EX − IM，代入 GDP = 100、C = 70、I = 40、G = 20、NFP = 0、EX = 20，得：\n$$100 = 70 + 40 + 20 + 20 − IM\n解得 IM = 50。\n（2）经常项目差额为：\n$$NX = EX − IM = 20 − 50 = −30\n即经常账户逆差为30。\n（3）储蓄为：\n$$S = Y − C − G = 100 − 70 − 20 = 10\n储蓄率为：\n$$s = S/Y × 100% = 10%\n（4）假设政府征税 T = 10，此时政府储蓄为：\n$$T − G = 10 − 20 = −10\n私人储蓄为：\n$$Y − T − C = 100 − 10 − 70 = 20\n国民储蓄为：\n$$S = Y − C − G = 100 − 70 − 20 = 10\n这与“国民储蓄 = 私人储蓄 + 公共储蓄 = 20 + (−10) = 10”一致。\n**【提示】**本题为曼昆《宏观经济学》第九版第 109 页内容。`},
{id:'h3',special:'宏观·宏观经济学数据',qid:'A3 ★★★',question:'考虑一个只生产和消费香蕉与服装的经济，2006年香蕉10万/1元，服装5万/40元；2016年香蕉20万/2元，服装6万/50元。假设经济中生产的数量等于消费的数量。（1）以2006年为基期，计算2016年的名义GDP、实际GDP和GDP价格指数。（2）以2006年为基期，计算2016年的CPI指数。（3）在2006年和2016年之间，价格上涨了多少？比较GDP折算指数和CPI指数给出的答案，简要阐述 GDP 折算指数和 CPI 指数的特点以及在衡量生活成本方面可能存在的误差，以上表数据为例能否写出更合理的“生活成本指数”？（中央财经 2017 考题）',answer:`**考察知识点**：名义GDP、实际GDP、GDP平减指数、CPI、生活成本指数。\n**思路**：分别用当期价格和基期价格计算；CPI用固定篮子；比较二者差异。\n**答案**：（1）名义GDP=340万元；实际GDP=260万元；GDP价格指数≈1.31。（2）CPI≈1.29。（3）GDP折算指数上涨31%，CPI上涨29%；特点与误差略。\n##**详解**\n（1）2016年名义GDP = 20×2 + 6×50 = 340（万元）\n2016年实际GDP = 20×1 + 6×40 = 260（万元）\nGDP价格指数 = 名义GDP/实际GDP：\n$$340/260 = 1.31\n（2）2016年的CPI = 现期价格指数/基期价格指数：\n$$= (10×2 + 5×50)/(10×1 + 5×40) = 1.29\n（3）用GDP折算指数计算价格上涨：\n$$(1.31 − 1)/1 × 100% = 31%\n用CPI指数计算价格上涨：\n$$(1.29 − 1)/1 × 100% = 29%\n两者给出的答案不同，原因在于：\n① GDP折算指数衡量生产的全部最终产品与劳务的价格，而CPI衡量的是消费品价格水平。因而生产性物品价格上升会影响GDP折算指数，而不直接影响CPI。\n② GDP折算指数只包括国内产品价格，进口产品价格不反映在其中，但进口产品价格的变动会影响CPI，因为居民也会购买进口消费品。\n③ CPI给各种价格分配固定权重，以便于不同时期的对比分析，但GDP折算指数给各种产品价格分配的权重是变动的。\nGDP折算指数和消费价格指数在衡量居民生活成本时都有一定的局限性：消费价格指数会夸大生活成本的上升，因为这一指数的交易量是固定的 Q₀，没有考虑到一种商品价格上涨时消费者会用便宜的替代品消费；相反，GDP折算指数会低估生活成本的上升，因为这种指数的交易量是 Q₁，虽然考虑到了一种商品价格上升时消费者可能用替代品，但这一指数不能反映这种替代可能影响消费者福利。\n**【校注】**原文此处为“低估生活质量的下降”，按上下文应为“低估生活成本的上升”，已按上下文订正。\n为得出更合理的“生活成本指数”，可以取GDP折算指数与CPI的几何平均，即所谓的费雪指数。\n**【提示】**本题为曼昆《宏观经济学》第九版第 35 页第 7 题的近似题，第十版第 35 页。`},
{id:'h4',special:'宏观·宏观经济学数据',qid:'A4 ★★★',question:'假设某国只生产3种产品：篮球、纯净水、CD。2017年价格10、1、14，数量100、100、200；2018年价格12、2、16，数量120、130、250。（1）计算该国GDP平减指数，以及物价总水平变动的百分比，以2018年为基年。（2）计算该国的CPI，并基于CPI计算物价变动的百分比，以2017年作为基年，而且固定的篮子是10个篮球、10瓶矿泉水、20张CD。（对外经贸 2019 年考题）',answer:`**考察知识点**：GDP平减指数、CPI、通货膨胀率。\n**思路**：以2018年为基年计算2017年平减指数；以2017年为基年计算2018年CPI。\n**答案**：（1）2017年GDP平减指数≈0.85；物价变动≈17.65%。（2）2018年CPI≈1.1795；物价变动≈17.95%。\n##**详解**\n（1）以2018年为基年，因此2018年GDP平减指数为1。\n2017年名义GDP（2017年价格 × 2017年产量）：\n$$10×100 + 1×100 + 14×200 = 3900（美元）\n2017年实际GDP（2018年价格 × 2017年产量）：\n$$12×100 + 2×100 + 16×200 = 4600（美元）\n所以2017年GDP平减指数：\n$$3900/4600 = 0.85\n2017到2018年物价总水平变动：\n$$(1 − 0.85)/0.85 = 17.65%\n（2）以2017年为基年，因此2017年CPI为1。\n2018年CPI：\n$$(12×10 + 2×10 + 16×20)/(10×10 + 1×10 + 14×20) = 1.1795\n2017到2018年物价总水平变动：\n$$(1.1795 − 1)/1 = 17.95%\n**【提示】**价格指数的计算需要知道基期，但是利用价格指数计算通货膨胀率不需要知道基期。某一期间内的通货膨胀率 =（当期价格指数 − 上一期价格指数）/当期价格指数。`},
{id:'h5',special:'宏观·宏观经济学数据',qid:'A5 ★★★',question:'假设A国在2014年的真实GDP和名义GDP分别是2000亿和1600亿。其中A国的真实GDP以2013年为基准年份计算得出。A国2014年人口比2013年增长10%，原因是来自邻国的大规模的移民。（1）计算国内生产总值平减指数。（2）计算2013年到2014年间通货膨胀的百分比指数。（3）假定在2013到2014年人均名义GDP的增长率是40%，那么同时期人均实际GDP的增长率是多少？（4）计算2013年名义GDP的总值。（北大考题）',answer:`**考察知识点**：GDP平减指数、通货膨胀率、人均GDP增长率。\n**思路**：平减指数=名义/实际；通货膨胀率由平减指数变化求；利用增长率关系求2013年名义GDP。\n**答案**：（1）2014年GDP平减指数=0.8。（2）通货膨胀率=−20%。（3）人均实际GDP增长率≈77%。（4）2013年名义GDP≈1066.67。\n##**详解**\n（1）GDP平减指数是名义GDP与实际GDP的比率。2013年为基准年份，故2013年GDP平减指数为1；2014年为：\n$$1600/2000 = 0.8\n（2）2013年到2014年的通货膨胀率：\n$$(0.8 − 1)/1 × 100% = −20%\n（3）由定义可知，人均名义GDP = 名义GDP ÷ 人口数。根据增长率的性质：\n$$人均名义GDP增长率 = 名义GDP增长率 − 人口增长率\n设2013年的名义GDP为 y，由已知条件可得：\n$$40% = (1600 − y)/y − 10%\n解得 y = 1066.67，即2013年的名义GDP（同时也是2013年的实际GDP）。\n2013到2014年实际GDP的增长率：\n$$(2000 − 1066.67)/1066.67 ≈ 87%\n2013到2014年人均实际GDP的增长率：\n$$= 87% − 10% = 77%\n（4）由（3）可知，2013年名义GDP的总值 y = 1066.67。`},
{id:'h6',special:'宏观·凯恩斯交叉及乘数',qid:'A1 ★★★',question:'考虑一个适用凯恩斯交叉分析的封闭经济。消费函数由方程 C=200+(2/3)(Y−T) 给出。计划投资、政府支出和税收都是300。（1）如果 Y 为1500，计划支出是多少？存货积累或者存货负积累是多少？均衡收入应该高于还是低于1500？（2）均衡收入是多少？（3）均衡的消费、私人储蓄、公共储蓄和国民储蓄是多少？（4）求投资乘数、政府支出乘数、税收乘数和平衡预算乘数。',answer:`**考察知识点**：凯恩斯交叉、计划支出、乘数。\n**思路**：计算计划支出 PE=C+I+G；均衡 Y=PE；求各乘数。\n**答案**：（1）PE=1600；存货负积累100；均衡收入高于1500。（2）Y*=1800。（3）C=1200；私人储蓄300；公共储蓄0；国民储蓄300。（4）投资乘数3；政府支出乘数3；税收乘数−2；平衡预算乘数1。\n##**详解**\n（1）封闭经济下，计划支出 PE = C + I + G。由题意，当前产出 Y = 1500，I = 300，G = 300，T = 300，因此：\n$$PE = 200 + (2/3)(Y − T) + I + G = 200 + (2/3)×(1500 − 300) + 300 + 300 = 1600\n存货积累 = Y − PE = 1500 − 1600 = −100，即存货负积累为100。\n此时实际产出 Y 小于计划支出 PE，企业生产的量小于企业销售的量，企业通过减少存货来满足较高的销售水平。当企业发现自己的存货存量减少时，就会雇用更多工人、增加生产，经济趋于均衡，因此均衡收入应该高于1500。\n（2）产品市场实现均衡时满足条件 PE = Y，即：\n$$200 + (2/3)(Y − 300) + 300 + 300 = Y\n解得均衡收入 Y* = 1800。\n（3）消费：C = 200 + (2/3)×(1800 − 300) = 1200\n私人储蓄 = Y − C − T = 1800 − 1200 − 300 = 300\n公共储蓄 = T − G = 300 − 300 = 0\n国民储蓄 = Y − C − G = 1800 − 1200 − 300 = 300\n（4）设消费函数为 C = α + β(Y − T)，本题 β = 2/3。由产品市场均衡条件 PE = Y 及 PE = C + I + G 可得：\n$$α + β(Y − T) + I + G = Y\n解得均衡收入：\n$$Y = (α − βT + I + G)/(1 − β)\n所以：\n$$投资乘数 k_I = ΔY/ΔI = 1/(1 − β) = 1/(1 − 2/3) = 3\n$$政府支出乘数 k_G = ΔY/ΔG = 1/(1 − β) = 3\n$$税收乘数 k_T = ΔY/ΔT = −β/(1 − β) = −(2/3)/(1/3) = −2\n$$平衡预算乘数 k_B = k_G + k_T = 3 − 2 = 1\n**【提示】**本题属于基础题目。对于这类比较简单、小问不多的基础题，建议把过程写完整，包括推导，不要直接用结论，否则正式考试时容易因为过程扣分。\n**【提示】**基础题，需要大家深刻理解凯恩斯交叉图中每条曲线和均衡条件的含义，此类题目才不容易出错。`},
{id:'h7',special:'宏观·凯恩斯交叉及乘数',qid:'A2 ★★★',question:'假设某经济的消费函数为 C=100+0.8YD，投资 I=50，政府购买性支出 G=200，政府转移支付 TR=62.5（单位均为 10 亿美元），税率 t=0.25。（1）求均衡收入；（2）试求：投资乘数、政府支出乘数、税收乘数、转移支付乘数和平衡预算乘数；（3）假设该社会达到充分就业所需要的国民收入为1200，试问用：①增加政府购买；②减少税收；③增加政府购买和税收同一数额（以便预算平衡）实现充分就业，各需多少？（4）若将题中的比例税改为定量税 T0=250，结果有何不同？',answer:`**考察知识点**：比例税、乘数、充分就业缺口。\n**思路**：可支配收入 YD=Y−tY+TR；求均衡；按乘数求政策变动。\n**答案**：（1）Y=1000。（2）投资乘数2.5；政府支出乘数2.5；税收乘数−1.5；转移支付乘数2；平衡预算乘数1。（3）①增购80；②减税133.3；③增购200、增税200。（4）定量税下均衡收入仍1000；投资乘数5；政府支出乘数5；税收乘数−4；转移支付乘数4；平衡预算乘数1；①增购40；②减税50；③增购200、增税200。\n##**详解**\n（1）可支配收入为：\n$$Y_D = Y − T + TR = Y − 0.25Y + 62.5 = 0.75Y + 62.5\n由产品市场均衡条件 Y = C(Y_D) + I + G，即：\n$$Y = 100 + 0.8(0.75Y + 62.5) + 50 + 200\n解得均衡国民收入 Y = 1000。\n（2）由题意，边际消费倾向 β = 0.8，税率 t = 0.25，故：\n$$投资乘数 k_i = 1/[1 − β(1 − t)] = 1/[1 − 0.8×(1 − 0.25)] = 2.5\n$$政府支出乘数 k_g = 1/[1 − β(1 − t)] = 1/(1 − 0.6) = 2.5\n$$税收乘数 k_t = −β(1 − t)/[1 − β(1 − t)] = −0.8×0.75/0.4 = −1.5\n$$转移支付乘数 k_tr = β/[1 − β(1 − t)] = 0.8/0.4 = 2\n$$平衡预算乘数 k_b = k_g + k_t = 2.5 − 1.5 = 1\n（3）ΔY = 1200 − 1000 = 200。\n① 增加政府购买：ΔG = ΔY/k_g = 200/2.5 = 80，需增加政府购买80。\n② 减少税收：ΔT = ΔY/k_t = 200/(−1.5) = −133.3，需减税133.3。\n③ 增加政府购买和税收同一数额（以便预算平衡）：ΔG = ΔY = 200，即同时增加200政府购买和200税收。\n（4）若将比例税改为定量税 T₀ = 250，可支配收入为：\n$$Y_D = Y − T₀ + TR = Y − 250 + 62.5 = Y − 187.5\n由 Y = C(Y_D) + I + G 解得均衡国民收入仍为 Y = 1000。此时：\n$$投资乘数 k_i = 1/(1 − β) = 1/(1 − 0.8) = 5\n$$政府支出乘数 k_g = 1/(1 − β) = 5\n$$税收乘数 k_t = −β/(1 − β) = −0.8/0.2 = −4\n$$转移支付乘数 k_tr = β/(1 − β) = 0.8/0.2 = 4\n$$平衡预算乘数 k_b = k_g + k_t = 5 − 4 = 1\n此时 ΔY = 200：① 需增加政府购买 ΔG = 200/5 = 40；② 需减税 ΔT = 200/(−4) = −50；③ 同时增加200政府购买和200税收。\n**【提示】**本题是不涉及挤出效应的乘数综合题。各种乘数总结如下（比例税下的乘数在教材中并未涉及，且在不同教材中存在争议，记住公式即可，不必掌握推导）：\n$$定量税：投资乘数 1/(1−β)，政府购买乘数 1/(1−β)，税收乘数 −β/(1−β)，转移支付乘数 β/(1−β)\n$$比例税：投资乘数 1/[1−β(1−t)]，政府购买乘数 1/[1−β(1−t)]，税收乘数 −β(1−t)/[1−β(1−t)]，转移支付乘数 β/[1−β(1−t)]`},
{id:'h8',special:'宏观·IS-LM具体函数',qid:'A1 ★★★',question:'在两部门经济中，消费函数：C=100+0.8Yd，投资函数：I=140−5r，实际货币需求函数：L=0.2Y−3r，实际货币供给：M=200。（1）求IS、LM方程的表达式并画图；（2）若 M 增加至220，LM曲线如何移动？求此时均衡的收入、利率和投资；（3）为什么LM曲线移动的距离不等于均衡收入的增加量？',answer:`**考察知识点**：IS-LM模型、货币政策、挤出效应。\n**思路**：产品市场均衡求IS；货币市场均衡求LM；联立求均衡；分析LM移动量与收入增加量差异。\n**答案**：（1）IS:Y=1200−25r；LM:Y=1000+15r。（2）LM右移；Y=1137.5，r=2.5，I=127.5。（3）因利率下降导致投机需求增加，收入增加量小于LM水平移动量。\n##**详解**\n（1）由产品市场均衡条件 Y = C + I 可得：\n$$Y = 100 + 0.8Y + 140 − 5r\n整理可得IS曲线表达式为：\n$$Y = 1200 − 25r\n由货币市场均衡条件 (M/P)^s = L(r,Y) 可得：\n$$200 = 0.2Y − 3r\n整理可得LM曲线表达式为：\n$$Y = 1000 + 15r\n联立IS、LM曲线表达式可以解得均衡产出和均衡利率分别为：Y = 1075，r = 5。\n（2）当 M 增加至220，此时LM曲线右移。由货币市场均衡条件 (M/P)^s = L(r,Y) 可得：\n$$220 = 0.2Y − 3r\n整理可得LM曲线表达式为：\n$$Y = 1100 + 15r\n此时IS曲线表达式不变，联立IS、LM曲线表达式可得：\n$$1200 − 25r = 1100 + 15r\n解得新的均衡产出和均衡利率分别为：Y = 1137.5，r = 2.5。\n此时的投资量 I = 140 − 5×2.5 = 127.5。\n（3）货币供给增加，如果利率不变，为保证货币市场均衡，货币的交易和预防需求 kY 增加，货币的投机需求 hr 不变，LM曲线向右移动的距离等于利率不变时收入的增加量，即 Y₁Y₃。\n但由于本题中IS曲线向右下方倾斜，同时货币需求的利率系数 h 不为零，因此当货币供给增加时，一方面，收入增加，货币的交易需求和预防需求 kY 增加；另一方面，利率下降，导致货币的投机需求 hr 增加。为保证货币市场均衡，此时均衡收入的增加量 Y₁Y₂ 小于利率水平不变时收入的增加量 Y₁Y₃，即均衡收入的增加量小于LM曲线的移动量。\n**【提示】**本题第（3）问需要特别注意。平时经常见到的是"为什么产出增加量不等于IS曲线水平移动的距离"，而这里问的是"为什么均衡收入增加量不等于LM曲线移动的距离"，这种问法很少见到。\n**【提示】**本题第（3）问需要大家特别注意。大家平时经常见到的是为什么产出增加量不等于 IS 曲线水平移动的距离，像这里为什么不等于 LM 曲线移动的距离很少见到。`},
{id:'h9',special:'宏观·IS-LM具体函数',qid:'A2 ★★★',question:'假设一个经济有IS曲线 Y=3600+3G−2T−150r 和LM曲线 Y=2M/P+100r，投资方程为 I=1000−50r，消费方程为 C=200+(2/3)(Y−T)。长期均衡的总产出为4000，均衡价格为1。（1）假设政府购买为1200，政府想达到900的投资和4000的产出。那么利率 r 是多少？T 和 M 分别是多少？私人储蓄、公共储蓄以及国家储蓄分别为多少？（2）假设政府想减税到1000，在 G 为1200的水平上，当 Y=4000 时，利率 r 是多少？M 和 I 分别是多少？私人储蓄、公共储蓄和国家储蓄分别是多少？（3）求此时政府购买乘数、税收乘数和货币政策乘数。',answer:`**考察知识点**：IS-LM模型、财政政策、货币政策、储蓄。\n**思路**：代入目标值求变量；联立IS-LM求乘数。\n**答案**：（1）r=2；T=1450；M=1900；私人储蓄650；公共储蓄250；国民储蓄900。（2）r=8；M=1600；I=600；私人储蓄800；公共储蓄−200；国民储蓄600。（3）政府购买乘数1.2；税收乘数−0.8；货币政策乘数1.2。\n##**详解**\n（1）政府想达到900的投资，则由投资函数 I = 1000 − 50r 可知此时的利率水平 r = 2。\n联立IS、LM方程可得：\n$$Y = 3600 + 3G − 2T − 150r\n$$Y = 2M/P + 100r\n代入 r = 2，Y = 4000，G = 1200，P = 1，可以解得：T = 1450，M = 1900。\n私人储蓄为：Y − T − C = 4000 − 1450 − [200 + (2/3)×(4000 − 1450)] = 650\n公共储蓄为：T − G = 1450 − 1200 = 250\n国民储蓄为：Y − C − G = 私人储蓄 + 公共储蓄 = 900\n（2）假设政府想减税到1000，同时 G = 1200，Y = 4000，联立IS、LM方程，并代入 T = 1000，G = 1200，Y = 4000，可得：\n$$4000 = 3600 + 3×1200 − 2×1000 − 150r\n$$4000 = 2M + 100r\n可以解得：r = 8，M = 1600。\n此时投资 I = 1000 − 50×8 = 600。\n私人储蓄为：Y − T − C = 4000 − 1000 − [200 + (2/3)×(4000 − 1000)] = 800\n公共储蓄为：T − G = 1000 − 1200 = −200\n国民储蓄为：Y − C − G = 私人储蓄 + 公共储蓄 = 600\n**【提示】**私人储蓄 = Y − C − T，公共储蓄 = T − G，国民储蓄 = Y − C − G。\n（3）联立IS、LM方程可得：\n$$Y = 1440 + (6/5)G − (4/5)T + (6M/5P)\n所以政府购买乘数 k_G = ∂Y/∂G = 6/5，税收乘数 k_T = ∂Y/∂T = −4/5，货币政策乘数 k_m = ∂Y/∂(M/P) = 6/5。\n**【提示】**本题同时涉及产品和货币市场，因此存在挤出效应，所以不能直接套用凯恩斯交叉图中的政府购买和税收乘数公式。\n（1）对于给了参数具体数值但没给政策变动量的IS-LM模型求乘数，直接设出政策变量，联立IS-LM方程后得到均衡产出表达式，然后产出对政策量求导即可，如本题第（3）问。\n（2）对于给了参数具体数值和政策变动量的IS-LM模型求乘数，直接利用乘数定义求解即可，见下一题第（2）问。\n（3）对于抽象函数的IS-LM模型计算题求政策乘数，基本思路是对IS、LM曲线方程左右同时全微分或对政策变量求偏导，具体分析思路见宏观拔高专项四。`},
{id:'h10',special:'宏观·IS-LM具体函数',qid:'A3 ★★★',question:'假设某经济体的消费函数为 C=300+0.8Y，投资函数为 I=600−50r，政府购买为 G=100，货币需求函数为 L=150+0.5Y−125r，货币供给 M=1150，价格水平 P=1。（1）写出IS、LM方程，并计算均衡的国民收入和利率。（2）如果该国充分就业的国民收入是4000，若用增加政府购买实现充分就业，应该增加多少政府购买，此时政府购买乘数为多少，挤出效应多大，挤出了多少私人投资？（3）如果该国充分就业的国民收入是4000，若用增加货币供给实现充分就业，应该增加多少货币供给？（4）如果该国充分就业的国民收入是4000，若用增加政府购买实现充分就业的同时要求保持初始利率不变，此时政府购买和货币供给变动量分别为多少？（对外经贸 2009 年考题改编）',answer:`**考察知识点**：IS-LM、财政政策、货币政策、挤出效应。\n**思路**：求IS-LM；代入充分就业收入求政策变动；计算挤出效应。\n**答案**：（1）IS:Y=5000−250r；LM:Y=2000+250r；Y=3500，r=6。（2）ΔG=200；政府购买乘数2.5；挤出效应500；挤出私人投资100。（3）ΔM=500。（4）ΔG=100；ΔM=250。\n##**详解**\n（1）由产品市场均衡条件 Y = C + I + G 可得：\n$$Y = 300 + 0.8Y + 600 − 50r + 100\n化简可得IS曲线方程：\n$$Y = 5000 − 250r\n由货币市场均衡条件 (M/P)^s = L(r,Y) 可得：\n$$1150 = 150 + 0.5Y − 125r\n化简可得LM曲线方程：\n$$Y = 2000 + 250r\n联立IS和LM曲线方程可解得均衡收入和均衡利率分别为：Y = 3500，r = 6。\n（2）假设政府购买的变动量为 ΔG，由产品市场均衡条件 Y = C + I + G 可得：\n$$Y = 300 + 0.8Y + 600 − 50r + 100 + ΔG\n化简可得IS曲线方程：\n$$Y = 5000 − 250r + 5ΔG\n联立IS和LM曲线方程，代入充分就业收入 Y* = 4000 可解得：r* = 8，ΔG = 200。\n此时的政府购买乘数：k_g = ΔY/ΔG = 500/200 = 2.5\n不考虑挤出效应时的政府购买乘数：k_g′ = 1/(1 − β) = 1/(1 − 0.8) = 5\n挤出效应 = k_g′·ΔG − ΔY = 5×200 − 500 = 500\n挤出的私人投资：ΔI = 50Δr = 50×2 = 100\n（3）假设名义货币供给的变动量为 ΔM，由货币市场均衡条件 (M/P)^s = L(r,Y) 可得：\n$$1150 + ΔM = 150 + 0.5Y − 125r\n化简可得LM曲线方程：\n$$Y = 2000 + 250r + 2ΔM\n联立IS和LM曲线方程，代入充分就业收入 Y* = 4000 可解得：r* = 4，ΔM = 500。\n（4）假设政府购买和名义货币供给的变动量分别为 ΔG 和 ΔM，由产品市场和货币市场均衡条件可得：\n$$Y = 5000 − 250r + 5ΔG\n$$Y = 2000 + 250r + 2ΔM\n代入 r = 6，Y* = 4000 得：ΔG = 100，ΔM = 250。\n**【提示1】**本题原题为对外经贸考研真题，我们对其进行了改编，增加了一些设问，使其考察的知识点更加全面。\n**【提示2】**利用财政政策实现某政策目标（如实现充分就业产出）的解题思路：设政府变动的变量值，如 ΔT 或 ΔG，写出新的IS′曲线，联立IS′和LM曲线，此时是两个方程三个未知数，代入政府的政策目标（如目标的Y）后就是两个方程两个未知数，即可解出 ΔT 或 ΔG。货币政策或财政货币政策组合都是以上思路。`},
{id:'h11',special:'宏观·IS-LM具体函数',qid:'A4 ★★★',question:'考虑一个由以下方程描述的经济体：消费函数 C=300+0.8Yd，投资函数 I=200−1500r，净出口函数 NX=100−0.1Y−500r，货币需求函数 L=0.5Y+200−2000r，政府支出 G=200，税收 T=100+0.25Y，名义货币供给 MS=750，价格水平 P=1。（1）求IS和LM曲线的函数，在商品市场与货币市场达到均衡时利率与收入各为多少？（2）若政府支出增加100（即从200变为300），是否有挤出效应？若有，求挤出效应大小。（3）若政府减税100，是否可刺激产出，和增幅增加同样多的支出相比哪个效果更好？',answer:`**考察知识点**：IS-LM、挤出效应、财政政策比较。\n**思路**：求IS-LM；分别计算政府支出增加和减税的影响。\n**答案**：（1）IS:Y=1440−4000r；LM:Y=1100+4000r；r=0.0425，Y=1270。（2）有挤出效应；挤出效应100。（3）减税可刺激产出；增加政府支出效果更好。\n##**详解**\n（1）由产品市场均衡条件 Y = C + I + G + NX 可得：\n$$Y = 300 + 0.8(Y − 100 − 0.25Y) + 200 − 1500r + 200 + 100 − 0.1Y − 500r\n整理可得IS曲线方程为：\n$$Y = 1440 − 4000r\n由货币市场均衡条件 M/P = L(r,Y) 可得：\n$$750 = 0.5Y + 200 − 2000r\n整理可得LM曲线方程为：\n$$Y = 1100 + 4000r\n联立IS曲线和LM曲线方程可得：\n$$1440 − 4000r = 1100 + 4000r\n解得均衡产出和利率为：r = 0.0425，Y = 1270。\n（2）当政府支出增加到300时，IS曲线方程为：\n$$Y = 300 + 0.8(Y − 100 − 0.25Y) + 200 − 1500r + 300 + 100 − 0.1Y − 500r\n整理得：\n$$Y = 1640 − 4000r\n联立IS曲线和LM曲线方程解得均衡产出和利率为：r′ = 0.0675，Y′ = 1370。\n政府支出变化后，投资的变化量为：\n$$ΔI = (200 − 1500r′) − (200 − 1500r) = 1500(r − r′) = −37.5\n根据以上结果可知，政府支出增加后，导致利率上升，私人投资减少，所以存在挤出效应。\n将初始利率 r = 0.0425 代入新的IS曲线方程 Y = 1640 − 4000r 可得：Y″ = 1470。\n因此挤出效应 = Y″ − Y′ = 1470 − 1370 = 100。\n（3）当政府减税100时，IS曲线方程为：\n$$Y = 300 + 0.8(Y − 0.25Y) + 200 − 1500r + 200 + 100 − 0.1Y − 500r\n整理得：\n$$Y = 1600 − 4000r\n联立IS曲线和LM曲线方程解得均衡产出和利率为：r″ = 0.0625，Y″ = 1350。\n与（1）、（2）中的均衡收入水平相比，Y < Y″ < Y′，即 1270 < 1350 < 1370。这说明，政府减税与支出增加一样能刺激总产出，但是相比之下，政府支出增加对总产出的刺激效果更好。\n**【提示1】**挤出效应主要包含两部分：第一，由于利率上升所导致的投资的减少量，即挤出的投资；第二，由于此时收入的增加量没有不考虑货币市场时的增加量多所导致的消费少增加的量，即挤出的消费。\n**【提示2】**根据挤出效应的定义，可以对挤出效应各部分进行分解。如下图所示，以政府购买增加为例，假设投资函数为 I = e − dr，消费函数为 C(Y)。\n初始均衡收入为 Y₁，新的均衡收入为 Y₂，IS曲线水平移动距离 = Y₃ − Y₁ = ΔG/(1 − β)\n挤出效应 = Y₃ − Y₂，两种方法：\n**【法一】**挤出效应 = Y₃ − Y₂ = ΔG/(1 − β) − (Y₂ − Y₁)\n**【法二】**挤出效应 = Y₃ − Y₂，其中把 r₁ 代入 IS₂ 表达式求得 Y₃，此时\n挤出的投资量 = d(r₂ − r₁)\n挤出的消费量 = [C(Y₃) − C(Y₁)] − [C(Y₂) − C(Y₁)] = C(Y₃) − C(Y₂)\n以上三个变量一定满足：Y₃ − Y₁ = d(r₂ − r₁) + [C(Y₃) − C(Y₂)]，即挤出效应 = 挤出的投资量 + 挤出的消费量。\n【此处有图示】\n下面利用本题第（2）问的数据对上面的结论进行验证。消费函数为：\n$$C = 300 + 0.8Y_d = 300 + 0.8(Y − 100 − 0.25Y) = 220 + 0.6Y\n投资函数为 I = 200 − 1500r，净出口函数为 NX = 100 − 0.1Y − 500r，税收 T = 100 + 0.25Y。\n政府购买变动前的均衡：r = 0.0425，Y = 1270；变动后的均衡：r′ = 0.0675，Y′ = 1370；利率水平不变时的收入 Y″ = 1470。\n$$挤出效应 = Y″ − Y′ = 1470 − 1370 = 100\n$$挤出的投资量 = 1500(r′ − r) = 1500×(0.0675 − 0.0425) = 37.5\n$$挤出的消费量 = C(Y″) − C(Y′) = 0.6×(1470 − 1370) = 60\n$$挤出的净出口量 = −0.1(Y″ − Y′) − 500(r − r′) = −0.1×100 − 500×(0.0425 − 0.0675) = 2.5\n因此挤出效应 = 挤出的投资量 + 挤出的消费量 + 挤出的净出口量。注意：这里属于特殊情况，因为净出口也与利率和收入有关，也会被挤出。\n**【提示3】**求挤出量，不管是挤出效应，还是挤出的投资或消费，本质上的思路是"应该增加的量减去实际增加的量"。`},
{id:'h12',special:'宏观·IS-LM具体函数',qid:'A5 ★★★',question:'下列等式描绘了一个经济体：C=0.8(1−t)Y，t=0.25；I=900−50i；G=500；L=0.25Y−62.5i；CU=150，RE=100；cu=0.2，re=0.1；P=2。（1）求IS曲线和LM曲线方程，并计算均衡收入和均衡利率。（2）计算财政政策乘数和货币政策乘数。（3）现在政府要改变需求的构成，减少消费100、增加投资100，从而保持当前的收入水平不变。请问：需要什么样的政策组合？用IS-LM曲线模型表示你的建议。并计算出需要调整的政策变量变化量是多少。（4）假设充分就业的收入水平为4000，政府准备采用扩张性政策以实现充分就业，请问：如果单独采用扩张性财政政策，需要增加多少政府购买支出？如果采用扩张性财政政策的同时，采用适应性货币政策，政府购买支出和名义货币供给的变化量分别是多少？（对外经贸 2007 年考题）',answer:`**考察知识点**：IS-LM、货币乘数、政策组合、乘数。\n**思路**：求货币供给；求IS-LM；计算乘数；分析政策组合。\n**答案**：（1）IS:Y=3500−125i；LM:Y=2000+250i；Y=3000，i=4。（2）财政政策乘数5/3；货币政策乘数4/3。（3）紧缩财政+扩张货币；税收增加125，实际货币供给增加125。（4）单独财政政策需增购600；组合政策增购400、名义货币供给增加500。\n##**详解**\n（1）由产品市场均衡条件 Y = C + I + G 可得：\n$$Y = 0.8(1 − 0.25)Y + 900 − 50i + 500\n整理可得IS曲线方程为：\n$$Y = 3500 − 125i\n货币供给乘数为：\n$$m = (cu + 1)/(cu + re) = (0.2 + 1)/(0.2 + 0.1) = 4\n因此，经济中名义货币供给量为：\n$$M = m(CU + RE) = 4×(150 + 100) = 1000\n由货币市场均衡条件 (M/P)^s = L(r,Y) 可得LM曲线方程为：\n$$Y = 2000 + 250i\n联立IS和LM曲线方程可得：\n$$3500 − 125i = 2000 + 250i\n解得均衡收入和均衡利率分别为：Y = 3000，i = 4。\n**【提示】**这里题目设置有些问题。用货币乘数算出来的结果是 M = m(CU + RE) = 4×(150 + 100) = 1000；用通货存款比算出来的结果是：\n$$cu = CU/D = 150/D = 0.2，故 D = 750\n$$M = CU + D = 150 + 750 = 900\n需要注意，用通货存款比的方法并没有用到题目中给的准备金相关信息，所以这一题本意是让大家用货币乘数来求货币供给量，可能是老师在出题时数字没设置好，大家不用纠结具体答案，知道思路就行。\n（2）财政政策乘数为：\n$$dY/dG = 1/[1 − β(1 − t) + dk/h]\n其中，β 为可支配收入的边际消费倾向，本题中为0.8；t 为税率，本题中为0.25；d 为投资的利率弹性，本题中为50；k 为货币需求的收入弹性，本题中为0.25；h 为货币需求的利率弹性，本题中为62.5。\n由此可得财政政策乘数为：\n$$dY/dG = 1/[1 − 0.8(1 − 0.25) + 50×0.25/62.5] = 1/(0.4 + 0.2) = 5/3\n货币政策乘数为：\n$$dY/d(M/P) = 1/{[1 − β(1 − t)]h/d + k} = 1/{[1 − 0.8(1 − 0.25)]×62.5/50 + 0.25} = 1/(0.5 + 0.25) = 4/3\n（3）政府可以采用紧缩性的财政政策（增加税收）来减少居民的消费，采用扩张性的货币政策来降低利率水平，从而使投资增加，最终使总收入保持不变。如图，紧缩性的财政政策将使IS曲线从 IS₀ 左移到 IS₁，扩张性的货币政策将使LM曲线从 LM₀ 右移到 LM₁，从而使利率从 i₀ 下降到 i₁，收入水平保持在 Y₀ 不变。\n【此处有图示】\n假设政府的税收政策为增加一次总量税，而不是改变边际税率，征税总额为 ΔT；政府实际货币供给变动量为 Δm。\n由（1）可得初始的 Y = 3000，i = 4，消费 C = 0.8(1 − t)Y = 1800；投资 I = 900 − 50i = 700。\n要使投资水平增加100，则利率水平必须下降为 i₁ = 2；要使消费减少100而总收入保持不变，则：\n$$C = 0.8[(1 − t)Y − ΔT] = 1700\n解得 ΔT = 125。\n由货币市场均衡条件可得新的LM曲线方程为：\n$$Y = 2000 + 250i + 4Δm\n此时在原收入 Y = 3000 和新的利率水平 i₁ = 2 下，可得 Δm = 125。\n综上所述，为了使消费减少100、投资增加100，而收入水平保持不变，政府税收应增加125，实际货币供给应增加125（即名义货币供给增加250）。\n（4）① 如果政府单独采用扩张性财政政策，假设政府支出增加 ΔG，由产品市场均衡条件可得新的IS曲线方程为：\n$$Y = 3500 − 125i + 2.5ΔG\n此时LM曲线保持不变，因此由：\n$$Y = 3500 − 125i + 2.5ΔG，Y = 2000 + 250i，Y = 4000\n可得政府支出增加额为：ΔG = 600。\n② 如果采用扩张性财政政策的同时，采用适应性货币政策使利率保持不变，即 Y = 4000，i = 4，假设实际货币供给变动量为 Δm。联立新的IS和新的LM方程：\n$$Y = 3500 − 125i + 2.5ΔG，Y = 2000 + 250i + 4Δm\n并代入 Y = 4000，i = 4，可解得 ΔG = 400，Δm = 250，即政府购买增加400，名义货币供给增加 ΔM = PΔm = 500。\n**【提示】**比例税下有挤出效应的政府购买乘数和货币乘数推导。假设消费函数 C = c + βY_D，可支配收入 Y_D = Y − tY，投资函数 I = e − dr，政府购买为 G，货币市场 M/P = kY − hr，由产品市场和货币市场的均衡条件可得：\n（1）求政府购买乘数：分别对 G 求偏导，化简整理可得：\n$$∂Y/∂G = 1/[1 − β(1 − t) + dk/h]\n（2）求货币政策乘数：分别对 M/P 求偏导，化简整理可得：\n$$∂Y/∂(M/P) = 1/{[1 − β(1 − t)]h/d + k}\n**【注】**这里大多数同学存在疑问的点在于：第一，为什么会有 ∂r/∂G 和 ∂r/∂(M/P)？因为政府购买和货币供给发生变动时会导致利率的变动（结合IS-LM图形，IS曲线或LM曲线移动时利率发生变动），所以 ∂r/∂G 和 ∂r/∂(M/P) 均不为零。第二，这里的外生变量为 G 和 M/P，在求 ∂Y/∂G 时 G 是可变的，而 M/P 由央行控制，因此 ∂(M/P)/∂G = 0。对于抽象函数求乘数效应进行偏导计算时，可以结合图形进行思考：某个变量发生变动时其曲线如何移动，是否会有其他变量发生变动，进而判断各个偏导是否为零。`},
{id:'h13',special:'宏观·变形IS-LM',qid:'A1 ★★',question:'在简单的IS-LM模型中，投资不仅仅是实际利率的函数，还受到实际产出的影响：I=Ī−ar+bY，a,b>0。（1）请计算在以上两种情况下的财政支出乘数和税收乘数。（2）请在以上两种情况下分析政府支出的挤出效应是否存在？（3）请用IS-LM模型画图说明，在哪种情况下货币政策更有效？',answer:`**考察知识点**：IS-LM、投资函数、财政乘数、货币政策效果。\n**思路**：分别求IS曲线；比较斜率；分析挤出效应和货币政策效果。\n**答案**：（1）第一种：财政支出乘数 1/(1−d)，税收乘数 −d/(1−d)；第二种：财政支出乘数 1/(1−d−b)，税收乘数 −d/(1−d−b)。（2）两种情况下都存在挤出效应。（3）第二种情况下货币政策更有效。\n##**详解**\n（1）不妨设消费函数为 C = c + d(Y − T)，产品市场均衡条件为 Y = C + I + G = c + d(Y − T) + I + G。\n① 当投资只是实际利率的函数 I = Ī − ar 时，可得：\n$$Y = c + d(Y − T) + Ī − ar + G\n整理得：\n$$Y = (c − dT + Ī − ar + G)/(1 − d)\n于是有财政支出乘数为 dY/dG = 1/(1 − d)，税收乘数为 dY/dT = −d/(1 − d)。\n② 当投资不仅仅由实际利率决定，还受到实际产出的影响 I = Ī − ar + bY 时，可得：\n$$Y = c + d(Y − T) + Ī − ar + bY + G\n整理得：\n$$Y = (c − dT + Ī − ar + G)/(1 − d − b)\n此时财政支出乘数为 dY/dG = 1/(1 − d − b)，税收乘数为 dY/dT = −d/(1 − d − b)。\n（2）挤出效应是指政府支出增加所引起的私人投资降低的经济效应。在IS-LM模型中，增加政府购买支出会导致利率上升，从而导致私人投资下降。在以上两个模型中，挤出效应都存在。\n（3）在第一种情况下，dr/dY = −(1 − d)/a；在第二种情况下，dr/dY = −(1 − d − b)/a。因此第一种情况下IS曲线更加陡峭，货币政策效果更小。\n图形分析如下：IS₁ 表示第一种情况下的IS曲线，IS₂ 表示第二种情况下的IS曲线。实施扩张性的货币政策，LM曲线右移，由下图可知，第二种情况更有效。这是因为，在第二种情况下，投资不仅仅由实际利率所决定，还受到实际产出的影响，也就是实际产出的提高会带动投资增加，国民收入会有较大增加。\n【此处有图示】\n**【提示】**本题严格意义上来说出得不够严谨。题目中给出的投资函数与利率相关，严格来说此时是存在挤出效应的，但题目又没有给出LM曲线的表达式，因此没办法求出存在挤出效应时的乘数，所以答案给出的是不存在挤出效应的乘数。更为严谨的题目可见宏观拔高专项四，里面的题目更好更综合，弄懂其中的题目就可以掌握这一类题的解题思路。`},
{id:'h14',special:'宏观·AD-AS具体函数',qid:'A1 ★★★',question:'假定某经济存在以下关系：消费函数 C=1400+0.8YD，投资函数 I=200−50r，税收 T=0.25Y，政府购买支出 G=200，名义货币供给 M=900，价格水平 P=1，货币需求函数 L=0.4Y−100r。求：（1）总需求函数、均衡国民收入与利率；（2）假设该经济的充分就业收入为3800，如果用扩张性的财政政策实现充分就业，政府购买支出应增加多少？此时利率将变动到多少？（3）当总供给函数为 Y=3350+400P 时，求总供给与总需求均衡时的国民收入和价格水平。',answer:`**考察知识点**：AD-AS模型、IS-LM、财政政策。\n**思路**：求IS-LM；消去利率得AD；联立AS求均衡。\n**答案**：（1）AD:Y=3000+750/P；Y=3750，r=6。（2）ΔG=30；r=6.2。（3）Y=3750，P=1。\n##**详解**\n（1）由三部门经济产品市场均衡条件 Y = C + I + G 得：\n$$Y = 1400 + 0.8(Y − 0.25Y) + 200 − 50r + 200\n求得IS曲线方程：\n$$Y = 4500 − 125r\n由货币市场均衡条件 (M/P)^s = L(r,Y) 可得：\n$$900/P = 0.4Y − 100r\n求得LM曲线方程：\n$$Y = 2250/P + 250r\n联立IS和LM曲线方程，消去变量 r，得：\n$$Y = 3000 + 750/P\n此即为总需求函数。当价格水平 P = 1 时，将其代入LM曲线方程得 Y = 2250 + 250r，联立IS曲线方程得均衡国民收入为3750，均衡利率为6。\n（2）设增加政府购买支出 ΔG 时经济达到充分就业，由产品市场均衡条件得到新的IS曲线方程为：\n$$Y = 4500 − 125r + 2.5ΔG\n联立以下三个方程：\n$$Y = 4500 − 125r + 2.5ΔG，Y = 2250 + 250r，Y = 3800\n解得：r = 6.2，ΔG = 30。\n即如果用扩张性的财政政策实现充分就业，政府购买支出应增加30，此时利率将由6上升到6.2。\n（3）联立总需求函数 Y = 3000 + 750/P 和总供给函数 Y = 3350 + 400P，得总供给与总需求均衡时的国民收入为3750，价格水平为1。`},
{id:'h15',special:'宏观·AD-AS具体函数',qid:'A2 ★★★',question:'三部门组成的经济的消费函数 C=80+0.8Yd，投资函数 I=20−5r，货币需求函数 L=0.4Y−10r，政府购买支出 G=20，税收 T=0.25Y，名义货币供应量 M=90，充分就业的国民收入为285。其中 r 是利率，Yd 是可支配国民收入，Y 是国民收入。（1）若价格水平 P=2，则IS-LM决定的均衡国民收入与利率各为多少？（2）若总供给曲线为 Y=235+40P，总需求曲线与总供给曲线决定的均衡国民收入和价格各为多少？（3）若通过变动政府购买而实现充分就业，则求政府购买的变动量与价格水平？（4）若通过变动货币供应量而实现充分就业，则需要如何变动货币供应量？',answer:`**考察知识点**：AD-AS、IS-LM、财政/货币政策。\n**思路**：求IS-LM；得AD；联立AS；代入充分就业求政策。\n**答案**：（1）r=5，Y=237.5。（2）P=1，Y=275。（3）ΔG=15；P=1.25。（4）ΔM=37.5。\n##**详解**\n（1）由产品市场均衡条件 Y = C + I + G 可得：\n$$Y = 80 + 0.8(Y − 0.25Y) + 20 − 5r + G\n整理可得IS曲线方程为：\n$$Y = 250 − 12.5r + 2.5G\n由货币市场均衡条件 (M/P)^s = L(r,Y) 可得：\n$$M/P = 0.4Y − 10r\n整理可得LM曲线方程为：\n$$Y = 2.5M/P + 25r\n代入 G = 20，M = 90，P = 2 可得IS和LM曲线方程分别为：IS: Y = 300 − 12.5r；LM: Y = 112.5 + 25r。\n联立解得：r = 5，Y = 237.5。\n（2）联立IS、LM曲线方程可得AD曲线方程为：\n$$Y = 500/3 + 2.5M/(3P) + 5G/3\n代入 G = 20，M = 90，可得AD曲线方程：\n$$Y = 200 + 75/P\n联立AD、AS方程 200 + 75/P = 235 + 40P，解得：P = 1，Y = 275。\n（3）由（2）可知AD曲线方程为 Y = 500/3 + 2.5M/(3P) + 5G/3。假设新的政府购买量为 G′，代入 M = 90 可得AD方程：\n$$Y = 500/3 + 75/P + (5/3)G′\n联立AD、AS方程，代入充分就业产出 Y* = 285，解得 P = 1.25，G′ = 35，因此政府购买变动量 ΔG = G′ − G = 15。\n（4）由（2）可知AD曲线方程为 Y = 500/3 + 2.5M/(3P) + 5G/3。假设新的名义货币供给量为 M′，代入 G = 20 可得AD方程：\n$$Y = 200 + 2.5M′/(3P)\n联立AD、AS方程，代入充分就业产出 Y* = 285，解得 P = 1.25，M′ = 127.5，因此名义货币供给变动量 ΔM = M′ − M = 37.5。`},
{id:'h16',special:'宏观·AD-AS具体函数',qid:'A3 ★★★',question:'某经济由下列方程描述：消费函数 C=200+0.75(Y−T)，投资函数 I=250−20r，实际货币余额需求函数 (M/P)d=0.5Y−10r，政府购买 G=200，税收 T=200，货币供给 M=1000，价格水平为 P，社会总产出函数 Y=200√L，劳动供给函数 LS=16(W/P)²，W 是名义工资，r 是实际利率。价格和工资充分弹性。（1）求总需求曲线表达式；（2）求总供给曲线表达式；（3）求均衡产出、均衡价格和均衡工资。',answer:`**考察知识点**：AD-AS、劳动市场、总供给。\n**思路**：求IS-LM得AD；劳动市场均衡求AS；联立求均衡。\n**答案**：（1）AD:Y=400+1600/P。（2）AS:Y=4000。（3）P=4/9，Y=4000，W=20/9。\n##**详解**\n（1）由产品和货币市场均衡条件可得：\n$$IS: Y = 200 + 0.75(Y − 200) + 250 − 20r + 200\n$$LM: 1000/P = 0.5Y − 10r\n整理可得IS和LM曲线表达式分别为：\n$$Y = 2000 − 80r\n$$Y = 2000/P + 20r\n联立解得AD曲线表达式：\n$$Y = 400 + 1600/P\n（2）由于总产出函数为 Y = 200√L，因此劳动需求满足条件 MPL = W/P，即：\n$$100/√L = W/P\n解得劳动需求函数为：\n$$L^D = 10000(W/P)^(−2)\n由于价格和工资充分弹性，因此劳动市场出清 L^D = L^S，即：\n$$10000(W/P)^(−2) = 16(W/P)²\n解得均衡的实际工资 (W/P)* = 5，劳动量 L* = 400。\n此时的总供给曲线为：\n$$Y = 200√L* = 4000\n（3）联立AD和AS曲线 400 + 1600/P = 4000，解得均衡的价格水平 P* = 4/9，均衡产出 Y* = 4000。\n由（2）可知劳动市场均衡的实际工资 (W/P)* = 5，因此名义工资 W* = 20/9。`},
{id:'h17',special:'宏观·AD-AS具体函数',qid:'A4 ★★★',question:'假设经济体附有理性预期的总供给函数为 Ys=Yf+200(P−Pe)，总需求函数为 Yd=1000+G+20Ms/P，充分就业的国民收入为 Yf=4000，Pe 和 P 分别为人们对物价的预期和实际的物价水平。（1）如果经济已处于充分就业状态，近期不会有政策变化的预期，名义货币供给 Ms=1000，政府购买 G=1000，实际的物价水平是多少？（2）如果中央银行宣布名义货币供给增加1000，且言行一致，产量水平和实际价格水平将为多少？（3）如果中央银行公开宣布增加名义货币供应1000，实际却增加了5000，产量水平和实际价格水平是多少？（中财 801 经济学 2010 年考题）',answer:`**考察知识点**：理性预期、AD-AS、货币政策。\n**思路**：充分就业时 P=Pe；预期到的货币扩张只影响价格；未预期到的部分影响产出。\n**答案**：（1）P=10。（2）P=20，Y=4000。（3）P=30，Y=6000。\n##**详解**\n（1）如果经济已处于充分就业状态，近期不会有政策变化的预期，所以 P = P^e，此时总供给曲线为 Y_f = 4000。\n由于 G = 1000，M^s = 1000，所以总需求曲线为：\n$$Y^d = 1000 + 1000 + 20×1000/P = 2000 + 20000/P\n均衡时总供给与总需求相等，即：\n$$4000 = 2000 + 20000/P\n解得实际的物价水平 P = 10。\n（2）如果中央银行宣布名义货币供给增加1000，且言行一致，此时 P = P^e，总供给曲线仍为 Y_f = 4000。此时的总需求曲线为：\n$$Y^d = 1000 + 1000 + 20×2000/P = 2000 + 40000/P\n均衡时总供给与总需求相等，即 4000 = 2000 + 40000/P，解得实际的物价水平 P = 20。\n（3）由（2）可知，中央银行宣布名义货币供给增加1000且言行一致时 P^e = 20，但实际货币供给增加了5000，此时总供给曲线为：\n$$Y^s = 4000 + 200(P − 20) = 200P\n总需求曲线为：\n$$Y^d = 1000 + 1000 + 20×6000/P = 2000 + 120000/P\n均衡时总供给与总需求相等，即 200P = 2000 + 120000/P，解得 P = 30，Y = 6000。`},
{id:'h18',special:'宏观·AD-AS具体函数',qid:'A5 ★★★',question:'卢卡斯供给曲线：Y=2000(P−Pe)+Ye，其中，充分就业产出 Ye=4000；总需求曲线 Y=1000+3M/P，其中，货币供给 M=1000。（1）假设某一经济已经处于潜在产出水平，并且公众预期政策近期内不变，求价格水平；（2）假设中央银行宣布把货币供给增加到1500，公众预期到货币供给的增加，则当货币供给增加后，产出和价格水平的均衡值是多少？（3）假设当中央银行宣布把货币供给增加到1500，但是实际上却增加到2000，求新的产出水平和价格水平。（4）以上结论验证了理性预期理论的什么结论。',answer:`**考察知识点**：卢卡斯供给曲线、理性预期、货币政策。\n**思路**：预期到的货币变动中性；未预期到的货币变动影响产出。\n**答案**：（1）P=1。（2）P=1.5，Y=4000。（3）P≈1.732，Y≈4464。（4）预期到的货币供给只影响价格，未预期到的货币供给影响产出和价格。\n##**详解**\n（1）当经济处于潜在产出水平时，有：\n$$Y^e = 4000 = 1000 + 3×1000/P\n解得 P = 1。\n（2）当中央银行宣布增加货币供给，且公众能合理预期到时，有 P = P^e，此时总产出 Y = Y^e = 4000。由总需求曲线可得：\n$$4000 = 1000 + 3×1500/P\n解得 P = 1.5。\n（3）当中央银行宣布把货币供给从1000增加到1500时，公众预期的价格水平 P^e = 1.5，但实际上货币供给增到2000。此时卢卡斯供给曲线为：\n$$Y = 2000(P − 1.5) + 4000\n总需求曲线为：\n$$Y = 1000 + 3×2000/P\n联立解得：Y = 4464，P = 1.732（即 P = √3）。\n（4）以上结论说明，预期到的货币供给只影响价格，而对产出无影响；未预期到的货币供给的变化会使总产出、价格发生变化。`},
{id:'h19',special:'宏观·总供给曲线求解',qid:'A1 ★★★',question:'已知某宏观经济中的总量生产函数 Y=K^α L^β，α+β=1，K 和 L 分别为两个生产要素，它们相应的价格分别为 C 和 W，产出 Y 的价格为 P。（1）写出劳动需求函数；（2）写出总供给函数；（3）设 α=β=0.5，K=500，W=25，W/P=1，写出新凯恩斯学派的总供给函数和古典学派的总供给函数。',answer:`**考察知识点**：劳动需求、总供给函数、新凯恩斯与古典学派。\n**思路**：利润最大化求劳动需求；代入生产函数求AS。\n**答案**：（1）L=f(W/P)，劳动需求是实际工资的减函数。（2）Y=K(W/P)^(−(1−α)/α)(1−α)^((1−α)/α)。（3）新凯恩斯：Y=10P；古典：Y=250。\n##**详解**\n由已知条件可得利润函数为：\n$$π = P·K^α L^β − (CK + WL)\n（1）由利润最大化的一阶条件可得：\n$$∂π/∂L = βPK^α L^(β−1) − W = 0\n解得：\n$$L = (W/P)^(1/(β−1))·β^(1/(β−1))·K^(α/(β−1)) = (W/P)^(−1/α)·(1 − α)^(1/α)·K\n若 K、α 给定，劳动需求函数可以简写为 L = f(W/P)，显然，劳动需求是实际工资的减函数。\n（2）将劳动需求函数代入总量生产函数可得总供给函数：\n$$Y = K·(W/P)^(−(1−α)/α)·(1 − α)^((1−α)/α)\n可见，总供给 Y 是价格水平 P 的增函数。\n（3）将 α = β = 0.5，K = 500，W = 25 代入总供给函数得：\n$$Y = 10P\n它表明在技术条件给定、短期资本存量不变、工资刚性假设下，总供给是价格水平的增函数，这正是新凯恩斯学派的观点。\n再将 W/P = 1 代入，得 Y = 250。劳动市场的竞争性导致充分就业的实现，而实际工资为一常数。这样，产出是充分就业的产出（潜在产出），不受价格的影响，这正是古典学派的观点。`},
{id:'h20',special:'宏观·总供给曲线求解',qid:'A2 ★★★',question:'假设生产函数和劳动供给函数分别由以下两个式子 F(N)=20N−N² 和 NS=W/(2P) 刻画，其中 N 为工人人数，W 为名义工资，P 为价格水平。（1）求解劳动力市场均衡工资水平和均衡雇佣人数。（2）假设价格水平外生给定，若政府推行最低名义工资水平 W=50，计算存在最低工资时的均衡价格水平和就业人数。（3）在最低名义工资水平为50时，推导总供给曲线。（中财 801 经济学 2011 年考题）',answer:`**考察知识点**：劳动市场均衡、最低工资、总供给曲线。\n**思路**：求劳动需求与供给；分情况讨论最低工资下的均衡。\n**答案**：（1）W/P=10，N=5。（2）P=5，N=5。（3）总供给曲线分段：P<2.5 时 Y=0；2.5<P<5 时 Y=100−625/P²；P≥5 时 Y=500−625/P²。\n##**详解**\n（1）根据生产函数可知劳动的边际产出为 MP_N = 20 − 2N。劳动的需求由劳动的边际产出决定，因此劳动的需求函数为：\n$$W/P = 20 − 2N，即 N^D = 10 − W/(2P)\n已知劳动力供给函数为 N^s = (1/2)×(W/P)。由劳动市场供求均衡可知：\n$$W/(2P) = 10 − W/(2P)\n解得 W/P = 10，均衡雇佣人数 N = 5。\n（2）如果最低名义工资水平 W = 50，且此时达到劳动市场均衡，有劳动的需求函数 N^D = 10 − 25/P，劳动的供给函数 N^S = 25/P。联立方程可得价格水平 P = 5，就业人数 N = 5。\n（3）在最低名义工资为50时，劳动的需求函数为 N^D = 10 − 25/P，劳动供给函数为 N^S = 25/P。劳动力市场均衡时，价格水平 P = 5，就业人数 N = 5。下面进行分类讨论：\n① 当 N^D = 10 − 25/P ≤ 0，即价格水平 P ≤ 2.5 时，厂商生产会亏损，劳动力需求为0，此时代入生产函数，可得此时总供给曲线为 F(N) = 0。\n② 当劳动需求大于零，且小于劳动供给时，N^D = 10 − 25/P < 25/P = N^S，即 2.5 < P < 5，此时均衡的劳动数量由需求决定。将劳动需求函数代入生产函数可得此时总供给曲线为：\n$$F(N) = 20(10 − 25/P) − (10 − 25/P)² = 100 − 625/P²\n③ 当劳动需求大于劳动供给，N^D = 10 − 25/P ≥ 25/P = N^S，即 P ≥ 5，此时均衡的劳动数量由供给决定。将劳动供给函数代入生产函数可得此时总供给曲线为：\n$$F(N) = 20(25/P) − (25/P)² = 500/P − 625/P²`},
{id:'h21',special:'宏观·带有预期的AS',qid:'A1 ★★',question:'一个经济的总需求和总供给分别为：AD:m+v=p+y；AS:p=p*+λ(y−y*)。其中，p* 代表对价格水平的预期，y* 为充分就业产出水平，m 为货币总量。（1）若预期为完全预期，求出均衡的价格与产出水平。（2）若货币当局实行了一次意料外的并且是永久性的货币扩张，图解这次政策操作的短期和长期效应。（中山大学 2006 年考题）',answer:`**考察知识点**：AD-AS、预期、货币政策短期与长期效应。\n**思路**：完全预期时 p=p*；未预期到的货币扩张短期影响产出，长期只影响价格。\n**答案**：（1）y=y*，p=m+v−y*。（2）短期产出增加、价格上升，长期产出回到充分就业、价格进一步上升。\n##**详解**\n（1）如果预期为完全预期，则 p = p^e。由总供给 AS: p = p^e + λ(y − y^e) 可得，均衡时的产出水平为 y = y^e，即产出实现充分就业水平。\n此时，由总需求曲线 AD: m + v = p + y，可得均衡的价格水平为：\n$$p = m + v − y^e\n（2）若货币当局实行了一次意料外的并且是永久性的货币扩张，在短期内，人们可能没有意识到货币政策的改变，因此人们将不会调整其对价格的预期 p^e，此时经济中的产出将增加。\n如下图所示，由于预期 p^e 没有发生改变，短期总供给曲线为 AS₀，货币扩张使总需求曲线从 AD₀ 右移至 AD₁，产出从初始充分就业的产出 y^e 增至 y₁，价格水平由 p₀ 增至 p₁。\n但是，在下一期人们就会意识到发生了永久性的货币扩张，因此人们将修正其对价格的预期，总供给曲线将由 AS₀ 上移至 AS₁，产出重新回复到充分就业水平 y^e，价格上升为 p₂。\n【此处有图示】\n因此，货币扩张在短期内提高了产出，但是在长期，人们调整价格预期后，产出维持在充分就业水平不变，货币扩张只会引起价格水平同比例的上升。`},
{id:'h22',special:'宏观·带有预期的AS',qid:'A2 ★★',question:'假设一个经济体中的总需求曲线为 y=m+v−p，总供给曲线为 y=y*+λ(p−E(p))。其中 y、m、v、p 分别代表总需求、货币量、流通速度和物价水平，这些变量都为对数值；y*、E(p) 分别代表充分就业产量水平和预期物价水平，它们也都为对数值。（1）上述形式总需求方程的理论基础是什么？为什么货币量对总需求有正面影响，而物价水平对总需求的影响是负面的。（2）在总供给曲线中为什么预期价格的失误会导致总供给偏离充分就业水平？（3）该经济中的均衡产量水平是什么？它受什么因素的影响？与预期价格有关吗？（4）如果人们对价格的预期是理性的，该经济中的均衡产量水平是什么？你对此问题的回答与对上一个问题的回答有何不同？（5）在 v 是随机外在冲击的情况下，请问中央银行有没有必要采取货币政策以稳定经济于充分就业水平？',answer:`**考察知识点**：AD-AS、理性预期、货币政策有效性。\n**思路**：货币数量论；预期误差影响产出；理性预期下产出回到自然率。\n**答案**：（1）理论基础为货币数量论。（2）预期失误导致实际价格偏离预期价格，从而产出偏离充分就业。（3）y=y*/(1+λ)+λ(m+v−E(p))/(1+λ)；受货币量、流通速度、预期价格影响。（4）y=y*。（5）没有必要。\n##**详解**\n（1）总需求方程的理论基础是货币数量论，即费雪方程式 MV = PY。取对数可得：\n$$lnY = lnV + lnM − lnP\n即总需求为 y = m + v − p。对总需求方程关于物价水平和货币量求偏导可得：\n$$∂y/∂m > 0，∂y/∂p < 0\n因此，货币量对总需求有正面影响，而物价水平对总需求的影响是负面的。\n（2）根据总供给曲线方程 y = y* + λ(p − E(p)) 可知，当 p = E(p) 时，y = y*；而当 p ≠ E(p) 时，则 y ≠ y*，总供给偏离充分就业水平。也就是说，预期价格的失误是总供给偏离充分就业水平的直接原因。\n（3）当总供给等于总需求时，经济达到均衡，联立方程组：\n$$y = m + v − p，y = y* + λ(p − E(p))\n解得均衡产量水平为：\n$$y = y*/(1 + λ) + [λ/(1 + λ)]·(m + v − E(p))\n它受到货币量、流通速度、预期价格的影响。\n（4）当人们对价格的预期是理性的，则 p = E(p)，均衡产量为 y = y*。与上一问的差别在于：在预期有误的情况下，均衡产量受货币量、流通速度和预期价格的影响；而在理性预期下，产量恒等于充分就业水平，货币量等名义变量只影响价格，不影响产量。\n（5）中央银行没有必要采取货币政策稳定经济。因为公众对价格的预期是理性的，当随机外在冲击发生后，价格变动，而公众将会迅速调整自己对价格的预期，使经济回到充分就业水平。`},
{id:'h23',special:'宏观·带有预期的AS',qid:'B1 ★',question:'AD-AS模型由下式说明：AD:y=m−p；AS:p=pe+λ(y−y*)。其中 m 为货币供应量，p 为价格水平，y 为 GDP，pe 为预期价格，y* 为潜在 GDP（所有变量都取自然对数，但你不用考虑这些）。请回答：（1）假如预期价格是外生变量（你可以把它看成是一个常数），请计算均衡的GDP是多少？用经济学原理解释，当货币量增加时，GDP会如何变动？其内在机制是什么？（2）假如预期是完全预见，GDP是多少？货币量的增加对 GDP 的影响是什么？解释其内在机制。（3）什么是理性预期？利用模型说明，当公众使用理性预期时，预期价格是多少？实际价格是什么？均衡GDP是多少？（4）假如预期是理性预期，同时信息不完全，根据你对第（2）问的回答说明货币供给量增加对GDP的影响是什么？（5）在理性预期的条件下，讨论当货币量增加时有没有可能出现（1）和（2）的结果。如果有，各在什么情况下出现？（6）在理性预期条件下，政府想增加产量到潜在产量以上的做法会不会奏效？怎样才能奏效？从长远看结果怎样？（武汉大学考题）',answer:`**考察知识点**：AD-AS、理性预期、信息不完全、政策有效性。\n**思路**：分别讨论预期外生、完全预见、理性预期、信息不完全下的均衡。\n**答案**：略。\n##**详解**\n（1）均衡时总供给等于总需求，联立方程组：\n$$y = m − p，p = p^c + λ(y − y*)\n解得均衡GDP为：\n$$y = (m − p^c + λy*)/(1 + λ)\n对上式关于 m 求导得 ∂y/∂m = 1/(1 + λ) > 0，当货币供给增加时，GDP也将增加。题干中假设价格为一固定常数，说明此处讨论的是短期。在短期内，货币是非中性的，对产出、就业等实际变量能够产生实际影响。\n（2）当 p = p^c 时，均衡GDP为 y = y*。货币供给量的变动对GDP无影响。人们能够完全预期价格，说明在长期内货币是中性的，因此对实际产出无影响。\n（3）理性预期是在有效利用一切信息的前提下，对经济变量做出的在长期中平均说来最为准确的，而又与所使用的经济理论、模型相一致的预期。理性预期包含三个含义：① 做出经济决策的经济主体是有理性的；② 为正确决策，经济主体会在做出预期时力图获得一切有关的信息；③ 经济主体在预期时不会犯系统错误。\n可以把基于 t + j 期的信息对 t + i 期的价格 P 所做的理性预期记为：\n$$P^c_(t+i) = E_(t+j)P_(t+i)\n由于存在信息滞后，经济当事人通常是根据上一期的信息来形成对本期变量的预测，因此预期形式可写为 E_tP_(t+1)。\n当公众使用理性预期时，预期价格为 p，实际价格也为 p，均衡GDP是 y = y*。当公众完全预期到价格时，他们会自动调整自己的行为，使产出回复到潜在产出水平。\n（4）在信息不完全的情况下，人们对经济信息的处理能力是有限的，因此对价格的预期可能偏离实际价格，从而短期总供给曲线是向右上方倾斜的。当出现未预期到的货币供给增加时，实际价格将大于预期价格，根据总供给曲线 p = p^c + λ(y − y*) 可知，产出将大于充分就业水平下的产出。也就是说，货币供给的增加导致产出增加。\n（5）在理性预期的条件下，货币供给的增加可能导致（1）和（2）两种结果。在信息不完全的情况下，货币供给的增加对产出的影响可能会出现（1）的结果；而在长期内，人们修正自己的预期价格使之等于实际价格时，会出现（2）的结果。\n（6）① 不会奏效。根据总供给曲线 p = p^c + λ(y − y*)，在理性预期条件下 p = p^c，产量总是等于潜在产出。无论政府出台什么样的刺激政策，都不会改变产出水平，只会使价格上升。\n② 理性预期学派指出，产量大于潜在产量的幅度取决于实际价格和预期价格之间的差距，产量大于潜在产量的状态只可能在短期内存在，即 p > p^c 时才有 y > y*。由此可知，政策制定者想要其政策有效，就必须通过对价格预期和实际价格差额的影响来造成人们的幻觉，也就是说，宏观经济政策想要有效，必须具有欺骗性质。\n③ 因为宏观经济政策的有效性是以对厂商和工人的暂时欺骗而维持的，但人们会从上当中吸取教训，逐步使他们的预期更接近于准确，则宏观经济政策在长期内必然是无效的。在长期中，由于厂商和工人发现物价上涨所造成的错觉后，产出将回复到潜在产出水平。`},
{id:'h24',special:'宏观·汇率相关计算',qid:'A1 ★★',question:'加拿大的名义利率是每年12%，而美国是每年8%。假定国际资本流动使得这两个国家实际利率相等，购买力平价成立。（1）利用费雪方程，关于加拿大和美国的预期通货膨胀，你能作出什么推断？（2）关于加拿大元和美元之间汇率的预期变动，你能作出什么推断？（3）从一家美国银行以8%的利率借钱，存入利率为12%的一家加拿大银行，就可以赚到4%的利润。该说法对吗？',answer:`**考察知识点**：费雪方程、购买力平价、利率平价。\n**思路**：费雪方程 i=r+πe；购买力平价下预期汇率变动等于预期通胀差；套利分析。\n**答案**：（1）加拿大预期通胀比美国高4个百分点。（2）预期加元贬值4%。（3）说法不正确，套利后无利润。\n##**详解**\n（1）费雪方程为 i = r + π^e，其中 i、r、π^e 分别为名义利率、实际利率和预期的通货膨胀率。\n对于加拿大：12% = r_con + π_con^e，从而 r_con = 12% − π_con^e；\n对于美国：8% = r_us + π_us^e，从而 r_us = 8% − π_us^e。\n由于两个实际利率相等，即 r_con = r_us，从而有：\n$$π_con^e − π_us^e = 12% − 8% = 4%\n所以加拿大的预期通货膨胀率比美国的预期通货膨胀率要高4个百分点。\n（2）以美国为本国，采用间接标价法，e 表示1单位美元可兑换的加元数。实际汇率可以写为：\n$$ε = e·P_con/P_us\n由增长率的性质可得：\n$$Δε/ε = Δe/e + π_con − π_us\n由于购买力平价成立，实际汇率不变，所以 Δε/ε = 0，此时：\n$$Δe/e = π_con − π_us\n因为经济行为人是有理性的，会预期到上面等式成立。所以，预期的名义汇率变动等于加拿大的预期通货膨胀率减去美国的预期通货膨胀率，即：\n$$Δe^e/e^e = π_con^e − π_us^e\n由（1）可知 π_con^e − π_us^e = 4%，所以预期的名义汇率变动也是4%。\n（3）说法不正确，分析如下。以美国为本国，使用间接标价法，假设当前的名义汇率为1，即1单位美元可以兑换1单位加元。由（2）可知，一年后美元的名义汇率将上升4%，即一年后1单位美元可以兑换1.04单位加元。\n今年从美国以8%利率借入1美元，可以兑换成1单位加元，加拿大利率为12%，一年后获得1.12单位加元；一年后1.12单位加元可以兑换成 1.12/1.04 ≈ 1.08 单位美元，这正好等于他所需偿还的美国银行的本息。因此，他没有从这项交易中获得任何利润。`},
{id:'h25',special:'宏观·短期开放经济',qid:'A1 ★★★',question:'在蒙代尔-弗莱明模型中，考虑一个由以下方程所描述的小型开放经济：LM曲线方程 Y=2M/P+100i；IS曲线方程 Y=1000+2G−T+NX−50i；净出口方程 NX=2500−100e。其中 Y 为收入水平，i 为利率，e 为汇率（外币/本币）；设货币供应量 M=1000，价格水平 P=1，世界利率 i*=10，政府支出 G=500，税收收入 T=800。求（1）短期内该经济体的均衡国民收入和均衡汇率；（2）假设让 T 减少到500，该国采取浮动汇率制度，则新的均衡国民收入和新的均衡汇率将会是多少？（3）如果该国采取的是固定汇率，且该国欲将固定汇率值维持在本题（1）问中的均衡汇率水平，那么保持 G 不变，而 T 减少到500，新的均衡国民收入将会是多少？其中央行将怎样设定货币供给的大小以维持这个固定汇率水平？',answer:`**考察知识点**：蒙代尔-弗莱明模型、浮动/固定汇率、财政政策。\n**思路**：资本完全流动下 i=i*；分别求IS-LM；固定汇率下货币供给内生。\n**答案**：（1）Y=3000，e=2。（2）Y=3000，e=5。（3）Y=3300；央行应设定 M=1150。\n##**详解**\n（1）蒙代尔-弗莱明模型的一个重要假设是资本的自由流动使得小国开放经济的利率等于世界利率，因此在世界利率 i* = 10 的情况下，国内 i 也必然等于10。\n将 M = 1000，P = 1，i = 10 代入LM曲线方程，得LM曲线方程为：\n$$Y = 2×1000 + 100×10 = 3000\n将 G = 500，T = 800，NX = 2500 − 100e 以及 i = 10 代入IS曲线方程，整理得IS曲线方程为：\n$$Y = 1000 + 1000 − 800 + (2500 − 100e) − 500 = 3200 − 100e\n联立IS、LM方程解得均衡国民收入和均衡汇率分别为 Y = 3000 和 e = 2。\n（2）让 T 减少到500，LM曲线方程不变，仍为 Y = 3000。将 G = 500，T = 500，NX = 2500 − 100e 以及 i = 10 代入IS曲线方程，整理得新的IS曲线方程为：\n$$Y = 1000 + 1000 − 500 + (2500 − 100e) − 500 = 3500 − 100e\n联立新的IS和LM曲线方程，解得均衡国民收入和均衡汇率分别为 Y = 3000 和 e = 5。\n（3）如果该国采取的是固定汇率，且欲将固定汇率值维持在本题（1）问中的均衡汇率水平即 e = 2。由（2）可知，当 T = 500 时，IS曲线方程为 Y = 3500 − 100e。\n设中央银行设定货币供给的大小为 M′，将 P = 1，i = 10 代入LM曲线方程，整理可得新的LM曲线方程为：\n$$Y = 2M′ + 1000\n联立新的IS和LM曲线方程，代入 e = 2 解得：Y = 3300，M′ = 1150，即中央银行应该将名义货币供给设定在1150。`},
{id:'h26',special:'宏观·短期开放经济',qid:'A2 ★★★',question:'在一个小国模型中不考虑价格变化（简化为1），假设货币需求是 L=0.2Y−10r，Y 和 r 分别是收入和利率，货币供给 M=200，消费 C=60+0.8Yd，Yd 为可支配收入，税收 T=100，投资 I=150−2r，政府支出 G=100。（1）封闭经济下均衡的国民收入、利率和投资；（2）如果该国资本完全流动，世界利率为1.5，则均衡的国民收入为多少；（3）在开放条件（资本完全流动）下，当政府支出由100增加到120，均衡的国民收入怎样变动？挤出效应是多少。',answer:`**考察知识点**：封闭与开放经济、蒙代尔-弗莱明、挤出效应。\n**思路**：封闭经济求IS-LM；开放经济利率等于世界利率；浮动/固定汇率下政策效果不同。\n**答案**：（1）r=2.5，Y=1125，I=145。（2）Y=1075。（3）浮动汇率下财政政策完全无效，挤出效应100；固定汇率下无挤出效应，收入增加100。\n##**详解**\n（1）由产品市场均衡条件 Y = C + I + G 可得：\n$$Y = 60 + 0.8(Y − 100) + 150 − 2r + 100\n整理可得IS曲线方程：\n$$Y = 1150 − 10r\n由货币市场均衡条件 M/P = L(r,Y) 可得 200 = 0.2Y − 10r，整理可得LM曲线方程：\n$$Y = 1000 + 50r\n联立IS和LM曲线方程可以解得均衡利率和均衡收入分别为：r = 2.5，Y = 1125。因此 I = 150 − 2×2.5 = 145。\n（2）资本完全流动的小型开放经济，其利率 r = r* = 1.5。由货币市场均衡条件 M/P = L(r,Y) 可得：\n$$200 = 0.2Y − 10×1.5\n整理可得LM*曲线方程：Y = 1075。因此开放经济下均衡的国民收入为1075。\n（3）① 浮动汇率制下，此时财政政策完全无效，存在完全挤出，当政府支出由100增加到120时，均衡的国民收入不变。\n在不考虑货币市场作用下，政府支出增加20使国民收入增加：\n$$ΔY = ΔG/(1 − MPC) = 20/(1 − 0.8) = 100\n因此浮动汇率制下挤出效应为100。\n② 固定汇率制下，此时不存在挤出效应，均衡收入增加量 ΔY = 100。\n**【提示】**本题的新颖之处在于没有给出净出口函数的表达式，因此无法求出开放经济下IS*曲线的表达式，但是根据资本完全流动的小型开放经济在固定汇率制和浮动汇率制下的条件，仍然可以求出挤出效应和国民收入变动量。这里求挤出效应的思路和前面封闭经济求挤出效应的思路完全一样，如果大家忘了要及时回顾。`},
{id:'h27',special:'宏观·短期开放经济',qid:'A3 ★★★',question:'假设大型开放经济在短期内可以用下列等式描述：C=0.5(Y−T)，T=1000，I=2500−250r，G=1500，NX=1000−250e，M/P=0.5Y−500r，M=1000，P=1，CF=500−250r，NX=CF。（1）求短期均衡的产出、利率、汇率、贸易余额和资本净流出。（2）假设经济体实行浮动汇率制，为实现贸易平衡，求政府税收变动量，以及新均衡的产出、利率和汇率水平。（3）假设经济体实行固定汇率制，当政府购买增加500，为保证经济的汇率处于（1）中水平，求此时货币供给变动量。',answer:`**考察知识点**：大型开放经济、浮动/固定汇率、财政政策。\n**思路**：产品市场均衡 Y=C+I+G+CF；货币市场均衡；外汇市场均衡 NX=CF。\n**答案**：（1）Y=5000，r=3，e=5，NX=−250，CF=−250。（2）ΔT=2000；Y=4000，r=2，e=4。（3）ΔM=500。\n##**详解**\n（1）由于 NX = CF，所以产品市场短期均衡条件为 Y = C + I + G + CF。由此可得：\n$$Y = 0.5(Y − 1000) + 2500 − 250r + 1500 + 500 − 250r\n整理可得IS曲线为：\n$$Y = 8000 − 1000r\n由货币市场均衡条件 M/P = L(r,Y) 可得 1000/1 = 0.5Y − 500r，整理可得LM曲线为：\n$$Y = 2000 + 1000r\n联立IS、LM可得产品市场均衡时的产出和利率 Y = 5000，r = 3，资本净流出 CF = 500 − 250×3 = −250。\n外汇市场均衡时满足 NX = CF，即：\n$$−250 = 1000 − 250e\n解得均衡汇率 e = 5，净出口 NX = −250。\n（2）当贸易平衡时，NX = 1000 − 250e = 0，解得汇率水平 e = 4。\n外汇市场均衡时满足 NX = CF，所以 CF = 500 − 250r = 0，解得产品与货币市场均衡时的利率 r = 2。假设政府税收变动量为 ΔT，由产品市场均衡条件得：\n$$Y = 0.5(Y − 1000 − ΔT) + 2500 − 250r + 1500 + 500 − 250r\n整理可得新的IS曲线为：\n$$Y = 8000 − 1000r − ΔT\n联立新的IS和原LM曲线方程，代入 r = 2，解得：Y = 4000，ΔT = 2000，所以政府应该增税2000。\n（3）外汇市场均衡时满足 NX(e) = CF，为保证汇率不变，资本净流出量需要保持不变。由于 CF = 500 − 250r，只有利率水平不变，资本净流出量才不变。所以政府购买变动后，货币政策的目标是使得产品与货币市场均衡时的利率维持（1）中的水平不变。\n假设名义货币供给变动量为 ΔM，由产品和货币市场均衡条件可得：\n$$Y = 0.5(Y − 1000) + 2500 − 250r + 2000 + 500 − 250r\n$$(1000 + ΔM)/1 = 0.5Y − 500r\n代入（1）中 r = 3，解得：Y = 6000，ΔM = 500。`},
{id:'h28',special:'宏观·长期开放经济',qid:'A1 ★★★',question:'考虑一个由下列方程所描述的资本完全流动的小型开放经济：Y=C+I+G+NX，Y=5000，G=1000，T=1000，C=250+0.75(Y−T)，I=1000−50r，NX=500−500e，r=r*=5。（1）求该经济的国民储蓄、投资、贸易差额及均衡汇率；（2）现在假定 G 增加到1250，求国民储蓄、投资、贸易差额及均衡汇率，并解释你的结果；（3）现在假定世界利率由5上升至10，求国民储蓄、投资、贸易差额及均衡汇率，并解释你的结果。',answer:`**考察知识点**：小型开放经济长期模型、储蓄、投资、贸易差额、汇率。\n**思路**：国民储蓄 S=Y−C−G；投资 I=I(r*)；贸易差额 NX=S−I；汇率由 NX(e)=S−I 决定。\n**答案**：（1）S=750，I=750，NX=0，e=1。（2）S=500，I=750，NX=−250，e=1.5。（3）S=750，I=500，NX=250，e=0.5。\n##**详解**\n（1）消费 C = 250 + 0.75×(5000 − 1000) = 3250\n因此国民储蓄 S = Y − C − G = 5000 − 3250 − 1000 = 750\n本国利率 r = r* = 5，因此投资 I = 1000 − 50r = 1000 − 50×5 = 750\n因此贸易差额 NX = (Y − C − G) − I = S − I = 750 − 750 = 0，即 500 − 500e = 0，因此均衡汇率 e = 1。\n（2）当 G = 1250 时，消费 C = 250 + 0.75×(5000 − 1000) = 3250，因此国民储蓄 S = Y − C − G = 5000 − 3250 − 1250 = 500。\n投资 I = 1000 − 50r = 1000 − 50×5 = 750。\n因此贸易差额 NX = S − I = 500 − 750 = −250，即 500 − 500e = −250，因此均衡汇率 e = 1.5。\n由此可见，政府支出增加减少了国民储蓄，但是由于世界市场的实际利率不变，使得投资也保持不变。其结果是，国内投资大于国内储蓄，一部分资本需要从国外借入，资本净流出为负，本币升值，净出口减少。\n（3）当世界利率 r* = r = 10 时，消费 C = 250 + 0.75×(5000 − 1000) = 3250，因此国民储蓄 S = Y − C − G = 5000 − 3250 − 1000 = 750。\n投资 I = 1000 − 50×10 = 500。\n因此贸易差额 NX = S − I = 750 − 500 = 250，即 500 − 500e = 250，因此均衡汇率 e = 0.5。\n这里国民储蓄与（1）中相同，但是更高的利率使得投资下降，资本净流出增加，本币贬值，净出口增加。\n**【提示】**本题实质上考察的是小型开放经济的长期模型，对应曼昆第九版或第十版第6章《开放经济》的内容。`},
{id:'h29',special:'宏观·长期开放经济',qid:'A2 ★★',question:'假设下列方程描述了一个大型开放经济：Y=5000，C=0.5(Y−T)，I=2000−100r，NX=500−500e，CF=−100r，CF=NX，G=1500，T=1000。（1）求解均衡的产出与汇率，以及此时的消费量、净出口量与资本净流出量。（2）政府增税1000，求解新均衡的实际汇率与净出口量，并对这一均衡结果的变化给出经济学解释。（3）政府实施贸易限制政策，新的净出口曲线为 NX=1000−500e，求解新均衡的实际汇率与净出口量，并对这一均衡结果的变化给出经济学解释。',answer:`**考察知识点**：大型开放经济、可贷资金市场、外汇市场、贸易政策。\n**思路**：可贷资金市场均衡 S=I+CF；外汇市场均衡 CF=NX(e)。\n**答案**：（1）r=2.5，C=2000，CF=−250，e=1.5，NX=−250。（2）r=0，CF=0，e=1，NX=0。（3）r=2.5，CF=−250，e=2.5，NX=−250。\n##**详解**\n（1）可贷资金市场均衡时满足 S = I(r) + CF(r)，即：\n$$5000 − (1/2)×(5000 − 1000) − 1500 = 2000 − 100r − 100r\n解得均衡利率 r = 2.5。\n此时资本净流出量 CF = −100×2.5 = −250，消费量 C = (1/2)×(5000 − 1000) = 2000。\n外汇市场均衡时满足 CF = NX(e)，即：\n$$−250 = 500 − 500e\n解得均衡汇率 e = 1.5。此时的净出口量 NX = 500 − 500×1.5 = −250。\n（2）政府增税1000以后，由可贷资金市场均衡条件 S = I + CF 可得：\n$$5000 − (1/2)×(5000 − 2000) − 1500 = 2000 − 100r − 100r\n解得均衡利率 r = 0，资本净流出量 CF = 0。由外汇市场均衡条件 CF = NX(e) 可得 0 = 500 − 500e，解得均衡汇率 e = 1，净出口量 NX = 0。\n一国的净出口量由国民储蓄与投资的差额 S − I 决定。当政府增税以后，居民可支配收入减少，消费减少，因此国民储蓄 S = Y − C − G 增加，对应的净出口增加。同时，国民储蓄增加，可贷资金市场上可贷资金的供给增加，利率下降，资本净流出增加，外汇市场本币供给增加，本币的价格——汇率下降。\n（3）净出口曲线变为 NX = 1000 − 500e 以后，此时可贷资金市场均衡结果不变，即均衡利率 r = 2.5，资本净流出 CF = −250。由外汇市场均衡条件 CF = NX(e) 可得：\n$$−250 = 1000 − 500e\n解得均衡汇率 e = 2.5，此时的净出口量 NX = −250。\n当政府实施贸易限制政策时，不影响国民储蓄和投资，因此贸易政策不影响可贷资金市场的均衡利率和贸易余额。均衡利率不变，所以外汇市场上本币的供给不变，但由于净出口曲线右移，本币的需求增加，对应的，本币的价格——汇率上升。`},
{id:'h30',special:'宏观·数量论与通胀',qid:'A1 ★★',question:'假定一国的货币需求函数为 (M/P)d=kY，式中，k 为一个常数。货币供给每年增加12%，实际收入每年增长4%。（1）平均通货膨胀率是多少？（2）如果实际收入增长更快，通货膨胀将会有什么不同？请作出解释。（3）假定货币需求函数不再是不变的，相反，该经济的货币流通速度由于金融创新而稳定地上升。这将会如何影响通货膨胀率？请作出解释。',answer:`**考察知识点**：货币数量论、通货膨胀率、货币流通速度。\n**思路**：由 M/P=kY 得通胀率=货币增长率−实际收入增长率；货币流通速度上升增加通胀。\n**答案**：（1）8%。（2）实际收入增长更快会降低通胀率。（3）货币流通速度上升会提高通胀率。\n##**详解**\n（1）由货币需求函数 (M/P)^d = kY 可以得出下式：M 变动百分比 − P 的变动百分比 = k 的变动百分比 + Y 的变动百分比。\n其中 k 是固定的，所以其变动率为0。由题目可知货币供给每年增加12%，实际收入每年增长4%，代入上式可知平均通货膨胀率为8%。\n（2）如果实际收入增长更快，会导致更低的平均通货膨胀率。\n（3）由（1）得知：P 的变动百分比 = M 变动百分比 − Y 变动百分比。\n因为 k = 1/V，货币流通速度的上升导致 k 的减小，由上式可知平均通货膨胀率增加。由于货币流通速度变快，同样数目的通货交易得更加频繁，花在每一单位交易的商品上的通货数目增加了，由此导致了物价的上升。`},
{id:'h31',special:'宏观·数量论与通胀',qid:'A2 ★★',question:'假定货币需求函数的形式为 (M/P)d=L(i,Y)=Y/(5i)。（1）如果产出增长速度为 g，实际货币余额需求将会以什么速度增长（假定名义利率恒定）？（2）这一经济的货币流通速度是多少？（3）如果通货膨胀和名义利率恒定，那么，货币流通速度将会以什么速度增长（如果有的话）？（4）利率水平的一个永恒的（一次性）增加将如何影响货币流通速度？它将如何影响随后的货币流通速度增长率？',answer:`**考察知识点**：货币需求、货币流通速度、利率。\n**思路**：求实际货币余额增长率；由 V=PY/M 求流通速度；分析利率影响。\n**答案**：（1）以速度 g 增长。（2）V=5i。（3）增长速度为0。（4）利率一次性增加使货币流通速度一次性增加，但增长率仍为0。\n##**详解**\n（1）如果货币需求函数的形式为 (M/P)^d = L(i,Y) = Y/(5i)，那么可得：\n$$Δ(M/P)/(M/P) = ΔY/Y − Δi/i\n当名义利率 i 不变的时候，实际货币余额需求的增长速度就等于产出的增长速度 g。\n（2）由货币数量方程式 MV = PY 可求出货币流通速度 V = PY/M。而其中的 P/M 正是实际货币余额需求的倒数 1/L(i,Y)，所以：\n$$V = (5i/Y)·Y = 5i\n（3）如果通货膨胀率和名义利率恒定，那么货币流通速度也应该是恒定的，增长速度为0。\n（4）利率水平的永久性增加将使货币流通速度永久性增加，利率水平的一次性增加也将使货币流通速度一次性增加。但是，只要利率的长期增长速度为0，货币流通速度增长率也为0。`},
{id:'h32',special:'宏观·菲利普斯曲线',qid:'A1 ★★★',question:'假设一国的菲利普斯曲线为 π=πe−3(u−un)，自然失业率为5%。对通货膨胀的预期为适应性预期，中央银行对下一年的通货膨胀目标为2%。（1）如果当前的通货膨胀率为5%，那么中央银行为实现下一年的通货膨胀目标，能够引起的失业率是多少？（2）如果中央银行在次年继续保持2%的通货膨胀目标，那么失业率将是多少？（3）根据奥肯定律，计算降低通货膨胀的产出牺牲率。（4）如果对通货膨胀的预期为理性预期，那么产出牺牲率为多少？（南开 2007 年考题）',answer:`**考察知识点**：菲利普斯曲线、适应性预期、理性预期、牺牲率。\n**思路**：适应性预期下 πe=π−1；奥肯定律；理性预期下牺牲率为0。\n**答案**：（1）u=6%。（2）u=5%。（3）牺牲率≈0.67%。（4）牺牲率为0。\n##**详解**\n（1）由题知该国的预期为适应性预期，通胀预期 π^e = π_(−1) = 5%，通胀水平 π = 2%，自然失业率 u_n = 5%。代入菲利普斯曲线 π = π^e − 3(u − u_n) 可得：\n$$2% = 5% − 3(u − 5%)\n解得失业率 u = 6%。即如果当前的通货膨胀率为5%，那么中央银行为实现下一年的通货膨胀目标，能够引起的失业率是6%。\n（2）如果中央银行在次年继续保持2%的通货膨胀目标，即有 π = π^e = 2%。根据菲利普斯曲线 π = π^e − 3(u − u_n) 可得 u = u_n = 5%，即次年的失业率为自然失业率。\n（3）根据奥肯定律：\n$$(Y − Y_f)/Y_f = −2(u − u_n)\n失业率每高于自然失业率1个百分点，实际GDP将低于潜在GDP 2个百分点。根据第（1）问计算可得，降低3个百分点的通货膨胀率，将使失业率高于自然失业率1个百分点，因此实际GDP将低于潜在GDP 2个百分点。所以牺牲率 = 2%/3 ≈ 0.67%。\n（4）如果对通货膨胀的预期为理性预期，那么产出牺牲率为零。分析如下：理性预期表明 π = π^e，因而 u = u_n，因此无论通货膨胀如何变化，失业率一直处于自然失业率水平，即失业率恒定不变，从而产出不变，因此牺牲率为零。`},
{id:'h33',special:'宏观·菲利普斯曲线',qid:'A2 ★★★',question:'假设一个经济有以下菲利普斯曲线：π=π−1−0.5(u−0.06)。（1）自然失业率是多少？（2）画出通货膨胀与失业之间的短期与长期关系。（3）为了使通货膨胀减少5个百分点，必须有多少周期性失业？用奥肯定律计算牺牲率。（4）通货膨胀为10%，美联储想把它降到5%。给出两种能达到这个目标的方案。',answer:`**考察知识点**：菲利普斯曲线、自然失业率、牺牲率、奥肯定律。\n**思路**：自然失业率使 π=π−1；牺牲率由失业率变动和奥肯定律求；两种方案对应不同失业路径。\n**答案**：（1）6%。（2）短期向右下方倾斜，长期垂直。（3）周期性失业10个百分点；牺牲率4%。（4）方案一：一年高失业率；方案二：多年较低失业率。\n##**详解**\n（1）自然失业率是通货膨胀率没有偏离预期通货膨胀率时的失业率。根据菲利普斯曲线 π = π₋₁ − 0.5(u − 0.06)，当 π = π₋₁ 时可得 u = 0.06，因此自然失业率就是6%。\n（2）① 在短期，预期通货膨胀率固定为上一期的实际通货膨胀率，即 π^e = π₋₁。因此，在短期内，通货膨胀和失业率之间遵循菲利普斯曲线，它的斜率为 −0.5，通过 π^e = π₋₁ 且 u = 0.06 这一点，通货膨胀和失业率之间存在短期替代关系。\n② 在长期，预期通货膨胀率等于实际通货膨胀率，π = π^e = π₋₁，所以产出和失业率都等于自然率水平。因此长期菲利普斯曲线是一条失业率为6%的垂直线。\n【此处有图示】\n（3）为了使通货膨胀减少5个百分点，必须有10个百分点的周期性失业率，牺牲率为4%。计算如下：\n菲利普斯曲线为 π − π₋₁ = −0.5(u − 0.06)。现在通货膨胀减少5个百分点，即 π − π₋₁ = −0.05，代入菲利普斯曲线得：\n$$−0.05 = −0.5(u − 0.06)\n即 u = 0.16，因此需要高于自然失业率10个百分点的周期性失业率。\n奥肯定律说明，如果失业率上升1%，那么实际GDP损失2%。因此，当失业率从自然失业率上升了10个百分点时，GDP将损失20个百分点。而牺牲率是通货膨胀每降低一个百分点所必需承受的每年实际GDP减少的百分比，所以牺牲率 = 20%/5 = 4%。\n（4）要实现这个目标，至少有两个方案。一种方案是在短期中拥有很高的失业率，比如在一年中造成高达16%的失业率；另一个方案是在一个较长的时间内拥有较低的失业率，比如在5年内拥有8%的失业率。这两个方案都能把通货膨胀率从10%降到5%，但是速度不同。`},
{id:'h34',special:'宏观·菲利普斯曲线',qid:'A3 ★★★',question:'假设一个经济体有如下的菲利普斯曲线：通货膨胀率=去年的通货膨胀率−0.5(失业率−0.05)。（1）这条菲利普斯曲线对于通胀的假设，是理性预期还是适应性预期？（2）这一经济体的自然失业率是多少？（3）假设初始时，失业率等于自然失业率。为了使通货膨胀率比去年降低0.02，需要周期失业率达到多少？（4）假设初始时，失业率等于自然失业率，通货膨胀等于0。如果使失业率降为0.03，之后一直保持不变，计算第一年、第二年和第十年的通货膨胀率？（中财 803 经济学综合 2022 年考题）',answer:`**考察知识点**：菲利普斯曲线、适应性预期、自然失业率。\n**思路**：适应性预期下预期通胀等于去年通胀；代入不同失业率计算。\n**答案**：（1）适应性预期。（2）5%。（3）周期性失业率4%。（4）第一年0；第二年0.01；第十年0.09。\n##**详解**\n（1）适应性预期是指经济当事人以过去的经验为基础并根据他们以前的预期误差程度来修正每一期的预期，适应性预期模型中的预期变量依赖于该变量的历史信息。由经济的菲利普斯曲线方程 π_t = π₋₁ − 0.5(u − 0.05) 可知，该经济体 Eπ = π₋₁，即通胀预期等于上一期的通胀水平，因此该菲利普斯曲线是适应性预期的。\n（2）由题意可知 Eπ = π₋₁，并且菲利普斯曲线为 π_t = π₋₁ − 0.5(u − 0.05)，所以当 π = π₋₁ 时，经济处于自然失业率，即自然失业率为5%。\n（3）当通胀减少0.02，即 π_t − π₋₁ = −0.02 时，代入菲利普斯曲线得：\n$$−0.02 = −0.5(u − 0.05)\n解得此时的失业率 u = 9%，对应的周期性失业率 u − 5% = 4%。\n（4）初始失业率为自然失业率，记为 u_t = 0.05，此时 π₁ = π₀。失业率永久变为0.03，即 u₂ = u₃ = … = 0.03。\n第二年的通货膨胀率为：\n$$π₂ = π₁ − 0.5(u₂ − 0.05) = π₀ − 0.5×(0.03 − 0.05) = π₀ + 0.01\n第三年的通货膨胀率为：\n$$π₃ = π₂ − 0.5(u₃ − 0.05) = π₀ + 0.01 + 0.01 = π₀ + 0.02\n以此类推，可以得到第十年的通货膨胀率为 π₁₀ = π₀ + 0.09。已知 π₀ = 0，故第一年、第二年、第十年的通货膨胀率分别为 0、1%、9%。`},
{id:'h35',special:'宏观·菲利普斯曲线',qid:'A4 ★★',question:'假定经济的菲利普斯曲线是：π=π−1−0.5(u−u*)，而且自然失业率是过去两年失业的平均数：u*=0.5(u−1+u−2)。（1）为什么自然失业率会取决于最近的失业（正如在上式中所假设的）？（2）假设美联储遵循永久性地降低通货膨胀1%的政策。这种政策对一段时期中的失业率有什么影响？（3）这个经济中的牺牲率是多少？请解释。（4）这些方程式对通货膨胀与失业之间的短期和长期取舍关系意味着什么？（中国人民大学 2011 年考题，北大软微 2022 年考题）',answer:`**考察知识点**：菲利普斯曲线、滞后效应、牺牲率。\n**思路**：滞后理论；失业率动态调整；牺牲率计算；短期与长期取舍关系。\n**答案**：（1）滞后理论，近期失业影响自然失业率。（2）第一年失业率高于自然失业率2个百分点，之后逐步调整。（3）牺牲率4%。（4）短期存在取舍，长期因滞后也存在取舍。\n##**详解**\n在这个模型中，自然失业率是过去两年失业率的平均数。因此，如果某些年份经济衰退使失业率增加，则自然失业率也会增加。这意味着模型体现了滞后性：短期的周期性失业影响了长期的自然失业率。\n（1）滞后理论认为，自然失业率取决于近期的失业率至少有两个原因：① 近期的失业率会增加摩擦性失业，提高自然失业率——失业工人失去了工作技能并且难以找到工作，同时失业工人可能会失去工作意愿从而不努力找工作；② 近期的失业率会增加等待性失业，提高自然失业率。\n（2）美联储遵循永久性地降低通货膨胀1%的政策会使一段时期的失业率上升。由菲利普斯曲线知，在第一期：\n$$π₁ − π₀ = −1 = −0.5(u₁ − u₁*) ⟹ u₁ − u₁* = 2\n这意味着失业率要在自然失业率的基础之上上升2%，同时下一期自然失业率将会作为周期性失业的结果上升。新的自然失业率为：\n$$u₂* = 0.5(u₁ + u₀) = 0.5[(u₁* + 2) + u₁*] = u₁* + 1\n因此新的自然失业率上升1%。如果美联储想将通货膨胀率保持在新的水平，那么第二期的失业率必须等于新的自然失业率 u₂*，即 u₂ = u₁* + 1。在接下来的每一期，失业率始终等于自然失业率，自然失业率再也回不到原始水平：\n$$u₃ = u₃* = (1/2)u₂ + (1/2)u₁ = u₁* + 3/2\n$$u₄ = u₄* = (1/2)u₃ + (1/2)u₂ = u₁* + 5/4\n$$u₅ = u₅* = (1/2)u₄ + (1/2)u₃ = u₁* + 11/8\n因此，如果美联储永久性地降低通货膨胀1%，则第一年失业率要在自然失业率的基础之上上升2%，以后的每年失业率等于当年的自然失业率。\n（3）这个经济的牺牲率是4%。分析如下：如果通货膨胀率下降1个百分点，失业率要在自然失业率的基础之上上升2%，则根据奥肯定律，GDP要损失4%，则牺牲率 = 4%/1 = 4%。\n（4）如果没有滞后作用，则通货膨胀与失业之间只存在短期的而非长期的取舍关系；若有滞后作用，则通货膨胀与失业之间不仅存在短期取舍关系，还存在长期取舍关系。`},
{id:'h36',special:'宏观·宏观经济政策',qid:'A1 ★★',question:'假设政府的目标函数是 W(u,π)=−L(u,π)=−(u²+yπ²)，同时面对的非利普斯曲线为 π=πe−β(u−u*)，其中 πe 是居民的通货膨胀预期，u* 是自然失业率。首先由政府宣布自己的政策目标 π0，然后理性预期的居民在看到政府的宣布后形成自己的预期，政府观察到居民的预期后决定实际的货币政策 π。（1）请计算并比较在固定规则与相机制定规则下社会福利的大小，并给出相应的解释。（2）关于通货膨胀率，在相机制定规则下，政府能否做出零通货膨胀的承诺？为什么？如果不能，那么在相机制定规则政府能够做出的可信承诺是什么？（上财 2008 年考题）',answer:`**考察知识点**：政策规则、相机抉择、理性预期、动态不一致。\n**思路**：固定规则下 π=πe；相机抉择下求最优通胀；比较社会福利。\n**答案**：（1）固定规则下通胀为0，失业率为自然失业率；相机抉择下通胀为正，失业率仍为自然失业率，社会福利更小。（2）不能；可信承诺为 πe=u*/(βy)。\n##**详解**\n（1）① 固定规则下，中央银行宣布将实行一确定的通货膨胀率，设 π₀ 为预先宣布的通货膨胀率，经济主体又都确信中央银行的政策，则 π^e = π = π₀。代入菲利普斯曲线 π = π^e − β(u − u*)，解得 u = u*，此时的失业率为自然失业率。\n由此可见，无论中央银行宣布的通货膨胀率 π₀ 是多少，失业率都为自然失业率，所以任何通货膨胀只会增加央行的损失，央行宣布零通货膨胀率是最优的，即 π = π^e = π₀ = 0。此时社会福利 W = −(u*)²。\n② 相机抉择下，先把菲利普斯曲线方程转化为：\n$$u = u* − (π − π^e)/β\n再代入政府的目标函数，得：\n$$W = −[u* − (π − π^e)/β]² − yπ²\n由目标函数最大化的一阶条件可得：\n$$dW/dπ = (2/β)[u* − (π − π^e)/β] − 2yπ = 0\n解得：\n$$π = (βu* + π^e)/(1 + yβ²)\n具有理性预期的居民最终预期的通货膨胀率等于实际通货膨胀率 π = π^e，代入上式可得：\n$$π = u*/(βy) > 0\n由于 π = π^e，由菲利普斯曲线知 u = u*，失业率为自然失业率。\n比较两种情况下的最优结果：失业率都为自然失业率，相机抉择下通货膨胀率更高，社会福利更小（政府的目标就是追求高社会福利，政府的目标函数就是社会福利函数，目标函数值越大就意味着社会福利越大）。\n解释如下：① 原因在于相机抉择规则下，具有理性预期的居民不会相信政府的通货膨胀承诺。相机抉择的政府为了追求社会福利的最大化是不会选择零通货膨胀的，所以政府难以实现零通货膨胀目标。② 同时，由于理性预期，居民的通货膨胀预期等于实际通货膨胀率，实际失业率等于自然失业率，所以相对于固定规则，最终的失业率相同，而通货膨胀率更高。\n（2）在相机抉择的规则下，政府行为存在动态不一致性，零通货膨胀不是政府的最优选择，所以居民不会相信政府的零通货膨胀承诺。根据（1）的计算，相机抉择下政府能够做出的可信承诺是：\n$$π = u*/(βy) > 0\n**【提示】**本题为曼昆《宏观经济学》第九版第 419 页、第十版第 374 页原文。本题市面上的答案都很混乱、思路不清、很多错误，我们下面给出正确的解答。`},
{id:'h37',special:'宏观·宏观经济政策',qid:'A2 ★★',question:'假设政府要把如下目标函数最小化：W(u,π)=u²+βπ²，其中 u 是实际失业率，π 是实际通货膨胀率。假设这个经济体的失业率和通货膨胀率之间存在如下关系：u=un−α(π−πe)，其中 un 是自然失业率，πe 是居民的预期通货膨胀率。α、β 均大于零。政府和居民的行动时间顺序如下：政府首先宣布一个通货膨胀率作为规则，记为 π0；然后居民形成预期 πe；政府看到 πe 之后再决定实际通货膨胀率 π。（1）政府决定按规则行事，居民也相信政府的承诺。那么请问政府会选怎么样的 π0，居民会选什么样的 πe，实际失业率是多少？（2）现在居民仍然相信政府的承诺，但是政府决定悄悄改变货币政策，实行相机抉择。那么政府会选怎么样的 π0 和 π？比较（1）和（2），说明政府为什么要相机抉择？（3）居民在实践中慢慢学会准确预期政府的实际通货膨胀率了。如果政府仍然贯彻上述相机抉择的货币政策，那么实际通货膨胀又会是多少？实际失业率是多少？比较（3）和（1），请问你会建议政府采用何种政策？（上财 2012 年考题）',answer:`**考察知识点**：政策规则、相机抉择、理性预期、动态不一致。\n**思路**：分别求固定规则、居民相信下相机抉择、理性预期下相机抉择的均衡。\n**答案**：（1）π0=πe=0，u=un。（2）π0=−un/α，π=0；相机抉择下政府损失更小。（3）π=αun/β，u=un；建议采用固定规则政策。\n##**详解**\n（1）固定规则下，中央银行宣布将实行一确定的通货膨胀率，设 π₀ 为预先宣布的通货膨胀率，经济主体又都确信中央银行的政策，则 π^e = π = π₀。代入菲利普斯曲线 u = u^n − α(π − π^e)，解得 u = u^n，此时的失业率为自然失业率。\n由此可见，无论中央银行宣布的通货膨胀率 π₀ 是多少，失业率都为自然失业率，所以任何通货膨胀只会增加央行的损失，央行宣布零通货膨胀率是最优的，即 π = π^e = π₀ = 0。此时政府的目标函数值为 W₁ = (u^n)²。\n（2）若居民仍然相信政府的承诺，则有 π^e = π₀。失业率与通货膨胀之间的关系为 u = u^n − α(π − π₀)，将其代入政府的目标函数，得：\n$$W = [u^n − α(π − π₀)]² + βπ²\n由目标函数最小化的两个一阶条件可得：\n$$∂W/∂π = −2α[u^n − α(π − π₀)] + 2βπ = 0\n$$∂W/∂π₀ = 2α[u^n − α(π − π₀)] = 0\n解得：π₀ = −u^n/α，π = 0。此时 u = 0，政府的目标函数值为 W₂ = 0。\n在（1）中的情形下 W₁ = (u^n)²，在（2）中的情形下 W₂ = 0。可知若在相机抉择下，政府的目标函数值更小，因此政府会选择相机抉择。\n（3）将菲利普斯曲线方程 u = u^n − α(π − π^e) 代入政府目标函数，得：\n$$W = [u^n − α(π − π^e)]² + βπ²\n由目标函数最小化的一阶条件可得：\n$$dW/dπ = −2α[u^n − α(π − π^e)] + 2βπ = 0\n解得：\n$$π = (α²π^e + αu^n)/(α² + β)\n具有理性预期的居民最终预期的通货膨胀率等于实际通货膨胀率 π = π^e，代入上式可得 π = (α/β)u^n。由于 π = π^e，由菲利普斯曲线知 u = u^n，失业率为自然失业率。\n此时政府的目标函数值为：\n$$W₃ = (u^n)² + β[(α/β)u^n]² = (1 + α²/β)(u^n)²\n比较三种情形：W₂ = 0 < W₁ = (u^n)² < W₃ = (1 + α²/β)(u^n)²。可知在理性预期与相机抉择并存时，损失最大，此时政府应该选择固定规则政策。\n**【校注】**原文此处写作"此时 W₁ < W₂"，与前面算得的 W₂ = 0、W₁ = (u^n)² 矛盾（应为 W₂ < W₁ < W₃），此处已按计算结果更正。\n**【提示】**本题已经基本覆盖了此类题目的设问方式，主要包括：\n（1）公众理性预期 + 政府固定规则：解题思路见本题第（1）问，此时 π = π^e = π₀，求出 u 或 y，再根据损失函数求出 π；\n（2）公众相信政府 + 政府相机抉择：解题思路见本题第（2）问，此时政府可以控制的变量是 π 和 π^e（因为公众相信政府），将菲利普斯曲线或通胀和产出之间的关系式代入损失函数，并分别对 π 和 π^e（或 π₀）求一阶导；\n（3）公众理性预期 + 政府相机抉择：解题思路见本题第（3）问，将菲利普斯曲线或通胀和产出之间的关系式代入损失函数，并对 π 求一阶导，求出 π 的表达式后再代入 π = π^e。`},
{id:'h38',special:'宏观·微观基础',qid:'A1 ★★',question:'生命周期假说。假设小张0岁开始工作，20岁退休，40岁离世。工作时年收入为常数10000元，初始财富 W0=0，利率也假设为常数0。（1）计算0岁时小张的财富边际消费倾向和收入边际消费倾向；（2）计算10岁时小张的财富边际消费倾向和收入边际消费倾向，其消费 C10 和财富 W10 各是多少？（3）20岁时，小张的平均消费倾向是否与10岁的平均消费倾向不同？它能解释库兹涅茨的消费之谜吗？（南开大学 2017 年考题）',answer:`**考察知识点**：生命周期假说、消费函数、平均消费倾向。\n**思路**：生命周期消费 C=(W+RY)/T；财富边际消费倾向 1/T，收入边际消费倾向 R/T。\n**答案**：（1）财富边际消费倾向1/40；收入边际消费倾向0.5。（2）财富边际消费倾向1/30；收入边际消费倾向1/3；C10=5000，W10=50000。（3）20岁平均消费倾向1/2，与10岁相同；能解释消费之谜。\n##**详解**\n（1）按生命周期消费理论假定，人们总希望自己一生能比较平稳安定地生活，从而他们会计划在整个生命周期内均匀地消费。\n设 T 为从当前到去世时的生活年份，R 为从当前到退休时的工作年份，Y 为工作时年收入，此时小张每一期的消费满足：\n$$C = (W + RY)/T = (1/T)W + (R/T)Y\n令 α = 1/T，β = R/T，其中 α 为财富的边际消费倾向，β 为劳动收入的边际消费倾向。则0岁时小张的财富边际消费倾向为 α = 1/T = 1/40，劳动收入的边际消费倾向为 β = 20/40 = 0.5。\n（2）10岁时，T 为从10岁到去世时的生活年份，R 为从10岁到退休时的工作年份，同样有 C = (1/T)W + (R/T)Y。\n则10岁时小张的财富边际消费倾向为 α = 1/T = 1/(40 − 10) = 1/30，劳动收入的边际消费倾向为 β = (20 − 10)/(40 − 10) = 1/3。\n此人的终生收入为 10000×20 = 200000，平均每年消费为 C = 200000/40 = 5000。\n则10岁时拥有的财富为 W₁₀ = 10×(10000 − 5000) = 50000，C₁₀ = 5000。\n（3）根据生命周期消费函数，平均消费倾向为：\n$$C/Y = α·(W/Y) + β\n10岁时的平均消费倾向 = (1/30)×(50000/10000) + 1/3 = 1/2。\n20岁时的财富边际消费倾向 α = 1/(40 − 20) = 1/20，劳动收入的边际消费倾向 β = 0/(40 − 20) = 0；20岁时拥有的财富 W₂₀ = 20×(10000 − 5000) = 100000，故20岁时的平均消费倾向 = (1/20)×(100000/10000) + 0 = 1/2。\n可以看出，在生命周期假说下，小张的平均消费倾向是稳定的，解释了凯恩斯消费函数与实际不符的情况，即解释了消费函数之谜。\n**【提示】**本题为曼昆《宏观经济学》第九版第 374 页、第十版第 417 页内容。`},
{id:'h39',special:'宏观·稳态及黄金律',qid:'A1 ★★★',question:'一国宏观生产函数为 Y=(AN)^0.5 K^0.5，且 A=1，Y、A、N、K 分别为产出、技术、劳动数量、资本存量；储蓄率、人口增长率、折旧率分别为60%、4%、6%。（1）请计算经济实现稳态增长时的人均产出、人均资本和人均消费分别是多少？（2）请计算人均资本的黄金律水平是多少？其对应的人均产出、人均消费和储蓄率分别是多少？（3）当宏观生产函数变为 Y=N^0.6(AK)^0.4，且 A 按3%增长时，请计算人均产出和总产出的增长率分别是多少？（4）若原宏观生产函数中的 A=9K/N，则人均产出增长率是多少？（对外经贸 2023 年考题）',answer:`**考察知识点**：索洛模型、稳态、黄金律、技术进步。\n**思路**：稳态条件 sy=(δ+n)k；黄金律 f′(k)=δ+n；增长率分解。\n**答案**：（1）k*=36，y*=6，c*=2.4。（2）kgold=25，ygold=5，cgold=2.5，sgold=50%。（3）总产出增长率6%，人均产出增长率2%。（4）人均产出增长率170%。\n##**详解**\n（1）由于 A = 1，所以生产函数 Y = K^0.5 N^0.5。令人均资本 k = K/N，则人均产出 y = Y/N = k^0.5。\n此时不存在技术进步，因此稳态条件为：\n$$Δk = sy − (δ + n)k = 0\n代入 s = 60%，δ = 6%，n = 4%，y = k^0.5 可得：\n$$0.6k^0.5 = (0.06 + 0.04)k\n解得稳态时人均资本 k* = 36，人均产出 y* = 6，人均消费 c* = (1 − s)y* = 2.4。\n（2）稳态时人均消费 c = y − sy = y − (δ + n)k = k^0.5 − 0.1k。人均消费最大化的一阶条件为：\n$$dc/dk = 0.5k^(−0.5) − 0.1 = 0\n解得黄金律水平的人均资本 k_gold = 25，对应的人均产出 y_gold = 5。\n将 k_gold = 25 代入稳态条件 sk^0.5 = 0.1k，解得黄金律稳态的储蓄率 s_gold = 50%，所以此时人均消费 c_gold = (1 − s_gold)y_gold = 2.5。\n（3）**【法一】**利用经济增长核算方程。\n由于资本积累方程 ΔK = sY − δK，所以 ΔK/K = s(Y/K) − δ。要想保证稳态时 ΔK/K 为常数，则需要 Y/K 为常数，所以稳态时 ΔY/Y = ΔK/K。\n对生产函数 Y = N^0.6(AK)^0.4 左右取对数然后全微分可得：\n$$ΔY/Y = 0.6ΔN/N + 0.4ΔA/A + 0.4ΔK/K = 0.6ΔN/N + 0.4ΔA/A + 0.4ΔY/Y\n进一步整理可得总产出增长率：\n$$ΔY/Y = ΔN/N + (2/3)ΔA/A = 4% + (2/3)×3% = 6%\n由增长率的性质可得，人均产出增长率 Δ(Y/N)/(Y/N) = ΔY/Y − ΔN/N = 6% − 4% = 2%。\n**【法二】**利用稳态条件。\n此时定义有效人均资本 k̄ = K/(A^(2/3)N)，所以有效人均产出：\n$$ȳ = Y/(A^(2/3)N) = (A^(2/3)N)^0.6 K^0.4/(A^(2/3)N) = k̄^0.4\n此时稳态条件为 Δk̄ = 0，所以稳态时 Δȳ = 0。由增长率的性质可得稳态时总产出增长率：\n$$ΔY/Y = Δȳ/ȳ + (2/3)·ΔA/A + ΔN/N = 0 + (2/3)×3% + 4% = 6%\n人均产出增长率：\n$$Δ(Y/N)/(Y/N) = Δȳ/ȳ + (2/3)·ΔA/A = 0 + (2/3)×3% = 2%\n（4）若 A = 9K/N，则生产函数变为：\n$$Y = (AN)^0.5 K^0.5 = (9K)^0.5 K^0.5 = 3K\n即 y = 3k，此为AK模型。此时人均产出增长率为：\n$$Δy/y = ΔY/Y − ΔN/N = ΔK/K − n = (sY − δK)/K − n = 3s − (δ + n) = 3×60% − 10% = 170%\n**【提示】**本题第（3）问通过改变产出函数的形式，将课本中无技术进步（A 为常数或 Y = F(K,N)）或劳动增强型技术进步（Y = F(K,AN)，ΔA/A ≠ 0）的索洛模型，变为希克斯中性（Y = AF(K,N)，ΔA/A ≠ 0）或资本增强型技术进步（Y = F(AK,N)，ΔA/A ≠ 0）的索洛模型，进而求稳态或稳态时不同变量的增长率。三种技术进步在宏观拔高专项一将进行专门讲解。本题第（4）问实际上考的是AK模型。`},
